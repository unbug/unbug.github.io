<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <text x="60" y="62" font-size="34" font-weight="bold" fill="#1A1B1E">并行子代理：多花 3 倍钱，多对几个点</text>
  <text x="60" y="96" font-size="20" fill="#555555">arXiv:2611.33893 · UIUC · 每基准 30 题（三档各 10）· 增益 1–5 pp / 成本 2.6–3.8×</text>

  <!-- Panel 1: random tasks vs hard task -->
  <text x="60" y="150" font-size="24" font-weight="bold" fill="#1A1B1E">随机抽题只涨 1–5 个点，难任务才明显</text>
  <line x1="60" y1="482" x2="560" y2="482" stroke="#D9D9D9" stroke-width="2"/>
  <!-- scale: 560 px = 100% hidden tests passed -->
  <rect x="105" y="287" width="263" height="195" fill="#555555"/>
  <text x="236" y="273" font-size="24" font-weight="bold" fill="#555555" text-anchor="middle">47%</text>
  <text x="236" y="510" font-size="18" fill="#555555" text-anchor="middle">atlas：单 agent</text>
  <rect x="345" y="197" width="175" height="285" fill="#D55E00"/>
  <text x="432" y="183" font-size="24" font-weight="bold" fill="#D55E00" text-anchor="middle">77%</text>
  <text x="432" y="510" font-size="18" fill="#555555" text-anchor="middle">atlas：加并行子代理</text>
  <text x="60" y="512" font-size="18" fill="#555555">随机抽题上增益只有约 1–5 个百分点，成本 2.6–3.8 倍。</text>
  <text x="60" y="540" font-size="18" fill="#555555">30 题里 10 题的增益在两轮重复之间正负换号。</text>

  <!-- Panel 2: extended run cost -->
  <text x="640" y="150" font-size="24" font-weight="bold" fill="#1A1B1E">长跑烧到预算耗尽的牌价账</text>
  <rect x="640" y="184" width="440" height="56" fill="#D55E00"/>
  <text x="1092" y="222" font-size="22" font-weight="bold" fill="#D55E00">约 $500</text>
  <text x="640" y="266" font-size="18" fill="#555555">同一任务跑到 20 小时上限（平均）</text>
  <rect x="640" y="298" width="18" height="56" fill="#555555"/>
  <text x="670" y="336" font-size="22" font-weight="bold" fill="#555555">不足 $20</text>
  <text x="640" y="380" font-size="18" fill="#555555">同一任务跑到自然停止</text>
  <text x="640" y="430" font-size="18" fill="#555555">按 GPT-5.6 Sol 牌价折算，作者自认成本按 token 用量</text>
  <text x="640" y="458" font-size="18" fill="#555555">比较、并非真实价格。</text>
  <text x="640" y="512" font-size="18" fill="#555555">长跑里只有多 agent 组交出编不过的程序：</text>
  <text x="640" y="540" font-size="18" fill="#555555">30 次中 2 次，单 agent 38 次中 0 次。</text>

  <text x="60" y="596" font-size="18" fill="#555555">同成本下单 agent 打平或反超；一句「先探参考程序」以零头成本拿回大部分收益。</text>
</svg>
