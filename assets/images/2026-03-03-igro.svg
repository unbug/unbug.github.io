<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">三个基座模型上加用 iGRPO 后平均得分均提升，Nemotron-H-8B 提升 3.96 个百分点</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">基线与 iGRPO 平均得分对比（%）</text>

  <!-- rows y: 220 / 300 / 380; dashed guides at baseline point positions -->
  <g stroke="#D9D9D9" stroke-width="0.5" stroke-dasharray="4 4">
    <line x1="208" y1="220" x2="208" y2="410"/>
    <line x1="736" y1="220" x2="736" y2="410"/>
    <line x1="904" y1="220" x2="904" y2="410"/>
  </g>

  <!-- Nemotron-H-8B: 41.1 -> 45.0, 提升 3.96% (正文直接给出) -->
  <text x="60" y="150" font-size="12.5" fill="#1A1B1E">Nemotron-H-8B-Base-8K</text>
  <line x1="208" y1="220" x2="285" y2="220" stroke="#999999" stroke-width="1.5"/>
  <circle cx="208" cy="220" r="6" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/>
  <circle cx="285" cy="220" r="6" fill="#D55E00"/>
  <text x="196" y="224" font-size="12" fill="#555" text-anchor="end">41.1</text>
  <text x="297" y="224" font-size="12" fill="#555">45.0</text>
  <text x="430" y="224" font-size="12" fill="#1A1B1E">提升 3.96%（正文直接给出）</text>

  <!-- DeepSeek-R1-Distill-Qwen-7B: 68.3 -> 69.9 -->
  <text x="60" y="240" font-size="12.5" fill="#1A1B1E">DeepSeek-R1-Distill-Qwen-7B</text>
  <line x1="736" y1="300" x2="769" y2="300" stroke="#999999" stroke-width="1.5"/>
  <circle cx="736" cy="300" r="6" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/>
  <circle cx="769" cy="300" r="6" fill="#D55E00"/>
  <text x="724" y="304" font-size="12" fill="#555" text-anchor="end">68.3</text>
  <text x="781" y="304" font-size="12" fill="#555">69.9</text>
  <text x="855" y="304" font-size="12" fill="#1A1B1E">提升幅度为两值差（图中自算）</text>

  <!-- OpenMath-Nemotron-14B: 76.7 -> 78.0 -->
  <text x="60" y="330" font-size="12.5" fill="#1A1B1E">OpenMath-Nemotron-14B</text>
  <line x1="904" y1="380" x2="931" y2="380" stroke="#999999" stroke-width="1.5"/>
  <circle cx="904" cy="380" r="6" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/>
  <circle cx="931" cy="380" r="6" fill="#D55E00"/>
  <text x="892" y="384" font-size="12" fill="#555" text-anchor="end">76.7</text>
  <text x="943" y="384" font-size="12" fill="#555">78.0</text>
  <text x="1017" y="384" font-size="12" fill="#1A1B1E">差值见图（自算）</text>

  <!-- baseline axis (dot marks at baseline values, no numeric scale) -->
  <line x1="120" y1="410" x2="1100" y2="410" stroke="#1A1B1E" stroke-width="0.75"/>
  <g fill="#999999">
    <circle cx="208" cy="410" r="3"/>
    <circle cx="736" cy="410" r="3"/>
    <circle cx="904" cy="410" r="3"/>
  </g>
  <text x="120" y="436" font-size="12" fill="#555">位置轴按各模型基线得分对齐，具体数值见各点旁标签，不设连续数值刻度</text>

  <!-- panel a key -->
  <circle cx="130" cy="130" r="5" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/>
  <text x="142" y="134" font-size="12" fill="#555">基线</text>
  <circle cx="200" cy="130" r="5" fill="#D55E00"/>
  <text x="212" y="134" font-size="12" fill="#555">加 iGRPO</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="476" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="476" font-size="15" fill="#1A1B1E">AceReason-Math 数据集上 OpenReasoning-Nemotron-7B 加 iGRPO 的 AIME 得分</text>

  <text x="60" y="520" font-size="12.5" fill="#1A1B1E">AIME24</text>
  <rect x="160" y="506" width="660" height="18" fill="#D55E00"/>
  <text x="830" y="520" font-size="12" fill="#555">85.62%</text>

  <text x="60" y="556" font-size="12.5" fill="#1A1B1E">AIME25</text>
  <rect x="160" y="542" width="614" height="18" fill="#D55E00" opacity="0.4"/>
  <text x="784" y="556" font-size="12" fill="#555">79.64%</text>

  <text x="160" y="584" font-size="12" fill="#555">条长按正文报告得分等比绘制，为论文报告值</text>

  <!-- footnote -->
  <text x="60" y="614" font-size="11" fill="#767676">数据：arXiv:2602.09000 · 面板 a 为三组对照实验的平均得分，提升幅度除 3.96% 为正文值外均为空心点与实心点两值之差（图中自算口径）</text>
  <text x="60" y="632" font-size="11" fill="#767676">面板 b 为 AceReason-Math 数据集得分 · 论文自测口径 · 预印本未经同行评审</text>
</svg>
