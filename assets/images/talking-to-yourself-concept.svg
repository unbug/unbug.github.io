<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">微调前让模型自言自语生成数据并按 1:1 混合，50 个评估场景全部缓解遗忘、40 个最佳</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">GSM8K 准确率：各微调路线对比（LLaMA3-8B-Instruct，%）</text>

  <!-- horizontal bars: proportional length, value labels; no tick axis (正文无轴刻度数值) -->
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="288" y="158">原始模型（未微调）</text>
    <text x="288" y="202">仅任务微调</text>
    <text x="288" y="246">冻结底层</text>
    <text x="288" y="290">混合 Alpaca</text>
    <text x="288" y="334">混合 UltraChat</text>
    <text x="288" y="378">自对话混合法</text>
  </g>
  <rect x="300" y="144" width="394.16" height="20" fill="#999999"/>
  <text x="702" y="158" font-size="12" fill="#555">75.8</text>
  <rect x="300" y="188" width="341.12" height="20" fill="#999999"/>
  <text x="649" y="202" font-size="12" fill="#555">65.6</text>
  <rect x="300" y="232" width="213.72" height="20" fill="#999999"/>
  <text x="522" y="246" font-size="12" fill="#555">41.1</text>
  <rect x="300" y="276" width="303.68" height="20" fill="#999999"/>
  <text x="612" y="290" font-size="12" fill="#555">58.4</text>
  <rect x="300" y="320" width="350.48" height="20" fill="#999999"/>
  <text x="659" y="334" font-size="12" fill="#555">67.4</text>
  <rect x="300" y="364" width="385.84" height="20" fill="#D55E00"/>
  <text x="694" y="378" font-size="12" fill="#555">74.2（跌幅 1.6）</text>

  <!-- baseline -->
  <line x1="300" y1="400" x2="780" y2="400" stroke="#1A1B1E" stroke-width="0.75"/>
  <text x="300" y="426" font-size="12" fill="#767676">柱长按准确率等比绘制，起点为全零，单位 %</text>
  <text x="300" y="474" font-size="12" fill="#555">自对话混合法领域内得分 50.8，为各方法最佳</text>

  <!-- ============ panel b ============ -->
  <text x="860" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="882" y="104" font-size="15" fill="#1A1B1E">方法两步（顺序流程）</text>
  <g font-size="13" fill="#1A1B1E">
    <text x="882" y="150">第一步：自我对话</text>
    <text x="882" y="190">第二步：混合微调（1:1）</text>
  </g>
  <g font-size="12" fill="#555">
    <text x="882" y="212">冻结基础模型自问自答，</text>
    <text x="882" y="230">得到自生成数据集</text>
    <text x="882" y="256">自生成数据 + 任务数据</text>
    <text x="882" y="274">合并后正常微调</text>
  </g>
  <text x="860" y="318" font-size="12.5" fill="#1A1B1E">评估规模</text>
  <g font-size="12" fill="#555">
    <text x="860" y="342">5 模型 × 5 任务</text>
    <text x="860" y="362">50 个评估场景</text>
    <text x="860" y="382">40 个场景取得最佳</text>
  </g>
  <text x="860" y="422" font-size="12.5" fill="#1A1B1E">风格对齐证据</text>
  <text x="860" y="446" font-size="12" fill="#555">删除自生成数据中数学、逻辑、</text>
  <text x="860" y="464" font-size="12" fill="#555">编程内容，仅留闲聊数据，</text>
  <text x="860" y="482" font-size="12" fill="#555">仍能阻止 GSM8K 大部分下降</text>

  <!-- footnote -->
  <text x="60" y="560" font-size="11" fill="#767676">数据：arXiv:2602.20162（浙江大学、斯坦福大学、ETH Zürich，论文自测口径）· a 面板为 GSM8K 单基准单模型结果 · 预印本未经同行评审</text>
</svg>
