<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="400" fill="#555555" rx="20"/>

  <text x="400" y="60" font-family="'Comic Sans MS', cursive, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#009E73">
    🗣️ 让模型"自言自语"
  </text>
  <text x="400" y="90" font-family="'Comic Sans MS', cursive, sans-serif" font-size="18" text-anchor="middle" fill="#009E73">
    告别灾难性遗忘！
  </text>

  <g transform="translate(150, 140)">
    <circle cx="80" cy="80" r="60" fill="#555555" filter="url(#shadow)"/>
    <circle cx="80" cy="80" r="45" fill="#56B4E9"/>
    <text x="80" y="68" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#0072B2">🧠</text>
    <text x="80" y="92" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0072B2">
      LLM
    </text>
    <text x="80" y="170" font-family="'Comic Sans MS', cursive, sans-serif" font-size="14" text-anchor="middle" fill="#009E73">
      基础模型
    </text>
  </g>

  <g transform="translate(330, 130)">
    <rect x="0" y="0" width="140" height="100" rx="10" fill="#F0F0F0" stroke="#CC79A7" stroke-width="2" filter="url(#shadow)"/>
    <text x="70" y="45" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">💬</text>
    <text x="70" y="75" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" text-anchor="middle" fill="#009E73">
      自我对话
    </text>
    <text x="70" y="130" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" text-anchor="middle" fill="#CC79A7">
      𝒟self
    </text>
  </g>

  <g transform="translate(550, 140)">
    <circle cx="80" cy="80" r="60" fill="#555555" filter="url(#shadow)"/>
    <circle cx="80" cy="80" r="45" fill="#F0E442"/>
    <text x="80" y="68" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#D55E00">✅</text>
    <text x="80" y="92" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#D55E00">
      微调后
    </text>
    <text x="80" y="170" font-family="'Comic Sans MS', cursive, sans-serif" font-size="14" text-anchor="middle" fill="#009E73">
      既学新技能
    </text>
    <text x="80" y="190" font-family="'Comic Sans MS', cursive, sans-serif" font-size="14" text-anchor="middle" fill="#009E73">
      又不忘旧知识
    </text>
  </g>

  <g transform="translate(220, 180)">
    <path d="M 0 20 L 80 20 L 70 10 M 80 20 L 70 30" stroke="url(#arrowGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <g transform="translate(460, 180)">
    <path d="M 0 20 L 80 20 L 70 10 M 80 20 L 70 30" stroke="url(#arrowGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <g transform="translate(400, 280)">
    <rect x="-180" y="0" width="360" height="80" rx="15" fill="#F0F0F0" stroke="#CC79A7" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="35" font-family="'Comic Sans MS', cursive, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#009E73">
      Sa-sft = 自我增强微调
    </text>
    <text x="0" y="60" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" text-anchor="middle" fill="#CC79A7">
      𝒟mix = 𝒟task ∪ 𝒟self
    </text>
  </g>

  <g transform="translate(50, 350)">
    <text x="0" y="0" font-family="'Comic Sans MS', cursive, sans-serif" font-size="14" fill="#009E73">
      📊 50个测试场景，40个最佳结果！
    </text>
  </g>

  <g transform="translate(550, 350)">
    <text x="0" y="0" font-family="'Comic Sans MS', cursive, sans-serif" font-size="14" fill="#009E73">
      🎯 准确率仅下降1.6%（普通微调下降10.2%）
    </text>
  </g>

</svg>
