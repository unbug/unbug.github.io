<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="70" font-size="16" fill="#1A1B1E">论文归纳九种认识论角色与三大可信属性，信任评估重心从输出准确性转向过程质量</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="118" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="118" font-size="15" fill="#1A1B1E">AI 在知识生态中的九种角色（论文首次归纳，分类计数）</text>
  <g fill="#0072B2">
    <rect x="60" y="146" width="20" height="20"/>
    <rect x="185" y="146" width="20" height="20"/>
    <rect x="310" y="146" width="20" height="20"/>
    <rect x="60" y="196" width="20" height="20"/>
    <rect x="185" y="196" width="20" height="20"/>
    <rect x="310" y="196" width="20" height="20"/>
    <rect x="60" y="246" width="20" height="20"/>
    <rect x="185" y="246" width="20" height="20"/>
    <rect x="310" y="246" width="20" height="20"/>
  </g>
  <g font-size="13" fill="#1A1B1E">
    <text x="90" y="161">自主设计实验的科学家</text>
    <text x="215" y="161">实时合成报道的记者</text>
    <text x="340" y="161">个性化路径的教育者</text>
    <text x="90" y="211">决定留存的档案管理员</text>
    <text x="215" y="211">生成叙事的文化创作者</text>
    <text x="340" y="211">提供建议的伴侣</text>
    <text x="90" y="261">影响公众态度的影响者</text>
    <text x="215" y="261">重构历史的历史学家</text>
    <text x="340" y="261">提供真理标准的认识论学家</text>
  </g>
  <text x="60" y="300" font-size="12" fill="#555">放大影响的三个维度：人类同行评审过时 · 大规模说服性操纵成为可能 · 创新周期加速超出社会适应能力</text>

  <line x1="60" y1="330" x2="1140" y2="330" stroke="#D9D9D9" stroke-width="0.5"/>

  <!-- ============ panel b ============ -->
  <text x="60" y="372" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="372" font-size="15" fill="#1A1B1E">可信知识代理人的三大属性（论文提出的规范框架，非量化统计）</text>
  <g fill="#D55E00">
    <rect x="60" y="400" width="20" height="20"/>
    <rect x="420" y="400" width="20" height="20"/>
    <rect x="780" y="400" width="20" height="20"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#1A1B1E">
    <text x="90" y="415">可证明的认识论能力</text>
    <text x="450" y="415">可证伪性</text>
    <text x="810" y="415">认识论美德行为</text>
  </g>
  <g font-size="12" fill="#555">
    <text x="60" y="444">领域能力阈值超越现有基准，实时评估</text>
    <text x="60" y="464">知识更新，验证整条认识论供应链，</text>
    <text x="60" y="484">检测恶意代理人</text>
    <text x="420" y="444">清晰表达推理过程，给出证据权重与</text>
    <text x="420" y="464">结论成立条件，像论文方法部分一样</text>
    <text x="420" y="484">供人类审计</text>
    <text x="780" y="444">诚实表征不确定性，主动寻求反面证据</text>
    <text x="780" y="464">修正错误，承认知识边界并区分</text>
    <text x="780" y="484">已知未知与未知未知</text>
  </g>

  <!-- footnote -->
  <text x="60" y="618" font-size="11" fill="#767676">来源：arXiv:2603.02960（Google DeepMind，概念框架论文，无数值型实测结果）</text>
  <text x="60" y="636" font-size="11" fill="#767676">角色、维度、属性计数均为论文自述分类口径 · 预印本未经同行评审</text>
</svg>
