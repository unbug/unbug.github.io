<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="620" fill="#fbfbfd"/>
  <text x="430" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a2e">RAFT：历史工单按阶段检索，而非整篇比对</text>
  <text x="430" y="62" text-anchor="middle" font-size="13" fill="#666">arXiv:2609.20754 · Microsoft Redmond · EMNLP 2026 Industry Track 接收（2026-09-17 提交）</text>

  <!-- 对比 -->
  <rect x="40" y="88" width="380" height="150" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="230" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">传统 RAG：整篇文档</text>
  <text x="230" y="144" text-anchor="middle" font-size="12" fill="#444">工单当静态文档切片入库</text>
  <text x="230" y="166" text-anchor="middle" font-size="12" fill="#444">返回文字最像的整篇记录</text>
  <text x="230" y="196" text-anchor="middle" font-size="12.5" fill="#b91c1c">匹配到的是「结局像」</text>
  <text x="230" y="218" text-anchor="middle" font-size="12.5" fill="#b91c1c">不是「处境像」</text>

  <rect x="440" y="88" width="380" height="150" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="630" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">RAFT：时间线条目链</text>
  <text x="630" y="144" text-anchor="middle" font-size="12" fill="#444">已关闭案例 → 有向 timeline entry 链</text>
  <text x="630" y="166" text-anchor="middle" font-size="12" fill="#444">条目级匹配中间状态</text>
  <text x="630" y="196" text-anchor="middle" font-size="12.5" fill="#3730a3">返回锚定在匹配状态的父案例轨迹</text>
  <text x="630" y="218" text-anchor="middle" font-size="12.5" fill="#444">可选案例级图（可配置相似度）</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="422" y1="163" x2="436" y2="163" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 结果 -->
  <rect x="40" y="268" width="780" height="140" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="60" y="296" font-size="14.5" font-weight="700" fill="#92400e">初始症状阶段（0% progress）Case Hit</text>
  <rect x="60" y="312" width="560" height="34" rx="5" fill="#dcfce7"/>
  <rect x="60" y="312" width="470" height="34" fill="#4ade80" opacity="0.55"/>
  <text x="70" y="334" font-size="12.5" font-weight="700" fill="#14532d">RAFT 84.2%</text>
  <rect x="60" y="352" width="560" height="34" rx="5" fill="#e2e8f0"/>
  <rect x="60" y="352" width="376" height="34" fill="#94a3b8" opacity="0.5"/>
  <text x="70" y="374" font-size="12.5" fill="#334155">传统 RAG 67.3% · HippoRAG2 65.0%</text>
  <text x="640" y="330" font-size="11.5" fill="#a16207">每个推进阶段均优于基线；对最强基线的提升</text>
  <text x="640" y="350" font-size="11.5" fill="#a16207">经按根因分组聚类的自助重采样检验显著</text>
  <text x="640" y="374" font-size="11.5" fill="#b45309">Jira 部分原文自限：directional evidence</text>

  <!-- 边界 -->
  <rect x="40" y="430" width="540" height="136" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="458" font-size="14" font-weight="700" fill="#334155">五条折扣前提</text>
  <text x="60" y="482" font-size="12" fill="#444">1. 合成基准出自 Microsoft Learn 自家文档，污染风险未排除</text>
  <text x="60" y="502" font-size="12" fill="#444">2. Jira 仅方向性证据，非「真实场景验证通过」</text>
  <text x="60" y="522" font-size="12" fill="#444">3. Case Hit 是检索指标，非端到端解决率</text>
  <text x="60" y="542" font-size="12" fill="#444">4. 线性条目链对并行分支/回退流程未展开 · 5. 单一厂商无第三方复现</text>

  <!-- 适用 -->
  <rect x="600" y="430" width="220" height="136" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="710" y="458" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">可迁移的抽象</text>
  <text x="710" y="486" text-anchor="middle" font-size="11.5" fill="#444">客服工单 / 运维 runbook</text>
  <text x="710" y="506" text-anchor="middle" font-size="11.5" fill="#444">审批流 / 任何多阶段流程</text>
  <text x="710" y="534" text-anchor="middle" font-size="11.5" fill="#166534">历史记录都带状态轨迹</text>

  <rect x="40" y="580" width="780" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="430" y="600" text-anchor="middle" font-size="11.5" fill="#64748b">不是通用 RAG 改进，是工单类有状态语料的检索抽象 · 评测直接测检索层，无需生产部署</text>
</svg>
