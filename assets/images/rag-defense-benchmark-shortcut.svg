<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1200" height="640" fill="#0f1420"/>
  <text x="600" y="50" fill="#e8ecf4" font-size="30" font-weight="bold" text-anchor="middle">基准把答案印在考卷上：删一个前缀，防御指标当场塌</text>
  <text x="600" y="80" fill="#8a93a6" font-size="16" text-anchor="middle">arXiv:2610.33849《Ranking Is Not Deciding》Kumar / Sahaym（North Creek High School / Washington State University，2026-10-24，受控共享候选集实验）</text>

  <!-- construction cue panel -->
  <rect x="40" y="105" width="530" height="180" rx="10" fill="#161d2c" stroke="#e06c5a"/>
  <text x="305" y="137" fill="#e06c5a" font-size="18" font-weight="bold" text-anchor="middle">毒文构造捷径（PoisonedRAG 官方代码行为）</text>
  <text x="305" y="168" fill="#c6cddc" font-size="15" text-anchor="middle">每条注入文档 = 目标问题 + 句号 + 文本</text>
  <text x="305" y="196" fill="#c6cddc" font-size="15" text-anchor="middle">某复现释放毒文 500 of 500 条含目标问题原文</text>
  <text x="305" y="224" fill="#c6cddc" font-size="15" text-anchor="middle">光数词数都能到 AUROC 0.999（119–162 词 vs 100 词）</text>
  <text x="305" y="256" fill="#8a93a6" font-size="13" text-anchor="middle">该文自述 survey：21 个评估中 8 个踩此构造、5 个换长度线索、12 个不报部署点假阳率</text>

  <!-- two experiments -->
  <rect x="600" y="105" width="560" height="180" rx="10" fill="#161d2c" stroke="#5a9bd4"/>
  <text x="880" y="137" fill="#5a9bd4" font-size="18" font-weight="bold" text-anchor="middle">两个「只动构造、不动内容」的实验</text>
  <text x="880" y="170" fill="#c6cddc" font-size="15" text-anchor="middle">其一 删前缀：RAGuard AUROC 0.953 → 0.758</text>
  <text x="880" y="196" fill="#c6cddc" font-size="15" text-anchor="middle">漏检率 0.191 → 0.763，毒文检索仍保持 0.93</text>
  <text x="880" y="228" fill="#c6cddc" font-size="15" text-anchor="middle">其二 乱序填充补长度：TrustRAG 集合级漏检 0.000 → 0.827</text>
  <text x="880" y="254" fill="#c6cddc" font-size="15" text-anchor="middle">作者打分器 0.000 → 0.986，而 AUROC 停在 0.953</text>

  <!-- collapse bars -->
  <rect x="40" y="310" width="640" height="230" rx="10" fill="#161d2c" stroke="#2c3850"/>
  <text x="360" y="342" fill="#e8ecf4" font-size="18" font-weight="bold" text-anchor="middle">同一个防御、同一批毒文：排名与决策分道扬镳</text>
  <text x="70" y="380" fill="#8a93a6" font-size="14">AUROC（排名区分）</text>
  <rect x="270" y="365" width="340" height="18" fill="#3f9e6a"/>
  <text x="618" y="379" fill="#c6cddc" font-size="14">0.953 不动</text>
  <text x="70" y="415" fill="#8a93a6" font-size="14">部署阈值漏检率（决策）</text>
  <rect x="270" y="400" width="352" height="18" fill="#e06c5a"/>
  <text x="352" y="443" fill="#c6cddc" font-size="14">0.986（对齐 5% 假阳率后仍 0.321）</text>
  <rect x="270" y="400" width="10" height="18" fill="#5a9bd4" opacity="0"/>
  <rect x="270" y="400" width="1" height="18" fill="#ffffff"/>
  <text x="270" y="465" fill="#8a93a6" font-size="14">基线 0.000（构造捷径在场时「零漏检」）</text>
  <text x="70" y="498" fill="#8a93a6" font-size="14">进上下文的毒文占比 0.00 → 0.94；Contriever top-5 含毒 4.79 → 2.40（86 of 100 查询五条全中 → 前缀撑着检索）</text>
  <rect x="270" y="437" width="4" height="0"/>

  <!-- boundary panel -->
  <rect x="710" y="310" width="450" height="230" rx="10" fill="#161d2c" stroke="#d9a441"/>
  <text x="935" y="342" fill="#d9a441" font-size="18" font-weight="bold" text-anchor="middle">边界与主张</text>
  <text x="735" y="375" fill="#c6cddc" font-size="14">· 逐字 we propose no defense：不提防御方案</text>
  <text x="735" y="402" fill="#c6cddc" font-size="14">· 自有打分器被自适应攻击 0.977 过检击穿</text>
  <text x="735" y="429" fill="#c6cddc" font-size="14">· 限四库 x 四攻击族 x 十防御的共享候选集</text>
  <text x="735" y="456" fill="#c6cddc" font-size="14">· 不意味着所有 RAG 防御失效、非真实部署</text>
  <text x="735" y="490" fill="#8a93a6" font-size="13">主张：检测报告必须附毒文构造画像 +</text>
  <text x="750" y="512" fill="#8a93a6" font-size="13">实际部署阈值假阳率，否则不算证据</text>

  <!-- footer -->
  <rect x="40" y="560" width="1120" height="55" rx="10" fill="#1b2334" stroke="#3f9e6a"/>
  <text x="600" y="594" fill="#3f9e6a" font-size="17" font-weight="bold" text-anchor="middle">The ranking survives; the decision does not. —— 只看 AUROC 的报表，分不清排名还活着、决策已经死了</text>
</svg>
