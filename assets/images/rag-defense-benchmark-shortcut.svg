<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">删掉毒文的目标问题前缀后，RAGuard 的 AUROC 从 0.953 跌到 0.758、漏检率从 0.191 涨到 0.763</text>

  <!-- ================= panel a ================= -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">删前缀前后：排名指标稳、决策指标崩（NQ，共享候选集）</text>

  <!-- value axis for dumbbells: x = 320 + 620*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="320" y1="126" x2="320" y2="312"/>
    <line x1="630" y1="126" x2="630" y2="312"/>
    <line x1="940" y1="126" x2="940" y2="312"/>
  </g>

  <!-- row labels -->
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="308" y="160">毒文检索率（NQ）</text>
    <text x="308" y="212">RAGuard AUROC（NQ）</text>
    <text x="308" y="264">RAGuard 漏检率（NQ）</text>
    <text x="308" y="304">TrustRAG 集合级漏检率（医疗）</text>
  </g>

  <!-- dumbbells: hollow = 捷径在场, filled = 删掉之后 -->
  <!-- 毒文检索率 0.93 -> 0.93 -->
  <line x1="896.6" y1="152" x2="896.6" y2="152" stroke="#999999" stroke-width="2"/>
  <circle cx="896.6" cy="152" r="5" fill="#FFFFFF" stroke="#999999" stroke-width="2"/>
  <circle cx="896.6" cy="152" r="5" fill="#999999"/>
  <text x="884" y="156" font-size="12" fill="#555555" text-anchor="end">保持 0.93</text>

  <!-- RAGuard AUROC 0.953 -> 0.758 -->
  <line x1="910.9" y1="204" x2="789.96" y2="204" stroke="#999999" stroke-width="2"/>
  <circle cx="910.9" cy="204" r="5" fill="#FFFFFF" stroke="#999999" stroke-width="2"/>
  <circle cx="789.96" cy="204" r="5" fill="#999999"/>
  <text x="850" y="188" font-size="12" fill="#555555" text-anchor="middle">0.953 → 0.758</text>

  <!-- RAGuard 漏检率 0.191 -> 0.763 -->
  <line x1="438.42" y1="256" x2="793.06" y2="256" stroke="#999999" stroke-width="2"/>
  <circle cx="438.42" cy="256" r="5" fill="#FFFFFF" stroke="#999999" stroke-width="2"/>
  <circle cx="793.06" cy="256" r="5" fill="#D55E00"/>
  <text x="793.06" y="242" font-size="12" fill="#555555" text-anchor="middle">0.191 → 0.763</text>

  <!-- TrustRAG 漏检率 0.000 -> 0.827 -->
  <line x1="320" y1="308" x2="832.74" y2="308" stroke="#999999" stroke-width="2"/>
  <circle cx="320" cy="308" r="5" fill="#FFFFFF" stroke="#999999" stroke-width="2"/>
  <circle cx="832.74" cy="308" r="5" fill="#D55E00"/>
  <text x="320" y="352" font-size="12" fill="#555555">医疗毒文乱序词填充至干净文档长度，内容信息清零</text>
  <text x="832.74" y="294" font-size="12" fill="#555555" text-anchor="middle">0.000 → 0.827</text>

  <!-- dumbbell legend -->
  <g font-size="12" fill="#555555">
    <circle cx="326" cy="136" r="5" fill="#FFFFFF" stroke="#999999" stroke-width="2"/>
    <text x="338" y="140">捷径在场（原基准构造）</text>
    <circle cx="520" cy="136" r="5" fill="#999999"/>
    <text x="512" y="140">删掉之后（橙 = 漏检上升，灰 = 其余变化）</text>
  </g>

  <!-- value axis -->
  <line x1="320" y1="380" x2="940" y2="380" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="320" y1="380" x2="320" y2="384"/>
    <line x1="475" y1="380" x2="475" y2="384"/>
    <line x1="630" y1="380" x2="630" y2="384"/>
    <line x1="785" y1="380" x2="785" y2="384"/>
    <line x1="940" y1="380" x2="940" y2="384"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="320" y="400">0</text>
    <text x="475" y="400">0.25</text>
    <text x="630" y="400">0.5</text>
    <text x="785" y="400">0.75</text>
    <text x="940" y="400">1</text>
  </g>
  <text x="630" y="422" font-size="14" fill="#1A1B1E" text-anchor="middle">指标值（AUROC 与漏检率，无量纲）</text>

  <!-- ================= panel b ================= -->
  <text x="60" y="478" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="478" font-size="15" fill="#1A1B1E">论文自述 survey（作者自建表 II 口径，非第三方独立审计）：21 个已发表防御评估的构造与报告问题（个）</text>

  <!-- bars: x = 300 + 40*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="420" y1="492" x2="420" y2="604"/>
    <line x1="540" y1="492" x2="540" y2="604"/>
    <line x1="660" y1="492" x2="660" y2="604"/>
    <line x1="780" y1="492" x2="780" y2="604"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="288" y="512">可验证在用含问题毒文构造</text>
    <text x="288" y="552">换用长度或重复线索</text>
    <text x="288" y="592">不报告部署阈值下的假阳率</text>
  </g>
  <rect x="300" y="500" width="320" height="18" fill="#D55E00"/>
  <text x="630" y="513" font-size="12" fill="#555555">8 · 例：释放毒文 500 of 500 条含目标问题原文</text>
  <rect x="300" y="540" width="200" height="18" fill="#0072B2"/>
  <text x="510" y="553" font-size="12" fill="#555555">5 · 例：片段重复 2–10 次，或毒文 119–162 词对干净文档固定 100 词，数词数即可 AUROC 0.999</text>
  <rect x="300" y="580" width="480" height="18" fill="#0072B2"/>
  <text x="790" y="593" font-size="12" fill="#555555">12</text>

  <!-- value axis -->
  <line x1="300" y1="612" x2="780" y2="612" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="612" x2="300" y2="616"/>
    <line x1="420" y1="612" x2="420" y2="616"/>
    <line x1="540" y1="612" x2="540" y2="616"/>
    <line x1="660" y1="612" x2="660" y2="616"/>
    <line x1="780" y1="612" x2="780" y2="616"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="632">0</text>
    <text x="420" y="632">3</text>
    <text x="540" y="632">6</text>
    <text x="660" y="632">9</text>
    <text x="780" y="632">12</text>
  </g>
  <text x="540" y="652" font-size="14" fill="#1A1B1E" text-anchor="middle">评估数量（个，共 21 个评估）</text>

  <!-- footnote -->
  <text x="700" y="176" font-size="12" fill="#555555">前缀本身还撑着检索——Contriever top-5</text>
  <text x="700" y="194" font-size="12" fill="#555555">中含毒文档：有前缀时平均 4.79 条</text>
  <text x="700" y="212" font-size="12" fill="#555555">（86 of 100 个查询五条全中），</text>
  <text x="700" y="230" font-size="12" fill="#555555">删掉后只剩 2.40 条</text>
  
  <text x="700" y="280" font-size="12" fill="#555555">论文自测口径：学习打分器漏检</text>
  <text x="700" y="298" font-size="12" fill="#555555">0.000 升至 0.986，对齐 5% 假阳</text>
  <text x="700" y="316" font-size="12" fill="#555555">率后仍有 0.321；AUROC 停在</text>
  <text x="700" y="334" font-size="12" fill="#555555">0.953 不动</text>

  <text x="60" y="648" font-size="11" fill="#767676">数据：arXiv:2610.33849（2026-10-24 提交，4 语料库 × 4 攻击族 × 10 逐文档防御的共享候选集受控实验）· panel a 为 NQ 删前缀与医疗长度填充两个控制实验 · 论文自测口径，预印本未经同行评审</text>
</svg>
