<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="76" font-size="16" fill="#1A1B1E">Meta-Team 通过个体、团队、组织三层协作自进化，在 6 个长程智能体基准上一致优于单智能体与手工设计系统</text>

  <!-- ============ panel a: mechanism schematic ============ -->
  <text x="60" y="130" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="130" font-size="15" fill="#1A1B1E">三层自进化机制（序列位置示意，自下而上的改进方向）</text>

  <!-- level 1: individual -->
  <rect x="110" y="384" width="270" height="84" rx="4" fill="#FFFFFF" stroke="#999999" stroke-width="1.5"/>
  <text x="245" y="418" font-size="14" fill="#1A1B1E" text-anchor="middle">个体行为层</text>
  <text x="245" y="442" font-size="12" fill="#555" text-anchor="middle">保留决策、观察与行动的分布式证据</text>

  <!-- arrow 1 -->
  <line x1="245" y1="380" x2="245" y2="316" stroke="#555555" stroke-width="1.5"/>
  <polygon points="245,308 239,320 251,320" fill="#555555"/>
  <text x="261" y="350" font-size="12" fill="#555">交换执行证据</text>

  <!-- level 2: team -->
  <rect x="110" y="220" width="270" height="84" rx="4" fill="#FFFFFF" stroke="#999999" stroke-width="1.5"/>
  <text x="245" y="254" font-size="14" fill="#1A1B1E" text-anchor="middle">团队交互层</text>
  <text x="245" y="278" font-size="12" fill="#555" text-anchor="middle">共享经验，识别视角盲区与协作瓶颈</text>

  <!-- arrow 2 -->
  <line x1="245" y1="216" x2="245" y2="152" stroke="#555555" stroke-width="1.5"/>
  <polygon points="245,144 239,156 251,156" fill="#555555"/>
  <text x="261" y="186" font-size="12" fill="#555">汇总进化依据</text>

  <!-- level 3: organization (protagonist) -->
  <rect x="110" y="56" width="270" height="84" rx="4" fill="#D55E00"/>
  <text x="245" y="90" font-size="14" fill="#FFFFFF" text-anchor="middle">组织进化层</text>
  <text x="245" y="114" font-size="12" fill="#FFFFFF" text-anchor="middle">优化角色分配、通信模式与协作策略</text>

  <!-- feedback loop (dashed) from org level back to task execution -->
  <path d="M 380 98 L 442 98 L 442 426 L 392 426" fill="none" stroke="#D55E00" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="384,426 396,420 396,432" fill="#D55E00"/>
  <text x="452" y="266" font-size="12" fill="#555">改进作用于下一轮</text>
  <text x="452" y="284" font-size="12" fill="#555">任务执行</text>

  <text x="110" y="512" font-size="12" fill="#555">机制示意：正文为定性描述，未给出各层量化指标；</text>
  <text x="110" y="532" font-size="12" fill="#555">改进方向为自下而上，进化依据均来自真实执行证据。</text>

  <!-- ============ panel b: evaluation scope ============ -->
  <text x="640" y="130" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="662" y="130" font-size="15" fill="#1A1B1E">评估覆盖范围</text>

  <text x="640" y="180" font-size="14" fill="#1A1B1E">6 个长程智能体基准</text>
  <g font-size="13" fill="#555">
    <circle cx="650" cy="212" r="4" fill="#999999"/>
    <text x="664" y="217">代码生成</text>
    <circle cx="650" cy="244" r="4" fill="#999999"/>
    <text x="664" y="249">科学发现</text>
    <circle cx="650" cy="276" r="4" fill="#999999"/>
    <text x="664" y="281">决策规划</text>
    <circle cx="650" cy="308" r="4" fill="#999999"/>
    <text x="664" y="313">及其他复杂任务类型</text>
  </g>

  <text x="640" y="366" font-size="14" fill="#1A1B1E">三类对比基线</text>
  <g stroke-width="2">
    <line x1="640" y1="396" x2="672" y2="396" stroke="#999999"/>
    <line x1="640" y1="428" x2="672" y2="428" stroke="#999999" stroke-dasharray="5 4"/>
    <line x1="640" y1="460" x2="672" y2="460" stroke="#D55E00" stroke-dasharray="2 3"/>
  </g>
  <g font-size="13" fill="#555">
    <text x="684" y="401">同等规模单智能体系统</text>
    <text x="684" y="433">手工设计多智能体架构</text>
    <text x="684" y="465">先前多智能体进化方法</text>
  </g>

  <text x="640" y="492" font-size="12" fill="#555">论文自述：6 个基准上均一致优于上述三类基线，</text>
  <text x="640" y="512" font-size="12" fill="#555">未报告具体分数。</text>

  <!-- footnote -->
  <text x="60" y="580" font-size="11" fill="#767676">数据：arXiv:2605.29790《Evolve as a Team》（论文自述口径，正文未提供具体分数，故本图不画数值轴）· 面板 a 为机制示意、面板 b 为评估范围，双重声明均为定性口径 · 预印本未经同行评审</text>
</svg>
