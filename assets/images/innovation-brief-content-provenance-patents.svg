<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9C9484; }
      .rl { font-size: 15px; fill: #474C54; }
      .val { font-size: 18px; font-weight: 700; fill: #1A1B1E; }
      .b { font-size: 12px; fill: #A5A296; }
      .chip { font-size: 12.5px; font-weight: 600; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F2EA"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#187C74"/><stop offset="1" stop-color="#57B29F"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C07A18"/><stop offset="1" stop-color="#E4AC4F"/>
    </linearGradient>
    <linearGradient id="gClay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5442E"/><stop offset="1" stop-color="#D9704F"/>
    </linearGradient>
    <linearGradient id="gRose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B04A7A"/><stop offset="1" stop-color="#D98BAE"/>
    </linearGradient>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D5A99"/><stop offset="1" stop-color="#7C93C9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1108" cy="108" r="140" fill="#187C74" opacity="0.06"/>
  <circle cx="70" cy="625" r="115" fill="#B04A7A" opacity="0.05"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gClay)"/>

  <text class="k" x="64" y="84">AI 智创简报 · 内容溯源专利 · EU AI ACT 第 50 条</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">撕掉的标签，验真的印章</text>
  <text x="64" y="158" font-size="15" fill="#5B6068">像药房发药：贴签可以手撕，凭证要写进文件本身才能核验</text>

  <!-- right motif: prescription bottle + authenticity seal -->
  <g>
    <rect x="988" y="232" width="92" height="120" rx="10" fill="url(#gTeal)" opacity="0.28"/>
    <rect x="1000" y="212" width="68" height="26" rx="5" fill="url(#gTeal)" opacity="0.6"/>
    <rect x="996" y="262" width="76" height="48" rx="4" fill="#FBFAF7"/>
    <line x1="1006" y1="278" x2="1062" y2="278" stroke="#A5A296" stroke-width="2.5"/>
    <line x1="1006" y1="292" x2="1046" y2="292" stroke="#A5A296" stroke-width="2.5"/>
    <path d="M 1064 258 q 26 -22 52 0 l -6 26 q 6 16 -12 22 q -8 20 -8 20 q -8 -18 -14 -22 q -16 -8 -12 -22 z" fill="none" stroke="url(#gClay)" stroke-width="3"/>
    <text x="1090" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#B5442E">验</text>
    <text class="b" x="1052" y="384" text-anchor="middle">手撕标签 vs 文件内凭证</text>
  </g>

  <!-- patent timeline: main visual -->
  <g>
    <text class="rl" x="64" y="212">四件代表性专利 · 均为申请公开，不等于授权</text>
    <line x1="120" y1="330" x2="800" y2="330" stroke="#E5E1D4" stroke-width="2"/>
    <circle cx="160" cy="330" r="10" fill="url(#gIndigo)"/>
    <circle cx="410" cy="330" r="10" fill="url(#gTeal)"/>
    <circle cx="530" cy="330" r="10" fill="url(#gAmber)"/>
    <circle cx="730" cy="330" r="11" fill="url(#gClay)"/>

    <text class="val" x="160" y="296" text-anchor="middle" fill="#3D5A99">U.S. Bank</text>
    <text class="b" x="160" y="362" text-anchor="middle">2026-04-09 公开</text>
    <text class="b" x="160" y="380" text-anchor="middle">署名 token 逐段标记</text>

    <text class="val" x="410" y="296" text-anchor="middle" fill="#187C74">SAP</text>
    <text class="b" x="410" y="362" text-anchor="middle">2026-07-02 公开</text>
    <text class="b" x="410" y="380" text-anchor="middle">块级频域水印</text>

    <text class="val" x="530" y="264" text-anchor="middle" fill="#8A5A10">Music IP</text>
    <text class="b" x="530" y="248" text-anchor="middle">多频段水印 · 07-09</text>

    <text class="val" x="730" y="296" text-anchor="middle" fill="#B5442E">Music IP</text>
    <text class="b" x="730" y="362" text-anchor="middle">2026-08-13 公开</text>
    <text class="b" x="730" y="380" text-anchor="middle">溯源数据 + 分发管控</text>
  </g>

  <!-- trend slope + right stats -->
  <g>
    <rect x="64" y="420" width="740" height="66" fill="#187C74" opacity="0.07"/>
    <text class="rl" x="120" y="459">从「人工勾选」</text>
    <line x1="248" y1="453" x2="400" y2="453" stroke="url(#gTeal)" stroke-width="3"/>
    <circle cx="248" cy="453" r="7" fill="#FFFFFF" stroke="#A5A296" stroke-width="2.5"/>
    <circle cx="400" cy="453" r="10" fill="url(#gTeal)"/>
    <text class="serif" x="424" y="461" font-size="24" font-weight="700" fill="#186B64">到「机器可验证」的全链路凭证</text>

    <rect x="836" y="420" width="145" height="66" fill="#B04A7A" opacity="0.1"/>
    <text class="serif" x="852" y="450" font-size="21" font-weight="700" fill="#8E3A60">≥ 6 件</text>
    <text x="852" y="472" font-size="12.5" fill="#6B7078">2026 美国申请公开</text>

    <rect x="997" y="420" width="143" height="66" fill="#C07A18" opacity="0.1"/>
    <text class="serif" x="1013" y="450" font-size="21" font-weight="700" fill="#8A5A10">近 90 天 3 件</text>
    <text x="1013" y="472" font-size="12.5" fill="#6B7078">密集公开窗口</text>
  </g>

  <!-- bottom chips -->
  <line x1="64" y1="512" x2="804" y2="512" stroke="#E8E3D2"/>
  <g>
    <rect x="64" y="532" width="180" height="28" rx="14" fill="url(#gClay)" opacity="0.16"/>
    <text x="154" y="551" text-anchor="middle" class="chip" fill="#8E3623">8 月 2 日条款生效</text>
    <text class="b" x="256" y="551">EU AI Act 第 50 条 · 机器可读标记强制</text>

    <rect x="64" y="568" width="176" height="28" rx="14" fill="url(#gAmber)" opacity="0.24"/>
    <text x="152" y="587" text-anchor="middle" class="chip" fill="#7A5A14">月订阅 99–299 元</text>
    <text class="b" x="252" y="587">封装 C2PA 开源 SDK 的批量打标工具 · MVP 两周</text>
  </g>

  <text class="serif" x="64" y="630" font-size="18" fill="#1A1B1E">大厂抢生成端，「验证与证明」是个人能接的薄活儿。</text>
  <text class="b" x="1136" y="654" text-anchor="end">均为申请公开、非授权结论 · Music IP 为同一申请人专利族 · Micropaper</text>
</svg>
