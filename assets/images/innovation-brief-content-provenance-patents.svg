<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">2026 年四件内容溯源专利全部为申请公开；EU AI Act 第 50 条于 2026-08-02 生效</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">四件专利公开时间轴与法规节点（空心 = 申请公开）</text>

  <!-- event rail: window 2026-01 to 2026-12 -->
  <line x1="90" y1="170" x2="1074" y2="170" stroke="#1A1B1E" stroke-width="1.5"/>
  <circle cx="354" cy="170" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <circle cx="581" cy="170" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <circle cx="600" cy="146" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <line x1="600" y1="154" x2="600" y2="162" stroke="#1A1B1E" stroke-width="0.75"/>
  <circle cx="694" cy="170" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <!-- EU AI Act effective date: vertical rule -->
  <line x1="664" y1="126" x2="664" y2="214" stroke="#D55E00" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- date labels -->
  <g font-size="12" fill="#555">
    <text x="354" y="152" text-anchor="middle">2026-04-09</text>
    <text x="569" y="152" text-anchor="end">2026-07-02</text>
    <text x="588" y="124" text-anchor="end">2026-07-09</text>
    <text x="706" y="152">2026-08-13</text>
    <text x="672" y="122">2026-08-02 生效</text>
  </g>

  <!-- detail list below the rail, chronological -->
  <g font-size="12" fill="#555">
    <text x="90" y="240">○ US20260099327 公开 · U.S. Bank · 2026-04-09　编辑器插件用署名 token 逐段标记人写与 AI 生成</text>
    <text x="90" y="266">○ US20260187746 公开 · SAP · 2026-07-02　块级频域水印嵌入，用于内容全生命周期校验</text>
    <text x="90" y="292">○ US20260195422 公开 · Music IP Holdings · 2026-07-09　AI 衍生作品水印分散嵌入多个频段</text>
    <text x="90" y="318">○ US20260236564 公开 · Music IP Holdings · 2026-08-13　水印、元数据、哈希附溯源数据</text>
  </g>

  <!-- date axis (time axis: no gridlines per style guide) -->
  <line x1="90" y1="344" x2="1074" y2="344" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="90" y1="344" x2="90" y2="348"/>
    <line x1="336" y1="344" x2="336" y2="348"/>
    <line x1="582" y1="344" x2="582" y2="348"/>
    <line x1="828" y1="344" x2="828" y2="348"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="90" y="364">2026-01</text>
    <text x="336" y="364">2026-04</text>
    <text x="582" y="364">2026-07</text>
  </g>
  <text x="582" y="388" font-size="14" fill="#1A1B1E" text-anchor="middle">公开日期（年-月，窗口 2026 年）</text>
  <text x="90" y="412" font-size="12" fill="#555">○ 申请公开 · 虚线 = EU AI Act 透明度条款生效日 · 全年至少公开 6 件，其中近 90 天内 3 件</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="452" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="452" font-size="15" fill="#1A1B1E">批量合规打标 SaaS 月订阅定价（正文自估口径，区间 99-299 元）</text>

  <!-- range bar on 0-300 元 scale: x = 90 + 990*v/300 -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="90" y1="518" x2="1080" y2="518"/>
  </g>
  <rect x="417" y="490" width="660" height="20" fill="#D55E00"/>
  <line x1="417" y1="486" x2="417" y2="514" stroke="#D55E00" stroke-width="2"/>
  <line x1="1077" y1="486" x2="1077" y2="514" stroke="#D55E00" stroke-width="2"/>
  <text x="90" y="480" font-size="12" fill="#555">月订阅区间下限 99 元 · 上限 299 元</text>

  <!-- value axis -->
  <line x1="90" y1="558" x2="1080" y2="558" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="90" y1="558" x2="90" y2="562"/>
    <line x1="417" y1="558" x2="417" y2="562"/>
    <line x1="1077" y1="558" x2="1077" y2="562"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="90" y="578">0</text>
    <text x="417" y="578">99</text>
    <text x="1077" y="578">299</text>
  </g>
  <text x="585" y="602" font-size="14" fill="#1A1B1E" text-anchor="middle">月订阅（元）</text>

  <text x="90" y="624" font-size="12" fill="#555">对照：打标工具起步成本月均几百元，MVP 两周可跑通（正文自估）</text>

  <!-- footnote -->
  <text x="60" y="642" font-size="11" fill="#767676">数据：US20260236564、US20260195422、US20260187746、US20260099327 公开公告日与 EU AI Act 第 50 条生效日（正文 References）· 四件均为申请公开</text>
  <text x="60" y="658" font-size="11" fill="#767676">不等于已授权 · 99-299 元为正文自估口径</text>
</svg>
