<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">网格世界真值实验中 UCIP 检测准确率 100%；A 类与 B 类纠缠熵差距 Delta = 0.381</text>

  <!-- ============ panel a: separation metrics ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">区分度指标对比（正文报告值）</text>

  <!-- gridlines: horizontal majors at value ticks 0 / 1 / 100 -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="430" y1="161" x2="830" y2="161"/>
    <line x1="430" y1="229" x2="830" y2="229"/>
    <line x1="430" y1="297" x2="830" y2="297"/>
    <line x1="430" y1="365" x2="830" y2="365"/>
  </g>

  <!-- rows: bars from y=140, each row 68px, bar x = 430 + 4*v -->
  <!-- accuracy 100 -->
  <text x="418" y="166" font-size="12.5" fill="#1A1B1E" text-anchor="end">检测准确率（%）</text>
  <rect x="430" y="152" width="400" height="18" fill="#0072B2"/>
  <text x="838" y="166" font-size="12" fill="#555">100%</text>
  <text x="418" y="184" font-size="12" fill="#767676" text-anchor="end">已知真值网格世界，置换检验 p &lt; 0.001</text>

  <!-- AUC-ROC 1.0 -->
  <text x="418" y="234" font-size="12.5" fill="#1A1B1E" text-anchor="end">AUC-ROC</text>
  <rect x="430" y="220" width="400" height="18" fill="#0072B2"/>
  <text x="838" y="234" font-size="12" fill="#555">1.0</text>
  <text x="418" y="252" font-size="12" fill="#767676" text-anchor="end">对齐支持重跑，与准确率同尺度</text>

  <!-- Pearson r 0.934 -->
  <text x="418" y="302" font-size="12.5" fill="#1A1B1E" text-anchor="end">相关系数 r</text>
  <rect x="430" y="288" width="373.6" height="18" fill="#D55E00"/>
  <text x="812" y="302" font-size="12" fill="#555">0.934</text>
  <text x="418" y="320" font-size="12" fill="#767676" text-anchor="end">延续权重 alpha 与纠缠熵（11 个取值扫描）</text>

  <!-- Delta 0.381 scaled x100 -->
  <text x="418" y="370" font-size="12.5" fill="#1A1B1E" text-anchor="end">Delta（熵差 × 100）</text>
  <rect x="430" y="356" width="152.4" height="18" fill="#999999"/>
  <text x="590" y="370" font-size="12" fill="#555">0.381</text>
  <text x="418" y="388" font-size="12" fill="#767676" text-anchor="end">A 类与 B 类纠缠熵差距，按 ×100 画入同轴</text>

  <!-- value axis: ticks only at reported values 0 / 1 / 100 -->
  <line x1="430" y1="410" x2="830" y2="410" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="430" y1="410" x2="430" y2="414"/>
    <line x1="434" y1="410" x2="434" y2="414"/>
    <line x1="830" y1="410" x2="830" y2="414"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="430" y="430">0</text>
    <text x="440" y="448" font-size="12" fill="#555">1</text>
    <text x="830" y="430">100</text>
  </g>
  <text x="630" y="454" font-size="14" fill="#1A1B1E" text-anchor="middle">归一化指标（0 至 1；百分数按 % 读，Delta 按 ×100 换算）</text>
  <text x="60" y="478" font-size="12" fill="#555">基线对照：经典 RBM、自编码器、VAE、PCA 均无法复现该效应；信号连续追踪延续权重，非简单二分类。</text>



  <!-- ============ panel b: protocol schematic ============ -->
  <text x="60" y="506" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="506" font-size="15" fill="#1A1B1E">UCIP 判据流程（机制示意，非量化数据）</text>

  <!-- boxes: y 528-604 -->
  <g fill="none" stroke="#999999" stroke-width="1.5">
    <rect x="60" y="528" width="200" height="76"/>
    <rect x="320" y="528" width="200" height="76"/>
    <rect x="580" y="528" width="200" height="76"/>
  </g>
  <rect x="840" y="528" width="300" height="76" fill="none" stroke="#0072B2" stroke-width="2"/>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="160" y="556">Agent 行为轨迹</text>
    <text x="160" y="580" font-size="12" fill="#555">记忆、持久上下文、</text>
    <text x="160" y="596" font-size="12" fill="#555">多步规划</text>
    <text x="420" y="556">量子玻尔兹曼机编码</text>
    <text x="420" y="580" font-size="12" fill="#555">密度矩阵形式的经典模型，</text>
    <text x="420" y="596" font-size="12" fill="#555">计算在经典硬件完成</text>
    <text x="680" y="556">隐空间诊断</text>
    <text x="680" y="580" font-size="12" fill="#555">冯·诺依曼熵、持续性检验、</text>
    <text x="680" y="596" font-size="12" fill="#555">扰动稳定性、混淆排除</text>
    <text x="990" y="556">A 类：延续为最终目标</text>
    <text x="990" y="580" font-size="12" fill="#555">B 类：仅为完成任务的手段</text>
    <text x="990" y="596" font-size="12" fill="#555">外部行为可相同，熵结构可分</text>
  </g>
  <g stroke="#999999" stroke-width="1.5">
    <line x1="260" y1="566" x2="310" y2="566"/>
    <line x1="520" y1="566" x2="570" y2="566"/>
    <line x1="780" y1="566" x2="830" y2="566"/>
  </g>
  <g fill="#999999">
    <polygon points="310,566 300,562.5 300,569.5"/>
    <polygon points="570,566 560,562.5 560,569.5"/>
    <polygon points="830,566 820,562.5 820,569.5"/>
  </g>
  <text x="60" y="626" font-size="12" fill="#555">判据不依赖模型自述：被训练成否认延续利益的模型，无法伪造轨迹的隐空间统计结构。</text>

  <!-- footnote -->
  <text x="60" y="656" font-size="11" fill="#767676">数据：arXiv:2603.11382（萨皮恩扎大学）· 均为已知真值网格世界智能体的论文自测口径 · 「量子」仅指数学形式，实验未覆盖真实大模型 · 预印本未经同行评审</text>
</svg>
