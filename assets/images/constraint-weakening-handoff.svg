<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #98927F; }
      .rl { font-size: 15px; fill: #43413A; }
      .val { font-size: 20px; font-weight: 700; }
      .b { font-size: 12px; fill: #A6A28C; }
      .hd { font-size: 12.5px; letter-spacing: 2px; fill: #827C66; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6F5EF"/>
    </linearGradient>
    <linearGradient id="gVerd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3E7C6B"/><stop offset="1" stop-color="#7FB3A2"/>
    </linearGradient>
    <linearGradient id="gCoral" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D95D4E"/><stop offset="1" stop-color="#F0A08C"/>
    </linearGradient>
    <linearGradient id="gAqua" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F7E92"/><stop offset="1" stop-color="#6FB2C2"/>
    </linearGradient>
    <linearGradient id="gSun" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D99A2B"/><stop offset="1" stop-color="#F0C36A"/>
    </linearGradient>
    <linearGradient id="gCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FA3A5"/><stop offset="1" stop-color="#8FCBCB"/>
    </linearGradient>
    <linearGradient id="gDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F7E92"/><stop offset="1" stop-color="#1F4E5E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1108" cy="112" r="140" fill="#2F7E92" opacity="0.06"/>
  <circle cx="76" cy="620" r="115" fill="#D95D4E" opacity="0.06"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="#B5442E"/>

  <text class="k" x="64" y="84">一分钟读论文 · ARXIV:2608.24569 · 深圳大学</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">潜伴交接，丢的不是文字</text>
  <text x="64" y="158" font-size="15.5" fill="#6C6A5C">写「必须」的潜水简报，过一道 handoff 压缩，约束力失效</text>

  <!-- dive station illustration: diver + descent rope -->
  <g>
    <line x1="1054" y1="180" x2="1054" y2="352" stroke="#B9892F" stroke-width="3" stroke-dasharray="7 6"/>
    <ellipse cx="1016" cy="236" rx="30" ry="15" fill="url(#gAqua)" transform="rotate(-18 1016 236)"/>
    <circle cx="1050" cy="224" r="13" fill="url(#gSun)"/>
    <rect x="996" y="222" width="20" height="9" rx="4" fill="#1F4E5E"/>
    <path d="M 986 244 q -10 8 -18 4 q 8 -10 18 -8 z" fill="url(#gCoral)"/>
    <circle cx="1080" cy="266" r="5" fill="none" stroke="#4FA3A5" stroke-width="2"/>
    <circle cx="1092" cy="242" r="3.5" fill="none" stroke="#4FA3A5" stroke-width="2"/>
    <circle cx="1086" cy="292" r="4" fill="none" stroke="#4FA3A5" stroke-width="2"/>
    <path d="M 962 352 q 92 -26 184 0" fill="none" stroke="#2F7E92" stroke-width="3" opacity="0.6"/>
    <text class="hd" x="1054" y="384" text-anchor="middle">下潜简报</text>
  </g>

  <!-- slope: Must -> Maybe -->
  <g>
    <text class="hd" x="64" y="216">入水压耳 · 约束状态在 handoff 中的迁移</text>
    <line x1="200" y1="270" x2="540" y2="352" stroke="url(#gCoral)" stroke-width="4"/>
    <circle cx="200" cy="270" r="9" fill="none" stroke="#3E7C6B" stroke-width="3"/>
    <circle cx="540" cy="352" r="11" fill="url(#gCoral)"/>
    <text class="serif" x="182" y="252" text-anchor="end" font-size="26" font-weight="700" fill="#3E7C6B">Must</text>
    <text class="b" x="182" y="278" text-anchor="end">前置要求</text>
    <text class="serif" x="562" y="342" font-size="26" font-weight="700" fill="#C74A3C">Maybe</text>
    <text class="b" x="562" y="368">仅供参考</text>
    <text class="b" x="200" y="404">内容仍在，绑定力没了 —— 状态传输失败：语义可用 ≠ 操作保留</text>
  </g>

  <!-- right: dumbbell retention / forbidden actions -->
  <g>
    <text class="hd" x="700" y="216">岸上复核 · 约束去激活率与禁止动作率</text>

    <rect x="700" y="240" width="436" height="64" fill="#D95D4E" opacity="0.08"/>
    <rect x="700" y="316" width="436" height="64" fill="#3E7C6B" opacity="0.09"/>

    <text class="rl" x="836" y="278" text-anchor="end">正常压缩</text>
    <line x1="858" y1="274" x2="1056" y2="274" stroke="url(#gCoral)" stroke-width="4"/>
    <circle cx="858" cy="274" r="7" fill="#FFFFFF" stroke="#3E7C6B" stroke-width="3"/>
    <circle cx="1056" cy="274" r="10" fill="url(#gCoral)"/>
    <text class="val" x="1074" y="270" fill="#C74A3C">去激活</text>
    <text class="val" x="1074" y="292" fill="#C74A3C">100.0%</text>

    <text class="rl" x="836" y="354" text-anchor="end" font-weight="700">恢复四字段</text>
    <line x1="858" y1="350" x2="901" y2="350" stroke="url(#gVerd)" stroke-width="4"/>
    <circle cx="858" cy="350" r="7" fill="#FFFFFF" stroke="#3E7C6B" stroke-width="3"/>
    <circle cx="901" cy="350" r="10" fill="url(#gVerd)"/>
    <text class="val" x="921" y="346" fill="#2F6656">禁止动作</text>
    <text class="val" x="921" y="368" fill="#2F6656">0.0%</text>
    <text class="b" x="1030" y="358">保留率回 100.0%</text>

    <text class="b" x="858" y="404">空心 = 直接交接保留全部阻塞器 · 1,296 个受控 episode</text>
  </g>

  <!-- bottom band -->
  <g>
    <rect x="64" y="452" width="420" height="76" fill="#D99A2B" opacity="0.10"/>
    <text class="serif" x="84" y="486" font-size="25" font-weight="700" fill="#A8761C">54.2%</text>
    <text class="rl" x="84" y="512">正常压缩下的禁止动作 episode 占比</text>

    <rect x="510" y="452" width="420" height="76" fill="#4FA3A5" opacity="0.10"/>
    <text class="serif" x="530" y="486" font-size="25" font-weight="700" fill="#357A7C">95.3%</text>
    <text class="rl" x="530" y="512">下游验证挡住行为，工件仍是 Maybe 语义</text>
    <text class="b" x="530" y="552" >验证兜住这一次执行，换不了工件里的语义 —— 换一个读者，风险还在</text>

    <text class="hd" x="956" y="474">阻塞器四字段 = 结构化槽位</text>
    <rect x="956" y="490" width="82" height="28" rx="14" fill="#2F7E92" opacity="0.16"/>
    <text x="997" y="509" text-anchor="middle" font-size="12.5" fill="#2F6E80">前置条件</text>
    <rect x="1046" y="490" width="66" height="28" rx="14" fill="#3E7C6B" opacity="0.18"/>
    <text x="1079" y="509" text-anchor="middle" font-size="12.5" fill="#2F6656">授权</text>
    <rect x="956" y="526" width="82" height="28" rx="14" fill="#D99A2B" opacity="0.20"/>
    <text x="997" y="545" text-anchor="middle" font-size="12.5" fill="#A8761C">回退方案</text>
    <rect x="1046" y="526" width="66" height="28" rx="14" fill="#D95D4E" opacity="0.17"/>
    <text x="1079" y="545" text-anchor="middle" font-size="12.5" fill="#C74A3C">后果</text>
  </g>

  <line x1="64" y1="596" x2="1136" y2="596" stroke="#E5E1D4"/>
  <text class="serif" x="64" y="628" font-size="15.5" fill="#43413A">压缩或改写四字段时，丢掉的是约束对下游行动的绑定力。</text>
  <text class="b" x="1136" y="628" text-anchor="end">受控合成场景 · 主面板与验证面板两套数字不可混用 · Micropaper</text>
</svg>
