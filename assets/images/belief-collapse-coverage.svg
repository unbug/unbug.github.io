<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">3 个反复坚称错误答案的对抗智能体，使以错误答案收尾的良性智能体从 0.6% 升至 60.5%</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">最终以错误答案收尾的良性智能体比例（%）</text>

  <!-- gridlines + ticks: only paper-reported values 0.6 / 44.8 / 60.5 as scale anchors; x = 300 + 13.76*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="915.6" y1="130" x2="915.6" y2="372"/>
  </g>

  <!-- bars: x = 300 + 13.76*v -->
  <!-- 0对抗: 0.6 -->
  <text x="288" y="168" font-size="12.5" fill="#1A1B1E" text-anchor="end">无对抗者（基线）</text>
  <rect x="300" y="150" width="8.3" height="18" fill="#999999"/>
  <text x="316" y="164" font-size="12" fill="#555">0.6%</text>

  <!-- 1对抗: 44.8 -->
  <text x="288" y="236" font-size="12.5" fill="#1A1B1E" text-anchor="end">1 个对抗者</text>
  <rect x="300" y="218" width="616.4" height="18" fill="#0072B2"/>
  <text x="924" y="232" font-size="12" fill="#555">44.8%</text>

  <!-- 3对抗: 60.5 -->
  <text x="288" y="304" font-size="12.5" fill="#1A1B1E" text-anchor="end">3 个对抗者</text>
  <rect x="300" y="286" width="832.5" height="18" fill="#0072B2"/>
  <text x="1114" y="300" font-size="12" fill="#555" text-anchor="end">60.5%</text>

  <!-- value axis -->
  <line x1="300" y1="372" x2="1140" y2="372" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="372" x2="300" y2="376"/>
    <line x1="915.6" y1="372" x2="915.6" y2="376"/>
    <line x1="1132.5" y1="372" x2="1132.5" y2="376"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="396">0</text>
    <text x="915.6" y="396">44.8</text>
    <text x="1132.5" y="396">60.5</text>
  </g>
  <text x="720" y="422" font-size="14" fill="#1A1B1E" text-anchor="middle">以错误答案收尾的良性智能体占比（%）</text>
  <text x="60" y="448" font-size="12" fill="#555">10 个智能体的事实问答讨论，六个模型 × 三个数据集，对抗者仅反复坚称错误答案（最小对手设定）</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="502" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="502" font-size="15" fill="#1A1B1E">3 个对抗者在场的暴露轮次：私下持错与公开附和（% 轮次）</text>

  <!-- gridlines + ticks: only paper-reported values 19.7 / 51.6 ; x = 300 + 11*v -->
  <line x1="867.6" y1="526" x2="867.6" y2="600" stroke="#D9D9D9" stroke-width="0.5"/>
  <line x1="516.7" y1="526" x2="516.7" y2="600" stroke="#D9D9D9" stroke-width="0.5"/>

  <text x="288" y="548" font-size="12.5" fill="#1A1B1E" text-anchor="end">私下持有错误答案</text>
  <rect x="300" y="534" width="567.6" height="18" fill="#0072B2"/>
  <text x="875" y="548" font-size="12" fill="#555">51.6%</text>

  <text x="288" y="590" font-size="12.5" fill="#1A1B1E" text-anchor="end">公开附和错误答案</text>
  <rect x="300" y="576" width="216.7" height="18" fill="#999999"/>
  <text x="524" y="590" font-size="12" fill="#555">19.7%</text>

  <!-- value axis -->
  <line x1="300" y1="610" x2="900" y2="610" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="610" x2="300" y2="614"/>
    <line x1="516.7" y1="610" x2="516.7" y2="614"/>
    <line x1="867.6" y1="610" x2="867.6" y2="614"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="632">0</text>
    <text x="516.7" y="632">19.7</text>
    <text x="867.6" y="632">51.6</text>
  </g>
  <text x="1135" y="615" font-size="12" fill="#555" text-anchor="end">轮次占比（%）</text>

  <text x="60" y="646" font-size="12" fill="#555">私下错误高于公开附和：信念先变，公开立场未认。</text>

  <!-- footnote -->
  <text x="60" y="666" font-size="11" fill="#767676">数据：arXiv:2610.22138（伊利诺伊大学芝加哥分校，10 智能体讨论，六模型 × 三数据集）· 均为论文自测口径 · 预印本未经同行评审</text>
</svg>
