<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">单条 query 覆盖全量蒸馏访问状态的 71.5%，16 条达到 98.9%；对齐速率两者相似放缓</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">不同 query 条数的状态覆盖率（%）</text>

  <!-- gridlines: x = 250 + 4.8*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="250" y1="128" x2="250" y2="318"/>
    <line x1="490" y1="128" x2="490" y2="318"/>
    <line x1="730" y1="128" x2="730" y2="318"/>
  </g>

  <!-- 1 query: 71.5 -->
  <text x="238" y="170" font-size="12.5" fill="#1A1B1E" text-anchor="end">1 条 query</text>
  <rect x="250" y="156" width="343.2" height="18" fill="#0072B2"/>
  <text x="601" y="170" font-size="12" fill="#555">71.5%</text>

  <!-- 16 queries: 98.9 -->
  <text x="238" y="270" font-size="12.5" fill="#1A1B1E" text-anchor="end">16 条 query</text>
  <rect x="250" y="256" width="474.7" height="18" fill="#D55E00"/>
  <text x="733" y="270" font-size="12" fill="#555">98.9%，追平全量数据训练</text>

  <!-- value axis -->
  <line x1="250" y1="318" x2="730" y2="318" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="250" y1="318" x2="250" y2="322"/>
    <line x1="370" y1="318" x2="370" y2="322"/>
    <line x1="490" y1="318" x2="490" y2="322"/>
    <line x1="610" y1="318" x2="610" y2="322"/>
    <line x1="730" y1="318" x2="730" y2="322"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="250" y="338">0</text>
    <text x="370" y="338">25</text>
    <text x="490" y="338">50</text>
    <text x="610" y="338">75</text>
    <text x="730" y="338">100</text>
  </g>
  <text x="490" y="362" font-size="14" fill="#1A1B1E" text-anchor="middle">state coverage：小 query 集轨迹覆盖全量蒸馏访问状态的比例（%）</text>
  <text x="250" y="384" font-size="12" fill="#555">换语义不同的 query，覆盖率与验证精度同步上升</text>

  <!-- ============ panel b ============ -->
  <!-- ============ panel b ============ -->
  <text x="850" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="872" y="104" font-size="15" fill="#1A1B1E">吸收侧：论文报告的关键量级</text>

  <text x="850" y="150" font-size="13" fill="#1A1B1E" font-weight="bold">学生对教师的对齐速率</text>
  <text x="850" y="178" font-size="12.5" fill="#1A1B1E">1 条 query</text>
  <rect x="850" y="188" width="290" height="16" fill="#0072B2"/>
  <text x="850" y="222" font-size="12.5" fill="#1A1B1E">全量数据</text>
  <rect x="850" y="232" width="290" height="16" fill="#D55E00"/>
  <text x="850" y="266" font-size="12" fill="#555">两行等宽 = 论文报告的相似放缓速率，</text>
  <text x="850" y="284" font-size="12" fill="#555">无数值刻度、非数值轴</text>

  <text x="850" y="326" font-size="13" fill="#1A1B1E" font-weight="bold">步数口径（论文自述）</text>
  <text x="850" y="352" font-size="12" fill="#555">吸收监督需数百步，固定状态集也一样</text>
  <text x="850" y="372" font-size="12" fill="#555">单条 query 蒸馏持续上行数百步</text>
  <text x="850" y="392" font-size="12" fill="#555">大部分状态覆盖在前 100 步内到达</text>

  <text x="850" y="434" font-size="13" fill="#1A1B1E" font-weight="bold">多教师延伸</text>
  <text x="850" y="460" font-size="12" fill="#555">每个领域 16 条语义多样 query 追平全量；</text>
  <text x="850" y="480" font-size="12" fill="#555">模板 query 与跨域 WildChat 真实对话</text>
  <text x="850" y="500" font-size="12" fill="#555">接近真实领域 query 基线</text>

  <text x="850" y="540" font-size="12" fill="#555">诊断词（作者自造）：data-overfed</text>
  <text x="850" y="558" font-size="12" fill="#555">but algorithm-starved</text>

  <!-- footnote -->
  <text x="60" y="652" font-size="11" fill="#767676">数据：arXiv:2609.04172（arXiv:2604.13016 同系列续篇）· state coverage 为论文提出的测量框架而非学界既有定论 · 结论限定于数学任务与所测模型家族，论文报告跨家族与领域稳健 · 预印本未经同行评审</text>
</svg>
