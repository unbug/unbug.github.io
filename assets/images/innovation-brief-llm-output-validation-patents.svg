<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">四件大模型输出验证专利在 2024 至 2026 年相继授权，验证环节进入调用流水线</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">四件已授权专利：授权先后序位与验证位置</text>

  <!-- gridlines (integer order majors, 0.5pt) -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="220" y1="126" x2="220" y2="356"/>
    <line x1="440" y1="126" x2="440" y2="356"/>
    <line x1="660" y1="126" x2="660" y2="356"/>
    <line x1="880" y1="126" x2="880" y2="356"/>
  </g>

  <!-- items: x = 220 + 220*(order-1) -->
  <!-- Citibank sandbox 2024-05-10 -->
  <circle cx="220" cy="168" r="6" fill="#0072B2"/>
  <text x="220" y="150" font-size="12" fill="#1A1B1E" text-anchor="middle">2024-05-10 授权</text>
  <text x="220" y="192" font-size="12" fill="#555" text-anchor="middle">Citibank US12111747B2</text>
  <text x="220" y="208" font-size="12" fill="#555" text-anchor="middle">检测代码进隔离虚拟机试跑，</text>
  <text x="220" y="224" font-size="12" fill="#555" text-anchor="middle">输出先过沙箱再上岗</text>

  <!-- Citibank gate 2024-11-19 -->
  <circle cx="440" cy="226" r="6" fill="#0072B2"/>
  <text x="440" y="208" font-size="12" fill="#1A1B1E" text-anchor="middle">2024-11-19 授权</text>
  <text x="440" y="250" font-size="12" fill="#555" text-anchor="middle">Citibank US12147513B2</text>
  <text x="440" y="266" font-size="12" fill="#555" text-anchor="middle">先评估提示词适不适合交给该模型，</text>
  <text x="440" y="282" font-size="12" fill="#555" text-anchor="middle">相当于给请求设准入闸</text>

  <!-- Honeywell 2026-06-02 -->
  <circle cx="660" cy="254" r="6" fill="#0072B2"/>
  <text x="660" y="236" font-size="12" fill="#1A1B1E" text-anchor="middle">2026-06-02 授权</text>
  <text x="660" y="278" font-size="12" fill="#555" text-anchor="middle">Honeywell US12645691B2</text>
  <text x="660" y="294" font-size="12" fill="#555" text-anchor="middle">输入输出主题集合比对，</text>
  <text x="660" y="310" font-size="12" fill="#555" text-anchor="middle">无标注给输出打可信分</text>

  <!-- WitnessAI 2026-07-07 -->
  <circle cx="880" cy="282" r="6" fill="#0072B2"/>
  <text x="880" y="264" font-size="12" fill="#1A1B1E" text-anchor="middle">2026-07-07 授权</text>
  <text x="880" y="306" font-size="12" fill="#555" text-anchor="middle">WitnessAI US12675579B2</text>
  <text x="880" y="322" font-size="12" fill="#555" text-anchor="middle">API 侧护栏，按管理策略</text>
  <text x="880" y="338" font-size="12" fill="#555" text-anchor="middle">动态挂输入输出过滤器</text>

  <!-- order axis -->
  <line x1="220" y1="370" x2="880" y2="370" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="220" y1="370" x2="220" y2="374"/>
    <line x1="440" y1="370" x2="440" y2="374"/>
    <line x1="660" y1="370" x2="660" y2="374"/>
    <line x1="880" y1="370" x2="880" y2="374"/>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="220" y="394">第 1 件</text>
    <text x="440" y="394">第 2 件</text>
    <text x="660" y="394">第 3 件</text>
    <text x="880" y="394">第 4 件</text>
  </g>
  <text x="550" y="420" font-size="14" fill="#1A1B1E" text-anchor="middle">授权序位（第 n 件授权，按正文顺序）</text>

  <!-- side note -->
  <text x="960" y="168" font-size="12" fill="#555">四件均为已授权专利</text>
  <text x="960" y="186" font-size="12" fill="#555">（非仅公开申请）：愿意付</text>
  <text x="960" y="204" font-size="12" fill="#555">维持费，说明内部真在用，</text>
  <text x="960" y="222" font-size="12" fill="#555">信号比一般申请更硬。</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="480" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="480" font-size="15" fill="#1A1B1E">开源验证工具 GitHub star 数（2026-09-19 GitHub API 实测）</text>

  <!-- gridlines (horizontal majors only, 0.5pt) -->
  <!-- gridlines (horizontal majors only, 0.5pt) -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="260" y1="515" x2="936" y2="515"/>
    <line x1="260" y1="569" x2="936" y2="569"/>
  </g>
  <!-- bars: x = 260 + v/20 -->
  <text x="250" y="529" font-size="12.5" fill="#1A1B1E" text-anchor="end">promptfoo</text>
  <rect x="260" y="515" width="610.6" height="18" fill="#999999"/>
  <line x1="870.6" y1="512" x2="870.6" y2="536" stroke="#999999" stroke-width="0.75"/>
  <text x="882" y="529" font-size="12" fill="#555">25,270 星</text>

  <text x="250" y="583" font-size="12.5" fill="#1A1B1E" text-anchor="end">Guardrails AI</text>
  <rect x="260" y="569" width="179.4" height="18" fill="#999999"/>
  <line x1="439.4" y1="566" x2="439.4" y2="590" stroke="#999999" stroke-width="0.75"/>
  <text x="450" y="583" font-size="12" fill="#555">7,434 星</text>

  <!-- value axis -->
  <line x1="260" y1="602" x2="936" y2="602" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="260" y1="602" x2="260" y2="606"/>
    <line x1="870.6" y1="602" x2="870.6" y2="606"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="260" y="626">0</text>
    <text x="870.6" y="626">25,270</text>
  </g>
  <text x="598" y="652" font-size="14" fill="#1A1B1E" text-anchor="middle">GitHub star 数（个）</text>

  <!-- panel b note -->
  <text x="344" y="490" font-size="12" fill="#555">开源已把「跑测试集」与「输出解析护栏」做成商品；四件专利主张的是无标注打分与提示词准入判定。</text>

  <!-- footnote -->
  <text x="60" y="452" font-size="11" fill="#767676">数据：Free Patents Online 四件专利详情页（公开号见上图与正文）· 面板 a 为授权公告日期按序位排列 · 面板 b star 数为 2026-09-19 GitHub API 实测</text>
</svg>
