<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">管道产出 1,000 个环境、35,062 个工具与 10,000 个任务；实际训练仅使用 526 个环境，分布外泛化仍超越基准特定训练</text>

  <!-- ===== panel a: pipeline scale ===== -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">合成管道的产出规模（个）</text>

  <!-- axis x = 300 + 0.08*v ; single gridline at 10,000 (axis max) -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="1100" y1="126" x2="1100" y2="286"/>
  </g>

  <!-- tools 35,062 truncated at axis max with arrow -->
  <text x="288" y="152" font-size="12.5" fill="#1A1B1E" text-anchor="end">工具（个）</text>
  <text x="1092" y="130" font-size="12" fill="#555" text-anchor="end">35,062（超出轴范围，箭头截断）</text>
  <rect x="300" y="138" width="800" height="18" fill="#009E73"/>
  
  

  <!-- tasks 10,000 truncated -->
  <text x="288" y="202" font-size="12.5" fill="#1A1B1E" text-anchor="end">任务（个）</text>
  <rect x="300" y="188" width="800" height="18" fill="#D55E00"/>
  <text x="1100" y="180" font-size="12" fill="#555" text-anchor="end">10,000</text>

  <!-- environments 1,000 -->
  <text x="288" y="252" font-size="12.5" fill="#1A1B1E" text-anchor="end">环境（个）</text>
  <rect x="300" y="238" width="80" height="18" fill="#0072B2"/>
  <text x="388" y="252" font-size="12" fill="#555">1,000</text>

  <!-- value axis -->
  <line x1="300" y1="286" x2="1100" y2="286" stroke="#1A1B1E" stroke-width="0.75"/>
  <line x1="300" y1="126" x2="300" y2="286" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="286" x2="300" y2="290"/>
    <line x1="1100" y1="286" x2="1100" y2="290"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="310">0</text>
    <text x="1100" y="310">10,000</text>
  </g>
  <text x="660" y="334" font-size="14" fill="#1A1B1E" text-anchor="middle">数量（个）</text>
  <text x="300" y="358" font-size="12" fill="#555">平均每环境约 35 个工具；1,000 个环境覆盖电商平台、CRM 系统等日常场景</text>

  <!-- ===== panel b: training usage dumbbell ===== -->
  <text x="60" y="416" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="416" font-size="15" fill="#1A1B1E">训练实际使用的环境数 vs 管道总产出（个）</text>

  <!-- axis x = 300 + 0.8*v ; gridlines 300/600/900 -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="720.8" y1="438" x2="720.8" y2="524"/>
    <line x1="1100" y1="438" x2="1100" y2="524"/>
  </g>
  <line x1="720.8" y1="476" x2="1100" y2="476" stroke="#999999" stroke-width="1.5"/>
  <circle cx="1100" cy="476" r="8" fill="none" stroke="#1A1B1E" stroke-width="1.5"/>
  <text x="1100" y="460" font-size="12" fill="#555" text-anchor="end">1,000</text>
  <circle cx="720.8" cy="476" r="8" fill="#D55E00"/>
  <text x="712" y="456" font-size="12" fill="#555" text-anchor="middle">526（受计算资源限制）</text>

  <line x1="300" y1="524" x2="1100" y2="524" stroke="#1A1B1E" stroke-width="0.75"/>
  <line x1="300" y1="438" x2="300" y2="524" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="524" x2="300" y2="528"/>
    <line x1="720.8" y1="524" x2="720.8" y2="528"/>
    <line x1="1100" y1="524" x2="1100" y2="528"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="548">0</text>
    <text x="720.8" y="548">526</text>
    <text x="1100" y="548">1,000</text>
  </g>
  <text x="700" y="572" font-size="14" fill="#1A1B1E" text-anchor="middle">环境数量（个）</text>
  <text x="890" y="464" font-size="12" fill="#555">实心 = 实际训练使用，空心 = 管道产出</text>

  <!-- ===== panel c setup note ===== -->
  <text x="60" y="604" font-size="12" fill="#555">实验：三个基准上的强化学习；仅在合成环境训练，分布外泛化超过基准特定训练；主要覆盖 Qwen3 系列 4B、8B、14B 模型；环境经 MCP 统一接口提供服务</text>

  <!-- footnote -->
  <text x="60" y="636" font-size="11" fill="#767676">数据：arXiv:2602.10090（UNC Chapel Hill 与 Snowflake，ICML 2026 接收）· 规模与训练用量为论文自测口径</text>
</svg>
