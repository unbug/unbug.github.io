<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">Borras 论文让四个 AI 模型以共同作者身份发表；OpenAI 报告每周 840 万条高级科学消息</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">四个 AI 共同研究员的分工</text>
  <text x="60" y="128" font-size="12" fill="#555">机制示意：论文自述各模型承担的研究环节，非量化统计</text>

  <g font-size="13" fill="#1A1B1E">
    <text x="60" y="182">Claude Opus</text>
    <text x="60" y="242">Gemini Pro</text>
    <text x="60" y="302">ChatGPT</text>
    <text x="60" y="362">Manus</text>
  </g>
  <g font-size="13" fill="#555">
    <text x="220" y="182">假设设计与伦理把关，挑战假设并指出方法论缺陷</text>
    <text x="220" y="242">模式识别与数据分析，交叉引用公共科学存储库</text>
    <text x="220" y="302">把抽象假设转化为可执行代码框架</text>
    <text x="220" y="362">在二进制数据流中发现隐藏异常</text>
  </g>
  <g font-size="12" fill="#767676">
    <text x="220" y="202">据 LLM-Stats 2026-02 基准，Claude Opus 4.6 GPQA 分数 0.9，为商用模型最高水平</text>
    <text x="220" y="262">XDA Developers：其在检测 23 次实验迭代中的混淆变量时不可或缺</text>
    <text x="220" y="322">数据规模：200 GB 二进制数据集</text>
    <text x="220" y="382">这些发现成为整个假设的核心</text>
  </g>

  <!-- collaboration note -->
  <line x1="60" y1="418" x2="1140" y2="418" stroke="#D9D9D9" stroke-width="0.5"/>
  <text x="60" y="446" font-size="13" fill="#1A1B1E">协作方式：动态多智能体批评系统——模型间互相质疑、互相验证，分歧通过迭代对话解决，而非人类拍板</text>
  <text x="60" y="470" font-size="13" fill="#555">组合表现超越仅由人类或单一 AI 组成的方法；GitHub 公开完整源代码，透明记录每个 AI 的具体角色</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="524" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="524" font-size="15" fill="#1A1B1E">OpenAI《AI as a Scientific Collaborator》报告的四项量化指标（数值见图旁标签）</text>
  <g font-size="12.5" fill="#1A1B1E">
    <text x="60" y="566">高级科学/数学消息（条/周）</text>
    <text x="350" y="566">高级科学用户（人/周）</text>
    <text x="620" y="566">高级科学消息月增速（%）</text>
    <text x="900" y="566">FrontierMath 解题率（%）</text>
  </g>
  <g font-size="20" font-weight="bold" fill="#D55E00">
    <text x="60" y="604">840 万</text>
    <text x="350" y="604">130 万</text>
    <text x="620" y="604">近 50</text>
    <text x="900" y="604">40.3</text>
  </g>

  <!-- footnote -->
  <text x="60" y="644" font-size="11" fill="#767676">数据：Zenodo DOI 10.5281/zenodo.18721271（论文自述口径）· OpenAI 报告 2026-01 · LLM-Stats 基准 2026-02 ·「首次」为文献记录表述，未经同行评审核验</text>
</svg>
