<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">行为相关性随能力提升而上升；共享推理正确时市场级风险下降，共享错误信息环境下同一相关性变成无法分散的风险</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">能力分级与行为相关性的方向关系（摘要第一发现，论文未报告具体数值）</text>

  <!-- axes -->
  <line x1="300" y1="360" x2="1140" y2="360" stroke="#1A1B1E" stroke-width="0.75"/>
  <line x1="300" y1="150" x2="300" y2="360" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="360" x2="300" y2="364"/>
    <line x1="1140" y1="360" x2="1140" y2="364"/>
    <line x1="300" y1="360" x2="296" y2="360"/>
    <line x1="300" y1="150" x2="296" y2="150"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E">
    <text x="300" y="384" text-anchor="start">低</text>
    <text x="1140" y="384" text-anchor="end">高</text>
    <text x="288" y="364" text-anchor="end">低</text>
    <text x="288" y="154" text-anchor="end">高</text>
  </g>
  <text x="720" y="410" font-size="14" fill="#1A1B1E" text-anchor="middle">模型能力分级（论文自定义口径）</text>
  <text x="76" y="255" font-size="14" fill="#1A1B1E">行为相关性（论文自定义口径）</text>

  <!-- trend arrow -->
  <line x1="380" y1="330" x2="1040" y2="180" stroke="#0072B2" stroke-width="1.5"/>
  <polygon points="1040,180 1019.3,183.1 1028.1,200.1" fill="#0072B2"/>

  <text x="430" y="222" font-size="12" fill="#555">前沿 LLM 行为显著相关，相关性同向上升；序数方向示意，非实测曲线</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="452" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="452" font-size="15" fill="#1A1B1E">同一相关性在两种信息环境下产生相反的市场级风险方向</text>

  <!-- row 1: accurate shared reasoning -->
  <rect x="300" y="474" width="170" height="26" fill="none" stroke="#555555" stroke-width="1.5"/>
  <text x="385" y="491" font-size="12.5" fill="#1A1B1E" text-anchor="middle">共享推理正确</text>
  <line x1="482" y1="487" x2="538" y2="487" stroke="#999999" stroke-width="1.5"/>
  <polygon points="538,487 526,481 526,493" fill="#999999"/>
  <rect x="550" y="474" width="200" height="26" fill="none" stroke="#0072B2" stroke-width="1.5"/>
  <text x="650" y="491" font-size="12.5" fill="#1A1B1E" text-anchor="middle">扩大参与，风险下降</text>
  <text x="770" y="491" font-size="12" fill="#555">多样性红利正常兑现（摘要第二发现）</text>

  <!-- row 2: common misinformation -->
  <rect x="300" y="524" width="170" height="26" fill="none" stroke="#555555" stroke-width="1.5"/>
  <text x="385" y="541" font-size="12.5" fill="#1A1B1E" text-anchor="middle">共享错误信息环境</text>
  <line x1="482" y1="537" x2="538" y2="537" stroke="#999999" stroke-width="1.5"/>
  <polygon points="538,537 526,531 526,543" fill="#999999"/>
  <rect x="550" y="524" width="240" height="26" fill="none" stroke="#D55E00" stroke-width="1.5"/>
  <text x="670" y="541" font-size="12.5" fill="#1A1B1E" text-anchor="middle">同一相关性立刻反转</text>
  <text x="810" y="541" font-size="12" fill="#555">负债：一起自信地错，风险无法分散（摘要第三发现）</text>

  <text x="60" y="592" font-size="12" fill="#555">agent-based 金融市场模拟：按通用能力分级的 LLM 充当交易员；相关性越高，摊不掉的底线越高（非可分散风险下限）。</text>

  <!-- footnote -->
  <text x="60" y="656" font-size="11" fill="#767676">数据：arXiv:2609.04373（agent-based 金融市场模拟，摘要口径）· 摘要未报告具体数值，本图为方向关系示意 · 相关性与能力分级口径均为论文自定义 · 预印本未经同行评审</text>
</svg>
