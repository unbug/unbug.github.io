<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <rect width="800" height="350" fill="#1a1a2e" rx="8"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Agentic Coding Architecture: Plan-Execute-Verify Loop</text>
  
  <!-- Central LLM hub -->
  <circle cx="400" cy="175" r="55" fill="#e74c3c" opacity="0.9"/>
  <text x="400" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ffffff">LLM</text>
  <text x="400" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff">Decision Hub</text>
  
  <!-- Three components around the hub -->
  <!-- Planner (top) -->
  <rect x="320" y="40" width="160" height="55" rx="8" fill="#2c3e50" stroke="#3498db" stroke-width="2"/>
  <text x="400" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Planner</text>
  <text x="400" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#a0b4c8">Task decomposition</text>
  <text x="400" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#a0b4c8">Sub-task planning</text>
  
  <!-- Executor (right) -->
  <rect x="560" y="147" width="180" height="55" rx="8" fill="#2c3e50" stroke="#e67e22" stroke-width="2"/>
  <text x="650" y="169" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Executor</text>
  <text x="650" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#a0b4c8">File system + Terminal</text>
  
  <!-- Verifier (left) -->
  <rect x="60" y="147" width="180" height="55" rx="8" fill="#2c3e50" stroke="#2ecc71" stroke-width="2"/>
  <text x="150" y="169" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Verifier</text>
  <text x="150" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#a0b4c8">Tests + Code quality</text>
  
  <!-- Arrows forming loop -->
  <!-- Planner to Executor -->
  <line x1="460" y1="75" x2="555" y2="130" stroke="#e67e22" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <!-- Executor to Verifier -->
  <line x1="560" y1="175" x2="245" y2="175" stroke="#2ecc71" stroke-width="2"/>
  <!-- Verifier back to Planner (if fail) -->
  <path d="M 150,205 Q 150,300 400,280 Q 650,300 650,205" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- Feedback arrow -->
  <text x="150" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#e74c3c">Error feedback</text>
  
  <!-- Success path -->
  <line x1="400" y1="230" x2="400" y2="310" stroke="#2ecc71" stroke-width="2"/>
  <rect x="340" y="310" width="120" height="30" rx="6" fill="#2c3e50" stroke="#2ecc71" stroke-width="1"/>
  <text x="400" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#ffffff">Git Commit</text>
  
  <!-- Key insight box -->
  <rect x="250" y="60" width="300" height="40" rx="6" fill="#0f3460"/>
  <text x="400" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff">LLM is NOT the code generator</text>
  <text x="400" y="93" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#a0b4c8">LLM coordinates tools via verification feedback loop</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e67e22"/>
    </marker>
  </defs>
</svg>
