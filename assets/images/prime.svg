<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">PRIME 免训练：把多轮交互轨迹蒸馏为三类结构化记忆并持续进化，性能可与梯度方法相当</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D55E00"/>
    </marker>
  </defs>

  <!-- ============ panel a: 4-stage pipeline ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">四阶段流水线（方法示意，无量化数据）</text>

  <g fill="none" stroke="#999999" stroke-width="1.5">
    <rect x="70" y="150" width="230" height="92" rx="4"/>
    <rect x="360" y="150" width="230" height="92" rx="4"/>
    <rect x="650" y="150" width="230" height="92" rx="4"/>
  </g>
  <rect x="940" y="150" width="230" height="92" rx="4" fill="none" stroke="#D55E00" stroke-width="1.5"/>

  <g text-anchor="middle">
    <text x="185" y="186" font-size="14" font-weight="bold" fill="#1A1B1E">探索阶段</text>
    <text x="185" y="210" font-size="12" fill="#555">收集多轮完整交互轨迹</text>
    <text x="185" y="228" font-size="12" fill="#555">含推理、工具调用与反馈</text>

    <text x="475" y="186" font-size="14" font-weight="bold" fill="#1A1B1E">蒸馏阶段</text>
    <text x="475" y="210" font-size="12" fill="#555">提取结构化经验归入</text>
    <text x="475" y="228" font-size="12" fill="#555">三个语义区</text>

    <text x="765" y="186" font-size="14" font-weight="bold" fill="#1A1B1E">进化阶段</text>
    <text x="765" y="210" font-size="12" fill="#555">合并相似、淘汰过时、</text>
    <text x="765" y="228" font-size="12" fill="#555">推导新的通用策略</text>

    <text x="1055" y="186" font-size="14" font-weight="bold" fill="#D55E00">记忆引导推理</text>
    <text x="1055" y="210" font-size="12" fill="#555">检索相关历史经验</text>
    <text x="1055" y="228" font-size="12" fill="#555">服务新任务</text>
  </g>

  <g stroke="#555555" stroke-width="1.5">
    <line x1="300" y1="196" x2="352" y2="196" marker-end="url(#arr)"/>
    <line x1="590" y1="196" x2="642" y2="196" marker-end="url(#arr)"/>
  </g>
  <line x1="880" y1="196" x2="932" y2="196" stroke="#D55E00" stroke-width="1.5" marker-end="url(#arrO)"/>

  <!-- retrieval dimensions note -->
  <text x="1055" y="268" font-size="11.5" fill="#555" text-anchor="middle">检索维度：语义相似度</text>
  <text x="1055" y="286" font-size="11.5" fill="#555" text-anchor="middle">时间相关性、用户匹配度</text>

  <!-- feedback loop from reasoning back to memory (进化) -->
  <path d="M 1055 242 L 1055 302 L 765 302 L 765 250" fill="none" stroke="#D55E00" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrO)"/>
  <text x="910" y="294" font-size="11.5" fill="#555" text-anchor="middle">新经验回流记忆库，持续进化</text>

  <!-- ============ panel b: three semantic zones ============ -->
  <text x="60" y="366" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="366" font-size="15" fill="#1A1B1E">蒸馏后的三个语义区</text>

  <g fill="none" stroke="#999999" stroke-width="1.5">
    <rect x="70" y="396" width="330" height="96" rx="4"/>
    <rect x="440" y="396" width="330" height="96" rx="4"/>
  </g>
  <rect x="810" y="396" width="330" height="96" rx="4" fill="none" stroke="#D55E00" stroke-width="1.5"/>

  <g>
    <text x="94" y="428" font-size="14" font-weight="bold" fill="#1A1B1E">成功策略</text>
    <text x="94" y="454" font-size="12" fill="#555">哪些工具调用序列有效</text>
    <text x="94" y="474" font-size="12" fill="#555">哪些提示词模板能准确理解意图</text>

    <text x="464" y="428" font-size="14" font-weight="bold" fill="#1A1B1E">失败模式</text>
    <text x="464" y="454" font-size="12" fill="#555">哪些路径走进死胡同</text>
    <text x="464" y="474" font-size="12" fill="#555">哪些工具组合会产生冲突</text>

    <text x="834" y="428" font-size="14" font-weight="bold" fill="#D55E00">用户偏好</text>
    <text x="834" y="454" font-size="12" fill="#555">偏好简洁还是详细回答</text>
    <text x="834" y="474" font-size="12" fill="#555">对哪个领域有专业知识</text>
  </g>

  <!-- ============ panel c: findings (qualitative) ============ -->
  <text x="60" y="540" font-size="15" font-weight="bold" fill="#1A1B1E">c</text>
  <text x="82" y="540" font-size="15" fill="#1A1B1E">实验主要发现（定性，正文未报告具体基准分数）</text>
  <g font-size="12.5" fill="#555">
    <circle cx="68" cy="566" r="3.5" fill="#D55E00"/>
    <text x="82" y="571">性能可竞争：多个基准上达到与梯度方法相当的水平，且不需要任何模型微调</text>
    <circle cx="68" cy="592" r="3.5" fill="#999999"/>
    <text x="82" y="597">成本优势：无需 GPU 训练，运行成本远低于 RL；可解释性：决策可追溯到具体历史经验</text>
    <circle cx="68" cy="618" r="3.5" fill="#999999"/>
    <text x="82" y="623">持续改进：随交互轮数增加性能持续提升，未观察到明显饱和点</text>
  </g>

  <!-- footnote -->
  <text x="60" y="640" font-size="11" fill="#767676">数据：arXiv:2604.07645（Cornell 大学，PRIME，论文自测口径）· 正文未报告各基准的量化数值，本图为机制示意与定性结论，未画数值轴 · 预印本未经同行评审</text>
</svg>
