<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="620" fill="#fbfbfd"/>
  <text x="430" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a2e">先仿真再上线：合成客户给客服智能体做发布验收</text>
  <text x="430" y="62" text-anchor="middle" font-size="13" fill="#666">arXiv:2609.30137 · Nubank 全员署名 · 2026-09-24 提交（预印本，未经评审）</text>

  <!-- 流程 -->
  <rect x="40" y="88" width="780" height="110" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="60" y="116" font-size="14.5" font-weight="700" fill="#3730a3">仿真工作流（不碰生产后端）</text>
  <rect x="60" y="132" width="170" height="46" rx="8" fill="#fff" stroke="#c7d2fe"/>
  <text x="145" y="152" text-anchor="middle" font-size="12" fill="#444">写下这版要验证的假设</text>
  <text x="145" y="170" text-anchor="middle" font-size="11" fill="#888">假设驱动组织场景</text>
  <text x="248" y="160" font-size="16" fill="#3730a3">→</text>
  <rect x="268" y="132" width="170" height="46" rx="8" fill="#fff" stroke="#c7d2fe"/>
  <text x="353" y="152" text-anchor="middle" font-size="12" fill="#444">合成客户对回复做反应</text>
  <text x="353" y="170" text-anchor="middle" font-size="11" fill="#888">多步 agentic 流程</text>
  <text x="456" y="160" font-size="16" fill="#3730a3">→</text>
  <rect x="476" y="132" width="170" height="46" rx="8" fill="#fff" stroke="#c7d2fe"/>
  <text x="561" y="152" text-anchor="middle" font-size="12" fill="#444">仿真工具输出（桩）</text>
  <text x="561" y="170" text-anchor="middle" font-size="11" fill="#888">不 invoke 生产系统</text>
  <text x="664" y="160" font-size="16" fill="#3730a3">→</text>
  <rect x="684" y="132" width="116" height="46" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="742" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">过筛才上线</text>
  <text x="742" y="170" text-anchor="middle" font-size="11" fill="#166534">发布门禁</text>

  <!-- 地基 -->
  <rect x="40" y="218" width="380" height="120" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="60" y="246" font-size="14" font-weight="700" fill="#166534">地基：相关性验证</text>
  <text x="60" y="274" font-size="12.5" fill="#444">跨 4 个已部署版本，仿真分 vs 生产分</text>
  <text x="60" y="298" font-size="12.5" fill="#444">同口径二元评估（规则判定，非人工抽查）</text>
  <text x="60" y="322" font-size="12" fill="#b45309">只有 4 个数据点，粒度粗——这是全文最大软肋</text>

  <!-- 两次实验 -->
  <rect x="440" y="218" width="380" height="120" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="460" y="246" font-size="14" font-weight="700" fill="#92400e">两轮线上 A/B 回收价值</text>
  <text x="460" y="274" font-size="12.5" fill="#444">迭代智能体：tNPS +36.69 分</text>
  <text x="460" y="298" font-size="12.5" fill="#444">16,000+ 合成会话筛配置：SSR +8.82 pp</text>
  <text x="460" y="322" font-size="12.5" fill="#444">达 Nubank 最高，tNPS 无显著下降</text>

  <!-- 边界 -->
  <rect x="40" y="360" width="780" height="110" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="60" y="388" font-size="14" font-weight="700" fill="#991b1b">四条折扣</text>
  <text x="60" y="414" font-size="12.5" fill="#444">1. 预印本未经同行评审 · 2. 相关性仅 4 个版本点，细粒度感受差异未必照出</text>
  <text x="60" y="438" font-size="12.5" fill="#444">3. 单一公司自家场景自证，无第三方复现 · 4. Snowglobe 仿真器未承诺开源，可迁移的是方法骨架</text>

  <!-- 启示 -->
  <rect x="40" y="492" width="780" height="86" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="60" y="520" font-size="14" font-weight="700" fill="#166534">可迁移的闭环（客服 / 工单 / 对话式入口团队）</text>
  <text x="60" y="546" font-size="12.5" fill="#444">历史会话日志 → 合成客户剧本库 → 小流量验证「仿真分与生产分相关」→ 相关了才当发布门禁用</text>
  <text x="60" y="568" font-size="12" fill="#666">工具输出可桩掉、客户反应可由模型扮演——不需要重建生产后端</text>

  <rect x="40" y="590" width="780" height="24" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="430" y="606" text-anchor="middle" font-size="11.5" fill="#64748b">与 RAFT（#185）互为前后工序：那篇管知识库入口检索，本篇管上线前仿真验收</text>
</svg>
