<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #97A18E; }
      .b { font-size: 12px; fill: #7E887A; }
      .ev { font-size: 13px; font-weight: 700; fill: #26302A; }
      .evs { font-size: 12px; fill: #5D685F; }
      .stat { font-size: 34px; font-weight: 700; fill: #26302A; }
      .unit { font-size: 14px; fill: #5D685F; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F8F4"/>
    </linearGradient>
    <linearGradient id="axis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E9B61"/><stop offset="1" stop-color="#3A76B8"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C24C4C"/><stop offset="1" stop-color="#E08A3C"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A76B8"/><stop offset="1" stop-color="#6E9B61"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1124" cy="96" r="130" fill="#3A76B8" opacity="0.06"/>
  <circle cx="90" cy="644" r="120" fill="#6E9B61" opacity="0.07"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#axis)"/>

  <text class="k" x="64" y="84">AI 智创简报 · 专利情报速读 · Agent 记忆层</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">内网这条路，导航没画</text>
  <text x="64" y="158" font-size="15" fill="#5D685F">7–8 月，微软与 UiPath 连发四件 Agent 记忆与上下文专利</text>

  <!-- navigation motif: route + destination pin -->
  <g>
    <path d="M 1010 160 C 1030 110, 1070 150, 1086 106" fill="none" stroke="url(#route)" stroke-width="5" stroke-dasharray="10 7" stroke-linecap="round"/>
    <path d="M 1086 70 c -14 0 -24 10 -24 23 c 0 17 24 37 24 37 s 24 -20 24 -37 c 0 -13 -10 -23 -24 -23 z" fill="url(#pin)"/>
    <circle cx="1086" cy="93" r="8" fill="#F5F8F4"/>
    <circle cx="1010" cy="160" r="6" fill="#3A76B8"/>
  </g>

  <!-- timeline: 07-02=160, 07-16=342, 08-27=740 (span 56d, ~10.36/day) -->
  <line x1="150" y1="330" x2="800" y2="330" stroke="url(#axis)" stroke-width="4" stroke-linecap="round"/>
  <text class="b" x="150" y="356">07-02</text>
  <text class="b" x="800" y="356" text-anchor="end">08-27</text>

  <g>
    <circle cx="160" cy="330" r="10" fill="url(#pin)"/>
    <line x1="160" y1="318" x2="160" y2="284" stroke="#D98F8F"/>
    <text class="ev" x="160" y="262">07-02 · Microsoft ×2</text>
    <text class="evs" x="160" y="282">共享上下文 + 事件路由</text>

    <circle cx="342" cy="330" r="10" fill="#FFFFFF" stroke="#E08A3C" stroke-width="3.5"/>
    <line x1="342" y1="342" x2="342" y2="376" stroke="#EDC08F"/>
    <text class="ev" x="342" y="404">07-16 · UiPath</text>
    <text class="evs" x="342" y="424">执行结果写向量记忆</text>

    <circle cx="740" cy="330" r="10" fill="url(#pin)"/>
    <line x1="740" y1="318" x2="740" y2="284" stroke="#D98F8F"/>
    <text class="ev" x="740" y="262">08-27 · Microsoft</text>
    <text class="evs" x="740" y="282">短期/工作/长期三级记忆</text>
  </g>
  <circle cx="150" cy="452" r="6" fill="url(#pin)"/><text class="b" x="162" y="457">微软三件套</text>
  <circle cx="266" cy="452" r="6" fill="#FFFFFF" stroke="#E08A3C" stroke-width="2.5"/><text class="b" x="278" y="457">UiPath</text>

  <!-- open-space chip -->
  <g>
    <rect x="470" y="428" width="380" height="46" rx="10" fill="#6E9B61" opacity="0.10"/>
    <rect x="470" y="428" width="5" height="46" rx="2.5" fill="#6E9B61"/>
    <text x="492" y="449" font-size="13" font-weight="700" fill="#4C7040">通用中间件高地已被双重占位</text>
    <text x="492" y="467" font-size="12.5" fill="#5D685F">专利圈平台编排，开源做通用组件</text>
  </g>

  <!-- opportunity cards -->
  <g>
    <rect x="64" y="492" width="336" height="140" rx="18" fill="#C24C4C" opacity="0.07"/>
    <rect x="64" y="492" width="336" height="6" rx="3" fill="#C24C4C"/>
    <rect x="92" y="522" width="44" height="28" rx="5" fill="#C24C4C"/>
    <circle cx="114" cy="536" r="7" fill="#F5F8F4"/>
    <text class="stat" x="152" y="554">3000–8000 元<tspan class="unit"> /次</tspan></text>
    <text class="evs" x="92" y="596">行业 schema 包私有部署实施费</text>

    <rect x="432" y="492" width="336" height="140" rx="18" fill="#3A76B8" opacity="0.08"/>
    <rect x="432" y="492" width="336" height="6" rx="3" fill="#3A76B8"/>
    <rect x="460" y="522" width="44" height="28" rx="14" fill="#3A76B8"/>
    <circle cx="482" cy="536" r="6" fill="#F5F8F4"/>
    <text class="stat" x="520" y="554">90,079<tspan class="unit"> star</tspan></text>
    <text class="evs" x="460" y="596">MCP servers（2026-09-05 实测）</text>

    <rect x="800" y="492" width="336" height="140" rx="18" fill="#E08A3C" opacity="0.10"/>
    <rect x="800" y="492" width="336" height="6" rx="3" fill="#E08A3C"/>
    <path d="M 828 552 l 10 -26 l 16 12 z" fill="#E08A3C"/>
    <circle cx="846" cy="530" r="4" fill="#F7E3CB"/>
    <text class="stat" x="888" y="554">数据不出内网<tspan class="unit"> 长尾</tspan></text>
    <text class="evs" x="828" y="596">医疗 / 金融 / 制造业私有化</text>
  </g>

  <text class="b" x="64" y="662">四件均为申请公开，不等于已授权 · 观点仅为机会判断，不构成投资建议 · Micropaper</text>
</svg>
