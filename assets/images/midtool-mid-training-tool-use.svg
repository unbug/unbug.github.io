  <rect x="200" y="535" width="119.8" height="16" fill="#0072B2"/>
  <text x="327" y="548" font-size="12" fill="#555">19.96（约 2.3 倍）</text>
  <line x1="200" y1="596" x2="440" y2="596" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="200" y1="596" x2="200" y2="600"/>
    <line x1="320" y1="596" x2="320" y2="600"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="200" y="616">0</text>
    <text x="320" y="616">20</text>
  </g>
  <text x="320" y="640" font-size="14" fill="#1A1B1E" text-anchor="middle">tau2-Bench overall Pass@1</text>

  <!-- MCP bars: x = 610 + 20*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="730" y1="500" x2="730" y2="596"/>
    <line x1="850" y1="500" x2="850" y2="596"/>
