  <line x1="610" y1="596" x2="850" y2="596" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="610" y1="596" x2="610" y2="600"/>
    <line x1="730" y1="596" x2="730" y2="600"/>
    <line x1="850" y1="596" x2="850" y2="600"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="610" y="616">0</text>
    <text x="730" y="616">6</text>
  </g>
  <text x="730" y="640" font-size="14" fill="#1A1B1E" text-anchor="middle">MCP-Universe overall pass rate（%）</text>

  <!-- right notes -->
  <text x="880" y="518" font-size="12.5" fill="#1A1B1E" font-weight="bold">同规模对照与边界</text>
  <text x="880" y="542" font-size="12" fill="#555">Dolmino-20BT 的 MCP-Universe</text>
  <text x="880" y="560" font-size="12" fill="#555">score 反而下降 −7.8</text>
  <text x="880" y="584" font-size="12" fill="#555">telecom 子集 Pass@1 仅 6.36</text>
  <text x="880" y="602" font-size="12" fill="#555">Web Search 全配置 0.00 / 0.00%</text>

  <!-- footnote -->
  <text x="60" y="662" font-size="11" fill="#767676">数据：arXiv:2608.20314，取自论文正文 Table 3–6（MidTool-Mix 共 20.3B token，与 Dolmino-20BT 规模相当，matched-budget 仅变量为构成）· 8B 参照：tau2-Bench 10.43 → 21.31，MCP-Universe 15.18 / 3.35% → 25.16 / 9.50% · 仅 Qwen3 两档 Base 验证 · 预印本未经同行评审</text>
</svg>
