<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">20.3B token 工具专用中间训练语料带来三基准一致提升；同规模通用语料几乎无效</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">BFCLv3 overall：官方参照与训练配置（分数）</text>

  <!-- gridlines x = 210 + 8.5*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="210" y1="126" x2="210" y2="372"/>
    <line x1="420" y1="126" x2="420" y2="372"/>
    <line x1="630" y1="126" x2="630" y2="372"/>
    <line x1="840" y1="126" x2="840" y2="372"/>
  </g>

  <text x="198" y="159" font-size="12.5" fill="#1A1B1E" text-anchor="end">官方 Qwen3-4B</text>
  <rect x="210" y="145" width="206.3" height="18" fill="#999999"/>
  <text x="424" y="159" font-size="12" fill="#555">24.27</text>

  <text x="198" y="201" font-size="12.5" fill="#1A1B1E" text-anchor="end">官方 Qwen3-8B</text>
  <rect x="210" y="187" width="224.8" height="18" fill="#999999"/>
  <text x="443" y="201" font-size="12" fill="#555">26.45</text>

  <text x="198" y="243" font-size="12.5" fill="#1A1B1E" text-anchor="end">Dolmino-20BT 相对提升</text>
  <rect x="210" y="229" width="28.9" height="18" fill="#999999"/>
  <text x="247" y="243" font-size="12" fill="#555">+3.4</text>

  <text x="198" y="285" font-size="12.5" fill="#1A1B1E" text-anchor="end">Qwen3-4B：SFT 基线</text>
  <rect x="210" y="271" width="337.7" height="18" fill="#999999"/>
  <text x="555" y="285" font-size="12" fill="#555">39.73</text>

  <text x="198" y="327" font-size="12.5" fill="#1A1B1E" text-anchor="end">Qwen3-4B：+ MidTool · SFT</text>
  <rect x="210" y="313" width="427.1" height="18" fill="#0072B2"/>
  <text x="645" y="327" font-size="12" fill="#555">50.25（Δ = +10.5 分）</text>

  <text x="198" y="369" font-size="12.5" fill="#1A1B1E" text-anchor="end">Qwen3-4B：+ MidTool · SFT+RL</text>
  <rect x="210" y="355" width="460.5" height="18" fill="#D55E00"/>
  <text x="679" y="369" font-size="12" fill="#555">54.18（RL 再 + 约 3.9 分）</text>

  <line x1="210" y1="372" x2="1020" y2="372" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="210" y1="372" x2="210" y2="376"/>
    <line x1="420" y1="372" x2="420" y2="376"/>
    <line x1="630" y1="372" x2="630" y2="376"/>
    <line x1="840" y1="372" x2="840" y2="376"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="210" y="392">0</text>
    <text x="420" y="392">25</text>
    <text x="630" y="392">50</text>
    <text x="840" y="392">75</text>
  </g>
  <text x="615" y="416" font-size="14" fill="#1A1B1E" text-anchor="middle">BFCLv3 overall 分数</text>
  <text x="210" y="438" font-size="12" fill="#555">mid-trained 的 4B（54.18）超过官方 8B（26.45）</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="482" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="482" font-size="15" fill="#1A1B1E">SFT 基线 → MidTool-Mix + SFT + RL（Qwen3-4B-Base）</text>

