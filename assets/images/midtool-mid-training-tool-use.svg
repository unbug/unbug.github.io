  <text x="598" y="519" font-size="12.5" fill="#1A1B1E" text-anchor="end">SFT 基线</text>
  <rect x="610" y="505" width="26.4" height="16" fill="#999999"/>
  <text x="644" y="518" font-size="12" fill="#555">pass rate 1.68%</text>
  <text x="598" y="549" font-size="12.5" fill="#1A1B1E" text-anchor="end">MidTool + SFT + RL</text>
  <rect x="610" y="535" width="158" height="16" fill="#0072B2"/>
