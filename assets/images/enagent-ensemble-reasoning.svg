<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">生成—剪枝—选择三智能体流水线较 4 种 SOTA 平均提升 10.22% Pass@1；集成 Trae Agent 后达 78.80%</text>

  <!-- ===== panel a: pipeline ===== -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">三智能体流水线与候选池规模（序列轴为处理阶段）</text>

  <text x="60" y="130" font-size="12" fill="#555">横轴为处理阶段序列，条块宽度不编码数值；候选池规模为 3 个起步 → 十几个 → 2–3 个</text>

  <!-- stage axis -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="130" y1="150" x2="130" y2="448"/>
    <line x1="600" y1="150" x2="600" y2="448"/>
    <line x1="1070" y1="150" x2="1070" y2="448"/>
  </g>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="130" y1="448" x2="130" y2="452"/>
    <line x1="600" y1="448" x2="600" y2="452"/>
    <line x1="1070" y1="448" x2="1070" y2="452"/>
  </g>
  <line x1="60" y1="448" x2="1140" y2="448" stroke="#1A1B1E" stroke-width="0.75"/>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="130" y="470">生成智能体</text>
    <text x="600" y="470">剪枝智能体</text>
    <text x="1070" y="470" text-anchor="end">选择智能体</text>
  </g>
  <text x="600" y="494" font-size="14" fill="#1A1B1E" text-anchor="middle">处理阶段（序列轴）</text>

  <!-- candidate pool bars -->
  <rect x="60" y="200" width="140" height="34" fill="#0072B2"/>
  <text x="130" y="221" font-size="12" fill="#FFFFFF" text-anchor="middle">3 个起步</text>
  <text x="130" y="186" font-size="12" fill="#555" text-anchor="start">3 种主流 LLM 各配一种提示策略</text>
  <line x1="210" y1="217" x2="480" y2="217" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="530" y="200" width="140" height="34" fill="#0072B2"/>
  <text x="600" y="221" font-size="12" fill="#FFFFFF" text-anchor="middle">十几个</text>
  <line x1="740" y1="217" x2="1000" y2="217" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="1000" y="200" width="140" height="34" fill="#D55E00"/>
  <text x="1070" y="221" font-size="12" fill="#FFFFFF" text-anchor="middle">2–3 个</text>

  <text x="600" y="310" font-size="12" fill="#555" text-anchor="middle">静态检查（语法）+ 简单测试（基本逻辑）过滤明显不可行方案</text>
  <text x="1070" y="300" font-size="12" fill="#555" text-anchor="middle">完整测试 + 代码质量、</text>
  <text x="1070" y="316" font-size="12" fill="#555" text-anchor="middle">兼容性等复杂评估，选出最终方案</text>

  <!-- ===== panel b: result ===== -->
  <text x="60" y="536" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="536" font-size="15" fill="#1A1B1E">SWE-bench Verified 上的 Pass@1（%）</text>

  <text x="60" y="560" font-size="12" fill="#555">纵轴为 Pass@1（%），下端为正文实测值 78.80% 对应的零基线；较 4 种 SOTA 方法平均提升 10.22% Pass@1，即可解决近八成真实仓库 Issue</text>

  <!-- bar on 0..100 scale: baseline y=620, 100 -> y=370 ; 78.80 -> y=380.6 -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="60" y1="380.6" x2="1140" y2="380.6"/>
  </g>
  <line x1="60" y1="620" x2="1140" y2="620" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="56" y1="620" x2="60" y2="620"/>
    <line x1="56" y1="380.6" x2="60" y2="380.6"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="52" y="624">0</text>
    <text x="52" y="384.6">78.80</text>
  </g>
  <rect x="150" y="380.6" width="90" height="239.4" fill="#D55E00"/>
  <text x="195" y="372" font-size="12" fill="#555" text-anchor="middle">78.80%</text>
  <text x="195" y="640" font-size="12.5" fill="#1A1B1E" text-anchor="middle">EnAgent + Trae Agent</text>
  <text x="270" y="640" font-size="12" fill="#555">正文未报告各 SOTA 基线具体数值，故只标注 EnAgent 实测值</text>

  <!-- footnote -->
  <text x="60" y="662" font-size="11" fill="#767676">数据：arXiv:2507.23370（ICSE 2026，天津大学与字节跳动）· Pass@1 为论文自测口径 · 面板 a 条块位于序列位置轴，宽度不代表数值 · 预印本未经同行评审</text>
</svg>
