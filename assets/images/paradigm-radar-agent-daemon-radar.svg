<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">五个观察点各有可证伪判据；事故实锤与厂商让步属于近端信号，治理同构属于远端信号</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">观察点判据与对应证据</text>

  <!-- header -->
  <g font-size="12" fill="#555555" font-weight="bold">
    <text x="60" y="136">观察点</text>
    <text x="280" y="136">落地判据</text>
    <text x="790" y="136">现有证据基础</text>
  </g>
  <line x1="60" y1="146" x2="1140" y2="146" stroke="#1A1B1E" stroke-width="0.75"/>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="60" y1="222" x2="1140" y2="222"/>
    <line x1="60" y1="298" x2="1140" y2="298"/>
    <line x1="60" y1="374" x2="1140" y2="374"/>
    <line x1="60" y1="450" x2="1140" y2="450"/>
  </g>

  <g font-size="12.5" fill="#1A1B1E">
    <rect x="60" y="163" width="14" height="14" fill="#D55E00"/>
    <text x="84" y="175">1 厂商让步</text>
    <text x="280" y="175">issue 48195 翻转默认 opt-in、daemon_auto_start 进官方文档，其一落地即让步</text>
    <text x="790" y="175">诉求已有 181 个 +1，仍 open</text>

    <rect x="60" y="239" width="14" height="14" fill="#0072B2"/>
    <text x="84" y="251">2 同构蔓延</text>
    <text x="280" y="251">Claude Code / Cursor / OpenCode 实测出常驻 + 小时级自更新 + 复制包三件套</text>
    <text x="790" y="251">Claude Code 已有 versions/ 驻留证据，差默认自更新实锤</text>

    <rect x="60" y="315" width="14" height="14" fill="#D55E00"/>
    <text x="84" y="327">3 第一次事故实锤</text>
    <text x="280" y="327">自动更新引入回归的有名有姓事件</text>
    <text x="790" y="327">issue 40969 已具备全部要素（60 秒 drain、超时 SIGKILL、无关闭方式）</text>

    <rect x="60" y="391" width="14" height="14" fill="#0072B2"/>
    <text x="84" y="403">4 发行版与企业反制</text>
    <text x="280" y="403">Arch/AUR 系统性加 --no-daemon 补丁；MDM 出现 daemon 禁用模板</text>
    <text x="790" y="403">已有 Nix 打包层补丁掉该行为的先例（whimblepop）</text>

    <rect x="60" y="467" width="14" height="14" fill="#999999"/>
    <text x="84" y="479">5 治理同构</text>
    <text x="280" y="479">agent daemon 纳入工作负载治理工具链（衔接第 13 期集群侧原语）</text>
    <text x="790" y="479">本机侧 daemon 目前不在任何台账上</text>
  </g>

  <line x1="60" y1="514" x2="1140" y2="514" stroke="#1A1B1E" stroke-width="0.75"/>

  <!-- ============ panel b ============ -->
  <text x="60" y="556" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="556" font-size="15" fill="#1A1B1E">信号远近分层</text>

  <g font-size="12.5">
    <rect x="300" y="540" width="14" height="14" fill="#D55E00"/>
    <text x="324" y="552" fill="#1A1B1E">近端：条件接近成熟，观察点 1、3 属此层</text>
    <rect x="640" y="540" width="14" height="14" fill="#0072B2"/>
    <text x="664" y="552" fill="#1A1B1E">中端：部分证据在手，观察点 2、4 属此层</text>
    <rect x="990" y="540" width="14" height="14" fill="#999999"/>
    <text x="1014" y="552" fill="#1A1B1E">远端：跨期趋势，观察点 5</text>
  </g>

  <!-- footnote -->
  <text x="60" y="600" font-size="11" fill="#767676">来源：openai/codex issue 区（48195、40969）与 HN 帖 50060694 评论 · 181 个 +1 为 2026-10-16 实测 · 分层为本文编辑判断口径，非论文统计 · 观察基于用户侧可见行为与公开 issue</text>
</svg>
