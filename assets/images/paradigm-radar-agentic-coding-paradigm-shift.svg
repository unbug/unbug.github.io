<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">SWE-bench Verified 成绩三年间从不足 6% 升至 50%–70%+；四个主流框架区间为 25%–60%+</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">开源框架整体成绩（正文叙述区间）</text>

  <!-- scale x = 300 + 8*v (0-100); major grid at 25/50/75 -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="460" y1="130" x2="460" y2="266"/>
    <line x1="620" y1="130" x2="620" y2="266"/>
    <line x1="780" y1="130" x2="780" y2="266"/>
    <line x1="860" y1="130" x2="860" y2="266"/>
  </g>

  <!-- 2023 <6 -->
  <text x="288" y="164" font-size="12.5" fill="#1A1B1E" text-anchor="end">2023 年（开源框架）</text>
  <rect x="300" y="150" width="48" height="18" fill="#999999"/>
  <polygon points="348,150 360,159 348,168" fill="#999999"/>
  <text x="368" y="164" font-size="12" fill="#555">不足 6%</text>

  <!-- 2025-2026 50-70+ -->
  <text x="288" y="236" font-size="12.5" fill="#1A1B1E" text-anchor="end">2025–2026 年</text>
  <rect x="700" y="222" width="160" height="18" fill="#0072B2"/>
  <polygon points="868,222 880,231 868,240" fill="#0072B2"/>
  <line x1="700" y1="219" x2="700" y2="243" stroke="#0072B2" stroke-width="0.75"/>
  <text x="888" y="236" font-size="12" fill="#555">50%–70%+，增幅超过 8 倍</text>

  <!-- value axis -->
  <line x1="300" y1="266" x2="860" y2="266" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="460" y1="266" x2="460" y2="270"/>
    <line x1="620" y1="266" x2="620" y2="270"/>
    <line x1="780" y1="266" x2="780" y2="270"/>
    <line x1="860" y1="266" x2="860" y2="270"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="290">零点</text>
    <text x="460" y="290">20%</text>
    <text x="620" y="290">40%</text>
    <text x="780" y="290">60%</text>
    <text x="860" y="290">70%</text>
  </g>
  <text x="600" y="314" font-size="14" fill="#1A1B1E" text-anchor="middle">SWE-bench Verified 成绩（百分比）</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="366" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="366" font-size="15" fill="#1A1B1E">四个主流框架成绩区间（正文「约为」值）</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="460" y1="390" x2="460" y2="588"/>
    <line x1="620" y1="390" x2="620" y2="588"/>
    <line x1="780" y1="390" x2="780" y2="588"/>
    <line x1="860" y1="390" x2="860" y2="588"/>
  </g>

  <!-- Claude Code 50-60+ -->
  <text x="288" y="420" font-size="12.5" fill="#1A1B1E" text-anchor="end">Claude Code（闭源）</text>
  <rect x="700" y="406" width="80" height="18" fill="#D55E00"/>
  <polygon points="788,406 800,415 788,424" fill="#D55E00"/>
  <line x1="700" y1="403" x2="700" y2="427" stroke="#D55E00" stroke-width="0.75"/>
  <text x="808" y="420" font-size="12" fill="#555">约 50%–60%+</text>

  <!-- OpenHands 40-50+ -->
  <text x="288" y="470" font-size="12.5" fill="#1A1B1E" text-anchor="end">OpenHands（开源）</text>
  <rect x="620" y="456" width="80" height="18" fill="#0072B2"/>
  <polygon points="708,456 720,465 708,474" fill="#0072B2"/>
  <line x1="620" y1="453" x2="620" y2="477" stroke="#0072B2" stroke-width="0.75"/>
  <text x="728" y="470" font-size="12" fill="#555">约 40%–50%+</text>

  <!-- Cursor 30-40 -->
  <text x="288" y="520" font-size="12.5" fill="#1A1B1E" text-anchor="end">Cursor Composer（闭源）</text>
  <rect x="540" y="506" width="80" height="18" fill="#D55E00"/>
  <line x1="540" y1="503" x2="540" y2="527" stroke="#D55E00" stroke-width="0.75"/>
  <line x1="620" y1="503" x2="620" y2="527" stroke="#D55E00" stroke-width="0.75"/>
  <text x="628" y="520" font-size="12" fill="#555">约 30%–40%</text>

  <!-- Aider 25-35 -->
  <text x="288" y="570" font-size="12.5" fill="#1A1B1E" text-anchor="end">Aider（开源）</text>
  <rect x="500" y="556" width="80" height="18" fill="#0072B2"/>
  <line x1="500" y1="553" x2="500" y2="577" stroke="#0072B2" stroke-width="0.75"/>
  <line x1="580" y1="553" x2="580" y2="577" stroke="#0072B2" stroke-width="0.75"/>
  <text x="588" y="570" font-size="12" fill="#555">约 25%–35%（Claude Sonnet 后端）</text>

  <line x1="300" y1="588" x2="860" y2="588" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="460" y1="588" x2="460" y2="592"/>
    <line x1="620" y1="588" x2="620" y2="592"/>
    <line x1="780" y1="588" x2="780" y2="592"/>
    <line x1="860" y1="588" x2="860" y2="592"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="612">零点</text>
    <text x="460" y="612">20%</text>
    <text x="620" y="612">40%</text>
    <text x="780" y="612">60%</text>
    <text x="860" y="612">70%</text>
  </g>
  <text x="600" y="636" font-size="14" fill="#1A1B1E" text-anchor="middle">SWE-bench Verified 成绩（百分比）</text>

  <g font-size="12" fill="#555">
    <rect x="950" y="406" width="12" height="10" fill="#0072B2"/>
    <text x="968" y="415">开源框架</text>
    <rect x="950" y="430" width="12" height="10" fill="#D55E00"/>
    <text x="968" y="439">闭源产品</text>
    <polygon points="950,455 960,460 950,465" fill="#555"/>
    <text x="968" y="464">正文以「+」表示上界未封顶</text>
  </g>

  <!-- footnote -->
  <text x="60" y="660" font-size="11" fill="#767676">口径：正文叙述的区间值（约为），非某次官方榜单定格分数 · 区间取自本文发文时正文描述，SWE-bench Verified 后续成绩未更新 · 横轴自零点起算</text>
</svg>
