<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a90d9"/>
      <stop offset="100%" style="stop-color:#e74c3c"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff">AI Paradigm Radar: Agentic Coding</text>
  <text x="400" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#a0b4c8">From Code Completion to Autonomous Software Engineering</text>
  
  <!-- SWE-bench stat -->
  <rect x="250" y="85" width="300" height="36" rx="6" fill="#0f3460" stroke="#4a90d9" stroke-width="1"/>
  <text x="400" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#ffffff">SWE-bench Verified: &lt;6% → 70%+ (8x growth)</text>
  
  <!-- Four stages timeline -->
  <line x1="80" y1="200" x2="720" y2="200" stroke="#4a90d9" stroke-width="3"/>
  
  <!-- Stage 1: Code Completion -->
  <circle cx="160" cy="200" r="35" fill="#2ecc71" opacity="0.8"/>
  <text x="160" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Code</text>
  <text x="160" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Completion</text>
  <text x="160" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#a0b4c8">Passive prediction</text>
  
  <!-- Arrow -->
  <polygon points="200,196 215,200 200,204" fill="#4a90d9"/>
  
  <!-- Stage 2: Code Chat -->
  <circle cx="320" cy="200" r="35" fill="#3498db" opacity="0.8"/>
  <text x="320" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Code</text>
  <text x="320" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Chat</text>
  <text x="320" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#a0b4c8">Text suggestions</text>
  
  <!-- Arrow -->
  <polygon points="360,196 375,200 360,204" fill="#4a90d9"/>
  
  <!-- Stage 3: Code Agent -->
  <circle cx="480" cy="200" r="35" fill="#e67e22" opacity="0.8"/>
  <text x="480" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Code</text>
  <text x="480" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Agent</text>
  <text x="480" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#a0b4c8">File system access</text>
  
  <!-- Arrow -->
  <polygon points="520,196 535,200 520,204" fill="#e74c3c"/>
  
  <!-- Stage 4: Autonomous Software Engineer -->
  <circle cx="640" cy="200" r="38" fill="#e74c3c" opacity="0.9"/>
  <text x="640" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Autonomous</text>
  <text x="640" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Software Engineer</text>
  <text x="640" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#a0b4c8">Full pipeline: plan-execute-verify</text>
  
  <!-- Bottom section: Key frameworks -->
  <rect x="60" y="275" width="680" height="100" rx="8" fill="#0f3460" stroke="#4a90d9" stroke-width="1"/>
  <text x="400" y="298" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Mainstream Frameworks</text>
  
  <!-- Framework boxes -->
  <rect x="85" y="310" width="140" height="50" rx="6" fill="#2c3e50"/>
  <text x="155" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Claude Code</text>
  <text x="155" y="348" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#a0b4c8">CLI-first, SWE-bench ~60%</text>
  
  <rect x="245" y="310" width="140" height="50" rx="6" fill="#2c3e50"/>
  <text x="315" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Cursor Composer</text>
  <text x="315" y="348" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#a0b4c8">IDE-native, SWE-bench ~40%</text>
  
  <rect x="405" y="310" width="140" height="50" rx="6" fill="#2c3e50"/>
  <text x="475" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">OpenHands</text>
  <text x="475" y="348" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#a0b4c8">Open source, SWE-bench ~50%</text>
  
  <rect x="565" y="310" width="140" height="50" rx="6" fill="#2c3e50"/>
  <text x="635" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Aider</text>
  <text x="635" y="348" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#a0b4c8">Minimalist, SWE-bench ~35%</text>
  
  <!-- Core loop diagram -->
  <rect x="200" y="125" width="400" height="55" rx="6" fill="#1a1a2e" stroke="#e74c3c" stroke-width="1"/>
  <text x="400" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#ffffff">Core Loop: Plan → Execute (file/terminal) → Verify (tests) → Self-correct</text>
  <text x="400" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#a0b4c8">LLM as decision hub, not just code generator</text>
</svg>
