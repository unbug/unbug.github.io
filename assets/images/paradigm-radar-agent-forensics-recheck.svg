  <text x="70" y="440" font-size="16" fill="#6B7280">读数：同期事件帖全部进入平台期（Wikimedia 307、沙箱帖 56 分不动），星数却继续向回放类集中——品类从叙事期进入工具期的标准换轨信号。</text>
  <text x="70" y="474" font-size="15" fill="#9CA3AF">「可核验证据」比「回放好看」更难卖：取证/核算类（ToolReplay、agentacct）斜率垫底，商业帖全部 &lt;50 分。</text>
