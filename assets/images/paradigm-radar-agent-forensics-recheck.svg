    <rect x="400" y="180" width="464" height="22" fill="#1F2937"/><rect x="864" y="180" width="32" height="22" fill="#C0392B"/>
    <text x="907" y="197" font-size="14" fill="#6B7280">901 → 1,024 · 破千</text>
    <rect x="400" y="226" width="1280" height="0" fill="none"/>
    <rect x="400" y="226" width="128" height="22" fill="#1F2937"/><rect x="528" y="226" width="8" height="22" fill="#C0392B"/>
    <text x="547" y="243" font-size="14" fill="#6B7280">2,483 → 2,637</text>
