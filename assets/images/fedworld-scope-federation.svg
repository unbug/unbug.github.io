<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">两个环境共 23 个客户的在线任务成功率均上升；重复动作错误下降约一半</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">在线任务成功率（%，固定控制器，11 个 tau-bench 客户 + 12 个 ALFWorld 客户）</text>

  <!-- gridlines: y = 420 - 5*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="120" y1="320" x2="560" y2="320"/>
    <line x1="120" y1="220" x2="560" y2="220"/>
    <line x1="120" y1="120" x2="560" y2="120"/>
  </g>

  <!-- tau-bench baseline 43.8 / FedWorld 62.4 -->
  <rect x="160" y="201" width="54" height="219" fill="#999999"/>
  <text x="187" y="193" font-size="12" fill="#555" text-anchor="middle">43.8</text>
  <text x="187" y="440" font-size="12.5" fill="#1A1B1E" text-anchor="middle">tau-bench 本地模型</text>
  <rect x="244" y="108" width="54" height="312" fill="#0072B2"/>
  <text x="271" y="100" font-size="12" fill="#555" text-anchor="middle">62.4</text>
  <text x="271" y="440" font-size="12.5" fill="#1A1B1E" text-anchor="middle">tau-bench FedWorld</text>
  <text x="271" y="84" font-size="12" fill="#555" text-anchor="middle">+11.2 个百分点</text>

  <!-- ALFWorld baseline 36.4 / FedWorld 59.3 -->
  <rect x="390" y="238" width="54" height="182" fill="#999999"/>
  <text x="417" y="230" font-size="12" fill="#555" text-anchor="middle">36.4</text>
  <text x="417" y="440" font-size="12.5" fill="#1A1B1E" text-anchor="middle">ALFWorld 本地模型</text>
  <rect x="474" y="123.5" width="54" height="296.5" fill="#0072B2"/>
  <text x="501" y="116" font-size="12" fill="#555" text-anchor="middle">59.3</text>
  <text x="501" y="458" font-size="12.5" fill="#1A1B1E" text-anchor="middle">ALFWorld FedWorld</text>
  <text x="501" y="100" font-size="12" fill="#555" text-anchor="middle">+14.6 个百分点</text>

  <!-- value axis -->
  <line x1="120" y1="420" x2="560" y2="420" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="116" y1="420" x2="120" y2="420"/>
    <line x1="116" y1="320" x2="120" y2="320"/>
    <line x1="116" y1="220" x2="120" y2="220"/>
    <line x1="116" y1="120" x2="120" y2="120"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="110" y="424">0</text>
    <text x="110" y="324">20</text>
    <text x="110" y="224">40</text>
    <text x="110" y="124">60</text>
  </g>
  <text x="72" y="90" font-size="14" fill="#555">在线任务成功率（%）</text>
  <g font-size="12" fill="#555">
    <rect x="360" y="118" width="12" height="10" fill="#999999"/>
    <text x="377" y="127">本地模型（基线）</text>
    <rect x="360" y="138" width="12" height="10" fill="#0072B2"/>
    <text x="377" y="147">FedWorld 聚合后</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="650" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="672" y="104" font-size="15" fill="#1A1B1E">错误与冗余行为相对下降（%）</text>

  <!-- rows: x = 790 + 4*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="930" y1="130" x2="930" y2="400"/>
    <line x1="1070" y1="130" x2="1070" y2="400"/>
  </g>

  <text x="778" y="163" font-size="12.5" fill="#1A1B1E" text-anchor="end">重复动作错误（tau-bench）</text>
  <rect x="790" y="150" width="192.4" height="18" fill="#999999"/>
  <text x="990" y="163" font-size="12" fill="#555">48.1</text>

  <text x="778" y="208" font-size="12.5" fill="#1A1B1E" text-anchor="end">重复动作错误（ALFWorld）</text>
  <rect x="790" y="195" width="200.8" height="18" fill="#999999"/>
  <text x="998" y="208" font-size="12" fill="#555">50.2</text>

  <text x="778" y="253" font-size="12.5" fill="#1A1B1E" text-anchor="end">多余步数（tau-bench）</text>
  <rect x="790" y="240" width="153.6" height="18" fill="#0072B2"/>
  <text x="951" y="253" font-size="12" fill="#555">38.4</text>

  <text x="778" y="298" font-size="12.5" fill="#1A1B1E" text-anchor="end">多余步数（ALFWorld）</text>
  <rect x="790" y="285" width="171.2" height="18" fill="#0072B2"/>
  <text x="969" y="298" font-size="12" fill="#555">42.8</text>

  <g font-size="12" fill="#555">
    <rect x="790" y="336" width="12" height="10" fill="#999999"/>
    <text x="807" y="345">重复动作错误下降</text>
    <rect x="940" y="336" width="12" height="10" fill="#0072B2"/>
    <text x="957" y="345">多余步数下降</text>
  </g>
  <text x="778" y="382" font-size="12" fill="#555">消融：去掉保护项伤本地精度，</text>
  <text x="778" y="400" font-size="12" fill="#555">去掉冲突项把一方规则强加另一方</text>

  <!-- value axis -->
  <line x1="790" y1="400" x2="1070" y2="400" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="790" y1="400" x2="790" y2="404"/>
    <line x1="930" y1="400" x2="930" y2="404"/>
    <line x1="1070" y1="400" x2="1070" y2="404"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="790" y="420">0</text>
    <text x="930" y="420">25</text>
    <text x="1070" y="420">50</text>
  </g>
  <text x="930" y="444" font-size="14" fill="#1A1B1E" text-anchor="middle">相对下降幅度（%）</text>

  <!-- protocol notes -->
  <text x="60" y="510" font-size="12" fill="#555">协议要点：跨客户仅交换低维模型参数与转移统计量，原始轨迹不外传；观测词表与动力学模型合订，奖励模型留本地。</text>
  <text x="60" y="532" font-size="12" fill="#555">冲突转移按客户与作用域标签路由分支，互斥规则隔离共存，不强迫任何一边让步。</text>

  <!-- footnote -->
  <text x="60" y="576" font-size="11" fill="#767676">数据：arXiv:2608.01561（FedWorld，23 客户：11 个 tau-bench、12 个 ALFWorld）· 固定控制器在线执行，论文自测口径 · 预印本未经同行评审</text>
</svg>
