<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <rect width="960" height="560" fill="#f4f7fb"/>
  <text x="480" y="44" fill="#1e3a5f" font-size="25" text-anchor="middle" font-weight="bold">三方主权拆解：三个问题从平凡「是」变成「说不清」</text>

  <!-- engineer -->
  <rect x="40" y="220" width="170" height="120" rx="14" fill="#ffffff" stroke="#2f6fb2" stroke-width="2.5"/>
  <circle cx="125" cy="258" r="20" fill="none" stroke="#2f6fb2" stroke-width="2.5"/>
  <circle cx="125" cy="250" r="8" fill="#2f6fb2"/>
  <text x="125" y="310" fill="#1e3a5f" font-size="17" text-anchor="middle" font-weight="bold">工程师</text>
  <text x="125" y="332" fill="#41627f" font-size="13" text-anchor="middle">本机的主人？</text>

  <!-- three sovereignty cards -->
  <g font-size="14">
    <!-- version -->
    <rect x="300" y="80" width="330" height="120" rx="12" fill="#ffffff" stroke="#a4553a" stroke-width="2.2"/>
    <text x="320" y="110" fill="#8a4a24" font-size="17" font-weight="bold">版本主权</text>
    <text x="320" y="136" fill="#41627f">跑的是不是你装的那个二进制？</text>
    <text x="320" y="160" fill="#6b7f96">npm update 升的是 CLI 壳，后端来自</text>
    <text x="320" y="180" fill="#6b7f96" font-family="Menlo, monospace">~/.codex/packages · 更新器每小时自行决定</text>
    <line x1="586" y1="92" x2="616" y2="120" stroke="#a4553a" stroke-width="2.5"/>
    <line x1="616" y1="92" x2="586" y2="120" stroke="#a4553a" stroke-width="2.5"/>

    <!-- process -->
    <rect x="300" y="222" width="330" height="120" rx="12" fill="#ffffff" stroke="#a4553a" stroke-width="2.2"/>
    <text x="320" y="252" fill="#8a4a24" font-size="17" font-weight="bold">进程主权</text>
    <text x="320" y="278" fill="#41627f">它什么时候结束，你说了算吗？</text>
    <text x="320" y="302" fill="#6b7f96">关窗不退（reparent PID 1）；更新时只有</text>
    <text x="320" y="322" fill="#6b7f96">60 秒 drain，超时 SIGKILL 杀在跑任务</text>
    <line x1="586" y1="234" x2="616" y2="262" stroke="#a4553a" stroke-width="2.5"/>
    <line x1="616" y1="234" x2="586" y2="262" stroke="#a4553a" stroke-width="2.5"/>

    <!-- config -->
    <rect x="300" y="364" width="330" height="120" rx="12" fill="#ffffff" stroke="#a4553a" stroke-width="2.2"/>
    <text x="320" y="394" fill="#8a4a24" font-size="17" font-weight="bold">配置主权</text>
    <text x="320" y="420" fill="#41627f">它带着谁的环境活到明天？</text>
    <text x="320" y="444" fill="#6b7f96">首会话 HTTPS_PROXY 钉死后所有会话；</text>
    <text x="320" y="464" fill="#6b7f96">#53547 把跨会话泄漏单独立案</text>
    <line x1="586" y1="376" x2="616" y2="404" stroke="#a4553a" stroke-width="2.5"/>
    <line x1="616" y1="376" x2="586" y2="404" stroke="#a4553a" stroke-width="2.5"/>
  </g>

  <!-- connectors engineer to cards -->
  <path d="M 210 250 C 255 250 255 140 300 140" stroke="#2f6fb2" stroke-width="2.2" fill="none"/>
  <path d="M 210 280 L 300 282" stroke="#2f6fb2" stroke-width="2.2" fill="none"/>
  <path d="M 210 310 C 255 310 255 424 300 424" stroke="#2f6fb2" stroke-width="2.2" fill="none"/>

  <!-- right: who holds it now -->
  <rect x="700" y="150" width="220" height="260" rx="14" fill="#16324f" stroke="#4da3ff" stroke-width="2.5"/>
  <text x="810" y="190" fill="#e8f1fc" font-size="18" text-anchor="middle" font-weight="bold">现在的持有者</text>
  <text x="810" y="218" fill="#7dc0ff" font-size="14" text-anchor="middle">厂商侧 daemon</text>
  <text x="810" y="238" fill="#7dc0ff" font-size="14" text-anchor="middle">+ 默认值</text>
  <g font-size="13" fill="#a9c6e8">
    <rect x="722" y="258" width="176" height="36" rx="8" fill="#1d3a5c"/>
    <text x="810" y="281" text-anchor="middle">更新器定版本</text>
    <rect x="722" y="304" width="176" height="36" rx="8" fill="#1d3a5c"/>
    <text x="810" y="327" text-anchor="middle">PID 1 定生死</text>
    <rect x="722" y="350" width="176" height="36" rx="8" fill="#1d3a5c"/>
    <text x="810" y="373" text-anchor="middle">首会话定环境</text>
  </g>
  <path d="M 630 140 L 700 220" stroke="#a4553a" stroke-width="2" fill="none"/>
  <path d="M 630 282 L 700 282" stroke="#a4553a" stroke-width="2" fill="none"/>
  <path d="M 630 424 L 700 344" stroke="#a4553a" stroke-width="2" fill="none"/>

  <text x="480" y="532" fill="#41627f" font-size="15" text-anchor="middle">基础设施用户的三项默认权利，在 0.157.0 之后需要逐项重新申索。</text>
</svg>
