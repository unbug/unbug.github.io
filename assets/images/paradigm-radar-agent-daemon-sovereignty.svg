<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 13px; letter-spacing: 3px; fill: #9A937F; }
      .rl { font-size: 15px; fill: #4C4A3F; }
      .v { font-size: 14.5px; font-weight: 700; fill: #1A1B1E; }
      .b { font-size: 12.5px; fill: #A29C88; }
      .dim { font-size: 17px; font-weight: 700; fill: #1A1B1E; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="#FBFAF7"/>
  <rect x="64" y="46" width="44" height="5" fill="#B5442E"/>

  <text class="k" x="64" y="86">AI 范式雷达 · 2026-10-16 · AGENT DAEMON</text>
  <text class="serif" x="64" y="134" font-size="37" font-weight="700" fill="#1A1B1E">当你的笔记本上住进别人家的守护进程</text>
  <text x="64" y="166" font-size="15.5" fill="#6E6A5C">三个曾经平凡回答「是」的问题，现在的答案是「说不清」</text>
  <line x1="64" y1="192" x2="1136" y2="192" stroke="#E5E1D4"/>

  <!-- column headers -->
  <text class="k" x="330" y="248" text-anchor="end">过去：工程师说了算</text>
  <text class="k" x="770" y="248">今天：默认值说了算</text>

  <!-- slope rows: left dots x=330 slate, right x=770 vermilion; rows y=300/380/460 -->
  <!-- version -->
  <text class="dim" x="64" y="306">版本主权</text>
  <text class="rl" x="64" y="328" font-size="12.5" fill="#8B8672">跑的是不是你装的那个二进制？</text>
  <circle cx="330" cy="300" r="7" fill="#3D5A73"/>
  <line x1="330" y1="300" x2="770" y2="300" stroke="#D8D3C4" stroke-width="1.5"/>
  <circle cx="770" cy="300" r="7" fill="#B5442E"/>
  <text class="v" x="794" y="296">npm update 只升 CLI 壳</text>
  <text class="b" x="794" y="316">后端在 ~/.codex/packages，更新器每小时自决</text>

  <!-- process -->
  <text class="dim" x="64" y="386">进程主权</text>
  <text class="rl" x="64" y="408" font-size="12.5" fill="#8B8672">它什么时候结束，你说了算吗？</text>
  <circle cx="330" cy="380" r="7" fill="#3D5A73"/>
  <line x1="330" y1="380" x2="770" y2="380" stroke="#D8D3C4" stroke-width="1.5"/>
  <circle cx="770" cy="380" r="7" fill="#B5442E"/>
  <text class="v" x="794" y="376">关窗不退，更新却会杀任务</text>
  <text class="b" x="794" y="396">reparent PID 1；升级只 drain 60 秒，超时 SIGKILL</text>

  <!-- config -->
  <text class="dim" x="64" y="466">配置主权</text>
  <text class="rl" x="64" y="488" font-size="12.5" fill="#8B8672">它带着谁的环境活到明天？</text>
  <circle cx="330" cy="460" r="7" fill="#3D5A73"/>
  <line x1="330" y1="460" x2="770" y2="460" stroke="#D8D3C4" stroke-width="1.5"/>
  <circle cx="770" cy="460" r="7" fill="#B5442E"/>
  <text class="v" x="794" y="456">首会话把环境钉给所有会话</text>
  <text class="b" x="794" y="476">HTTPS_PROXY 设定后终身生效；跨会话泄漏已立案 #53547</text>

  <line x1="64" y1="530" x2="1136" y2="530" stroke="#E5E1D4"/>

  <text class="serif" x="64" y="578" font-size="19" fill="#1A1B1E">三项权利的现行持有者：厂商侧 daemon 加默认值 —— 更新器定版本、PID 1 定生死、首会话定环境。</text>
  <text class="b" x="64" y="610">基础设施用户的这三项默认权利，在 0.157.0 之后需要逐项重新申索 —— 观察对象为用户侧可见行为与公开 issue，非厂商承诺</text>
  <text class="b" x="64" y="640">Micropaper · AI 范式雷达</text>
</svg>
