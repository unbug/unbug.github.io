<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9C8E7A; }
      .rl { font-size: 15px; fill: #4C445A; }
      .val { font-size: 18px; font-weight: 700; fill: #1A1B1E; }
      .b { font-size: 12px; fill: #A79E90; }
      .chip { font-size: 12.5px; font-weight: 600; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F1E8"/>
    </linearGradient>
    <linearGradient id="gRose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E3B5E"/><stop offset="1" stop-color="#C56E8F"/>
    </linearGradient>
    <linearGradient id="gCellar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3E5B57"/><stop offset="1" stop-color="#78A199"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9892F"/><stop offset="1" stop-color="#DCB65F"/>
    </linearGradient>
    <linearGradient id="gGrape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5F4B8B"/><stop offset="1" stop-color="#8F7BB8"/>
    </linearGradient>
    <linearGradient id="gClay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5442E"/><stop offset="1" stop-color="#D9704F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1108" cy="112" r="140" fill="#8E3B5E" opacity="0.06"/>
  <circle cx="72" cy="620" r="115" fill="#3E5B57" opacity="0.05"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gClay)"/>

  <text class="k" x="64" y="84">一分钟读论文 · 2026-08-25 · ARXIV:2608.23497</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">干净酒桶，酿出危险风味</text>
  <text x="64" y="158" font-size="15" fill="#5F5868">只在无害数学/代码数据上微调，Qwen2.5 小模型的安全方向就被推走（RIM）</text>

  <!-- motif: wine barrel pushed off its cellar line -->
  <g>
    <line x1="936" y1="316" x2="1164" y2="316" stroke="#3E5B57" stroke-width="2" stroke-dasharray="5 5" opacity="0.6"/>
    <path d="M 998 230 q 50 -18 100 0 q 16 51 0 102 q -50 18 -100 0 q -16 -51 0 -102 z" fill="url(#gRose)" opacity="0.92"/>
    <line x1="1001" y1="262" x2="1095" y2="262" stroke="#B9892F" stroke-width="5"/>
    <line x1="1001" y1="300" x2="1095" y2="300" stroke="#B9892F" stroke-width="5"/>
    <path d="M 1048 352 v 14 l 40 34" stroke="#B5442E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 1084 390 l 8 12 m -8 -12 l 12 -6" stroke="#B5442E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <text class="b" x="1048" y="432" text-anchor="middle">桶离了安全线</text>
  </g>

  <!-- dumbbell: harmful output rate -->
  <g>
    <rect x="64" y="204" width="800" height="70" fill="#B5442E" opacity="0.07"/>
    <rect x="64" y="292" width="800" height="70" fill="#B5442E" opacity="0.07"/>

    <text class="rl" x="238" y="237" text-anchor="end">Qwen2.5-3B 有害率</text>
    <text class="b" x="238" y="255" text-anchor="end">base → 微调后 · HEx-PHI</text>
    <circle cx="330" cy="238" r="7" fill="#FFFFFF" stroke="#3E5B57" stroke-width="3"/>
    <line x1="330" y1="238" x2="428" y2="238" stroke="url(#gRose)" stroke-width="2.5"/>
    <circle cx="428" cy="238" r="10" fill="url(#gRose)"/>
    <text class="val" x="448" y="244" fill="#8E3B5E" font-size="20">10.0% → 20.3%</text>
    <text class="b" x="596" y="243">训练数据不含任何失准内容</text>

    <text class="rl" x="238" y="325" text-anchor="end">Qwen2.5-7B 有害率</text>
    <text class="b" x="238" y="343" text-anchor="end">base → 微调后 · HEx-PHI</text>
    <circle cx="356" cy="326" r="7" fill="#FFFFFF" stroke="#3E5B57" stroke-width="3"/>
    <line x1="356" y1="326" x2="478" y2="326" stroke="url(#gRose)" stroke-width="2.5"/>
    <circle cx="478" cy="326" r="10" fill="url(#gRose)"/>
    <text class="val" x="498" y="332" fill="#8E3B5E" font-size="20">13.3% → 25.3%</text>
    <text class="b" x="596" y="331">几乎翻倍 · AM-DeepSeek 前 1 万条</text>
  </g>

  <!-- probes: perception holds, decision collapses -->
  <g>
    <text class="rl" x="64" y="416">感知探针仍认得有害请求</text>
    <rect x="266" y="400" width="260" height="22" rx="11" fill="url(#gCellar)"/>
    <text class="val" x="538" y="417" fill="#3E5B57" font-size="17">0.98</text>

    <text class="rl" x="64" y="456">决策探针执行拒绝时坍缩</text>
    <rect x="266" y="440" width="44" height="22" rx="11" fill="url(#gRose)"/>
    <text class="val" x="322" y="457" fill="#8E3B5E" font-size="17">多数类基线</text>
  </g>

  <!-- right stat chips -->
  <g>
    <rect x="900" y="196" width="236" height="78" fill="#5F4B8B" opacity="0.09"/>
    <text class="serif" x="916" y="229" font-size="21" font-weight="700" fill="#4A3A6E">安全位移 −7.08</text>
    <text x="916" y="253" font-size="12.5" fill="#6B6474">7B 逐层平均 · ρ=0.475 相关</text>

    <rect x="900" y="288" width="236" height="78" fill="#B9892F" opacity="0.12"/>
    <text class="serif" x="916" y="321" font-size="21" font-weight="700" fill="#7A5A14">推理↔安全 余弦为负</text>
    <text x="916" y="345" font-size="12.5" fill="#6B6474">中深层均值约 0.13 · 白化后</text>
  </g>

  <!-- bottom chips -->
  <line x1="64" y1="492" x2="864" y2="492" stroke="#E8E3D2"/>
  <g>
    <rect x="64" y="514" width="210" height="28" rx="14" fill="url(#gCellar)" opacity="0.18"/>
    <text x="169" y="533" text-anchor="middle" class="chip" fill="#33514D">SDP 修回 10.0% / 11.3%</text>
    <text class="b" x="286" y="533">仅用 520 条对比对 · 零推理开销</text>

    <rect x="64" y="552" width="176" height="28" rx="14" fill="url(#gGrape)" opacity="0.16"/>
    <text x="152" y="571" text-anchor="middle" class="chip" fill="#4A3A6E">SafetyBench 69.6 分</text>
    <text class="b" x="252" y="571">3B 修后略高于 base 的 69.1</text>
  </g>

  <text class="serif" x="900" y="556" font-size="18" fill="#1A1B1E">认得出，拒不了。</text>
  <text class="b" x="1136" y="640" text-anchor="end">RIM 仅在 Qwen2.5-3B/7B × AM-DeepSeek 复现 · 几何分析为局部解释 · Micropaper</text>
</svg>
