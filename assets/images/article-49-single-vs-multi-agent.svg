<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">推理 token 预算相等时，单智能体是多跳推理性能最优且耗 token 最少的默认架构</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">预算匹配对比结果：机制示意（正文仅报告定性结论，无数值轴）</text>

  <!-- single agent loop -->
  <rect x="140" y="180" width="300" height="110" fill="none" stroke="#D55E00" stroke-width="2"/>
  <text x="290" y="215" font-size="13" fill="#1A1B1E" text-anchor="middle">单智能体</text>
  <text x="290" y="238" font-size="12" fill="#555555" text-anchor="middle">统一上下文，中间结论全部直接可见</text>
  <text x="290" y="260" font-size="12" fill="#555555" text-anchor="middle">无跨 agent 转述环节</text>

  <!-- multi agent chain -->
  <g fill="none" stroke="#999999" stroke-width="1.5">
    <rect x="700" y="180" width="80" height="60"/>
    <rect x="840" y="180" width="80" height="60"/>
    <rect x="980" y="180" width="80" height="60"/>
  </g>
  <g font-size="12" fill="#1A1B1E" text-anchor="middle">
    <text x="740" y="215">Agent 1</text>
    <text x="880" y="215">Agent 2</text>
    <text x="1020" y="215">Agent n</text>
  </g>
  <g stroke="#999999" stroke-width="1.5" fill="none">
    <line x1="780" y1="210" x2="832" y2="210"/>
    <polygon points="832,206 840,210 832,214" fill="#999999" stroke="none"/>
    <line x1="920" y1="210" x2="972" y2="210"/>
    <polygon points="972,206 980,210 972,214" fill="#999999" stroke="none"/>
  </g>
  <g font-size="12" fill="#555555" text-anchor="middle">
    <text x="806" y="196">转述</text>
    <text x="946" y="196">摘要</text>
  </g>
  <text x="880" y="270" font-size="12" fill="#555555" text-anchor="middle">每次信息传递构成额外信息瓶颈</text>

  <!-- data processing inequality note -->
  <text x="290" y="340" font-size="12" fill="#1A1B1E" text-anchor="middle">数据处理不等式：信息经多步处理不增加</text>
  <text x="290" y="360" font-size="12" fill="#555555" text-anchor="middle">链条越长，细节损耗越多</text>

  <text x="60" y="430" font-size="12" fill="#555555">实验覆盖：3 个模型系列（Qwen3-30B-A3B、DeepSeek-R1-Distill-Llama-70B、Gemini-2.5）</text>
  <text x="60" y="450" font-size="12" fill="#555555">× 2 个多跳推理数据集（FRAMES、MuSiQue）× 5 种多智能体架构</text>

  <line x1="60" y1="480" x2="1140" y2="480" stroke="#D9D9D9" stroke-width="0.5"/>

  <!-- ============ panel b ============ -->
  <text x="60" y="498" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="498" font-size="15" fill="#1A1B1E">上下文掩码比例与性能领先方（单点实测，序列位置轴）</text>

  <!-- sequence axis: masked ratio 0 -> 0.7 -->
  <line x1="200" y1="575" x2="1000" y2="575" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="200" y1="575" x2="200" y2="579"/>
    <line x1="1000" y1="575" x2="1000" y2="579"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E">
    <text x="200" y="599" text-anchor="middle">0</text>
    <text x="1000" y="599" text-anchor="middle">0.7</text>
  </g>
  <text x="600" y="624" font-size="14" fill="#1A1B1E" text-anchor="middle">上下文掩码比例</text>

  <text x="440" y="542" font-size="12" fill="#555555" text-anchor="middle">轻度退化：单智能体仍领先</text>
  <circle cx="1000" cy="575" r="6" fill="#D55E00"/>
  <text x="1000" y="527" font-size="12" fill="#D55E00" text-anchor="middle">重度退化：七成上下文被遮蔽</text>
  <text x="1000" y="545" font-size="12" fill="#1A1B1E" text-anchor="middle">多智能体开始反超</text>

  <!-- footnote -->
  <text x="60" y="642" font-size="11" fill="#767676">数据：arXiv:2604.02460 · 论文自测口径 · 两面板均为机制/序列示意，正文未报告逐点性能数值，故不画数值轴 · 预印本未经同行评审</text>
</svg>
