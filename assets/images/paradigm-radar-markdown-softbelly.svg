<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Helvetica Neue, Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1200" height="560" fill="#F4F7FB"/>
  <text x="600" y="42" font-size="25" font-weight="bold" fill="#1E3A5F" text-anchor="middle">三面软肋与各自的破局条件（楼层与实测均有出处）</text>
  <g font-size="15">
    <rect x="50" y="70" width="360" height="200" rx="14" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
    <text x="72" y="100" font-size="16.5" font-weight="bold" fill="#C0392B">① 鸡蛋问题</text>
    <text x="72" y="128" fill="#7B241C">消费端 ChatGPT browse /</text>
    <text x="72" y="152" fill="#7B241C">Gemini / Claude.ai web 全 No；</text>
    <text x="72" y="176" fill="#7B241C">「top 4 不用我就不支持」</text>
    <text x="72" y="206" fill="#41627F">破局：任一消费端发头即解；</text>
    <text x="72" y="232" fill="#41627F">矩阵转前端渲染 → 连复核都难</text>
    <rect x="430" y="70" width="360" height="200" rx="14" fill="#FDF6E3" stroke="#B7791F" stroke-width="2"/>
    <text x="452" y="100" font-size="16.5" font-weight="bold" fill="#8B5E1A">② 中间层替代</text>
    <text x="452" y="128" fill="#1E3A5F">Firecrawl / Exa 抓取时已转</text>
    <text x="452" y="152" fill="#1E3A5F">Markdown：买清洗比等全网</text>
    <text x="452" y="176" fill="#1E3A5F">改服务器现实（2 月即有代理帖）</text>
    <text x="452" y="206" fill="#41627F">破局：平台默认（CF/Vercel/</text>
    <text x="452" y="232" fill="#41627F">Netlify 零配置）让改造趋零成本</text>
    <rect x="810" y="70" width="340" height="200" rx="14" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
    <text x="832" y="100" font-size="16.5" font-weight="bold" fill="#C0392B">③ 激励错位</text>
    <text x="832" y="128" fill="#7B241C">愿喂搜索换流量，怕被 Agent</text>
    <text x="832" y="152" fill="#7B241C">白嫖：Time 投广告变体（传闻）；</text>
    <text x="832" y="176" fill="#7B241C">MD 内嵌 HTML 的注入人看不见</text>
    <text x="832" y="206" fill="#41627F">破局：消毒规范或 CVE 倒逼；</text>
    <text x="832" y="232" fill="#41627F">「净版也给人读」是反直觉盟友</text>
  </g>
  <rect x="50" y="300" width="1100" height="120" rx="14" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2.5"/>
  <text x="600" y="338" font-size="17" font-weight="bold" fill="#1E3A5F" text-anchor="middle">协议原教旨之争（与软肋正交，但决定标准化速度）</text>
  <text x="600" y="370" font-size="15" fill="#41627F" text-anchor="middle">Fielding 引述派：别拿每请求一堆偏好头换灵活性，一 URL 多表示害死复制链接与存档 ｜ 9dev 派：「要不到就退 HTML」在 REST 内自洽，Link 头可解可枚举性</text>
  <rect x="50" y="448" width="1100" height="72" rx="14" fill="#EAF6EF" stroke="#1E7A45" stroke-width="2"/>
  <text x="600" y="480" font-size="16" font-weight="bold" fill="#1E7A45" text-anchor="middle">当前判据：编码 Agent 场景已成立；消费端翻绿前，它是「新 SEO 接口」的候补而非定局</text>
  <text x="600" y="506" font-size="14.5" fill="#2C6046" text-anchor="middle">先例：llms.txt 静态清单（206 分帖）→ 动态协商是第二次冲锋；两次都卡在同一个消费端问题上</text>
</svg>
