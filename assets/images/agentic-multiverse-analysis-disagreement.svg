<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="-apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <text x="600" y="62" font-size="28" font-weight="700" fill="#1A1B1E" text-anchor="middle">分歧的三层：互评无效，范文靠模仿</text>
  <text x="120" y="128" font-size="19" fill="#767676">150 个 Agent 分歧幅度（试点三阶段，示意）</text>
  <text x="120" y="196" font-size="20" fill="#333333">独立分析</text>
  <rect x="360" y="172" width="620" height="44" fill="#0072B2"/>
  <text x="1000" y="203" font-size="20" fill="#555555">分歧已存在</text>
  <text x="120" y="286" font-size="20" fill="#333333">AI 互评之后</text>
  <rect x="360" y="262" width="610" height="44" fill="#999999"/>
  <text x="990" y="293" font-size="20" fill="#555555">几乎不变</text>
  <text x="120" y="376" font-size="20" fill="#333333">看范文之后</text>
  <rect x="360" y="352" width="62" height="44" fill="#D55E00"/>
  <text x="442" y="383" font-size="24" font-weight="700" fill="#1A1B1E">塌缩 80%～99%</text>
  <text x="442" y="411" font-size="18" fill="#555555">模仿范文的选择，不是分析收敛</text>
  <line x1="360" y1="432" x2="360" y2="156" stroke="#1A1B1E" stroke-width="1.5"/>
  <text x="120" y="500" font-size="19" fill="#767676">主导分叉对跨 Agent 方差的解释度（每个假设总有一个）</text>
  <rect x="360" y="524" width="589" height="44" fill="#0072B2"/>
  <text x="969" y="555" font-size="24" font-weight="700" fill="#1A1B1E">最高 95%</text>
  <text x="120" y="556" font-size="20" fill="#333333">分歧集中在少数</text>
  <text x="120" y="586" font-size="20" fill="#333333">可指认的方法选择</text>
  <text x="600" y="648" font-size="18" fill="#767676" text-anchor="middle">AMA 审计：10 篇复现包共 1,755 个规格全部复现，5 篇稳健性声明翻车</text>
</svg>
