<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="76" font-size="16" fill="#1A1B1E">熵基动态模型选择使每百万 token 成本从 5.94 美元降至 0.12 美元，降幅 98%</text>

  <!-- ============ panel a: cost comparison ============ -->
  <text x="60" y="130" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="130" font-size="15" fill="#1A1B1E">每百万 token 成本（美元，10 亿 token 总成本标注于条旁）</text>

  <!-- grid: x = 320 + 74*v, v in USD/M tokens -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="764" y1="160" x2="764" y2="320"/>
    <line x1="986" y1="160" x2="986" y2="320"/>
  </g>

  <!-- rows -->
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="308" y="205">纯 Claude Opus 4.5</text>
    <text x="308" y="289">CAI（k=2 配置）</text>
  </g>

  <!-- Claude Opus 4.5: 5.94 -->
  <rect x="320" y="188" width="439.56" height="22" fill="#999999"/>
  <text x="768" y="205" font-size="12" fill="#555">5.94 美元，10 亿 token 需 5,940 美元</text>

  <!-- CAI: 0.12 (protagonist) -->
  <rect x="320" y="272" width="8.88" height="22" fill="#D55E00"/>
  <text x="338" y="289" font-size="12" fill="#555">0.12 美元，10 亿 token 只需 119 美元</text>

  <!-- x axis -->
  <line x1="320" y1="320" x2="986" y2="320" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="320" y1="320" x2="320" y2="324"/>
    <line x1="764" y1="320" x2="764" y2="324"/>
    <line x1="986" y1="320" x2="986" y2="324"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E">
    <text x="314" y="342" text-anchor="end">0</text>
    <text x="764" y="342" text-anchor="middle">4</text>
    <text x="986" y="342" text-anchor="middle">6</text>
  </g>
  <text x="653" y="368" font-size="14" fill="#1A1B1E" text-anchor="middle">每百万 token 成本（美元）</text>

  <!-- ============ panel b: Neurogrid CTF scores ============ -->
  <text x="60" y="418" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="418" font-size="15" fill="#1A1B1E">Neurogrid CTF（155 队）：达到 10,000 分的用时对比</text>

  <!-- grid: y = 588 - 0.014387*s -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="180" y1="444.19" x2="900" y2="444.19"/>
  </g>

  <!-- CAI reaches 10,000 between 0 and 64 minutes (64 min already at 10,517) -->
  <polyline points="180,588 362,444.19" fill="none" stroke="#D55E00" stroke-width="2"/>
  <circle cx="362" cy="444.19" r="3.5" fill="#D55E00"/>
  <text x="374" y="428" font-size="12" fill="#555">CAI：64 分钟内已达 10,517 分</text>

  <!-- human lower bound: needs >= 24 hours (position along x is illustrative) -->
  <polyline points="180,588 600,588 1026,444.19" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="1034,444.19 1022,438.19 1022,450.19" fill="#999999"/>
  <text x="470" y="576" font-size="12" fill="#555">人类团队：需 24 小时以上</text>

  <!-- x axis (sequence-position axis) -->
  <line x1="180" y1="588" x2="900" y2="588" stroke="#1A1B1E" stroke-width="0.75"/>

  <!-- y axis -->
  <line x1="180" y1="430" x2="180" y2="588" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="180" y1="588" x2="176" y2="588"/>
    <line x1="180" y1="444.19" x2="176" y2="444.19"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="170" y="592">0</text>
    <text x="170" y="448">10,000</text>
  </g>
  <text x="104" y="509" font-size="14" fill="#1A1B1E" transform="rotate(-90 104 509)" text-anchor="middle">累计得分（分）</text>

  <text x="180" y="610" font-size="12" fill="#555">横轴为用时先后顺序的位置轴（非等比刻度）：CAI 在 64 分钟内越过 10,000 分，人类团队需 24 小时以上</text>

  <!-- footnote -->
  <text x="60" y="642" font-size="11" fill="#767676">数据：arXiv:2512.02654（论文自测口径）· CAI 以 33,917 分、领先 1,925 分夺冠 · 面板 b 虚线为人类用时下限的方向示意、非实测轨迹；纵轴为数值轴，横轴为序列位置轴 · 预印本未经同行评审</text>
</svg>
