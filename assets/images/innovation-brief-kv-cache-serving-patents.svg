  <text x="60" y="536" font-size="12" fill="#767676">口径：a 轴为公开/授权节奏序位（间距示意非等距日历）；六件明细见正文与 References。已授权 1 件、公开申请 5 件，申请人六家互不重叠。</text>
  <text x="60" y="562" font-size="12" fill="#767676">检索通道 Google Patents（经代理），逐件详情页核验于 2026-10-31；b 面板「空位」为检索未见对应主题专利，非法律意见。</text>
