<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">单流自回归架构在真机微调与 BEHAVIOR 基准上均高于对照系统；真机每配置仅 15 episodes</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">真机微调成功率（%，R1-Lite / R1-Pro，4 任务 × 6 配置，每配置 15 episodes）</text>

  <!-- gridlines: y = 420 - 4*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="120" y1="320" x2="560" y2="320"/>
    <line x1="120" y1="220" x2="560" y2="220"/>
    <line x1="120" y1="120" x2="560" y2="120"/>
  </g>

  <!-- bars: G0.5 76.7 / pi0.5 53.3 / GR00T 24.4 -->
  <rect x="160" y="113.2" width="70" height="306.8" fill="#D55E00"/>
  <text x="195" y="105" font-size="12" fill="#555" text-anchor="middle">76.7</text>
  <text x="195" y="440" font-size="12.5" fill="#1A1B1E" text-anchor="middle">G0.5</text>

  <rect x="300" y="206.8" width="70" height="213.2" fill="#999999"/>
  <text x="335" y="199" font-size="12" fill="#555" text-anchor="middle">53.3</text>
  <text x="335" y="440" font-size="12.5" fill="#1A1B1E" text-anchor="middle">π0.5</text>

  <rect x="440" y="322.4" width="70" height="97.6" fill="#999999"/>
  <text x="475" y="314" font-size="12" fill="#555" text-anchor="middle">24.4</text>
  <text x="475" y="440" font-size="12.5" fill="#1A1B1E" text-anchor="middle">GR00T-N1.7</text>

  <!-- value axis -->
  <line x1="120" y1="420" x2="560" y2="420" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="116" y1="420" x2="120" y2="420"/>
    <line x1="116" y1="320" x2="120" y2="320"/>
    <line x1="116" y1="220" x2="120" y2="220"/>
    <line x1="116" y1="120" x2="120" y2="120"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="110" y="424">0</text>
    <text x="110" y="324">25</text>
    <text x="110" y="224">50</text>
    <text x="110" y="124">75</text>
  </g>
  <text x="72" y="90" font-size="14" fill="#555">成功率（%）</text>
  <text x="195" y="82" font-size="12" fill="#555" text-anchor="middle">G0.5 比 π0.5 高 23.4 个百分点（76.7 减 53.3）</text>

  <!-- ============ panel b ============ -->
  <text x="650" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="672" y="104" font-size="15" fill="#1A1B1E">2025 BEHAVIOR Challenge 成功率（%，50 个长程家庭任务）</text>

  <!-- rows: x = 830 + 4*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="930" y1="130" x2="930" y2="330"/>
    <line x1="1030" y1="130" x2="1030" y2="330"/>
  </g>

  <text x="818" y="163" font-size="12.5" fill="#1A1B1E" text-anchor="end">G0.5（通用 checkpoint）</text>
  <rect x="830" y="150" width="125.6" height="18" fill="#D55E00"/>
  <text x="963" y="163" font-size="12" fill="#555">31.4</text>

  <text x="818" y="203" font-size="12.5" fill="#1A1B1E" text-anchor="end">G0.5（仅训练 1 epoch）</text>
  <rect x="830" y="190" width="116" height="18" fill="#0072B2"/>
  <text x="953" y="203" font-size="12" fill="#555">29.0</text>

  <text x="818" y="243" font-size="12.5" fill="#1A1B1E" text-anchor="end">π0.5</text>
  <rect x="830" y="230" width="105.2" height="18" fill="#999999"/>
  <text x="943" y="243" font-size="12" fill="#555">26.3</text>

  <text x="818" y="283" font-size="12.5" fill="#1A1B1E" text-anchor="end">RLC（赛事冠军方案）</text>
  <rect x="830" y="270" width="104.4" height="18" fill="#999999"/>
  <text x="942" y="283" font-size="12" fill="#555">26.1</text>

  <!-- value axis -->
  <line x1="830" y1="330" x2="1030" y2="330" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="830" y1="330" x2="830" y2="334"/>
    <line x1="930" y1="330" x2="930" y2="334"/>
    <line x1="1030" y1="330" x2="1030" y2="334"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="830" y="350">0</text>
    <text x="930" y="350">12.5</text>
    <text x="1030" y="350">25</text>
  </g>
  <text x="930" y="374" font-size="14" fill="#1A1B1E" text-anchor="middle">成功率（%）</text>

  <!-- architecture note -->
  <text x="650" y="410" font-size="12" fill="#555">架构：单一 transformer decoder 在同一自回归流中交错输出推理与动作 token；</text>
  <text x="650" y="428" font-size="12" fill="#555">跨本体 tokenizer 覆盖 14 种本体、统一 27 维动作空间；视觉记忆注入数秒级历史观测。</text>

  <!-- other benchmarks -->
  <text x="650" y="172" font-size="12" fill="#555">G0.5 单 checkpoint 比冠军方案 RLC 高 5.3 个百分点（31.4 减 26.1）；仅训 1 epoch 已高于 π0.5</text>
  <text x="60" y="492" font-size="12" fill="#555">其余评测（论文自报）：DROID 后训练零样本迁移 82.5%（Franka 臂、10 任务）· LIBERO 98.9% · RoboTwin 2.0 93.3% · SimplerEnv-Bridge 87.3%</text>

  <!-- footnote -->
  <text x="60" y="524" font-size="11" fill="#767676">数据：arXiv:2608.11739v1（G0.5，银河通用）· 真机为团队自报数据、每配置 15 episodes；「7 independent regimes」混合不同评测协议，横向可比性有限 · 预印本未经同行评审</text>
</svg>
