  </g>

  <!-- footnote -->
  <text x="60" y="660" font-size="11" fill="#767676">数据：arXiv:2608.24876（Recuris）与 arXiv:2608.24804（StarHarness），论文自测口径 · 模型权重全程未动 · Terminal-Bench 置信区间含零，正文自述为方向性证据 · 预印本未经同行评审</text>
</svg>
