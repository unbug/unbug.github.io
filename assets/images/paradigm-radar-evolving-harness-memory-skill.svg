  <g font-size="12" fill="#555">
    <circle cx="960" cy="150" r="5.5" fill="#FFFFFF" stroke="#999999" stroke-width="1.5"/>
    <text x="972" y="154">基线</text>
    <circle cx="960" cy="174" r="6" fill="#D55E00"/>
    <text x="972" y="178">加入/进化后（τ²-Retail）</text>
    <circle cx="960" cy="198" r="6" fill="#0072B2"/>
