<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">恶意意图拆散到多个孤立请求后仍可组合成注入；不安全响应率 34% 至 40%，Claude 3.5 Haiku 安全响应率超过 90%</text>

  <!-- ============ panel a: mechanism schematic ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">三轮拆分示意（机制示意，非量化数据）</text>

  <!-- state labels -->
  <text x="180" y="142" font-size="12.5" fill="#555" text-anchor="middle">孤立请求</text>
  <text x="540" y="142" font-size="12.5" fill="#555" text-anchor="middle">无状态 API</text>
  <text x="940" y="142" font-size="12.5" fill="#555" text-anchor="middle">组合结果</text>

  <!-- request boxes: each 240x64 at y=160 -->
  <g fill="none" stroke-width="1.5">
    <rect x="60" y="160" width="240" height="64" stroke="#999999"/>
    <rect x="60" y="252" width="240" height="64" stroke="#999999"/>
    <rect x="60" y="344" width="240" height="64" stroke="#999999"/>
  </g>
  <g font-size="14" fill="#1A1B1E" text-anchor="middle">
    <text x="180" y="187">第一轮</text>
    <text x="180" y="209" font-size="12.5" fill="#555">请求忽略先前安全规则</text>
    <text x="180" y="279">第二轮</text>
    <text x="180" y="301" font-size="12.5" fill="#555">要求模型扮演特定角色</text>
    <text x="180" y="371">第三轮</text>
    <text x="180" y="393" font-size="12.5" fill="#555">情境下提出原被拒请求</text>
  </g>

  <!-- arrows into model -->
  <g stroke="#999999" stroke-width="1.5" fill="none">
    <path d="M 270 192 L 426 272"/>
    <path d="M 270 284 L 426 288"/>
    <path d="M 270 376 L 426 304"/>
  </g>
  <g fill="#999999">
    <polygon points="426,272 414.5,271.5 419.9,280.6"/>
    <polygon points="426,288 414,284 414,292"/>
    <polygon points="426,304 419.9,295.4 414.5,304.5"/>
  </g>

  <!-- model box -->
  <rect x="426" y="220" width="228" height="140" fill="none" stroke="#D55E00" stroke-width="2"/>
  <g font-size="14" fill="#1A1B1E" text-anchor="middle">
    <text x="540" y="252">大语言模型（无状态 API）</text>
  </g>
  <g font-size="12.5" fill="#555" text-anchor="middle">
    <text x="540" y="284">单轮请求各自看似无害</text>
    <text x="540" y="306">上下文丢失：前后请求</text>
    <text x="540" y="324">无法被关联识别</text>
  </g>

  <!-- arrow to result -->
  <line x1="654" y1="290" x2="704" y2="290" stroke="#D55E00" stroke-width="1.5"/>
  <polygon points="704,290 692,286 692,294" fill="#D55E00"/>

  <!-- result boxes -->
  <rect x="704" y="204" width="300" height="80" fill="none" stroke="#D55E00" stroke-width="1.5"/>
  <g font-size="14" fill="#1A1B1E" text-anchor="middle">
    <text x="854" y="232">三轮组合 = 有效提示注入</text>
    <text x="854" y="258" font-size="12.5" fill="#555">逐步绕过安全策略</text>
  </g>
  <rect x="704" y="300" width="300" height="80" fill="none" stroke="#999999" stroke-width="1.5"/>
  <g font-size="12.5" fill="#555" text-anchor="middle">
    <text x="854" y="328">有状态对话可识别跨轮操纵</text>
    <text x="854" y="350">关键安全判断宜放在服务端</text>
  </g>

  <!-- panel a caption -->
  <text x="60" y="452" font-size="12" fill="#555">拆分口径：论文描述的三轮攻击流程；灰=单轮无害输入与对照，朱=跨轮组合后的注入路径。</text>

  <!-- ============ panel b: unsafe vs safe response dumbbell ============ -->
  <text x="60" y="506" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="506" font-size="15" fill="#1A1B1E">正文报告的两个响应率（%）</text>

  <!-- vertical value axis at x=340, y = 540 - (128/90)*v -->
  <line x1="340" y1="402" x2="340" y2="540" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="340" y1="540" x2="800" y2="540"/>
    <line x1="340" y1="476" x2="800" y2="476"/>
    <line x1="340" y1="412" x2="800" y2="412"/>
  </g>
  <!-- ticks -->
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="340" y1="540" x2="336" y2="540"/>
    <line x1="340" y1="476" x2="336" y2="476"/>
    <line x1="340" y1="412" x2="336" y2="412"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="330" y="544">0</text>
    <text x="330" y="480">40</text>
    <text x="330" y="416">90</text>
  </g>
  <text x="248" y="490" transform="rotate(-90 248 490)" font-size="14" fill="#1A1B1E" text-anchor="middle">响应率（%）</text>

  <!-- Gemini unsafe range 34-40 -->
  <line x1="470" y1="483.3" x2="470" y2="497.8" stroke="#D55E00" stroke-width="2"/>
  <circle cx="470" cy="497.8" r="6" fill="none" stroke="#D55E00" stroke-width="1.5"/>
  <circle cx="470" cy="483.3" r="6" fill="#D55E00"/>
  <text x="488" y="494" font-size="12" fill="#555">Gemini 系列不安全响应率 34–40，论文称最脆弱</text>

  <!-- Claude safe >90 -->
  <circle cx="700" cy="412" r="6" fill="#999999"/>
  <polygon points="700,398 694,410 706,410" fill="#999999"/>
  <text x="716" y="416" font-size="12" fill="#555">安全响应率超过 90（正文下限，箭头向上）</text>

  <g font-size="12" fill="#555">
    <circle cx="850" cy="548" r="5" fill="#999999"/>
    <text x="862" y="553">实心=正文报告值</text>
    <circle cx="850" cy="570" r="5" fill="none" stroke="#D55E00" stroke-width="1.5"/>
    <text x="862" y="575">空心=区间下限</text>
    <text x="850" y="608">实验覆盖 OpenAI、Anthropic、</text>
    <text x="850" y="626">Google、Meta 四厂商多模型；</text>
    <text x="850" y="644">正文未给出逐模型数值，故只画</text>
    <text x="850" y="660">报告区间 34–40 与安全率下限 90。</text>
  </g>

  <!-- footnote -->
  <text x="60" y="648" font-size="11" fill="#767676">数据：arXiv:2604.21860（贾加纳特大学、巴里萨尔大学）· 面板 a 为论文所述三轮机制示意 · 比例均为论文自测口径，正文未报告各模型逐点数值 · 预印本未经同行评审</text>
</svg>
