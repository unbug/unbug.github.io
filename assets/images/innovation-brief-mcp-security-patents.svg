<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">六件 MCP 服务器安全专利在 2026 年 2 月至 8 月密集授权，Airia 一家连下五城</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">六件已授权专利：授权公告日期时间轴</text>

  <!-- gridlines (month majors, 0.5pt) -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="261.6" y1="126" x2="261.6" y2="360"/>
    <line x1="363" y1="126" x2="363" y2="360"/>
    <line x1="475.2" y1="126" x2="475.2" y2="360"/>
    <line x1="583.9" y1="126" x2="583.9" y2="360"/>
    <line x1="696.1" y1="126" x2="696.1" y2="360"/>
    <line x1="804.8" y1="126" x2="804.8" y2="360"/>
    <line x1="917" y1="126" x2="917" y2="360"/>
  </g>

  <!-- filled = granted -->
  <!-- Airia US12683991 2026-07-14 -->
  <circle cx="851.9" cy="148" r="6" fill="#0072B2"/>
  <text x="851.9" y="132" font-size="12" fill="#1A1B1E" text-anchor="middle">2026-07-14 授权</text>
  <text x="851.9" y="172" font-size="12" fill="#555" text-anchor="middle">Airia US12683991 · 不安全服务器自动补救</text>
  <text x="851.9" y="188" font-size="12" fill="#555" text-anchor="middle">2026-02-04 提交</text>

  <!-- Airia US12562968 2026-02-24 -->
  <circle cx="344.9" cy="202" r="6" fill="#0072B2"/>
  <text x="344.9" y="186" font-size="12" fill="#1A1B1E" text-anchor="middle">2026-02-24 授权</text>
  <text x="344.9" y="226" font-size="12" fill="#555" text-anchor="middle">Airia US12562968 · 基于代理的安全接入</text>

  <!-- Airia US12568091 2026-03-03 -->
  <circle cx="370.2" cy="248" r="6" fill="#0072B2"/>
  <text x="370.2" y="232" font-size="12" fill="#1A1B1E" text-anchor="middle">2026-03-03 授权</text>
  <text x="370.2" y="272" font-size="12" fill="#555" text-anchor="middle">Airia US12568091 · 多服务器批量策略管理</text>

  <!-- Airia US12574336 2026-03-10 -->
  <circle cx="395.6" cy="290" r="6" fill="#0072B2"/>
  <text x="395.6" y="274" font-size="12" fill="#1A1B1E" text-anchor="middle">2026-03-10 授权</text>
  <text x="395.6" y="314" font-size="12" fill="#555" text-anchor="middle">Airia US12574336 · 资源清单变更触发补救</text>

  <!-- Airia US12602470 2026-04-14 -->
  <circle cx="522.3" cy="330" r="6" fill="#0072B2"/>
  <text x="522.3" y="314" font-size="12" fill="#1A1B1E" text-anchor="middle">2026-04-14 授权</text>
  <text x="522.3" y="354" font-size="12" fill="#555" text-anchor="middle">Airia US12602470 · 容器化执行</text>

  <!-- Notion US12705267 2026-08-11 -->
  <circle cx="953.3" cy="202" r="6" fill="#D55E00"/>
  <text x="953.3" y="186" font-size="12" fill="#1A1B1E" text-anchor="middle">2026-08-11 授权</text>
  <text x="953.3" y="226" font-size="12" fill="#555" text-anchor="middle">Notion US12705267 · 查询权限属性控访问边界</text>
  <text x="953.3" y="242" font-size="12" fill="#555" text-anchor="middle">2025-12-23 提交</text>

  <!-- value axis -->
  <line x1="200" y1="372" x2="1080" y2="372" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="261.6" y1="372" x2="261.6" y2="376"/>
    <line x1="363" y1="372" x2="363" y2="376"/>
    <line x1="475.2" y1="372" x2="475.2" y2="376"/>
    <line x1="583.9" y1="372" x2="583.9" y2="376"/>
    <line x1="696.1" y1="372" x2="696.1" y2="376"/>
    <line x1="804.8" y1="372" x2="804.8" y2="376"/>
    <line x1="917" y1="372" x2="917" y2="376"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="261.6" y="396">2 月</text>
    <text x="363" y="396">3 月</text>
    <text x="475.2" y="396">4 月</text>
    <text x="583.9" y="396">5 月</text>
    <text x="696.1" y="396">6 月</text>
    <text x="804.8" y="396">7 月</text>
    <text x="917" y="396">8 月</text>
  </g>
  <text x="640" y="422" font-size="14" fill="#1A1B1E" text-anchor="middle">授权公告日期（2026 年，月内按日定位）</text>

  <!-- legend -->
  <g font-size="12" fill="#555">
    <circle cx="210" cy="447" r="5" fill="#0072B2"/>
    <text x="222" y="451">Airia（5 件）</text>
    <circle cx="330" cy="447" r="5" fill="#D55E00"/>
    <text x="342" y="451">Notion（1 件）· 六件均为已授权专利，不是申请公开</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="60" y="508" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="508" font-size="15" fill="#1A1B1E">市场审核实验：恶意的概念服务器被收录的市场数</text>

  <!-- stacked dot bar: 9 filled of 11 total -->
  <!-- dots at x = 260 + 40*i, r=10, cy=560 -->
  <g>
    <circle cx="270" cy="560" r="10" fill="#D55E00"/>
    <circle cx="310" cy="560" r="10" fill="#D55E00"/>
    <circle cx="350" cy="560" r="10" fill="#D55E00"/>
    <circle cx="390" cy="560" r="10" fill="#D55E00"/>
    <circle cx="430" cy="560" r="10" fill="#D55E00"/>
    <circle cx="470" cy="560" r="10" fill="#D55E00"/>
    <circle cx="510" cy="560" r="10" fill="#D55E00"/>
    <circle cx="550" cy="560" r="10" fill="#D55E00"/>
    <circle cx="590" cy="560" r="10" fill="#D55E00"/>
    <circle cx="630" cy="560" r="10" fill="#FFFFFF" stroke="#999999" stroke-width="2"/>
    <circle cx="670" cy="560" r="10" fill="#FFFFFF" stroke="#999999" stroke-width="2"/>
  </g>
  <g font-size="12" fill="#555">
    <circle cx="270" cy="608" r="5" fill="#D55E00"/>
    <text x="282" y="612">未审就收录（9 个市场）</text>
    <circle cx="450" cy="608" r="5" fill="#FFFFFF" stroke="#999999" stroke-width="2"/>
    <text x="462" y="612">公开 MCP 注册市场总数（11 个）</text>
  </g>
  <text x="260" y="530" font-size="12" fill="#555">OX Security 2026 年 4 月：向 11 个公开 MCP 注册市场提交恶意的概念服务器，9 家未审就收录；官方注册表已近万条</text>

  <!-- panel b side note -->
  <text x="60" y="476" font-size="12" fill="#555">信任锚从「装的时候看一眼」变成「持续比对清单」：清单快照 · 版本比对 · 代理拦截 · 容器隔离 · 异常降级。</text>

  <!-- footnote -->
  <text x="60" y="656" font-size="11" fill="#767676">数据：Free Patents Online 六件专利详情页（公开号见上图与正文）· 面板 b 为 OX Security 2026-04 概念验证实验 · 概念服务器为安全研究用，非真实攻击</text>
</svg>
