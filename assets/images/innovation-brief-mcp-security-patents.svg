<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #A29880; }
      .rl { font-size: 15px; fill: #4C463C; }
      .val { font-size: 16px; font-weight: 700; fill: #1A1B1E; }
      .b { font-size: 12px; fill: #A89E8A; }
      .date { font-size: 12.5px; fill: #8A8071; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FBF6EA"/>
    </linearGradient>
    <linearGradient id="gBrown" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A5230"/><stop offset="1" stop-color="#9C7048"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C19A49"/><stop offset="1" stop-color="#DBBA6E"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#963D46"/><stop offset="1" stop-color="#B85C64"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1105" cy="115" r="150" fill="#7A5230" opacity="0.06"/>
  <circle cx="85" cy="615" r="115" fill="#C19A49" opacity="0.08"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gRed)"/>

  <text class="k" x="64" y="84">AI 智创简报 · 2026-09-06 · MCP 安全专利</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">平台侧已被圈走</text>
  <text x="64" y="158" font-size="15" fill="#6B6252">六件 MCP 服务器安全专利均为已授权，不是申请公开</text>

  <!-- auction motif: gavel + block -->
  <g>
    <rect x="1030" y="152" width="80" height="16" rx="8" fill="url(#gBrown)"/>
    <rect x="1052" y="120" width="16" height="40" rx="4" fill="url(#gGold)" transform="rotate(32 1060 140)"/>
    <rect x="1024" y="176" width="92" height="10" rx="5" fill="#8A7A5E"/>
  </g>

  <!-- timeline: Feb->x=300, Aug->x=880, month=96.7 -->
  <g stroke="#EAE2CE">
    <line x1="300" y1="216" x2="300" y2="500"/>
    <line x1="493.3" y1="216" x2="493.3" y2="500"/>
    <line x1="686.7" y1="216" x2="686.7" y2="500"/>
    <line x1="880" y1="216" x2="880" y2="500"/>
  </g>
  <line x1="260" y1="500" x2="920" y2="500" stroke="#C9BFA6" stroke-width="1.5"/>
  <text class="b" x="300" y="522">2 月</text>
  <text class="b" x="493.3" y="522" text-anchor="middle">4 月</text>
  <text class="b" x="686.7" y="522" text-anchor="middle">6 月</text>
  <text class="b" x="880" y="522" text-anchor="middle">8 月</text>

  <!-- 7月 14 自动补救 -->
  <circle cx="783.3" cy="248" r="8" fill="url(#gGold)"/>
  <line x1="775.3" y1="248" x2="753" y2="248" stroke="#C19A49" stroke-width="1.5"/>
  <text class="rl" x="743" y="253" text-anchor="end">不安全服务器 · 自动补救</text>
  <text class="date" x="400" y="253">07-14 授权 · US12683991</text>

  <!-- 2月 24 代理接入 -->
  <circle cx="319.3" cy="312" r="8" fill="url(#gGold)"/>
  <line x1="374.7" y1="312" x2="396" y2="312" stroke="#C19A49" stroke-width="1.5"/>
  <text class="rl" x="406" y="317">代理式 · 安全接入</text>
  <text class="date" x="640" y="317">02-24 授权 · US12562968</text>

  <!-- 3月 03 批量策略 -->
  <circle cx="400" cy="362" r="8" fill="url(#gGold)"/>
  <line x1="408" y1="362" x2="430" y2="362" stroke="#C19A49" stroke-width="1.5"/>
  <text class="rl" x="440" y="367">多服务器 · 批量策略</text>
  <text class="date" x="640" y="367">03-03 授权 · US12568091</text>

  <!-- 3月 10 资源清单 -->
  <circle cx="436.7" cy="412" r="8" fill="url(#gGold)"/>
  <line x1="444.7" y1="412" x2="466" y2="412" stroke="#C19A49" stroke-width="1.5"/>
  <text class="rl" x="476" y="417">资源清单 · 变更补救</text>
  <text class="date" x="640" y="417">03-10 授权 · US12574336</text>

  <!-- 4月 14 容器化 -->
  <circle cx="494.7" cy="462" r="8" fill="url(#gGold)"/>
  <line x1="502.7" y1="462" x2="524" y2="462" stroke="#C19A49" stroke-width="1.5"/>
  <text class="rl" x="534" y="467">服务器 · 容器化执行</text>
  <text class="date" x="640" y="467">04-14 授权 · US12602470</text>

  <!-- 8月 11 Notion 权限 -->
  <circle cx="870" cy="278" r="9" fill="url(#gRed)"/>
  <line x1="862" y1="278" x2="840" y2="278" stroke="#963D46" stroke-width="1.5"/>
  <text class="rl" x="830" y="283" text-anchor="end">查询权限属性 · 控访问边界</text>
  <text class="date" x="400" y="283" fill="#963D46">08-11 授权 · US12705267 Notion</text>

  <!-- right big number card -->
  <rect x="944" y="230" width="196" height="150" rx="14" fill="#963D46" opacity="0.07"/>
  <text class="serif" x="1042" y="308" text-anchor="middle" font-size="58" font-weight="700" fill="#963D46">9 / 11</text>
  <text x="1042" y="340" text-anchor="middle" font-size="14" fill="#6B6252">恶意概念服务器提交</text>
  <text x="1042" y="362" text-anchor="middle" font-size="14" fill="#6B6252">9 家市场未审就收录</text>

  <g>
    <text class="serif" x="944" y="432" font-size="24" font-weight="700" fill="#7A5230">Airia 连下五城</text>
    <text class="b" x="944" y="458">注册 / 代理 / 清单 / 容器 / 补救</text>
  </g>

  <line x1="64" y1="576" x2="1136" y2="576" stroke="#EAE2CE"/>
  <text class="serif" x="64" y="614" font-size="18" fill="#1A1B1E">信任锚：从「装的时候看一眼」变成「持续比对清单」。</text>
  <text class="b" x="1136" y="614" text-anchor="end">授权公告 2026 年 2–8 月 · 市场审核实验为 OX Security 2026-04 概念验证 · Micropaper</text>
</svg>
