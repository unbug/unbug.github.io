<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Helvetica Neue, Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1200" height="660" fill="#F4F7FB"/>
  <text x="600" y="42" font-size="25" font-weight="bold" fill="#1E3A5F" text-anchor="middle">「知道脚下跑了什么」的三条技术路线（HN 50147181 线程立场图）</text>

  <rect x="40" y="70" width="1120" height="210" rx="14" fill="#EAF2FB" stroke="#2F6FB2" stroke-width="2.5"/>
  <text x="65" y="102" font-size="18" font-weight="bold" fill="#1E3A5F">路线 A：自建网关派（主帖 amrrs，303 分 / 220 条）</text>
  <g text-anchor="middle" font-size="14.5">
    <rect x="70" y="122" width="160" height="66" rx="10" fill="#FFFFFF" stroke="#2F6FB2"/><text x="150" y="150" fill="#1E3A5F" font-weight="bold">Harness</text><text x="150" y="172" fill="#41627F">Claude Code 等</text>
    <rect x="300" y="112" width="330" height="86" rx="10" fill="#FFFFFF" stroke="#2F6FB2" stroke-width="2.5"/><text x="465" y="138" fill="#1E3A5F" font-weight="bold">你自己的代理（litellm 63,299★ / bifrost 9,572★）</text><text x="465" y="162" fill="#41627F">虚拟 key · 预算 · 审计日志 · 路由</text><text x="465" y="184" fill="#41627F">护栏：gpt-oss-safeguard + 逐条策略文件（50147437）</text>
    <rect x="700" y="122" width="170" height="66" rx="10" fill="#FFFFFF" stroke="#2F6FB2"/><text x="785" y="150" fill="#1E3A5F" font-weight="bold">模型 API</text><text x="785" y="172" fill="#41627F">Anthropic/OpenAI…</text>
    <rect x="930" y="122" width="200" height="66" rx="10" fill="#FFFFFF" stroke="#1E8449"/><text x="1030" y="150" fill="#14532D" font-weight="bold">账单答案</text><text x="1030" y="172" fill="#41627F">guardrail 自报 5–20 美分/天</text>
  </g>
  <g stroke="#2F6FB2" stroke-width="2.5" fill="none" marker-end="url(#gA)"><line x1="230" y1="155" x2="300" y2="155"/><line x1="630" y1="155" x2="700" y2="155"/><line x1="870" y1="155" x2="930" y2="155"/></g>
  <text x="65" y="238" font-size="14.5" fill="#7B241C">代价（CharlieDigital 50151130 逐字）：「You don't need a proxy to do this」——代理把单点故障直接放进生产力线；且 50153072/50151189 补刀：代理只看到 harness 愿意给的</text>

  <rect x="40" y="310" width="545" height="170" rx="14" fill="#EAF6EF" stroke="#1E8449" stroke-width="2"/>
  <text x="65" y="342" font-size="18" font-weight="bold" fill="#14532D">路线 B：规范派（不新增常驻件）</text>
  <g text-anchor="middle" font-size="14.5">
    <rect x="65" y="362" width="150" height="60" rx="10" fill="#FFFFFF" stroke="#1E8449"/><text x="140" y="387" fill="#14532D">Codex / Claude Code</text><text x="140" y="409" fill="#41627F">原生输出 OTEL traces</text>
    <rect x="275" y="362" width="140" height="60" rx="10" fill="#FFFFFF" stroke="#1E8449"/><text x="345" y="387" fill="#14532D">OTEL Collector</text><text x="345" y="409" fill="#41627F">规范通道</text>
    <rect x="475" y="362" width="90" height="60" rx="10" fill="#FFFFFF" stroke="#1E8449"/><text x="520" y="387" fill="#14532D">Datadog</text><text x="520" y="409" fill="#41627F">/Langfuse</text>
  </g>
  <g stroke="#1E8449" stroke-width="2.5" fill="none" marker-end="url(#gG)"><line x1="215" y1="392" x2="275" y2="392"/><line x1="415" y1="392" x2="475" y2="392"/></g>
  <text x="65" y="458" font-size="14" fill="#41627F">InsidiousWombat 50151222：接进现成观测栈「查了就算」——观测不必长在请求路径上</text>

  <rect x="615" y="310" width="545" height="170" rx="14" fill="#FDF6E3" stroke="#B7791F" stroke-width="2"/>
  <text x="640" y="342" font-size="18" font-weight="bold" fill="#8B5E1A">路线 C：事后取证派</text>
  <g text-anchor="middle" font-size="14.5">
    <rect x="640" y="362" width="180" height="60" rx="10" fill="#FFFFFF" stroke="#B7791F"/><text x="730" y="387" fill="#8B5E1A">~/.claude/projects</text><text x="730" y="409" fill="#41627F">本地 JSONL 全量会话</text>
    <rect x="880" y="362" width="180" height="60" rx="10" fill="#FFFFFF" stroke="#B7791F"/><text x="970" y="387" fill="#8B5E1A">agentsview 等本地聚合</text><text x="970" y="409" fill="#41627F">跨 harness 记账/复盘</text>
  </g>
  <g stroke="#B7791F" stroke-width="2.5" fill="none" marker-end="url(#gY)"><line x1="820" y1="392" x2="880" y2="392"/></g>
  <text x="640" y="458" font-size="14" fill="#41627F">数据本来就落在你盘上，缺的只是索引层——与上期《Agent 说完不算，拿出证据》形成分工</text>

  <text x="600" y="540" font-size="17" fill="#1E3A5F" text-anchor="middle">分歧不在要不要看见，在「看见」该长在请求路径上（A）、协议通道上（B），还是磁盘上（C）</text>
  <text x="600" y="580" font-size="15.5" fill="#6B7F96" text-anchor="middle">本期判据：路径 A 事故面最大（见攻击链图），但也是唯一同时拿到「预算 + 路由 + 护栏」的路线</text>
  <defs>
    <marker id="gA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2F6FB2"/></marker>
    <marker id="gG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1E8449"/></marker>
    <marker id="gY" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B7791F"/></marker>
  </defs>
</svg>
