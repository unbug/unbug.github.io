<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Helvetica Neue, Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1200" height="560" fill="#F4F7FB"/>
  <text x="600" y="42" font-size="25" font-weight="bold" fill="#1E3A5F" text-anchor="middle">FrontierHarness 两个月长大：从 82 分 Show HN 到带赞助商的实时榜</text>

  <rect x="50" y="70" width="530" height="150" rx="14" fill="#FFFFFF" stroke="#2F6FB2" stroke-width="2"/>
  <text x="74" y="100" font-size="17" font-weight="bold" fill="#2F6FB2">v1（09-02 首采）</text>
  <text x="74" y="130" font-size="15.5" fill="#1E3A5F">9 harness × 12 配置，单一 Kimi K3 模型</text>
  <text x="74" y="156" font-size="15.5" fill="#1E3A5F">软件工程与终端任务；HN 81→82 分 / 56 条</text>
  <text x="74" y="186" font-size="14" fill="#8B5E1A">评论区指缺陷：单模型扭曲（vidarh）、极简车架同赛（dfltr）</text>

  <rect x="620" y="70" width="530" height="150" rx="14" fill="#FFFFFF" stroke="#2F6FB2" stroke-width="2.5"/>
  <text x="644" y="100" font-size="17" font-weight="bold" fill="#2F6FB2">v1.1（2026-11-16 复测）</text>
  <text x="644" y="130" font-size="15.5" fill="#1E3A5F">21 配置 × 5 模型 × 62 任务 × 6 域，每任务 4 次计分</text>
  <text x="644" y="156" font-size="15.5" fill="#1E3A5F">实时榜 + 开放投稿；赞助商 Runta / Baseten / Z.ai</text>
  <text x="644" y="186" font-size="14" fill="#1E7A45">vidarh 要的 harness×model 矩阵，以扩榜方式兑现一半</text>

  <line x1="580" y1="145" x2="620" y2="145" stroke="#2F6FB2" stroke-width="2.5" marker-end="url(#evB)"/>

  <text x="600" y="266" font-size="16.5" font-weight="bold" fill="#1E3A5F" text-anchor="middle">榜单即卖点：同窗四篇「我在榜上赢」帖（全部个位数分——声量在厂商侧，不在社区侧）</text>
  <g font-size="14.5">
    <rect x="50" y="288" width="265" height="92" rx="10" fill="#EAF2FB" stroke="#2F6FB2" stroke-width="1.5"/>
    <text x="66" y="314" font-weight="bold" fill="#2F6FB2">09-04 Mouse 登顶</text>
    <text x="66" y="340" fill="#1E3A5F">completion loops 刷到</text>
    <text x="66" y="362" fill="#1E3A5F">24/30（HN 49560389）</text>
    <rect x="335" y="288" width="265" height="92" rx="10" fill="#EAF2FB" stroke="#2F6FB2" stroke-width="1.5"/>
    <text x="351" y="314" font-weight="bold" fill="#2F6FB2">09-09 验证循环</text>
    <text x="351" y="340" fill="#1E3A5F">OpenCode 从垫底到榜首</text>
    <text x="351" y="362" fill="#1E3A5F">（HN 49632357）</text>
    <rect x="620" y="288" width="265" height="92" rx="10" fill="#EAF2FB" stroke="#2F6FB2" stroke-width="1.5"/>
    <text x="636" y="314" font-weight="bold" fill="#2F6FB2">09-22 maki 挑战书</text>
    <text x="636" y="340" fill="#1E3A5F">「打败所有流行 harness」</text>
    <text x="636" y="362" fill="#1E3A5F">（HN 49808026）</text>
    <rect x="905" y="288" width="245" height="92" rx="10" fill="#FDF6E3" stroke="#B7791F" stroke-width="1.5"/>
    <text x="921" y="314" font-weight="bold" fill="#8B5E1A">11-05 Droid 1.0</text>
    <text x="921" y="340" fill="#1E3A5F">标题即 Building a</text>
    <text x="921" y="362" fill="#1E3A5F">Frontier Harness（50375236）</text>
  </g>

  <rect x="50" y="414" width="1100" height="96" rx="14" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
  <text x="600" y="450" font-size="16.5" font-weight="bold" fill="#C0392B" text-anchor="middle">范式判断：基准化启动（学科与采购项成形）；榜单本身成为可优化的营销目标，是新出现的第二风险</text>
  <text x="600" y="484" font-size="15" fill="#7B241C" text-anchor="middle">下一步试金石：v1.1 提交通道是否收进第一批非厂商社区 harness；排名重排的量化对照是否公开</text>
  <defs><marker id="evB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2F6FB2"/></marker></defs>
</svg>
