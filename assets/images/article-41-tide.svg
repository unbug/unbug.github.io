<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">0.6B 学生模型峰值内存 1.4 GB、推理加速 5.2 倍，八基准平均分高于未蒸馏基线</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">生成 256 token：16B MoE 教师 vs 0.6B 学生（H100）</text>

  <!-- gridlines (shared value scale 0-35, x = 290 + 8*v) -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="370" y1="140" x2="370" y2="248"/>
    <line x1="450" y1="140" x2="450" y2="248"/>
    <line x1="530" y1="140" x2="530" y2="248"/>
    <line x1="370" y1="316" x2="370" y2="404"/>
    <line x1="450" y1="316" x2="450" y2="404"/>
    <line x1="530" y1="316" x2="530" y2="404"/>
  </g>

  <!-- memory rows -->
  <text x="278" y="168" font-size="12.5" fill="#1A1B1E" text-anchor="end">教师 16B MoE</text>
  <rect x="290" y="154" width="250.4" height="18" fill="#999999"/>
  <text x="548" y="168" font-size="12" fill="#555555">31.3</text>
  <text x="278" y="216" font-size="12.5" fill="#1A1B1E" text-anchor="end">学生 0.6B</text>
  <rect x="290" y="202" width="11.2" height="18" fill="#D55E00"/>
  <text x="310" y="216" font-size="12" fill="#555555">1.4</text>
  <text x="90" y="250" font-size="12" fill="#555555" font-weight="bold">内存（GB）</text>
  <line x1="290" y1="248" x2="530" y2="248" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="290" y1="248" x2="290" y2="252"/>
    <line x1="370" y1="248" x2="370" y2="252"/>
    <line x1="450" y1="248" x2="450" y2="252"/>
    <line x1="530" y1="248" x2="530" y2="252"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="290" y="270">0</text>
    <text x="370" y="270">10</text>
    <text x="450" y="270">20</text>
    <text x="530" y="270">30</text>
  </g>

  <!-- time rows -->
  <text x="278" y="344" font-size="12.5" fill="#1A1B1E" text-anchor="end">教师 16B MoE</text>
  <rect x="290" y="330" width="260.4" height="18" fill="#999999"/>
  <text x="558" y="344" font-size="12" fill="#555555">32.55</text>
  <text x="278" y="392" font-size="12.5" fill="#1A1B1E" text-anchor="end">学生 0.6B</text>
  <rect x="290" y="378" width="50" height="18" fill="#D55E00"/>
  <text x="348" y="392" font-size="12" fill="#555555">6.25</text>
  <text x="90" y="406" font-size="12" fill="#555555" font-weight="bold">时间（秒）</text>
  <line x1="290" y1="404" x2="530" y2="404" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="290" y1="404" x2="290" y2="408"/>
    <line x1="370" y1="404" x2="370" y2="408"/>
    <line x1="450" y1="404" x2="450" y2="408"/>
    <line x1="530" y1="404" x2="530" y2="408"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="290" y="426">0</text>
    <text x="370" y="426">10</text>
    <text x="450" y="426">20</text>
    <text x="530" y="426">30</text>
  </g>
  <text x="410" y="452" font-size="14" fill="#1A1B1E" text-anchor="middle">数值（GB / 秒，两栏同尺度）</text>

  <text x="90" y="478" font-size="12" fill="#555555">内存降低 22 倍 · 推理加速 5.2 倍（教师 ÷ 学生）</text>

  <!-- ============ panel b ============ -->
  <text x="660" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="682" y="104" font-size="15" fill="#1A1B1E">任务平均准确率（%，空心 = 未蒸馏基线，实心 = 蒸馏后）</text>

  <!-- gridlines -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="800" y1="140" x2="800" y2="380"/>
    <line x1="870" y1="140" x2="870" y2="380"/>
    <line x1="940" y1="140" x2="940" y2="380"/>
  </g>

  <!-- x = 800 + 8*v -->
  <!-- HumanEval 32.30 -> 48.78 (Δ=+16.48) -->
  <text x="788" y="212" font-size="12.5" fill="#1A1B1E" text-anchor="end">HumanEval</text>
  <line x1="1026.1" y1="206" x2="1141.46" y2="206" stroke="#D55E00" stroke-width="1.5"/>
  <circle cx="1026.1" cy="206" r="5" fill="#FFFFFF" stroke="#999999" stroke-width="1.5"/>
  <circle cx="1141.46" cy="206" r="5" fill="#D55E00"/>
  <text x="1024" y="188" font-size="12" fill="#555555" text-anchor="end">32.30 → 48.78</text>
  <text x="1024" y="232" font-size="12" fill="#555555" text-anchor="end">代码生成，Δ=+16.48 分</text>

  <!-- 8-benchmark avg 32.67 -> 34.20 (Δ=+1.53) -->
  <text x="788" y="316" font-size="12.5" fill="#1A1B1E" text-anchor="end">八基准平均</text>
  <line x1="1028.69" y1="310" x2="1039.4" y2="310" stroke="#D55E00" stroke-width="1.5"/>
  <circle cx="1028.69" cy="310" r="5" fill="#FFFFFF" stroke="#999999" stroke-width="1.5"/>
  <circle cx="1039.4" cy="310" r="5" fill="#D55E00"/>
  <text x="1050" y="292" font-size="12" fill="#555555">32.67 → 34.20</text>
  <text x="1050" y="332" font-size="12" fill="#555555">TIDE-Cross</text>
  <text x="1050" y="350" font-size="12" fill="#555555">Δ=+1.53 分</text>

  <!-- value axis -->
  <line x1="800" y1="380" x2="1020" y2="380" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="800" y1="380" x2="800" y2="384"/>
    <line x1="870" y1="380" x2="870" y2="384"/>
    <line x1="940" y1="380" x2="940" y2="384"/>
    <line x1="1010" y1="380" x2="1010" y2="384"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="800" y="402">0</text>
    <text x="870" y="402">10</text>
    <text x="940" y="402">20</text>
    <text x="1010" y="402">30</text>
  </g>
  <polygon points="1020,375 1032,380 1020,385" fill="#1A1B1E"/>
  <text x="910" y="428" font-size="14" fill="#1A1B1E" text-anchor="middle">平均准确率（%）</text>

  <text x="660" y="462" font-size="12" fill="#555555">轴自 0 起、刻度至 30，轴末箭头表示数值延续；48.78 超出刻度范围仍按同尺度绘制</text>

  <!-- footnote -->
  <text x="60" y="615" font-size="11" fill="#767676">数据：arXiv:2604.26951 · 论文自测口径（H100，生成 256 token；8 个基准平均分与 HumanEval 准确率）· 预印本未经同行评审</text>
</svg>
