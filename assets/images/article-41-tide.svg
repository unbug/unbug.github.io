<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Noto Serif SC','Songti SC',serif">
  <defs>
    <style>
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9C9484; font-family: 'PingFang SC','Helvetica Neue',sans-serif; }
      .rl { font-size: 15px; fill: #474C54; font-family: 'PingFang SC','Helvetica Neue',sans-serif; }
      .val { font-size: 18px; font-weight: 700; font-family: 'PingFang SC','Helvetica Neue',sans-serif; }
      .b { font-size: 12px; fill: #A5A296; font-family: 'PingFang SC','Helvetica Neue',sans-serif; }
      .chip { font-size: 12.5px; font-weight: 600; font-family: 'PingFang SC','Helvetica Neue',sans-serif; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFCF9"/><stop offset="1" stop-color="#F2F5F2"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E7C86"/><stop offset="1" stop-color="#4FB3BC"/>
    </linearGradient>
    <linearGradient id="gDeep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14506B"/><stop offset="1" stop-color="#3E86A3"/>
    </linearGradient>
    <linearGradient id="gCoral" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0563F"/><stop offset="1" stop-color="#F08A6E"/>
    </linearGradient>
    <linearGradient id="gSun" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DFA02C"/><stop offset="1" stop-color="#F0C76A"/>
    </linearGradient>
    <linearGradient id="gReed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D8B67"/><stop offset="1" stop-color="#77B894"/>
    </linearGradient>
    <linearGradient id="gIris" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5F4BB6"/><stop offset="1" stop-color="#8F7ED4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1105" cy="110" r="140" fill="#0E7C86" opacity="0.07"/>
  <circle cx="70" cy="620" r="115" fill="#E0563F" opacity="0.06"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gCoral)"/>

  <text class="k" x="64" y="84">一分钟读论文 · ARXIV:2604.26951 · 北大 / 浙大</text>
  <text x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">开闸下放 16B</text>
  <text x="64" y="158" font-size="15" fill="#5B6068" font-family="'PingFang SC','Helvetica Neue',sans-serif">TIDE 首次实现扩散语言模型跨架构蒸馏：16B MoE 教师 → 0.6B 学生，上船闸过消费级硬件</text>

  <!-- ship lock motif -->
  <g>
    <g stroke="#14506B" stroke-width="2.5" opacity="0.7" fill="none">
      <path d="M 988 78 L 988 176 M 1176 78 L 1176 176"/>
      <path d="M 1030 96 L 1030 176 M 1134 96 L 1134 176"/>
    </g>
    <path d="M 990 104 Q 1010 112 1030 104 Q 1050 96 1070 104 Q 1090 112 1110 104 Q 1130 96 1150 104 Q 1163 109 1174 104" fill="none" stroke="url(#gTeal)" stroke-width="2.5" opacity="0.8"/>
    <path d="M 1070 150 Q 1086 156 1102 150 Q 1118 144 1134 150 Q 1152 157 1172 150" fill="none" stroke="url(#gTeal)" stroke-width="2.5" opacity="0.6"/>
    <path d="M 1044 140 q 28 -22 56 0 l -8 12 h -40 Z" fill="url(#gCoral)"/>
    <rect x="1066" y="120" width="12" height="10" fill="#FFFFFF" opacity="0.9"/>
    <g stroke="#14506B" stroke-width="2" opacity="0.8">
      <line x1="988" y1="96" x2="1030" y2="96"/><line x1="1134" y1="96" x2="1176" y2="96"/>
    </g>
    <circle cx="1009" cy="96" r="5" fill="url(#gSun)"/><circle cx="1155" cy="96" r="5" fill="url(#gSun)"/>
  </g>

  <!-- left: big ratio anchors -->
  <g>
    <rect x="64" y="200" width="690" height="96" fill="#0E7C86" opacity="0.07"/>
    <text x="92" y="260" font-size="46" font-weight="700" fill="#E0563F">16B → 0.6B</text>
    <text x="360" y="240" class="rl">跨架构蒸馏 · 架构/注意力/分词器全不同</text>
    <text x="360" y="262" class="b">token 无法直接对齐，是 dLLM 蒸馏的根本难题</text>

    <text class="rl" x="64" y="336">峰值内存 · 教师 31.3 GB vs 学生 1.4 GB</text>
    <rect x="64" y="352" width="560" height="18" rx="4" fill="url(#gDeep)"/>
    <text class="val" x="636" y="367" fill="#14506B">31.3 GB</text>
    <rect x="64" y="378" width="25" height="18" rx="4" fill="url(#gCoral)"/>
    <text class="val" x="100" y="393" fill="#E0563F">1.4 GB</text>
    <text class="b" x="170" y="393">降低 22 倍</text>

    <text class="rl" x="64" y="438">推理速度 · 生成 256 token · H100</text>
    <rect x="64" y="452" width="560" height="18" rx="4" fill="url(#gSun)"/>
    <text class="val" x="636" y="467" fill="#7A5610">32.55 秒</text>
    <rect x="64" y="478" width="107.7" height="18" rx="4" fill="url(#gReed)"/>
    <text class="val" x="184" y="493" fill="#2C6B4C">6.25 秒</text>
    <text class="b" x="262" y="493">提升 5.2 倍</text>
  </g>

  <!-- right: three gates -->
  <g>
    <rect x="836" y="200" width="304" height="296" rx="12" fill="#0E7C86" opacity="0.07"/>
    <text x="856" y="230" font-size="16" font-weight="700" fill="#0E7C86">三道闸室</text>

    <circle cx="866" cy="264" r="11" fill="url(#gTeal)"/><text x="866" y="269" text-anchor="middle" font-size="12" font-weight="700" fill="#EFFAFB" font-family="'PingFang SC',sans-serif">T</text>
    <text class="rl" x="888" y="262" font-weight="700">TIDAL 调度</text>
    <text class="b" x="888" y="282">训练进度 × 扩散时间步联合调蒸馏强度，教师不可靠时自动降权</text>

    <circle cx="866" cy="334" r="11" fill="url(#gSun)"/><text x="866" y="339" text-anchor="middle" font-size="12" font-weight="700" fill="#FFF8EA" font-family="'PingFang SC',sans-serif">C</text>
    <text class="rl" x="888" y="332" font-weight="700">CompDemo 上下文增强</text>
    <text class="b" x="888" y="352">两次教师推理生互补掩码分割，每位置约见 50% 已揭示上下文</text>

    <circle cx="866" cy="404" r="11" fill="url(#gIris)"/><text x="866" y="409" text-anchor="middle" font-size="12" font-weight="700" fill="#F3F0FC" font-family="'PingFang SC',sans-serif">R</text>
    <text class="rl" x="888" y="402" font-weight="700">Reverse CALM</text>
    <text class="b" x="888" y="422">反向分块级二元交叉熵跨分词器匹配，加双端噪声过滤</text>

    <text x="856" y="466" font-size="15" font-weight="700" fill="#B5442E">分词器不同，也能对表过闸</text>
  </g>

  <!-- bottom chips -->
  <line x1="64" y1="520" x2="1136" y2="520" stroke="#E2E4DC"/>
  <g>
    <text class="rl" x="64" y="562">8 基准平均</text>
    <text x="160" y="562" font-size="17" font-weight="700" fill="#0E7C86" font-family="'PingFang SC',sans-serif">34.20 vs 32.67 · +1.53</text>
    <rect x="392" y="542" width="196" height="28" rx="14" fill="url(#gCoral)" opacity="0.16"/>
    <text x="490" y="561" text-anchor="middle" class="chip" fill="#A5381F">HumanEval +16.48 分</text>
    <text x="600" y="561" class="b">48.78 vs 32.30 · 代码生成最突出</text>
  </g>
  <text x="64" y="604" font-size="18" fill="#1A1B1E">大模型进船闸，消费级硬件才收得到货。</text>
  <text class="b" x="1136" y="630" text-anchor="end" font-family="'PingFang SC','Helvetica Neue',sans-serif">TIDE-Cross vs BD3LM 基线 · 论文自述口径 · 预印本未经同行评审 · Micropaper</text>
</svg>
