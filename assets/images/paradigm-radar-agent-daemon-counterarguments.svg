<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">两条反方论据的支点分别是更新收益与交付通道；争议焦点为默认值、可见性与退出路径</text>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0072B2"/>
    </marker>
    <marker id="arrowGrey" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">反方论据、边界条件与线程内反驳（述评示意）</text>

  <!-- Counterargument A -->
  <rect x="60" y="128" width="300" height="42" fill="#0072B2"/>
  <text x="72" y="154" font-size="14" fill="#FFFFFF">反方 A（dingaling911）</text>
  <text x="60" y="190" font-size="12.5" fill="#1A1B1E">浏览器静默自动更新运行十几年，</text>
  <text x="60" y="208" font-size="12.5" fill="#1A1B1E">harness 凭什么不能默认开启</text>

  <line x1="364" y1="148" x2="392" y2="148" stroke="#555555" stroke-width="2" marker-end="url(#arrowGrey)"/>

  <rect x="396" y="128" width="300" height="42" fill="#999999"/>
  <text x="408" y="154" font-size="14" fill="#FFFFFF">边界条件（本文口径声明）</text>
  <text x="396" y="190" font-size="12.5" fill="#555555">「浏览器更新自带进程沙箱所以可接受」</text>
  <text x="396" y="208" font-size="12.5" fill="#555555">线程内无评论直接提出，按常见主张评估</text>

  <line x1="700" y1="148" x2="728" y2="148" stroke="#555555" stroke-width="2" marker-end="url(#arrowGrey)"/>

  <rect x="732" y="128" width="408" height="42" fill="#555555"/>
  <text x="744" y="154" font-size="14" fill="#FFFFFF">线程内反驳</text>
  <text x="732" y="190" font-size="12.5" fill="#1A1B1E">icantevenhold：其浏览器更新需批准；</text>
  <text x="732" y="208" font-size="12.5" fill="#1A1B1E">swatcoder、wtallis：快速迭代不构成默认塞入</text>
  <text x="732" y="226" font-size="12.5" fill="#1A1B1E">专业工具变更的权利</text>

  <text x="60" y="236" font-size="12" fill="#555555">本文评估：浏览器更新的是查看器，harness 更新的是执行环境并持有全机读写、网络与凭据，爆炸半径不同量级。</text>

  <!-- Counterargument B -->
  <rect x="60" y="286" width="300" height="42" fill="#0072B2"/>
  <text x="72" y="312" font-size="14" fill="#FFFFFF">反方 B（judge2020）</text>
  <text x="60" y="348" font-size="12.5" fill="#1A1B1E">企业跑 npm mirror，交付天然接进</text>
  <text x="60" y="366" font-size="12.5" fill="#1A1B1E">IT 合规框架</text>

  <line x1="364" y1="306" x2="392" y2="306" stroke="#555555" stroke-width="2" marker-end="url(#arrowGrey)"/>

  <rect x="396" y="286" width="300" height="42" fill="#999999"/>
  <text x="408" y="312" font-size="14" fill="#FFFFFF">机制事实</text>
  <text x="396" y="348" font-size="12.5" fill="#1A1B1E">镜像覆盖 npm install 一刻，</text>
  <text x="396" y="366" font-size="12.5" fill="#1A1B1E">覆盖不了复制包内小时级自更新</text>

  <line x1="700" y1="306" x2="728" y2="306" stroke="#555555" stroke-width="2" marker-end="url(#arrowGrey)"/>

  <rect x="732" y="286" width="408" height="42" fill="#D55E00"/>
  <text x="744" y="312" font-size="14" fill="#FFFFFF">结论：反方 B 实为提案方</text>
  <text x="732" y="348" font-size="12.5" fill="#1A1B1E">合规链在复制包这步断掉；</text>
  <text x="732" y="366" font-size="12.5" fill="#1A1B1E">该论据本身证明包管理器管辖权被绕开</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="432" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="432" font-size="15" fill="#1A1B1E">合理面保留与三个争议焦点</text>

  <text x="60" y="468" font-size="12.5" fill="#1A1B1E">合理面（thebeardisred）：发行版打包、测试、给合理默认有真实价值；「有 bug 才等新版本」是真需求，自动更新的安全收益真实存在。</text>

  <rect x="60" y="496" width="340" height="42" fill="#0072B2"/>
  <text x="72" y="522" font-size="14" fill="#FFFFFF">焦点一：默认开启而非 opt-in</text>

  <rect x="430" y="496" width="340" height="42" fill="#0072B2"/>
  <text x="442" y="522" font-size="14" fill="#FFFFFF">焦点二：发布说明一句、config 文档零条目</text>

  <rect x="800" y="496" width="340" height="42" fill="#0072B2"/>
  <text x="812" y="522" font-size="14" fill="#FFFFFF">焦点三：唯一关闭命令 stop 漏杀更新器</text>

  <text x="60" y="568" font-size="12" fill="#555555">三个焦点均有解，且都不必牺牲自动更新的安全收益。</text>

  <!-- footnote -->
  <text x="60" y="600" font-size="11" fill="#767676">来源：HN 帖 50060694 与 openai/codex issue 区，评论 ID 均线程内可查 · 「浏览器更新自带沙箱」在线程中无评论直接提出，属常见主张口径 ·</text>
  <text x="60" y="616" font-size="11" fill="#767676">情绪信号（a trait of malware 类比、回退 license 言论、12 GB 与 11 个约 300 MB 占用）系各人本机观察、未复现，仅作感知强度引用，不在此呈现 · 实测 2026-10-16</text>
</svg>
