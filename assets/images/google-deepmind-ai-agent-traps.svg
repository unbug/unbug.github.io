<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">六类攻击中 HTML 内容注入成功率最高（86%），其余五类成功率约为 40% 至 75%</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">六类攻击陷阱的实测成功率（%）</text>

  <!-- gridlines: x = 320 + 9*v (dashed alignment guides, no numeric ticks) -->
  <g stroke="#D9D9D9" stroke-width="0.5" stroke-dasharray="4 4">
    <line x1="500" y1="126" x2="500" y2="446"/>
    <line x1="680" y1="126" x2="680" y2="446"/>
    <line x1="860" y1="126" x2="860" y2="446"/>
    <line x1="1040" y1="126" x2="1040" y2="446"/>
  </g>

  <!-- rows: x = 320 + 9*v; dot marks the exact reported value -->
  <text x="308" y="166" font-size="12.5" fill="#1A1B1E" text-anchor="end">内容注入</text>
  <rect x="320" y="152" width="774" height="18" fill="#D55E00" opacity="0.25"/>
  <circle cx="1094" cy="161" r="6" fill="#D55E00"/>
  <text x="1106" y="166" font-size="12" fill="#555">86</text>

  <text x="308" y="226" font-size="12.5" fill="#1A1B1E" text-anchor="end">行为控制</text>
  <rect x="320" y="212" width="675" height="18" fill="#999999" opacity="0.25"/>
  <circle cx="995" cy="221" r="6" fill="#999999"/>
  <text x="1007" y="226" font-size="12" fill="#555">约 75</text>

  <text x="308" y="286" font-size="12.5" fill="#1A1B1E" text-anchor="end">语义操控</text>
  <rect x="320" y="272" width="540" height="18" fill="#999999" opacity="0.25"/>
  <circle cx="860" cy="281" r="6" fill="#999999"/>
  <text x="872" y="286" font-size="12" fill="#555">约 60</text>

  <text x="308" y="346" font-size="12.5" fill="#1A1B1E" text-anchor="end">多智能体协同攻击</text>
  <rect x="320" y="332" width="495" height="18" fill="#999999" opacity="0.25"/>
  <circle cx="815" cy="341" r="6" fill="#999999"/>
  <text x="827" y="346" font-size="12" fill="#555">约 55</text>

  <text x="308" y="406" font-size="12.5" fill="#1A1B1E" text-anchor="end">认知状态投毒</text>
  <rect x="320" y="392" width="450" height="18" fill="#999999" opacity="0.25"/>
  <circle cx="770" cy="401" r="6" fill="#999999"/>
  <text x="782" y="406" font-size="12" fill="#555">约 50</text>

  <text x="308" y="466" font-size="12.5" fill="#1A1B1E" text-anchor="end">系统性陷阱</text>
  <rect x="320" y="452" width="360" height="18" fill="#999999" opacity="0.25"/>
  <circle cx="680" cy="461" r="6" fill="#999999"/>
  <text x="692" y="466" font-size="12" fill="#555">约 40</text>

  <!-- value axis -->
  <line x1="320" y1="486" x2="1040" y2="486" stroke="#1A1B1E" stroke-width="0.75"/>
  <text x="320" y="506" font-size="12.5" fill="#1A1B1E">成功率基线（无刻度）</text>
  <text x="680" y="532" font-size="14" fill="#1A1B1E" text-anchor="middle">攻击成功率（%）· 轴左端为基线，各条目数值标在实心点旁</text>

  <!-- panel a key -->
  <rect x="330" y="118" width="12" height="10" fill="#D55E00"/>
  <text x="347" y="127" font-size="12" fill="#555">正文给出精确值</text>
  <rect x="480" y="118" width="12" height="10" fill="#999999"/>
  <text x="497" y="127" font-size="12" fill="#555">正文报告「约」值</text>

  <!-- footnote -->
  <text x="60" y="576" font-size="11" fill="#767676">数据：AI Agent Traps（Google DeepMind，2026 年 3 月提交 SSRN，经 CyberNews / SecurityWeek / The Decoder 报道）</text>
  <text x="60" y="594" font-size="11" fill="#767676">成功率为研究实测口径 · 「约」为报道近似值 · 六类覆盖输入、记忆、行为到系统协作攻击面</text>
</svg>
