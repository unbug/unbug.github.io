<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">判为攻击失败的轨迹中 76.3%–80.3% 只是忽略注入，确认读到并明确拒绝的仅约 18.0%</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">攻击失败轨迹的行为构成（占各自失败轨迹的百分比）</text>

  <!-- gridlines: x = 250 + 8*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="650" y1="130" x2="650" y2="320"/>
    <line x1="1050" y1="130" x2="1050" y2="320"/>
  </g>

  <!-- AgentDojo: ignore 76.3 / refuse 18.0 / other 5.7 -->
  <text x="238" y="168" font-size="12.5" fill="#1A1B1E" text-anchor="end">AgentDojo</text>
  <text x="238" y="186" font-size="12.5" fill="#555" text-anchor="end">失败 14,699 条</text>
  <rect x="250" y="154" width="610.4" height="26" fill="#999999"/>
  <rect x="860.4" y="154" width="144" height="26" fill="#0072B2"/>
  <text x="555" y="171" font-size="12" fill="#FFFFFF" text-anchor="middle">忽略注入 76.3%</text>
  <text x="932" y="171" font-size="12" fill="#FFFFFF" text-anchor="middle">真实拒绝 18.0%</text>
  <text x="1012" y="171" font-size="12" fill="#555">其余 5.7</text>

  <!-- InjecAgent: ignore 80.3 / refuse 17.2 / other 2.5 -->
  <text x="238" y="238" font-size="12.5" fill="#1A1B1E" text-anchor="end">InjecAgent</text>
  <text x="238" y="256" font-size="12.5" fill="#555" text-anchor="end">失败 15,274 条</text>
  <rect x="250" y="224" width="642.4" height="26" fill="#999999"/>
  <rect x="892.4" y="224" width="137.6" height="26" fill="#0072B2"/>
  <text x="571" y="241" font-size="12" fill="#FFFFFF" text-anchor="middle">忽略注入 80.3%</text>
  <text x="961" y="241" font-size="12" fill="#FFFFFF" text-anchor="middle">真实拒绝 17.2%</text>
  <text x="1044" y="241" font-size="12" fill="#555">其余 2.5</text>

  <!-- value axis -->
  <line x1="250" y1="320" x2="1050" y2="320" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="250" y1="320" x2="250" y2="324"/>
    <line x1="650" y1="320" x2="650" y2="324"/>
    <line x1="1050" y1="320" x2="1050" y2="324"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="250" y="340">0</text>
    <text x="650" y="340">50</text>
    <text x="1050" y="340">100</text>
  </g>
  <text x="650" y="364" font-size="14" fill="#1A1B1E" text-anchor="middle">占失败轨迹比例（%）</text>

  <g font-size="12" fill="#555">
    <rect x="250" y="380" width="12" height="10" fill="#999999"/>
    <text x="267" y="389">忽略注入</text>
    <rect x="360" y="380" width="12" height="10" fill="#0072B2"/>
    <text x="377" y="389">真实拒绝（确认读到并明确拒绝）</text>
    <text x="250" y="412">忽略多由环境给不出工具调用路径等偶然因素造成，换环境可能改判；「其余」为 100 减两类后的残差</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="60" y="438" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="438" font-size="15" fill="#1A1B1E">识别出注入后仍照做的比例（%，识别轨迹内）</text>

  <!-- rows: x = 300 + 5*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="400" y1="456" x2="400" y2="560"/>
  </g>

  <text x="288" y="488" font-size="12.5" fill="#1A1B1E" text-anchor="end">AgentDojo</text>
  <rect x="300" y="475" width="144.5" height="18" fill="#D55E00"/>
  <text x="452" y="488" font-size="12" fill="#555">28.9</text>

  <text x="288" y="533" font-size="12.5" fill="#1A1B1E" text-anchor="end">InjecAgent</text>
  <rect x="300" y="520" width="84.5" height="18" fill="#D55E00"/>
  <text x="392" y="533" font-size="12" fill="#555">16.9</text>

  <!-- value axis -->
  <line x1="300" y1="560" x2="460" y2="560" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="560" x2="300" y2="564"/>
    <line x1="400" y1="560" x2="400" y2="564"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="580">0</text>
    <text x="400" y="580">20</text>
  </g>
  <text x="400" y="602" font-size="14" fill="#1A1B1E" text-anchor="middle">仍执行比例（%）</text>

  <!-- side notes -->
  <text x="560" y="472" font-size="12" fill="#555">Table 1c：MiniCPM-2B 先在回复里指出 a prompt injection attempt，</text>
  <text x="560" y="490" font-size="12" fill="#555">随后照常向攻击者账户汇出 $30,000</text>
  <text x="560" y="516" font-size="12" fill="#555">权重不动仅改 system prompt：允许工具输出携带指令时 InjecAgent ASR 冲到 43%，明确禁止版压到 0.2%</text>
  <text x="560" y="534" font-size="12" fill="#555">ATOM 交叉：AgentDojo 中 21.7% 轨迹「safe but dysfunctional」；</text>
  <text x="560" y="552" font-size="12" fill="#555">任务完成子集内 ASR 为 3.8%</text>
  <text x="560" y="578" font-size="12" fill="#555">FP16 基线 pooled ASR 仅 8.09%（InjecAgent）与 11.96%（AgentDojo）</text>

  <!-- footnote -->
  <text x="60" y="640" font-size="11" fill="#767676">数据：arXiv:2610.23254（33,000 条轨迹，11 个 2–14B 开源工具调用 agent）· 分类由 LLM judge 完成，两名作者按 XSTest 协议人工标注 150 条，攻击者行为标注全部一致、其余类别一致性 96% · 预印本未经同行评审</text>
</svg>
