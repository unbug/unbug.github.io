<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9A8F7C; }
      .rl { font-size: 15px; fill: #46423A; }
      .val { font-size: 20px; font-weight: 700; }
      .b { font-size: 12px; fill: #A69C86; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F9F6F0"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B24C4C"/><stop offset="1" stop-color="#D07A6E"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3F5E8C"/><stop offset="1" stop-color="#6E88AE"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9A441"/><stop offset="1" stop-color="#E9C578"/>
    </linearGradient>
    <linearGradient id="gOlive" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7D8B6F"/><stop offset="1" stop-color="#A3AF92"/>
    </linearGradient>
    <linearGradient id="gNeedle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B24C4C"/><stop offset="1" stop-color="#7D8B6F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1090" cy="115" r="140" fill="#3F5E8C" opacity="0.06"/>
  <circle cx="80" cy="615" r="120" fill="#B24C4C" opacity="0.06"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gRed)"/>

  <text class="k" x="64" y="84">一分钟读论文 · 2026-09-19 · ARXIV:2609.20301</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1E2430">归因到意图，织出火焰图</text>
  <text x="64" y="158" font-size="15" fill="#6E6A5C">语义操作栈 · 递归切分 · pprof 兼容输出</text>

  <!-- loom icon: frame + warp threads + shuttle + needle -->
  <g>
    <rect x="1006" y="74" width="10" height="98" rx="3" fill="#7D8B6F"/>
    <rect x="1126" y="74" width="10" height="98" rx="3" fill="#7D8B6F"/>
    <rect x="996" y="68" width="150" height="9" rx="4" fill="#3F5E8C"/>
    <line x1="1024" y1="77" x2="1024" y2="168" stroke="#B24C4C" stroke-width="2" opacity="0.55"/>
    <line x1="1044" y1="77" x2="1044" y2="168" stroke="#D9A441" stroke-width="2" opacity="0.6"/>
    <line x1="1064" y1="77" x2="1064" y2="168" stroke="#3F5E8C" stroke-width="2" opacity="0.5"/>
    <line x1="1084" y1="77" x2="1084" y2="168" stroke="#7D8B6F" stroke-width="2" opacity="0.6"/>
    <line x1="1104" y1="77" x2="1104" y2="168" stroke="#B24C4C" stroke-width="2" opacity="0.4"/>
    <line x1="1122" y1="77" x2="1122" y2="168" stroke="#D9A441" stroke-width="2" opacity="0.45"/>
    <rect x="1012" y="112" width="118" height="16" rx="8" fill="url(#gRed)"/>
    <circle cx="1012" cy="120" r="7" fill="#D9A441"/>
    <path d="M 992 186 l 96 -24 l 6 12 l -96 24 z" fill="url(#gNeedle)"/>
    <circle cx="1088" cy="167" r="4" fill="#D9A441"/>
  </g>

  <!-- flame / woven bands: width = share of trace -->
  <g>
    <rect x="64" y="238" width="716" height="62" fill="#3F5E8C" opacity="0.07"/>
    <rect x="64" y="310" width="716" height="62" fill="#3F5E8C" opacity="0.07"/>
    <rect x="64" y="382" width="716" height="62" fill="#3F5E8C" opacity="0.07"/>
    <rect x="64" y="454" width="716" height="62" fill="#3F5E8C" opacity="0.07"/>

    <text class="rl" x="72" y="232">整条轨迹 = 一匹布</text>
    <rect x="64" y="248" width="700" height="42" rx="6" fill="url(#gBlue)"/>
    <text x="414" y="275" text-anchor="middle" font-size="13.5" fill="#FFFFFF">聚合多条轨迹 · 递归操作切分</text>

    <text class="rl" x="72" y="304">一级意图</text>
    <rect x="64" y="320" width="266" height="42" rx="6" fill="url(#gRed)"/>
    <text x="197" y="347" text-anchor="middle" font-size="13" fill="#FFFFFF">diagnose auth</text>
    <rect x="336" y="320" width="210" height="42" rx="6" fill="url(#gGold)"/>
    <text x="441" y="347" text-anchor="middle" font-size="13" fill="#5F4614">compare branches</text>
    <rect x="552" y="320" width="212" height="42" rx="6" fill="url(#gOlive)"/>
    <text x="658" y="347" text-anchor="middle" font-size="13" fill="#FFFFFF">其余意图</text>

    <text class="rl" x="72" y="376">子任务（递归切分）</text>
    <rect x="64" y="392" width="133" height="42" rx="6" fill="#B24C4C" opacity="0.75"/>
    <rect x="203" y="392" width="82" height="42" rx="6" fill="#B24C4C" opacity="0.5"/>
    <rect x="291" y="392" width="55" height="42" rx="6" fill="#B24C4C" opacity="0.32"/>
    <rect x="336" y="392" width="120" height="42" rx="6" fill="#D9A441" opacity="0.72"/>
    <rect x="462" y="392" width="84" height="42" rx="6" fill="#D9A441" opacity="0.45"/>
    <rect x="552" y="392" width="118" height="42" rx="6" fill="#7D8B6F" opacity="0.7"/>
    <rect x="676" y="392" width="88" height="42" rx="6" fill="#7D8B6F" opacity="0.42"/>

    <text class="rl" x="72" y="448">宽度 = 消耗占比</text>
    <rect x="64" y="464" width="330" height="42" rx="6" fill="url(#gRed)"/>
    <text x="229" y="491" text-anchor="middle" font-size="13.5" fill="#FFFFFF" font-weight="700">热点意图</text>
    <rect x="400" y="464" width="180" height="42" rx="6" fill="url(#gGold)"/>
    <rect x="586" y="464" width="110" height="42" rx="6" fill="url(#gOlive)"/>
    <rect x="702" y="464" width="62" height="42" rx="6" fill="url(#gBlue)"/>
    <text class="b" x="764" y="491">→ pprof</text>
  </g>

  <!-- right column: anchor numbers -->
  <g>
    <text class="b" x="822" y="264">切分与人工标注对齐 · CodeTraceBench</text>
    <text class="serif" x="822" y="322" font-size="52" font-weight="700" fill="#3F5E8C">0.764</text>

    <line x1="822" y1="348" x2="1136" y2="348" stroke="#E5DFCE"/>

    <text class="b" x="822" y="384">三个定位基准 · MAP 最高提升</text>
    <text class="serif" x="822" y="442" font-size="52" font-weight="700" fill="#B24C4C">+56%</text>

    <g>
      <rect x="822" y="472" width="112" height="28" rx="14" fill="#D9A441" opacity="0.3"/>
      <text x="878" y="491" text-anchor="middle" font-size="12.5" fill="#7A5A18">token 优化</text>
      <rect x="944" y="472" width="88" height="28" rx="14" fill="#7D8B6F" opacity="0.3"/>
      <text x="988" y="491" text-anchor="middle" font-size="12.5" fill="#4E5A42">问题定位</text>
      <rect x="1042" y="472" width="94" height="28" rx="14" fill="#3F5E8C" opacity="0.25"/>
      <text x="1089" y="491" text-anchor="middle" font-size="12.5" fill="#33486B">资源归因</text>
    </g>
    <text class="b" x="822" y="524">火焰图宽度对应占比 · 现有工具链直接消费</text>
  </g>

  <line x1="64" y1="556" x2="1136" y2="556" stroke="#E8E2D0"/>
  <text x="64" y="590" font-size="15.5" fill="#46423A">责任实体不是代码路径，而是任务意图。</text>
  <text class="b" x="64" y="620">预印本 · 作者自选基准 · 研究原型非生产系统 · pprof 兼容仅指输出格式 · Micropaper</text>
</svg>
