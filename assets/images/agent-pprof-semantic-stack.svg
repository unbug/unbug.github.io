<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="620" fill="#fbfbfd"/>
  <text x="430" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a2e">AgentPProf：把火焰图搬进长程 Agent</text>
  <text x="430" y="62" text-anchor="middle" font-size="13" fill="#666">归因单位从代码路径换成任务意图 · arXiv:2609.20301（2026-09-14，预印本，无机构落款）</text>

  <!-- 问题 -->
  <rect x="40" y="88" width="250" height="150" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="165" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">缺口：长期画像</text>
  <text x="165" y="144" text-anchor="middle" font-size="12" fill="#444">Agent 跑几天几周的长任务</text>
  <text x="165" y="166" text-anchor="middle" font-size="12" fill="#444">现有工具只做单次调试追踪</text>
  <text x="165" y="192" text-anchor="middle" font-size="12" fill="#b91c1c">责任实体是任务意图</text>
  <text x="165" y="214" text-anchor="middle" font-size="12" fill="#b91c1c">不是代码路径，无稳定标识符</text>

  <!-- 方案 -->
  <rect x="330" y="88" width="250" height="150" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="455" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">方案：语义操作栈</text>
  <text x="455" y="144" text-anchor="middle" font-size="12" fill="#444">统一 operation 表示一切活动</text>
  <text x="455" y="166" text-anchor="middle" font-size="12" fill="#444">操作栈替代运行时调用栈</text>
  <text x="455" y="192" text-anchor="middle" font-size="12" fill="#444">任务占连续区间 → 沿任务边界</text>
  <text x="455" y="214" text-anchor="middle" font-size="12" fill="#444">递归切分（recursive segmentation）</text>

  <!-- 输出 -->
  <rect x="620" y="88" width="200" height="150" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="720" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">输出：火焰图</text>
  <text x="720" y="144" text-anchor="middle" font-size="12" fill="#444">聚合多轨迹为</text>
  <text x="720" y="164" text-anchor="middle" font-size="12" fill="#444">pprof 兼容 profile</text>
  <text x="720" y="192" text-anchor="middle" font-size="12" fill="#166534">现有火焰图工具链直接消费</text>
  <text x="720" y="218" text-anchor="middle" font-size="11.5" fill="#b45309">格式兼容 ≠ 官方集成</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="292" y1="163" x2="326" y2="163" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="582" y1="163" x2="616" y2="163" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 结果 -->
  <rect x="40" y="268" width="780" height="130" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="60" y="296" font-size="14.5" font-weight="700" fill="#92400e">两组数字（作者自选基准）</text>
  <rect x="60" y="312" width="360" height="44" rx="6" fill="#fef3c7"/>
  <text x="240" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">CodeTraceBench 对齐得分 0.764</text>
  <text x="240" y="350" text-anchor="middle" font-size="11" fill="#a16207">轨迹切分 vs 人工标注</text>
  <rect x="440" y="312" width="360" height="44" rx="6" fill="#fde68a"/>
  <text x="620" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">三个问题定位基准 MAP 最高 +56%</text>
  <text x="620" y="350" text-anchor="middle" font-size="11" fill="#a16207">profile 注入定位流程后的排序质量增益</text>
  <text x="60" y="384" font-size="12" fill="#444">主张：在实际可接受开销内完成资源归因、问题定位与 token 成本优化。</text>

  <!-- 边界 -->
  <rect x="40" y="420" width="540" height="146" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="448" font-size="14" font-weight="700" fill="#334155">四条折扣前提</text>
  <text x="60" y="474" font-size="12" fill="#444">1. 未经同行评审的预印本，无机构落款</text>
  <text x="60" y="496" font-size="12" fill="#444">2. 数字出自作者自选基准，泛化待第三方证据</text>
  <text x="60" y="518" font-size="12" fill="#444">3. 数天至数周长任务场景普及度存疑（现网多为分钟级）</text>
  <text x="60" y="540" font-size="12" fill="#444">4. 火焰图交互语义在任务意图粒度如何落地未展开</text>

  <!-- 与 #175 对比 -->
  <rect x="600" y="420" width="220" height="146" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="710" y="448" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e40af">与 #175 的区别</text>
  <text x="710" y="476" text-anchor="middle" font-size="11.5" fill="#444">#175：评测侧错觉</text>
  <text x="710" y="496" text-anchor="middle" font-size="11.5" fill="#444">缺对照 → 预算误读成能力</text>
  <text x="710" y="524" text-anchor="middle" font-size="11.5" fill="#444">本篇：运维侧归因工具</text>
  <text x="710" y="544" text-anchor="middle" font-size="11.5" fill="#444">只回答钱记在哪个任务头上</text>

  <rect x="40" y="580" width="780" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="430" y="600" text-anchor="middle" font-size="11.5" fill="#64748b">研究原型非生产系统 · 配套开源 agentsight（eunomia-bpf）· pprof 为 Go 生态性能分析格式</text>
</svg>
