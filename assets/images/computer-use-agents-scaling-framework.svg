<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Arial, sans-serif">
  <rect width="800" height="520" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">Inference-Time Scaling in Local Computer-Use Agents</text>

  <!-- Four Dimensions (top section) -->
  <rect x="30" y="50" width="740" height="200" rx="10" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="400" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#455a64">Four Scaling Dimensions</text>

  <!-- Contextual Scaling -->
  <rect x="50" y="85" width="170" height="145" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="135" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">Contextual Scaling</text>
  <line x1="70" y1="115" x2="200" y2="115" stroke="#1976d2" stroke-width="1"/>

  <!-- Pros -->
  <rect x="65" y="122" width="140" height="30" rx="3" fill="#bbdefb"/>
  <text x="135" y="141" text-anchor="middle" font-size="10" fill="#1565c0">+ Trajectory stability</text>

  <!-- Cons -->
  <rect x="65" y="158" width="140" height="30" rx="3" fill="#ffcdd2"/>
  <text x="135" y="177" text-anchor="middle" font-size="10" fill="#c62828">+ Gains saturate with cost</text>

  <!-- Failure mode -->
  <rect x="65" y="194" width="140" height="30" rx="3" fill="#fff3e0"/>
  <text x="135" y="213" text-anchor="middle" font-size="10" fill="#e65100">→ Premature false success</text>

  <!-- Temporal Scaling -->
  <rect x="240" y="85" width="170" height="145" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="325" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">Temporal Scaling</text>
  <line x1="260" y1="115" x2="390" y2="115" stroke="#388e3c" stroke-width="1"/>

  <!-- Pros -->
  <rect x="255" y="122" width="140" height="30" rx="3" fill="#c8e6c9"/>
  <text x="325" y="141" text-anchor="middle" font-size="10" fill="#2e7d32">- Max-step stalls reduced</text>

  <!-- Cons -->
  <rect x="255" y="158" width="140" height="30" rx="3" fill="#ffcdd2"/>
  <text x="325" y="177" text-anchor="middle" font-size="10" fill="#c62828">× No success rate improvement</text>

  <!-- Failure mode -->
  <rect x="255" y="194" width="140" height="30" rx="3" fill="#fff3e0"/>
  <text x="325" y="213" text-anchor="middle" font-size="10" fill="#e65100">→ Extended erroneous traces</text>

  <!-- Structural Decomposition -->
  <rect x="430" y="85" width="170" height="145" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="515" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">Structural Decomposition</text>
  <line x1="450" y1="115" x2="580" y2="115" stroke="#f57c00" stroke-width="1"/>

  <!-- Pros -->
  <rect x="445" y="122" width="140" height="30" rx="3" fill="#ffe0b2"/>
  <text x="515" y="141" text-anchor="middle" font-size="10" fill="#e65100">+ Partial failure mitigation</text>

  <!-- Cons -->
  <rect x="445" y="158" width="140" height="30" rx="3" fill="#ffcdd2"/>
  <text x="515" y="177" text-anchor="middle" font-size="10" fill="#c62828">+ Planning/formatting overhead</text>

  <!-- Failure mode -->
  <rect x="445" y="194" width="140" height="30" rx="3" fill="#fff3e0"/>
  <text x="515" y="213" text-anchor="middle" font-size="10" fill="#e65100">→ High compute cost</text>

  <!-- Parallel Scaling -->
  <rect x="620" y="85" width="140" height="145" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="690" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#6a1b9a">Parallel Scaling</text>
  <line x1="640" y1="115" x2="740" y2="115" stroke="#7b1fa2" stroke-width="1"/>

  <!-- Pros -->
  <rect x="635" y="122" width="110" height="30" rx="3" fill="#e1bee7"/>
  <text x="690" y="141" text-anchor="middle" font-size="10" fill="#6a1b9a">+ Partial mitigation</text>

  <!-- Cons -->
  <rect x="635" y="158" width="110" height="30" rx="3" fill="#ffcdd2"/>
  <text x="690" y="177" text-anchor="middle" font-size="10" fill="#c62828">× Substantial cost</text>

  <!-- Failure mode -->
  <rect x="635" y="194" width="110" height="30" rx="3" fill="#fff3e0"/>
  <text x="690" y="213" text-anchor="middle" font-size="10" fill="#e65100">→ Cost-prohibitive</text>

  <!-- Key Finding (center section) -->
  <rect x="30" y="270" width="740" height="80" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
  <text x="400" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#f57f17">Key Finding: Additional Compute Changes Failure Modes, Not Success Rate</text>

  <!-- Failure Mode Transfer Diagram -->
  <rect x="80" y="310" width="200" height="30" rx="4" fill="#ef5350"/>
  <text x="180" y="330" text-anchor="middle" font-size="10" fill="white">Repetitive/Stalled Trajectories</text>

  <!-- Arrow -->
  <path d="M 280 325 L 340 325" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="320" text-anchor="middle" font-size="9" fill="#666">+ Compute</text>

  <!-- Arrow down -->
  <path d="M 400 310 L 400 350" stroke="#f57c00" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="335" text-anchor="middle" font-size="9" fill="#f57c00">Changes</text>

  <rect x="520" y="310" width="200" height="30" rx="4" fill="#ffa726"/>
  <text x="620" y="330" text-anchor="middle" font-size="10" fill="white">Premature False Successes</text>

  <!-- Models Evaluated (bottom section) -->
  <rect x="30" y="375" width="740" height="120" rx="8" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="400" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#455a64">Models Evaluated on OSWorld Benchmark</text>

  <!-- Model 1 -->
  <rect x="60" y="410" width="170" height="70" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
  <text x="145" y="433" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">Qwen3-VL-8B</text>
  <text x="145" y="450" text-anchor="middle" font-size="9" fill="#546e7a">Multimodal CUA</text>
  <text x="145" y="465" text-anchor="middle" font-size="9" fill="#546e7a">+ Qwen3-VL-30B-A3B</text>

  <!-- Model 2 -->
  <rect x="250" y="410" width="170" height="70" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="335" y="433" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">UI-TARS-1.5-7B</text>
  <text x="335" y="450" text-anchor="middle" font-size="9" fill="#546e7a">OS Interaction Agent</text>
  <text x="335" y="465" text-anchor="middle" font-size="9" fill="#546e7a">Specialized CUA</text>

  <!-- Model 3 -->
  <rect x="440" y="410" width="170" height="70" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="1"/>
  <text x="525" y="433" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">OpenCUA-7B</text>
  <text x="525" y="450" text-anchor="middle" font-size="9" fill="#546e7a">Open-source CUA</text>
  <text x="525" y="465" text-anchor="middle" font-size="9" fill="#546e7a">General-purpose</text>

  <!-- Recommendation -->
  <rect x="630" y="410" width="130" height="70" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
  <text x="695" y="433" text-anchor="middle" font-size="10" font-weight="bold" fill="#b71c1c">Recommendation:</text>
  <text x="695" y="450" text-anchor="middle" font-size="9" fill="#c62828">Selective compute</text>
  <text x="695" y="463" text-anchor="middle" font-size="9" fill="#c62828">allocation + failure-</text>
  <text x="695" y="474" text-anchor="middle" font-size="9" fill="#c62828">aware control</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
</svg>
