<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #97907F; }
      .rl { font-size: 15px; fill: #4A4757; }
      .val { font-size: 17px; font-weight: 700; fill: #1A1B1E; }
      .b { font-size: 12px; fill: #A29B8C; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F7F5EF"/>
    </linearGradient>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A5399"/><stop offset="1" stop-color="#7B84C4"/>
    </linearGradient>
    <linearGradient id="gVermil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C0455E"/><stop offset="1" stop-color="#DE7E90"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D08A2C"/><stop offset="1" stop-color="#E6B65C"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F8F86"/><stop offset="1" stop-color="#66B5AC"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1102" cy="112" r="150" fill="#4A5399" opacity="0.06"/>
  <circle cx="86" cy="616" r="115" fill="#2F8F86" opacity="0.07"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gVermil)"/>

  <text class="k" x="64" y="84">一分钟读论文 · ARXIV:2607.28573</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">火大了，菜没熟</text>
  <text x="64" y="158" font-size="15" fill="#5C5867">本地计算机使用 Agent 的推理时扩展：四个灶眼，OSWorld 四个开源模型的实测</text>

  <!-- kitchen motif: wok over flames -->
  <g>
    <path d="M 1000 96 q 58 -34 116 0" fill="none" stroke="#D08A2C" stroke-width="3" opacity="0.5"/>
    <path d="M 1014 104 q 44 -26 88 0" fill="none" stroke="#D08A2C" stroke-width="3" opacity="0.38"/>
    <path d="M 996 112 h 124 l -12 40 a 50 24 0 0 1 -100 0 z" fill="url(#gIndigo)"/>
    <rect x="986" y="105" width="144" height="9" rx="4.5" fill="#3D4478"/>
    <circle cx="1130" cy="109" r="5" fill="#E6B65C"/>
    <path d="M 1034 168 q 4 -14 12 -4 q 3 -16 14 -3 q 8 -12 14 2 q 8 -6 8 5 h -48 z" fill="url(#gVermil)" opacity="0.85"/>
    <path d="M 1046 182 h 34 l -5 14 a 12 6 0 0 1 -24 0 z" fill="#2F8F86" opacity="0.7"/>
    <text x="1062" y="216" text-anchor="middle" font-size="12" fill="#8A8474">加火 ≠ 炒熟</text>
  </g>

  <!-- four burner rows: dim | effect | cost -->
  <g>
    <rect x="176" y="208" width="924" height="72" fill="#4A5399" opacity="0.08"/>
    <text class="rl" x="160" y="250" text-anchor="end">上下文扩展</text>
    <text x="196" y="243" font-size="14" fill="#3D4478" font-weight="700">轨迹更稳，收益随 token 成本饱和</text>
    <text class="b" x="196" y="266">失败从「重复停滞」转为「过早错误成功」</text>
    <text x="1082" y="252" text-anchor="end" font-size="16" font-weight="700" fill="#C0455E">token 成本 ↑</text>

    <text class="rl" x="160" y="322" text-anchor="end">时间扩展</text>
    <text x="196" y="315" font-size="14" fill="#3D4478" font-weight="700">停滞少了，成功率没显著上去</text>
    <text class="b" x="196" y="338">更长视界是延长错误轨迹，不是纠正它</text>
    <text x="1082" y="324" text-anchor="end" font-size="16" font-weight="700" fill="#C0455E">收益 ≈ 0</text>

    <rect x="176" y="352" width="924" height="72" fill="#D08A2C" opacity="0.09"/>
    <text class="rl" x="160" y="394" text-anchor="end">结构分解</text>
    <text x="196" y="387" font-size="14" fill="#3D4478" font-weight="700">规划 + 格式化开销，部分缓解失败</text>
    <text class="b" x="196" y="410">两阶段本地 Agent 的解药，但贵</text>
    <text x="1082" y="396" text-anchor="end" font-size="16" font-weight="700" fill="#D08A2C">代价高昂</text>

    <text class="rl" x="160" y="466" text-anchor="end">并行扩展</text>
    <text x="196" y="459" font-size="14" fill="#3D4478" font-weight="700">再缓解一层，靠堆算力硬撑</text>
    <text class="b" x="196" y="482">部署可行性存疑</text>
    <text x="1082" y="468" text-anchor="end" font-size="16" font-weight="700" fill="#C0455E">成本大增</text>
  </g>

  <line x1="64" y1="508" x2="1136" y2="508" stroke="#E7E2D2"/>
  <text class="serif" x="64" y="556" font-size="26" font-weight="700" fill="#1A1B1E">额外计算 <tspan fill="#C0455E">不提高成功率</tspan>，只改变失败模式</text>
  <text class="b" x="1136" y="556" text-anchor="end">Qwen3-VL-8B / 30B-A3B · UI-TARS-1.5-7B · OpenCUA-7B</text>
  <text class="serif" x="64" y="592" font-size="16" fill="#2F8F86">Agent 不是做得更多，而是更早地错、更早地停。</text>

  <text x="64" y="640" font-size="12.5" fill="#A29C88">OSWorld 基准 · 本地硬件约束下的四模型自测口径 · 结论针对资源受限模型，不适用前沿云端 CUA · Micropaper</text>
</svg>
