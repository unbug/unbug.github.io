<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="1200" height="470" fill="#FFFFFF"/>
<text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">不动权重的自进化：记忆、外壳、技能三条更新通道</text>
<rect x="70" y="90" width="330" height="150" rx="12" fill="#EAF2FB" stroke="#2F6FB2" stroke-width="2"/>
<text x="235" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">记忆通道 · Recuris</text>
<text x="235" y="154" text-anchor="middle" font-size="13" fill="#374151">把失败定位到具体记忆组件</text>
<text x="235" y="180" text-anchor="middle" font-size="13" fill="#374151">更新的是检索/摘要/存储环节</text>
<text x="235" y="212" text-anchor="middle" font-size="12" fill="#6B7280">归因粒度 = 改进上限</text>
<rect x="435" y="90" width="330" height="150" rx="12" fill="#FDF6E3" stroke="#D1A400" stroke-width="2"/>
<text x="600" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#713F12">外壳通道 · StarHarness</text>
<text x="600" y="154" text-anchor="middle" font-size="13" fill="#374151">harness 配置与流程的自搜索</text>
<text x="600" y="180" text-anchor="middle" font-size="13" fill="#374151">更新的是编排与工具接线</text>
<text x="600" y="212" text-anchor="middle" font-size="12" fill="#6B7280">候选必须过回归才上岗</text>
<rect x="800" y="90" width="330" height="150" rx="12" fill="#EAF6EF" stroke="#166534" stroke-width="2"/>
<text x="965" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#14532D">技能通道 · SkillForge</text>
<text x="965" y="154" text-anchor="middle" font-size="13" fill="#374151">把成功经验蒸馏成可复用技能</text>
<text x="965" y="180" text-anchor="middle" font-size="13" fill="#374151">更新的是技能库文件</text>
<text x="965" y="212" text-anchor="middle" font-size="12" fill="#6B7280">警惕技能误进化：写入前审计</text>
<rect x="200" y="290" width="800" height="110" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="600" y="324" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2937">共同回路</text>
<text x="600" y="356" text-anchor="middle" font-size="14" fill="#374151">执行 → 失败归因 → 非权重更新 → 回归验证 → 上线/回滚</text>
<text x="600" y="382" text-anchor="middle" font-size="13" fill="#6B7280">验证器质量决定进化方向：与生成-验证差距共享同一个天花板</text>
<text x="600" y="444" text-anchor="middle" font-size="14" fill="#6B7280">权重不动，系统变好——变好的每一格都可回滚、可审计，这是文件通道对梯度通道的结构优势</text></svg>
