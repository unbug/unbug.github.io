<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">Skill 库扩至一千个无关项时加载召回从 73.6% 跌至 27.4%，零加载率升至 51.6%；同一库改为显式选择，召回保住 73.9%</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">库规模扩至一千个无关 skill：隐式路由与显式选择（%）</text>

  <!-- horizontal gridlines: y = 420 - 3.2*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="170" y1="352" x2="560" y2="352"/>
    <line x1="170" y1="284" x2="560" y2="284"/>
    <line x1="170" y1="216" x2="560" y2="216"/>
    <line x1="170" y1="148" x2="560" y2="148"/>
  </g>

  <!-- bars: y = 420 - 3.2*v -->
  <!-- implicit recall small scale 73.6 -->
  <rect x="195" y="184.5" width="64" height="235.5" fill="#56B4E9"/>
  <text x="227" y="176" font-size="12" fill="#555" text-anchor="middle">73.6%</text>
  <text x="227" y="440" font-size="12.5" fill="#1A1B1E" text-anchor="middle">小库 · 隐式</text>

  <!-- implicit recall 1k 27.4 -->
  <rect x="300" y="332.3" width="64" height="87.7" fill="#56B4E9"/>
  <text x="332" y="324" font-size="12" fill="#555" text-anchor="middle">27.4%</text>
  <text x="332" y="440" font-size="12.5" fill="#1A1B1E" text-anchor="middle">1k · 隐式</text>

  <!-- explicit 1k 73.9 -->
  <rect x="405" y="183.5" width="64" height="236.5" fill="#0072B2"/>
  <text x="437" y="175" font-size="12" fill="#555" text-anchor="middle">73.9%</text>
  <text x="437" y="440" font-size="12.5" fill="#1A1B1E" text-anchor="middle">1k · 显式</text>

  <!-- zero-load 1k 51.6 -->
  <rect x="470" y="254.9" width="64" height="165.1" fill="#D55E00"/>
  <text x="502" y="246" font-size="12" fill="#555" text-anchor="middle">51.6%</text>
  <text x="502" y="440" font-size="12.5" fill="#1A1B1E" text-anchor="middle">1k · 零加载</text>

  <!-- value axis -->
  <line x1="170" y1="420" x2="560" y2="420" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="166" y1="420" x2="170" y2="420"/>
    <line x1="166" y1="352" x2="170" y2="352"/>
    <line x1="166" y1="284" x2="170" y2="284"/>
    <line x1="166" y1="216" x2="170" y2="216"/>
    <line x1="166" y1="148" x2="170" y2="148"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="160" y="424">0</text>
    <text x="160" y="356">20</text>
    <text x="160" y="288">40</text>
    <text x="160" y="220">60</text>
    <text x="160" y="152">80</text>
  </g>
  <text x="100" y="140" font-size="14" fill="#1A1B1E">占比（%）</text>

  <!-- legend -->
  <g font-size="12" fill="#555">
    <rect x="180" y="126" width="12" height="10" fill="#56B4E9"/>
    <text x="197" y="135">加载召回（隐式）</text>
    <rect x="310" y="126" width="12" height="10" fill="#0072B2"/>
    <text x="327" y="135">加载召回（显式选择）</text>
    <rect x="452" y="126" width="12" height="10" fill="#D55E00"/>
    <text x="469" y="135">零加载率</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="650" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="672" y="104" font-size="15" fill="#1A1B1E">百级规模已现退化：加载召回降幅（个百分点）</text>

  <!-- gridlines x = 780 + 4*t -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="880" y1="130" x2="880" y2="372"/>
    <line x1="980" y1="130" x2="980" y2="372"/>
    <line x1="1080" y1="130" x2="1080" y2="372"/>
  </g>
  <!-- bars: x = 780 + 4*t -->
  <text x="768" y="171" font-size="12.5" fill="#1A1B1E" text-anchor="end">GLM-5</text>
  <rect x="780" y="157" width="98.4" height="18" fill="#009E73"/>
  <text x="886" y="171" font-size="12" fill="#555">24.6</text>

  <text x="768" y="237" font-size="12.5" fill="#1A1B1E" text-anchor="end">Kimi K2.5</text>
  <rect x="780" y="223" width="62.4" height="18" fill="#009E73"/>
  <text x="850" y="237" font-size="12" fill="#555">15.6</text>

  <text x="768" y="303" font-size="12.5" fill="#1A1B1E" text-anchor="end">MiniMax M2.5</text>
  <rect x="780" y="289" width="82.8" height="18" fill="#009E73"/>
  <text x="870" y="303" font-size="12" fill="#555">20.7</text>

  <!-- axis -->
  <line x1="780" y1="372" x2="1100" y2="372" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="780" y1="372" x2="780" y2="376"/>
    <line x1="880" y1="372" x2="880" y2="376"/>
    <line x1="980" y1="372" x2="980" y2="376"/>
    <line x1="1080" y1="372" x2="1080" y2="376"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="780" y="392">0</text>
    <text x="880" y="392">25</text>
    <text x="980" y="392">50</text>
    <text x="1080" y="392">75</text>
  </g>
  <text x="940" y="416" font-size="14" fill="#1A1B1E" text-anchor="middle">加载召回降幅（个百分点）</text>

  <!-- panel b companion: Pass@3 lag -->
  <g font-size="12" fill="#555">
    <text x="650" y="452">同规模下任务成功率基本守在基线附近：GLM-5 的 Pass@3 从 57.3% 到 56.1%，</text>
    <text x="650" y="472">Kimi K2.5 从 52.4% 到 50.6%；百级降幅为三个开源权重模型，未覆盖闭源前沿模型。</text>
  </g>

  <!-- footnote -->
  <text x="60" y="600" font-size="11" fill="#767676">数据：arXiv:2610.18522（SkillsBench 任务与 golden skills 固定，逐批加入无关 skill）· 零加载率随库从小到 1k 由 9.3% 涨至 51.6% · 论文自测口径 · 预印本未经同行评审</text>
</svg>
