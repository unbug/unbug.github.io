<text x="340" y="360" text-anchor="middle" font-size="13" fill="#6B7280">代际</text>
<text x="90" y="120" font-size="13" fill="#6B7280">加速比</text>
<path d="M140,320 C 240,312 320,290 400,220 C 450,175 500,130 540,110" fill="none" stroke="#C0392B" stroke-width="3"/>
<text x="545" y="150" font-size="15" font-weight="700" fill="#C0392B">52×</text>
<text x="330" y="250" font-size="13" fill="#374151">AI 辅助 AI 研发的工作流速度的量级放大</text>
<rect x="660" y="100" width="470" height="90" rx="10" fill="#EAF6EF" stroke="#166534" stroke-width="2"/>
