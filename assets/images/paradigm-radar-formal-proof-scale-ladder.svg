<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica Neue, Arial, PingFang SC, sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <text x="60" y="42" font-size="16" font-weight="700" fill="#1A1B1E">AI 形式化证明的规模已超过人类项目两个数量级，1700 万行只是中游水平</text>

  <text x="60" y="92" font-size="15" font-weight="700" fill="#1A1B1E">a　Lean 仓库代码行数（百万行，对数刻度）</text>
  <line x1="300" y1="115" x2="300" y2="470" stroke="#1A1B1E" stroke-width="0.75"/>
  <line x1="180" y1="470" x2="1120" y2="470" stroke="#1A1B1E" stroke-width="0.75"/>
  <line x1="300" y1="415" x2="1120" y2="415" stroke="#cccccc" stroke-width="0.5"/>
  <line x1="505" y1="415" x2="1120" y2="415" stroke="#cccccc" stroke-width="0.5"/>
  <line x1="710" y1="415" x2="1120" y2="415" stroke="#cccccc" stroke-width="0.5"/>
  <line x1="915" y1="415" x2="1120" y2="415" stroke="#cccccc" stroke-width="0.5"/>
  <line x1="300" y1="470" x2="300" y2="474" stroke="#1A1B1E" stroke-width="0.75"/>
  <line x1="505" y1="470" x2="505" y2="474" stroke="#1A1B1E" stroke-width="0.75"/>
  <line x1="710" y1="470" x2="710" y2="474" stroke="#1A1B1E" stroke-width="0.75"/>
  <line x1="915" y1="470" x2="915" y2="474" stroke="#1A1B1E" stroke-width="0.75"/>
  <text x="300" y="490" font-size="12.5" fill="#1A1B1E" text-anchor="middle">1</text>
  <text x="505" y="490" font-size="12.5" fill="#1A1B1E" text-anchor="middle">10</text>
  
  <text x="915" y="490" font-size="12.5" fill="#1A1B1E" text-anchor="middle">1,000</text>
  <text x="650" y="516" font-size="14" fill="#1A1B1E" text-anchor="middle">Lean 代码行数（百万行，对数刻度）</text>

  <text x="180" y="141" font-size="12" fill="#1A1B1E">88M　Qiuzhen-CFSG/CFSG：AI 建的群论分类证明库，仍在进行</text>
  <rect x="300" y="148" width="399" height="28" fill="#D55E00"/>

  <text x="180" y="209" font-size="12" fill="#1A1B1E">36M　CBirkbeck/LeanBridge：约 98% 由脚本生成，手写约 50 万行</text>
  <rect x="300" y="216" width="319" height="28" fill="#999999"/>

  <text x="180" y="277" font-size="12" fill="#1A1B1E">27M　anthropics/fermats-last-theorem：AI agent 产出的费马大定理完整证明</text>
  <rect x="300" y="284" width="293" height="28" fill="#999999"/>

  <text x="180" y="345" font-size="12" fill="#1A1B1E">17M　被机构盖章的那份证明库</text>
  <rect x="300" y="352" width="252" height="28" fill="#999999"/>

  <text x="180" y="413" font-size="12" fill="#1A1B1E">0.06M　Kevin Buzzard 主持的人类费马大定理项目，仍在进行</text>
  <rect x="300" y="420" width="63" height="28" fill="#D55E00"/>

  <text x="60" y="560" font-size="15" font-weight="700" fill="#1A1B1E">b　人类手写 Lean 的两把标尺</text>
  <rect x="60" y="580" width="200" height="34" fill="#D55E00"/>
  <text x="272" y="603" font-size="12.5" fill="#1A1B1E">Mathlib 著名证明库：超过 1,000 条著名定理，只有 259 条配有 Lean 证明，均为人类手写</text>
  <rect x="60" y="620" width="200" height="34" fill="#D55E00"/>
  <text x="272" y="643" font-size="12.5" fill="#1A1B1E">Reservoir 目录：收录所有已发布的 Lean 包，其中 938 个在 GitHub 上有 Lean 代码</text>

  <text x="620" y="603" font-size="12" fill="#555555">AI 版费马大定理库约为人类版本的 450 倍长（6 万行对 27M 行）。</text>

  <text x="60" y="668" font-size="11" fill="#767676">口径：88M / 36M / 27M / 6 万行 / 259 / 938 / 450 倍均转引自 micjm.com 博客《Yes, 17m lines of Lean is a lot》（作者自述用 AI 检索来源并制图，检索于 2026-11-24 上午），属二手整理非一手核实 · 17M 为 Lean 社区联合声明自述口径，与工件页的模块数、导出字节数为两套口径，不可混用于同一比率 · 图内数值为近似</text>
</svg>
