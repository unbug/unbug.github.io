<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="700" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">医疗 CoT 扰动审计：诊断全对，推理链是摆设吗（arXiv:2608.24790，TU Eindhoven + Dana-Farber）</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Method flow -->
  <rect x="40" y="62" width="180" height="70" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="130" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">原始医疗问题</text>
  <text x="130" y="108" text-anchor="middle" font-size="11" fill="#4338ca">+ 模型可见推理链</text>

  <rect x="260" y="52" width="330" height="90" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="425" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">M-block：30 算子扰动套件</text>
  <text x="425" y="94" text-anchor="middle" font-size="11" fill="#78350f">severity reversal · negation flip</text>
  <text x="425" y="110" text-anchor="middle" font-size="11" fill="#78350f">demographic swap · evidence ablation …</text>
  <text x="425" y="128" text-anchor="middle" font-size="11" fill="#78350f">同时编辑问题与推理链</text>

  <rect x="630" y="62" width="290" height="70" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="775" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">chain-update × answer-flip</text>
  <text x="775" y="108" text-anchor="middle" font-size="11" fill="#4338ca">联合分析，按失败模式分类模型</text>

  <line x1="220" y1="97" x2="260" y2="97" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="590" y1="97" x2="630" y2="97" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Scope -->
  <rect x="40" y="168" width="880" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="480" y="193" text-anchor="middle" font-size="12" fill="#334155">评测规模：14 LLMs（开源 + 闭源层）× 4 个医疗 QA benchmark（MedQA / MedMCQA / PubMedQA 等）</text>

  <!-- Three tests -->
  <text x="40" y="248" font-size="15" font-weight="bold" fill="#1e293b">三个独立测试收敛于同一解耦</text>

  <rect x="40" y="264" width="280" height="120" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="180" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">测试 1：CDR</text>
  <rect x="70" y="304" width="180" height="26" rx="4" fill="#dc2626"/>
  <text x="160" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">72.9%</text>
  <text x="180" y="352" text-anchor="middle" font-size="11" fill="#7f1d1d">链条未登记编辑且答案不翻转</text>
  <text x="180" y="370" text-anchor="middle" font-size="11" fill="#7f1d1d">panel-wide（临床有意义破坏性编辑）</text>

  <rect x="340" y="264" width="280" height="120" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="480" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">测试 2：chain corruption</text>
  <text x="480" y="316" text-anchor="middle" font-size="12" fill="#7f1d1d">直接破坏推理链</text>
  <text x="480" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">准确率不变</text>
  <text x="480" y="366" text-anchor="middle" font-size="11" fill="#7f1d1d">链条对最终答案贡献很小</text>

  <rect x="640" y="264" width="280" height="120" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="780" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">测试 3：去掉 CoT prompting</text>
  <text x="780" y="316" text-anchor="middle" font-size="12" fill="#7f1d1d">不做推理提示直接作答</text>
  <text x="780" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">准确率不降</text>
  <text x="780" y="366" text-anchor="middle" font-size="11" fill="#7f1d1d">三测试相互独立、方向一致</text>

  <!-- Clinician validation -->
  <rect x="40" y="412" width="430" height="90" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="56" y="436" font-size="12" font-weight="bold" fill="#1e40af">临床验证（M-block soundness）</text>
  <text x="56" y="458" font-size="11" fill="#1e3a8a">两名持证临床医生重标注 N=197 个扰动问题</text>
  <text x="56" y="478" font-size="11" fill="#1e3a8a">98.5% 的 gold 答案仍站得住 → 验证扰动合理，非模型正确率</text>

  <!-- Robustness -->
  <rect x="490" y="412" width="430" height="90" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="506" y="436" font-size="12" font-weight="bold" fill="#1e40af">稳健性与闭源层</text>
  <text x="506" y="458" font-size="11" fill="#1e3a8a">模式跨医疗/推理微调与规模保持</text>
  <text x="506" y="478" font-size="11" fill="#1e3a8a">闭源层链文本不可得：答案侧信号与同一解耦一致（间接证据）</text>

  <!-- Boundary box -->
  <rect x="40" y="524" width="430" height="112" rx="8" fill="#fefce8" stroke="#ca8a04"/>
  <text x="56" y="546" font-size="12" font-weight="bold" fill="#854d0e">边界与限定</text>
  <text x="56" y="566" font-size="11" fill="#713f12">· CDR 72.9% 限「临床有意义破坏性编辑」子集，panel-wide 值</text>
  <text x="56" y="584" font-size="11" fill="#713f12">· 结论限于医疗 QA，禁泛化到所有 CoT 应用</text>
  <text x="56" y="602" font-size="11" fill="#713f12">· 「decorative」是论文对解耦现象的定性表述</text>
  <text x="56" y="620" font-size="11" fill="#713f12">· 与 EchoCoT（黑箱隐藏链提取）方向不同：本篇测可见链是否被使用</text>

  <!-- Conclusion box -->
  <rect x="490" y="524" width="430" height="112" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="506" y="546" font-size="12" font-weight="bold" fill="#166534">核心结论</text>
  <text x="506" y="566" font-size="11" fill="#14532d">· 可见推理链更像事后文档，而非计算路径</text>
  <text x="506" y="584" font-size="11" fill="#14532d">· 「展示推理」不等于「可审查的推理」</text>
  <text x="506" y="602" font-size="11" fill="#14532d">· 30 算子扰动 + CDR = 链忠实性的最小审计工具</text>
  <text x="506" y="620" font-size="11" fill="#14532d">· 可复用到其他高风险领域的 CoT 审计</text>
</svg>
