<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="600" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">医疗 CoT 扰动审计：诊断全对，推理链是摆设吗？（arXiv:2608.24790，TU Eindhoven + Dana-Farber）</text>

  <!-- Method flow -->
  <rect x="40" y="60" width="215" height="76" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="147" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">原始医疗 QA</text>
  <text x="147" y="104" text-anchor="middle" font-size="11" fill="#4338ca">题目 + 可见推理链 + 答案</text>
  <text x="147" y="121" text-anchor="middle" font-size="11" fill="#4338ca">14 LLMs x 4 benchmarks</text>

  <rect x="305" y="60" width="330" height="76" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="470" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">M-block：30 算子扰动（同时改题 + 改链）</text>
  <text x="470" y="101" text-anchor="middle" font-size="11" fill="#78350f">severity reversal / negation flip /</text>
  <text x="470" y="116" text-anchor="middle" font-size="11" fill="#78350f">demographic swap / evidence ablation 等</text>

  <rect x="685" y="60" width="235" height="76" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="802" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">chain-update × answer-flip</text>
  <text x="802" y="104" text-anchor="middle" font-size="11" fill="#7f1d1d">链登记了吗？答案翻了吗？</text>
  <text x="802" y="121" text-anchor="middle" font-size="11" fill="#7f1d1d">按失败模式分类每个模型</text>

  <line x1="255" y1="98" x2="305" y2="98" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="635" y1="98" x2="685" y2="98" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Three tests -->
  <text x="40" y="180" font-size="15" font-weight="bold" fill="#1e293b">三个独立测试收敛到同一解耦</text>

  <rect x="40" y="196" width="285" height="120" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="182" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">测试一：CDR</text>
  <text x="182" y="244" text-anchor="middle" font-size="26" font-weight="bold" fill="#dc2626">72.9%</text>
  <text x="182" y="266" text-anchor="middle" font-size="11" fill="#7f1d1d">链未登记编辑且答案不翻转</text>
  <text x="182" y="283" text-anchor="middle" font-size="11" fill="#7f1d1d">（临床有意义破坏性编辑子集，panel-wide）</text>

  <rect x="345" y="196" width="285" height="120" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="487" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">测试二：chain corruption</text>
  <text x="487" y="252" text-anchor="middle" font-size="13" fill="#7f1d1d">直接破坏推理链</text>
  <text x="487" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">准确率不变</text>

  <rect x="650" y="196" width="270" height="120" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="785" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">测试三：去 CoT prompting</text>
  <text x="785" y="252" text-anchor="middle" font-size="13" fill="#7f1d1d">不做思维链提示</text>
  <text x="785" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">准确率不降</text>

  <!-- Clinician validation -->
  <rect x="40" y="340" width="880" height="58" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="480" y="364" text-anchor="middle" font-size="13" font-weight="bold" fill="#075985">临床验证（M-block soundness）</text>
  <text x="480" y="384" text-anchor="middle" font-size="12" fill="#0c4a6e">两名持证临床医生重标注 N=197 个扰动问题，98.5% 的 gold 答案仍站得住 —— 验证扰动合理，非模型正确率</text>

  <!-- Scope note -->
  <rect x="40" y="420" width="430" height="118" rx="8" fill="#fefce8" stroke="#ca8a04"/>
  <text x="56" y="442" font-size="12" font-weight="bold" fill="#854d0e">边界与限定</text>
  <text x="56" y="462" font-size="11" fill="#713f12">· CDR 72.9% 限于临床有意义破坏性编辑子集，panel-wide</text>
  <text x="56" y="480" font-size="11" fill="#713f12">· 结论限医疗 QA 场景，不推广到所有 CoT 应用</text>
  <text x="56" y="498" font-size="11" fill="#713f12">· 闭源层链文本不可得：仅答案侧信号与解耦一致（间接证据）</text>
  <text x="56" y="516" font-size="11" fill="#713f12">· 模式跨医疗/推理微调与规模保持</text>

  <!-- Conclusion -->
  <rect x="490" y="420" width="430" height="118" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="506" y="442" font-size="12" font-weight="bold" fill="#166534">核心结论</text>
  <text x="506" y="462" font-size="11" fill="#14532d">· 「decorative reasoning」：链更像事后文档而非计算路径</text>
  <text x="506" y="480" font-size="11" fill="#14532d">· 「展示推理」不等于「可审查的推理」</text>
  <text x="506" y="498" font-size="11" fill="#14532d">· 30 算子扰动 + CDR = 链忠实性的最小审计标尺</text>
  <text x="506" y="516" font-size="11" fill="#14532d">· 与 EchoCoT（黑箱隐藏链提取）互补：本篇测可见链是否被用</text>

  <!-- Footer -->
  <text x="480" y="576" text-anchor="middle" font-size="11" fill="#64748b">Right Diagnoses, Decorative Reasoning: A Perturbation Audit of Medical Chain-of-Thought · arXiv:2608.24790v1 · 2026-08-25</text>
</svg>
