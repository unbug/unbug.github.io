<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">Claude Opus 4.7 八次试验七次击败求解器，其余三个Agent无一超过两次</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">击败 Pascal Pons 精确求解器的试验次数（每 Agent 八次）</text>

  <!-- horizontal gridlines -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="200" y1="300" x2="540" y2="300"/>
    <line x1="200" y1="225" x2="540" y2="225"/>
    <line x1="200" y1="150" x2="540" y2="150"/>
  </g>

  <!-- bars: y = 375 - 37.5 * wins -->
  <rect x="230" y="112.5" width="60" height="262.5" fill="#D55E00"/>
  <text x="260" y="104" font-size="12" fill="#555555" text-anchor="middle">7</text>
  <text x="260" y="393" font-size="12.5" fill="#1A1B1E" text-anchor="middle">Claude</text>
  <text x="260" y="409" font-size="12.5" fill="#1A1B1E" text-anchor="middle">Opus 4.7</text>

  <rect x="340" y="300" width="60" height="75" fill="#999999"/>
  <text x="370" y="292" font-size="12" fill="#555555" text-anchor="middle">0–2</text>
  <text x="370" y="393" font-size="12.5" fill="#1A1B1E" text-anchor="middle">其余三个</text>
  <text x="370" y="409" font-size="12.5" fill="#1A1B1E" text-anchor="middle">Agent</text>

  <!-- value axis -->
  <line x1="200" y1="375" x2="540" y2="375" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="196" y1="375" x2="200" y2="375"/>
    <line x1="196" y1="300" x2="200" y2="300"/>
    <line x1="196" y1="225" x2="200" y2="225"/>
    <line x1="196" y1="150" x2="200" y2="150"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="190" y="379">0</text>
    <text x="190" y="304">2</text>
    <text x="190" y="229">4</text>
    <text x="190" y="154">6</text>
  </g>
  <text x="130" y="262" font-size="14" fill="#1A1B1E" text-anchor="middle" transform="rotate(-90 130 262)">获胜试验次数（次）</text>

  <text x="200" y="448" font-size="12" fill="#555555">单次任务：消费级硬件、三小时预算、仅简洁任务描述；</text>
  <text x="200" y="466" font-size="12" fill="#555555">Claude 以先手出战</text>

  <!-- ============ panel b ============ -->
  <text x="650" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="672" y="104" font-size="15" fill="#1A1B1E">任务完成度随时间的跃迁（序列示意，无数值轴）</text>

  <!-- timeline -->
  <line x1="710" y1="330" x2="1110" y2="330" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="710" y1="330" x2="710" y2="334"/>
    <line x1="1110" y1="330" x2="1110" y2="334"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E">
    <text x="710" y="354" text-anchor="middle">2026年1月</text>
    <text x="710" y="372" text-anchor="middle" fill="#555555" font-size="12">开发启动</text>
    <text x="1092" y="354" text-anchor="middle">2026年4月底</text>
    <text x="1092" y="372" text-anchor="middle" fill="#555555" font-size="12">接近饱和</text>
  </g>

  <!-- state markers -->
  <circle cx="710" cy="330" r="6" fill="#999999"/>
  <text x="710" y="270" font-size="12" fill="#555555" text-anchor="middle">无任何前沿Agent</text>
  <text x="710" y="288" font-size="12" fill="#555555" text-anchor="middle">可靠完成</text>

  <circle cx="1110" cy="330" r="6" fill="#D55E00"/>
  <text x="1092" y="270" font-size="12" fill="#555555" text-anchor="middle">Claude Opus 4.7</text>
  <text x="1092" y="288" font-size="12" fill="#555555" text-anchor="middle">接近饱和</text>

  <!-- transition label -->
  <text x="910" y="278" font-size="12" fill="#1A1B1E" text-anchor="middle">三个月</text>
  <text x="910" y="296" font-size="12" fill="#1A1B1E" text-anchor="middle">无法完成 → 接近饱和</text>

  <text x="650" y="448" font-size="12" fill="#555555">后续 16 次短提示试验：GPT-5.4 时间预算使用率大幅提高，</text>
  <text x="650" y="466" font-size="12" fill="#555555">与沙盒伪装假设一致，但不构成诊断性证据</text>

  <!-- footnote -->
  <text x="60" y="615" font-size="11" fill="#767676">数据：arXiv:2604.25067 · 面板 a 为论文自测口径（每 Agent 八次试验）· 面板 b 为论文叙述的时间序列定性示意，正文未给出完成度数值轴 · 预印本未经同行评审</text>
</svg>
