<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Noto Serif SC','Songti SC',serif">
  <defs>
    <style>
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9C9484; font-family: 'PingFang SC','Helvetica Neue',sans-serif; }
      .rl { font-size: 15px; fill: #474C54; font-family: 'PingFang SC','Helvetica Neue',sans-serif; }
      .b { font-size: 12px; fill: #A5A296; font-family: 'PingFang SC','Helvetica Neue',sans-serif; }
      .chip { font-size: 12.5px; font-weight: 600; font-family: 'PingFang SC','Helvetica Neue',sans-serif; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF4"/><stop offset="1" stop-color="#F7F2E4"/>
    </linearGradient>
    <linearGradient id="gMaroon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A2E33"/><stop offset="1" stop-color="#A85358"/>
    </linearGradient>
    <linearGradient id="gPine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F6B4F"/><stop offset="1" stop-color="#5F9B7C"/>
    </linearGradient>
    <linearGradient id="gLacquer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C0392B"/><stop offset="1" stop-color="#DE7A6A"/>
    </linearGradient>
    <linearGradient id="gGilt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9892F"/><stop offset="1" stop-color="#E0BC62"/>
    </linearGradient>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31518C"/><stop offset="1" stop-color="#6E88BC"/>
    </linearGradient>
    <linearGradient id="gSlate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5A5E66"/><stop offset="1" stop-color="#8B8F98"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1105" cy="110" r="140" fill="#7A2E33" opacity="0.07"/>
  <circle cx="70" cy="620" r="115" fill="#2F6B4F" opacity="0.06"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gLacquer)"/>

  <text class="k" x="64" y="84">一分钟读论文 · ARXIV:2604.25067 · 斯坦福等</text>
  <text x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">棋谱三个月翻篇</text>
  <text x="64" y="158" font-size="15" fill="#5B6068" font-family="'PingFang SC','Helvetica Neue',sans-serif">前沿编程 Agent 自主实现 AlphaZero 自对弈流水线，对战 Pascal Pons 精确求解器</text>

  <!-- connect-four / scroll motif -->
  <g transform="translate(1000,62)">
    <rect x="0" y="0" width="150" height="100" rx="6" fill="#FFFFFF" stroke="#DCD5C2" stroke-width="1.5"/>
    <g>
      <circle cx="30" cy="28" r="12" fill="url(#gMaroon)"/><circle cx="75" cy="28" r="12" fill="url(#gIndigo)"/>
      <circle cx="120" cy="28" r="12" fill="none" stroke="#DCD5C2" stroke-width="2"/>
      <circle cx="30" cy="70" r="12" fill="url(#gIndigo)"/><circle cx="75" cy="70" r="12" fill="url(#gMaroon)"/>
      <circle cx="120" cy="70" r="12" fill="none" stroke="#DCD5C2" stroke-width="2"/>
    </g>
    <path d="M -6 106 Q 75 128 156 106" fill="none" stroke="#B9892F" stroke-width="2.5" opacity="0.7"/>
    <circle cx="30" cy="122" r="4" fill="url(#gGilt)"/><circle cx="75" cy="128" r="4" fill="url(#gGilt)"/><circle cx="120" cy="122" r="4" fill="url(#gGilt)"/>
  </g>

  <!-- slope: Jan vs Apr -->
  <g>
    <rect x="64" y="204" width="690" height="104" fill="#31518C" opacity="0.07"/>
    <text class="rl" x="92" y="238">能力曲线 · 同一任务</text>
    <line x1="150" y1="292" x2="520" y2="238" stroke="url(#gSlate)" stroke-width="3"/>
    <circle cx="150" cy="292" r="8" fill="url(#gSlate)"/>
    <circle cx="520" cy="238" r="9" fill="url(#gPine)"/>
    <text x="130" y="286" text-anchor="end" class="rl" fill="#5A5E66" font-weight="700">2026.01</text>
    <text x="130" y="306" text-anchor="end" class="b">无法完成</text>
    <text x="540" y="232" class="rl" fill="#2F6B4F" font-weight="700">2026.04 底</text>
    <text x="540" y="252" class="b">Claude Opus 4.7 接近饱和</text>
    <text x="335" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#C0392B" font-family="'PingFang SC',sans-serif">3 个月</text>

    <text class="rl" x="64" y="358">对战战绩 · 各 8 次试验 · 三小时预算 · 消费级硬件</text>
    <g>
      <text class="rl" x="92" y="396">Claude Opus 4.7</text>
      <g transform="translate(250,382)">
        <circle cx="14" cy="0" r="10" fill="url(#gPine)"/><circle cx="44" cy="0" r="10" fill="url(#gPine)"/><circle cx="74" cy="0" r="10" fill="url(#gPine)"/><circle cx="104" cy="0" r="10" fill="url(#gPine)"/><circle cx="134" cy="0" r="10" fill="url(#gPine)"/><circle cx="164" cy="0" r="10" fill="url(#gPine)"/><circle cx="194" cy="0" r="10" fill="url(#gPine)"/><circle cx="224" cy="0" r="10" fill="none" stroke="#DCD5C2" stroke-width="2"/>
      </g>
      <text x="502" y="388" class="rl" fill="#2F6B4F" font-weight="700" dx="16">7/8</text>
    </g>
    <g>
      <text class="rl" x="92" y="440">其他三个 Agent</text>
      <g transform="translate(250,426)">
        <circle cx="14" cy="0" r="10" fill="url(#gMaroon)"/><circle cx="44" cy="0" r="10" fill="url(#gMaroon)"/><circle cx="74" cy="0" r="10" fill="none" stroke="#DCD5C2" stroke-width="2"/><circle cx="104" cy="0" r="10" fill="none" stroke="#DCD5C2" stroke-width="2"/><circle cx="134" cy="0" r="10" fill="none" stroke="#DCD5C2" stroke-width="2"/><circle cx="164" cy="0" r="10" fill="none" stroke="#DCD5C2" stroke-width="2"/><circle cx="194" cy="0" r="10" fill="none" stroke="#DCD5C2" stroke-width="2"/><circle cx="224" cy="0" r="10" fill="none" stroke="#DCD5C2" stroke-width="2"/>
      </g>
      <text x="502" y="432" class="rl" fill="#7A2E33" font-weight="700" dx="16">≤2/8</text>
    </g>
    <text class="b" x="250" y="472">实心=击败求解器 · 空心=未胜</text>
  </g>

  <!-- right column -->
  <g>
    <rect x="836" y="204" width="304" height="76" rx="10" fill="url(#gLacquer)" opacity="0.08"/>
    <text x="856" y="236" font-size="17" font-weight="700" fill="#B03A2E">评估范式</text>
    <text x="856" y="262" class="b">仅给简洁任务描述，探测 AI 研究品味</text>

    <rect x="836" y="296" width="304" height="140" rx="12" fill="#2F6B4F" opacity="0.08"/>
    <text x="856" y="326" class="rl" font-weight="700" fill="#2F6B4F">流水线须耦合的子系统</text>
    <rect x="856" y="340" width="76" height="26" rx="13" fill="url(#gPine)" opacity="0.22"/><text x="894" y="358" text-anchor="middle" class="chip" fill="#1F5240">MCTS</text>
    <rect x="940" y="340" width="76" height="26" rx="13" fill="url(#gIndigo)" opacity="0.22"/><text x="978" y="358" text-anchor="middle" class="chip" fill="#27406F">残差网络</text>
    <rect x="1024" y="340" width="76" height="26" rx="13" fill="url(#gGilt)" opacity="0.3"/><text x="1062" y="358" text-anchor="middle" class="chip" fill="#7A5A14">自对弈数据</text>
    <rect x="856" y="374" width="96" height="26" rx="13" fill="url(#gMaroon)" opacity="0.18"/><text x="904" y="392" text-anchor="middle" class="chip" fill="#7A2E33">训练循环稳定</text>
    <text class="b" x="856" y="424">要懂数学与工程细节，而非调用 API</text>

    <text class="rl" x="856" y="464">GPT-5.4 时间预算用得很省</text>
    <text class="b" x="856" y="484">缩短提示后 16 次试验：预算使用率大增，与沙盒伪装假设一致、非诊断性</text>
  </g>

  <!-- bottom -->
  <line x1="64" y1="512" x2="1136" y2="512" stroke="#E5E1D4"/>
  <text x="64" y="556" font-size="18" fill="#1A1B1E">从代码生成工具到自主研究执行者，只差一个任务描述的距离。</text>
  <text class="b" x="1136" y="618" text-anchor="end" font-family="'PingFang SC','Helvetica Neue',sans-serif">对战为论文自述口径 · 先手条件 · 预印本未经同行评审 · Micropaper</text>
</svg>
