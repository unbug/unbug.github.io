<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #8FA7C4; }
      .rl { font-size: 15px; fill: #2C4A6E; }
      .val { font-size: 22px; font-weight: 700; }
      .b { font-size: 12px; fill: #9CABB8; }
      .hd { font-size: 12.5px; letter-spacing: 2px; fill: #7A8CA0; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F8FB"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FA3D1"/><stop offset="1" stop-color="#8FC7E5"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8834A"/><stop offset="1" stop-color="#F4B189"/>
    </linearGradient>
    <linearGradient id="gYellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2C14E"/><stop offset="1" stop-color="#F8DB93"/>
    </linearGradient>
    <linearGradient id="gSlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B7B8C"/><stop offset="1" stop-color="#9AA8B6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1100" cy="110" r="150" fill="#4FA3D1" opacity="0.06"/>
  <circle cx="80" cy="618" r="120" fill="#F2C14E" opacity="0.08"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gOrange)"/>

  <text class="k" x="64" y="84">一分钟读论文 · ARXIV:2609.05279 · AGENT TEAM SWAP</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1C2833">分数没掉，成本爆在看不见的地方</text>
  <text x="64" y="158" font-size="15" fill="#55677A">换员首局：得分仍在基线八九成，沟通量却暴涨</text>

  <!-- weather fronts: two opposing masses -->
  <g>
    <rect x="64" y="196" width="470" height="130" rx="14" fill="#4FA3D1" opacity="0.08"/>
    <circle cx="130" cy="248" r="24" fill="url(#gBlue)"/>
    <path d="M 98 300 a 32 32 0 0 1 64 0 z" fill="url(#gBlue)"/>
    <circle cx="204" cy="248" r="24" fill="url(#gSlate)"/>
    <path d="M 172 300 a 32 32 0 0 1 64 0 z" fill="url(#gSlate)"/>
    <text class="rl" x="130" y="322" text-anchor="middle" fill="#2E7BA6">留守老将</text>
    <text class="b" x="204" y="322" text-anchor="middle">花更多力气拉回轨道</text>

    <g>
      <path d="M 300 262 l 52 0 m 0 0 l -14 -10 m 14 10 l -14 10" stroke="#E8834A" stroke-width="4" fill="none" stroke-linecap="round"/>
      <text class="b" x="326" y="240" text-anchor="middle" fill="#C96A33">惯例冲突</text>
    </g>

    <rect x="366" y="196" width="168" height="130" rx="14" fill="#E8834A" opacity="0.09"/>
    <circle cx="450" cy="248" r="24" fill="url(#gOrange)"/>
    <path d="M 418 300 a 32 32 0 0 1 64 0 z" fill="url(#gOrange)"/>
    <rect x="466" y="228" width="26" height="18" rx="4" fill="#F2C14E"/>
    <text class="rl" x="450" y="322" text-anchor="middle" fill="#C96A33">换进的老手</text>
    <text class="b" x="450" y="342" text-anchor="middle" fill="#C96A33">比新人还贵</text>
  </g>

  <!-- cost bars: low coupling vs high coupling -->
  <g>
    <rect x="64" y="380" width="640" height="52" rx="10" fill="#4FA3D1" opacity="0.07"/>
    <text class="rl" x="84" y="412">低耦合 · 每单位进展沟通量</text>
    <rect x="356" y="397" width="112" height="16" rx="8" fill="url(#gBlue)"/>
    <text class="val" x="486" y="412" fill="#2E7BA6">+16%</text>

    <rect x="64" y="444" width="640" height="52" rx="10" fill="#E8834A" opacity="0.08"/>
    <text class="rl" x="84" y="476">高耦合 · 每单位进展沟通量</text>
    <rect x="356" y="461" width="286" height="16" rx="8" fill="url(#gOrange)"/>
    <text class="val" x="660" y="476" fill="#C96A33">+63%</text>
    <text class="b" x="84" y="522">接近翻倍处：Overcooked 协调成本 4.09 → 6.53</text>
  </g>

  <!-- right stats -->
  <g>
    <text class="serif" x="1136" y="240" text-anchor="end" font-size="28" font-weight="700" fill="#1C2833">得分仍达 placebo 的<tspan fill="#4FA3D1"> 98 / 90 / 89%</tspan></text>
    <text class="b" x="1136" y="264" text-anchor="end">低耦合 / 高耦合 / Hanabi · 换员首局</text>

    <rect x="760" y="300" width="376" height="76" rx="12" fill="#F2C14E" opacity="0.10"/>
    <text class="serif" x="784" y="332" font-size="19" font-weight="700" fill="#1C2833">恢复不对称</text>
    <text x="784" y="358" font-size="14" fill="#55677A">得分第 2/5/6 局回基线，成本慢约一倍、约 10 局</text>
  </g>

  <!-- pressure legend strip -->
  <g>
    <rect x="64" y="548" width="1072" height="42" rx="10" fill="#6B7B8C" opacity="0.07"/>
    <text class="rl" x="84" y="575" font-weight="700" fill="#2C4A6E">放大器</text>
    <text x="180" y="575" font-size="14" fill="#55677A">成团历史越长、解码温度越高，换员代价越大 —— 热更新与故障替换应把重新磨合计入成本。</text>
  </g>

  <line x1="64" y1="606" x2="1136" y2="606" stroke="#DCE7EE"/>
  <text class="b" x="64" y="636">每设置 8 支队伍、单一基座模型 · 协调成本为 hint、message 代理指标 · Micropaper</text>
</svg>
