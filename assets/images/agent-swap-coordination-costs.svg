<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">换员后：任务得分几乎不掉，沟通成本暴涨 16%–63%</text>

  <!-- panel 1: first-episode shock -->
  <rect x="40" y="56" width="880" height="180" rx="8" fill="#eef4ff" stroke="#3b6ea5" stroke-width="2"/>
  <text x="60" y="84" font-size="16" font-weight="bold" fill="#1a1a2e">换员首局 vs placebo 基线（复现换名册扰动但不换人）</text>

  <rect x="60" y="102" width="400" height="56" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="80" y="126" font-size="14" font-weight="bold" fill="#2e7d32">任务得分：保留基线的 98% / 90% / 89%</text>
  <text x="80" y="148" font-size="13" fill="#333">低耦合 / Collab-Overcooked / Hanabi，几乎无感</text>

  <rect x="500" y="102" width="400" height="56" rx="6" fill="#ffffff" stroke="#c62828"/>
  <text x="520" y="126" font-size="14" font-weight="bold" fill="#c62828">每单位进展沟通量：1.15&#215; / 1.48&#215; / 1.55&#215;</text>
  <text x="520" y="148" font-size="13" fill="#333">+16% 到 +63%，代价藏在协调这一层</text>

  <rect x="60" y="170" width="840" height="50" rx="6" fill="#fff8e1" stroke="#f9a825"/>
  <text x="80" y="192" font-size="13.5" font-weight="bold" fill="#8d6e00">Hanabi 反直觉：换进来的老手比新人还贵——旧伙伴的惯例与现队伍冲突</text>
  <text x="80" y="212" font-size="13" fill="#555">Overcooked：换掉定议程的 agent 后，额外沟通主要来自留守者</text>

  <!-- panel 2: bar chart Table 1 -->
  <rect x="40" y="252" width="500" height="340" rx="8" fill="#f7f7fb" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="60" y="280" font-size="15" font-weight="bold" fill="#1a1a2e">Table 1 条件均值：得分 vs 协调成本</text>

  <!-- score bars (Intact vs Swap) -->
  <text x="60" y="312" font-size="13" font-weight="bold" fill="#333">任务得分（越高越好）</text>
  <g font-size="12" fill="#333">
    <rect x="150" y="322" width="278" height="16" fill="#2e7d32"/><text x="434" y="335">92.5</text>
    <rect x="150" y="342" width="270" height="16" fill="#8bc34a"/><text x="426" y="355">90.0</text>
    <text x="60" y="335">低耦合 Intact</text><text x="60" y="355">低耦合 Swap</text>

    <rect x="150" y="372" width="192" height="16" fill="#2e7d32"/><text x="348" y="385">64.1</text>
    <rect x="150" y="392" width="174" height="16" fill="#8bc34a"/><text x="330" y="405">58.0</text>
    <text x="60" y="385">高耦合 Intact</text><text x="60" y="405">高耦合 Swap</text>

    <rect x="150" y="422" width="47" height="16" fill="#2e7d32"/><text x="203" y="435">15.8</text>
    <rect x="150" y="442" width="41" height="16" fill="#8bc34a"/><text x="197" y="455">13.7</text>
    <text x="60" y="435">Hanabi Intact</text><text x="60" y="455">Hanabi Swap</text>
  </g>

  <!-- cost bars -->
  <text x="60" y="486" font-size="13" font-weight="bold" fill="#333">协调成本（越低越好）</text>
  <g font-size="12" fill="#333">
    <rect x="150" y="496" width="96" height="16" fill="#1565c0"/><text x="252" y="509">3.20</text>
    <rect x="150" y="516" width="116" height="16" fill="#c62828"/><text x="272" y="529">3.85（+20%）</text>
    <text x="60" y="509">低耦合 Intact</text><text x="60" y="529">低耦合 Swap</text>

    <rect x="150" y="546" width="123" height="16" fill="#1565c0"/><text x="279" y="559">4.09</text>
    <rect x="150" y="566" width="196" height="16" fill="#c62828"/><text x="352" y="579">6.53（+60%）</text>
    <text x="60" y="559">高耦合 Intact</text><text x="60" y="579">高耦合 Swap</text>
  </g>

  <!-- panel 3: recovery asymmetry -->
  <rect x="560" y="252" width="360" height="340" rx="8" fill="#f0fff4" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="580" y="280" font-size="15" font-weight="bold" fill="#1a1a2e">恢复不对称：得分快，成本慢</text>

  <g font-size="13" fill="#333">
    <rect x="580" y="300" width="320" height="76" rx="6" fill="#ffffff" stroke="#2e7d32"/>
    <text x="596" y="324" font-size="13.5" font-weight="bold" fill="#2e7d32">任务得分</text>
    <text x="596" y="346">第 2 / 5 / 6 局回到 placebo 基线</text>
    <text x="596" y="366">（低耦合 / 高耦合 / Hanabi）1% 以内</text>

    <rect x="580" y="392" width="320" height="76" rx="6" fill="#ffffff" stroke="#c62828"/>
    <text x="596" y="416" font-size="13.5" font-weight="bold" fill="#c62828">协调成本</text>
    <text x="596" y="438">衰减慢约一倍，需约 10 局</text>
    <text x="596" y="458">两个耦合环境第 10 局仍未完全恢复</text>

    <rect x="580" y="484" width="320" height="90" rx="6" fill="#fff8e1" stroke="#f9a825"/>
    <text x="596" y="508" font-size="13.5" font-weight="bold" fill="#8d6e00">两个放大器（消融实验）</text>
    <text x="596" y="530">成团历史越长，换员代价越大</text>
    <text x="596" y="550">解码温度越高，换员代价越大</text>
    <text x="596" y="568">贪心解码则两者同降</text>
  </g>

  <text x="480" y="620" text-anchor="middle" font-size="12" fill="#777">数据来源：Testing Interchangeability in LLM Agent Teams（arXiv:2609.05279），每设置 8 支队伍、10 局成团 episode</text>
</svg>
