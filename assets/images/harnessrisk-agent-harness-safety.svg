<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9C9484; }
      .rl { font-size: 15px; fill: #474C54; }
      .b { font-size: 12px; fill: #A5A296; }
      .chip { font-size: 12.5px; font-weight: 600; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0F1EC"/>
    </linearGradient>
    <linearGradient id="gVermil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5442E"/><stop offset="1" stop-color="#E37C45"/>
    </linearGradient>
    <linearGradient id="gSlate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D5A73"/><stop offset="1" stop-color="#6E8CA8"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#177E7A"/><stop offset="1" stop-color="#5FB3A4"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A97E12"/><stop offset="1" stop-color="#DCB24A"/>
    </linearGradient>
    <linearGradient id="gCrimson" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A32A4A"/><stop offset="1" stop-color="#D06480"/>
    </linearGradient>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31457E"/><stop offset="1" stop-color="#6A7FB5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1092" cy="120" r="150" fill="#31457E" opacity="0.05"/>
  <circle cx="70" cy="640" r="105" fill="#177E7A" opacity="0.05"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gVermil)"/>

  <text class="k" x="64" y="84">一分钟读论文 · ARXIV:2608.17597 · UNC CHAPEL HILL 等三校</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">同一个棋手，换副盔甲</text>
  <text x="64" y="158" font-size="15" fill="#5B6068">HarnessRisk：128 个沙箱案例 × 六个生命周期阶段，模型没变，外壳决定防线</text>

  <!-- armor motif: same core, two harnesses -->
  <g>
    <circle cx="934" cy="212" r="27" fill="url(#gSlate)"/>
    <text x="934" y="218" text-anchor="middle" class="serif" font-size="15" font-weight="700" fill="#FFFFFF">模型</text>
    <path d="M 886 152 q 48 -34 96 0 v 60 q 0 58 -48 82 q -48 -24 -48 -82 Z" fill="url(#gVermil)" opacity="0.16" stroke="#B5442E" stroke-opacity="0.5" stroke-width="2"/>
    <text x="934" y="322" text-anchor="middle" class="chip" fill="#B5442E">OpenClaw 外壳：ASR 54.7%</text>

    <circle cx="1088" cy="212" r="27" fill="url(#gSlate)"/>
    <text x="1088" y="218" text-anchor="middle" class="serif" font-size="15" font-weight="700" fill="#FFFFFF">模型</text>
    <path d="M 1040 152 q 48 -34 96 0 v 60 q 0 58 -48 82 q -48 -24 -48 -82 Z" fill="url(#gTeal)" opacity="0.16" stroke="#177E7A" stroke-opacity="0.5" stroke-width="2"/>
    <text x="1088" y="322" text-anchor="middle" class="chip" fill="#155E5B">Nanobot 外壳：ASR 12.6%</text>

    <text x="1011" y="120" text-anchor="middle" class="serif" font-size="17" font-weight="700" fill="#A32A4A">GLM-5.2：差 4.3×</text>
  </g>

  <!-- headline strip -->
  <g>
    <rect x="64" y="196" width="780" height="78" fill="#B5442E" opacity="0.07"/>
    <text class="serif" x="88" y="230" font-size="17" font-weight="700" fill="#474C54">14 个 model-harness 配置的结局（3 harness × 6 模型矩阵）</text>
    <text class="serif" x="88" y="262" font-size="24" font-weight="700" fill="#B5442E">ASR 12.6%–80.9%</text>
    <text class="serif" x="340" y="262" font-size="24" font-weight="700" fill="#155E5B">Utility 仍 75.0%–97.6%</text>
    <text class="b" x="820" y="261" text-anchor="end">任务干得好，照样不安全</text>
  </g>

  <!-- dumbbell: per-model ASR range across harnesses -->
  <g>
    <text class="rl" x="64" y="318" font-weight="600">同一模型跨 harness 的 ASR 跨度（0–100%）</text>

    <line x1="300" y1="334" x2="820" y2="334" stroke="#EAE6DA"/>
    <line x1="300" y1="334" x2="300" y2="432" stroke="#EAE6DA"/>
    <text class="b" x="300" y="450">0</text>
    <text class="b" x="560" y="450" text-anchor="middle">50%</text>
    <text class="b" x="820" y="450" text-anchor="end">100%</text>

    <rect x="64" y="336" width="780" height="44" fill="#B5442E" opacity="0.07"/>
    <text class="rl" x="284" y="363" text-anchor="end">GLM-5.2</text>
    <line x1="365" y1="358" x2="583" y2="358" stroke="#3D5A73" stroke-width="2.5"/>
    <circle cx="365" cy="358" r="7" fill="#FBFAF7" stroke="#177E7A" stroke-width="2.5"/>
    <circle cx="583" cy="358" r="8" fill="url(#gVermil)"/>
    <text class="b" x="365" y="346" text-anchor="middle">12.6%</text>
    <text class="serif" x="600" y="365" font-size="22" font-weight="700" fill="#B5442E">54.7%</text>
    <text class="b" x="820" y="346">Nanobot → OpenClaw · 4.3×</text>

    <rect x="64" y="390" width="780" height="44" fill="#A32A4A" opacity="0.07"/>
    <text class="rl" x="284" y="417" text-anchor="end">Kimi K2.6</text>
    <rect x="300" y="404" width="421" height="22" rx="3" fill="url(#gCrimson)" opacity="0.85"/>
    <text class="serif" x="732" y="422" font-size="22" font-weight="700" fill="#A32A4A">80.9%</text>
    <text class="b" x="820" y="400" text-anchor="end">OpenClaw 上全场最高</text>

    <rect x="880" y="336" width="256" height="98" fill="#177E7A" opacity="0.08"/>
    <text x="896" y="360" class="chip" fill="#155E5B">检测 ≠ 安全</text>
    <text class="serif" x="896" y="392" font-size="24" font-weight="700" fill="#155E5B">99.7%</text>
    <text x="896" y="412" font-size="12.5" fill="#5B6068">Nanobot·GLM-5.2 检测率全场最高</text>
    <text x="896" y="430" font-size="12.5" fill="#5B6068">部分配置检出 &gt;90% 仍大量中招</text>
  </g>

  <!-- six lifecycle stages -->
  <g>
    <text class="rl" x="64" y="496" font-weight="600">外壳生命周期六阶段 · 128 案例大致均分</text>

    <rect x="64" y="508" width="1072" height="30" fill="#B5442E" opacity="0.07"/>
    <text class="chip" x="88" y="528" fill="#B5442E">外壳配置 22 例 · 最脆弱</text>
    <text class="chip" x="330" y="528" fill="#31457E">能力扩展 22 例</text>
    <text class="chip" x="540" y="528" fill="#3D5A73">运行时操作 21 例</text>
    <text class="chip" x="760" y="528" fill="#177E7A">状态持久化 21 例</text>
    <text class="chip" x="970" y="528" fill="#A97E12">动作控制 · 事故恢复 各 21</text>

    <rect x="64" y="548" width="1072" height="40" fill="#31457E" opacity="0.06"/>
    <text class="rl" x="88" y="573">得手场景：授权工作流内改安全敏感参数</text>
    <text class="b" x="520" y="573">评审一致率：Utility 92.5%（κ=0.83）· ASR 89.7%（κ=0.77）</text>
    <text class="b" x="1120" y="573" text-anchor="end">每案例三轮 owner 对话 × 独立 3 次</text>
  </g>

  <text class="b" x="1136" y="648" text-anchor="end">128 案例全在 mock services 沙箱 · GPT-5.5/Claude Opus 4.7 仅测 OpenClaw · 不外推生产部署 · Micropaper</text>
</svg>
