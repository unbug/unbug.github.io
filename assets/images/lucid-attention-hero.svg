<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">LUCID 对 key 向量去相关消除注意力噪声：最难多针检索准确率从 11.4% 提至 37.4%，训练开销仅增加 0-5.5%</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">检索准确率（%，论文自测口径）</text>

  <!-- horizontal gridlines at labeled ticks: y = 420 - 7*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="150" y1="350" x2="700" y2="350"/>
    <line x1="150" y1="280" x2="700" y2="280"/>
    <line x1="150" y1="210" x2="700" y2="210"/>
  </g>

  <!-- dumbbell 1: hardest multi-needle 11.4 -> 37.4 -->
  <line x1="260" y1="158.2" x2="260" y2="340.2" stroke="#999999" stroke-width="1.5"/>
  <circle cx="260" cy="340.2" r="6" fill="none" stroke="#555555" stroke-width="1.5"/>
  <circle cx="260" cy="158.2" r="6" fill="#D55E00"/>
  <text x="274" y="162" font-size="12" fill="#555">37.4</text>
  <text x="274" y="344" font-size="12" fill="#555">11.4</text>
  <text x="185" y="134" font-size="12.5" fill="#555">最难多针长序列</text>
  <text x="185" y="152" font-size="12.5" fill="#555">Δ=+26 个百分点</text>

  <!-- dumbbell 2: 6-needle 2K 38.8 -> 43.6 -->
  <line x1="560" y1="114.8" x2="560" y2="148.4" stroke="#999999" stroke-width="1.5"/>
  <circle cx="560" cy="148.4" r="6" fill="none" stroke="#555555" stroke-width="1.5"/>
  <circle cx="560" cy="114.8" r="6" fill="#D55E00"/>
  <text x="574" y="119" font-size="12" fill="#555">43.6</text>
  <text x="574" y="152" font-size="12" fill="#555">38.8</text>
  <text x="470" y="134" font-size="12.5" fill="#555" text-anchor="end">6 针 2K 序列</text>

  <!-- value axis -->
  <line x1="150" y1="420" x2="700" y2="420" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="150" y1="420" x2="150" y2="424"/>
    <line x1="150" y1="350" x2="146" y2="350"/>
    <line x1="150" y1="280" x2="146" y2="280"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="140" y="424">0</text>
    <text x="140" y="354">10</text>
    <text x="140" y="284">20</text>
  </g>
  <text x="102" y="315" font-size="14" fill="#1A1B1E" text-anchor="middle" transform="rotate(-90 102 315)">检索准确率（%）</text>

  <!-- panel a notes -->
  <g font-size="12" fill="#555">
    <circle cx="165" cy="446" r="5" fill="none" stroke="#555555" stroke-width="1.5"/>
    <text x="177" y="450">空心 = 标准注意力基线</text>
    <circle cx="360" cy="446" r="5" fill="#D55E00"/>
    <text x="372" y="450">实心 = LUCID</text>
    <text x="500" y="450">正文仅报告这两组多针准确率</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="790" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="812" y="104" font-size="15" fill="#1A1B1E">关键数值的相对位置示意</text>

  <!-- position track -->
  <line x1="830" y1="380" x2="1130" y2="380" stroke="#1A1B1E" stroke-width="0.75"/>
  <line x1="830" y1="380" x2="830" y2="384" stroke="#1A1B1E" stroke-width="0.75"/>
  <text x="830" y="402" font-size="12.5" fill="#1A1B1E" text-anchor="middle">0</text>

  <!-- 11.4 at x=864 -->
  <circle cx="864" cy="380" r="6" fill="none" stroke="#555555" stroke-width="1.5"/>
  <line x1="864" y1="374" x2="864" y2="286" stroke="#999999" stroke-width="0.75"/>
  <text x="864" y="262" font-size="12" fill="#555" text-anchor="middle">11.4</text>
  <text x="864" y="278" font-size="11" fill="#767676" text-anchor="middle">多针基线（%）</text>

  <!-- 37.4 at x=967 -->
  <circle cx="967" cy="380" r="6" fill="#D55E00"/>
  <line x1="967" y1="374" x2="967" y2="316" stroke="#999999" stroke-width="0.75"/>
  <text x="967" y="292" font-size="12" fill="#555" text-anchor="middle">37.4</text>
  <text x="967" y="308" font-size="11" fill="#767676" text-anchor="middle">LUCID（%）</text>

  <!-- 0.14 at x=1004 -->
  <circle cx="1004" cy="380" r="6" fill="none" stroke="#555555" stroke-width="1.5"/>
  <line x1="1004" y1="374" x2="1004" y2="246" stroke="#999999" stroke-width="0.75"/>
  <text x="1004" y="222" font-size="12" fill="#555" text-anchor="middle">0.14</text>
  <text x="1004" y="238" font-size="11" fill="#767676" text-anchor="middle">BABILong 基线</text>

  <!-- 0.21-0.25 band at x=1025 -->
  <rect x="1021" y="356" width="8" height="48" fill="#0072B2" opacity="0.35"/>
  <line x1="1017" y1="356" x2="1033" y2="356" stroke="#0072B2" stroke-width="1.5"/>
  <line x1="1017" y1="404" x2="1033" y2="404" stroke="#0072B2" stroke-width="1.5"/>
  <line x1="1025" y1="356" x2="1025" y2="340" stroke="#999999" stroke-width="0.75"/>
  <text x="1025" y="316" font-size="12" fill="#555" text-anchor="middle">0.21-0.25</text>
  <text x="1025" y="332" font-size="11" fill="#767676" text-anchor="middle">LUCID-PaTH 区间</text>

  <!-- 0.2845 at x=1075 -->
  <circle cx="1075" cy="380" r="6" fill="#D55E00"/>
  <line x1="1075" y1="374" x2="1075" y2="246" stroke="#999999" stroke-width="0.75"/>
  <text x="1075" y="222" font-size="12" fill="#555" text-anchor="middle">0.2845</text>
  <text x="1075" y="238" font-size="11" fill="#767676" text-anchor="middle">注意力权重基线 0.1817</text>

  <text x="790" y="440" font-size="12" fill="#555">横轴为序列位置轴、无统一单位，点位置仅示意</text>
  <text x="790" y="458" font-size="12" fill="#555">相对大小；空心 = 基线，实心 = LUCID</text>

  <!-- ============ panel c ============ -->
  <text x="60" y="506" font-size="15" font-weight="bold" fill="#1A1B1E">c</text>
  <text x="82" y="506" font-size="15" fill="#1A1B1E">开销、实际任务与适用建议（论文自测口径）</text>
  <g font-size="12" fill="#555">
    <text x="60" y="536">训练开销增加 0-5.5%，推理开销约 1.3%；计算复杂度仍为 O(N²d)，与标准注意力相同</text>
    <text x="60" y="558">HotpotQA 最佳 F1 0.0862；Qasper 比 PaTH 提升 1.14 F1；QMSum 最佳 ROUGE-L 12.60</text>
    <text x="60" y="580">相关 token 平均注意力权重从 0.1817 升至 0.2845，相对提升 56.6%；序列超过 8K 时优势开始显现</text>
  </g>

  <!-- footnote -->
  <text x="60" y="616" font-size="11" fill="#767676">数据：arXiv:2602.10410（UT Austin 与 Google，论文自测口径）· b 面板横轴为序列位置轴、无统一量纲，仅示意相对大小 · 正文未报告误差区间，未画误差棒</text>
  <text x="60" y="634" font-size="11" fill="#767676">a 面板数值轴轴顶略高于正文最大值 43.6，刻度为整数间隔，区间条 0.21-0.25 为论文报告范围 · 预印本未经同行评审</text>
</svg>
