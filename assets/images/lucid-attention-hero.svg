<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">LUCID 对 key 向量去相关消除注意力噪声；最难多针检索准确率从 11.4% 提至 37.4%，训练开销仅增加 0-5.5%</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">检索与注意力质量：标准注意力对 LUCID（论文自测口径）</text>

  <!-- dumbbells: real axis y = 360 - 4*v (0..50) -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="150" y1="320" x2="700" y2="320"/>
    <line x1="150" y1="240" x2="700" y2="240"/>
    <line x1="150" y1="160" x2="700" y2="160"/>
  </g>
  <!-- axis -->
  <line x1="150" y1="360" x2="700" y2="360" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="150" y1="360" x2="146" y2="360"/>
    <line x1="150" y1="320" x2="146" y2="320"/>
    <line x1="150" y1="280" x2="146" y2="280"/>
    <line x1="150" y1="240" x2="146" y2="240"/>
    <line x1="150" y1="200" x2="146" y2="200"/>
    <line x1="150" y1="160" x2="146" y2="160"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="140" y="364">0</text>
    <text x="140" y="324">11.4</text>
    <text x="140" y="284">0.14</text>
    <text x="140" y="244">37.4</text>
    <text x="140" y="204">38.8</text>
    <text x="140" y="164">43.6</text>
  </g>
  <text x="96" y="260" font-size="14" fill="#1A1B1E" text-anchor="middle" transform="rotate(-90 96 260)">准确率 / 平均注意力权重（%）</text>

  <!-- dumbbell 1: multi-needle hardest 11.4 -> 37.4 -->
  <line x1="205.6" y1="210.4" x2="205.6" y2="314.4" stroke="#999999" stroke-width="1.5"/>
  <circle cx="205.6" cy="314.4" r="6" fill="none" stroke="#555555" stroke-width="1.5"/>
  <circle cx="205.6" cy="210.4" r="6" fill="#D55E00"/>
  <text x="222" y="214" font-size="12" fill="#555">37.4</text>
  <text x="222" y="318" font-size="12" fill="#555">11.4</text>
  <text x="205.6" y="192" font-size="12.5" fill="#1A1B1E" text-anchor="middle">最难多针长序列</text>

  <!-- dumbbell 2: 6-needle 2K 38.8 -> 43.6 -->
  <line x1="400" y1="185.6" x2="400" y2="204.8" stroke="#999999" stroke-width="1.5"/>
  <circle cx="400" cy="204.8" r="6" fill="none" stroke="#555555" stroke-width="1.5"/>
  <circle cx="400" cy="185.6" r="6" fill="#D55E00"/>
  <text x="416" y="190" font-size="12" fill="#555">43.6</text>
  <text x="416" y="209" font-size="12" fill="#555">38.8</text>
  <text x="400" y="168" font-size="12.5" fill="#1A1B1E" text-anchor="middle">6 针 2K 序列</text>

  <!-- dumbbell 3: relevant-token attention 0.1817 -> 0.2845 -->
  <line x1="600" y1="246.2" x2="600" y2="287.32" stroke="#999999" stroke-width="1.5"/>
  <circle cx="600" cy="287.32" r="6" fill="none" stroke="#555555" stroke-width="1.5"/>
  <circle cx="600" cy="246.2" r="6" fill="#D55E00"/>
  <text x="616" y="250" font-size="12" fill="#555">0.2845</text>
  <text x="616" y="291" font-size="12" fill="#555">0.1817</text>
  <text x="588" y="168" font-size="12.5" fill="#1A1B1E" text-anchor="middle">相关 token 平均注意力权重</text>

  <g font-size="12" fill="#555">
    <circle cx="180" cy="398" r="5" fill="none" stroke="#555555" stroke-width="1.5"/>
    <text x="192" y="402">空心 = 标准注意力</text>
    <circle cx="360" cy="398" r="5" fill="#D55E00"/>
    <text x="372" y="402">实心 = LUCID（主角）</text>
    <text x="540" y="402">第三组原始值为小数，相对提升 56.6%</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="770" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="792" y="104" font-size="15" fill="#1A1B1E">BABILong 长上下文推理得分（论文自测口径）</text>
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="860" y1="320" x2="1140" y2="320"/>
    <line x1="860" y1="240" x2="1140" y2="240"/>
    <line x1="860" y1="160" x2="1140" y2="160"/>
  </g>
  <line x1="860" y1="360" x2="1140" y2="360" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="860" y1="360" x2="856" y2="360"/>
    <line x1="860" y1="280" x2="856" y2="280"/>
    <line x1="860" y1="200" x2="856" y2="200"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="850" y="364">0</text>
    <text x="850" y="284">0.1</text>
    <text x="850" y="204">0.2</text>
  </g>
  <text x="806" y="260" font-size="14" fill="#1A1B1E" text-anchor="middle" transform="rotate(-90 806 260)">得分</text>
  <!-- baseline 0.14 -->
  <circle cx="930" cy="304" r="6" fill="none" stroke="#555555" stroke-width="1.5"/>
  <text x="930" y="286" font-size="12" fill="#555" text-anchor="middle">0.14</text>
  <text x="930" y="384" font-size="12.5" fill="#1A1B1E" text-anchor="middle">32K 基线</text>
  <!-- LUCID-PaTH band 0.21-0.25: y 276..252 -->
  <rect x="1060" y="252" width="10" height="24" fill="#0072B2" opacity="0.35"/>
  <line x1="1050" y1="252" x2="1080" y2="252" stroke="#0072B2" stroke-width="1.5"/>
  <line x1="1050" y1="276" x2="1080" y2="276" stroke="#0072B2" stroke-width="1.5"/>
  <text x="1065" y="240" font-size="12" fill="#555" text-anchor="middle">0.21–0.25</text>
  <text x="1065" y="384" font-size="12.5" fill="#1A1B1E" text-anchor="middle">LUCID-PaTH 保持</text>
  <text x="1000" y="410" font-size="12" fill="#555">基线从 32K 到 128K 降至接近 0；LUCID-PaTH 几乎不降</text>

  <!-- ============ panel c ============ -->
  <text x="60" y="462" font-size="15" font-weight="bold" fill="#1A1B1E">c</text>
  <text x="82" y="462" font-size="15" fill="#1A1B1E">开销与实际任务（论文自测口径）</text>
  <g font-size="12" fill="#555">
    <text x="60" y="496">训练开销增加 0-5.5%，推理开销约 1.3%；计算复杂度仍为 O(N²d)，与标准注意力相同</text>
    <text x="60" y="520">HotpotQA 最佳 F1 0.0862；Qasper 比 PaTH 提升 1.14 F1；QMSum 最佳 ROUGE-L 12.60</text>
    <text x="60" y="544">应用建议：序列超过 8K 时优势开始显现，适合精确检索与多跳推理场景</text>
  </g>

  <!-- footnote -->
  <text x="60" y="652" font-size="11" fill="#767676">数据：arXiv:2602.10410（UT Austin 与 Google，论文自测口径）· b 面板区间条为论文报告范围 0.21-0.25 · 正文未报告误差区间，未画误差棒 · 预印本未经同行评审</text>
</svg>
