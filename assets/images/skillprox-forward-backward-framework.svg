<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">分布外泛化差异显著：Qwen3.5-4B 下 SkillOpt 在 WikiTQ、HiTab 的 OOD 得分跌至 26.0 与 16.0，SkillProx 为 78.5 与 69.2</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">分布外（OOD）得分：SkillOpt 与 SkillProx（Qwen3.5-4B）</text>

  <!-- gridlines: y = 420 - 3.2*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="170" y1="356" x2="560" y2="356"/>
    <line x1="170" y1="292" x2="560" y2="292"/>
    <line x1="170" y1="228" x2="560" y2="228"/>
    <line x1="170" y1="164" x2="560" y2="164"/>
  </g>

  <!-- bars: y = 420 - 3.2*v ; height = 3.2*v -->
  <!-- WikiTQ SkillOpt 26.0 -->
  <rect x="200" y="336.8" width="62" height="83.2" fill="#999999"/>
  <text x="231" y="328" font-size="12" fill="#555" text-anchor="middle">26.0</text>
  <!-- WikiTQ SkillProx 78.5 -->
  <rect x="270" y="168.8" width="62" height="251.2" fill="#0072B2"/>
  <text x="301" y="160" font-size="12" fill="#555" text-anchor="middle">78.5</text>
  <text x="266" y="440" font-size="12.5" fill="#1A1B1E" text-anchor="middle">WikiTQ</text>

  <!-- HiTab SkillOpt 16.0 -->
  <rect x="410" y="368.8" width="62" height="51.2" fill="#999999"/>
  <text x="441" y="360" font-size="12" fill="#555" text-anchor="middle">16.0</text>
  <!-- HiTab SkillProx 69.2 -->
  <rect x="480" y="198.6" width="62" height="221.4" fill="#0072B2"/>
  <text x="511" y="190" font-size="12" fill="#555" text-anchor="middle">69.2</text>
  <text x="476" y="440" font-size="12.5" fill="#1A1B1E" text-anchor="middle">HiTab</text>

  <!-- value axis -->
  <line x1="170" y1="420" x2="560" y2="420" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="166" y1="420" x2="170" y2="420"/>
    <line x1="166" y1="356" x2="170" y2="356"/>
    <line x1="166" y1="292" x2="170" y2="292"/>
    <line x1="166" y1="228" x2="170" y2="228"/>
    <line x1="166" y1="164" x2="170" y2="164"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="160" y="424">0</text>
    <text x="160" y="360">20</text>
    <text x="160" y="296">40</text>
    <text x="160" y="232">60</text>
    <text x="160" y="168">80</text>
  </g>
  <text x="100" y="140" font-size="14" fill="#1A1B1E">OOD 得分（分）</text>

  <!-- legend -->
  <g font-size="12" fill="#555">
    <rect x="200" y="126" width="12" height="10" fill="#999999"/>
    <text x="217" y="135">SkillOpt</text>
    <rect x="300" y="126" width="12" height="10" fill="#0072B2"/>
    <text x="317" y="135">SkillProx</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="650" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="672" y="104" font-size="15" fill="#1A1B1E">IID 硬准确率：三种技能来源（Qwen3.6-27B，分）</text>

  <!-- gridlines x = 800 + 5*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="900" y1="130" x2="900" y2="392"/>
    <line x1="1000" y1="130" x2="1000" y2="392"/>
  </g>

  <!-- groups: rows y; bars SkillProx #0072B2, SkillGrad #E69F00, 人工 #999 -->
  <!-- SpreadSheetBench: 54.5 / 50.0 / 36.7 -->
  <text x="790" y="163" font-size="12.5" fill="#1A1B1E" text-anchor="end">SpreadSheetBench</text>
  <rect x="800" y="146" width="272.5" height="10" fill="#0072B2"/>
  <text x="1078" y="155" font-size="12" fill="#555">54.5</text>
  <rect x="800" y="159" width="250" height="10" fill="#E69F00"/>
  <text x="1056" y="168" font-size="12" fill="#555">50.0</text>
  <rect x="800" y="172" width="183.5" height="10" fill="#999999"/>
  <text x="990" y="181" font-size="12" fill="#555">36.7</text>

  <!-- WikiTQ: 86.2 / 84.8 / 85.7 -->
  <text x="790" y="245" font-size="12.5" fill="#1A1B1E" text-anchor="end">WikiTQ</text>
  <rect x="800" y="228" width="431" height="10" fill="#0072B2"/>
  <text x="1108" y="237" font-size="12" fill="#555">86.2</text>
  <rect x="800" y="241" width="424" height="10" fill="#E69F00"/>
  <text x="1102" y="250" font-size="12" fill="#555">84.8</text>
  <rect x="800" y="254" width="428.5" height="10" fill="#999999"/>
  <text x="1106" y="263" font-size="12" fill="#555">85.7</text>

  <!-- HiTab: 80.0 / 78.3 / 78.0 -->
  <text x="790" y="327" font-size="12.5" fill="#1A1B1E" text-anchor="end">HiTab</text>
  <rect x="800" y="310" width="400" height="10" fill="#0072B2"/>
  <text x="1206" y="319" font-size="12" fill="#555">80.0</text>
  <rect x="800" y="323" width="391.5" height="10" fill="#E69F00"/>
  <text x="1197" y="332" font-size="12" fill="#555">78.3</text>
  <rect x="800" y="336" width="390" height="10" fill="#999999"/>
  <text x="1196" y="345" font-size="12" fill="#555">78.0</text>

  <!-- value axis -->
  <line x1="800" y1="392" x2="1050" y2="392" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="800" y1="392" x2="800" y2="396"/>
    <line x1="900" y1="392" x2="900" y2="396"/>
    <line x1="1000" y1="392" x2="1000" y2="396"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="800" y="412">0</text>
    <text x="900" y="412">20</text>
    <text x="1000" y="412">40</text>
  </g>
  <text x="950" y="412" font-size="14" fill="#1A1B1E" text-anchor="middle">IID 硬准确率（分）</text>

  <text x="650" y="446" font-size="12" fill="#555">较 SkillGrad 分别提升 4.5、1.4、1.7 个百分点；</text>
  <text x="650" y="464" font-size="12" fill="#555">较人工编写技能 IID 提升高达 17.8 个百分点。</text>

  <!-- footnote -->
  <text x="60" y="560" font-size="11" fill="#767676">数据：arXiv:2608.07449v1（SpreadSheetBench、WikiTQ、HiTab 三个表格基准）· 三骨干模型上较最强基线 SkillGrad 平均提升约 3.0 个百分点 · 论文自测口径 · 预印本未经同行评审</text>
</svg>
