<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9C9484; }
      .rl { font-size: 15px; fill: #474C54; }
      .val { font-size: 18px; font-weight: 700; fill: #1A1B1E; }
      .b { font-size: 12px; fill: #A5A296; }
      .chip { font-size: 12.5px; font-weight: 600; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F2EA"/>
    </linearGradient>
    <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E5A87"/><stop offset="1" stop-color="#6E9BC4"/>
    </linearGradient>
    <linearGradient id="gClay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5442E"/><stop offset="1" stop-color="#D9704F"/>
    </linearGradient>
    <linearGradient id="gWheat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9892F"/><stop offset="1" stop-color="#DCB65F"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F7E76"/><stop offset="1" stop-color="#6FB5A8"/>
    </linearGradient>
    <linearGradient id="gPlum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7D4E8E"/><stop offset="1" stop-color="#B183C2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1105" cy="110" r="140" fill="#2E5A87" opacity="0.06"/>
  <circle cx="70" cy="625" r="115" fill="#B5442E" opacity="0.05"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gClay)"/>

  <text class="k" x="64" y="84">一分钟读论文 · ARXIV:2608.07449 · 港科大 × 澳门大学</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">两道检票口</text>
  <text x="64" y="158" font-size="15" fill="#5B6068">SkillProx 把技能演化拆成闭环诊断演化与近端精炼，像一进一出的地铁闸机</text>

  <!-- right motif: subway turnstile, forward in / backward prune -->
  <g>
    <rect x="990" y="240" width="20" height="106" rx="4" fill="url(#gNavy)" opacity="0.85"/>
    <rect x="1130" y="240" width="20" height="106" rx="4" fill="url(#gNavy)" opacity="0.85"/>
    <rect x="972" y="342" width="196" height="12" rx="3" fill="url(#gTeal)" opacity="0.75"/>
    <g stroke="url(#gClay)" stroke-width="5" stroke-linecap="round">
      <line x1="1010" y1="272" x2="1060" y2="248"/>
      <line x1="1010" y1="288" x2="1060" y2="288"/>
      <line x1="1010" y1="304" x2="1060" y2="328"/>
    </g>
    <circle cx="1070" cy="288" r="16" fill="#FBFAF7" stroke="url(#gClay)" stroke-width="4"/>
    <path d="M 1078 246 l 22 0 m -8 -8 l 8 8 l -8 8" stroke="url(#gWheat)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 1122 330 l -22 0 m 8 8 l -8 -8 l 8 -8" stroke="url(#gTeal)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <rect x="1044" y="214" width="52" height="14" rx="7" fill="url(#gWheat)" opacity="0.55"/>
    <text class="b" x="1070" y="384" text-anchor="middle">进闸验证 · 出闸修剪</text>
  </g>

  <!-- OOD dumbbell rows -->
  <g>
    <rect x="64" y="206" width="740" height="70" fill="#B5442E" opacity="0.07"/>
    <rect x="64" y="294" width="740" height="70" fill="#B5442E" opacity="0.07"/>

    <text class="rl" x="252" y="239" text-anchor="end">WikiTQ · OOD 得分</text>
    <text class="b" x="252" y="257" text-anchor="end">SkillOpt → SkillProx</text>
    <circle cx="320" cy="240" r="7" fill="#FFFFFF" stroke="#B5442E" stroke-width="3"/>
    <line x1="320" y1="240" x2="438" y2="240" stroke="url(#gNavy)" stroke-width="2.5"/>
    <circle cx="438" cy="240" r="10" fill="url(#gNavy)"/>
    <text class="val" x="458" y="246" fill="#2E5A87" font-size="20">26.0 → 78.5</text>
    <text class="b" x="600" y="245">Qwen3.5-4B · 跌到与拉回之间</text>

    <text class="rl" x="252" y="327" text-anchor="end">HiTab · OOD 得分</text>
    <text class="b" x="252" y="345" text-anchor="end">SkillOpt → SkillProx</text>
    <circle cx="320" cy="328" r="7" fill="#FFFFFF" stroke="#B5442E" stroke-width="3"/>
    <line x1="320" y1="328" x2="415" y2="328" stroke="url(#gNavy)" stroke-width="2.5"/>
    <circle cx="415" cy="328" r="10" fill="url(#gNavy)"/>
    <text class="val" x="435" y="334" fill="#2E5A87" font-size="20">16.0 → 69.2</text>
    <text class="b" x="600" y="333">Qwen3.5-4B · 分布外泛化</text>
  </g>

  <!-- right stats -->
  <g>
    <rect x="836" y="404" width="145" height="76" fill="#2F7E76" opacity="0.09"/>
    <text class="serif" x="852" y="436" font-size="22" font-weight="700" fill="#2F5E58">砍掉 74.9%</text>
    <text x="852" y="460" font-size="12.5" fill="#6B7078">技能内容 · 仍留 51.0%</text>

    <rect x="997" y="404" width="143" height="76" fill="#7D4E8E" opacity="0.09"/>
    <text class="serif" x="1013" y="436" font-size="22" font-weight="700" fill="#5F3A6E">压缩 25.7%</text>
    <text x="1013" y="460" font-size="12.5" fill="#6B7078">最佳准确率 52.3%</text>
  </g>

  <!-- bottom chips -->
  <line x1="64" y1="400" x2="804" y2="400" stroke="#E8E3D2"/>
  <g>
    <rect x="64" y="424" width="150" height="28" rx="14" fill="url(#gWheat)" opacity="0.24"/>
    <text x="139" y="443" text-anchor="middle" class="chip" fill="#7A5A14">平均 +3.0pp</text>
    <text class="b" x="226" y="443">三基准 vs 最强基线 SkillGrad</text>

    <rect x="64" y="464" width="182" height="28" rx="14" fill="url(#gNavy)" opacity="0.16"/>
    <text x="155" y="483" text-anchor="middle" class="chip" fill="#2F5578">消融 54.5 / 53.0 / 52.0</text>
    <text class="b" x="258" y="483">完整 / 仅 Prox / 仅闭环诊断</text>

    <rect x="64" y="504" width="126" height="28" rx="14" fill="url(#gClay)" opacity="0.16"/>
    <text x="127" y="523" text-anchor="middle" class="chip" fill="#8E3623">负例 46%→54%</text>
    <text class="b" x="202" y="523">移除负效用知识单元反而更准</text>
  </g>

  <text class="serif" x="64" y="592" font-size="18" fill="#1A1B1E">前向管新知识进站，后向管旧知识出站，谁留谁走都要重新刷卡。</text>
  <text class="b" x="1136" y="640" text-anchor="end">三个结构化表格基准 · 分布外为 Qwen3.5-4B 口径 · Micropaper</text>
</svg>
