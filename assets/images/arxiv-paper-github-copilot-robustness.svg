<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">仅改写需求描述措辞，Copilot 约 46% 情况下生成完全不同的代码，约 28% 情况下正确性随之改变</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">措辞扰动的影响与整体通过率（实例占比 %，论文自测口径）</text>

  <!-- bars: x = 330 + 11*v, axis 0-75 with body-sourced tick labels 0,25,50,75 -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="605" y1="130" x2="605" y2="360"/>
    <line x1="880" y1="130" x2="880" y2="360"/>
  </g>
  <line x1="1155" y1="130" x2="1155" y2="360" stroke="#D9D9D9" stroke-width="0.5"/>

  <text x="318" y="158" font-size="12.5" fill="#1A1B1E" text-anchor="end">输出完全不同（约）</text>
  <rect x="330" y="144" width="506" height="20" fill="#D55E00"/>
  <text x="844" y="158" font-size="12" fill="#555">约 46%</text>

  <text x="318" y="220" font-size="12.5" fill="#1A1B1E" text-anchor="end">正确性改变（约）</text>
  <rect x="330" y="206" width="308" height="20" fill="#D55E00"/>
  <text x="646" y="220" font-size="12" fill="#555">约 28%</text>

  <text x="318" y="282" font-size="12.5" fill="#1A1B1E" text-anchor="end">通过全部测试（约）</text>
  <rect x="330" y="268" width="143" height="20" fill="#0072B2"/>
  <text x="481" y="282" font-size="12" fill="#555">约 13%</text>

  <text x="318" y="344" font-size="12.5" fill="#1A1B1E" text-anchor="end">未通过单元测试（约）</text>
  <rect x="330" y="330" width="803" height="20" fill="#999999"/>
  <text x="1085" y="316" font-size="12" fill="#555">约 73%</text>

  <!-- value axis -->
  <line x1="330" y1="360" x2="1155" y2="360" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="330" y1="360" x2="330" y2="364"/>
    <line x1="605" y1="360" x2="605" y2="364"/>
    <line x1="880" y1="360" x2="880" y2="364"/>
    <line x1="1155" y1="360" x2="1155" y2="364"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="330" y="380">0</text>
    <text x="605" y="380">25</text>
    <text x="880" y="380">50</text>
    <text x="1155" y="380">75</text>
  </g>
  <text x="742" y="406" font-size="14" fill="#1A1B1E" text-anchor="middle">实例占比（%）</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="456" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="456" font-size="15" fill="#1A1B1E">原始描述与人工改写的正确推荐重叠（个）</text>
  <g>
    <circle cx="240" cy="516" r="11" fill="none" stroke="#0072B2" stroke-width="1.5"/>
    <text x="240" y="552" font-size="12" fill="#1A1B1E" text-anchor="middle">仅原始描述触发</text>
    <text x="240" y="572" font-size="12" fill="#555" text-anchor="middle">14 个</text>

    <circle cx="480" cy="516" r="11" fill="#D55E00"/>
    <text x="480" y="552" font-size="12" fill="#1A1B1E" text-anchor="middle">两种描述重叠</text>
    <text x="480" y="572" font-size="12" fill="#555" text-anchor="middle">98 个</text>

    <circle cx="720" cy="516" r="11" fill="none" stroke="#0072B2" stroke-width="1.5"/>
    <text x="720" y="552" font-size="12" fill="#1A1B1E" text-anchor="middle">仅人工改写触发</text>
    <text x="720" y="572" font-size="12" fill="#555" text-anchor="middle">24 个</text>
  </g>
  <text x="840" y="512" font-size="12" fill="#555">空心 = 单一描述独占触发</text>
  <text x="840" y="534" font-size="12" fill="#555">实心 = 两种描述都能生成</text>
  <text x="840" y="556" font-size="12" fill="#555">原始描述通过 112 个、人工改写通过 122 个</text>

  <!-- dataset facts -->
  <text x="60" y="614" font-size="12" fill="#555">数据集：从 1,401 个开源项目收集 892 个 Java 方法；样本方法平均长度约 150 tokens，平均圈复杂度 5.3、中位数 3.0；TP 复述有效率 77%、正确率约 87%</text>

  <!-- footer -->
  <text x="60" y="656" font-size="11" fill="#767676">数据：arXiv:2302.00438（USI SEART 与莫利塞大学，892 个 Java 方法，以测试通过为正确性代理，论文自测口径）· 正文未报告误差区间，未画误差棒 · 预印本未经同行评审</text>
</svg>
