<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">微软与摩根大通至少四件 AI 代码评审方法专利公开或授权：3 件申请公开，1 件已授权</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">四件专利事件时间轴（实心 = 授权，空心 = 申请公开）</text>

  <!-- event rail: window 2025-01 to 2026-12 -->
  <line x1="90" y1="170" x2="1074" y2="170" stroke="#1A1B1E" stroke-width="1.5"/>
  <circle cx="204" cy="170" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <circle cx="541" cy="170" r="6.5" fill="#D55E00"/>
  <circle cx="666" cy="170" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <circle cx="852" cy="170" r="6.5" fill="#D55E00"/>
  <circle cx="930" cy="170" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="204" y="152">2025-03-27</text>
    <text x="541" y="152">2025-12-02</text>
    <text x="666" y="152">2026-03-05</text>
    <text x="852" y="134">2026-07-21</text>
    <text x="930" y="152">2026-09-17</text>
  </g>

  <!-- detail list below the rail, chronological by event date -->
  <g font-size="12" fill="#555">
    <text x="90" y="200">○ 公开 · US20250103325A1 · Microsoft · 2025-03-27　标注过意图的 diff 上微调分类器，先预测评审者意图再写评论</text>
    <text x="90" y="226">● 授权 · US12487819B2 · Microsoft · 2025-12-02　按变更影响挑 top-k 改动生成 PR 摘要，关联 issue 推荐评审人</text>
    <text x="90" y="252">○ 公开 · US20260064410A1 · JPMorgan Chase Bank · 2026-03-05　多智能体各管一路评审，汇总后判定 PR 通过与否</text>
    <text x="90" y="278">● 授权 · 母案 US12688374B2 · Microsoft Technology Licensing · 2026-07-21　受让人见正文</text>
    <text x="90" y="304">○ 公开 · US20260278303A1 · 微软继续申请（母案 US12688374B2）· 2026-09-17　diff 与历史评审建索引套模板生成评审</text>
  </g>

  <!-- date axis (time axis: no gridlines per style guide) -->
  <line x1="90" y1="330" x2="1074" y2="330" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="90" y1="330" x2="90" y2="334"/>
    <line x1="582" y1="330" x2="582" y2="334"/>
    <line x1="1074" y1="330" x2="1074" y2="334"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="90" y="350">2025 年初</text>
    <text x="582" y="350">2026 年初</text>
    <text x="1074" y="350">2026 年末</text>
  </g>
  <text x="582" y="374" font-size="14" fill="#1A1B1E" text-anchor="middle">事件日期（年，窗口 2025 至 2026 年）</text>
  <text x="90" y="398" font-size="12" fill="#555">● 授权　○ 公开 · 前三件为已公开申请、尚未授权；分类号集中在 G06F40/40 与 G06F8/77</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="440" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="440" font-size="15" fill="#1A1B1E">交付前质检报告单次报价（正文自估口径，区间 3000-8000 元）</text>

  <!-- range bar on 0-8000 元 scale: x = 90 + 990*v/8000 -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="90" y1="508" x2="1080" y2="508"/>
    <line x1="90" y1="476" x2="1080" y2="476"/>
  </g>
  <rect x="461" y="472" width="619" height="20" fill="#D55E00"/>
  <line x1="461" y1="468" x2="461" y2="496" stroke="#D55E00" stroke-width="2"/>
  <line x1="1080" y1="468" x2="1080" y2="496" stroke="#D55E00" stroke-width="2"/>
  <text x="453" y="466" font-size="12" fill="#555" text-anchor="end">下限 3000</text>
  <text x="1072" y="466" font-size="12" fill="#555" text-anchor="end">上限 8000</text>

  <!-- value axis -->
  <line x1="90" y1="536" x2="1080" y2="536" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="90" y1="536" x2="90" y2="540"/>
    <line x1="461" y1="536" x2="461" y2="540"/>
    <line x1="1080" y1="536" x2="1080" y2="540"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="90" y="556">0</text>
    <text x="461" y="556">3000</text>
    <text x="1080" y="556">8000</text>
  </g>
  <text x="585" y="580" font-size="14" fill="#1A1B1E" text-anchor="middle">单次报价（元）</text>

  <text x="90" y="596" font-size="12" fill="#555">对照：质检工具月成本数百元，1 人 4 周出 MVP（正文自估）</text>

  <!-- footnote -->
  <text x="60" y="626" font-size="11" fill="#767676">数据：US20260278303A1、US20250103325A1、US20260064410A1、US12487819B2 与母案 US12688374B2 公告日（正文 References）· 3000-8000 元为正文自估口径</text>
  <text x="60" y="644" font-size="11" fill="#767676">前三件为已公开申请尚未授权 · 误报率等验收口径正文指出尚无成型标准，故不上图</text>
</svg>
