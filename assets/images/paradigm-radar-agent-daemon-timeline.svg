<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">08-26 至 10-15 的八个节点信号连续，09-25 默认启用前无任何刹车动作</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">证据链八节点序位轴（仅有日期者标注；全部实测出处）</text>

  <!-- category gridlines (vertical, one per slot) -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="130" y1="150" x2="130" y2="430"/>
    <line x1="260" y1="150" x2="260" y2="430"/>
    <line x1="390" y1="150" x2="390" y2="430"/>
    <line x1="520" y1="150" x2="520" y2="430"/>
    <line x1="650" y1="150" x2="650" y2="430"/>
    <line x1="780" y1="150" x2="780" y2="430"/>
    <line x1="910" y1="150" x2="910" y2="430"/>
    <line x1="1040" y1="150" x2="1040" y2="430"/>
  </g>

  <!-- axis line at y=300 (baseline of events) -->
  <line x1="60" y1="300" x2="1110" y2="300" stroke="#1A1B1E" stroke-width="0.75"/>
  <!-- outward ticks below axis -->
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="130" y1="300" x2="130" y2="304"/>
    <line x1="260" y1="300" x2="260" y2="304"/>
    <line x1="390" y1="300" x2="390" y2="304"/>
    <line x1="520" y1="300" x2="520" y2="304"/>
    <line x1="650" y1="300" x2="650" y2="304"/>
    <line x1="780" y1="300" x2="780" y2="304"/>
    <line x1="910" y1="300" x2="910" y2="304"/>
    <line x1="1040" y1="300" x2="1040" y2="304"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="130" y="320">1</text>
    <text x="260" y="320">2</text>
    <text x="390" y="320">3</text>
    <text x="520" y="320">4</text>
    <text x="650" y="320">5</text>
    <text x="780" y="320">6</text>
    <text x="910" y="320">7</text>
    <text x="1040" y="320">8</text>
  </g>
  <text x="585" y="348" font-size="14" fill="#1A1B1E" text-anchor="middle">事件序位（按时间先后）</text>

  <!-- events alternating above/below axis: paradigm nodes get emphasized rings -->
  <g>
    <line x1="130" y1="300" x2="130" y2="262" stroke="#0072B2" stroke-width="1.5"/>
    <circle cx="130" cy="252" r="6" fill="#0072B2"/>
    <line x1="260" y1="300" x2="260" y2="342" stroke="#0072B2" stroke-width="1.5"/>
    <circle cx="260" cy="352" r="6" fill="#0072B2"/>
    <line x1="390" y1="300" x2="390" y2="262" stroke="#0072B2" stroke-width="1.5"/>
    <circle cx="390" cy="252" r="6" fill="#0072B2"/>
    <!-- 4: default enable = paradigm node -->
    <line x1="520" y1="300" x2="520" y2="262" stroke="#D55E00" stroke-width="1.5"/>
    <circle cx="520" cy="252" r="6" fill="#D55E00"/>
    <circle cx="520" cy="252" r="10" fill="none" stroke="#D55E00" stroke-width="1.5"/>
    <line x1="650" y1="300" x2="650" y2="342" stroke="#0072B2" stroke-width="1.5"/>
    <circle cx="650" cy="352" r="6" fill="#0072B2"/>
    <line x1="780" y1="300" x2="780" y2="342" stroke="#999999" stroke-width="1.5"/>
    <rect x="774" y="342" width="12" height="12" fill="#999999"/>
    <!-- 7: env leak issue, open -->
    <line x1="910" y1="300" x2="910" y2="342" stroke="#0072B2" stroke-width="1.5"/>
    <circle cx="910" cy="352" r="6" fill="#0072B2"/>
    <!-- 8: HN = paradigm node -->
    <line x1="1040" y1="300" x2="1040" y2="262" stroke="#D55E00" stroke-width="1.5"/>
    <circle cx="1040" cy="252" r="6" fill="#D55E00"/>
    <circle cx="1040" cy="252" r="10" fill="none" stroke="#D55E00" stroke-width="1.5"/>
  </g>

  <!-- upper labels -->
  <g font-size="12" fill="#1A1B1E" text-anchor="middle">
    <text x="130" y="232">2026-08-26</text>
    <text x="130" y="214">#40969 立案：60 秒 drain</text>
    <text x="130" y="198">超时 SIGKILL 杀在跑 turn</text>

    <text x="390" y="232">#42457 环境钉住</text>
    <text x="390" y="214">#46468 双通道打架</text>

    <text x="520" y="232">2026-09-25 默认启用</text>
    <text x="520" y="214">0.157.0 发布（Releases 与 npm 同日）</text>
    <text x="520" y="198">后台启动仅发布说明一句</text>

    <text x="1040" y="232">2026-10-12</text>
    <text x="1040" y="214">HN 50060694 发帖</text>
    <text x="1040" y="198">10-16 实测 607 分、292 条评论</text>
  </g>
  <!-- lower labels -->
  <g font-size="12" fill="#1A1B1E" text-anchor="middle">
    <text x="260" y="372">#41188 外部管理 daemon</text>
    <text x="260" y="388">+1 共 9，仍 open</text>

    <text x="650" y="372">#48050 Arch 需 --no-daemon</text>
    <text x="650" y="388">同日 #48195 要求改 opt-in</text>

    <text x="780" y="408">0.163.0 转正 latest（10-15）</text>
    <text x="780" y="424">alpha 连发 11 版（10-08 至 10-13）</text>

    <text x="910" y="372">#53547 环境变量跨会话泄漏立案（10-13）</text>
  </g>

  <!-- phase annotation -->
  <g font-size="12" fill="#555555">
    <line x1="130" y1="462" x2="390" y2="462" stroke="#999999" stroke-width="1.5"/>
    <text x="260" y="482" text-anchor="middle">信号期（08-26 至 09-18）</text>
    <line x1="650" y1="462" x2="1040" y2="462" stroke="#999999" stroke-width="1.5"/>
    <text x="845" y="482" text-anchor="middle">引爆期（10-08 至 10-13）</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#555555">
    <circle cx="100" cy="516" r="5" fill="#0072B2"/>
    <text x="112" y="520">GitHub issue 节点（全部实测，至今全部 open）</text>
    <rect x="404" y="511" width="11" height="11" fill="#999999"/>
    <text x="422" y="520">发布侧节点（Releases/npm）</text>
    <circle cx="640" cy="516" r="6" fill="#D55E00"/>
    <circle cx="640" cy="516" r="10" fill="none" stroke="#D55E00" stroke-width="1.5"/>
    <text x="656" y="520">范式节点：默认启用 / 舆论引爆</text>
  </g>
  <text x="60" y="556" font-size="12" fill="#555555">序位轴：正文仅部分节点给出完整日期，故不画等比日期轴，位置仅表先后</text>

  <!-- footnote -->
  <text x="60" y="652" font-size="11" fill="#767676">来源：openai/codex #40969、#41188、#42457、#46468、#48050、#48195、#53547、Releases/npm 与 HN 帖 50060694 · 数字均为 2026-10-16 实测，转述除外 · 预印性质的社区证据，非厂商口径</text>
</svg>
