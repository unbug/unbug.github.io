<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #96917E; }
      .rl { font-size: 15px; fill: #31404C; }
      .val { font-size: 18px; font-weight: 700; fill: #1A1B1E; }
      .b { font-size: 12px; fill: #A39E88; }
      .hd { font-size: 12.5px; letter-spacing: 2px; fill: #7C7763; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6F7F2"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5442E"/><stop offset="1" stop-color="#DA7C58"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F6E4F"/><stop offset="1" stop-color="#6FA97F"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#177E89"/><stop offset="1" stop-color="#5FB3BC"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C98A1B"/><stop offset="1" stop-color="#E7BC5C"/>
    </linearGradient>
    <linearGradient id="gPlum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C4A73"/><stop offset="1" stop-color="#9C7BA3"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1108" cy="110" r="140" fill="#177E89" opacity="0.06"/>
  <circle cx="76" cy="620" r="115" fill="#B5442E" opacity="0.06"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="#B5442E"/>

  <text class="k" x="64" y="84">AI 智创简报 · 2026-04 · NL2SQL 专利四件</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">报关堵死，验货没人</text>
  <text x="64" y="158" font-size="15.5" fill="#66614F">生成 SQL 一层被专利圈住，「答没答对」的质检通道还空着</text>
  <!-- customs booth illustration -->
  <g>
    <rect x="905" y="200" width="180" height="104" rx="6" fill="url(#gTeal)"/>
    <rect x="893" y="188" width="204" height="16" rx="3" fill="url(#gAmber)"/>
    <rect x="927" y="228" width="52" height="40" rx="3" fill="#F6F7F2"/>
    <rect x="995" y="228" width="52" height="40" rx="3" fill="#F6F7F2" opacity="0.55"/>
    <rect x="905" y="304" width="180" height="10" fill="#31536E" opacity="0.35"/>
    <circle cx="1082" cy="322" r="24" fill="url(#gRed)"/>
    <text x="1082" y="330" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF" class="serif">验</text>
    <text class="hd" x="995" y="362" text-anchor="middle">口岸通道</text>
  </g>

  <!-- four patent declarations -->
  <g>
    <text class="hd" x="64" y="212">报关单 · 2026 年 4 月集中公开或授权</text>

    <rect x="64" y="230" width="800" height="46" fill="#B5442E" opacity="0.07"/>
    <text class="serif" x="84" y="260" font-size="19" font-weight="700" fill="#B5442E">US12614037B2</text>
    <text class="rl" x="330" y="260">微软 · 04-28 授权</text>
    <text class="b" x="560" y="260">大模型对话式查库</text>

    <rect x="64" y="288" width="800" height="46" fill="#2F6E4F" opacity="0.08"/>
    <text class="serif" x="84" y="318" font-size="19" font-weight="700" fill="#2F6E4F">US20260111428A1</text>
    <text class="rl" x="330" y="318">亚马逊 · 04-23 公开</text>
    <text class="b" x="560" y="318">先生成实体关系图再出 SQL</text>

    <rect x="64" y="346" width="800" height="46" fill="#C98A1B" opacity="0.10"/>
    <text class="serif" x="84" y="376" font-size="19" font-weight="700" fill="#8A6112">US20260119483A1</text>
    <text class="rl" x="330" y="376">戴尔 · 04-30 公开</text>
    <text class="b" x="560" y="376">人可读查询转机器可读</text>

    <rect x="64" y="404" width="800" height="46" fill="#6C4A73" opacity="0.09"/>
    <text class="serif" x="84" y="434" font-size="19" font-weight="700" fill="#6C4A73">US12613928B2</text>
    <text class="rl" x="330" y="434">Snowflake · 04-28 授权</text>
    <text class="b" x="560" y="434">数据清单内检索匹配</text>
  </g>

  <!-- indie lane: gold-standard checklist -->
  <g>
    <text class="serif" x="64" y="512" font-size="25" font-weight="700" fill="#1A1B1E">独立开发者可接的验货通道</text>
    <text class="b" x="64" y="538">金标准问题集 50-200 条 + 自动回归校验 + 静态检查 · 用 Vanna / BIRD 对照</text>
    <line x1="64" y1="556" x2="64" y2="600" stroke="url(#gRed)" stroke-width="4"/>
    <text class="serif" x="82" y="578" font-size="24" font-weight="700" fill="#B5442E">起步 ¥3,000-8,000</text>
    <text class="b" x="82" y="600">查数质检服务按项目收 1-3 万元 · 校验插件每席位月费几十元</text>
  </g>

  <!-- right: verdict stamp -->
  <g>
    <rect x="893" y="440" width="228" height="120" fill="#B5442E" opacity="0.07"/>
    <text class="serif" x="1007" y="478" text-anchor="middle" font-size="22" font-weight="700" fill="#B5442E">竞争点已改道</text>
    <text x="1007" y="508" text-anchor="middle" font-size="14" fill="#31404C">元数据与校验做得够不够厚</text>
    <text class="b" x="1007" y="534" text-anchor="middle">不取决于提示词运气</text>
  </g>

  <line x1="64" y1="622" x2="1136" y2="622" stroke="#E5E1D4"/>
  <text class="serif" x="64" y="652" font-size="15.5" fill="#31404C">「上月华东退货率」返回的数字，错了也没人发现。</text>
  <text class="b" x="1136" y="652" text-anchor="end">四件均为公开或授权文本 · 状态已分别标注 · Micropaper</text>
</svg>
