<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #8E97A6; }
      .rl { font-size: 15px; fill: #3F4A5A; }
      .val { font-size: 24px; font-weight: 700; }
      .b { font-size: 12px; fill: #98A1AE; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F5F8"/>
    </linearGradient>
    <linearGradient id="gStorm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B6FA0"/><stop offset="1" stop-color="#DE7A3B"/>
    </linearGradient>
    <linearGradient id="gWarn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DE7A3B"/><stop offset="1" stop-color="#E5C042"/>
    </linearGradient>
    <linearGradient id="gCalm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C8B99"/><stop offset="1" stop-color="#3B6FA0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1090" cy="115" r="150" fill="#3B6FA0" opacity="0.06"/>
  <circle cx="80" cy="615" r="120" fill="#DE7A3B" opacity="0.05"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gStorm)"/>

  <text class="k" x="64" y="84">一分钟读论文 NO.182 · ARXIV:2609.03815</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1E2430">删了记录，风暴还在</text>
  <text x="64" y="158" font-size="15" fill="#5A6070">记录与后端状态不可访问，并不保证语义隐私</text>

  <!-- weather illustration: cloud shredded, radar keeps pinging -->
  <g>
    <path d="M 986 116 a 22 22 0 0 1 22 -30 a 28 28 0 0 1 52 -6 a 20 20 0 0 1 24 22" fill="none" stroke="#7C8B99" stroke-width="6" stroke-linecap="round"/>
    <line x1="994" y1="132" x2="1006" y2="118" stroke="#DE7A3B" stroke-width="4" stroke-linecap="round"/>
    <line x1="1026" y1="136" x2="1038" y2="122" stroke="#DE7A3B" stroke-width="4" stroke-linecap="round"/>
    <line x1="1058" y1="132" x2="1070" y2="118" stroke="#DE7A3B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1102" cy="156" r="10" fill="#3B6FA0"/>
    <path d="M 1120 138 a 26 26 0 0 1 0 36" fill="none" stroke="#3B6FA0" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M 1134 126 a 42 42 0 0 1 0 60" fill="none" stroke="#3B6FA0" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <text x="1060" y="212" text-anchor="middle" font-size="12" fill="#7C8B99">纸片撕了，回波照样读</text>
  </g>

  <!-- attack loop triangle -->
  <g>
    <text x="136" y="230" font-size="12.5" letter-spacing="2" fill="#8A94A0">攻击三步循环 · 全程黑盒，不读存储</text>
    <path d="M 330 330 A 96 96 0 0 1 490 330" fill="none" stroke="url(#gStorm)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 490 330 A 96 96 0 0 1 410 466" fill="none" stroke="url(#gWarn)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 410 466 A 96 96 0 0 1 330 330" fill="none" stroke="url(#gCalm)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 490 330 l -14 -8 l 4 18 z" fill="#DE7A3B"/>
    <path d="M 410 466 l 16 -2 l -10 -15 z" fill="#E5C042"/>
    <path d="M 330 330 l -2 18 l 16 -7 z" fill="#3B6FA0"/>
    <text x="410" y="286" text-anchor="middle" font-size="15" font-weight="700" fill="#3B6FA0">生成假设</text>
    <text x="552" y="412" text-anchor="start" font-size="15" font-weight="700" fill="#DE7A3B">切换任务试探</text>
    <text x="268" y="412" text-anchor="end" font-size="15" font-weight="700" fill="#7C8B99">只留行为支持的</text>
    <text x="410" y="392" text-anchor="middle" class="serif" font-size="30" font-weight="700" fill="#1E2430">≤ 16 次追问</text>
    <text x="410" y="414" text-anchor="middle" font-size="12.5" fill="#8A8578">每个目标预算内</text>
  </g>

  <!-- right: comparison bars + big anchor -->
  <g>
    <line x1="660" y1="212" x2="660" y2="500" stroke="#E5E1D4" stroke-width="1"/>

    <rect x="660" y="222" width="476" height="86" fill="#E5C042" opacity="0.10"/>
    <text x="684" y="256" class="serif" font-size="28" font-weight="700" fill="#B0642A">&gt; 6 倍</text>
    <text x="800" y="252" font-size="14" fill="#3F4A5A">UMR-F1 语义恢复超过最强对比攻击</text>
    <text x="800" y="274" font-size="12.5" fill="#8A8578">并在 4 基准 × 3 后端全部组合中领先</text>
    <rect x="684" y="288" width="430" height="8" rx="4" fill="url(#gWarn)" opacity="0.9"/>

    <text x="684" y="356" font-size="15" fill="#3F4A5A" font-weight="700">压缩删文本，删不掉影响</text>
    <text x="684" y="382" font-size="13.5" fill="#5A6070">金丝雀逐字提取下降</text>
    <rect x="878" y="368" width="132" height="18" rx="9" fill="url(#gCalm)" opacity="0.85"/>
    <text x="1022" y="382" font-size="15" font-weight="700" fill="#3B6FA0">64%-76%</text>
    <text x="684" y="410" font-size="13.5" fill="#5A6070">个性化召回</text>
    <text x="878" y="410" font-size="15" font-weight="700" fill="#DE7A3B">几乎不受影响</text>

    <line x1="660" y1="440" x2="1136" y2="440" stroke="#E5E1D4" stroke-width="1"/>
    <text x="684" y="474" font-size="13.5" fill="#5A6070">响应级防御拦不住：只有状态化反事实控制能压低恢复，</text>
    <text x="684" y="494" font-size="13.5" fill="#5A6070">代价是个性化任务性能同步下降</text>
  </g>

  <text x="64" y="636" font-size="12.5" fill="#A29C88">六倍为论文自定义 UMR-F1 词汇匹配口径；真实系统验证限于作者确证保留信息的目标；未经同行评审。</text>
</svg>
