<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="600" fill="#fbfbfd"/>
  <text x="430" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a2e">UMPeek：删掉记忆原文，为什么隐私还在漏</text>
  <text x="430" y="62" text-anchor="middle" font-size="13" fill="#666">个性化 Agent 的用户模型持续塑造可见行为 · 黑盒自适应追问可从行为恢复隐私（arXiv:2609.03815）</text>

  <!-- 左侧：传统假设 -->
  <rect x="40" y="90" width="240" height="170" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="160" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">业界默认防线</text>
  <text x="160" y="144" text-anchor="middle" font-size="12.5" fill="#444">记忆原文已删除</text>
  <text x="160" y="166" text-anchor="middle" font-size="12.5" fill="#444">存储与后端不可访问</text>
  <text x="160" y="188" text-anchor="middle" font-size="12.5" fill="#444">只留压缩后的用户模型</text>
  <text x="160" y="222" text-anchor="middle" font-size="12" fill="#7c3aed">前提：攻击必须读到原文</text>
  <text x="160" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">该前提被论文推翻</text>

  <!-- 中间：泄漏机制 -->
  <rect x="330" y="90" width="240" height="170" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="450" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">泄漏通道：选择</text>
  <text x="450" y="146" text-anchor="middle" font-size="12.5" fill="#444">用户模型仍在每次回复里</text>
  <text x="450" y="168" text-anchor="middle" font-size="12.5" fill="#444">替 Agent 做个性化选择</text>
  <text x="450" y="196" text-anchor="middle" font-size="12.5" fill="#c2410c">删掉了文本，保留了影响</text>
  <text x="450" y="228" text-anchor="middle" font-size="11.5" fill="#666">LongMemEval：摘要使逐字提取降</text>
  <text x="450" y="246" text-anchor="middle" font-size="11.5" fill="#c2410c">64%–76%，个性化召回几乎不掉</text>

  <!-- 右侧：攻击循环 -->
  <rect x="620" y="90" width="200" height="170" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="720" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">UMPeek 三步循环</text>
  <text x="720" y="146" text-anchor="middle" font-size="12" fill="#444">1. 从单次响应生成假设</text>
  <text x="720" y="170" text-anchor="middle" font-size="12" fill="#444">2. 切换任务自适应追问</text>
  <text x="720" y="194" text-anchor="middle" font-size="12" fill="#444">3. 只留被行为支持的主张</text>
  <text x="720" y="226" text-anchor="middle" font-size="11.5" fill="#666">全程黑盒 · 最多 16 次追问</text>

  <!-- 箭头 -->
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="282" y1="175" x2="326" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="572" y1="175" x2="616" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 结果条 -->
  <rect x="40" y="290" width="780" height="120" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="60" y="318" font-size="14.5" font-weight="700" fill="#166534">评测结果（4 基准 × 3 后端，对比 7 个已有攻击）</text>
  <rect x="60" y="332" width="120" height="20" rx="4" fill="#dcfce7"/>
  <text x="120" y="347" text-anchor="middle" font-size="11.5" fill="#166534">最强对比攻击</text>
  <rect x="180" y="332" width="180" height="20" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="270" y="347" text-anchor="middle" font-size="11.5" fill="#166534">UMPeek：超过其六倍以上</text>
  <text x="60" y="374" font-size="12" fill="#444">UMR-F1 语义恢复分数全部组合领先；优势来自假设引导，不是追问数量多</text>
  <text x="60" y="396" font-size="11.5" fill="#666">指标为确定性词汇匹配（不用大模型评判），与真实隐私损害的距离尚不明确</text>

  <!-- 防御对比 -->
  <rect x="40" y="430" width="380" height="120" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="60" y="458" font-size="14" font-weight="700" fill="#92400e">拦不住的一层</text>
  <text x="60" y="484" font-size="12" fill="#444">响应级防御（PrivacyChecker、</text>
  <text x="60" y="504" font-size="12" fill="#444">Theory-of-Mind）下，自适应追问</text>
  <text x="60" y="524" font-size="12" fill="#b45309">仍能恢复大量用户信息</text>

  <rect x="440" y="430" width="380" height="120" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="460" y="458" font-size="14" font-weight="700" fill="#1e40af">有效但有代价</text>
  <text x="460" y="484" font-size="12" fill="#444">状态化反事实控制：撤销那些去掉</text>
  <text x="460" y="504" font-size="12" fill="#444">个性化就会改变的决定</text>
  <text x="460" y="524" font-size="12" fill="#1d4ed8">恢复被压低，任务性能同步下降</text>

  <!-- 底部边界 -->
  <rect x="40" y="562" width="780" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="430" y="582" text-anchor="middle" font-size="11.5" fill="#64748b">边界：预印本未经同行评审 · 真实系统验证限于作者确证信息仍保留的场景 · 不能外推为所有个性化产品都在泄露</text>
</svg>
