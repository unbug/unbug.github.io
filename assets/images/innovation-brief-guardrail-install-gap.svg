  <text x="640" y="150" font-size="22" font-weight="bold" fill="#1A1B1E">右：OpenAI 官方轨迹（一年九条）</text>
  <text x="640" y="196" font-size="17" fill="#555555">2025-11-07  Understanding prompt injections</text>
  <text x="640" y="232" font-size="17" fill="#555555">2026-02-13  Lockdown Mode 上线 ChatGPT</text>
  <text x="640" y="268" font-size="17" fill="#555555">2026-03-11  Designing agents to resist injection</text>
  <text x="640" y="304" font-size="17" fill="#555555">2026-11-05  GPT-6 Cyber 发布</text>
