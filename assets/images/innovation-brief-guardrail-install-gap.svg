  <text x="60" y="444" font-size="21" font-weight="bold" fill="#1A1B1E">纸面这头：昨夜 Google Patents 检索面封锁，本期可验主题专利 0 件</text>
  <text x="60" y="478" font-size="18" fill="#666666">已验的 US20260259908A1（NEC）方向不同题不硬挂；8-24 期已写的五件旧专利不重复引用</text>
  <line x1="60" y1="516" x2="1140" y2="516" stroke="#D9D9D9" stroke-width="2"/>
  <text x="60" y="560" font-size="21" font-weight="bold" fill="#1A1B1E">一个人能做的：护栏版本漂移回归体检，1 人 1-2 周可启动</text>
  <text x="60" y="594" font-size="18" fill="#666666">固定注入样本集，护栏库升级即重跑，输出拦截率前后对比；promptfoo、pyrit、CI 矩阵全是现成栈</text>
