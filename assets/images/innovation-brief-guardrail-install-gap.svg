  <rect x="330" y="178" width="560" height="26" rx="4" fill="#D55E00"/>
  <text x="902" y="198" font-size="20" font-weight="bold" fill="#D55E00">6,698,602</text>
  <text x="60" y="244" font-size="18" fill="#555555">npm promptfoo</text>
  <rect x="330" y="226" width="447" height="26" rx="4" fill="#cccccc"/>
  <text x="789" y="246" font-size="20" font-weight="bold" fill="#555555">5,345,028</text>
  <text x="60" y="292" font-size="18" fill="#555555">PyPI nemoguardrails</text>
  <rect x="330" y="274" width="40" height="26" rx="4" fill="#cccccc"/>
  <text x="382" y="294" font-size="20" font-weight="bold" fill="#555555">469,947</text>
  <text x="60" y="340" font-size="18" fill="#555555">PyPI llm-guard / pyrit</text>
