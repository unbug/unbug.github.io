  <text x="60" y="62" font-size="33" font-weight="bold" fill="#1A1B1E">护栏工具层月装五百四十万次，纸面专利一个号都追不上</text>
  <text x="60" y="96" font-size="19" fill="#666666">安装量为 2026-11-26 实测近一月口径，npm 与 PyPI 分列不相加；官方轨迹逐字取自 OpenAI RSS</text>

