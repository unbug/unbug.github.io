<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">代码合成的 1000 个可执行环境训练后，AWM 是三个分布外基准上唯一全面超越基线的方法：BFCLv3 上 8B 模型 53.83 提升到 65.94</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">基准分数对比（正文报告口径，论文自测）</text>

  <!-- gridline at tick 35 (=12.5*scale): x = 300 + 12.5*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="737.5" y1="130" x2="737.5" y2="368"/>
  </g>

  <!-- dumbbells: hollow = baseline, solid = after AWM -->
  <!-- BFCLv3 8B: 53.83 -> 65.94 -->
  <text x="288" y="168" font-size="12.5" fill="#1A1B1E" text-anchor="end">BFCLv3（8B）</text>
  <line x1="972.9" y1="164" x2="1124.3" y2="164" stroke="#0072B2" stroke-width="2"/>
  <circle cx="972.9" cy="164" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.5"/>
  <circle cx="1124.3" cy="164" r="6" fill="#0072B2"/>
  <text x="900" y="146" font-size="12" fill="#555">53.83 → 65.94（+12.11）</text>

  <!-- MCP-Universe 8B: 6.70 -> 11.17 -->
  <text x="288" y="224" font-size="12.5" fill="#1A1B1E" text-anchor="end">MCP-Universe（8B）</text>
  <line x1="383.75" y1="220" x2="439.6" y2="220" stroke="#0072B2" stroke-width="2"/>
  <circle cx="383.75" cy="220" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.5"/>
  <circle cx="439.6" cy="220" r="6" fill="#0072B2"/>
  <text x="451.6" y="224" font-size="12" fill="#555">6.70 → 11.17</text>

  <!-- tau2-bench 14B: only 39.03 reported -->
  <text x="288" y="280" font-size="12.5" fill="#1A1B1E" text-anchor="end">τ²-bench（14B）</text>
  <circle cx="787.9" cy="276" r="6" fill="#999999"/>
  <text x="799.9" y="280" font-size="12" fill="#555">39.03（Pass@1，正文仅报告此单值，无前后对比）</text>

  <!-- value axis -->
  <line x1="300" y1="368" x2="1140" y2="368" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="368" x2="300" y2="372"/>
    <line x1="737.5" y1="368" x2="737.5" y2="372"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="390">0</text>
    <text x="737.5" y="390">35</text>
  </g>
  <text x="675" y="414" font-size="14" fill="#1A1B1E" text-anchor="middle">基准分数（正文各自口径，未统一量纲）</text>
  <g font-size="12" fill="#555">
    <circle cx="308" cy="136" r="5" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.5"/>
    <text x="320" y="140">基线（训练前）</text>
    <circle cx="430" cy="136" r="5" fill="#0072B2"/>
    <text x="442" y="140">AWM 训练后</text>
    <circle cx="552" cy="136" r="5" fill="#999999"/>
    <text x="564" y="140">正文仅报告单值</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="60" y="470" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="470" font-size="15" fill="#1A1B1E">合成环境规模与训练设置（正文数字）</text>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="66" y1="490" x2="66" y2="600"/>
  </g>
  <g font-size="13" fill="#1A1B1E">
    <text x="82" y="504">1000 个</text>
    <text x="82" y="536">平均 35 个</text>
    <text x="82" y="568">1024 个</text>
  </g>
  <g font-size="12" fill="#555">
    <text x="170" y="504">可执行 Python 合成环境（状态由 SQL 数据库管理，生成后自动测试与修复）</text>
    <text x="170" y="536">工具 / 环境，智能体需多轮工具调用完成复杂任务</text>
    <text x="170" y="568">并行环境实例训练，速度比 LLM 模拟快几个数量级</text>
  </g>
  <text x="60" y="624" font-size="12" fill="#555">奖励为混合信号：步骤级做格式检查与语法验证；任务级由代码判分加 LLM 评判，基于最终数据库状态与任务规范</text>

  <!-- footnote -->
  <text x="60" y="652" font-size="11" fill="#767676">数据：arXiv:2602.10090《Agent World Model》（Snowflake 实验室，论文自测口径）· 正文未报告误差区间，未画误差棒 · 已开源代码、数据集与模型 · 预印本未经同行评审</text>
</svg>
