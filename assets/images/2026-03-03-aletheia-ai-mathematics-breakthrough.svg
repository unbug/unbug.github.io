<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">Aletheia 在 FirstProof 的 10 个研究级难题中自主解决 6 个；找不到证明时按设计如实报告未找到解决方案</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">10 个问题解答状态（按 P1-P10 编号序列排列，序列位置轴；朱色实心=解决，空心=未解决）</text>

  <!-- legend -->
  <g font-size="12" fill="#555">
    <circle cx="820" cy="100" r="5" fill="#D55E00"/>
    <text x="832" y="104">已解决（6 个）</text>
    <circle cx="960" cy="100" r="5" fill="#FFFFFF" stroke="#999999" stroke-width="1.5"/>
    <text x="972" y="104">未解决（4 个）</text>
  </g>

  <!-- axis: P1..P10 at x = 100 + 100*i -->
  <line x1="90" y1="300" x2="1140" y2="300" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="200" y1="300" x2="200" y2="305"/>
    <line x1="300" y1="300" x2="300" y2="305"/>
    <line x1="400" y1="300" x2="400" y2="305"/>
    <line x1="500" y1="300" x2="500" y2="305"/>
    <line x1="600" y1="300" x2="600" y2="305"/>
    <line x1="700" y1="300" x2="700" y2="305"/>
    <line x1="800" y1="300" x2="800" y2="305"/>
    <line x1="900" y1="300" x2="900" y2="305"/>
    <line x1="1000" y1="300" x2="1000" y2="305"/>
    <line x1="1100" y1="300" x2="1100" y2="305"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="200" y="325">P1</text>
    <text x="300" y="325">P2</text>
    <text x="400" y="325">P3</text>
    <text x="500" y="325">P4</text>
    <text x="600" y="325">P5</text>
    <text x="700" y="325">P6</text>
    <text x="800" y="325">P7</text>
    <text x="900" y="325">P8</text>
    <text x="1000" y="325">P9</text>
    <text x="1100" y="325">P10</text>
  </g>

  <!-- markers -->
  <g>
    <circle cx="200" cy="270" r="7" fill="#FFFFFF" stroke="#999999" stroke-width="1.5"/>
    <circle cx="300" cy="270" r="7" fill="#D55E00"/>
    <circle cx="400" cy="270" r="7" fill="#FFFFFF" stroke="#999999" stroke-width="1.5"/>
    <circle cx="500" cy="270" r="7" fill="#FFFFFF" stroke="#999999" stroke-width="1.5"/>
    <circle cx="600" cy="270" r="7" fill="#D55E00"/>
    <circle cx="700" cy="270" r="7" fill="#FFFFFF" stroke="#999999" stroke-width="1.5"/>
    <circle cx="800" cy="270" r="7" fill="#D55E00"/>
    <circle cx="900" cy="270" r="7" fill="#D55E00"/>
    <circle cx="1000" cy="270" r="7" fill="#D55E00"/>
    <circle cx="1100" cy="270" r="7" fill="#D55E00"/>
  </g>

  <!-- expert annotations -->
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="200" y="228">两配置无输出</text>
    <text x="300" y="228">4/4 专家正确</text>
    <text x="400" y="228">两配置无输出</text>
    <text x="500" y="228">两配置无输出</text>
    <text x="600" y="210">A 正确解决</text>
    <text x="600" y="228">B 误解题目</text>
    <text x="700" y="228">两配置无输出</text>
    <text x="800" y="210">B 解决</text>
    <text x="800" y="228">3/3 专家正确</text>
    <text x="900" y="192">辛几何专家 3 位与相邻领域 2 位</text>
    <text x="900" y="210">认为正确，2 位认为</text>
    <text x="900" y="228">不够完整</text>
    <text x="1000" y="228">4/4 专家正确</text>
    <text x="1068" y="210" text-anchor="end">2/2 专家正确</text>
    <text x="1132" y="228" text-anchor="end">A 自主发现最优复杂度界</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="60" y="404" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="404" font-size="15" fill="#1A1B1E">成绩与边界（论文自测口径）</text>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="66" y1="422" x2="66" y2="524"/>
  </g>
  <g font-size="13" fill="#1A1B1E">
    <text x="82" y="438">6 个</text>
    <text x="82" y="474">10 个</text>
    <text x="82" y="510">4 个</text>
  </g>
  <g font-size="12" fill="#555">
    <text x="160" y="438">配置 A 与 B 合计解决的问题数；</text>
    <text x="160" y="456">P7 推理成本比其他问题高出一个数量级</text>
    <text x="160" y="474">FirstProof 引理总数，覆盖代数数论、</text>
    <text x="160" y="492">等变稳定同伦论、几何拓扑、辛几何、张量分解、数值线性代数</text>
    <text x="160" y="510">未解决问题（P1、P3、P4、P6），两配置均无输出，</text>
    <text x="160" y="528">系统按设计如实报告</text>
  </g>
  <text x="60" y="560" font-size="12" fill="#555">P10 上 Aletheia A 的方案优于官方人类作者的解决方案；</text>
  <text x="60" y="582" font-size="12" fill="#555">规则：AI 必须完全自主产生证明，不接受任何人类提供的数学思想或内容输入</text>

  <!-- ============ panel c ============ -->
  <text x="700" y="404" font-size="15" font-weight="bold" fill="#1A1B1E">c</text>
  <text x="722" y="404" font-size="15" fill="#1A1B1E">架构与定位</text>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="706" y1="422" x2="706" y2="558"/>
  </g>
  <g font-size="12" fill="#555">
    <text x="722" y="438">基于 Gemini 3 Deep Think 构建</text>
    <text x="722" y="466">生成器子 Agent 产生候选证明，</text>
    <text x="722" y="484">验证器子 Agent 严格检查正确性</text>
    <text x="722" y="512">设计原则：可靠性优先，</text>
    <text x="722" y="530">宁可牺牲原始解题能力换取更高准确性</text>
    <text x="722" y="558">定位：数学家的研究伙伴而非替代品</text>
  </g>

  <!-- footnote -->
  <text x="60" y="652" font-size="11" fill="#767676">数据：arXiv:2602.21201《Aletheia tackles FirstProof autonomously》（Google DeepMind，论文自测口径）· a 面板为 P1-P10 序列位置轴，非数值刻度 · 专家认定比例为正文报告值 · 预印本未经同行评审</text>
</svg>
