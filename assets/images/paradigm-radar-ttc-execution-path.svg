<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">动态预算分配三档（&lt;500 / 2K / 8K tokens）；工作流示例中整体成功率约 45% 提升到约 67%</text>

  <!-- ================= panel a ================= -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">预算分配执行路径（流程示意，非测量值）</text>

  <!-- boxes -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="480" y="124" width="200" height="32" fill="none" stroke="#555555" stroke-width="1.5"/>
    <text x="580" y="144" fill="#1A1B1E">任务输入</text>

    <rect x="480" y="180" width="200" height="32" fill="#56B4E9"/>
    <text x="580" y="200" fill="#1A1B1E">难度评估器</text>

    <rect x="150" y="252" width="200" height="32" fill="none" stroke="#555555" stroke-width="1.5"/>
    <text x="250" y="272" fill="#1A1B1E">simple 预算</text>

    <rect x="480" y="252" width="200" height="32" fill="none" stroke="#555555" stroke-width="1.5"/>
    <text x="580" y="272" fill="#1A1B1E">medium 预算</text>

    <rect x="810" y="252" width="200" height="32" fill="none" stroke="#555555" stroke-width="1.5"/>
    <text x="910" y="272" fill="#1A1B1E">hard 预算</text>

    <rect x="480" y="356" width="200" height="32" fill="#0072B2"/>
    <text x="580" y="376" fill="#FFFFFF">失败模式检测器</text>

    <rect x="220" y="428" width="200" height="32" fill="none" stroke="#555555" stroke-width="1.5"/>
    <text x="320" y="448" fill="#1A1B1E">正常完成</text>

    <rect x="740" y="428" width="220" height="32" fill="#D55E00"/>
    <text x="850" y="448" fill="#FFFFFF">检测到问题信号</text>
  </g>

  <!-- connectors -->
  <g stroke="#999999" stroke-width="1.5" fill="none">
    <line x1="580" y1="156" x2="580" y2="180"/>
    <line x1="250" y1="228" x2="250" y2="252"/>
    <line x1="580" y1="212" x2="580" y2="252"/>
    <line x1="910" y1="228" x2="910" y2="252"/>
    <line x1="250" y1="212" x2="910" y2="212"/>
    <line x1="250" y1="284" x2="250" y2="326"/>
    <line x1="580" y1="284" x2="580" y2="356"/>
    <line x1="910" y1="284" x2="910" y2="326"/>
    <line x1="250" y1="326" x2="910" y2="326"/>
    <line x1="480" y1="372" x2="320" y2="372"/>
    <line x1="320" y1="372" x2="320" y2="428"/>
    <line x1="680" y1="372" x2="850" y2="372"/>
    <line x1="850" y1="372" x2="850" y2="428"/>
    <line x1="850" y1="460" x2="850" y2="486"/>
  </g>
  <g fill="#999999">
    <polygon points="576,175 584,175 580,182"/>
    <polygon points="246,247 254,247 250,254"/>
    <polygon points="576,247 584,247 580,254"/>
    <polygon points="906,247 914,247 910,254"/>
    <polygon points="316,423 324,423 320,430"/>
    <polygon points="846,423 854,423 850,430"/>
    <polygon points="846,481 854,481 850,488"/>
  </g>
  <text x="862" y="482" font-size="12" fill="#555555">策略切换 / 回退</text>

  <!-- per-tier annotations -->
  <g font-size="12" fill="#555555" text-anchor="middle">
    <text x="250" y="300">&lt;500 tokens · 1 step · 无反思</text>
    <text x="580" y="300">2K tokens · 3 steps · 有反思</text>
    <text x="910" y="300">8K tokens · 5 steps · 反思+回退</text>
  </g>

  <!-- ================= panel b ================= -->
  <text x="60" y="510" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="510" font-size="15" fill="#1A1B1E">工作流示例：预算分配与整体成功率（总预算 16K tokens · 8 步 · 综合推断口径）</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="380" y1="526" x2="380" y2="606"/>
    <line x1="520" y1="526" x2="520" y2="606"/>
    <line x1="660" y1="526" x2="660" y2="606"/>
    <line x1="800" y1="526" x2="800" y2="606"/>
  </g>
  <!-- bars: x = 240 + 5.6*v -->
  <text x="228" y="545" font-size="12.5" fill="#1A1B1E" text-anchor="end">传统均匀分配</text>
  <rect x="240" y="532" width="252" height="18" fill="#999999"/>
  <text x="500" y="545" font-size="12" fill="#555555">约 45%</text>

  <text x="228" y="577" font-size="12.5" fill="#1A1B1E" text-anchor="end">动态预算分配</text>
  <rect x="240" y="564" width="375" height="18" fill="#D55E00"/>
  <text x="623" y="577" font-size="12" fill="#555555">约 67%（提升 22 个百分点）</text>

  <!-- value axis -->
  <line x1="240" y1="606" x2="800" y2="606" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="240" y1="606" x2="240" y2="610"/>
    <line x1="380" y1="606" x2="380" y2="610"/>
    <line x1="520" y1="606" x2="520" y2="610"/>
    <line x1="660" y1="606" x2="660" y2="610"/>
    <line x1="800" y1="606" x2="800" y2="610"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="240" y="626">0</text>
    <text x="380" y="626">25</text>
    <text x="520" y="626">50</text>
    <text x="660" y="626">75</text>
    <text x="800" y="626">100</text>
  </g>
  <text x="520" y="648" font-size="14" fill="#1A1B1E" text-anchor="middle">整体成功率（%）</text>

  <!-- side note -->
  <text x="870" y="545" font-size="12" fill="#555555">token 使用效率提升约 35%（综合推断口径）</text>

  <!-- footnote -->
  <text x="60" y="664" font-size="11" fill="#767676">panel b 数据：arXiv:2607.28573 与行业基准测试的综合推断，非论文实测 · 实际效果取决于任务分布与策略实现 · panel a 为正文执行路径的流程示意 · 预印本未经同行评审</text>
</svg>
