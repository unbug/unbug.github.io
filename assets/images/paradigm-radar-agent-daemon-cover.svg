<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">Codex CLI 0.157.0 起默认安装常驻自更新守护进程，工程师让出版本、进程、配置三项主权</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">社区诉求热度（2026-10-16 实测，数值直标）</text>

  <!-- GitHub +1 bar -->
  <text x="60" y="158" font-size="12.5" fill="#1A1B1E">GitHub issue 48195：默认启动改 opt-in（+1 数，仍 open）</text>
  <rect x="60" y="170" width="301" height="18" fill="#0072B2"/>
  <text x="369" y="184" font-size="12" fill="#555555">181</text>

  <!-- HN points bar -->
  <text x="60" y="234" font-size="12.5" fill="#1A1B1E">HN 帖 50060694：常驻自更新守护进程（分数）</text>
  <rect x="60" y="246" width="1010" height="18" fill="#D55E00"/>
  <text x="640" y="260" font-size="12" fill="#FFFFFF">607</text>

  <text x="60" y="292" font-size="12" fill="#555555">数值条长度正比于标注值；两指标口径不同（GitHub +1 与 HN 分数），不共轴比较</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="356" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="356" font-size="15" fill="#1A1B1E">一次交互会话后驻留机器的四个东西</text>

  <g font-size="12.5" fill="#1A1B1E">
    <rect x="60" y="384" width="14" height="14" fill="#0072B2"/>
    <text x="84" y="396">① 常驻守护进程：reparent 到 PID 1，关窗不退出，直到 daemon stop 或重启</text>

    <rect x="60" y="420" width="14" height="14" fill="#0072B2"/>
    <text x="84" y="432">② 374 MB 平台包副本：复制进 ~/.codex/packages 并从副本运行，与包管理器脱钩</text>

    <rect x="60" y="456" width="14" height="14" fill="#0072B2"/>
    <text x="84" y="468">③ 分离式更新器 pid-update-loop：启动 5 分钟后首查，此后每小时一次</text>

    <rect x="60" y="492" width="14" height="14" fill="#0072B2"/>
    <text x="84" y="504">④ 被钉住的环境：首会话环境变量钉死此后所有会话的出站流量</text>
  </g>

  <text x="60" y="552" font-size="12.5" fill="#1A1B1E">对应的三项主权让渡：</text>
  <g font-size="12.5" fill="#1A1B1E">
    <rect x="60" y="566" width="14" height="14" fill="#D55E00"/>
    <text x="84" y="578">版本主权 — npm update 升的是 CLI 壳，后端来自复制包</text>
    <rect x="480" y="566" width="14" height="14" fill="#D55E00"/>
    <text x="504" y="578">进程主权 — 会话结束不再等于进程结束</text>
    <rect x="820" y="566" width="14" height="14" fill="#D55E00"/>
    <text x="844" y="578">配置主权 — 首会话环境决定明天的运行环境</text>
  </g>

  <!-- footnote -->
  <text x="60" y="624" font-size="11" fill="#767676">数据：openai/codex issue 48195 与 HN 帖 50060694 · 2026-10-16 经 GitHub、HN、npm 接口重测 · 292 为 HN API 全树评论数（含已删除），顶层回复 58 · 观察基于用户侧可见行为与公开 issue</text>
</svg>
