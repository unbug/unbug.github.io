<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9C9484; }
      .rl { font-size: 15px; fill: #474C54; }
      .b { font-size: 12px; fill: #A5A296; }
      .chip { font-size: 12.5px; font-weight: 600; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F2ED"/>
    </linearGradient>
    <linearGradient id="gVermil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5442E"/><stop offset="1" stop-color="#E37C45"/>
    </linearGradient>
    <linearGradient id="gSlate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D5A73"/><stop offset="1" stop-color="#6E8CA8"/>
    </linearGradient>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31457E"/><stop offset="1" stop-color="#6A7FB5"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A97E12"/><stop offset="1" stop-color="#DCB24A"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#177E7A"/><stop offset="1" stop-color="#5FB3A4"/>
    </linearGradient>
    <linearGradient id="gCrimson" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A32A4A"/><stop offset="1" stop-color="#D06480"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1092" cy="122" r="150" fill="#31457E" opacity="0.05"/>
  <circle cx="70" cy="640" r="105" fill="#A97E12" opacity="0.05"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gVermil)"/>

  <text class="k" x="64" y="84">一分钟读论文 · ARXIV:2608.21027 · 新加坡国立大学</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">观棋不语，只点一手</text>
  <text x="64" y="158" font-size="15" fill="#5B6068">COTA：0.5B  comparator 只会成对比较、不会解题，却在 9 个 actor-环境组合全部拿到最佳成绩</text>

  <!-- go board motif: tiny advisor points at a candidate stone, actor keeps the move -->
  <g>
    <rect x="892" y="96" width="240" height="216" rx="10" fill="url(#gAmber)" opacity="0.16"/>
    <rect x="892" y="96" width="240" height="216" rx="10" fill="none" stroke="#A97E12" stroke-opacity="0.35" stroke-width="1.5"/>
    <g stroke="#8A6612" stroke-width="1" opacity="0.5">
      <line x1="918" y1="124" x2="1106" y2="124"/><line x1="918" y1="162" x2="1106" y2="162"/>
      <line x1="918" y1="200" x2="1106" y2="200"/><line x1="918" y1="238" x2="1106" y2="238"/>
      <line x1="918" y1="276" x2="1106" y2="276"/>
      <line x1="924" y1="118" x2="924" y2="288"/><line x1="962" y1="118" x2="962" y2="288"/>
      <line x1="1000" y1="118" x2="1000" y2="288"/><line x1="1038" y1="118" x2="1038" y2="288"/>
      <line x1="1076" y1="118" x2="1076" y2="288"/><line x1="1112" y1="118" x2="1112" y2="288"/>
    </g>
    <circle cx="962" cy="200" r="13" fill="#1A1B1E"/>
    <circle cx="1000" cy="238" r="13" fill="#1A1B1E"/>
    <circle cx="1076" cy="162" r="13" fill="#FFFFFF" stroke="#8A8271" stroke-width="1.2"/>
    <circle cx="1000" cy="162" r="13" fill="#FFFFFF" stroke="#8A8271" stroke-width="1.2"/>
    <circle cx="1038" cy="200" r="17" fill="none" stroke="url(#gIndigo)" stroke-width="3.5"/>
    <circle cx="1038" cy="200" r="6.5" fill="#31457E"/>
    <text x="1038" y="112" text-anchor="middle" class="chip" fill="#31457E">同前缀成对比较</text>
    <text x="1012" y="332" text-anchor="middle" class="b">建议交回 actor 重规划，不直接落子</text>
  </g>

  <!-- headline stats strip -->
  <g>
    <rect x="64" y="196" width="780" height="78" fill="#31457E" opacity="0.07"/>
    <text class="serif" x="88" y="230" font-size="17" font-weight="700" fill="#474C54">9 个组合全部最佳 · 比较比求解便宜，而且够用</text>
    <text class="serif" x="88" y="262" font-size="26" font-weight="700" fill="#31457E">1.38×</text>
    <text x="158" y="260" font-size="13" fill="#5B6068">平均端到端开销（9 个设置中 7 个低于 1.5×）</text>
    <text class="rl" x="470" y="261">Self-Reflection 基线 9 设全变差</text>
    <text class="b" x="820" y="261" text-anchor="end">comparator 无需任务级微调</text>
  </g>

  <!-- dumbbell: Qwen3-8B baseline vs COTA -->
  <g>
    <text class="rl" x="64" y="318" font-weight="600">Qwen3-8B 基线 → COTA（空心=基线，实心=COTA）</text>

    <line x1="248" y1="334" x2="830" y2="334" stroke="#EAE6DA"/>
    <line x1="248" y1="334" x2="248" y2="430" stroke="#EAE6DA"/>
    <text class="b" x="248" y="448">0</text>
    <text class="b" x="830" y="448" text-anchor="end">100%</text>

    <rect x="64" y="336" width="780" height="42" fill="#3D5A73" opacity="0.07"/>
    <text class="rl" x="232" y="362" text-anchor="end">WebShop 奖励</text>
    <line x1="248" y1="357" x2="736" y2="357" stroke="#3D5A73" stroke-width="2.5"/>
    <circle cx="248" cy="357" r="7" fill="#FBFAF7" stroke="#3D5A73" stroke-width="2.5"/>
    <circle cx="736" cy="357" r="8" fill="url(#gVermil)"/>
    <text class="b" x="248" y="345" text-anchor="middle">0.3960 → 0.5630</text>
    <text class="serif" x="756" y="364" font-size="22" font-weight="700" fill="#B5442E">0.5630</text>

    <rect x="64" y="388" width="780" height="42" fill="#177E7A" opacity="0.08"/>
    <text class="rl" x="232" y="414" text-anchor="end">ALFWorld 成功率</text>
    <line x1="248" y1="409" x2="774" y2="409" stroke="#3D5A73" stroke-width="2.5"/>
    <circle cx="248" cy="409" r="7" fill="#FBFAF7" stroke="#3D5A73" stroke-width="2.5"/>
    <circle cx="774" cy="409" r="8" fill="url(#gTeal)"/>
    <text class="b" x="248" y="397" text-anchor="middle">82.84%</text>
    <text class="serif" x="794" y="416" font-size="22" font-weight="700" fill="#155E5B">90.30%</text>

    <rect x="880" y="336" width="256" height="94" fill="#A32A4A" opacity="0.07"/>
    <text x="896" y="360" class="chip" fill="#A32A4A">更强 actor 增益仍成立</text>
    <text class="serif" x="896" y="392" font-size="19" font-weight="700" fill="#A32A4A">85.07% → 94.03%</text>
    <text x="896" y="412" font-size="12.5" fill="#5B6068">ALFWorld · Qwen3.6-35B-A3B</text>
    <text class="serif" x="896" y="436" font-size="19" font-weight="700" fill="#31457E">0.6085 → 0.6867</text>
    <text x="896" y="454" font-size="12.5" fill="#5B6068">WebShop · DeepSeek-V4-Flash</text>
  </g>

  <!-- 2x2 ablation -->
  <g>
    <text class="rl" x="64" y="496" font-weight="600">2×2 消融：强行接管 vs 建设性建议（Qwen3-8B）</text>

    <rect x="64" y="508" width="1072" height="44" fill="#A32A4A" opacity="0.07"/>
    <rect x="64" y="558" width="1072" height="44" fill="#177E7A" opacity="0.08"/>

    <text class="rl" x="240" y="536" text-anchor="end">直接执行偏好动作</text>
    <text class="serif" x="264" y="537" font-size="21" font-weight="700" fill="#A32A4A">2.24%</text>
    <text x="348" y="535" font-size="13" fill="#5B6068">ALFWorld 崩盘</text>
    <text class="serif" x="520" y="537" font-size="21" font-weight="700" fill="#A32A4A">4.17%</text>
    <text x="600" y="535" font-size="13" fill="#5B6068">tau3-Retail 崩盘</text>
    <text class="b" x="1120" y="535" text-anchor="end">0.5B 没有独立执行能力</text>

    <text class="rl" x="240" y="586" text-anchor="end">建设性干预</text>
    <text class="serif" x="264" y="587" font-size="21" font-weight="700" fill="#155E5B">57.46%</text>
    <text x="380" y="585" font-size="13" fill="#5B6068">ALFWorld 恢复</text>
    <text class="serif" x="520" y="587" font-size="21" font-weight="700" fill="#155E5B">16.67%</text>
    <text x="620" y="585" font-size="13" fill="#5B6068">tau3-Retail 恢复</text>
    <text class="b" x="1120" y="585" text-anchor="end">tau3 开销最高 2.024×，并非可忽略</text>
  </g>

  <text class="b" x="1136" y="648" text-anchor="end">仅 3 actor × 3 环境特定组合内有效 · tau3 候选额外调用小 LLM · Micropaper</text>
</svg>
