<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #8FA094; }
      .rl { font-size: 15px; fill: #3C4740; }
      .val { font-size: 20px; font-weight: 700; }
      .b { font-size: 12px; fill: #A2B0A6; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF4EF"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C0392B"/><stop offset="1" stop-color="#E8785C"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D97B2B"/><stop offset="1" stop-color="#EFAA66"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F8A5B"/><stop offset="1" stop-color="#7CC493"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F7B8A"/><stop offset="1" stop-color="#5CB8C4"/>
    </linearGradient>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C5A9E"/><stop offset="1" stop-color="#A392CC"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1115" cy="605" r="135" fill="#0F7B8A" opacity="0.06"/>
  <circle cx="70" cy="110" r="105" fill="#C0392B" opacity="0.05"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gGreen)"/>

  <text class="k" x="64" y="84">一分钟读论文 · ARXIV:2608.06346 · 清华/腾讯混元</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1D2721">七个病灶，一个死因</text>
  <text x="64" y="158" font-size="15" fill="#5F6E65">TrajDebug：追踪错误生命周期，定位长程轨迹的关键失败</text>

  <!-- metro map motif -->
  <g>
    <path d="M 1010 96 q 30 -36 78 -12 q 42 20 22 56" fill="none" stroke="#0F7B8A" stroke-width="4" opacity="0.75"/>
    <circle cx="1010" cy="96" r="7" fill="#FFFFFF" stroke="#0F7B8A" stroke-width="3"/>
    <circle cx="1088" cy="84" r="7" fill="#FFFFFF" stroke="#0F7B8A" stroke-width="3"/>
    <circle cx="1110" cy="140" r="8" fill="url(#gRed)"/>
    <path d="M 1110 136 l -5 8 h 10 z" fill="#7A1F14"/>
    <text class="b" x="1072" y="176" text-anchor="middle">终点站：任务失败</text>
  </g>

  <!-- funnel: 7.62 -> 1 -->
  <g>
    <text class="rl" x="64" y="216" font-weight="700" fill="#1D2721">失败轨迹里的错误漏斗</text>

    <text class="serif" x="80" y="320" font-size="56" font-weight="700" fill="#6C5A9E">7.62</text>
    <text x="80" y="348" font-size="14" fill="#3C4740">平均局部错误</text>

    <path d="M 236 282 L 356 313 L 356 329 L 236 360 Z" fill="url(#gTeal)" opacity="0.5"/>
    <text class="b" x="296" y="272" text-anchor="middle" fill="#0F7B8A">61.9% 被后续修复</text>

    <text class="serif" x="392" y="320" font-size="56" font-weight="700" fill="#D97B2B">31.4%</text>
    <text x="392" y="348" font-size="14" fill="#3C4740">持续到最后</text>

    <path d="M 566 282 L 686 313 L 686 329 L 566 360 Z" fill="url(#gRed)" opacity="0.5"/>
    <text class="b" x="626" y="272" text-anchor="middle" fill="#B03123">因果归因</text>

    <text class="serif" x="790" y="326" font-size="72" font-weight="700" fill="#C0392B">1</text>
    <text x="790" y="354" font-size="14" font-weight="700" fill="#3C4740">关键错误</text>
    <text class="b" x="880" y="308">关键错误 ≠ 最早的局部错误</text>
    <text class="b" x="880" y="328">检测准确率随轨迹变长而下降</text>
  </g>

  <!-- four error states -->
  <g>
    <text class="rl" x="64" y="408" font-weight="700" fill="#1D2721">四种错误状态</text>
    <rect x="64" y="422" width="230" height="26" rx="13" fill="#2F8A5B" opacity="0.15"/>
    <text x="179" y="440" text-anchor="middle" font-size="13" fill="#226845">干净解决 · 无印记</text>
    <rect x="306" y="422" width="250" height="26" rx="13" fill="#D97B2B" opacity="0.16"/>
    <text x="431" y="440" text-anchor="middle" font-size="13" fill="#9C5517">带债解决 · 有预算债务</text>
    <rect x="568" y="422" width="250" height="26" rx="13" fill="#C0392B" opacity="0.15"/>
    <text x="693" y="440" text-anchor="middle" font-size="13" fill="#992A1E">显性活跃 · 不可逆印记</text>
    <rect x="830" y="422" width="230" height="26" rx="13" fill="#6C5A9E" opacity="0.15"/>
    <text x="945" y="440" text-anchor="middle" font-size="13" fill="#55447E">潜伏活跃 · 无印记</text>
  </g>

  <!-- pipeline + right stats -->
  <g>
    <text x="64" y="484" font-size="14" fill="#3C4740" font-weight="700">三阶段管线</text>
    <rect x="180" y="466" width="196" height="28" rx="6" fill="url(#gTeal)" opacity="0.85"/>
    <text x="278" y="485" text-anchor="middle" font-size="13" fill="#FFFFFF">多粒度历史压缩</text>
    <text x="392" y="485" fill="#8FA094" font-size="16">→</text>
    <rect x="414" y="466" width="196" height="28" rx="6" fill="url(#gViolet)" opacity="0.85"/>
    <text x="512" y="485" text-anchor="middle" font-size="13" fill="#FFFFFF">触发检测与分类</text>
    <text x="626" y="485" fill="#8FA094" font-size="16">→</text>
    <rect x="648" y="466" width="196" height="28" rx="6" fill="url(#gRed)" opacity="0.9"/>
    <text x="746" y="485" text-anchor="middle" font-size="13" fill="#FFFFFF">候选集因果归因</text>
    <text class="b" x="860" y="485">每个触发器须逐字证据可引</text>

    <text class="serif" x="1136" y="480" text-anchor="end" font-size="30" font-weight="700" fill="#1D2721">+10.80% <tspan font-size="17" fill="#0F7B8A">失败诊断重执行</tspan></text>
    <text class="serif" x="1136" y="514" text-anchor="end" font-size="30" font-weight="700" fill="#1D2721">+5.70% <tspan font-size="17" fill="#0F7B8A">失败记忆迁移</tspan></text>
  </g>

  <line x1="64" y1="548" x2="1136" y2="548" stroke="#DCE6DE"/>
  <text class="serif" x="64" y="582" font-size="19" fill="#1D2721">调试不该等任务烧完再看黑匣子——错误要一路挂标签追踪。</text>
  <text class="b" x="64" y="612">TrajErrBench：486 条人工标注失败轨迹（工具 400 条均 29.3 步 / 编码 86 条均 119.7 步）· 三人多数投票口径 · Micropaper</text>
</svg>
