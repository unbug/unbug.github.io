<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1528;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c5cff;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern overlay -->
  <g opacity="0.05">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="63" x2="1200" y2="63" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="126" x2="1200" y2="126" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="189" x2="1200" y2="189" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="252" x2="1200" y2="252" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="378" x2="1200" y2="378" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="441" x2="1200" y2="441" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="504" x2="1200" y2="504" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="567" x2="1200" y2="567" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="630" x2="1200" y2="630" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Left side: Traditional Fixed Compute -->
  <text x="80" y="140" fill="#6b7fa3" font-size="14" font-family="monospace">TRADITIONAL: FIXED COMPUTE</text>

  <!-- Single budget bar (fixed) -->
  <rect x="80" y="180" width="420" height="50" rx="6" fill="#2a3a5c" stroke="#ff7c5c" stroke-width="1.5"/>
  <text x="290" y="210" text-anchor="middle" fill="#ffb8a0" font-size="14" font-family="-apple-system, sans-serif">固定预算: 所有任务 = 3,000 tokens</text>

  <!-- Three task boxes with same budget -->
  <rect x="120" y="260" width="100" height="80" rx="6" fill="#2a3a5c" stroke="#4a9eff" stroke-width="1"/>
  <text x="170" y="285" text-anchor="middle" fill="#8ab4f8" font-size="10" font-family="monospace">简单任务</text>
  <text x="170" y="305" text-anchor="middle" fill="#ffcc33" font-size="10" font-family="monospace">预算: 3K t</text>
  <text x="170" y="325" text-anchor="middle" fill="#5ee68a" font-size="10" font-family="monospace">结果: OK</text>

  <rect x="260" y="260" width="100" height="80" rx="6" fill="#2a3a5c" stroke="#4a9eff" stroke-width="1"/>
  <text x="310" y="285" text-anchor="middle" fill="#8ab4f8" font-size="10" font-family="monospace">中等任务</text>
  <text x="310" y="305" text-anchor="middle" fill="#ffcc33" font-size="10" font-family="monospace">预算: 3K t</text>
  <text x="310" y="325" text-anchor="middle" fill="#ff6b60" font-size="10" font-family="monospace">结果: 不足</text>

  <rect x="400" y="260" width="100" height="80" rx="6" fill="#2a3a5c" stroke="#4a9eff" stroke-width="1"/>
  <text x="450" y="285" text-anchor="middle" fill="#8ab4f8" font-size="10" font-family="monospace">困难任务</text>
  <text x="450" y="305" text-anchor="middle" fill="#ffcc33" font-size="10" font-family="monospace">预算: 3K t</text>
  <text x="450" y="325" text-anchor="middle" fill="#ff6b60" font-size="10" font-family="monospace">结果: 失败</text>

  <!-- Waste indicator -->
  <rect x="80" y="370" width="420" height="40" rx="6" fill="#1e2a4a" stroke="#ffcc33" stroke-width="1"/>
  <text x="290" y="395" text-anchor="middle" fill="#ffcc33" font-size="12" font-family="-apple-system, sans-serif">浪费: 简单任务过度计算 | 困难任务预算不足</text>

  <!-- Right side: Dynamic Budget Allocation -->
  <text x="700" y="140" fill="#7c5cff" font-size="14" font-family="monospace">DYNAMIC BUDGET ALLOCATION</text>

  <!-- Difficulty assessment box -->
  <rect x="720" y="180" width="360" height="50" rx="6" fill="#2a3a5c" stroke="#7c5cff" stroke-width="2" filter="url(#glow)"/>
  <text x="900" y="210" text-anchor="middle" fill="#b8a9ff" font-size="14" font-family="-apple-system, sans-serif">难度评估器 → 动态分配预算</text>

  <!-- Three task boxes with adaptive budgets -->
  <rect x="720" y="260" width="100" height="80" rx="6" fill="#2a3a5c" stroke="#34c759" stroke-width="1.5"/>
  <text x="770" y="285" text-anchor="middle" fill="#8ab4f8" font-size="10" font-family="monospace">简单任务</text>
  <text x="770" y="305" text-anchor="middle" fill="#5ee68a" font-size="10" font-family="monospace">预算: 500 t (节省!)</text>
  <text x="770" y="325" text-anchor="middle" fill="#5ee68a" font-size="10" font-family="monospace">结果: OK</text>

  <rect x="860" y="260" width="100" height="80" rx="6" fill="#2a3a5c" stroke="#ff9f0a" stroke-width="1.5"/>
  <text x="910" y="285" text-anchor="middle" fill="#8ab4f8" font-size="10" font-family="monospace">中等任务</text>
  <text x="910" y="305" text-anchor="middle" fill="#ffcc33" font-size="10" font-family="monospace">预算: 2K t (追加)</text>
  <text x="910" y="325" text-anchor="middle" fill="#5ee68a" font-size="10" font-family="monospace">结果: OK</text>

  <rect x="1000" y="260" width="100" height="80" rx="6" fill="#2a3a5c" stroke="#ff7c5c" stroke-width="1.5"/>
  <text x="1050" y="285" text-anchor="middle" fill="#8ab4f8" font-size="10" font-family="monospace">困难任务</text>
  <text x="1050" y="305" text-anchor="middle" fill="#ff6b60" font-size="10" font-family="monospace">预算: 8K t (追加)</text>
  <text x="1050" y="325" text-anchor="middle" fill="#5ee68a" font-size="10" font-family="monospace">结果: OK</text>

  <!-- Efficiency indicator -->
  <rect x="720" y="370" width="360" height="40" rx="6" fill="#1e2a4a" stroke="#5ee68a" stroke-width="1"/>
  <text x="900" y="395" text-anchor="middle" fill="#5ee68a" font-size="12" font-family="-apple-system, sans-serif">效率: 总预算降低40% | 成功率提升至92%</text>

  <!-- VS divider -->
  <line x1="620" y1="100" x2="620" y2="530" stroke="#4a6fa5" stroke-width="1" opacity="0.3"/>
  <text x="620" y="320" text-anchor="middle" fill="#6b7fa3" font-size="28" font-family="monospace" transform="rotate(-90, 620, 320)">VS</text>

  <!-- Bottom tagline -->
  <rect x="150" y="480" width="900" height="60" rx="8" fill="#1e2a4a" stroke="#4a6fa5" stroke-width="1" opacity="0.7"/>
  <text x="600" y="515" text-anchor="middle" fill="#c8d6f0" font-size="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif">从固定预算到动态分配的范式转移</text>
  <text x="600" y="538" text-anchor="middle" fill="#6b7fa3" font-size="12" font-family="monospace">Fixed Compute → Dynamic Budget Allocation</text>

  <!-- Top right: Paradigm Radar badge -->
  <rect x="940" y="30" width="230" height="40" rx="6" fill="#7c5cff" opacity="0.15"/>
  <text x="1055" y="56" text-anchor="middle" fill="#b8a9ff" font-size="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif">AI Paradigm Radar</text>

  <!-- Bottom left: date -->
  <text x="80" y="570" fill="#4a6fa5" font-size="12" font-family="monospace">2026-08-04</text>

  <!-- Decorative dots -->
  <circle cx="1050" cy="560" r="3" fill="#7c5cff" opacity="0.4"/>
  <circle cx="1070" cy="560" r="2" fill="#4a9eff" opacity="0.3"/>
  <circle cx="1085" cy="560" r="2" fill="#ff7c5c" opacity="0.3"/>

  <!-- Corner accents -->
  <line x1="30" y1="30" x2="60" y2="30" stroke="#4a9eff" stroke-width="2" opacity="0.5"/>
  <line x1="30" y1="30" x2="30" y2="60" stroke="#4a9eff" stroke-width="2" opacity="0.5"/>

  <line x1="1170" y1="30" x2="1140" y2="30" stroke="#7c5cff" stroke-width="2" opacity="0.5"/>
  <line x1="1170" y1="30" x2="1170" y2="60" stroke="#7c5cff" stroke-width="2" opacity="0.5"/>

  <line x1="30" y1="600" x2="60" y2="600" stroke="#4a9eff" stroke-width="2" opacity="0.5"/>
  <line x1="30" y1="600" x2="30" y2="570" stroke="#4a9eff" stroke-width="2" opacity="0.5"/>

  <line x1="1170" y1="600" x2="1140" y2="600" stroke="#7c5cff" stroke-width="2" opacity="0.5"/>
  <line x1="1170" y1="600" x2="1170" y2="570" stroke="#7c5cff" stroke-width="2" opacity="0.5"/>
</svg>
