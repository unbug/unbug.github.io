<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2d3561;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6bb5f0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34c759;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5ee68a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff3b30;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff6b60;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern overlay -->
  <g opacity="0.05">
    <line x1="0" y1="0" x2="1200" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="1200" y1="0" x2="0" y2="630" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="bold">Test-Time Compute for Agents</text>
  <text x="600" y="115" text-anchor="middle" fill="#a0b4d0" font-size="18">动态预算分配的范式转移</text>

  <!-- Left side: Traditional (Uniform) -->
  <rect x="50" y="150" width="320" height="400" rx="12" fill="#1e2a4a" stroke="#3a4a7a" stroke-width="1"/>
  <text x="210" y="190" text-anchor="middle" fill="#ff6b60" font-size="16" font-weight="bold">传统均匀分配</text>

  <!-- Traditional steps -->
  <rect x="80" y="220" width="260" height="45" rx="6" fill="#3a4a7a"/>
  <text x="210" y="248" text-anchor="middle" fill="#ffffff" font-size="14">Step 1: Query DB (2K tokens)</text>

  <rect x="80" y="275" width="260" height="45" rx="6" fill="#3a4a7a"/>
  <text x="210" y="303" text-anchor="middle" fill="#ffffff" font-size="14">Step 2: Analyze (2K tokens)</text>

  <rect x="80" y="330" width="260" height="45" rx="6" fill="#3a4a7a"/>
  <text x="210" y="358" text-anchor="middle" fill="#ffffff" font-size="14">Step 3: Generate (2K tokens)</text>

  <rect x="80" y="385" width="260" height="45" rx="6" fill="#3a4a7a"/>
  <text x="210" y="413" text-anchor="middle" fill="#ffffff" font-size="14">Step 4: Validate (2K tokens)</text>

  <!-- Total budget -->
  <rect x="80" y="450" width="260" height="70" rx="6" fill="#2a3560"/>
  <text x="210" y="478" text-anchor="middle" fill="#ff6b60" font-size="14">总消耗: 8K tokens</text>
  <text x="210" y="505" text-anchor="middle" fill="#a0b4d0" font-size="12">简单步骤浪费 · 困难步骤不足</text>

  <!-- Right side: Dynamic -->
  <rect x="830" y="150" width="320" height="400" rx="12" fill="#1e2a4a" stroke="#3a4a7a" stroke-width="1"/>
  <text x="990" y="190" text-anchor="middle" fill="#5ee68a" font-size="16" font-weight="bold">动态自适应分配</text>

  <!-- Dynamic steps -->
  <rect x="860" y="220" width="260" height="45" rx="6" fill="#34c759"/>
  <text x="990" y="248" text-anchor="middle" fill="#ffffff" font-size="14">Step 1: Query DB (500 tokens)</text>

  <rect x="860" y="275" width="260" height="45" rx="6" fill="#3a4a7a"/>
  <text x="990" y="303" text-anchor="middle" fill="#ffffff" font-size="14">Step 2: Analyze (4K tokens)</text>

  <rect x="860" y="330" width="260" height="45" rx="6" fill="#4a90d9"/>
  <text x="990" y="358" text-anchor="middle" fill="#ffffff" font-size="14">Step 3: Generate (2K tokens)</text>

  <rect x="860" y="385" width="260" height="45" rx="6" fill="#3a4a7a"/>
  <text x="990" y="413" text-anchor="middle" fill="#ffffff" font-size="14">Step 4: Validate (1K tokens)</text>

  <!-- Total budget -->
  <rect x="860" y="450" width="260" height="70" rx="6" fill="#2a3560"/>
  <text x="990" y="478" text-anchor="middle" fill="#5ee68a" font-size="14">总消耗: 7.5K tokens</text>
  <text x="990" y="505" text-anchor="middle" fill="#a0b4d0" font-size="12">简单步骤节省 · 困难步骤充足</text>

  <!-- Center arrow -->
  <g transform="translate(600, 350)">
    <polygon points="-20,-30 20,0 -20,30" fill="#4a90d9"/>
    <line x1="-80" y1="0" x2="-20" y2="0" stroke="#4a90d9" stroke-width="2"/>
    <line x1="20" y1="0" x2="80" y2="0" stroke="#4a90d9" stroke-width="2"/>
  </g>

  <!-- Bottom tag -->
  <rect x="450" y="570" width="300" height="36" rx="18" fill="#4a90d9" opacity="0.3"/>
  <text x="600" y="594" text-anchor="middle" fill="#ffffff" font-size="14">从固定预算到自适应调度</text>
</svg>
