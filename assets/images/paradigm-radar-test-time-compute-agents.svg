<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">同一 16K token 预算下，示例工作流整体成功率从约 45% 升至约 67%，动态分配较均匀分配高 22 个百分点</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">两种预算分配下的整体成功率（%）</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="625" y1="130" x2="625" y2="288"/>
    <line x1="950" y1="130" x2="950" y2="288"/>
  </g>
  <!-- horizontal value axis: x = 300 + 13*v -->
  <line x1="300" y1="288" x2="1000" y2="288" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="288" x2="300" y2="292"/>
    <line x1="625" y1="288" x2="625" y2="292"/>
    <line x1="950" y1="288" x2="950" y2="292"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="310">0</text>
    <text x="625" y="310">25</text>
    <text x="950" y="310">50</text>
  </g>
  <text x="650" y="334" font-size="14" fill="#1A1B1E" text-anchor="middle">整体成功率（%）</text>

  <!-- bars -->
  <text x="288" y="166" font-size="12.5" fill="#1A1B1E" text-anchor="end">均匀分配（每步 2K）</text>
  <rect x="300" y="152" width="585" height="18" fill="#999999"/>
  <text x="893" y="166" font-size="12" fill="#555">约 45%</text>

  <text x="288" y="238" font-size="12.5" fill="#1A1B1E" text-anchor="end">动态预算分配</text>
  <rect x="300" y="224" width="871" height="18" fill="#D55E00"/>
  <text x="1030" y="262" font-size="12" fill="#1A1B1E">Δ=+22 个百分点</text>
  <text x="1140" y="238" font-size="12" fill="#555" text-anchor="end">约 67%</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="392" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="392" font-size="15" fill="#1A1B1E">示例工作流（8 步工具调用）的步骤级 token 配额（千 tokens）</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="360" y1="416" x2="360" y2="600"/>
    <line x1="610" y1="416" x2="610" y2="600"/>
    <line x1="860" y1="416" x2="860" y2="600"/>
    
  </g>
  <!-- horizontal axis: x = 360 + 50*v (thousand tokens) -->
  <line x1="360" y1="600" x2="910" y2="600" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="360" y1="600" x2="360" y2="604"/>
    <line x1="610" y1="600" x2="610" y2="604"/>
    <line x1="860" y1="600" x2="860" y2="604"/>
    
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="360" y="620">0</text>
    <text x="610" y="620">5</text>
    <text x="860" y="620">10</text>
    
  </g>
  <text x="635" y="642" font-size="14" fill="#1A1B1E" text-anchor="middle">每步 token 配额（千 tokens）</text>

  <!-- uniform: 3 groups x 3 steps at 2K; actual need of easy steps 1.5K -->
  <text x="348" y="446" font-size="12.5" fill="#1A1B1E" text-anchor="end">简单 × 3 步</text>
  <rect x="360" y="436" width="100" height="14" fill="#999999"/>
  <rect x="360" y="436" width="75" height="14" fill="none" stroke="#D55E00" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="470" y="447" font-size="12" fill="#555">每步 2K（实际需要 1.5K）</text>

  <text x="348" y="490" font-size="12.5" fill="#1A1B1E" text-anchor="end">中等 × 2 步</text>
  <rect x="360" y="480" width="100" height="14" fill="#999999"/>
  <text x="470" y="491" font-size="12" fill="#555">每步 2K</text>

  <text x="348" y="534" font-size="12.5" fill="#1A1B1E" text-anchor="end">困难 × 3 步</text>
  <rect x="360" y="524" width="100" height="14" fill="#999999"/>
  <line x1="560" y1="519" x2="760" y2="519" stroke="#D55E00" stroke-width="1.5"/>
  <line x1="560" y1="514" x2="560" y2="524" stroke="#D55E00" stroke-width="1.5"/>
  <line x1="760" y1="514" x2="760" y2="524" stroke="#D55E00" stroke-width="1.5"/>
  <text x="770" y="519" font-size="12" fill="#555">实际需要 4–8K，每步 2K 不足</text>

  <!-- dynamic allocation -->
  <text x="348" y="570" font-size="12.5" fill="#1A1B1E" text-anchor="end">动态：简单</text>
  <rect x="360" y="560" width="25" height="14" fill="#0072B2"/>
  <text x="393" y="571" font-size="12" fill="#555">每步 500</text>

  <text x="348" y="588" font-size="12.5" fill="#1A1B1E" text-anchor="end">动态：中等/困难</text>
  <rect x="360" y="578" width="100" height="14" fill="#0072B2"/>
  <rect x="360" y="578" width="300" height="14" fill="#D55E00"/>
  <text x="670" y="589" font-size="12" fill="#555">中等每步 2K · 困难每步 6K</text>

  <!-- footnote -->
  <text x="60" y="662" font-size="11" fill="#767676">数据：arXiv:2607.28573 实证与行业基准的综合推断示例（正文声明：实际效果取决于任务分布与实现质量）· 预算分配档位取自正文示例（总预算 16K）· 自估口径，非论文实测</text>
</svg>
