<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #8F93A6; }
      .rl { font-size: 15px; fill: #3E4457; }
      .val { font-size: 20px; font-weight: 700; }
      .b { font-size: 12px; fill: #A3A7B8; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F2F8"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C0392B"/><stop offset="1" stop-color="#E8785C"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9622B"/><stop offset="1" stop-color="#EFA06B"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F8A5B"/><stop offset="1" stop-color="#7CC493"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F7B8A"/><stop offset="1" stop-color="#5CB8C4"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C99327"/><stop offset="1" stop-color="#EBC55E"/>
    </linearGradient>
    <linearGradient id="gSlate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#44506B"/><stop offset="1" stop-color="#7B87A3"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1110" cy="100" r="130" fill="#0F7B8A" opacity="0.06"/>
  <circle cx="80" cy="615" r="120" fill="#C0392B" opacity="0.05"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gRed)"/>

  <text class="k" x="64" y="84">AI 范式雷达 · ARXIV:2607.28573</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#20242F">算力给错地方，失败更隐蔽</text>
  <text x="64" y="158" font-size="15" fill="#6A6E80">Agent 推理时扩展：从均匀预算转向按难度动态分配</text>

  <!-- subway signal motif -->
  <g>
    <rect x="1074" y="66" width="34" height="92" rx="14" fill="#44506B"/>
    <circle cx="1091" cy="90" r="10" fill="url(#gRed)"/>
    <circle cx="1091" cy="112" r="10" fill="#EBC55E" opacity="0.35"/>
    <circle cx="1091" cy="134" r="10" fill="#7CC493" opacity="0.35"/>
    <path d="M 1006 186 q 85 -34 170 0" fill="none" stroke="#44506B" stroke-width="3" opacity="0.5"/>
    <rect x="1010" y="176" width="34" height="16" rx="4" fill="url(#gTeal)"/>
    <text class="b" x="1091" y="216" text-anchor="middle">前方到站：动态调度</text>
  </g>

  <!-- subway line: uniform vs dynamic budget -->
  <g>
    <text class="rl" x="64" y="222" font-weight="700" fill="#20242F">同一趟 8 步任务 · 两种给电方式</text>

    <line x1="104" y1="266" x2="1096" y2="266" stroke="#B9BDCC" stroke-width="4" stroke-dasharray="1 9" stroke-linecap="round"/>
    <line x1="104" y1="388" x2="1096" y2="388" stroke="#B9BDCC" stroke-width="4" stroke-dasharray="1 9" stroke-linecap="round"/>
    <text class="b" x="104" y="308" fill="#8A6E1E">均匀供电 · 每步一律 2K</text>
    <text class="b" x="104" y="430" fill="#1F5A50">按难度供电 · 简单快步过</text>

    <!-- uniform cars: all same size -->
    <g>
      <rect x="140" y="246" width="60" height="40" rx="8" fill="url(#gGold)"/>
      <rect x="258" y="246" width="60" height="40" rx="8" fill="url(#gGold)"/>
      <rect x="376" y="246" width="60" height="40" rx="8" fill="url(#gGold)"/>
      <rect x="494" y="246" width="60" height="40" rx="8" fill="url(#gGold)"/>
      <rect x="612" y="246" width="60" height="40" rx="8" fill="url(#gGold)"/>
      <rect x="730" y="246" width="60" height="40" rx="8" fill="url(#gRed)"/>
      <text x="760" y="272" text-anchor="end" font-size="16" font-weight="700" fill="#FFFFFF">?</text>
      <rect x="848" y="246" width="60" height="40" rx="8" fill="url(#gRed)"/>
      <text x="878" y="272" text-anchor="end" font-size="16" font-weight="700" fill="#FFFFFF">?</text>
      <rect x="966" y="246" width="60" height="40" rx="8" fill="url(#gRed)"/>
      <text x="996" y="272" text-anchor="end" font-size="16" font-weight="700" fill="#FFFFFF">?</text>
    </g>

    <!-- dynamic cars: sized to difficulty -->
    <g>
      <rect x="140" y="368" width="24" height="40" rx="8" fill="url(#gTeal)"/>
      <rect x="200" y="368" width="24" height="40" rx="8" fill="url(#gTeal)"/>
      <rect x="260" y="368" width="24" height="40" rx="8" fill="url(#gTeal)"/>
      <rect x="320" y="368" width="66" height="40" rx="8" fill="url(#gGreen)"/>
      <rect x="422" y="368" width="66" height="40" rx="8" fill="url(#gGreen)"/>
      <rect x="524" y="368" width="152" height="40" rx="8" fill="url(#gOrange)"/>
      <rect x="712" y="368" width="152" height="40" rx="8" fill="url(#gOrange)"/>
      <rect x="900" y="368" width="152" height="40" rx="8" fill="url(#gOrange)"/>
    </g>

    <text class="b" x="1096" y="308" text-anchor="end">困难步骤 2K 不够用</text>
    <text class="b" x="1096" y="430" text-anchor="end">简单 &lt;500 · 中等 2K · 困难 2K–10K+</text>
  </g>

  <!-- big anchors -->
  <g>
    <text class="serif" x="64" y="536" font-size="46" font-weight="700" fill="#20242F">45% <tspan fill="#A9A9B8" font-size="24">→</tspan> <tspan fill="#C0392B">67%</tspan></text>
    <text class="b" x="64" y="558" fill="#6A6E80">示例工作流整体成功率 · 该文自测口径 · 效率另升约 35%</text>

    <line x1="560" y1="524" x2="810" y2="500" stroke="url(#gRed)" stroke-width="3.5"/>
    <circle cx="560" cy="524" r="7" fill="#FFFFFF" stroke="#44506B" stroke-width="3"/>
    <circle cx="810" cy="500" r="8" fill="url(#gRed)"/>
    <text class="val" x="546" y="530" text-anchor="end" fill="#44506B" font-size="17">停滞</text>
    <text class="val" x="824" y="506" fill="#C0392B" font-size="17">过早错误成功</text>
    <text class="b" x="560" y="558" fill="#C0392B">加算力不改成功率，只把失败挪位 · 前者可回退，后者不可逆</text>
  </g>

  <line x1="64" y1="588" x2="1136" y2="588" stroke="#E2E2EC"/>
  <text class="serif" x="64" y="620" font-size="19" fill="#20242F">问题不在算力不够多，而在分配方式不对。</text>
  <text class="b" x="64" y="650">ToT 74% 对 GPT-4 4% · o3 在 AIME 约 96% · 67% 等为综合推断示例 · Micropaper</text>
</svg>
