<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="1200" height="540" fill="#FFFFFF"/>
<text x="600" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#1F2937">生成-验证差距：内部循环的螺旋 与 Weaver 的加权计票机</text>
<g font-size="14">
<rect x="60" y="90" width="480" height="330" rx="12" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
<text x="300" y="122" text-anchor="middle" font-size="17" font-weight="700" fill="#7F1D1D">内部自我修正回路（无外部锚点）</text>
<rect x="100" y="146" width="190" height="54" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
<text x="195" y="178" text-anchor="middle" fill="#374151">生成候选输出</text>
<rect x="310" y="146" width="190" height="54" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
<text x="405" y="178" text-anchor="middle" fill="#374151">同一模型自我验证</text>
<defs><marker id="gv1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#C0392B"/></marker>
<marker id="gv2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2F6FB2"/></marker></defs>
<line x1="292" y1="173" x2="308" y2="173" stroke="#C0392B" stroke-width="2.2" marker-end="url(#gv1)"/>
<path d="M 405 202 Q 405 250 300 250 Q 195 250 195 204" fill="none" stroke="#C0392B" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#gv1)"/>
<text x="300" y="276" text-anchor="middle" font-size="13" fill="#7F1D1D">验证与生成共用同一套有偏通路</text>
<text x="300" y="316" text-anchor="middle" font-size="15" font-weight="700" fill="#C0392B">Misevolution：对错误输出的信心持续上升</text>
<text x="300" y="344" text-anchor="middle" font-size="13" fill="#374151">四条路径：模型 · 记忆 · 工具 · 工作流</text>
<text x="300" y="370" text-anchor="middle" font-size="12" fill="#6B7280">顶级模型（Gemini-2.5-Pro 亦被点名）不能幸免</text>
<rect x="660" y="90" width="480" height="330" rx="12" fill="#EAF2FB" stroke="#2F6FB2" stroke-width="2"/>
<text x="900" y="122" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">Weaver：多弱验证器加权集成</text>
<rect x="690" y="146" width="130" height="52" rx="8" fill="#FFFFFF" stroke="#2F6FB2" stroke-width="1.6"/>
<text x="755" y="170" text-anchor="middle" font-size="13" fill="#374151">弱验证器 A</text>
<text x="755" y="188" text-anchor="middle" font-size="12" fill="#6B7280">权重 w₁</text>
<rect x="835" y="146" width="130" height="52" rx="8" fill="#FFFFFF" stroke="#2F6FB2" stroke-width="1.6"/>
<text x="900" y="170" text-anchor="middle" font-size="13" fill="#374151">弱验证器 B</text>
<text x="900" y="188" text-anchor="middle" font-size="12" fill="#6B7280">权重 w₂</text>
<rect x="980" y="146" width="130" height="52" rx="8" fill="#FFFFFF" stroke="#2F6FB2" stroke-width="1.6"/>
<text x="1045" y="170" text-anchor="middle" font-size="13" fill="#374151">执行/Lean 类</text>
<text x="1045" y="188" text-anchor="middle" font-size="12" fill="#6B7280">权重 w₃</text>
<line x1="755" y1="200" x2="855" y2="252" stroke="#2F6FB2" stroke-width="2" marker-end="url(#gv2)"/>
<line x1="900" y1="200" x2="900" y2="250" stroke="#2F6FB2" stroke-width="2" marker-end="url(#gv2)"/>
<line x1="1045" y1="200" x2="945" y2="252" stroke="#2F6FB2" stroke-width="2" marker-end="url(#gv2)"/>
<rect x="740" y="254" width="320" height="58" rx="8" fill="#FFFFFF" stroke="#2F6FB2" stroke-width="2"/>
<text x="900" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">弱监督估计准确率 → 统一分数</text>
<text x="900" y="300" text-anchor="middle" font-size="12" fill="#6B7280">无需标注数据 · 数据集统计归一化并过滤劣质验证器</text>
<text x="900" y="348" text-anchor="middle" font-size="15" font-weight="700" fill="#2F6FB2">加权集成 ≫ 等权投票（验证器准确率差异大）</text>
<text x="900" y="376" text-anchor="middle" font-size="13" fill="#374151">场景：生成多候选 · 验一个 · 摘要口径达 o3-mini 级选答</text>
<text x="900" y="402" text-anchor="middle" font-size="13" fill="#374151">显著优于 Pass@1（取第一个候选）</text>
</g>
<text x="600" y="470" text-anchor="middle" font-size="15" fill="#374151">工程翻译：不需要全能裁判，需要一台会听意见的加权计票机</text>
<text x="600" y="500" text-anchor="middle" font-size="13" fill="#6B7280">文献：arXiv 2506.18203（Weaver）· arXiv 2509.26354（Misevolution, ICLR 2026）· arXiv 2608.12851（SkillMisevo-Bench）</text>
</svg>
