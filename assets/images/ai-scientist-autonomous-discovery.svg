<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">四项科研任务中 AI 耗时均短于人类，量级差距在数天到数月之间</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">四项任务耗时对比（对数轴，天）</text>

  <!-- gridlines: vertical majors at d = 0.1,1,10,100 ; x = 210 + 90*(log10(d)+1) -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="300" y1="126" x2="300" y2="420"/>
    <line x1="390" y1="126" x2="390" y2="420"/>
    <line x1="480" y1="126" x2="480" y2="420"/>
  </g>

  <!-- rows: y positions 150, 222, 294, 366 (row center) -->
  <!-- 文献综述 human 7-14d: x 460.4-492.6 ; AI 1/24-2/24d: x 223.6-233.2 -->
  <text x="198" y="154" font-size="12.5" fill="#1A1B1E" text-anchor="end">文献综述</text>
  <rect x="460.4" y="142" width="32.2" height="16" fill="#999999"/>
  <text x="500" y="154" font-size="12" fill="#555">1–2 周</text>
  <rect x="223.6" y="164" width="9.6" height="16" fill="#D55E00"/>
  <text x="240" y="176" font-size="12" fill="#555">1–2 小时</text>

  <!-- 实验设计 human 30-90d: x 640-710.8 ; AI 1-2d: x 390-421.8 -->
  <text x="198" y="226" font-size="12.5" fill="#1A1B1E" text-anchor="end">实验设计</text>
  <rect x="640" y="214" width="70.8" height="16" fill="#999999"/>
  <text x="718" y="226" font-size="12" fill="#555">1–3 个月</text>
  <rect x="390" y="236" width="31.8" height="16" fill="#D55E00"/>
  <text x="429" y="248" font-size="12" fill="#555">1–2 天</text>

  <!-- 数据分析 human 14-42d: x 492.6-578.4 ; AI 1-3d: x 390-453.6 -->
  <text x="198" y="298" font-size="12.5" fill="#1A1B1E" text-anchor="end">数据分析</text>
  <rect x="492.6" y="286" width="85.8" height="16" fill="#999999"/>
  <text x="586" y="298" font-size="12" fill="#555">2–6 周</text>
  <rect x="390" y="308" width="63.6" height="16" fill="#D55E00"/>
  <text x="461" y="320" font-size="12" fill="#555">1–3 天</text>

  <!-- 论文撰写 human 30-90d: x 640-710.8 ; AI 2-5d: x 421.8-510.2 -->
  <text x="198" y="370" font-size="12.5" fill="#1A1B1E" text-anchor="end">论文撰写</text>
  <rect x="640" y="358" width="70.8" height="16" fill="#999999"/>
  <text x="718" y="370" font-size="12" fill="#555">1–3 个月</text>
  <rect x="421.8" y="380" width="88.4" height="16" fill="#D55E00"/>
  <text x="518" y="392" font-size="12" fill="#555">2–5 天</text>

  <!-- legend (序列 2 项但行内双条，仍需图例区分口径) -->
  <g font-size="12" fill="#555">
    <rect x="860" y="120" width="12" height="10" fill="#999999"/>
    <text x="877" y="129">人类</text>
    <rect x="860" y="140" width="12" height="10" fill="#D55E00"/>
    <text x="877" y="149">AI</text>
  </g>

  <!-- value axis (log10 scale) -->
  <line x1="210" y1="420" x2="810" y2="420" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="210" y1="420" x2="210" y2="424"/>
    <line x1="300" y1="420" x2="300" y2="424"/>
    <line x1="390" y1="420" x2="390" y2="424"/>
    <line x1="480" y1="420" x2="480" y2="424"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="440">1</text>
    <text x="390" y="440">10</text>
    <text x="480" y="440">100</text>
  </g>
  <text x="510" y="464" font-size="14" fill="#1A1B1E" text-anchor="middle">耗时（天，对数刻度）</text>

  <!-- ============ panel b ============ -->
  <text x="880" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="902" y="104" font-size="15" fill="#1A1B1E">未来 10 年的模式演进（论文预测）</text>

  <!-- timeline axis: sequence-position axis (mechanism schematic) -->
  <line x1="910" y1="170" x2="910" y2="430" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="906" y1="200" x2="910" y2="200"/>
    <line x1="906" y1="290" x2="910" y2="290"/>
    <line x1="906" y1="380" x2="910" y2="380"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="900" y="204">1–2 年</text>
    <text x="900" y="294">3–5 年</text>
    <text x="900" y="384">5–10 年</text>
  </g>

  <!-- stage 1: human-AI collaboration -->
  <circle cx="946" cy="200" r="5" fill="#D55E00"/>
  <text x="962" y="196" font-size="12.5" fill="#1A1B1E">人机协作成为主流</text>
  <text x="962" y="212" font-size="12" fill="#555">人类定方向与伦理边界，</text>
  <text x="962" y="227" font-size="12" fill="#555">AI 处理数据、生成假设</text>

  <!-- stage 2: division of labor -->
  <circle cx="946" cy="290" r="5" fill="#D55E00"/>
  <text x="962" y="286" font-size="12.5" fill="#1A1B1E">分工深化</text>
  <text x="962" y="302" font-size="12" fill="#555">AI 自主处理常规研究，</text>
  <text x="962" y="317" font-size="12" fill="#555">人类专注突破性探索</text>

  <!-- stage 3: domain-autonomous -->
  <circle cx="946" cy="380" r="5" fill="#D55E00"/>
  <text x="962" y="376" font-size="12.5" fill="#1A1B1E">特定领域自主发现</text>
  <text x="962" y="392" font-size="12" fill="#555">AI 可能在特定领域实现</text>
  <text x="962" y="407" font-size="12" fill="#555">完全自主发现</text>

  <!-- footnote (two lines) -->
  <text x="60" y="596" font-size="11" fill="#767676">数据：Nature（s41586-026-10265-5，伦敦国王学院与卡尔斯鲁厄理工学院，2026 年 3 月 25 日发布）· 任务耗时与阶段预测均为论文自测与自述口径，</text>
  <text x="60" y="614" font-size="11" fill="#767676">区间端点换算为天数绘制于对数轴（1 周按 7 天、1 月按 30 天、1 小时按 1/24 天）· 重复实验（人类数周、AI 数小时）因无数值未入图</text>
</svg>
