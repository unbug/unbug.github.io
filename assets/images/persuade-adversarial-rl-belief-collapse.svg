<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #A6916E; }
      .rl { font-size: 15px; fill: #453B48; }
      .val { font-size: 20px; font-weight: 700; }
      .b { font-size: 12px; fill: #AE9F8B; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FAF3EC"/>
    </linearGradient>
    <linearGradient id="gWine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C2F39"/><stop offset="1" stop-color="#C25B54"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8862B"/><stop offset="1" stop-color="#E7C264"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E7D74"/><stop offset="1" stop-color="#71B5A8"/>
    </linearGradient>
    <linearGradient id="gPlum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5E4A8C"/><stop offset="1" stop-color="#907BB8"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9622B"/><stop offset="1" stop-color="#EFA06B"/>
    </linearGradient>
    <linearGradient id="gCurtain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8C2F39"/><stop offset="1" stop-color="#B04A48"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1100" cy="608" r="140" fill="#8C2F39" opacity="0.06"/>
  <circle cx="78" cy="96" r="110" fill="#B8862B" opacity="0.06"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gWine)"/>

  <text class="k" x="64" y="84">一分钟读论文 · 2026-08-23 · ARXIV:2608.11624 · UIUC · 单轮威胁模型</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">一句台词，改了终场</text>
  <text x="64" y="158" font-size="15" fill="#6E5F52">Persuader 只发一条事实错误的论证，Persuadee 随即重答 · TruthfulQA 准确率塌缩</text>

  <!-- theater motif: curtain + masks -->
  <g>
    <path d="M 1012 74 q 0 56 14 84 q 6 -40 0 -84 z" fill="url(#gCurtain)" opacity="0.85"/>
    <path d="M 1040 74 q 0 66 16 96 q 8 -46 2 -96 z" fill="url(#gCurtain)" opacity="0.7"/>
    <path d="M 1092 74 q 0 66 -16 96 q -8 -46 -2 -96 z" fill="url(#gGold)" opacity="0.75"/>
    <path d="M 1120 74 q 0 56 -14 84 q -6 -40 0 -84 z" fill="url(#gGold)" opacity="0.6"/>
    <line x1="1004" y1="74" x2="1136" y2="74" stroke="#453B48" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1068" cy="116" r="26" fill="url(#gTeal)"/>
    <path d="M 1054 112 q 4 4 10 0 m 12 0 q 4 4 10 0" stroke="#F7F2E8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 1056 128 q 12 10 24 0" stroke="#F7F2E8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="1106" cy="140" r="22" fill="url(#gOrange)"/>
    <path d="M 1094 134 q 4 4 9 0 m 11 0 q 4 4 9 0" stroke="#F7F2E8" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 1096 152 q 10 -8 20 0" stroke="#F7F2E8" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <text x="1072" y="200" text-anchor="middle" font-size="12" fill="#5E4A8C">一条错误论证，就是一次改终场</text>
  </g>

  <!-- left: slope 66.2 -> 44.8 -> 1.8 -->
  <g>
    <text class="rl" x="64" y="226" font-weight="700">TruthfulQA 准确率：一条消息就塌</text>
    <text class="b" x="64" y="248">Persuadee = Qwen-2.5-7B-Instruct · 五种子均值</text>

    <g>
      <line x1="180" y1="415" x2="442" y2="415" stroke="#E2D8C2"/>
      <text class="b" x="180" y="436">未受攻击</text>
      <text class="b" x="311" y="436" text-anchor="middle">未训练 Persuader</text>
      <text class="b" x="442" y="436" text-anchor="middle">GRPO 训练后</text>

      <line x1="180" y1="296" x2="311" y2="403" stroke="url(#gGold)" stroke-width="3.5"/>
      <line x1="311" y1="403" x2="442" y2="412" stroke="url(#gWine)" stroke-width="4"/>
      <circle cx="180" cy="296" r="9" fill="url(#gTeal)"/>
      <circle cx="311" cy="403" r="8" fill="url(#gGold)"/>
      <circle cx="442" cy="412" r="10" fill="url(#gWine)"/>
      <text class="val" x="180" y="272" text-anchor="middle" fill="#2E7D74">66.2%</text>
      <text class="val" x="311" y="381" text-anchor="middle" fill="#9A6F1E">44.8%</text>
      <text class="val" x="452" y="390" fill="#8C2F39">1.8%</text>
      <text class="b" x="452" y="370" fill="#8C2F39" font-weight="700">降幅 64.4 个百分点</text>
    </g>

    <g>
      <rect x="64" y="468" width="130" height="30" rx="4" fill="#2E7D74" opacity="0.14"/>
      <text x="129" y="488" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D74">基线 66.2%</text>
      <text x="206" y="488" fill="#8B7F6C" font-size="15">→</text>
      <rect x="226" y="468" width="150" height="30" rx="4" fill="#8C2F39" opacity="0.14"/>
      <text x="301" y="488" text-anchor="middle" font-size="13" font-weight="700" fill="#8C2F39">PSR 93.7% / ASR 97.3%</text>
      <text class="b" x="64" y="524">PSR：改到指定错误项 · ASR：放弃正确项即算</text>
      <text class="b" x="64" y="544">训练 2,886 实例 × 3 epoch · 6 块 H100 约 5.5 小时</text>
    </g>
  </g>

  <!-- right: transfer bars + closed-source + defense -->
  <g>
    <text class="rl" x="620" y="226" font-weight="700">策略跨模型迁移 · TruthfulQA PSR</text>
    <rect x="620" y="242" width="516" height="34" fill="#5E4A8C" opacity="0.08"/>
    <rect x="620" y="282" width="516" height="34" fill="#5E4A8C" opacity="0.08"/>
    <rect x="620" y="322" width="516" height="34" fill="#5E4A8C" opacity="0.08"/>

    <text class="rl" x="742" y="265" text-anchor="end">Qwen-14B</text>
    <rect x="756" y="251" width="305" height="14" rx="7" fill="url(#gTeal)"/>
    <text class="val" x="1070" y="267" fill="#2E7D74">82.5%</text>

    <text class="rl" x="742" y="305" text-anchor="end">Llama-3.1-8B</text>
    <rect x="756" y="291" width="292" height="14" rx="7" fill="url(#gOrange)"/>
    <text class="val" x="1057" y="307" fill="#C2521E">79.0%</text>

    <text class="rl" x="742" y="345" text-anchor="end">DeepSeek-R1 7B</text>
    <rect x="756" y="331" width="225" height="14" rx="7" fill="url(#gPlum)" opacity="0.9"/>
    <text class="val" x="990" y="347" fill="#5E4A8C">61%</text>
    <text class="b" x="756" y="376">同一 RL Persuader 固定 · TruthfulQA 口径 · 轴 0–100%</text>

    <line x1="620" y1="398" x2="1136" y2="398" stroke="#E2D8C2"/>

    <text class="rl" x="620" y="436" font-weight="700">闭源更抗打，防御仍不充分</text>
    <text class="val" x="620" y="474" fill="#2E7D74">16%</text>
    <text class="b" x="666" y="470">GPT-4o-mini 均值 PSR</text>
    <text class="val" x="860" y="474" fill="#2E7D74">3%</text>
    <text class="b" x="894" y="470">GPT-5-mini</text>
    <text class="val" x="1020" y="474" fill="#8C2F39">60%</text>
    <text class="b" x="1066" y="470" fill="#8C2F39">PBT-8B 专训仍中招</text>
    <text class="b" x="620" y="502">目标正确时纠正率约 95% 及以上 · 学到的是通用说服策略</text>
    <text class="b" x="620" y="524" fill="#8C2F39">直接攻 GPT-4o-mini 几乎无效（约 0.5%）· 课程续训后 PSR 24.6%→37.9%</text>
  </g>

  <line x1="64" y1="556" x2="1136" y2="556" stroke="#E5DCC6"/>
  <text x="64" y="590" font-size="15.5" fill="#453B48">全为单轮、选择题 QA；长程协作、工具使用与开放生成未验证。</text>
  <text class="b" x="64" y="620">Persuader 均为中小开源模型（Qwen 1.5B–14B、Llama-8B）· 不可外推为前沿模型绝对安全 · Micropaper</text>
</svg>
