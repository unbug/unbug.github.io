    <text x="1018" y="285">观察整合</text>
    <circle cx="1000" cy="340" r="7" fill="#0072B2"/>
    <text x="1018" y="345">最终答案</text>
  </g>
  <path d="M 1150 160 L 1166 160 L 1166 340 L 1156 340" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="1018" y="188" font-size="12" fill="#555">扩展到数十轮推理步骤</text>
  <text x="1018" y="204" font-size="12" fill="#555">和数百次搜索引擎交互</text>
  <text x="980" y="392" font-size="12" fill="#555">推理 → 工具调用 →</text>
  <text x="980" y="408" font-size="12" fill="#555">观察整合 → 下一步推理</text>
  <text x="980" y="424" font-size="12" fill="#555">→ … → 最终答案</text>
  <text x="980" y="446" font-size="12" fill="#555">训练：冷启动监督</text>
  <text x="980" y="462" font-size="12" fill="#555">训练 + 强化学习训练</text>

  <!-- footnote -->
  <text x="60" y="640" font-size="11" fill="#767676">数据：arXiv:2601.22060 与 arXiv:2602.02185（VDR-Bench）· 六个基准为 VDR、FVQA、MMSearch+、MMSearch、LiveVQA、BC-VL，取表中"平均"列 · 论文自测口径，未报告误差区间，未画误差棒 · b 面板为序列位置轴</text>
