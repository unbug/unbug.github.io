<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">2026 年 4 至 6 月三件 RAG 评测专利公开；验收标准从检索命中率转向拒答与置信度</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">三件已公开申请（审查中）：公开日期（月内按日定位）</text>

  <!-- scale: month=240px; 2026-04=200, 05=440, 06=680, 07=920; day=8px -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="200" y1="126" x2="200" y2="330"/>
    <line x1="440" y1="126" x2="440" y2="330"/>
    <line x1="680" y1="126" x2="680" y2="330"/>
    <line x1="920" y1="126" x2="920" y2="330"/>
  </g>

  <!-- GM 2026-04-02: x = 200 + 8*1 = 208 -->
  <circle cx="208" cy="160" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <text x="208" y="142" font-size="12" fill="#1A1B1E" text-anchor="middle">2026-04-02 公开</text>
  <text x="222" y="176" font-size="12" fill="#555">GM · US20260093735A1 — 多路取回 + 置信分数，低分不直接出口</text>

  <!-- SAP 2026-04-23: x = 200 + 8*22 = 376 -->
  <circle cx="376" cy="232" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <text x="376" y="214" font-size="12" fill="#1A1B1E" text-anchor="middle">2026-04-23 公开</text>
  <text x="390" y="248" font-size="12" fill="#555">SAP · US20260111331A1 — 测试集迭代跑评估，达标才放行</text>

  <!-- Salesforce 2026-06-18: x = 680 + 8*17 = 816 -->
  <circle cx="816" cy="160" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <text x="816" y="142" font-size="12" fill="#1A1B1E" text-anchor="middle">2026-06-18 公开</text>
  <text x="816" y="184" font-size="12" fill="#555" text-anchor="middle">Salesforce · US20260170067A1</text>
  <text x="816" y="200" font-size="12" fill="#555" text-anchor="middle">合成「不可回答」请求数据集</text>
  <text x="816" y="216" font-size="12" fill="#555" text-anchor="middle">评测六类问题（指令含糊、错误前提、超库范围等）</text>

  <!-- value axis -->
  <line x1="200" y1="330" x2="920" y2="330" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="200" y1="330" x2="200" y2="334"/>
    <line x1="440" y1="330" x2="440" y2="334"/>
    <line x1="680" y1="330" x2="680" y2="334"/>
    <line x1="920" y1="330" x2="920" y2="334"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="200" y="354">4 月</text>
    <text x="440" y="354">5 月</text>
    <text x="680" y="354">6 月</text>
    <text x="920" y="354">7 月</text>
  </g>
  <text x="560" y="380" font-size="14" fill="#1A1B1E" text-anchor="middle">公开日期（2026 年）</text>

  <!-- side note -->
  <text x="60" y="418" font-size="12" fill="#555">空心 = 已公开申请（审查中），不是授权专利；国际分类集中在 G06F16/953（检索）与 G06N3（机器学习）。</text>
  <text x="60" y="436" font-size="12" fill="#555">专利主张的是拒答题数据集的合成方法与放行阈值——恰是 RAGAS、TruLens 等通用评测库留下的空白；</text>
  <text x="60" y="454" font-size="12" fill="#555">2026-05 的 EnterpriseRAG-Bench 基准论文同样把「应识别为不可回答」列为核心考点。</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="508" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="508" font-size="15" fill="#1A1B1E">正文自估金额区间（元，区间直标，不设公共刻度）</text>

  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="240" y="549">交付前质检 / 次</text>
    <text x="240" y="589">回归巡检订阅 / 知识库·月</text>
  </g>

  <rect x="252" y="535" width="250" height="18" fill="#0072B2"/>
  <line x1="252" y1="532" x2="252" y2="556" stroke="#0072B2" stroke-width="0.75"/>
  <line x1="502" y1="532" x2="502" y2="556" stroke="#0072B2" stroke-width="0.75"/>
  <text x="512" y="549" font-size="12" fill="#555">3000–8000 元（拒答测试集 + 质检报告）</text>

  <rect x="252" y="575" width="40" height="18" fill="#0072B2"/>
  <line x1="252" y1="572" x2="252" y2="596" stroke="#0072B2" stroke-width="0.75"/>
  <line x1="292" y1="572" x2="292" y2="596" stroke="#0072B2" stroke-width="0.75"/>
  <text x="302" y="589" font-size="12" fill="#555">$19–49 / 月（知识库每次更新后自动重跑题集打分）</text>

  <text x="640" y="549" font-size="12" fill="#555">工具侧（正文）：Python + 任一 LLM API + SQLite，无需训练模型；</text>
  <text x="640" y="567" font-size="12" fill="#555">月成本数百元，1 人 4 周出 MVP。</text>

  <!-- footnote -->
  <text x="60" y="648" font-size="11" fill="#767676">数据：FreePatentsOnline 三件已公开申请核验（均非授权专利）· 定价为正文自估口径，非市场实测，不构成投资建议</text>
</svg>
