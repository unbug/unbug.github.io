<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #A29880; }
      .b { font-size: 12px; fill: #8A7A5E; }
      .ev { font-size: 13px; font-weight: 700; fill: #26201A; }
      .evs { font-size: 12px; fill: #5E5546; }
      .stat { font-size: 30px; font-weight: 700; fill: #26201A; }
      .unit { font-size: 14px; fill: #5E5546; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/><stop offset="1" stop-color="#FBF6EA"/>
    </linearGradient>
    <linearGradient id="axis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A5230"/><stop offset="1" stop-color="#C19A49"/>
    </linearGradient>
    <linearGradient id="mallet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A5230"/><stop offset="1" stop-color="#A5764A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1110" cy="600" r="130" fill="#C19A49" opacity="0.07"/>
  <circle cx="80" cy="120" r="110" fill="#963D46" opacity="0.05"/>
  <rect x="64" y="44" width="44" height="5" fill="#963D46"/>

  <text class="k" x="64" y="84">AI 智创简报 · 专利情报速读 · RAG 质量评测</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">大厂竞拍拒答判定</text>
  <text x="64" y="158" font-size="15.5" fill="#5E5546">2026 年 4 至 6 月，三件「该不该作答」专利公开：答对给分，硬答扣分</text>

  <!-- auction mallet motif: hammering the answer closed -->
  <g>
    <rect x="1004" y="104" width="52" height="24" rx="6" fill="url(#mallet)"/>
    <rect x="1050" y="112" width="66" height="11" rx="5.5" fill="#963D46" transform="rotate(24 1050 112)"/>
    <path d="M 1000 176 h 92 l -7 16 h -78 z" fill="#7A5230"/>
    <rect x="996" y="192" width="100" height="10" rx="5" fill="#C19A49"/>
    <circle cx="1010" cy="150" r="4" fill="#963D46" opacity="0.6"/>
    <circle cx="1104" cy="146" r="3" fill="#C19A49" opacity="0.7"/>
  </g>

  <!-- patent timeline: 04-02=150, 04-23=338, 06-18=830 (per day ~3.14) -->
  <line x1="150" y1="316" x2="830" y2="316" stroke="url(#axis)" stroke-width="4" stroke-linecap="round"/>
  <text class="b" x="150" y="342">04-02</text>
  <text class="b" x="830" y="342" text-anchor="end">06-18</text>

  <g>
    <circle cx="150" cy="316" r="10" fill="#FFFFFF" stroke="#7A5230" stroke-width="3.5"/>
    <line x1="150" y1="304" x2="150" y2="276" stroke="#A29880"/>
    <text class="ev" x="150" y="254">04-02 · 通用汽车</text>
    <text class="evs" x="150" y="274">置信分数低，不直接出口</text>

    <circle cx="338" cy="316" r="10" fill="#FFFFFF" stroke="#7A5230" stroke-width="3.5"/>
    <line x1="338" y1="328" x2="338" y2="356" stroke="#A29880"/>
    <text class="ev" x="338" y="382">04-23 · SAP</text>
    <text class="evs" x="338" y="402">过评测阈值才放行</text>

    <circle cx="830" cy="316" r="10" fill="#963D46"/>
    <line x1="830" y1="304" x2="830" y2="276" stroke="#A29880"/>
    <text class="ev" x="830" y="254" text-anchor="end">06-18 · Salesforce</text>
    <text class="evs" x="830" y="274" text-anchor="end">合成六类不可回答题</text>
  </g>
  <g>
    <circle cx="150" cy="430" r="6" fill="#FFFFFF" stroke="#7A5230" stroke-width="2.5"/><text class="b" x="162" y="435">公开申请（审查中）</text>
    <rect x="330" y="408" width="420" height="44" rx="9" fill="#963D46" opacity="0.08"/>
    <rect x="330" y="408" width="5" height="44" rx="2.5" fill="#963D46"/>
    <text x="352" y="428" font-size="13" font-weight="700" fill="#963D46">空白不在打分，在造题</text>
    <text x="352" y="445" font-size="12.5" fill="#5E5546">RAGAS / TruLens 已把忠实度打分做成商品</text>
  </g>

  <!-- opportunity cards -->
  <g>
    <rect x="64" y="482" width="352" height="142" rx="16" fill="#963D46" opacity="0.08"/>
    <rect x="64" y="482" width="352" height="6" rx="3" fill="#963D46"/>
    <path d="M 92 516 h 40 v 26 l -8 -7 h -32 z" fill="#963D46"/>
    <text class="stat" x="92" y="578">3000-8000 元</text>
    <text class="evs" x="92" y="604">单次交付前质检服务</text>

    <rect x="440" y="482" width="352" height="142" rx="16" fill="#C19A49" opacity="0.12"/>
    <rect x="440" y="482" width="352" height="6" rx="3" fill="#C19A49"/>
    <circle cx="470" cy="522" r="15" fill="#C19A49"/>
    <path d="M 462 522 a 8 8 0 0 1 16 0" stroke="#FFFDF7" stroke-width="3" fill="none"/>
    <text class="stat" x="496" y="578">$19-49<tspan class="unit"> /库·月</tspan></text>
    <text class="evs" x="468" y="604">知识库更新后自动重跑题集</text>

    <rect x="816" y="482" width="320" height="142" rx="16" fill="#7A5230" opacity="0.09"/>
    <rect x="816" y="482" width="320" height="6" rx="3" fill="#7A5230"/>
    <rect x="844" y="508" width="34" height="30" rx="5" fill="#7A5230"/>
    <line x1="852" y1="518" x2="870" y2="518" stroke="#FBF6EA" stroke-width="3"/>
    <line x1="852" y1="528" x2="864" y2="528" stroke="#FBF6EA" stroke-width="3"/>
    <text class="stat" x="892" y="578">50 道</text>
    <text class="evs" x="844" y="604">今天起：库里没有答案的题</text>
  </g>

  <text class="b" x="64" y="660">三件均为已公开申请（审查中），非授权专利 · 分类集中在 G06F16/953 与 G06N3 · Micropaper</text>
</svg>
