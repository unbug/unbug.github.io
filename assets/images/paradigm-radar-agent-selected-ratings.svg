<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <rect width="960" height="560" fill="#f4f7fb"/>
  <text x="480" y="46" fill="#1e3a5f" font-size="26" text-anchor="middle" font-weight="bold">agent.reviews 评分样本：分数、评价数与任务完成率</text>
  <text x="480" y="76" fill="#6b7f96" font-size="16" text-anchor="middle">2026-10-14 页面自述文字实测；评分衡量「Agent 接入摩擦」，官方声明不可用于选型排名</text>

  <!-- bar chart: score out of 5, scale 100px per point from baseline y=430, x start 300 -->
  <g font-size="16">
    <line x1="300" y1="105" x2="300" y2="440" stroke="#a9bdd8" stroke-width="1.5"/>
    <g stroke="#dde6f0" stroke-width="1">
      <line x1="300" y1="430" x2="880" y2="430"/><line x1="400" y1="105" x2="400" y2="440"/>
      <line x1="500" y1="105" x2="500" y2="440"/><line x1="600" y1="105" x2="600" y2="440"/>
      <line x1="700" y1="105" x2="700" y2="440"/><line x1="800" y1="105" x2="800" y2="440"/>
    </g>
    <g fill="#93a7bc" font-size="13" text-anchor="middle">
      <text x="300" y="462">0</text><text x="400" y="462">1</text><text x="500" y="462">2</text>
      <text x="600" y="462">3</text><text x="700" y="462">4</text><text x="800" y="462">5</text>
    </g>

    <!-- tools (blue) -->
    <g>
      <text x="290" y="128" fill="#1e3a5f" text-anchor="end" font-weight="bold">Git</text>
      <rect x="300" y="110" width="470" height="24" rx="4" fill="#2f6fb2"/>
      <text x="778" y="128" fill="#41627f">4.7（20,060 评）</text>

      <text x="290" y="173" fill="#1e3a5f" text-anchor="end" font-weight="bold">uv</text>
      <rect x="300" y="155" width="470" height="24" rx="4" fill="#2f6fb2"/>
      <text x="778" y="173" fill="#41627f">4.7（1,279 评 · 99% 完成）</text>

      <text x="290" y="218" fill="#1e3a5f" text-anchor="end" font-weight="bold">npm</text>
      <rect x="300" y="200" width="450" height="24" rx="4" fill="#2f6fb2"/>
      <text x="758" y="218" fill="#41627f">4.5（11,648 评）</text>

      <!-- suspicion pair -->
      <text x="290" y="263" fill="#8a4a24" text-anchor="end" font-weight="bold">cryptography</text>
      <rect x="300" y="245" width="460" height="24" rx="4" fill="#c96b3c"/>
      <text x="768" y="263" fill="#8a4a24">4.6（仅 71 评）</text>

      <text x="290" y="308" fill="#8a4a24" text-anchor="end" font-weight="bold">yaml</text>
      <rect x="300" y="290" width="460" height="24" rx="4" fill="#c96b3c"/>
      <text x="768" y="308" fill="#8a4a24">4.6（仅 78 评）— 同分引发「按曲线打分」质疑</text>
    </g>

    <!-- agents (grey-blue) -->
    <g>
      <text x="290" y="363" fill="#1e3a5f" text-anchor="end" font-weight="bold">Codex</text>
      <rect x="300" y="345" width="410" height="24" rx="4" fill="#5c85ad"/>
      <text x="718" y="363" fill="#41627f">4.1（84% 完成率）</text>

      <text x="290" y="408" fill="#1e3a5f" text-anchor="end" font-weight="bold">Claude Code</text>
      <rect x="300" y="390" width="390" height="24" rx="4" fill="#5c85ad"/>
      <text x="698" y="408" fill="#41627f">3.9（64% 完成率）</text>

      <text x="290" y="448" fill="#1e3a5f" text-anchor="end" font-weight="bold">Cursor</text>
      <rect x="300" y="430" width="370" height="24" rx="4" fill="#5c85ad"/>
      <text x="678" y="448" fill="#41627f">3.7（47% 完成率）</text>
    </g>
  </g>

  <text x="480" y="505" fill="#41627f" font-size="16" text-anchor="middle">Coding Agent 类目六个工具互评——「被 Agent 评价」已反身作用于 Agent 本身；橙色为评分区分度疑点。</text>
  <text x="480" y="534" fill="#93a7bc" font-size="14" text-anchor="middle">口径：agent.reviews 页面自述文字（2026-10-14 实测），厂商自述数据，可复算不可背书</text>
</svg>
