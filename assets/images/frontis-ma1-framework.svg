<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9C9484; }
      .rl { font-size: 15px; fill: #474C54; }
      .val { font-size: 18px; font-weight: 700; fill: #1A1B1E; }
      .b { font-size: 12px; fill: #A5A296; }
      .chip { font-size: 12.5px; font-weight: 600; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F7F2EC"/>
    </linearGradient>
    <linearGradient id="gEmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C2491D"/><stop offset="1" stop-color="#E37C45"/>
    </linearGradient>
    <linearGradient id="gSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3C5A6E"/><stop offset="1" stop-color="#6E8CA0"/>
    </linearGradient>
    <linearGradient id="gBrass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8860B"/><stop offset="1" stop-color="#DCB24A"/>
    </linearGradient>
    <linearGradient id="gViridian" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E7D6B"/><stop offset="1" stop-color="#68B39D"/>
    </linearGradient>
    <linearGradient id="gPlum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7D3C6B"/><stop offset="1" stop-color="#AE6E9C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1105" cy="110" r="140" fill="#C2491D" opacity="0.06"/>
  <circle cx="70" cy="620" r="115" fill="#2E7D6B" opacity="0.06"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gEmber)"/>

  <text class="k" x="64" y="84">一分钟读论文 · ARXIV:2607.28568 · HORIZON RESEARCH / FRONTIS.AI / 清华</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">35B 自造流水线</text>
  <text x="64" y="158" font-size="15" fill="#5B6068">OpenMLE：Gym 出题 · RL 练兵 · Evo 淬火，四个原子算子循环锻造模型</text>

  <!-- foundry motif: furnace + gear -->
  <g>
    <rect x="1024" y="92" width="72" height="62" rx="6" fill="url(#gSteel)"/>
    <path d="M 1040 154 L 1040 120 Q 1060 98 1080 120 L 1080 154 Z" fill="#F4E3C8"/>
    <path d="M 1050 154 Q 1060 112 1070 154 Z" fill="url(#gEmber)"/>
    <path d="M 1054 154 Q 1060 126 1066 154 Z" fill="#F2B02C"/>
    <rect x="1016" y="154" width="88" height="10" rx="3" fill="#3C5A6E"/>
    <g transform="translate(1128 96)">
      <circle r="22" fill="none" stroke="url(#gBrass)" stroke-width="8" stroke-dasharray="8 6.2"/>
      <circle r="9" fill="none" stroke="#B8860B" stroke-width="4"/>
    </g>
  </g>

  <!-- ladder bars: medal average -->
  <g>
    <rect x="64" y="200" width="660" height="60" fill="#3C5A6E" opacity="0.07"/>
    <rect x="64" y="272" width="660" height="60" fill="#3C5A6E" opacity="0.07"/>
    <rect x="64" y="344" width="660" height="60" fill="#C2491D" opacity="0.07"/>

    <text class="rl" x="230" y="236" text-anchor="end">基座模型</text>
    <rect x="286" y="220" width="255.9" height="20" rx="4" fill="url(#gSteel)"/>
    <text class="val" x="554" y="237" fill="#3C5A6E">39.39%</text>

    <text class="rl" x="230" y="308" text-anchor="end">MA1（SFT+RL）</text>
    <rect x="286" y="292" width="393.5" height="20" rx="4" fill="url(#gViridian)"/>
    <text class="val" x="692" y="309" fill="#2E7D6B">60.61%</text>

    <text class="rl" x="230" y="380" text-anchor="end">+ Evo-Max 搜索</text>
    <rect x="286" y="364" width="462.3" height="20" rx="4" fill="url(#gEmber)"/>
    <text class="val" x="760" y="381" fill="#C2491D">71.21%</text>

    <text class="b" x="286" y="432">MLE-Bench Lite · Medal Average · 单卡 RTX 4090 + 12 小时/任务</text>
    <text class="b" x="286" y="452" fill="#C2491D">已超越 GPT-5.5 + Codex 组合，接近 GPT-5.6 Sol 与 Kimi K3</text>
  </g>

  <!-- right column -->
  <g>
    <rect x="836" y="200" width="304" height="88" rx="12" fill="#B8860B" opacity="0.1"/>
    <text class="serif" x="856" y="248" font-size="30" font-weight="700" fill="#8A6612">0.8126</text>
    <text x="988" y="248" font-size="15" fill="#474C54">Human Rank</text>
    <text x="856" y="272" font-size="12.5" fill="#6B7078">Evo-Max 档 · 接近人类专家水平的 81%</text>

    <text class="rl" x="856" y="336">NatureBench Lite 迁移 · Match-SOTA</text>
    <rect x="856" y="352" width="130" height="26" rx="13" fill="url(#gViridian)" opacity="0.85"/>
    <text x="921" y="370" text-anchor="middle" class="chip" fill="#FFFFFF">模型 +20%</text>
    <rect x="1000" y="352" width="130" height="26" rx="13" fill="url(#gPlum)" opacity="0.85"/>
    <text x="1065" y="370" text-anchor="middle" class="chip" fill="#F2E4EE">搜索 +30%</text>
    <text class="b" x="856" y="402">两个正交组件，互补而非替代</text>
  </g>

  <!-- bottom: closed loop + four operators -->
  <line x1="64" y1="480" x2="1136" y2="480" stroke="#E8E3D2"/>
  <g>
    <rect x="64" y="500" width="86" height="28" rx="14" fill="url(#gSteel)" opacity="0.2"/>
    <text x="107" y="519" text-anchor="middle" class="chip" fill="#2C4557">Gym 出题</text>
    <text x="158" y="519" fill="#8B8574" font-size="14">→</text>
    <rect x="176" y="500" width="86" height="28" rx="14" fill="url(#gViridian)" opacity="0.22"/>
    <text x="219" y="519" text-anchor="middle" class="chip" fill="#20604F">RL 练兵</text>
    <text x="270" y="519" fill="#8B8574" font-size="14">→</text>
    <rect x="288" y="500" width="86" height="28" rx="14" fill="url(#gEmber)" opacity="0.22"/>
    <text x="331" y="519" text-anchor="middle" class="chip" fill="#8F3413">Evo 淬火</text>
    <text x="382" y="519" fill="#8B8574" font-size="14">↺</text>
    <text class="b" x="404" y="519">三组件闭环 = 执行-评估-改进自循环</text>

    <rect x="700" y="500" width="88" height="28" rx="14" fill="url(#gBrass)" opacity="0.3"/>
    <text x="744" y="519" text-anchor="middle" class="chip" fill="#7A5A0A">Draft 起草</text>
    <rect x="798" y="500" width="100" height="28" rx="14" fill="url(#gBrass)" opacity="0.3"/>
    <text x="848" y="519" text-anchor="middle" class="chip" fill="#7A5A0A">Improve 改进</text>
    <rect x="908" y="500" width="88" height="28" rx="14" fill="url(#gBrass)" opacity="0.3"/>
    <text x="952" y="519" text-anchor="middle" class="chip" fill="#7A5A0A">Debug 调试</text>
    <rect x="1006" y="500" width="112" height="28" rx="14" fill="url(#gBrass)" opacity="0.3"/>
    <text x="1062" y="519" text-anchor="middle" class="chip" fill="#7A5A0A">Crossover 交叉</text>
  </g>
  <text class="serif" x="64" y="576" font-size="18" fill="#1A1B1E">把 ML 工程拆成四个可组合算子，AI 才能自己改进造 AI 的过程。</text>
  <text class="b" x="1136" y="576" text-anchor="end">代码/权重/数据集全开源 · 预印本未经同行评审 · Micropaper</text>
</svg>
