<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#F0F0F0"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#009E73">ReSU 以人脑约 20W 能效为参照，两层网络即重现果蝇 L1/L2/L3 时间滤波器与 T4 方向选择性，训练无需反向传播与标注数据</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#009E73">a</text>
  <text x="82" y="104" font-size="15" fill="#009E73">ReSU 单元三步工作流（论文机制描述，DEGRADED：概念流程，正文无可绘数值）</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="60" y1="130" x2="1140" y2="130"/>
    <line x1="60" y1="280" x2="1140" y2="280"/>
  </g>
  <line x1="60" y1="205" x2="1140" y2="205" stroke="#009E73" stroke-width="0.75"/>
  <g stroke="#009E73" stroke-width="0.75">
    <line x1="240" y1="205" x2="240" y2="209"/>
    <line x1="600" y1="205" x2="600" y2="209"/>
    <line x1="960" y1="205" x2="960" y2="209"/>
  </g>

  <!-- step 1 -->
  <g stroke="#009E73" stroke-width="1.5" fill="none">
    <line x1="330" y1="168" x2="505" y2="168"/>
    <polyline points="497,162 505,168 497,174"/>
    <line x1="690" y1="168" x2="865" y2="168"/>
    <polyline points="857,162 865,168 857,174"/>
  </g>
  <circle cx="240" cy="168" r="7" fill="#0072B2"/>
  <text x="240" y="146" font-size="12.5" fill="#009E73" text-anchor="middle">第 1 步：投影</text>
  <text x="240" y="232" font-size="12" fill="#555" text-anchor="middle">把输入历史的最近窗口</text>
  <text x="240" y="252" font-size="12" fill="#555" text-anchor="middle">投影到一个规范方向</text>

  <!-- step 2 -->
  <circle cx="600" cy="168" r="7" fill="#0072B2"/>
  <text x="600" y="146" font-size="12.5" fill="#009E73" text-anchor="middle">第 2 步：学习</text>
  <text x="600" y="232" font-size="12" fill="#555" text-anchor="middle">方向由过往观察到的</text>
  <text x="600" y="252" font-size="12" fill="#555" text-anchor="middle">过去-未来输入对做规范相关分析（CCA）获得</text>

  <!-- step 3 -->
  <circle cx="960" cy="168" r="7" fill="#D55E00"/>
  <text x="960" y="146" font-size="12.5" fill="#009E73" text-anchor="middle">第 3 步：整流</text>
  <text x="960" y="232" font-size="12" fill="#555" text-anchor="middle">正分量输出为 ON ReSU，</text>
  <text x="960" y="252" font-size="12" fill="#555" text-anchor="middle">负分量输出为 OFF ReSU</text>

  <text x="600" y="300" font-size="12" fill="#555" text-anchor="middle">突触权重直接来自输入的过去-未来 CCA，无需跨层通信；CCA 可由局部学习规则实现，构成生物学合理性</text>
  <text x="600" y="328" font-size="12" fill="#009E73" text-anchor="middle">三步顺序（论文机制描述顺序，序列位置轴，非数值刻度）</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="382" font-size="15" font-weight="bold" fill="#009E73">b</text>
  <text x="82" y="382" font-size="15" fill="#009E73">果蝇视觉通路上的验证结果（按通路层级排列，序列位置轴）</text>
  <line x1="60" y1="478" x2="1140" y2="478" stroke="#009E73" stroke-width="0.75"/>
  <g stroke="#009E73" stroke-width="0.75">
    <line x1="300" y1="478" x2="300" y2="482"/>
    <line x1="860" y1="478" x2="860" y2="482"/>
  </g>

  <circle cx="300" cy="418" r="7" fill="#0072B2"/>
  <text x="300" y="398" font-size="12.5" fill="#009E73" text-anchor="middle">第一层：单像素驱动，学习时间滤波器</text>
  <g font-size="12" fill="#555">
    <text x="120" y="504">第一个滤波器低通、类似 L3；第二个为平滑时间导数、类似 L1/L2</text>
    <text x="120" y="524">ON 单元响应对比度增加，OFF 单元响应对比度降低</text>
    <text x="120" y="544">滤波器随信噪比动态适应：低噪声呈多波瓣，噪声增大过渡为单波瓣</text>
  </g>

  <circle cx="860" cy="418" r="7" fill="#0072B2"/>
  <text x="860" y="398" font-size="12.5" fill="#009E73" text-anchor="middle">第二层：空间汇集，学习方向选择性</text>
  <g font-size="12" fill="#555">
    <text x="640" y="504">获得方向选择性、类似 T4 运动检测细胞</text>
    <text x="640" y="524">突触权重重现果蝇 T4a 神经元突触输入的大部分符号模式</text>
    <text x="640" y="544">并近似相对幅度，与连接组重建结果接近</text>
  </g>
  <text x="600" y="572" font-size="12" fill="#555" text-anchor="middle">训练数据为以恒定速度扫描自然场景得到的平移图像；结果与生物记录高度吻合</text>

  <!-- ============ panel c ============ -->
  <text x="60" y="606" font-size="15" font-weight="bold" fill="#009E73">c</text>
  <text x="82" y="606" font-size="15" fill="#009E73">动机与扩展</text>
  <g font-size="12" fill="#555">
    <text x="60" y="634">对照：人脑功率约 20W；当前 AI 训练耗电以兆瓦时计、需数十亿标注样本</text>
    <text x="620" y="634">扩展：已扩至三层，三层从双向平移图像学习（两层版本仅用单向）；后续为自动确定最佳记忆长度、自上而下反馈</text>
  </g>

  <!-- footnote -->
  <text x="60" y="658" font-size="11" fill="#767676">数据：arXiv:2512.23146（Simons 基金会 Flatiron 研究所，AAAI 2026）· a/b 面板为机制与通路层级的序列位置轴，非数值刻度 · 正文为定性结果描述，未报告可比数值与误差区间，未画误差棒 · 预印本未经同行评审</text>
</svg>
