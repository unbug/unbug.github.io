<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">技能识别准确率几乎不变的前提下，信念-行动差距近乎减半，重规划次数最高减少 80 倍</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">信念-行动差距等指标：BayesBeliefAgent 对比基线 ProAgent（Overcooked 基准）</text>

  <!-- gridlines: x = 300 + 1200*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="450" y1="126" x2="450" y2="396"/>
    <line x1="600" y1="126" x2="600" y2="396"/>
    <line x1="750" y1="126" x2="750" y2="396"/>
    <line x1="900" y1="126" x2="900" y2="396"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="418">0</text>
    <text x="450" y="418">0.1</text>
    <text x="600" y="418">0.2</text>
    <text x="750" y="418">0.3</text>
    <text x="900" y="418">0.4</text>
  </g>

  <!-- rows y=168/222/276/330/384 ; hollow=ProAgent baseline, solid=BayesBeliefAgent -->
  <!-- Open gap 0.41 -> 0.20 -->
  <text x="288" y="172" font-size="12.5" fill="#1A1B1E" text-anchor="end">belief-action gap（Open 布局）</text>
  <line x1="492" y1="168" x2="792" y2="168" stroke="#999999" stroke-width="1.5"/>
  <circle cx="792" cy="168" r="6" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="802" y="163" font-size="12" fill="#555">0.41</text>
  <circle cx="492" cy="168" r="7" fill="#0072B2"/>
  <text x="464" y="163" font-size="12" fill="#555" text-anchor="end">0.20</text>

  <!-- Ring gap 0.38 -> 0.28 -->
  <text x="288" y="226" font-size="12.5" fill="#1A1B1E" text-anchor="end">belief-action gap（Ring 布局）</text>
  <line x1="552" y1="222" x2="636" y2="222" stroke="#999999" stroke-width="1.5"/>
  <circle cx="636" cy="222" r="6" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="646" y="217" font-size="12" fill="#555">0.38</text>
  <circle cx="552" cy="222" r="7" fill="#0072B2"/>
  <text x="524" y="217" font-size="12" fill="#555" text-anchor="end">0.28</text>

  <!-- Comp@3 0.39 -> 0.66 -->
  <text x="288" y="280" font-size="12.5" fill="#1A1B1E" text-anchor="end">Comp@3 互补性（Open 布局）</text>
  <line x1="720" y1="276" x2="1044" y2="276" stroke="#999999" stroke-width="1.5"/>
  <circle cx="720" cy="276" r="6" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="692" y="271" font-size="12" fill="#555" text-anchor="end">0.39</text>
  <circle cx="1044" cy="276" r="7" fill="#0072B2"/>
  <text x="1056" y="255" font-size="12" fill="#555">0.66</text>

  <!-- repeated skill 0.30 -> 0.15 -->
  <text x="288" y="334" font-size="12.5" fill="#1A1B1E" text-anchor="end">重复技能率（Open 布局）</text>
  <line x1="432" y1="330" x2="612" y2="330" stroke="#999999" stroke-width="1.5"/>
  <circle cx="612" cy="330" r="6" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="622" y="325" font-size="12" fill="#555">0.30</text>
  <circle cx="432" cy="330" r="7" fill="#0072B2"/>
  <text x="404" y="325" font-size="12" fill="#555" text-anchor="end">0.15</text>

  <!-- accuracy 0.78 -> 0.79 -->
  <text x="288" y="388" font-size="12.5" fill="#1A1B1E" text-anchor="end">技能识别准确率（Open 布局）</text>
  <line x1="912" y1="384" x2="924" y2="384" stroke="#999999" stroke-width="1.5"/>
  <circle cx="912" cy="384" r="6" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <circle cx="924" cy="384" r="7" fill="#0072B2"/>
  <text x="938" y="389" font-size="12" fill="#555">0.78 → 0.79，几乎相同</text>

  <!-- value axis -->
  <line x1="300" y1="396" x2="1140" y2="396" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="396" x2="300" y2="400"/>
    <line x1="450" y1="396" x2="450" y2="400"/>
    <line x1="600" y1="396" x2="600" y2="400"/>
    <line x1="750" y1="396" x2="750" y2="400"/>
    <line x1="900" y1="396" x2="900" y2="400"/>
  </g>
  <text x="660" y="446" font-size="14" fill="#1A1B1E" text-anchor="middle">指标数值（比例，无量纲）</text>
  <g font-size="12" fill="#555">
    <circle cx="316" cy="118" r="5" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
    <text x="327" y="122">基线 ProAgent</text>
    <circle cx="440" cy="118" r="5" fill="#0072B2"/>
    <text x="451" y="122">BayesBeliefAgent</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="60" y="480" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="480" font-size="15" fill="#1A1B1E">Open 布局每 episode 重规划次数（区间为论文报告范围）</text>

  <!-- whiskers: pos(v) = 300 + 360*log10(v) ; log scale anchored 1..~7 -->
  <text x="288" y="520" font-size="12.5" fill="#1A1B1E" text-anchor="end">Full（后验门控中断）</text>
  <line x1="506.5" y1="516" x2="565.4" y2="516" stroke="#0072B2" stroke-width="1.5"/>
  <line x1="506.5" y1="509" x2="506.5" y2="523" stroke="#0072B2" stroke-width="1.5"/>
  <line x1="565.4" y1="509" x2="565.4" y2="523" stroke="#0072B2" stroke-width="1.5"/>
  <text x="575" y="521" font-size="12" fill="#555">1.8–3.0</text>

  <text x="288" y="562" font-size="12.5" fill="#1A1B1E" text-anchor="end">Periodic-10 变体</text>
  <line x1="719" y1="558" x2="836.5" y2="558" stroke="#999999" stroke-width="1.5"/>
  <line x1="719" y1="551" x2="719" y2="565" stroke="#999999" stroke-width="1.5"/>
  <line x1="836.5" y1="551" x2="836.5" y2="565" stroke="#999999" stroke-width="1.5"/>
  <text x="846" y="563" font-size="12" fill="#555">15–51</text>

  <text x="288" y="604" font-size="12.5" fill="#1A1B1E" text-anchor="end">Compl./held 变体</text>
  <line x1="835.6" y1="600" x2="938.9" y2="600" stroke="#999999" stroke-width="1.5"/>
  <line x1="835.6" y1="593" x2="835.6" y2="607" stroke="#999999" stroke-width="1.5"/>
  <line x1="938.9" y1="593" x2="938.9" y2="607" stroke="#999999" stroke-width="1.5"/>
  <text x="949" y="605" font-size="12" fill="#555">50–169</text>

  <text x="1000" y="521" font-size="12" fill="#555">三者平均奖励相当，</text>
  <text x="1000" y="539" font-size="12" fill="#555">重规划次数少 20–80 倍</text>

  <!-- log axis: ticks 1 / 10 / 169 at 300 / 660 / 1054.9 -->
  <line x1="300" y1="616" x2="1080" y2="616" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="616" x2="300" y2="620"/>
    <line x1="660" y1="616" x2="660" y2="620"/>
    <line x1="1054.9" y1="616" x2="1054.9" y2="620"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="636">1</text>
    <text x="660" y="636">10</text>
    <text x="1054.9" y="636">169</text>
  </g>
  <text x="1070" y="621" font-size="12" fill="#555">对数刻度（次）</text>

  <!-- footnote -->
  <text x="60" y="658" font-size="11" fill="#767676">数据：arXiv:2608.18490（Overcooked，BayesBeliefAgent 对基线 ProAgent）· 均为论文自测口径 · b 面板横轴为对数刻度，数值以端点标注为准 · 预印本未经同行评审</text>
</svg>
