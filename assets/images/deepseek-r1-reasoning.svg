<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#F0F0F0"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#009E73">纯强化学习训练的 R1-Zero 与加入冷启动数据的 R1 在竞赛数学、代码与推理基准上达到 OpenAI o1 相当水平</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#009E73">a</text>
  <text x="82" y="104" font-size="15" fill="#009E73">训练流程对比（序列阶段轴，非数值刻度）</text>

  <!-- baseline row: conventional -->
  <text x="100" y="160" font-size="13" fill="#009E73">传统流程</text>
  <g>
    <rect x="220" y="140" width="200" height="34" fill="#F0F0F0" stroke="#999999" stroke-width="1.5"/>
    <text x="320" y="162" font-size="12.5" fill="#009E73" text-anchor="middle">大规模人工标注 CoT</text>
    <polygon points="428,157 442,150 442,164" fill="#999999"/>
    <rect x="450" y="140" width="120" height="34" fill="#F0F0F0" stroke="#999999" stroke-width="1.5"/>
    <text x="510" y="162" font-size="12.5" fill="#009E73" text-anchor="middle">监督微调 SFT</text>
    <polygon points="578,157 592,150 592,164" fill="#999999"/>
    <rect x="600" y="140" width="130" height="34" fill="#F0F0F0" stroke="#999999" stroke-width="1.5"/>
    <text x="665" y="162" font-size="12.5" fill="#009E73" text-anchor="middle">（可选）强化学习</text>
  </g>

  <!-- R1-Zero row -->
  <text x="100" y="232" font-size="13" fill="#009E73">R1-Zero</text>
  <polygon points="208,227 222,220 222,234" fill="#D55E00"/>
  <rect x="230" y="210" width="230" height="34" fill="#F0F0F0" stroke="#D55E00" stroke-width="1.5"/>
  <text x="345" y="232" font-size="12.5" fill="#009E73" text-anchor="middle">基础模型直接强化学习</text>

  <!-- R1 row -->
  <text x="100" y="304" font-size="13" fill="#009E73">R1</text>
  <rect x="220" y="282" width="260" height="34" fill="#F0F0F0" stroke="#0072B2" stroke-width="1.5"/>
  <text x="350" y="304" font-size="12.5" fill="#009E73" text-anchor="middle">少量冷启动数据（缓解重复与可读性问题）</text>
  <polygon points="488,299 502,292 502,306" fill="#0072B2"/>
  <rect x="510" y="282" width="150" height="34" fill="#F0F0F0" stroke="#0072B2" stroke-width="1.5"/>
  <text x="585" y="304" font-size="12.5" fill="#009E73" text-anchor="middle">强化学习</text>

  <!-- sequence axis -->
  <line x1="220" y1="348" x2="740" y2="348" stroke="#009E73" stroke-width="0.75"/>
  <g stroke="#009E73" stroke-width="0.75">
    <line x1="220" y1="348" x2="220" y2="352"/>
    <line x1="380" y1="348" x2="380" y2="352"/>
    <line x1="540" y1="348" x2="540" y2="352"/>
    <line x1="700" y1="348" x2="700" y2="352"/>
  </g>
  <g font-size="12.5" fill="#009E73" text-anchor="middle">
    <text x="220" y="372">第一步</text>
    <text x="380" y="372">第二步</text>
  </g>
  <g font-size="12.5" fill="#009E73" text-anchor="middle">
    <text x="540" y="372">第三步</text>
    <text x="700" y="372">第四步</text>
  </g>
  <text x="480" y="400" font-size="14" fill="#009E73" text-anchor="middle">流程阶段（序列位置轴，非数值刻度）</text>
  <text x="220" y="428" font-size="12" fill="#555">冷启动数据缓解 R1-Zero 的无限重复、可读性差、语言混杂问题</text>

  <!-- ============ panel b ============ -->
  <text x="850" y="104" font-size="15" font-weight="bold" fill="#009E73">b</text>
  <text x="872" y="104" font-size="15" fill="#009E73">覆盖任务面（定性，论文自测口径）</text>
  <g font-size="12.5" fill="#009E73">
    <circle cx="876" cy="140" r="4" fill="#0072B2"/>
    <text x="892" y="145">竞赛级数学</text>
    <circle cx="876" cy="172" r="4" fill="#0072B2"/>
    <text x="892" y="177">代码生成与理解</text>
    <circle cx="876" cy="204" r="4" fill="#0072B2"/>
    <text x="892" y="209">复杂逻辑推理</text>
    <circle cx="876" cy="236" r="4" fill="#0072B2"/>
    <text x="892" y="241">科学问答</text>
  </g>
  <text x="850" y="286" font-size="12" fill="#555">推理导向强化学习对用户偏好类基准影响很小；</text>
  <text x="850" y="306" font-size="12" fill="#555">训练中期涌现「啊哈时刻」，学会给复杂问题</text>
  <text x="850" y="326" font-size="12" fill="#555">分配更多思考时间；R1-Zero 存在无限重复、可读性</text>
  <text x="850" y="346" font-size="12" fill="#555">差、语言混杂问题，冷启动数据加以解决</text>

  <!-- panel c: emergent behaviors -->
  <text x="60" y="392" font-size="15" font-weight="bold" fill="#009E73">c</text>
  <text x="82" y="392" font-size="15" fill="#009E73">训练中自然涌现的推理行为</text>
  <g font-size="12" fill="#009E73">
    <circle cx="86" cy="428" r="4" fill="#D55E00"/>
    <text x="102" y="433">自我反思：重新评估最初思路并及时修正</text>
    <circle cx="86" cy="460" r="4" fill="#D55E00"/>
    <text x="102" y="465">自我验证：每一步检查推理链条</text>
    <circle cx="86" cy="492" r="4" fill="#D55E00"/>
    <text x="102" y="497">动态策略调整：按问题特点切换推理方式</text>
  </g>

  <!-- footnote -->
  <text x="60" y="600" font-size="11" fill="#767676">数据：arXiv:2501.12948 / Nature 645, 633-638（2025，论文自测口径）· 正文未报告具体分数与误差区间，a 面板为序列阶段轴，b/c 面板为定性列举</text>
  <text x="60" y="618" font-size="11" fill="#767676">局限：结构化输出与工具使用能力待提升，特定场景推理质量可优化，计算资源需求相对较大</text>
</svg>
