<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">不确定性升级贡献 26.8 个百分点；叠加影子盯梢后成功率 73.66%，追平常开强模型</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">消融阶梯：逐层叠加后的 OSWorld 任务成功率（%）</text>

  <!-- gridlines: x = 250 + 8*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="450" y1="126" x2="450" y2="380"/>
    <line x1="650" y1="126" x2="650" y2="380"/>
    <line x1="850" y1="126" x2="850" y2="380"/>
  </g>

  <!-- weak baseline 37.40 -->
  <text x="238" y="160" font-size="12.5" fill="#1A1B1E" text-anchor="end">弱模型独立执行</text>
  <rect x="250" y="146" width="299.2" height="18" fill="#999999"/>
  <text x="557" y="160" font-size="12" fill="#555">37.40%</text>

  <!-- +Manager 41.15 -->
  <text x="238" y="220" font-size="12.5" fill="#1A1B1E" text-anchor="end">+ Manager 拆解验收</text>
  <rect x="250" y="206" width="329.2" height="18" fill="#999999"/>
  <text x="587" y="220" font-size="12" fill="#555">41.15%（$0.1372）</text>

  <!-- +escalation 67.94 -->
  <text x="238" y="280" font-size="12.5" fill="#1A1B1E" text-anchor="end">+ 不确定性升级</text>
  <rect x="250" y="266" width="543.5" height="18" fill="#0072B2"/>
  <text x="801" y="280" font-size="12" fill="#555">67.94%（$0.4050）</text>
  <text x="801" y="296" font-size="12" fill="#555">增量 Δ = +26.8 个百分点</text>

  <!-- +shadow 73.66 -->
  <text x="238" y="340" font-size="12.5" fill="#1A1B1E" text-anchor="end">+ 影子盯梢</text>
  <rect x="250" y="326" width="589.3" height="18" fill="#0072B2" opacity="0.35"/>
  <rect x="793.5" y="326" width="45.8" height="18" fill="#D55E00"/>
  <text x="847" y="340" font-size="12" fill="#555">73.66%（$0.4117）</text>
  <text x="847" y="356" font-size="12" fill="#555">增量 Δ = +5.7 个百分点</text>

  <!-- value axis -->
  <line x1="250" y1="380" x2="850" y2="380" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="250" y1="380" x2="250" y2="384"/>
    <line x1="450" y1="380" x2="450" y2="384"/>
    <line x1="650" y1="380" x2="650" y2="384"/>
    <line x1="850" y1="380" x2="850" y2="384"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="250" y="400">0</text>
    <text x="450" y="400">20</text>
    <text x="650" y="400">40</text>
    <text x="850" y="400">60</text>
  </g>
  <text x="550" y="426" font-size="14" fill="#1A1B1E" text-anchor="middle">OSWorld 任务成功率（%）</text>
  <text x="250" y="450" font-size="12" fill="#555">灰 = 未调用强执行器的配置；蓝 = 含升级机制；朱 = 影子盯梢的增量部分（73.66 − 67.94）</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="498" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="498" font-size="15" fill="#1A1B1E">端到端对比：任务成功率与单任务估算成本</text>

  <!-- success rate dumbbell: y = 565 - 2*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="90" y1="565" x2="560" y2="565"/>
    <line x1="90" y1="495" x2="560" y2="495"/>
  </g>
  <line x1="90" y1="520" x2="560" y2="520" stroke="#999999" stroke-width="1.5"/>
  <circle cx="90" cy="520" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <circle cx="211.3" cy="520" r="6" fill="#0072B2"/>
  <text x="90" y="502" font-size="12" fill="#555" text-anchor="middle">72.90%（常开 Claude Opus 5）</text>
  <text x="229" y="538" font-size="12" fill="#555">73.66%（LEASH）</text>

  <line x1="90" y1="450" x2="560" y2="450" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="90" y1="450" x2="90" y2="454"/>
    <line x1="325" y1="450" x2="325" y2="454"/>
    <line x1="560" y1="450" x2="560" y2="454"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="90" y="470">0</text>
    <text x="325" y="470">50</text>
    <text x="560" y="470">100</text>
  </g>
  <text x="90" y="576" font-size="14" fill="#1A1B1E">任务成功率（%）</text>

  <!-- cost direct bars: x = 90 + 200*v -->
  <text x="650" y="524" font-size="12.5" fill="#1A1B1E" text-anchor="end">常开 Claude Opus 5</text>
  <rect x="660" y="510" width="101.9" height="16" fill="#999999"/>
  <text x="770" y="523" font-size="12" fill="#555">$0.5094</text>

  <text x="650" y="559" font-size="12.5" fill="#1A1B1E" text-anchor="end">LEASH</text>
  <rect x="660" y="545" width="82.3" height="16" fill="#D55E00"/>
  <text x="751" y="558" font-size="12" fill="#555">$0.4117</text>

  <text x="660" y="590" font-size="14" fill="#1A1B1E">单任务估算成本（美元，按固定参考价折算 token 用量，非真实账单）</text>
  <text x="660" y="612" font-size="12" fill="#555">Δ = −19.2%；正文口径：跨骨干成本为常开强模型的 69%–81%</text>

  <!-- footnote -->
  <text x="60" y="648" font-size="11" fill="#767676">数据：arXiv:2610.22280（Qwen3.5-35B-A3B 骨干，OSWorld 基准，消融取自论文同表，成本为论文估算口径）· 主打配置升级率 64.1%，同成本对照比随机升级高 9.1 个百分点 · 预印本未经同行评审</text>
</svg>
