<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="920" height="540" fill="#ffffff"/>
  <text x="460" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">LEASH 消融阶梯：钱加在哪一层，分数涨在哪一层（OSWorld，成功率）</text>

  <!-- baseline: always-on Opus -->
  <line x1="70" y1="120" x2="880" y2="120" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="878" y="110" text-anchor="end" font-size="14" fill="#c0392b">常开 Claude Opus：72.90%，每任务估算成本 $0.5094</text>

  <!-- axis -->
  <line x1="70" y1="460" x2="880" y2="460" stroke="#333" stroke-width="1.5"/>
  <g font-size="15" fill="#444">
    <text x="175" y="485" text-anchor="middle">弱模型裸奔</text>
    <text x="380" y="485" text-anchor="middle">+ Manager 拆解验收</text>
    <text x="585" y="485" text-anchor="middle">+ 不确定性升级</text>
    <text x="790" y="485" text-anchor="middle">+ 影子盯梢 = LEASH</text>
  </g>

  <!-- bars: scale 0-80% maps y 460->140 -->
  <g>
    <rect x="115" y="260.5" width="120" height="199.5" fill="#b8c4d0"/>
    <text x="175" y="248" text-anchor="middle" font-size="18" font-weight="bold" fill="#33415c">37.40%</text>
    <text x="175" y="226" text-anchor="middle" font-size="13" fill="#888">成本未计</text>

    <rect x="320" y="241.2" width="120" height="218.8" fill="#8fa8c8"/>
    <text x="380" y="229" text-anchor="middle" font-size="18" font-weight="bold" fill="#33415c">41.15%</text>
    <text x="380" y="207" text-anchor="middle" font-size="13" fill="#888">$0.1372</text>

    <rect x="525" y="161.5" width="120" height="298.5" fill="#5b7fa6"/>
    <text x="585" y="149" text-anchor="middle" font-size="18" font-weight="bold" fill="#274060">67.94%</text>
    <text x="585" y="127" text-anchor="middle" font-size="13" fill="#888">$0.4050</text>

    <rect x="730" y="139.5" width="120" height="320.5" fill="#2e5e8f"/>
    <text x="790" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">73.66%</text>
    <text x="790" y="212" text-anchor="middle" font-size="13" fill="#e8eef5">$0.4117（比常开省 19.2%）</text>
  </g>

  <!-- step deltas -->
  <g font-size="13" fill="#2c7a4b">
    <text x="277" y="300" text-anchor="middle">+3.8 点</text>
    <text x="482" y="215" text-anchor="middle">+26.8 点（大头）</text>
    <text x="687" y="165" text-anchor="middle">+5.7 点 / 仅 +1.7% 成本</text>
  </g>

  <!-- notes -->
  <text x="70" y="515" font-size="13" fill="#666">升级率 64.1%：弱模型（Qwen3.5-35B-A3B）默认执行，隐状态不确定时把控制权交给强模型（Claude Opus 5）。</text>
  <text x="70" y="534" font-size="13" fill="#666">成本为按固定参考价折算 token 用量的估算推理成本。数据：arXiv:2610.22280，v1 预印本，Simular 联合 UW–Madison。</text>
</svg>
