<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">Agent 设计空间归纳为四个外化维度，可靠性提升主要来自外化设计而非模型权重更新</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">四维度外化框架：能力从模型内部转移到外部组件</text>

  <!-- central node -->
  <rect x="470" y="122" width="260" height="54" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="600" y="147" font-size="14" font-weight="bold" fill="#1A1B1E" text-anchor="middle">LLM Agent</text>
  <text x="600" y="166" font-size="12" fill="#555555" text-anchor="middle">能力原期望编码于模型权重内部</text>

  <!-- connector lines -->
  <g stroke="#999999" stroke-width="1.5">
    <line x1="185" y1="300" x2="185" y2="230"/>
    <line x1="185" y1="230" x2="530" y2="230"/>
    <line x1="530" y1="230" x2="530" y2="176"/>
    <line x1="440" y1="300" x2="440" y2="210"/>
    <line x1="440" y1="210" x2="570" y2="210"/>
    <line x1="570" y1="210" x2="570" y2="176"/>
    <line x1="760" y1="300" x2="760" y2="210"/>
    <line x1="760" y1="210" x2="630" y2="210"/>
    <line x1="630" y1="210" x2="630" y2="176"/>
    <line x1="1015" y1="300" x2="1015" y2="230"/>
    <line x1="1015" y1="230" x2="670" y2="230"/>
    <line x1="670" y1="230" x2="670" y2="176"/>
  </g>

  <!-- dimension boxes -->
  <g stroke-width="1.5">
    <rect x="60" y="300" width="250" height="112" fill="#F2F2F2" stroke="#999999"/>
    <rect x="330" y="300" width="220" height="112" fill="#FFFFFF" stroke="#999999"/>
    <rect x="570" y="300" width="380" height="112" fill="#FFFFFF" stroke="#999999"/>
    <rect x="970" y="300" width="170" height="112" fill="#FFFFFF" stroke="#D55E00" stroke-width="2"/>
  </g>

  <!-- Memory -->
  <text x="76" y="328" font-size="14" font-weight="bold" fill="#1A1B1E">记忆 Memory</text>
  <g font-size="12" fill="#555555">
    <text x="76" y="356">短期记忆、长期记忆、外部知识库</text>
    <text x="76" y="376">存储什么、何时存储、如何检索</text>
    <text x="76" y="396">不期望模型记住所有信息</text>
  </g>

  <!-- Skills -->
  <text x="346" y="328" font-size="14" font-weight="bold" fill="#1A1B1E">技能 Skills</text>
  <g font-size="12" fill="#555555">
    <text x="346" y="356">能力封装为可复用外部模块</text>
    <text x="346" y="376">按需调用，更新靠替换模块</text>
    <text x="346" y="396">不依赖模型重新训练</text>
  </g>

  <!-- Protocols -->
  <text x="586" y="328" font-size="14" font-weight="bold" fill="#1A1B1E">协议 Protocols</text>
  <g font-size="12" fill="#555555">
    <text x="586" y="356">消息格式、调用顺序</text>
    <text x="586" y="376">错误处理、资源管理</text>
    <text x="586" y="396">标准化组件间通信方式</text>
  </g>

  <!-- Harness (protagonist) -->
  <text x="986" y="328" font-size="14" font-weight="bold" fill="#D55E00">框架 Harness</text>
  <g font-size="12" fill="#555555">
    <text x="986" y="356">统一调度的运行时</text>
    <text x="986" y="376">组件生命周期管理</text>
    <text x="986" y="396">依赖与冲突处理</text>
  </g>

  <!-- panel a note -->
  <text x="60" y="444" font-size="12" fill="#555555">机制示意，无量化数据：框图为论文归纳的设计维度，颜色仅标示下文的评估主角维度</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="496" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="496" font-size="15" fill="#1A1B1E">架构评估清单：按四个维度逐一检查</text>
  <g font-size="12.5" fill="#1A1B1E">
    <text x="82" y="528">记忆维度：信息是否有外部存储兜底</text>
    <text x="350" y="528">技能维度：能力是否模块化封装</text>
    <text x="618" y="528">协议维度：组件通信是否有标准协议</text>
    <text x="886" y="528">框架维度：是否有依赖管理与冲突处理</text>
  </g>
  <text x="82" y="556" font-size="12" fill="#555555">四个维度覆盖越完整，系统对模型本身缺陷的容错空间就越大</text>

  <!-- footnote -->
  <text x="60" y="600" font-size="11" fill="#767676">来源：arXiv:2604.08224《Externalization in LLM Agents: A Unified Review of Memory, Skills, Protocols and Harness Engineering》（上海交通大学、中山大学、CMU 等）</text>
  <text x="60" y="618" font-size="11" fill="#767676">机制综述类论文，图内无量化数值 · 本图为论文框架的机制示意，口径与正文一致，论文自述口径</text>
</svg>
