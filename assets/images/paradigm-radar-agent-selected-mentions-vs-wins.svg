<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">提及与实际中选严重脱钩：PayPal 被提及 139 次、中选 0 次</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">提及次数与实际中选次数（次）</text>

  <!-- gridlines: x = 330 + 2*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="430" y1="130" x2="430" y2="390"/>
    <line x1="530" y1="130" x2="530" y2="390"/>
    <line x1="630" y1="130" x2="630" y2="390"/>
    <line x1="730" y1="130" x2="730" y2="390"/>
  </g>

  <!-- rows: hollow = mentioned, solid = won -->
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="322" y="165">PayPal</text>
    <text x="322" y="225">Adyen</text>
    <text x="322" y="285">LangChain</text>
    <text x="322" y="345">Netlify</text>
  </g>

  <!-- PayPal 139 / 0 -->
  <rect x="330" y="148" width="278" height="14" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.5"/>
  <text x="617" y="160" font-size="12" fill="#555">提及 139</text>
  <circle cx="330" cy="178" r="5" fill="#D55E00"/>
  <text x="342" y="183" font-size="12" fill="#555">中选 0，其中 124 场被 Stripe 赢走</text>

  <!-- Adyen 175 / 3 -->
  <rect x="330" y="208" width="350" height="14" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.5"/>
  <text x="689" y="220" font-size="12" fill="#555">提及 175</text>
  <circle cx="336" cy="238" r="5" fill="#D55E00"/>
  <text x="348" y="243" font-size="12" fill="#555">中选 3</text>

  <!-- LangChain 194 / 4 -->
  <rect x="330" y="268" width="388" height="14" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.5"/>
  <text x="727" y="280" font-size="12" fill="#555">提及 194</text>
  <circle cx="338" cy="298" r="5" fill="#D55E00"/>
  <text x="350" y="303" font-size="12" fill="#555">中选 4</text>

  <!-- Netlify 152 / 6 -->
  <rect x="330" y="328" width="304" height="14" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.5"/>
  <text x="643" y="340" font-size="12" fill="#555">提及 152</text>
  <circle cx="342" cy="358" r="5" fill="#D55E00"/>
  <text x="354" y="363" font-size="12" fill="#555">中选 6</text>

  <!-- value axis -->
  <line x1="330" y1="390" x2="730" y2="390" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="330" y1="390" x2="330" y2="394"/>
    <line x1="430" y1="390" x2="430" y2="394"/>
    <line x1="530" y1="390" x2="530" y2="394"/>
    <line x1="630" y1="390" x2="630" y2="394"/>
    <line x1="730" y1="390" x2="730" y2="394"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="330" y="410">0</text>
    <text x="430" y="410">50</text>
    <text x="530" y="410">100</text>
    <text x="630" y="410">150</text>
    <text x="730" y="410">200</text>
  </g>
  <text x="530" y="436" font-size="14" fill="#1A1B1E" text-anchor="middle">次数（次）</text>
  <g font-size="12" fill="#555">
    <rect x="330" y="118" width="14" height="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.5"/>
    <text x="351" y="127">被提及（空心条）</text>
    <circle cx="470" cy="123" r="5" fill="#D55E00"/>
    <text x="481" y="127">被选中（实心点）</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="880" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="902" y="104" font-size="15" fill="#1A1B1E">同类脱钩证据</text>
  <g font-size="12.5" fill="#555">
    <text x="880" y="140">Supabase 是提及最多的</text>
    <text x="880" y="160">数据库，被 Neon 压制，</text>
    <text x="880" y="180">Neon 赢下 66% 的对决</text>
    <text x="880" y="216">支付场景 Stripe 十场赢</text>
    <text x="880" y="236">九场</text>
    <text x="880" y="272">对象存储 S3 拿 45%，</text>
    <text x="880" y="292">Azure 与 GCP 各 20%</text>
  </g>

  <!-- footnote -->
  <text x="60" y="600" font-size="11" fill="#767676">数据：Armature 16,893 会话测量，厂商自述口径，原始 trace 据称公开于 leaderboards.armature.tech，未经独立第三方复现</text>
  <text x="60" y="620" font-size="11" fill="#767676">页面信息呈现本身直接翻转选择：Mailgun 因免费档写着 1 天日志保留输给 Postmark</text>
</svg>
