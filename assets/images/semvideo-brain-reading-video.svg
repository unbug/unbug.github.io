<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">CC2017 与 HCP 两个数据集的 10 个评估指标中，SemVideo 有 8 项超过此前方法</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">四个维度代表指标：条越长得分越高（论文自测值，数值标于柱旁）</text>

  <!-- horizontal bars: length px = 240*value; no tick axis (正文无刻度数值) -->
  <line x1="300" y1="130" x2="300" y2="382" stroke="#1A1B1E" stroke-width="0.75"/>
  <text x="300" y="400" font-size="12" fill="#767676" text-anchor="middle">条形起点即得分最低端，数值标于条旁</text>

  <text x="288" y="162" font-size="12.5" fill="#1A1B1E" text-anchor="end">2-way-V（语义）</text>
  <rect x="300" y="148" width="207.6" height="20" fill="#0072B2"/>
  <text x="515" y="162" font-size="12" fill="#555">0.865</text>

  <text x="288" y="210" font-size="12.5" fill="#1A1B1E" text-anchor="end">50-way-V（语义）</text>
  <rect x="300" y="196" width="63.36" height="20" fill="#0072B2"/>
  <text x="371" y="210" font-size="12" fill="#555">0.264</text>

  <text x="288" y="258" font-size="12.5" fill="#1A1B1E" text-anchor="end">Hue-PCC（像素）</text>
  <rect x="300" y="244" width="203.76" height="20" fill="#D55E00"/>
  <text x="511" y="258" font-size="12" fill="#555">0.849</text>

  <text x="288" y="306" font-size="12.5" fill="#1A1B1E" text-anchor="end">CLIP 相似度（时空）</text>
  <rect x="300" y="292" width="126.24" height="20" fill="#D55E00"/>
  <text x="434" y="306" font-size="12" fill="#555">0.526</text>

  <text x="288" y="354" font-size="12.5" fill="#1A1B1E" text-anchor="end">EPE（时空，误差）</text>
  <rect x="300" y="340" width="240" height="20" fill="#999999"/>
  <rect x="300" y="340" width="12.48" height="20" fill="#000000"/>
  <text x="548" y="354" font-size="12" fill="#555">4.788</text>
  <text x="300" y="428" font-size="12" fill="#555">EPE 为误差指标（越低越好）：灰色全长为对比标尺，黑色短段为实测值等比长度</text>

  <!-- ============ panel b ============ -->
  <text x="920" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="942" y="104" font-size="15" fill="#1A1B1E">模块与脑区激活（定性）</text>
  <g font-size="12.5" fill="#1A1B1E">
    <text x="920" y="146">静态锚点</text>
    <text x="920" y="192">运动叙事</text>
    <text x="920" y="238">整体概要</text>
  </g>
  <g font-size="12" fill="#555">
    <text x="920" y="168">主要激活视觉皮层</text>
    <text x="920" y="214">激活 MT、MST 运动区</text>
    <text x="920" y="260">视觉与运动区均衡激活</text>
  </g>
  <text x="920" y="304" font-size="12" fill="#555">模块分工与人脑视觉处理机制吻合，</text>
  <text x="920" y="324" font-size="12" fill="#555">提示人脑提取语义与运动信息、</text>
  <text x="920" y="344" font-size="12" fill="#555">而非逐像素处理视频</text>

  <!-- footnote -->
  <text x="60" y="560" font-size="11" fill="#767676">数据：arXiv:2602.21819（CC2017 与 HCP 公开数据集，论文自测口径）· 四值均为 SemVideo 成绩，其中 Hue-PCC、CLIP 相似度、EPE 为论文报告各方法最优</text>
  <text x="60" y="580" font-size="11" fill="#767676">正文未给出坐标轴刻度数值，panel a 不画数值轴、条长按数值等比绘制 · 预印本未经同行评审</text>
</svg>
