<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#F0F0F0"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#009E73">HybridQuestion 从 2025 年 arXiv 新增超过 50 万篇论文中评选十大突破与十大问题；AI 与人类回顾判断高度对齐、前瞻判断明显分歧</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#009E73">a</text>
  <text x="82" y="104" font-size="15" fill="#009E73">评选中 AI 与人类的一致性（正文为定性结论，无量化数值，非数值刻度）</text>

  <g stroke="#009E73" stroke-width="0.75">
    <line x1="330" y1="160" x2="760" y2="160"/>
    <line x1="330" y1="252" x2="760" y2="252"/>
  </g>
  <g stroke="#009E73" stroke-width="0.75">
    <line x1="330" y1="160" x2="330" y2="164"/>
    <line x1="760" y1="160" x2="760" y2="164"/>
    <line x1="330" y1="252" x2="330" y2="256"/>
    <line x1="760" y1="252" x2="760" y2="256"/>
  </g>
  <text x="330" y="184" font-size="12" fill="#555" text-anchor="middle">低</text>
  <text x="760" y="184" font-size="12" fill="#555" text-anchor="middle">高</text>
  <text x="330" y="276" font-size="12" fill="#555" text-anchor="middle">低</text>
  <text x="760" y="276" font-size="12" fill="#555" text-anchor="middle">高</text>

  <text x="318" y="140" font-size="12.5" fill="#009E73" text-anchor="end">回顾性突破识别</text>
  <rect x="640" y="129" width="120" height="18" fill="#0072B2"/>
  <polygon points="760,129 782,138 760,147" fill="#0072B2"/>
  <text x="648" y="142" font-size="12" fill="#F0F0F0">高度对齐</text>

  <text x="318" y="232" font-size="12.5" fill="#009E73" text-anchor="end">前瞻性科学问题</text>
  <rect x="380" y="221" width="130" height="18" fill="#D55E00"/>
  <polygon points="510,221 532,230 510,239" fill="#D55E00"/>
  <text x="388" y="234" font-size="12" fill="#F0F0F0">明显分歧</text>

  <text x="330" y="316" font-size="12" fill="#555">定性示意：条形位置表示正文「高度对齐／明显分歧」的相对方向，不代表任何数值刻度</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="378" font-size="15" font-weight="bold" fill="#009E73">b</text>
  <text x="82" y="378" font-size="15" fill="#009E73">评选规模与 AI 领域三大突破（正文口径）</text>
  <g font-size="12" fill="#555">
    <text x="60" y="412">背景：仅 2025 年 arXiv 新增超过 50 万篇论文；评选覆盖人工智能、物理学、化学、生物学、经济学五个学科</text>
    <text x="60" y="444" font-size="12.5" fill="#009E73">DeepSeek-R1-Zero：纯强化学习解锁推理，涌现自我验证与反思行为</text>
    <text x="60" y="468" font-size="12.5" fill="#009E73">AI Co-Scientist：独立完成文献调研、假设生成与实验设计</text>
    <text x="60" y="492" font-size="12.5" fill="#009E73">Kimi K2.5 Agent Swarm：协调 100 多个子智能体，多模态任务对标闭源前沿模型</text>
  </g>

  <!-- ============ panel c ============ -->
  <text x="60" y="540" font-size="15" font-weight="bold" fill="#009E73">c</text>
  <text x="82" y="540" font-size="15" fill="#009E73">框架四要点与 2026 年十大问题（摘选，正文列举顺序）</text>
  <g font-size="12" fill="#555">
    <text x="60" y="572">四要点：多模型集成头脑风暴；结构化关键词筛选；AI 初筛 + 领域专家多阶段投票；回顾与前瞻双轨解耦</text>
    <text x="60" y="596">十大问题摘选：开放世界因果推理；可执行的 3D 世界模型；纯强化学习的能力边界；AI 能否做出真正原创的科学发现</text>
  </g>
  <circle cx="66" cy="620" r="5" fill="#0072B2"/>
  <text x="80" y="624" font-size="12" fill="#555">蓝色为回顾性（已被验证）</text>
  <circle cx="290" cy="620" r="5" fill="#D55E00"/>
  <text x="304" y="624" font-size="12" fill="#555">朱色为前瞻性（主角）</text>

  <!-- footnote -->
  <text x="60" y="652" font-size="11" fill="#767676">数据：arXiv:2602.03849（HybridQuestion，论文自测口径）· 一致性结论为正文定性表述，a 面板为定性示意、无数值刻度 · 正文未报告误差区间，未画误差棒 · 预印本未经同行评审</text>
</svg>
