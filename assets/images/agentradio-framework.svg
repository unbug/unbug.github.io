<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9C9484; }
      .rl { font-size: 15px; fill: #474C54; }
      .val { font-size: 18px; font-weight: 700; fill: #1A1B1E; }
      .b { font-size: 12px; fill: #A5A296; }
      .chip { font-size: 12.5px; font-weight: 600; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6F3FB"/>
    </linearGradient>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C3FC5"/><stop offset="1" stop-color="#9B72DF"/>
    </linearGradient>
    <linearGradient id="gRose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D1477E"/><stop offset="1" stop-color="#E87BA4"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DFA02C"/><stop offset="1" stop-color="#EFC368"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E9E8F"/><stop offset="1" stop-color="#6BC4B7"/>
    </linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3E7CB8"/><stop offset="1" stop-color="#7CAAD8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1105" cy="110" r="140" fill="#6C3FC5" opacity="0.07"/>
  <circle cx="70" cy="620" r="115" fill="#DFA02C" opacity="0.07"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gViolet)"/>

  <text class="k" x="64" y="84">一分钟读论文 · ARXIV:2607.28430 · GEORGIA TECH 等</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">边干活，边听台</text>
  <text x="64" y="158" font-size="15" fill="#5B6068">被动感知：后台监听队友消息，前台工作不中断</text>

  <!-- radio tower motif -->
  <g>
    <path d="M 1092 60 L 1072 160 M 1092 60 L 1112 160" stroke="#6C3FC5" stroke-width="4" stroke-linecap="round"/>
    <line x1="1079" y1="128" x2="1105" y2="128" stroke="#6C3FC5" stroke-width="3"/>
    <line x1="1083" y1="104" x2="1101" y2="104" stroke="#6C3FC5" stroke-width="3"/>
    <circle cx="1092" cy="56" r="6" fill="#D1477E"/>
    <path d="M 1062 74 a 42 42 0 0 1 0 -36" fill="none" stroke="#DFA02C" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 1050 84 a 58 58 0 0 1 0 -56" fill="none" stroke="#DFA02C" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <path d="M 1122 74 a 42 42 0 0 0 0 -36" fill="none" stroke="#2E9E8F" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 1134 84 a 58 58 0 0 0 0 -56" fill="none" stroke="#2E9E8F" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- dumbbell chart: single agent (hollow) vs AgentRadio (solid), pp gap -->
  <g>
    <rect x="64" y="196" width="700" height="66" fill="#6C3FC5" opacity="0.07"/>
    <rect x="64" y="276" width="700" height="66" fill="#6C3FC5" opacity="0.07"/>
    <rect x="64" y="356" width="700" height="66" fill="#6C3FC5" opacity="0.07"/>

    <text class="rl" x="236" y="234" text-anchor="end">单 Agent · Opus 4.6</text>
    <line x1="290" y1="229" x2="539.8" y2="229" stroke="url(#gViolet)" stroke-width="3"/>
    <circle cx="290" cy="229" r="7" fill="#FFFFFF" stroke="#3E7CB8" stroke-width="3"/>
    <circle cx="539.8" cy="229" r="9" fill="url(#gViolet)"/>
    <text class="val" x="558" y="236" fill="#6C3FC5">32.3%</text>
    <text class="b" x="628" y="235">+29.8 个百分点</text>

    <text class="rl" x="236" y="314" text-anchor="end">单 Agent · Opus 4.8</text>
    <line x1="290" y1="309" x2="680.7" y2="309" stroke="url(#gViolet)" stroke-width="3"/>
    <circle cx="290" cy="309" r="7" fill="#FFFFFF" stroke="#3E7CB8" stroke-width="3"/>
    <circle cx="680.7" cy="309" r="9" fill="url(#gViolet)"/>
    <text class="val" x="699" y="316" fill="#6C3FC5">57.2%</text>

    <text class="rl" x="236" y="394" text-anchor="end">AgentRadio × 4</text>
    <line x1="290" y1="389" x2="722.8" y2="389" stroke="url(#gViolet)" stroke-width="3.5"/>
    <circle cx="290" cy="389" r="7" fill="#FFFFFF" stroke="#3E7CB8" stroke-width="3"/>
    <circle cx="722.8" cy="389" r="10" fill="url(#gViolet)"/>
    <text class="val" x="742" y="396" fill="#6C3FC5">62.1%</text>

    <line x1="290" y1="440" x2="790" y2="440" stroke="#CFC7B2" stroke-width="1.5"/>
    <text class="b" x="290" y="462">0%</text>
    <text class="b" x="540" y="462" text-anchor="middle">25%</text>
    <text class="b" x="790" y="462" text-anchor="middle">50% · 解决率</text>
  </g>

  <!-- right column -->
  <g>
    <rect x="850" y="196" width="290" height="86" rx="12" fill="#D1477E" opacity="0.08"/>
    <text class="serif" x="870" y="248" font-size="30" font-weight="700" fill="#D1477E">结构 &gt; 算力</text>
    <text x="870" y="270" font-size="12.5" fill="#6B7078">完整方案击败计算匹配的 best-of-6 采样</text>

    <text class="rl" x="870" y="330">best-of-6 对照</text>
    <text class="val" x="1120" y="330" text-anchor="end" fill="#6C3FC5">62.1 vs 37.9</text>
    <text class="b" x="870" y="352">同为 Opus 4.6 · 同样计算量</text>

    <text class="rl" x="870" y="396">被动感知单独增益</text>
    <rect x="1032" y="380" width="70" height="18" rx="9" fill="url(#gAmber)" opacity="0.9"/>
    <text x="1067" y="394" text-anchor="middle" class="chip" fill="#6B4A0E">+10.5 分</text>
    <rect x="870" y="408" width="70" height="18" rx="9" fill="url(#gTeal)" opacity="0.9"/>
    <text x="905" y="422" text-anchor="middle" class="chip" fill="#12554B">+11.3 分</text>
    <text class="b" x="952" y="394">Opus 4.6 上</text>
    <text class="b" x="952" y="422">DeepSeek V4 Pro 上</text>

    <text class="rl" x="870" y="466">任务越难，增益越大</text>
    <text class="b" x="870" y="488">与「中途修正」为核心机制的假设一致</text>
  </g>

  <!-- bottom: three primitives -->
  <line x1="64" y1="512" x2="1136" y2="512" stroke="#EBE5D6"/>
  <g>
    <rect x="64" y="534" width="128" height="28" rx="14" fill="url(#gSky)" opacity="0.22"/>
    <text x="128" y="553" text-anchor="middle" class="chip" fill="#2E5E93">开对话线程</text>
    <text x="200" y="553" fill="#8B8574" font-size="14">→</text>
    <rect x="218" y="534" width="128" height="28" rx="14" fill="url(#gTeal)" opacity="0.22"/>
    <text x="282" y="553" text-anchor="middle" class="chip" fill="#1E6E62">发后即走</text>
    <text x="354" y="553" fill="#8B8574" font-size="14">→</text>
    <rect x="372" y="534" width="150" height="28" rx="14" fill="url(#gAmber)" opacity="0.28"/>
    <text x="447" y="553" text-anchor="middle" class="chip" fill="#7A5610">后台等 @ 提及</text>
    <text class="b" x="540" y="553">三原语：create_thread · send_message · wait_for_mention</text>
  </g>
  <text class="serif" x="64" y="606" font-size="18" fill="#1A1B1E">通信不该打断计算 —— 发现即刻广播，不必等阶段边界。</text>
  <text class="b" x="1136" y="606" text-anchor="end">SWE-Atlas QnA · 124 题 × 11 个生产代码库 · 预印本未经同行评审 · Micropaper</text>
</svg>
