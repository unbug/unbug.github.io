<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">一年间 MCP 从内部实验变为行业标准：SDK 月下载量达 9700 万次，活跃服务器超过 10,000 个，四大厂商共同背书</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">生态规模关键指标（数值条形，刻度仅标记对应指标）</text>

  <!-- gridlines -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="560" y1="140" x2="560" y2="300"/>
    <line x1="1000" y1="140" x2="1000" y2="300"/>
  </g>

  <!-- bar 1: SDK monthly downloads 9700 wan -->
  <text x="300" y="185" font-size="12.5" fill="#1A1B1E" text-anchor="end">SDK 月下载量</text>
  <rect x="320" y="170" width="680" height="22" fill="#0072B2"/>
  <text x="1010" y="185" font-size="12" fill="#555">9700 万次 / 月</text>

  <!-- bar 2: active servers -->
  <text x="300" y="275" font-size="12.5" fill="#1A1B1E" text-anchor="end">活跃服务器</text>
  <rect x="320" y="260" width="440" height="22" fill="#D55E00"/>
  <polygon points="760,260 772,271 760,282" fill="#D55E00"/>
  <text x="782" y="275" font-size="12" fill="#555">10,000+（正文仅给出下限，箭头表示不少于该值）</text>

  <!-- value axis -->
  <line x1="320" y1="320" x2="1000" y2="320" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="320" y1="320" x2="320" y2="324"/>
    <line x1="560" y1="320" x2="560" y2="324"/>
    <line x1="1000" y1="320" x2="1000" y2="324"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="320" y="344">0</text>
    <text x="560" y="344">10,000</text>
    <text x="1000" y="344">9700 万</text>
  </g>
  <text x="660" y="372" font-size="14" fill="#1A1B1E" text-anchor="middle">规模（条形长度按正文数量级示意，非同尺度数值轴）</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="420" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="420" font-size="15" fill="#1A1B1E">AAIF 创始成员：四大厂商共同背书</text>
  <g font-size="12.5" fill="#555">
    <text x="82" y="456">Anthropic · OpenAI · Google · Microsoft（AAIF，Agentic AI Foundation，智能体 AI 基金会）</text>
  </g>
  <g fill="#0072B2">
    <circle cx="120" cy="500" r="9"/>
    <circle cx="200" cy="500" r="9"/>
    <circle cx="280" cy="500" r="9"/>
    <circle cx="360" cy="500" r="9"/>
  </g>
  <g font-size="12" fill="#1A1B1E" text-anchor="middle">
    <text x="120" y="530">Anthropic</text>
    <text x="200" y="530">OpenAI</text>
    <text x="280" y="530">Google</text>
    <text x="360" y="530">Microsoft</text>
  </g>
  <text x="440" y="504" font-size="12" fill="#555">正文未给出各厂商加入的先后顺序与时间数值，故用等位点标记，不构成时间轴</text>

  <!-- ============ panel c ============ -->
  <text x="640" y="420" font-size="15" font-weight="bold" fill="#1A1B1E">c</text>
  <text x="662" y="420" font-size="15" fill="#1A1B1E">正文归纳的五项技术设计（定性要点）</text>
  <g font-size="12" fill="#555">
    <text x="640" y="452">标准化协议：统一的模型-工具交互规范，替代私有插件接口</text>
    <text x="640" y="474">多语言 SDK：写几十行代码即可上线一个服务器插件</text>
    <text x="640" y="496">服务器架构：任何工具以独立进程接入，支持生态分工</text>
    <text x="640" y="518">安全机制：内置对 AI 与工具交互的控制，回应数据边界顾虑</text>
    <text x="640" y="540">可扩展性：模块化设计，扩展功能不必改动协议本身</text>
  </g>
  <circle cx="646" cy="566" r="5" fill="#999999"/>
  <text x="660" y="570" font-size="12" fill="#555">定性要点无数值支撑，不进入坐标系</text>

  <!-- footnote -->
  <text x="60" y="640" font-size="11" fill="#767676">数据：Leonardo Piñeyro 与 Pento《A Year of MCP》（modelcontextprotocol.io，标准演化一手观察记录，非实证论文）· 9700 万为月下载量、10,000+ 为活跃服务器下限，均为正文自述口径</text>
</svg>
