<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">一年内从内部实验成为行业标准：SDK 月下载量 9700 万次，活跃服务器超过 10,000 个，四大厂商共同背书</text>

  <!-- ===== panel a: adoption metrics ===== -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">采用规模指标（回顾文章报告值）</text>

  <!-- SDK downloads bar: value axis x = 250 + 9e-6*v (97,000,000 -> 1123) -->
  <text x="238" y="152" font-size="12.5" fill="#1A1B1E" text-anchor="end">SDK 月下载量（次）</text>
  <rect x="250" y="138" width="873" height="18" fill="#0072B2"/>
  <text x="1123" y="130" font-size="12" fill="#555" text-anchor="end">9700 万</text>

  <!-- servers bar (log-ish mismatch handled in separate mini axis): use annotation style -->
  <text x="238" y="202" font-size="12.5" fill="#1A1B1E" text-anchor="end">活跃服务器（个）</text>
  <rect x="250" y="188" width="90" height="18" fill="#D55E00"/>
  <text x="348" y="202" font-size="12" fill="#555">10,000+（生态已能自我造血）</text>

  <!-- note: different magnitudes note -->
  <text x="250" y="238" font-size="12" fill="#555">两项指标量级不同，条长为示意；具体数值以标注为准</text>

  <!-- ===== panel b: five technical design factors ===== -->
  <text x="60" y="300" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="300" font-size="15" fill="#1A1B1E">支撑标准化的五项技术设计（回顾归纳，非量化评级）</text>

  <g font-size="13" fill="#1A1B1E">
    <rect x="100" y="330" width="188" height="56" fill="none" stroke="#0072B2" stroke-width="1.5"/>
    <text x="194" y="354" text-anchor="middle">标准化协议</text>
    <text x="194" y="374" font-size="11.5" fill="#555" text-anchor="middle">统一模型-工具交互规范</text>

    <rect x="316" y="330" width="188" height="56" fill="none" stroke="#0072B2" stroke-width="1.5"/>
    <text x="410" y="354" text-anchor="middle">多语言 SDK</text>
    <text x="410" y="374" font-size="11.5" fill="#555" text-anchor="middle">几十行代码即可上线插件</text>

    <rect x="532" y="330" width="188" height="56" fill="none" stroke="#0072B2" stroke-width="1.5"/>
    <text x="626" y="354" text-anchor="middle">服务器架构</text>
    <text x="626" y="374" font-size="11.5" fill="#555" text-anchor="middle">独立进程接入，支持生态分工</text>

    <rect x="748" y="330" width="188" height="56" fill="none" stroke="#0072B2" stroke-width="1.5"/>
    <text x="842" y="354" text-anchor="middle">安全机制</text>
    <text x="842" y="374" font-size="11.5" fill="#555" text-anchor="middle">AI 与工具交互的权限控制</text>

    <rect x="964" y="330" width="188" height="56" fill="none" stroke="#0072B2" stroke-width="1.5"/>
    <text x="1058" y="354" text-anchor="middle">可扩展性</text>
    <text x="1058" y="374" font-size="11.5" fill="#555" text-anchor="middle">扩展功能不改协议本身</text>
  </g>

  <!-- ===== panel c: ecosystem signal ===== -->
  <text x="60" y="452" font-size="15" font-weight="bold" fill="#1A1B1E">c</text>
  <text x="82" y="452" font-size="15" fill="#1A1B1E">生态信号：AAIF 创始成员四大厂商</text>

  <g font-size="13" fill="#1A1B1E">
    <circle cx="150" cy="505" r="34" fill="none" stroke="#D55E00" stroke-width="1.5"/>
    <text x="150" y="510" text-anchor="middle">Anthropic</text>
    <circle cx="330" cy="505" r="34" fill="none" stroke="#D55E00" stroke-width="1.5"/>
    <text x="330" y="510" text-anchor="middle">OpenAI</text>
    <circle cx="510" cy="505" r="34" fill="none" stroke="#D55E00" stroke-width="1.5"/>
    <text x="510" y="510" text-anchor="middle">Google</text>
    <circle cx="690" cy="505" r="34" fill="none" stroke="#D55E00" stroke-width="1.5"/>
    <text x="690" y="510" text-anchor="middle">Microsoft</text>
  </g>
  <line x1="184" y1="505" x2="296" y2="505" stroke="#999999" stroke-width="1.5"/>
  <line x1="364" y1="505" x2="476" y2="505" stroke="#999999" stroke-width="1.5"/>
  <line x1="544" y1="505" x2="656" y2="505" stroke="#999999" stroke-width="1.5"/>
  <text x="760" y="500" font-size="12" fill="#555">共同背书消除开发者选择成本，网络效应启动；</text>
  <text x="760" y="520" font-size="12" fill="#555">一年走完多数开放协议需要数年的路</text>

  <!-- footnote -->
  <text x="60" y="620" font-size="11" fill="#767676">数据：Leonardo Piñeyro 与 Pento 回顾文章（modelcontextprotocol.io）· 下载量与服务器数为文章报告口径 · 非实证论文，属标准演化的一手观察记录</text>
</svg>
