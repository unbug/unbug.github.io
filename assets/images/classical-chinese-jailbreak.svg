<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">古典语言可破解全部 6 个被测大模型的安全防线，文言文路线成功率达 100%，平均仅需 1.1 次查询</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">三种古典语言路线的论文报告成功率区间（%）</text>

  <!-- gridlines: x = 200 + 8*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="600" y1="126" x2="600" y2="330"/>
  </g>

  <!-- 文言文: 100% -->
  <text x="190" y="160" font-size="12.5" fill="#1A1B1E" text-anchor="end">文言文</text>
  <rect x="200" y="146" width="800" height="20" fill="#D55E00"/>
  <text x="1010" y="160" font-size="12" fill="#555">100%</text>

  <!-- 拉丁语: 94-100% -->
  <text x="190" y="228" font-size="12.5" fill="#1A1B1E" text-anchor="end">拉丁语</text>
  <rect x="952" y="214" width="48" height="20" fill="#999999"/>
  <line x1="952" y1="210" x2="952" y2="238" stroke="#999999" stroke-width="0.75"/>
  <line x1="1000" y1="210" x2="1000" y2="238" stroke="#999999" stroke-width="0.75"/>
  <text x="1010" y="228" font-size="12" fill="#555">94%–100%</text>

  <!-- 梵语: 94-98% -->
  <text x="190" y="296" font-size="12.5" fill="#1A1B1E" text-anchor="end">梵语</text>
  <rect x="952" y="282" width="32" height="20" fill="#999999"/>
  <line x1="952" y1="278" x2="952" y2="306" stroke="#999999" stroke-width="0.75"/>
  <line x1="984" y1="278" x2="984" y2="306" stroke="#999999" stroke-width="0.75"/>
  <text x="1010" y="296" font-size="12" fill="#555">94%–98%</text>

  <!-- value axis -->
  <line x1="200" y1="330" x2="1000" y2="330" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="1000" y1="330" x2="1000" y2="334"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="1000" y="350">100%</text>
  </g>
  <text x="600" y="374" font-size="14" fill="#1A1B1E" text-anchor="middle">攻击成功率（%，正文报告区间；区间以灰条表示）</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="424" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="424" font-size="15" fill="#1A1B1E">成功越狱所需查询次数（正文报告区间）</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="360" y1="446" x2="360" y2="530"/>
  </g>
  <text x="190" y="500" font-size="12.5" fill="#1A1B1E" text-anchor="end">全部攻击（6 模型）</text>
  <rect x="288" y="486" width="104" height="20" fill="#D55E00"/>
  <line x1="288" y1="482" x2="288" y2="510" stroke="#D55E00" stroke-width="0.75"/>
  <line x1="392" y1="482" x2="392" y2="510" stroke="#D55E00" stroke-width="0.75"/>
  <text x="402" y="500" font-size="12" fill="#555">1.1–2.4 次</text>

  <line x1="200" y1="530" x2="840" y2="530" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="360" y1="530" x2="360" y2="534"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="360" y="550">1 次</text>
  </g>
  <text x="520" y="574" font-size="14" fill="#1A1B1E" text-anchor="middle">查询次数（次）</text>

  <!-- footnote -->
  <text x="60" y="620" font-size="11" fill="#767676">数据：ICLR 2026《Classical Languages are Universal Jailbreak Keys for Large Language Models》（6 个主流大模型交叉测试，论文自测口径）</text>
  <text x="60" y="636" font-size="11" fill="#767676">区间为正文报告的成功率与查询次数范围 · 正文未给出分模型数值，故按语言路线汇总呈现 · 预印本未经同行评审</text>
</svg>
