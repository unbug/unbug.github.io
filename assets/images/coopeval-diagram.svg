<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">现代 LLM 在单次社交困境中一律背叛，推理能力越强合作越少；合约与调解两种机制最能促成合作</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">实验设计：机制 × 博弈的完整因子化（定性示意，非数值轴）</text>

  <!-- mechanism column -->
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <rect x="150" y="130" width="140" height="40" fill="#FFFFFF" stroke="#999999" stroke-width="0.75"/>
    <text x="220" y="147">重复博弈</text>
    <text x="220" y="163" font-size="11" fill="#555">直接互惠</text>
    <rect x="150" y="185" width="140" height="40" fill="#FFFFFF" stroke="#999999" stroke-width="0.75"/>
    <text x="220" y="202">声誉系统</text>
    <text x="220" y="218" font-size="11" fill="#555">间接互惠</text>
    <rect x="150" y="240" width="140" height="40" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/>
    <text x="220" y="257" fill="#D55E00">第三方调解</text>
    <text x="220" y="273" font-size="11" fill="#555">委托可信调解者</text>
    <rect x="150" y="295" width="140" height="40" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/>
    <text x="220" y="312" fill="#D55E00">合约协议</text>
    <text x="220" y="328" font-size="11" fill="#555">按结果条件付款</text>
  </g>
  <text x="220" y="120" font-size="12" fill="#555" text-anchor="middle">4 种合作机制</text>

  <!-- dilemma column -->
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <rect x="440" y="130" width="140" height="40" fill="#FFFFFF" stroke="#999999" stroke-width="0.75"/>
    <text x="510" y="155">囚徒困境</text>
    <rect x="440" y="185" width="140" height="40" fill="#FFFFFF" stroke="#999999" stroke-width="0.75"/>
    <text x="510" y="210">旅行者困境</text>
    <rect x="440" y="240" width="140" height="40" fill="#FFFFFF" stroke="#999999" stroke-width="0.75"/>
    <text x="510" y="265">信任博弈</text>
    <rect x="440" y="295" width="140" height="40" fill="#FFFFFF" stroke="#999999" stroke-width="0.75"/>
    <text x="510" y="320">公共物品博弈</text>
  </g>
  <text x="510" y="120" font-size="12" fill="#555" text-anchor="middle">4 类社交困境</text>

  <!-- factor lines (4x4) -->
  <g stroke="#D9D9D9" stroke-width="0.75">
    <line x1="290" y1="150" x2="440" y2="150"/><line x1="290" y1="150" x2="440" y2="205"/><line x1="290" y1="150" x2="440" y2="260"/><line x1="290" y1="150" x2="440" y2="315"/>
    <line x1="290" y1="205" x2="440" y2="150"/><line x1="290" y1="205" x2="440" y2="205"/><line x1="290" y1="205" x2="440" y2="260"/><line x1="290" y1="205" x2="440" y2="315"/>
    <line x1="290" y1="260" x2="440" y2="150"/><line x1="290" y1="260" x2="440" y2="205"/><line x1="290" y1="260" x2="440" y2="260"/><line x1="290" y1="260" x2="440" y2="315"/>
    <line x1="290" y1="315" x2="440" y2="150"/><line x1="290" y1="315" x2="440" y2="205"/><line x1="290" y1="315" x2="440" y2="260"/><line x1="290" y1="315" x2="440" y2="315"/>
  </g>

  <!-- arrow to eval -->
  <line x1="590" y1="232" x2="650" y2="232" stroke="#1A1B1E" stroke-width="1.5"/>
  <polygon points="650,226 662,232 650,238" fill="#1A1B1E"/>

  <!-- eval box -->
  <rect x="680" y="150" width="240" height="165" fill="#FFFFFF" stroke="#999999" stroke-width="0.75"/>
  <g font-size="12" fill="#555">
    <text x="696" y="176">交叉评估范围（正文数字）：</text>
    <text x="696" y="202">6 种 LLM 交叉对局</text>
    <text x="696" y="228">覆盖 20 多个合作问题</text>
    <text x="696" y="254">含推理模式开/关两种设定</text>
    <text x="696" y="280">复制子动力学模拟演化压力</text>
  </g>

  <!-- key finding box -->
  <rect x="950" y="150" width="190" height="165" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/>
  <g font-size="12">
    <text x="966" y="176" fill="#D55E00" font-weight="bold">一致行为</text>
    <text x="966" y="202" fill="#555">单次博弈中所有</text>
    <text x="966" y="220" fill="#555">现代 LLM 均背叛</text>
    <text x="966" y="250" fill="#555">推理能力越强</text>
    <text x="966" y="268" fill="#555">合作越少</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="60" y="408" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="404" font-size="15" fill="#1A1B1E">四种机制对高能力 LLM 的效果排序（定性档位，非数值轴）</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="330" y1="452" x2="1010" y2="452"/>
    <line x1="500" y1="452" x2="500" y2="590"/>
    <line x1="670" y1="452" x2="670" y2="590"/>
    <line x1="840" y1="452" x2="840" y2="590"/>
  </g>
  <g font-size="12.5" fill="#555" text-anchor="middle">
    <text x="415" y="442">效果最佳</text>
    <text x="585" y="442">效果好</text>
    <text x="755" y="442">中等效果</text>
    <text x="925" y="442">有限效果</text>
  </g>

  <!-- position x = 415 + 170*i -->
  <line x1="840" y1="456" x2="840" y2="590" stroke="#999999" stroke-width="0.75"/>
  <line x1="670" y1="456" x2="670" y2="590" stroke="#999999" stroke-width="0.75"/>
  <line x1="500" y1="456" x2="500" y2="590" stroke="#D55E00" stroke-width="0.75"/>
  <line x1="330" y1="456" x2="330" y2="590" stroke="#D55E00" stroke-width="0.75"/>

  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="320" y="459">合约协议</text>
    <text x="320" y="497">第三方调解</text>
    <text x="320" y="535">重复博弈</text>
    <text x="320" y="573">声誉系统</text>
  </g>
  <circle cx="415" cy="455" r="7" fill="#D55E00"/>
  <circle cx="585" cy="493" r="7" fill="#D55E00"/>
  <circle cx="755" cy="531" r="7" fill="#999999"/>
  <circle cx="925" cy="569" r="7" fill="#999999"/>

  <g font-size="11" fill="#555">
    <text x="430" y="459">条件补偿最有效</text>
    <text x="600" y="497">首次为 LLM 实现</text>
    <text x="770" y="535">对手变化时急剧退化</text>
    <text x="940" y="573">依赖理解历史信息的能力</text>
  </g>

  <text x="60" y="612" font-size="12" fill="#555">演化视角：在追求个人收益最大化的演化压力下，上述机制反而更有效（复制子动力学模拟结论）。</text>

  <!-- footnote -->
  <text x="60" y="640" font-size="11" fill="#767676">数据：arXiv:2604.15267《CoopEval》（ICML 2026 长文，6 种 LLM × 4 类社交困境 × 4 种机制，论文自测口径）· 正文未给出各机制量化效果数值，面板 b 为正文定性结论的档位序列示意，非测量数值 · 预印本未经同行评审</text>
</svg>
