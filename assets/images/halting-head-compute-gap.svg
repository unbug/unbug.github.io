<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 13px; letter-spacing: 3px; fill: #9A937F; }
      .t { font-size: 37px; font-weight: 700; fill: #1A1B1E; }
      .s { font-size: 15.5px; fill: #6E6A5C; }
      .rl { font-size: 15px; fill: #4C4A3F; }
      .v { font-size: 15px; font-weight: 600; fill: #1A1B1E; }
      .g { font-size: 12.5px; fill: #A29C88; }
      .ax { font-size: 12.5px; fill: #A29C88; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="#FBFAF7"/>
  <rect x="64" y="46" width="44" height="5" fill="#B5442E"/>

  <text class="k" x="64" y="86">一分钟读论文 NO.200 · ARXIV:2610.32246 · APPLE · 2026-10-23</text>
  <text class="serif t" x="64" y="134">省算力账本，在批次维度对不上</text>
  <text class="s" x="64" y="166">预测平均、退出规则实跑、批次实付是三个数 —— 约 100,000 GPU-hours、100+ 个从零预训练的循环语言模型实测</text>
  <line x1="64" y1="192" x2="1136" y2="192" stroke="#E5E1D4" stroke-width="1"/>

  <!-- hero: three-numbers dumbbell, axis 0..8 iterations -->
  <text class="k" x="64" y="238">同一批模型的上限 8 次迭代里，三个数各自站在哪</text>

  <!-- grid -->
  <g stroke="#EAE6DA" stroke-width="1">
    <line x1="260" y1="266" x2="260" y2="452"/><line x1="415" y1="266" x2="415" y2="452"/>
    <line x1="570" y1="266" x2="570" y2="452"/><line x1="725" y1="266" x2="725" y2="452"/>
  </g>
  <line x1="880" y1="266" x2="880" y2="452" stroke="#B5442E" stroke-width="1" stroke-dasharray="4 4" opacity="0.55"/>
  <text class="ax" x="880" y="258" text-anchor="middle">跑满 8</text>
  <text class="ax" x="260" y="474" text-anchor="middle">0</text>
  <text class="ax" x="415" y="474" text-anchor="middle">2</text>
  <text class="ax" x="570" y="474" text-anchor="middle">4</text>
  <text class="ax" x="725" y="474" text-anchor="middle">6</text>
  <text class="ax" x="840" y="474" text-anchor="middle">迭代次数（cap 8）</text>

  <!-- row 1 predicted 3.7 -->
  <text class="rl" x="236" y="301" text-anchor="end">head 预测均值 E[N]</text>
  <circle cx="546.8" cy="296" r="8" fill="#4E7D5B"/>
  <text class="v" x="566" y="301">3.7 —— 「不到一半」</text>

  <!-- row 2 batch 4.4-4.7 -->
  <text class="rl" x="236" y="371" text-anchor="end">32 序列批次实付</text>
  <line x1="601" y1="366" x2="624.3" y2="366" stroke="#B9892F" stroke-width="7" stroke-linecap="round"/>
  <circle cx="601" cy="366" r="4.5" fill="#FBFAF7" stroke="#B9892F" stroke-width="2"/>
  <text class="v" x="644" y="371">4.4 – 4.7</text>

  <!-- row 3 exit rule 7.6-7.9 -->
  <text class="rl" x="236" y="441" text-anchor="end">退出规则实跑</text>
  <line x1="849" y1="436" x2="872.3" y2="436" stroke="#B5442E" stroke-width="7" stroke-linecap="round"/>
  <circle cx="849" cy="436" r="4.5" fill="#FBFAF7" stroke="#B5442E" stroke-width="2"/>
  <text class="v" x="660" y="441" text-anchor="end">7.6 – 7.9 · 等累计 90% 才放行 · 原文 save almost no compute</text>

  <!-- right stats column -->
  <line x1="960" y1="238" x2="960" y2="474" stroke="#E5E1D4"/>
  <text class="serif" x="984" y="282" font-size="25" font-weight="700" fill="#B5442E">0.0246 → 0.003</text>
  <text class="s" x="984" y="310" font-size="13.5">改在批次实付深度上对账，</text>
  <text class="s" x="984" y="330" font-size="13.5">质量领先塌掉大半</text>
  <text class="g" x="984" y="352">（770M 档位；140M / 370M 为平手）</text>

  <g>
    <text class="rl" x="984" y="392" font-size="13.5">自适应解码实测</text>
    <rect x="984" y="400" width="88" height="9" fill="#3D5A73"/>
    <text class="v" x="1082" y="409" font-size="13.5">1.6×</text>
    <text class="rl" x="984" y="432" font-size="13.5">按实跑步数固定深度</text>
    <rect x="984" y="440" width="126" height="9" fill="#B5442E"/>
    <text class="v" x="1120" y="449" font-size="13.5">2.3×</text>
    <text class="v" x="984" y="470" font-size="13.5">差额就是等最慢 token 的税</text>
  </g>

  <line x1="64" y1="540" x2="1136" y2="540" stroke="#E5E1D4"/>
  <text class="serif" x="64" y="584" font-size="20" fill="#1A1B1E">省是真的省过：固定深度解码仍全面领先，gate 的 token 分配在同均值深度下值 0.30 BPB。</text>
  <text class="s" x="64" y="612" font-size="13.5">但要分开报三个数。对已发布 Ouro 2.6B 的复测（该文自测口径）：token 省约 1/10 迭代，32 批次只剩约 1%。</text>
  <text class="g" x="64" y="644">结论逐字限于 for the halting heads we train（mixture / per-step 训练配置，规模至 1.3B / 104B tokens）· 不外推所有自适应深度方案 · Micropaper</text>
</svg>
