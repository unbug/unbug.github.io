<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">head 预测均值 3.7 个迭代，token 实跑 7.6–7.9 个；批次实付下质量领先从 0.0246 塌到 0.003 BPB</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">每 token 迭代数（个，上限 8）</text>

  <!-- rows: x = 290 + 40*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="330" y1="130" x2="330" y2="380"/>
    <line x1="450" y1="130" x2="450" y2="380"/>
    <line x1="570" y1="130" x2="570" y2="380"/>
  </g>

  <text x="278" y="163" font-size="12.5" fill="#1A1B1E" text-anchor="end">head 预测均值（mixture loss）</text>
  <rect x="290" y="150" width="148" height="18" fill="#999999"/>
  <text x="446" y="163" font-size="12" fill="#555">3.7</text>

  <text x="278" y="208" font-size="12.5" fill="#1A1B1E" text-anchor="end">exit rule 实跑（停止概率累计 90%）</text>
  <rect x="594" y="195" width="12" height="18" fill="#D55E00"/>
  <text x="614" y="208" font-size="12" fill="#555">7.6–7.9</text>

  <text x="278" y="253" font-size="12.5" fill="#1A1B1E" text-anchor="end">per-step loss 后 token 实停</text>
  <rect x="290" y="240" width="120" height="18" fill="#0072B2"/>
  <text x="418" y="253" font-size="12" fill="#555">约 3</text>

  <text x="278" y="298" font-size="12.5" fill="#1A1B1E" text-anchor="end">32 条序列批次实付（per-step 后）</text>
  <rect x="290" y="285" width="176" height="18" fill="#0072B2" opacity="0.35"/>
  <line x1="466" y1="282" x2="466" y2="306" stroke="#0072B2" stroke-width="2" stroke-dasharray="3 2"/>
  <line x1="478" y1="282" x2="478" y2="306" stroke="#0072B2" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="486" y="298" font-size="12" fill="#555">4.4–4.7</text>

  <!-- value axis -->
  <line x1="290" y1="380" x2="610" y2="380" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="290" y1="380" x2="290" y2="384"/>
    <line x1="330" y1="380" x2="330" y2="384"/>
    <line x1="450" y1="380" x2="450" y2="384"/>
    <line x1="570" y1="380" x2="570" y2="384"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="290" y="400">0</text>
    <text x="330" y="400">1</text>
    <text x="450" y="400">4</text>
    <text x="570" y="400">7</text>
  </g>
  <text x="450" y="424" font-size="14" fill="#1A1B1E" text-anchor="middle">迭代数（个）</text>
  <g font-size="12" fill="#555">
    <line x1="290" y1="337" x2="310" y2="337" stroke="#0072B2" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="316" y="341">论文报告「约」值/区间</text>
    <text x="290" y="365">exit rule 实跑区间两端已画出；行业惯例称可省 50%（规则跳过估算，非实测运行时间）</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="700" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="722" y="104" font-size="15" fill="#1A1B1E">质量领先幅度（BPB，越低越好，对无头基线）</text>

  <!-- rows: x = 880 + 14000*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="1014" y1="130" x2="1014" y2="290"/>
  </g>

  <text x="868" y="163" font-size="12.5" fill="#1A1B1E" text-anchor="end">token 平均深度口径（770M，Table 1 三档最大值）</text>
  <rect x="880" y="150" width="71.75" height="18" fill="#999999"/>
  <text x="959" y="163" font-size="12" fill="#555">0.0246</text>

  <text x="868" y="208" font-size="12.5" fill="#1A1B1E" text-anchor="end">批次实付深度口径（770M）</text>
  <rect x="880" y="200" width="4.5" height="18" fill="#D55E00"/>
  <text x="892" y="213" font-size="12" fill="#555">0.003</text>

  <!-- value axis -->
  <line x1="880" y1="290" x2="1100" y2="290" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="880" y1="290" x2="880" y2="294"/>
    <line x1="1014" y1="290" x2="1014" y2="294"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="880" y="310">0</text>
    <text x="1014" y="310">0.0246</text>
  </g>
  <text x="990" y="334" font-size="14" fill="#1A1B1E" text-anchor="middle">质量领先（BPB）</text>

  <!-- panel b notes -->
  <text x="700" y="368" font-size="12" fill="#555">训练前上界测试：瞄准 3 次迭代的 head，单序列解码上界约 0.03 BPB，</text>
  <text x="700" y="386" font-size="12" fill="#555">32 序列批次下缩到约 0.01</text>

  <!-- timing notes -->
  <text x="60" y="452" font-size="12" fill="#555">370M 计时实测：批次比固定跑满 8 次快约 1.6 倍；按实跑步数固定深度跑同一份权重本可快 2.3 倍，差额即等待最慢 token 的成本。</text>
  <text x="60" y="474" font-size="12" fill="#555">Ouro 2.6B 复测（该文自测口径，非 Ouro 官方结论）：token 平均省约 1/10 迭代，32 token 批次只省约 1%；门控分配值 0.30 BPB。</text>

  <!-- footnote -->
  <text x="60" y="524" font-size="11" fill="#767676">数据：arXiv:2610.32246（Apple，140M–1.3B 从零预训练，约 100,000 GPU-hours，超 100 个模型）· 论文自测口径；结论限于该文训练的 halting heads 配置 · 预印本未经同行评审</text>
</svg>
