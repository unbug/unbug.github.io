<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="1200" height="520" fill="#FFFFFF"/>
<text x="600" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#1F2937">Monitor 三职责：检测 · 归因 · 升级</text>
<rect x="80" y="90" width="320" height="150" rx="10" fill="#EAF2FB" stroke="#2F6FB2" stroke-width="2"/>
<text x="240" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">1 检测</text>
<text x="240" y="152" text-anchor="middle" font-size="14" fill="#374151">状态 vs 计划前置假设 逐条对照</text>
<text x="240" y="177" text-anchor="middle" font-size="14" fill="#374151">能确定性判断的绝不交给模型</text>
<text x="240" y="205" text-anchor="middle" font-size="13" fill="#C0392B">假阳性率决定 replan 风暴频率</text>
<rect x="440" y="90" width="320" height="150" rx="10" fill="#EAF6EF" stroke="#166534" stroke-width="2"/>
<text x="600" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#14532D">2 归因</text>
<text x="600" y="152" text-anchor="middle" font-size="14" fill="#374151">瞬态 · 结构性 · 依赖失效</text>
<text x="600" y="177" text-anchor="middle" font-size="14" fill="#374151">预算越界 · 价值性失败</text>
<text x="600" y="205" text-anchor="middle" font-size="13" fill="#C0392B">混分类是编排系统慢性病</text>
<rect x="800" y="90" width="320" height="150" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
<text x="960" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#7F1D1D">3 升级</text>
<text x="960" y="152" text-anchor="middle" font-size="14" fill="#374151">重试→局部改写→重规划→上报</text>
<text x="960" y="177" text-anchor="middle" font-size="14" fill="#374151">每层次数上限显式写死</text>
<text x="960" y="205" text-anchor="middle" font-size="13" fill="#7F1D1D">路径尽头必须是人</text>
<defs><marker id="m2" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#1F2937"/></marker></defs>
<line x1="400" y1="165" x2="438" y2="165" stroke="#1F2937" stroke-width="2.2" marker-end="url(#m2)"/>
<line x1="760" y1="165" x2="798" y2="165" stroke="#1F2937" stroke-width="2.2" marker-end="url(#m2)"/>
<rect x="150" y="290" width="900" height="80" rx="10" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.8"/>
<text x="600" y="322" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">共享数据底座（缺一样，Monitor 就退化成昂贵的日志）</text>
<text x="600" y="350" text-anchor="middle" font-size="15" fill="#374151">计划版本号 · 步骤指纹 · 假设清单 · 失败分类</text>
<rect x="150" y="400" width="900" height="72" rx="10" fill="#FDF6E3" stroke="#D1A400" stroke-width="1.6"/>
<text x="600" y="430" text-anchor="middle" font-size="15" fill="#374151">首版「最大重规划三次」方向正确；数值按任务返工成本调</text>
<text x="600" y="456" text-anchor="middle" font-size="15" fill="#374151">检测层不依赖 LLM 的程度，就是这套编排的可测试性上限</text>
</svg>
