<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9C9484; }
      .rl { font-size: 15px; fill: #474C54; }
      .val { font-size: 18px; font-weight: 700; fill: #1A1B1E; }
      .b { font-size: 12px; fill: #A5A296; }
      .chip { font-size: 12.5px; font-weight: 600; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F3EE"/>
    </linearGradient>
    <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#274B78"/><stop offset="1" stop-color="#52799F"/>
    </linearGradient>
    <linearGradient id="gWax" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5342B"/><stop offset="1" stop-color="#D4635A"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9892F"/><stop offset="1" stop-color="#DCB65F"/>
    </linearGradient>
    <linearGradient id="gJade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D8B67"/><stop offset="1" stop-color="#77B894"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E8B93"/><stop offset="1" stop-color="#6FBAC0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1105" cy="110" r="140" fill="#274B78" opacity="0.06"/>
  <circle cx="70" cy="620" r="115" fill="#B5342B" opacity="0.06"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gWax)"/>

  <text class="k" x="64" y="84">一分钟读论文 · ARXIV:2607.27429 · UNIV. OF WASHINGTON 等</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">好结果掩盖烂工序</text>
  <text x="64" y="158" font-size="15" fill="#5B6068">iCORE 把合作图 G、义务图 Q、审计映射 Π 捆成一套可审计账本 X=(G,Q,Π)</text>

  <!-- audit stamp motif -->
  <g>
    <rect x="1016" y="66" width="104" height="82" rx="3" fill="#FFFFFF" stroke="#DCD5C2" stroke-width="1.5"/>
    <line x1="1030" y1="88" x2="1106" y2="88" stroke="#C9C2AE" stroke-width="2"/>
    <line x1="1030" y1="104" x2="1106" y2="104" stroke="#C9C2AE" stroke-width="2"/>
    <line x1="1030" y1="120" x2="1080" y2="120" stroke="#C9C2AE" stroke-width="2"/>
    <g transform="rotate(-12 1108 128)">
      <circle cx="1108" cy="128" r="30" fill="none" stroke="#B5342B" stroke-width="4" opacity="0.85"/>
      <circle cx="1108" cy="128" r="22" fill="none" stroke="#B5342B" stroke-width="1.5" opacity="0.7"/>
      <path d="M 1096 128 l 8 9 l 17 -18" fill="none" stroke="#B5342B" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    </g>
  </g>

  <!-- left dumbbell: passive full-state observation -> iCORE lift -->
  <g>
    <rect x="64" y="206" width="690" height="70" fill="#274B78" opacity="0.07"/>
    <rect x="64" y="294" width="690" height="70" fill="#274B78" opacity="0.07"/>
    <rect x="64" y="382" width="690" height="70" fill="#274B78" opacity="0.07"/>

    <text class="rl" x="252" y="246" text-anchor="end">控制执行 · 轨迹质量</text>
    <line x1="306" y1="241" x2="356.3" y2="241" stroke="url(#gNavy)" stroke-width="3"/>
    <circle cx="306" cy="241" r="7" fill="#FFFFFF" stroke="#2E8B93" stroke-width="3"/>
    <circle cx="356.3" cy="241" r="9" fill="url(#gNavy)"/>
    <text class="val" x="375" y="248" fill="#274B78">+11.5%</text>

    <text class="rl" x="252" y="334" text-anchor="end">控制执行 · 终端性能</text>
    <line x1="306" y1="329" x2="375.9" y2="329" stroke="url(#gNavy)" stroke-width="3"/>
    <circle cx="306" cy="329" r="7" fill="#FFFFFF" stroke="#2E8B93" stroke-width="3"/>
    <circle cx="375.9" cy="329" r="9" fill="url(#gNavy)"/>
    <text class="val" x="394" y="336" fill="#274B78">+15.1%</text>

    <text class="rl" x="252" y="422" text-anchor="end">真实 LLM · 轨迹质量</text>
    <line x1="306" y1="417" x2="448.8" y2="417" stroke="url(#gWax)" stroke-width="3.5"/>
    <circle cx="306" cy="417" r="7" fill="#FFFFFF" stroke="#2E8B93" stroke-width="3"/>
    <circle cx="448.8" cy="417" r="10" fill="url(#gWax)"/>
    <text class="val" x="467" y="424" fill="#B5342B">+26.4%</text>
    <text class="b" x="540" y="423">对比被动全状态观测</text>

    <line x1="306" y1="472" x2="620" y2="472" stroke="#CFC7B2" stroke-width="1.5"/>
    <text class="b" x="306" y="494">0（被动观测基线）</text>
    <text class="b" x="620" y="494" text-anchor="end">提升幅度</text>
  </g>

  <!-- right: triple repr + two certs -->
  <g>
    <rect x="836" y="206" width="304" height="92" rx="12" fill="#B9892F" opacity="0.09"/>
    <text class="serif" x="856" y="252" font-size="27" font-weight="700" fill="#8A6620">X = (G, Q, Π)</text>
    <text x="856" y="280" font-size="12.5" fill="#6B7078">合作图 × 义务图 × 审计映射，联合可验证</text>

    <text class="rl" x="856" y="344">认证一 · 工作健全性</text>
    <text class="b" x="856" y="366">每个活跃工作断言都有有限证明</text>
    <text class="rl" x="856" y="410">认证二 · 分配稳定性</text>
    <text class="b" x="856" y="432">没有替代 Agent 能多贡献超过 ε</text>

    <text class="serif" x="856" y="492" font-size="18" fill="#B5342B">合理输出 ≠ 健全过程</text>
  </g>

  <!-- bottom chips -->
  <line x1="64" y1="520" x2="1136" y2="520" stroke="#E8E3D2"/>
  <g>
    <rect x="64" y="540" width="112" height="28" rx="14" fill="url(#gNavy)" opacity="0.16"/>
    <text x="120" y="559" text-anchor="middle" class="chip" fill="#274B78">消息传递</text>
    <text x="184" y="559" fill="#8B8574" font-size="14">→ G</text>
    <rect x="216" y="540" width="112" height="28" rx="14" fill="url(#gTeal)" opacity="0.2"/>
    <text x="272" y="559" text-anchor="middle" class="chip" fill="#1F6368">工具协调</text>
    <text x="336" y="559" fill="#8B8574" font-size="14">→ G</text>
    <rect x="368" y="540" width="112" height="28" rx="14" fill="url(#gJade)" opacity="0.2"/>
    <text x="424" y="559" text-anchor="middle" class="chip" fill="#2C6B4C">责任归属</text>
    <text x="488" y="559" fill="#8B8574" font-size="14">→ Q</text>
    <rect x="520" y="540" width="112" height="28" rx="14" fill="url(#gGold)" opacity="0.26"/>
    <text x="576" y="559" text-anchor="middle" class="chip" fill="#7A5A14">状态转换证据</text>
    <text x="640" y="559" fill="#8B8574" font-size="14">→ Π</text>
  </g>
  <text class="serif" x="64" y="618" font-size="18" fill="#1A1B1E">审计不是事后录像，而是把合作与义务捆在一起的过程盖章。</text>
  <text class="b" x="1136" y="618" text-anchor="end">两种执行模式评估 · 提升为论文自述口径 · 预印本未经同行评审 · Micropaper</text>
</svg>
