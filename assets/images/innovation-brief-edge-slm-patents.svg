<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">三件端侧小模型专利在 2026-05-14 至 2026-08-20 先后公开，全部主张数据不出设备</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">三件已公开申请（审查中）：公开日期时间轴</text>

  <!-- gridlines (month majors, 0.5pt) -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="200" y1="126" x2="200" y2="330"/>
    <line x1="360" y1="126" x2="360" y2="330"/>
    <line x1="520" y1="126" x2="520" y2="330"/>
    <line x1="680" y1="126" x2="680" y2="330"/>
  </g>

  <!-- hollow circles = published application (pending) -->
  <!-- Mercedes-Benz 2026-05-14: x = 200 + 160*(13/31) = 267.1 -->
  <circle cx="267.1" cy="168" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <text x="267.1" y="150" font-size="12" fill="#1A1B1E" text-anchor="middle">2026-05-14</text>
  <text x="267.1" y="192" font-size="12" fill="#555" text-anchor="middle">Mercedes-Benz</text>
  <text x="267.1" y="208" font-size="12" fill="#555" text-anchor="middle">US20260133859A1</text>
  <text x="267.1" y="224" font-size="12" fill="#555" text-anchor="middle">SLM 剪枝，车机跑通函数调用</text>

  <!-- Microsoft 2026-06-18: x = 360 + 160*(17/30) = 450.7 -->
  <circle cx="450.7" cy="226" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <text x="450.7" y="208" font-size="12" fill="#1A1B1E" text-anchor="middle">2026-06-18</text>
  <text x="450.7" y="250" font-size="12" fill="#555" text-anchor="middle">Microsoft</text>
  <text x="450.7" y="266" font-size="12" fill="#555" text-anchor="middle">US20260169789A1</text>
  <text x="450.7" y="282" font-size="12" fill="#555" text-anchor="middle">边云分层，逐级升级处理</text>

  <!-- Blockchain Labs 2026-08-20: x = 680 + 160*(19/31) = 778.1 -->
  <circle cx="778.1" cy="254" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <text x="778.1" y="236" font-size="12" fill="#1A1B1E" text-anchor="middle">2026-08-20</text>
  <text x="778.1" y="278" font-size="12" fill="#555" text-anchor="middle">Blockchain Labs</text>
  <text x="778.1" y="294" font-size="12" fill="#555" text-anchor="middle">US20260246629A1</text>
  <text x="778.1" y="310" font-size="12" fill="#555" text-anchor="middle">设备私钥签名的个人数据集</text>

  <!-- value axis -->
  <line x1="200" y1="330" x2="800" y2="330" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="200" y1="330" x2="200" y2="334"/>
    <line x1="360" y1="330" x2="360" y2="334"/>
    <line x1="520" y1="330" x2="520" y2="334"/>
    <line x1="680" y1="330" x2="680" y2="334"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="200" y="354">5 月</text>
    <text x="360" y="354">6 月</text>
    <text x="520" y="354">7 月</text>
    <text x="680" y="354">8 月</text>
  </g>
  <text x="500" y="382" font-size="14" fill="#1A1B1E" text-anchor="middle">公开日期（2026 年，月内按日定位）</text>

  <!-- legend / note -->
  <text x="60" y="415" font-size="12" fill="#555">空心 = 已公开申请（审查中），不是授权专利。共同点：本地数据溯源签名 · 跨设备模型分层 · 领域剪枝</text>

  <!-- side evidence note -->
  <text x="860" y="180" font-size="12" fill="#555">开源运行时已商品化：</text>
  <text x="860" y="200" font-size="12" fill="#555">llama.cpp star 数超 12.7 万</text>
  <text x="860" y="218" font-size="12" fill="#555">（正文引用值）</text>
  <text x="860" y="248" font-size="12" fill="#555">空档：哪个量化版在谁的</text>
  <text x="860" y="266" font-size="12" fill="#555">硬件上够快，没有可验证的</text>
  <text x="860" y="284" font-size="12" fill="#555">公开产品</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="472" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="472" font-size="15" fill="#1A1B1E">正文自估口径：两类交付的定价区间（元）</text>

  <!-- single scale line: 0 at x=210, 30000 at x=930 (0.024 元/px) -->
  <line x1="210" y1="598" x2="930" y2="598" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="210" y1="598" x2="210" y2="602"/>
    <line x1="930" y1="598" x2="930" y2="602"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E">
    <text x="210" y="622" text-anchor="middle">0</text>
    <text x="930" y="622" text-anchor="middle">30000</text>
  </g>
  <text x="570" y="648" font-size="14" fill="#1A1B1E" text-anchor="middle">定价区间（元）</text>

  <!-- 选型报告 ¥99-499: x 212.4 - 222 (too narrow: marker + label) -->
  <text x="200" y="521" font-size="12.5" fill="#1A1B1E" text-anchor="end">选型报告 / 份</text>
  <rect x="212.4" y="507" width="9.6" height="18" fill="#0072B2"/>
  <text x="232" y="521" font-size="12" fill="#555">¥99–499 / 份（或年订阅）</text>

  <!-- 部署交付包 ¥5000-30000: x 330 - 930 -->
  <text x="200" y="569" font-size="12.5" fill="#1A1B1E" text-anchor="end">部署交付包 / 单</text>
  <rect x="330" y="555" width="600" height="18" fill="#0072B2"/>
  <line x1="330" y1="552" x2="330" y2="576" stroke="#0072B2" stroke-width="0.75"/>
  <line x1="930" y1="552" x2="930" y2="576" stroke="#0072B2" stroke-width="0.75"/>
  <text x="340" y="569" font-size="12" fill="#FFFFFF">¥5000–30000 / 单</text>

  <!-- panel b side note -->
  <text x="60" y="440" font-size="12" fill="#555">交付门槛（正文自估）：1 人 2–4 周出 MVP；定价为正文自估口径，非市场实测。</text>

  <!-- footnote -->
  <text x="620" y="440" font-size="11" fill="#767676">数据：Free Patents Online 三件已公开申请 · star 数为正文引用值</text>
</svg>
