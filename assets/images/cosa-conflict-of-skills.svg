<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Noto Serif SC','Songti SC',serif">
  <defs>
    <linearGradient id="gFelt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E7C59"/><stop offset="1" stop-color="#6FA97F"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9892F"/><stop offset="1" stop-color="#D9B65E"/>
    </linearGradient>
    <linearGradient id="gRose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5442E"/><stop offset="1" stop-color="#E07B5C"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F7D8C"/><stop offset="1" stop-color="#69B3BF"/>
    </linearGradient>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E5E8C"/><stop offset="1" stop-color="#5B8FBF"/>
    </linearGradient>
    <linearGradient id="gPlum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C4A6E"/><stop offset="1" stop-color="#B27BA0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#FBFAF7"/>
  <rect x="60" y="40" width="44" height="5" fill="#B5442E"/>

  <text x="60" y="64" font-size="13" letter-spacing="3" fill="#9A937F">一分钟读论文 NO.202 · ARXIV:2610.35082</text>
  <text x="60" y="112" font-size="37" font-weight="bold" fill="#1A1B1E">单张张张合规，凑一桌就胡牌</text>
  <text x="60" y="143" font-size="15.5" fill="#6E6A5C">往技能池加入占比 ≤5% 的「局部合规」牌张，组合技能就能越权出牌</text>
  <line x1="60" y1="162" x2="1140" y2="162" stroke="#E5E1D4" stroke-width="1"/>

  <!-- 牌桌主视觉 -->
  <rect x="60" y="182" width="560" height="252" fill="url(#gFelt)" opacity="0.14"/>
  <rect x="60" y="182" width="560" height="6" fill="url(#gFelt)" opacity="0.55"/>
  <text x="84" y="216" font-size="13" letter-spacing="2.5" fill="#3E7C59">牌桌 · 三个单检合规的技能</text>

  <!-- 三张牌 -->
  <g>
    <rect x="96" y="238" width="86" height="118" fill="#FFFDF6" stroke="#D8D2BF" stroke-width="1"/>
    <rect x="96" y="238" width="86" height="8" fill="url(#gIndigo)"/>
    <circle cx="139" cy="292" r="17" fill="url(#gIndigo)" opacity="0.85"/>
    <text x="139" y="340" font-size="14" fill="#1A1B1E" text-anchor="middle">查状态</text>
  </g>
  <g>
    <rect x="206" y="238" width="86" height="118" fill="#FFFDF6" stroke="#D8D2BF" stroke-width="1"/>
    <rect x="206" y="238" width="86" height="8" fill="url(#gTeal)"/>
    <rect x="130" y="0" width="0" height="0"/>
    <rect x="231" y="276" width="36" height="32" fill="none" stroke="#2F7D8C" stroke-width="2.5"/>
    <line x1="231" y1="286" x2="267" y2="286" stroke="#2F7D8C" stroke-width="2"/>
    <text x="249" y="340" font-size="14" fill="#1A1B1E" text-anchor="middle">收材料</text>
  </g>
  <g>
    <rect x="316" y="238" width="86" height="118" fill="#FFFDF6" stroke="#D8D2BF" stroke-width="1"/>
    <rect x="316" y="238" width="86" height="8" fill="url(#gGold)"/>
    <polygon points="359,272 375,306 343,306" fill="none" stroke="#B9892F" stroke-width="2.5"/>
    <text x="359" y="340" font-size="14" fill="#1A1B1E" text-anchor="middle">跑校验</text>
  </g>

  <!-- 加牌 -->
  <line x1="428" y1="297" x2="466" y2="297" stroke="#9A937F" stroke-width="2"/>
  <polygon points="476,297 464,291 464,303" fill="#9A937F"/>
  <g>
    <rect x="492" y="238" width="86" height="118" fill="#FFF6F1" stroke="#B5442E" stroke-width="2"/>
    <rect x="492" y="238" width="86" height="8" fill="url(#gRose)"/>
    <circle cx="535" cy="292" r="17" fill="url(#gRose)"/>
    <text x="535" y="297" font-size="15" fill="#FFFDF6" text-anchor="middle">加</text>
    <text x="535" y="340" font-size="14" fill="#B5442E" text-anchor="middle">补一张</text>
  </g>
  <text x="84" y="404" font-size="13.5" fill="#3E5A44">三张各自过安全审计 · 补进的牌局部合规 · 四张凑桌，执行从未被授权</text>

  <!-- 右栏数据：dumbbell 两条 -->
  <text x="660" y="216" font-size="13" fill="#6E6A5C">政策违规率 · 5 个 LLM × 3 种 harness</text>

  <text x="660" y="252" font-size="13.5" fill="#B5442E">CoSA 注入 ≤5% 增量牌张</text>
  <circle cx="700" cy="272" r="5.5" fill="#FBFAF7" stroke="#B5442E" stroke-width="2.5"/>
  <line x1="700" y1="272" x2="852" y2="272" stroke="url(#gRose)" stroke-width="2.5"/>
  <circle cx="852" cy="272" r="5.5" fill="#B5442E"/>
  <text x="700" y="296" font-size="12.5" fill="#A29C88" text-anchor="middle">35.02%</text>
  <text x="852" y="296" font-size="12.5" fill="#B5442E" text-anchor="middle">58.45%</text>
  <text x="884" y="277" font-size="15" font-weight="bold" fill="#B5442E">+23.43 个百分点</text>

  <text x="660" y="336" font-size="13.5" fill="#2F7D8C">CoSA-Guard 动作前查信息与授权</text>
  <circle cx="700" cy="356" r="5.5" fill="#FBFAF7" stroke="#2F7D8C" stroke-width="2.5"/>
  <line x1="700" y1="356" x2="722" y2="356" stroke="url(#gTeal)" stroke-width="2.5"/>
  <circle cx="722" cy="356" r="5.5" fill="#2F7D8C"/>
  <text x="700" y="380" font-size="12.5" fill="#A29C88" text-anchor="middle">65.28%</text>
  <text x="722" y="380" font-size="12.5" fill="#2F7D8C" text-anchor="middle">6.67%</text>
  <text x="754" y="361" font-size="12.5" fill="#6E6A5C">合规完成率仅 66.67% 变 65.00%</text>

  <!-- 分 harness 增量 -->
  <text x="660" y="422" font-size="13" fill="#6E6A5C">分 harness 违规增量 · 百分点</text>
  <rect x="660" y="434" width="213" height="13" fill="url(#gTeal)" opacity="0.85"/>
  <text x="660" y="459" font-size="11.5" fill="#6E6A5C">OpenHands 26.04</text>
  <rect x="660" y="466" width="182" height="13" fill="url(#gIndigo)" opacity="0.85"/>
  <text x="660" y="491" font-size="11.5" fill="#6E6A5C">OpenClaw 22.29</text>
  <rect x="660" y="498" width="179" height="13" fill="url(#gPlum)" opacity="0.85"/>
  <text x="660" y="523" font-size="11.5" fill="#6E6A5C">OpenCode 21.94</text>

  <!-- 底排 chips -->
  <rect x="60" y="470" width="150" height="34" fill="url(#gGold)" opacity="0.14"/>
  <text x="135" y="492" font-size="13.5" fill="#7A5A1E" text-anchor="middle">CoSA-Bench 288 任务</text>
  <rect x="226" y="470" width="180" height="34" fill="url(#gIndigo)" opacity="0.12"/>
  <text x="316" y="492" font-size="13.5" fill="#2E5E8C" text-anchor="middle">招聘 · 金融 · IT · 商业</text>
  <rect x="422" y="470" width="198" height="34" fill="url(#gRose)" opacity="0.10"/>
  <text x="521" y="492" font-size="13.5" fill="#B5442E" text-anchor="middle">泄露 · 越权改状态 · 危险执行</text>

  <line x1="60" y1="540" x2="1140" y2="540" stroke="#E5E1D4" stroke-width="1"/>
  <text x="60" y="576" font-size="13.5" fill="#5F5A4C">不改任何现有技能，不动运行时权限，只补一张牌——逐个审计通过，不等于凑桌合规。</text>
  <text x="60" y="648" font-size="12.5" fill="#A29C88">来源：arXiv:2610.35082（北科大 / 中科院软件所 / 国科大 / UNSW）· 论文自测口径 · 预印本未经同行评审 · 基线违规率 35.02% 为原始技能池自带</text>
</svg>
