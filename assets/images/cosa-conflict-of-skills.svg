<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">加入占原池 ≤5% 的局部合规技能后，5 模型 × 3 harness 的政策违规率从 35.02% 升至 58.45%；CoSA-Guard 把违规从 65.28% 降到 6.67%</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">两池条件下的政策违规率（CoSA-Bench 288 任务）</text>

  <!-- gridlines horizontal majors at 20/40, y = 380 - 4*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="130" y1="300" x2="560" y2="300"/>
    <line x1="130" y1="220" x2="560" y2="220"/>
  </g>
  <!-- baseline bar 35.02 -->
  <rect x="180" y="239.92" width="80" height="140.08" fill="#999999"/>
  <text x="220" y="232" font-size="12" fill="#555" text-anchor="middle">35.02%</text>
  <text x="220" y="398" font-size="12.5" fill="#1A1B1E" text-anchor="middle">原技能池</text>
  <!-- attack bar 58.45 -->
  <rect x="400" y="146.2" width="80" height="233.8" fill="#D55E00"/>
  <text x="440" y="138" font-size="12" fill="#555" text-anchor="middle">58.45%</text>
  <text x="440" y="398" font-size="12.5" fill="#1A1B1E" text-anchor="middle">加入 ≤5% 增量技能</text>
  <!-- delta annotation -->
  <line x1="270" y1="146.2" x2="390" y2="146.2" stroke="#555555" stroke-width="0.75" stroke-dasharray="4 3"/>
  <line x1="270" y1="239.92" x2="390" y2="239.92" stroke="#555555" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="330" y="190" font-size="12" fill="#1A1B1E" text-anchor="middle">Δ=+23.43 个百分点</text>

  <!-- value axis -->
  <line x1="130" y1="380" x2="560" y2="380" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="130" y1="380" x2="126" y2="380"/>
    <line x1="130" y1="300" x2="126" y2="300"/>
    <line x1="130" y1="220" x2="126" y2="220"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="120" y="384">0</text>
    <text x="120" y="304">20</text>
    <text x="120" y="224">40</text>
  </g>
  

  <!-- ============ panel b ============ -->
  <text x="630" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="652" y="104" font-size="15" fill="#1A1B1E">分 harness 违规率上升（百分点）</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="830" y1="132" x2="830" y2="290"/>
    <line x1="880" y1="132" x2="880" y2="290"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="768" y="163">OpenClaw</text>
    <text x="768" y="213">OpenHands</text>
    <text x="768" y="263">OpenCode</text>
  </g>
  <!-- x = 780 + 4*pp -->
  <rect x="780" y="147" width="89.16" height="18" fill="#0072B2"/>
  <text x="877" y="163" font-size="12" fill="#555">+22.29</text>
  <rect x="780" y="197" width="104.16" height="18" fill="#0072B2"/>
  <text x="892" y="213" font-size="12" fill="#555">+26.04</text>
  <rect x="780" y="247" width="87.76" height="18" fill="#0072B2"/>
  <text x="876" y="263" font-size="12" fill="#555">+21.94</text>

  <!-- value axis -->
  <line x1="780" y1="290" x2="905" y2="290" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="780" y1="290" x2="780" y2="294"/>
    <line x1="830" y1="290" x2="830" y2="294"/>
    <line x1="880" y1="290" x2="880" y2="294"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="780" y="310">0</text>
    <text x="830" y="310">10</text>
    <text x="880" y="310">20</text>
  </g>
  <text x="880" y="334" font-size="14" fill="#1A1B1E" text-anchor="middle">违规率上升（百分点）</text>

  <!-- ============ panel c ============ -->
  <text x="630" y="378" font-size="15" font-weight="bold" fill="#1A1B1E">c</text>
  <text x="652" y="378" font-size="15" fill="#1A1B1E">CoSA-Guard 前后（OpenClaw 招聘任务 × 5 模型）</text>

  <!-- attack 65.28 -> guard 6.67, x = 730 + 2.4*v -->
  <circle cx="886.67" cy="432" r="6" fill="none" stroke="#D55E00" stroke-width="2"/>
  <line x1="886.67" y1="432" x2="746" y2="570" stroke="#D55E00" stroke-width="2"/>
  <circle cx="746" cy="570" r="6" fill="#D55E00"/>
  <text x="896" y="424" font-size="12" fill="#555">攻击注入 65.28%</text>
  <text x="756" y="560" font-size="12" fill="#555">加 CoSA-Guard 6.67%</text>

  <!-- benign completion pair, dumbbell on row y=530, same scale x = 730 + 2.4*v -->
  <line x1="890" y1="530" x2="886" y2="530" stroke="#999999" stroke-width="2"/>
  <circle cx="890" cy="530" r="6" fill="none" stroke="#999999" stroke-width="2"/>
  <circle cx="886" cy="530" r="6" fill="#999999"/>
  <text x="902" y="526" font-size="12" fill="#555">良性对照完成率</text>
  <text x="902" y="542" font-size="12" fill="#555">66.67% → 65.00%</text>

  <!-- gridlines at 20/40, x = 730 + 2.4*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="778" y1="418" x2="778" y2="590"/>
    <line x1="826" y1="418" x2="826" y2="590"/>
  </g>
  <line x1="730" y1="590" x2="900" y2="590" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="730" y1="590" x2="730" y2="594"/>
    <line x1="778" y1="590" x2="778" y2="594"/>
    <line x1="826" y1="590" x2="826" y2="594"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="730" y="610">0</text>
    <text x="778" y="610">20</text>
    <text x="826" y="610">40</text>
  </g>
  <text x="815" y="634" font-size="14" fill="#1A1B1E" text-anchor="middle">比率（%，空心=守卫前，实心=守卫后）</text>
  <text x="930" y="424" font-size="12" fill="#555">违规从 65.28% 降到 6.67%；</text>
  <text x="930" y="440" font-size="12" fill="#555">完成率代价近乎为零</text>

  <!-- footnote -->
  <text x="110" y="420" font-size="14" fill="#1A1B1E">政策违规率（%）</text>
  <text x="60" y="652" font-size="11" fill="#767676">数据：arXiv:2610.35082（CoSA-Bench 288 任务 × 5 模型 × 3 harness，论文自测口径，实测 2026-10-28）· a 面板 23.43 个百分点为增量而非总量，原池基线本身 35.02% · 预印本未经同行评审</text>
</svg>
