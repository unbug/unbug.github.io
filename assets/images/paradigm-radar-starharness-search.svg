<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">留出评估集上 StarHarness 较基线提升 44.4–46.3 个百分点；每个环境仅接受 4–12 次修改</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">ITBench 留出评估集成功率：基线 vs StarHarness（%）</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    
    <line x1="465" y1="128" x2="465" y2="330"/>
    
    <line x1="795" y1="128" x2="795" y2="330"/>
    <line x1="960" y1="128" x2="960" y2="330"/>
    
  </g>
  <!-- value axis (top): x = 300 + 9.5*v -->
  <line x1="300" y1="128" x2="1015" y2="128" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="128" x2="300" y2="124"/>
    
    <line x1="465" y1="128" x2="465" y2="124"/>
    
    <line x1="795" y1="128" x2="795" y2="124"/>
    <line x1="960" y1="128" x2="960" y2="124"/>
    
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="118">0</text>
    
    <text x="465" y="118">20</text>
    <text x="795" y="118">60</text>
    <text x="960" y="118">80</text>
    
  </g>
  <text x="657" y="98" font-size="14" fill="#1A1B1E" text-anchor="middle">留出评估集成功率（%）</text>

  <g font-size="12" fill="#555">
    <circle cx="300" cy="152" r="6" fill="#FFFFFF" stroke="#1A1B1E" stroke-width="1.5"/>
    <text x="312" y="156">基线</text>
    <circle cx="368" cy="152" r="6" fill="#D55E00"/>
    <text x="380" y="156">StarHarness</text>
  </g>

  <!-- Qwen3.5-27B: 25.6 -> 70.0 -->
  <line x1="504.8" y1="210" x2="860" y2="210" stroke="#1A1B1E" stroke-width="1.5"/>
  <circle cx="504.8" cy="210" r="7" fill="#FFFFFF" stroke="#1A1B1E" stroke-width="1.5"/>
  <circle cx="860" cy="210" r="7" fill="#D55E00"/>
  <text x="504.8" y="192" font-size="12" fill="#555" text-anchor="middle">25.6%</text>
  <text x="860" y="192" font-size="12" fill="#555" text-anchor="middle">70.0%</text>
  <text x="300" y="248" font-size="12" fill="#1A1B1E">Qwen3.5-27B，Δ=+44.4 pp</text>

  <!-- GPT-5.4-mini: 33.1 -> 79.4 -->
  <line x1="564.8" y1="292" x2="935.2" y2="292" stroke="#1A1B1E" stroke-width="1.5"/>
  <circle cx="564.8" cy="292" r="7" fill="#FFFFFF" stroke="#1A1B1E" stroke-width="1.5"/>
  <circle cx="935.2" cy="292" r="7" fill="#D55E00"/>
  <text x="564.8" y="274" font-size="12" fill="#555" text-anchor="middle">33.1%</text>
  <text x="935.2" y="274" font-size="12" fill="#555" text-anchor="middle">79.4%</text>
  <text x="300" y="326" font-size="12" fill="#1A1B1E">GPT-5.4-mini，Δ=+46.3 pp</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="396" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="396" font-size="15" fill="#1A1B1E">进化过程接受的修改次数（次）</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    
    <line x1="465" y1="420" x2="465" y2="600"/>
    
    <line x1="795" y1="420" x2="795" y2="600"/>
    <line x1="960" y1="420" x2="960" y2="600"/>
    
  </g>
  <!-- horizontal axis: x = 300 + 9.5*v -->
  <line x1="300" y1="600" x2="1015" y2="600" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="600" x2="300" y2="604"/>
    
    <line x1="465" y1="600" x2="465" y2="604"/>
    
    <line x1="795" y1="600" x2="795" y2="604"/>
    <line x1="960" y1="600" x2="960" y2="604"/>
    
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="620">0</text>
    
    <text x="465" y="620">20</text>
    <text x="795" y="620">60</text>
    <text x="960" y="620">80</text>
    
  </g>
  <text x="657" y="642" font-size="14" fill="#1A1B1E" text-anchor="middle">接受的修改次数（次）</text>

  <!-- paper reports one merged range 4-12 across the 3 environments -->
  <line x1="332" y1="510" x2="396" y2="510" stroke="#0072B2" stroke-width="3"/>
  <line x1="332" y1="502" x2="332" y2="518" stroke="#0072B2" stroke-width="1.5"/>
  <line x1="396" y1="502" x2="396" y2="518" stroke="#0072B2" stroke-width="1.5"/>
  <text x="408" y="514" font-size="12" fill="#555">4–12 次（正文报告的合并区间，适用于三个环境，n=3）</text>

  <!-- footnote -->
  <text x="60" y="662" font-size="11" fill="#767676">数据：arXiv:2608.24804（StarHarness，论文自测口径）· 面板 a 增益来自排除出进化集的留出任务 · 正文仅报告每环境接受修改次数的合并区间 4–12 次，未分列各环境具体值 · 预印本未经同行评审</text>
</svg>
