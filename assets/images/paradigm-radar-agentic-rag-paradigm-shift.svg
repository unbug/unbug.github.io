<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #8B95A5; }
      .rl { font-size: 15px; fill: #454E5E; }
      .val { font-size: 17px; font-weight: 700; fill: #1A1B1E; }
      .b { font-size: 12px; fill: #9BA5B3; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4F6F9"/>
    </linearGradient>
    <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E4E7E"/><stop offset="1" stop-color="#5C7FAE"/>
    </linearGradient>
    <linearGradient id="gBrass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9892F"/><stop offset="1" stop-color="#DCB65E"/>
    </linearGradient>
    <linearGradient id="gPlum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A4A9E"/><stop offset="1" stop-color="#A87CC8"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F8F86"/><stop offset="1" stop-color="#69BCB2"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5442E"/><stop offset="1" stop-color="#DE7E5E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1102" cy="110" r="150" fill="#7A4A9E" opacity="0.06"/>
  <circle cx="86" cy="616" r="115" fill="#B9892F" opacity="0.08"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gPlum)"/>

  <text class="k" x="64" y="84">AI 范式雷达 · 2026-08-01 · AGENTIC RAG</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">从索引卡到参考馆员</text>
  <text x="64" y="158" font-size="15" fill="#576072">传统 RAG 是一次检索的卡片目录；Agentic RAG 是会反思的参考馆员</text>

  <!-- library motif: desk lamp + catalog drawer -->
  <g>
    <path d="M 1010 152 l 26 -62 a 34 34 0 0 1 62 22 l -8 22 z" fill="url(#gBrass)" opacity="0.9"/>
    <line x1="1046" y1="112" x2="1060" y2="152" stroke="#2E4E7E" stroke-width="4" stroke-linecap="round"/>
    <rect x="1000" y="152" width="130" height="10" rx="5" fill="#2E4E7E"/>
    <rect x="1016" y="172" width="98" height="26" rx="5" fill="url(#gNavy)" opacity="0.85"/>
    <circle cx="1065" cy="185" r="4" fill="#DCB65E"/>
    <text x="1065" y="220" text-anchor="middle" font-size="12" fill="#8B95A5">多跳检索台</text>
  </g>

  <!-- left: linear pipeline -->
  <g>
    <rect x="64" y="216" width="440" height="150" rx="14" fill="#2E4E7E" opacity="0.07"/>
    <text class="rl" x="88" y="248" font-weight="700" fill="#2E4E7E">传统 RAG · 一次检索定终身</text>
    <text x="88" y="292" font-size="14" fill="#454E5E">查询 → 向量化 → top-k 检索 → 拼接生成</text>
    <path d="M 108 312 h 300 m -12 -7 l 14 7 l -14 7" fill="none" stroke="#5C7FAE" stroke-width="3" stroke-linecap="round"/>
    <text class="b" x="88" y="346">没有反馈回路：检索错了就是错了</text>
  </g>

  <!-- right: agent loop -->
  <g>
    <rect x="530" y="216" width="606" height="150" rx="14" fill="#7A4A9E" opacity="0.07"/>
    <text class="rl" x="554" y="248" font-weight="700" fill="#6A3E8C">Agentic RAG · Agent Loop</text>
    <g font-size="13.5" fill="#454E5E">
      <rect x="554" y="272" width="84" height="34" rx="17" fill="url(#gNavy)"/><text x="596" y="294" text-anchor="middle" fill="#FFFFFF">规划</text>
      <rect x="668" y="272" width="84" height="34" rx="17" fill="url(#gTeal)"/><text x="710" y="294" text-anchor="middle" fill="#FFFFFF">检索</text>
      <rect x="782" y="272" width="84" height="34" rx="17" fill="url(#gBrass)"/><text x="824" y="294" text-anchor="middle" fill="#FFFFFF">评估</text>
      <rect x="896" y="272" width="84" height="34" rx="17" fill="url(#gPlum)"/><text x="938" y="294" text-anchor="middle" fill="#FFFFFF">反思</text>
      <rect x="1010" y="272" width="84" height="34" rx="17" fill="url(#gRed)"/><text x="1052" y="294" text-anchor="middle" fill="#FFFFFF">再行动</text>
    </g>
    <g stroke="#8A93A3" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M 640 289 h 26 m -8 -6 l 10 6 l -10 6"/>
      <path d="M 754 289 h 26 m -8 -6 l 10 6 l -10 6"/>
      <path d="M 868 289 h 26 m -8 -6 l 10 6 l -10 6"/>
      <path d="M 982 289 h 26 m -8 -6 l 10 6 l -10 6"/>
    </g>
    <path d="M 1052 312 q 4 34 -46 34 h -370 q -44 0 -42 -34" fill="none" stroke="#7A4A9E" stroke-width="2.5" stroke-dasharray="6 5"/>
    <path d="M 594 346 l -10 -7 v 14 z" fill="#7A4A9E"/>
    <text class="b" x="808" y="352" text-anchor="middle">置信度不足 → 改写查询 / 换知识源，循环多轮</text>
  </g>

  <!-- before/after: hallucination rate -->
  <g>
    <text class="rl" x="64" y="424" font-weight="700">幻觉率（FEVER 口径）</text>
    <line x1="330" y1="418" x2="760" y2="418" stroke="#9AA6B6" stroke-width="2.5"/>
    <circle cx="760" cy="418" r="9" fill="none" stroke="#2E4E7E" stroke-width="3"/>
    <circle cx="495" cy="418" r="9" fill="url(#gRed)"/>
    <text class="b" x="760" y="394" text-anchor="middle">传统 RAG ≈ 35%</text>
    <text class="val" x="470" y="452" text-anchor="end" fill="#B5442E">降至 ≈ 15–20%</text>
    <text class="val" x="1090" y="425" text-anchor="end" fill="#B5442E">降幅 40–57%</text>
  </g>

  <!-- price strip -->
  <g>
    <text x="64" y="516" font-size="28" font-weight="700" fill="#2E4E7E">+7.0</text>
    <text x="64" y="538" font-size="12.5" fill="#7C8697">HotpotQA F1 35.0→42.0（Self-RAG）</text>
    <text x="300" y="516" font-size="28" font-weight="700" fill="#B9892F">3 倍</text>
    <text x="300" y="538" font-size="12.5" fill="#7C8697">延迟 ≈2 秒 → ≈6–8 秒</text>
    <text x="520" y="516" font-size="28" font-weight="700" fill="#7A4A9E">2–3x</text>
    <text x="520" y="538" font-size="12.5" fill="#7C8697">Token 成本（估计口径 1.5–3 倍）</text>
    <text x="760" y="516" font-size="28" font-weight="700" fill="#2F8F86">省 40%</text>
    <text x="760" y="538" font-size="12.5" fill="#7C8697">简单问题跳检索（ARAGOG）</text>
  </g>

  <line x1="64" y1="566" x2="1136" y2="566" stroke="#E3E7EE"/>
  <text class="serif" x="64" y="604" font-size="17" fill="#1A1B1E">判断标准只有一条：你的问题需不需要多跳推理。单跳可得，传统 RAG 就是最优解。</text>
  <text x="64" y="640" font-size="12.5" fill="#A29C88">数据为论文基准与 2025-2026 行业估计混合口径；真实场景提升或仅为论文值的 50%–70% · Micropaper</text>
</svg>
