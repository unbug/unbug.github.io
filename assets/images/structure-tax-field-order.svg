<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">GSM8K × XML 下，答案字段排在推理字段之前使两个开权重小模型跌到 10.98%；推理字段在前时维持 83-87%</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">GSM8K × XML：字段顺序与准确率（%）</text>

  <!-- gridlines: y = 420 - 3.2*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="170" y1="356" x2="560" y2="356"/>
    <line x1="170" y1="292" x2="560" y2="292"/>
    <line x1="170" y1="228" x2="560" y2="228"/>
    <line x1="170" y1="164" x2="560" y2="164"/>
  </g>

  <!-- reasoning-first band 83-87: y 154.4-166.4 -->
  <rect x="210" y="154.4" width="120" height="12" fill="#0072B2"/>
  <line x1="210" y1="151" x2="210" y2="169" stroke="#0072B2" stroke-width="0.75"/>
  <line x1="330" y1="151" x2="330" y2="169" stroke="#0072B2" stroke-width="0.75"/>
  <text x="338" y="165" font-size="12" fill="#555">83-87（两模型区间）</text>
  <text x="270" y="142" font-size="12" fill="#555" text-anchor="middle">推理字段在前</text>

  <!-- answer-first both 10.98 -->
  <rect x="210" y="384.9" width="120" height="12" fill="#D55E00"/>
  <line x1="210" y1="381" x2="210" y2="401" stroke="#D55E00" stroke-width="0.75"/>
  <line x1="330" y1="381" x2="330" y2="401" stroke="#D55E00" stroke-width="0.75"/>
  <text x="338" y="395" font-size="12" fill="#555">10.98（两模型同值）</text>
  <text x="270" y="416" font-size="12" fill="#555" text-anchor="middle">答案字段在前</text>

  <!-- value axis -->
  <line x1="170" y1="420" x2="560" y2="420" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="166" y1="420" x2="170" y2="420"/>
    <line x1="166" y1="356" x2="170" y2="356"/>
    <line x1="166" y1="292" x2="170" y2="292"/>
    <line x1="166" y1="228" x2="170" y2="228"/>
    <line x1="166" y1="164" x2="170" y2="164"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="160" y="424">0</text>
    <text x="160" y="360">20</text>
    <text x="160" y="296">40</text>
    <text x="160" y="232">60</text>
    <text x="160" y="168">80</text>
  </g>
  <text x="100" y="140" font-size="14" fill="#1A1B1E">准确率（%）</text>

  <text x="170" y="464" font-size="12" fill="#555">模型：Llama-3.1-8B 与 Gemma3-4B（开权重）。</text>
  <text x="170" y="484" font-size="12" fill="#555">区间条表示两模型的取值跨度。</text>

  <!-- ============ panel b ============ -->
  <text x="650" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="672" y="104" font-size="15" fill="#1A1B1E">四个前提同时成立才出现崩盘</text>
  <g font-size="12.5" fill="#555">
    <text x="672" y="142">前提一：GSM8K 数据集（应用数学）</text>
    <text x="672" y="166">前提二：XML 格式</text>
    <text x="672" y="190">前提三：答案字段排在推理字段之前</text>
    <text x="672" y="214">前提四：开权重模型（Llama-3.1-8B / Gemma3-4B）</text>
  </g>
  <line x1="672" y1="236" x2="1140" y2="236" stroke="#D9D9D9" stroke-width="0.5"/>
  <g font-size="12" fill="#555">
    <text x="672" y="264">剥离任何一层前提，该对比数字都不成立；引用时必须带上</text>
    <text x="672" y="284">完整的任务、格式、顺序与模型范围。</text>
  </g>
  <line x1="672" y1="306" x2="1140" y2="306" stroke="#D9D9D9" stroke-width="0.5"/>
  <g font-size="12" fill="#555">
    <text x="672" y="334">实验范围：五个模型 × 四个数据集全交叉矩阵（GSM8K、MMLU、</text>
    <text x="672" y="354">LogicBench、Spider）。税的高低由字段顺序决定：推理优先</text>
    <text x="672" y="374">的排法匹配甚至超过自由文本输出；格式敏感度与任务自身</text>
    <text x="672" y="394">对答案结构的约束成反比。</text>
  </g>

  <!-- footnote -->
  <text x="60" y="560" font-size="11" fill="#767676">数据：arXiv:2610.12056（2026 年 10 月 8 日提交，AACL IJCNLP 2026 主会接收，PayPal Artificial Intelligence）· 10.98% 与 83-87% 为 GSM8K × XML × 字段顺序 × 两个开权重模型四前提叠加下的论文自测口径 · 提示词表面变体重跑结果稳定</text>
</svg>
