<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9F9278; }
      .rl { font-size: 15px; fill: #4C4335; }
      .val { font-size: 17px; font-weight: 700; }
      .b { font-size: 12px; fill: #ABA189; }
      .chip { font-size: 11.5px; font-weight: 700; fill: #FFFFFF; letter-spacing: 2px; }
      .mono { font-family: 'SF Mono',Menlo,Consolas,monospace; font-size: 13.5px; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FAF6EC"/>
    </linearGradient>
    <linearGradient id="gGrape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D3B8C"/><stop offset="1" stop-color="#9A5FB5"/>
    </linearGradient>
    <linearGradient id="gFlour" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A05A"/><stop offset="1" stop-color="#E4C583"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D94F30"/><stop offset="1" stop-color="#E87F4E"/>
    </linearGradient>
    <linearGradient id="gCrust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C07A2E"/><stop offset="1" stop-color="#8F5716"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1110" cy="595" r="150" fill="#C9A05A" opacity="0.08"/>
  <circle cx="80" cy="620" r="110" fill="#6D3B8C" opacity="0.05"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gRed)"/>

  <text class="k" x="64" y="84">一分钟读论文 · ARXIV:2610.12056 · AACL 2026 主会</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">先撒糖，还是先和面</text>
  <text x="64" y="158" font-size="15" fill="#6E6552">结构税不在 JSON/XML 格式本身，而在字段顺序 —— 同一批模型，只差一个顺序</text>

  <!-- bakery motif: two loaves -->
  <g>
    <g transform="translate(1010,74)">
      <ellipse cx="52" cy="34" rx="52" ry="26" fill="url(#gCrust)"/>
      <path d="M 16 24 q 10 -8 16 0 M 40 18 q 10 -8 16 0 M 64 24 q 10 -8 16 0" stroke="#F0D9A8" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <rect x="14" y="72" width="76" height="22" rx="11" fill="#6D3B8C"/>
      <text x="52" y="87" text-anchor="middle" class="chip">推理在前</text>
      <text x="52" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#6D3B8C">83 – 87%</text>
    </g>
    <g transform="translate(1010,196)">
      <path d="M 4 40 a 48 26 0 0 1 96 0 z" fill="#D8CDB8"/>
      <path d="M 4 40 h 96" stroke="#BFB298" stroke-width="2"/>
      <rect x="14" y="56" width="76" height="22" rx="11" fill="url(#gRed)"/>
      <text x="52" y="71" text-anchor="middle" class="chip">答案在前</text>
      <text x="52" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#C4401F">10.98%</text>
    </g>
  </g>

  <!-- schema comparison -->
  <g>
    <rect x="64" y="200" width="330" height="118" rx="10" fill="#6D3B8C" opacity="0.07"/>
    <text x="88" y="230" class="mono" fill="#6D3B8C" font-weight="700">&lt;response&gt;</text>
    <text x="108" y="256" class="mono" fill="#544A7A">&lt;reasoning&gt; … &lt;/reasoning&gt;</text>
    <text x="108" y="282" class="mono" fill="#544A7A">&lt;answer&gt; … &lt;/answer&gt;</text>
    <text x="88" y="308" class="mono" fill="#6D3B8C">&lt;/response&gt;</text>
    <text x="410" y="252" font-size="13.5" fill="#6D3B8C" font-weight="700">先和面，最后撒糖</text>
    <text x="410" y="276" font-size="12.5" fill="#ABA189">过程先行，答案最后落子</text>

    <rect x="64" y="336" width="330" height="118" rx="10" fill="#D94F30" opacity="0.07"/>
    <text x="88" y="366" class="mono" fill="#C4401F" font-weight="700">&lt;response&gt;</text>
    <text x="108" y="392" class="mono" fill="#8A5040">&lt;answer&gt; … &lt;/answer&gt;</text>
    <text x="108" y="418" class="mono" fill="#8A5040">&lt;reasoning&gt; … &lt;/reasoning&gt;</text>
    <text x="88" y="444" class="mono" fill="#C4401F">&lt;/response&gt;</text>
    <text x="410" y="388" font-size="13.5" fill="#C4401F" font-weight="700">糖先下锅</text>
    <text x="410" y="412" font-size="12.5" fill="#ABA189">答案 token 在推理写出来之前</text>
    <text x="410" y="430" font-size="12.5" fill="#ABA189">就被落子承诺 —— 先押注，再补过程</text>
  </g>

  <line x1="64" y1="484" x2="1136" y2="484" stroke="#EAE3D0" stroke-width="1"/>

  <!-- dumbbell + four conditions -->
  <g>
    <text class="rl" x="64" y="522" font-weight="700" fill="#1A1B1E">GSM8K × XML · 两个开权重小模型</text>
    <text class="b" x="64" y="542">Llama-3.1-8B / Gemma3-4B · 剥掉任一层前提都不成立</text>
    <line x1="470" y1="516" x2="920" y2="516" stroke="#CFC4AA" stroke-width="2.5"/>
    <circle cx="470" cy="516" r="9" fill="none" stroke="#C4401F" stroke-width="3"/>
    <circle cx="920" cy="516" r="10" fill="url(#gGrape)"/>
    <text class="val" x="470" y="556" text-anchor="middle" fill="#C4401F">10.98%</text>
    <text class="val" x="920" y="490" text-anchor="middle" fill="#6D3B8C">83 – 87%</text>
    <rect x="960" y="504" width="176" height="26" rx="13" fill="url(#gFlour)"/>
    <text x="1048" y="521" text-anchor="middle" class="chip" letter-spacing="1">免费午餐：只改顺序</text>
  </g>

  <g>
    <text x="960" y="566" font-size="12.5" fill="#6D3B8C" font-weight="700">CKA 表征可分性更大</text>
    <text x="960" y="586" font-size="12.5" fill="#6D3B8C" font-weight="700">校准误差随之改善</text>
  </g>

  <text x="64" y="640" font-size="12.5" fill="#A29C88">五个模型 × 四个数据集全交叉；提示词表面变体重跑稳定 · 格式敏感度与任务答案约束成反比 · 回答先于推理则税重</text>
</svg>
