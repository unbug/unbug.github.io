<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">正文示例的三档预算配置对简单、中等、困难任务的每步 token 上限分别为 500、2K、8K</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">三档难度配置的每步 token 上限（千 tokens）</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="490" y1="128" x2="490" y2="296"/>
    <line x1="680" y1="128" x2="680" y2="296"/>
    <line x1="870" y1="128" x2="870" y2="296"/>
  </g>
  <!-- value axis: x = 300 + 95*v -->
  <line x1="300" y1="296" x2="990" y2="296" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="296" x2="300" y2="300"/>
    <line x1="490" y1="296" x2="490" y2="300"/>
    <line x1="680" y1="296" x2="680" y2="300"/>
    <line x1="870" y1="296" x2="870" y2="300"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="318">0</text>
    <text x="490" y="318">2</text>
    <text x="680" y="318">4</text>
    <text x="870" y="318">6</text>
  </g>
  <text x="645" y="340" font-size="14" fill="#1A1B1E" text-anchor="middle">每步 token 上限（千 tokens）</text>

  <text x="288" y="160" font-size="12.5" fill="#1A1B1E" text-anchor="end">简单档</text>
  <rect x="300" y="146" width="47.5" height="18" fill="#0072B2"/>
  <text x="356" y="160" font-size="12" fill="#555">500 · 1 步 · 无反思</text>

  <text x="288" y="216" font-size="12.5" fill="#1A1B1E" text-anchor="end">中等档</text>
  <rect x="300" y="202" width="190" height="18" fill="#0072B2"/>
  <text x="499" y="216" font-size="12" fill="#555">2K · 3 步 · 有反思</text>

  <text x="288" y="272" font-size="12.5" fill="#1A1B1E" text-anchor="end">困难档</text>
  <rect x="300" y="258" width="760" height="18" fill="#D55E00"/>
  <text x="60" y="296" font-size="12" fill="#555">硬约束：单次不超过总预算的 60%</text>
  <text x="1069" y="272" font-size="12" fill="#555" text-anchor="end">8K · 5 步 · 反思与回退</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="396" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="396" font-size="15" fill="#1A1B1E">示例工作流（8 步 · 总预算 16K）的步骤级 token 配额（千 tokens）</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="610" y1="420" x2="610" y2="600"/>
    <line x1="860" y1="420" x2="860" y2="600"/>
  </g>
  <!-- horizontal axis: x = 360 + 50*v -->
  <line x1="360" y1="600" x2="910" y2="600" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="360" y1="600" x2="360" y2="604"/>
    <line x1="610" y1="600" x2="610" y2="604"/>
    <line x1="860" y1="600" x2="860" y2="604"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="360" y="620">0</text>
    <text x="610" y="620">5</text>
    <text x="860" y="620">10</text>
  </g>
  <text x="635" y="642" font-size="14" fill="#1A1B1E" text-anchor="middle">每步 token 配额（千 tokens）</text>

  <text x="348" y="450" font-size="12.5" fill="#1A1B1E" text-anchor="end">均匀分配</text>
  <rect x="360" y="440" width="100" height="14" fill="#999999"/>
  <text x="470" y="451" font-size="12" fill="#555">每步一律 2K</text>

  <text x="348" y="500" font-size="12.5" fill="#1A1B1E" text-anchor="end">动态 · 简单 3 步</text>
  <rect x="360" y="490" width="25" height="14" fill="#0072B2"/>
  <text x="393" y="501" font-size="12" fill="#555">每步 500</text>

  <text x="348" y="540" font-size="12.5" fill="#1A1B1E" text-anchor="end">动态 · 中等 2 步</text>
  <rect x="360" y="530" width="100" height="14" fill="#0072B2"/>
  <text x="470" y="541" font-size="12" fill="#555">每步 2K</text>

  <text x="348" y="580" font-size="12.5" fill="#1A1B1E" text-anchor="end">动态 · 困难 3 步</text>
  <rect x="360" y="570" width="300" height="14" fill="#D55E00"/>
  <text x="670" y="581" font-size="12" fill="#555">每步 6K（受总预算约束动态调整）</text>

  <!-- footnote -->
  <text x="60" y="662" font-size="11" fill="#767676">数据：arXiv:2607.28573 实证与行业基准测试的综合推断示例（正文声明：实际效果取决于任务分布与实现质量）· 面板 a 取自正文预算配置代码，面板 b 取自正文 8 步工作流算例 · 自估口径，非论文实测</text>
</svg>
