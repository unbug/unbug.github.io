<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1A1B1E20"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="#555555" rx="12"/>

  <g transform="translate(400, 50)">
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#009E73">No Last Mile</text>
    <text x="0" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#009E73">人类数据市场的持久性</text>
  </g>

  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="220" height="180" rx="16" fill="white" filter="url(#shadow)"/>
    <circle cx="110" cy="55" r="30" fill="#555555"/>
    <text x="110" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="white">AI</text>
    <text x="110" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#009E73">能力存量</text>
    <text x="110" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#009E73">可重用的 AI 能力</text>
    <text x="110" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#009E73">扩大部署边界</text>
  </g>

  <g transform="translate(480, 120)">
    <rect x="0" y="0" width="220" height="180" rx="16" fill="white" filter="url(#shadow)"/>
    <circle cx="110" cy="55" r="30" fill="#555555"/>
    <text x="110" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="white">👤</text>
    <text x="110" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#009E73">结构化劳动力</text>
    <text x="110" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#009E73">评估 · 审计 · 例外处理</text>
    <text x="110" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#009E73">持久的生产要素</text>
  </g>

  <g transform="translate(320, 200)">
    <path d="M 0 0 L 60 -30" stroke="#CC79A7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M 0 0 L 60 30" stroke="#CC79A7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(400, 330)">
    <rect x="-180" y="-20" width="360" height="40" rx="20" fill="white" filter="url(#shadow)"/>
    <text x="0" y="7" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#009E73">稳态劳动力份额: <tspan fill="#56B4E9">5-7%</tspan></text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#CC79A7"/>
    </marker>
  </defs>
</svg>