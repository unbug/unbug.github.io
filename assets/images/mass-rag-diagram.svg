<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">MASS-RAG 把证据处理拆给四个角色智能体阶段，在四个开放域问答基准上一致超过强 RAG 基线</text>

  <!-- ============ panel a: pipeline ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">四阶段角色分工架构（方法示意，无量化数据）</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D55E00"/>
    </marker>
  </defs>

  <!-- input -->
  <rect x="70" y="210" width="120" height="56" rx="4" fill="none" stroke="#999999" stroke-width="1.5"/>
  <text x="130" y="234" font-size="13" fill="#1A1B1E" text-anchor="middle">问题 + 检索</text>
  <text x="130" y="252" font-size="13" fill="#1A1B1E" text-anchor="middle">文档</text>

  <!-- arrow in -->
  <line x1="190" y1="238" x2="218" y2="238" stroke="#555555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 4 stage boxes -->
  <g fill="none" stroke="#999999" stroke-width="1.5">
    <rect x="220" y="160" width="180" height="100" rx="4"/>
    <rect x="440" y="160" width="180" height="100" rx="4"/>
    <rect x="660" y="160" width="180" height="100" rx="4"/>
  </g>
  <rect x="880" y="160" width="180" height="100" rx="4" fill="none" stroke="#D55E00" stroke-width="1.5"/>

  <g text-anchor="middle">
    <text x="310" y="200" font-size="14" font-weight="bold" fill="#1A1B1E">证据摘要智能体</text>
    <text x="310" y="224" font-size="12" fill="#555">压缩提炼每个文档</text>
    <text x="310" y="242" font-size="12" fill="#555">输出结构化摘要</text>

    <text x="530" y="200" font-size="14" font-weight="bold" fill="#1A1B1E">证据提取智能体</text>
    <text x="530" y="224" font-size="12" fill="#555">挑出关键事实片段</text>
    <text x="530" y="242" font-size="12" fill="#555">建立证据-问题映射</text>

    <text x="750" y="200" font-size="14" font-weight="bold" fill="#1A1B1E">推理智能体</text>
    <text x="750" y="224" font-size="12" fill="#555">评估兼容性一致性</text>
    <text x="750" y="242" font-size="12" fill="#555">形成推理链</text>

    <text x="970" y="200" font-size="14" font-weight="bold" fill="#D55E00">综合阶段</text>
    <text x="970" y="224" font-size="12" fill="#555">比较融合互补信息</text>
    <text x="970" y="242" font-size="12" fill="#555">生成最终答案</text>
  </g>

  <!-- arrows between stages -->
  <g stroke="#555555" stroke-width="1.5">
    <line x1="400" y1="210" x2="432" y2="210" marker-end="url(#arr)"/>
    <line x1="620" y1="210" x2="652" y2="210" marker-end="url(#arr)"/>
  </g>
  <line x1="840" y1="210" x2="872" y2="210" stroke="#D55E00" stroke-width="1.5" marker-end="url(#arrO)"/>

  <!-- side notes under pipeline -->
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="310" y="288">去冗余</text>
    <text x="530" y="288">过滤噪声</text>
    <text x="750" y="288">减少干扰</text>
    <text x="970" y="288">主角：整合输出</text>
  </g>

  <!-- intermediate views bracket -->
  <g stroke="#999999" stroke-width="0.75">
    <line x1="220" y1="316" x2="220" y2="326"/>
    <line x1="530" y1="316" x2="530" y2="326"/>
    <line x1="840" y1="316" x2="840" y2="326"/>
    <line x1="220" y1="326" x2="840" y2="326"/>
  </g>
  <text x="530" y="348" font-size="12" fill="#555" text-anchor="middle">关键设计：暴露多个中间证据视图，先比较整合，不从原始文档直接跳到结论</text>
  <text x="530" y="368" font-size="12" fill="#555" text-anchor="middle">短答案问答另配独立回答智能体；方法完全免训练，可直接搭配不同规模的预训练模型</text>

  <!-- ============ panel b: qualitative findings ============ -->
  <text x="60" y="424" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="424" font-size="15" fill="#1A1B1E">正文报告的定性结论与唯一可归因样本数</text>

  <g font-size="13" fill="#1A1B1E">
    <circle cx="70" cy="459" r="4" fill="#D55E00"/>
    <text x="86" y="464">相关证据分散在多个检索文档时，优势最明显</text>
    <circle cx="70" cy="491" r="4" fill="#999999"/>
    <text x="86" y="496">换用 Llama3-8B 骨干后，仍稳定优于同为多智能体方案的 MAIN-RAG</text>
    <circle cx="70" cy="523" r="4" fill="#999999"/>
    <text x="86" y="528">TriviaQA、ARC-Challenge 和 ASQA 上保持领先</text>
  </g>

  <!-- sole-attribution callout -->
  <rect x="740" y="444" width="12" height="34" fill="#D55E00"/>
  <text x="746" y="432" font-size="12" fill="#555" text-anchor="middle">609 个样本</text>
  <text x="770" y="460" font-size="13" fill="#1A1B1E">Llama3-8B 骨干下，TriviaQA 上有 609 个样本的正确答案</text>
  <text x="770" y="480" font-size="13" fill="#1A1B1E">只能唯一归因于某个中间证据视图</text>
  <text x="770" y="506" font-size="12" fill="#555">证据贡献率分析：各视图携带不可替代的信息</text>

  <text x="60" y="548" font-size="12" fill="#555">本图为方法示意与定性要点，正文未报告各基准的准确率数值，故不画数值轴</text>

  <!-- footnote -->
  <text x="60" y="616" font-size="11" fill="#767676">数据：arXiv:2604.18509（北京理工大学与清华大学，MASS-RAG，ACL 2026 Findings，论文自测口径）</text>
  <text x="60" y="634" font-size="11" fill="#767676">a 面板为方法流程示意、非实测统计；b 面板数值仅正文报告的 609 个唯一归因样本 · Findings 论文</text>
</svg>
