<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">最好配置 95 题平均分仅 0.56、解决 14 题；23 题问到全部关键事实后仍只有 10 题做到业务提升 ≥ 0.8</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">任务数漏斗（题）</text>

  <!-- gridline at 50, x = 300 + 8*n -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="700" y1="126" x2="700" y2="302"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="288" y="153">全部任务</text>
    <text x="288" y="213">问到全部关键事实</text>
    <text x="288" y="273">业务提升 ≥ 0.8</text>
  </g>
  <rect x="300" y="137" width="760" height="18" fill="#999999"/>
  <text x="1068" y="153" font-size="12" fill="#FFFFFF" text-anchor="end">95</text>
  <rect x="300" y="197" width="184" height="18" fill="#0072B2"/>
  <text x="492" y="213" font-size="12" fill="#555">23</text>
  <rect x="300" y="257" width="80" height="18" fill="#D55E00"/>
  <text x="388" y="273" font-size="12" fill="#555">10</text>

  <!-- value axis -->
  <line x1="300" y1="302" x2="740" y2="302" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="302" x2="300" y2="306"/>
    <line x1="700" y1="302" x2="700" y2="306"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="322">0</text>
    <text x="700" y="322">50</text>
  </g>
  <text x="520" y="346" font-size="14" fill="#1A1B1E" text-anchor="middle">任务数（题）</text>
  <text x="300" y="376" font-size="12" fill="#555">第 2 行为问到全部关键事实的 23 题，第 3 行为其中最好配置做出业务提升 ≥ 0.8 的 10 题；问到 ≠ 做出来</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="430" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="430" font-size="15" fill="#1A1B1E">最好配置的整体成绩（13 个模型配置、7 家 provider 中的最好值）</text>

  <!-- gauge 1: avg score 0.56 of reference; track width 560 = 0.56/0.56 rescaled -->
  <text x="80" y="472" font-size="12.5" fill="#1A1B1E">平均分（相对参考解归一化，参考解记 1）</text>
  <rect x="80" y="486" width="640" height="18" fill="none" stroke="#999999" stroke-width="1.5"/>
  <rect x="80" y="486" width="358.4" height="18" fill="#0072B2"/>
  <text x="446" y="500" font-size="12" fill="#FFFFFF">0.56</text>
  <text x="728" y="500" font-size="12" fill="#555">满条 = 参考解</text>

  <!-- gauge 2: solved 14 of 95 -->
  <text x="80" y="544" font-size="12.5" fill="#1A1B1E">解决题数（得分 ≥ 0.8 且全程无事故）</text>
  <rect x="80" y="558" width="640" height="18" fill="none" stroke="#999999" stroke-width="1.5"/>
  <rect x="80" y="558" width="94.3" height="18" fill="#D55E00"/>
  <text x="182" y="572" font-size="12" fill="#555">14 题 / 满条 = 全部 95 题</text>

  <!-- footnote -->
  <text x="60" y="652" font-size="11" fill="#767676">数据：arXiv:2610.22350（95 任务 × 20 客户场景 × 18 行业，评分相对参考解归一化并计入交互罚分，论文自测口径，2026 年 10 月挂出预印本）· 0.56 为平均分而非成功率 · 预印本未经同行评审</text>
</svg>
