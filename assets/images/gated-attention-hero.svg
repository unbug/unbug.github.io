<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#F0F0F0"/>

  <!-- conclusion -->
  <text x="60" y="58" font-size="16" fill="#009E73">头级门控带来超过 10 个点的长上下文外推提升，额外延迟不到 2%；方法已用于 Qwen3-Next 生产环境</text>

  <!-- ===== panel a: method steps ===== -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#009E73">a</text>
  <text x="82" y="104" font-size="15" fill="#009E73">门控位置：正文四步计算流程（序列轴，对比标准注意力的唯一改动）</text>

  <g stroke="#999999" stroke-width="1.5">
    <line x1="300" y1="210" x2="330" y2="210"/>
    <line x1="570" y1="210" x2="600" y2="210"/>
    <line x1="840" y1="210" x2="870" y2="210"/>
  </g>
  <g>
    <rect x="60" y="160" width="240" height="100" rx="4" fill="#0072B2" opacity="0.10"/>
    <rect x="60" y="160" width="240" height="4" fill="#0072B2"/>
    <text x="76" y="188" font-size="13" font-weight="bold" fill="#009E73">步一　正常计算 SDPA</text>
    <text x="76" y="210" font-size="12" fill="#555">缩放点积注意力不变</text>

    <rect x="330" y="160" width="240" height="100" rx="4" fill="#D55E00" opacity="0.10"/>
    <rect x="330" y="160" width="240" height="4" fill="#D55E00"/>
    <text x="346" y="188" font-size="13" font-weight="bold" fill="#009E73">步二　由 Query 算 sigmoid 门控值</text>
    <text x="346" y="210" font-size="12" fill="#555">模型按当前 token 在找什么</text>
    <text x="346" y="226" font-size="12" fill="#555">决定哪些注意力输出有用</text>

    <rect x="600" y="160" width="240" height="100" rx="4" fill="#0072B2" opacity="0.10"/>
    <rect x="600" y="160" width="240" height="4" fill="#0072B2"/>
    <text x="616" y="188" font-size="13" font-weight="bold" fill="#009E73">步三　输出乘以门控值</text>
    <text x="616" y="210" font-size="12" fill="#555">选择性放大或抑制</text>

    <rect x="870" y="160" width="240" height="100" rx="4" fill="#0072B2" opacity="0.10"/>
    <rect x="870" y="160" width="240" height="4" fill="#0072B2"/>
    <text x="886" y="188" font-size="13" font-weight="bold" fill="#009E73">步四　头级独立门控</text>
    <text x="886" y="210" font-size="12" fill="#555">维护注意力头的多样性</text>
  </g>

  <!-- sequence axis -->
  <g stroke="#009E73" stroke-width="0.75">
    <line x1="60" y1="290" x2="1110" y2="290"/>
    <line x1="60" y1="290" x2="60" y2="294"/>
    <line x1="330" y1="290" x2="330" y2="294"/>
    <line x1="600" y1="290" x2="600" y2="294"/>
    <line x1="870" y1="290" x2="870" y2="294"/>
  </g>
  <g font-size="12.5" fill="#009E73" text-anchor="middle">
    <text x="60" y="312">步一</text>
    <text x="330" y="312">步二</text>
    <text x="600" y="312">步三</text>
    <text x="870" y="312">步四</text>
  </g>
  <text x="585" y="336" font-size="14" fill="#009E73" text-anchor="middle">计算流程位置（序列轴）</text>

  <!-- ===== panel b: findings ===== -->
  <text x="60" y="386" font-size="15" font-weight="bold" fill="#009E73">b</text>
  <text x="82" y="386" font-size="15" fill="#009E73">实验规模与两项量化收益</text>

  <text x="60" y="424" font-size="14" fill="#009E73">量化收益</text>
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="300" y1="440" x2="300" y2="520"/>
    <line x1="700" y1="440" x2="700" y2="520"/>
    <line x1="1100" y1="440" x2="1100" y2="520"/>
  </g>
  <!-- long-context: 0..10+ points, x=300+40*v, 10 -> 700 -->
  <rect x="300" y="446" width="400" height="20" fill="#0072B2"/>
  <polygon points="700,446 712,456 700,466" fill="#0072B2"/>
  <text x="300" y="438" font-size="12" fill="#555">RULER 基准外推能力提升：超过 10 个点</text>
  <!-- latency: 0..2%, x=300+200*v, 2 -> 700 -->
  <rect x="300" y="496" width="400" height="20" fill="#009E73"/>
  <polygon points="712,496 700,486 700,506" fill="#009E73"/>
  <text x="300" y="488" font-size="12" fill="#555">额外推理延迟：不到 2%</text>
  <line x1="300" y1="520" x2="700" y2="520" stroke="#009E73" stroke-width="0.75"/>
  <g font-size="12" fill="#555">
    <text x="300" y="540">左端为 0；两条箭头分别指向各自轴上限（10 个点 / 2%），量纲不同、不共用刻度</text>
  </g>

  <text x="770" y="424" font-size="14" fill="#009E73">实验规模</text>
  <g font-size="12.5" fill="#009E73">
    <text x="770" y="452">对比 30 多种门控变体，最佳配置为：</text>
    <text x="786" y="474">SDPA 输出后 · 头级粒度 · 乘法门控 · Sigmoid 激活（优于 SiLU）</text>
    <text x="770" y="502">训练 15B MoE 与 1.7B 稠密模型</text>
    <text x="770" y="524">现有 Transformer 加几行代码即可升级</text>
  </g>

  <!-- ===== panel c: problems addressed ===== -->
  <text x="60" y="582" font-size="15" font-weight="bold" fill="#009E73">c</text>
  <text x="82" y="582" font-size="15" fill="#009E73">同一改动覆盖的三个痛点与收益</text>
  <g font-size="12" fill="#555">
    <text x="60" y="604">标准注意力的三个问题：损失值训练中突然飙升（训练不稳定）· 上下文变长后表现急剧下降（长上下文差）· 计算本质线性（缺乏非线性）</text>
    <text x="60" y="624">门控同时改善三者，并把注意力汇聚从事后补救转为从设计上消除，还允许使用更大的学习率与 batch size</text>
  </g>

  <!-- footnote -->
  <text x="60" y="652" font-size="11" fill="#767676">数据：arXiv:2505.06708（NeurIPS 2025 最佳论文，阿里巴巴 Qwen 团队）· 10 个点与 2% 为论文自测口径 · 面板 a 为论文方法描述的流程序列，非统计量 · 预印本未经同行评审</text>
</svg>
