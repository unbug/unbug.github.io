<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">反馈驱动的自动 harness 合成：TerminalBench-2 达 84.3%，Chrome 中发现 10 个未知零日漏洞</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">反馈驱动外层循环（机制示意，非实测数据）</text>

  <!-- loop path -->
  <g stroke="#999999" stroke-width="1.5" fill="none">
    <line x1="262" y1="210" x2="336" y2="210"/>
    <line x1="512" y1="210" x2="586" y2="210"/>
    <line x1="762" y1="210" x2="836" y2="210"/>
    <line x1="920" y1="250" x2="920" y2="300"/>
    <line x1="920" y1="300" x2="170" y2="300"/>
    <line x1="170" y1="300" x2="170" y2="254"/>
  </g>
  <g fill="#999999">
    <polygon points="336,206 344,210 336,214"/>
    <polygon points="586,206 594,210 586,214"/>
    <polygon points="836,206 844,210 836,214"/>
    <polygon points="166,254 170,246 174,254"/>
  </g>

  <!-- node 1 -->
  <rect x="80" y="170" width="180" height="80" fill="none" stroke="#1A1B1E" stroke-width="0.75"/>
  <text x="170" y="200" font-size="12.5" fill="#1A1B1E" text-anchor="middle">Proposer</text>
  <text x="170" y="220" font-size="12" fill="#555" text-anchor="middle">按失败模式生成</text>
  <text x="170" y="236" font-size="12" fill="#555" text-anchor="middle">图结构变体</text>

  <!-- node 2 (主角) -->
  <rect x="344" y="170" width="170" height="80" fill="#D55E00"/>
  <text x="429" y="200" font-size="12.5" fill="#FFFFFF" text-anchor="middle">Execute-Observe-Score</text>
  <text x="429" y="220" font-size="12" fill="#FFFFFF" text-anchor="middle">执行候选 harness</text>
  <text x="429" y="236" font-size="12" fill="#FFFFFF" text-anchor="middle">并收集运行时信号</text>

  <!-- node 3 -->
  <rect x="594" y="170" width="170" height="80" fill="none" stroke="#1A1B1E" stroke-width="0.75"/>
  <text x="679" y="200" font-size="12.5" fill="#1A1B1E" text-anchor="middle">Diagnoser</text>
  <text x="679" y="220" font-size="12" fill="#555" text-anchor="middle">读取 sanitizer 输出、</text>
  <text x="679" y="236" font-size="12" fill="#555" text-anchor="middle">覆盖率数据，定位失败环节</text>

  <!-- feedback label -->
  <text x="545" y="324" font-size="12" fill="#555" text-anchor="middle">运行时信号反馈：指导下一轮搜索（传统优化器仅有粗粒度通过/失败信号）</text>

  <!-- typed DSL note -->
  <text x="80" y="372" font-size="12" fill="#555">类型化图 DSL 的搜索空间覆盖智能体角色、提示词、工具、通信拓扑与协调协议；</text>
  <text x="80" y="394" font-size="12" fill="#555">类型约束保证生成方案结构合法：节点对应有效角色、边定义合法通道、反馈通道匹配目标程序信号类型。</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="446" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="446" font-size="15" fill="#1A1B1E">两项评估结果（论文自测口径）</text>

  <!-- left: bar for 84.3 -->
  <text x="260" y="486" font-size="12.5" fill="#1A1B1E" text-anchor="middle">TerminalBench-2 成绩（%，Claude Opus 4.6）</text>
  <line x1="120" y1="590" x2="400" y2="590" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="120" y1="590" x2="120" y2="594"/>
    <line x1="190" y1="590" x2="190" y2="594"/>
    <line x1="260" y1="590" x2="260" y2="594"/>
    <line x1="330" y1="590" x2="330" y2="594"/>
    <line x1="400" y1="590" x2="400" y2="594"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="120" y="614">0</text>
    <text x="190" y="614">25</text>
    <text x="260" y="614">50</text>
    <text x="330" y="614">75</text>
    <text x="400" y="614">100</text>
  </g>
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="190" y1="510" x2="190" y2="590"/>
    <line x1="260" y1="510" x2="260" y2="590"/>
    <line x1="330" y1="510" x2="330" y2="590"/>
    <line x1="400" y1="510" x2="400" y2="590"/>
  </g>
  <rect x="120" y="520" width="236.04" height="26" fill="#D55E00"/>
  <text x="364" y="538" font-size="12" fill="#555">84.3</text>
  <text x="260" y="640" font-size="12" fill="#555" text-anchor="middle">公开 leaderboard 最高分</text>

  <!-- right: count axis for CVE -->
  <text x="830" y="486" font-size="12.5" fill="#1A1B1E" text-anchor="middle">Chrome 未知零日漏洞（个，Kimi K2.5）</text>
  <line x1="640" y1="590" x2="960" y2="590" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="640" y1="590" x2="640" y2="594"/>
    <line x1="720" y1="590" x2="720" y2="594"/>
    <line x1="800" y1="590" x2="800" y2="594"/>
    <line x1="880" y1="590" x2="880" y2="594"/>
    <line x1="960" y1="590" x2="960" y2="594"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="640" y="614">0</text>
    <text x="720" y="614">2</text>
    <text x="800" y="614">4</text>
    <text x="880" y="614">6</text>
    <text x="960" y="614">8</text>
  </g>
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="720" y1="510" x2="720" y2="590"/>
    <line x1="800" y1="510" x2="800" y2="590"/>
    <line x1="880" y1="510" x2="880" y2="590"/>
    <line x1="960" y1="510" x2="960" y2="590"/>
  </g>
  <rect x="640" y="520" width="400" height="26" fill="#999999"/>
  <polygon points="1040,520 1052,533 1040,546" fill="#999999"/>
  <text x="1060" y="538" font-size="12" fill="#555">10</text>
  <text x="830" y="640" font-size="12" fill="#555" text-anchor="middle">轴标到 8，实心条超出轴末端表示 10 个</text>

  <!-- footnote (two lines) -->
  <text x="60" y="662" font-size="11" fill="#767676">数据：arXiv:2604.20801（加州大学圣塔芭芭拉分校等）· 两项结果均为论文自测口径 · Chrome 的 10 个零日漏洞含 2 个 Critical 级沙箱逃逸（CVE-2026-5280、CVE-2026-6297）</text>
</svg>
