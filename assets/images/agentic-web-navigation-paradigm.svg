<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">五个网页/操作系统基准上模型成功率最高约 70%，WebArena 上 GPT-4 成功率不足人类基线的五分之一</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">各基准任务成功率（论文报告值）</text>

  <!-- gridlines: x = 300 + 8*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="540" y1="130" x2="540" y2="414"/>
    <line x1="780" y1="130" x2="780" y2="414"/>
    <line x1="940" y1="130" x2="940" y2="414"/>
  </g>

  <!-- MiniWoB++: 60-70 -->
  <text x="288" y="162" font-size="12.5" fill="#1A1B1E" text-anchor="end">MiniWoB++ 微任务（125 个）</text>
  <rect x="780" y="148" width="80" height="18" fill="#0072B2"/>
  <line x1="780" y1="145" x2="780" y2="169" stroke="#0072B2" stroke-width="0.75"/>
  <line x1="860" y1="145" x2="860" y2="169" stroke="#0072B2" stroke-width="0.75"/>
  <text x="868" y="162" font-size="12" fill="#555">最优约 60–70%</text>

  <!-- Mind2Web: ~30 -->
  <text x="288" y="214" font-size="12.5" fill="#1A1B1E" text-anchor="end">Mind2Web（500+ 网站 2000+ 任务）</text>
  <rect x="300" y="200" width="240" height="18" fill="#0072B2" opacity="0.35"/>
  <line x1="540" y1="197" x2="540" y2="221" stroke="#0072B2" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="548" y="214" font-size="12" fill="#555">GPT-4 约 30%</text>

  <!-- WebVoyager: ~25 -->
  <text x="288" y="266" font-size="12.5" fill="#1A1B1E" text-anchor="end">WebVoyager（15 网站 643 任务）</text>
  <rect x="300" y="252" width="200" height="18" fill="#0072B2" opacity="0.35"/>
  <line x1="500" y1="249" x2="500" y2="273" stroke="#0072B2" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="508" y="266" font-size="12" fill="#555">自探索机制下约 25%</text>

  <!-- WebArena: model 16, human 80 -->
  <text x="288" y="318" font-size="12.5" fill="#1A1B1E" text-anchor="end">WebArena（812 个真实任务）</text>
  <line x1="428" y1="304" x2="940" y2="304" stroke="#999999" stroke-width="1.5"/>
  <circle cx="940" cy="304" r="6" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="948" y="297" font-size="12" fill="#555">人类基线 80% 以上</text>
  <circle cx="428" cy="318" r="7" fill="#0072B2"/>
  <text x="440" y="331" font-size="12" fill="#555">GPT-4 约 16%</text>

  <!-- OSWorld: ~15 -->
  <text x="288" y="370" font-size="12.5" fill="#1A1B1E" text-anchor="end">OSWorld（完整操作系统任务）</text>
  <rect x="300" y="356" width="120" height="18" fill="#0072B2" opacity="0.35"/>
  <line x1="420" y1="353" x2="420" y2="377" stroke="#0072B2" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="428" y="370" font-size="12" fill="#555">最优约 15%，无人类基线</text>

  <!-- value axis -->
  <line x1="300" y1="414" x2="940" y2="414" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="414" x2="300" y2="418"/>
    <line x1="540" y1="414" x2="540" y2="418"/>
    <line x1="780" y1="414" x2="780" y2="418"/>
    <line x1="940" y1="414" x2="940" y2="418"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="434">0</text>
    <text x="540" y="434">30</text>
    <text x="780" y="434">60</text>
    <text x="940" y="434">80</text>
  </g>
  <text x="620" y="458" font-size="14" fill="#1A1B1E" text-anchor="middle">任务成功率（%）</text>
  <g font-size="12" fill="#555">
    <rect x="310" y="120" width="12" height="10" fill="#0072B2"/>
    <text x="327" y="129">论文报告区间</text>
    <line x1="436" y1="125" x2="456" y2="125" stroke="#0072B2" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="462" y="129">论文报告「约」值</text>
    <circle cx="580" cy="125" r="5" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
    <text x="591" y="129">人类基线</text>
    <circle cx="668" cy="125" r="5" fill="#0072B2"/>
    <text x="679" y="129">模型成绩</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="60" y="500" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="500" font-size="15" fill="#1A1B1E">多步任务成本区间（数值直接标注）</text>

  <!-- ranges: token 50000-200000 ; delay 1-5s -->
  <text x="288" y="540" font-size="12.5" fill="#1A1B1E" text-anchor="end">累计 Token 消耗（个）</text>
  <line x1="320" y1="535" x2="820" y2="535" stroke="#0072B2" stroke-width="1.5"/>
  <line x1="320" y1="526" x2="320" y2="544" stroke="#0072B2" stroke-width="1.5"/>
  <line x1="820" y1="526" x2="820" y2="544" stroke="#0072B2" stroke-width="1.5"/>
  <text x="320" y="560" font-size="12" fill="#555">50000</text>
  <text x="820" y="560" font-size="12" fill="#555" text-anchor="end">200000</text>

  <text x="288" y="596" font-size="12.5" fill="#1A1B1E" text-anchor="end">每步增加延迟（秒）</text>
  <line x1="320" y1="591" x2="560" y2="591" stroke="#0072B2" stroke-width="1.5"/>
  <line x1="320" y1="582" x2="320" y2="600" stroke="#0072B2" stroke-width="1.5"/>
  <line x1="560" y1="582" x2="560" y2="600" stroke="#0072B2" stroke-width="1.5"/>
  <text x="320" y="616" font-size="12" fill="#555">1</text>
  <text x="560" y="616" font-size="12" fill="#555">5</text>

  <text x="640" y="596" font-size="12" fill="#555">区间为论文/正文报告范围，whisker 为区间端点，各自独立量程</text>

  <!-- footnote -->
  <text x="60" y="648" font-size="11" fill="#767676">数据：WebArena、Mind2Web、WebVoyager、OSWorld、MiniWoB++ 五个基准（arXiv:2307.13854、2306.13847、2401.13910、2403.00563、1909.03047）· 均为论文自测口径，「约」为论文近似值 · 预印本未经同行评审</text>
</svg>
