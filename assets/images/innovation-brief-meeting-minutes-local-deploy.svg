<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="1200" height="630" fill="#f4f6f9"/>
  <rect x="0" y="0" width="1200" height="110" fill="#25324a"/>
  <text x="60" y="52" fill="#9fb3d1" font-size="20" letter-spacing="4">AI 智创简报 · 专利情报速读</text>
  <text x="60" y="88" fill="#ffffff" font-size="30" font-weight="bold">会议纪要专利扎堆，平台上不了的场子留给个人</text>

  <!-- Panel 1: 专利信号 -->
  <rect x="40" y="140" width="350" height="430" rx="10" fill="#ffffff" stroke="#d5dde8"/>
  <rect x="40" y="140" width="350" height="54" rx="10" fill="#3b5378"/>
  <text x="64" y="174" fill="#ffffff" font-size="22" font-weight="bold">专利信号 2026-06 ~ 07</text>
  <text x="64" y="230" fill="#25324a" font-size="17" font-weight="bold">Zoom 三件</text>
  <text x="64" y="260" fill="#43536b" font-size="15">US12647532B2 会中增量纪要 06-02 授权</text>
  <text x="64" y="286" fill="#43536b" font-size="15">US12664798B2 章节自动切分 06-23 授权</text>
  <text x="64" y="312" fill="#43536b" font-size="15">US20260211885A1 分段记录回查 07-23 公开</text>
  <text x="64" y="352" fill="#25324a" font-size="17" font-weight="bold">Microsoft 一件</text>
  <text x="64" y="382" fill="#43536b" font-size="15">EP4162488B1 话语重要性评估 06-17 授权</text>
  <line x1="64" y1="410" x2="366" y2="410" stroke="#d5dde8"/>
  <text x="64" y="444" fill="#5b6c85" font-size="15">一个月窗口内 4 件同主题</text>
  <text x="64" y="470" fill="#5b6c85" font-size="15">两件平台产品级授权</text>
  <text x="64" y="512" fill="#8a99ae" font-size="13">状态经 Google Patents 详情页核验</text>

  <!-- Panel 2: 技术趋势 -->
  <rect x="425" y="140" width="350" height="430" rx="10" fill="#ffffff" stroke="#d5dde8"/>
  <rect x="425" y="140" width="350" height="54" rx="10" fill="#4d6a94"/>
  <text x="449" y="174" fill="#ffffff" font-size="22" font-weight="bold">技术趋势</text>
  <text x="449" y="230" fill="#25324a" font-size="16" font-weight="bold">纪要 = 结构化中间表示</text>
  <rect x="449" y="250" width="300" height="38" rx="6" fill="#eef2f8"/>
  <text x="461" y="275" fill="#43536b" font-size="15">转写稿 + 时间戳 + 说话人 + 画面流</text>
  <text x="590" y="312" fill="#4d6a94" font-size="18" text-anchor="middle">↓</text>
  <rect x="449" y="326" width="300" height="38" rx="6" fill="#eef2f8"/>
  <text x="461" y="351" fill="#43536b" font-size="15">章节 / 重要性分数 / 可查询分段</text>
  <text x="449" y="404" fill="#5b6c85" font-size="15">准确率押在会议原生元数据，</text>
  <text x="449" y="430" fill="#5b6c85" font-size="15">不押在提示词运气</text>
  <text x="449" y="484" fill="#25324a" font-size="15" font-weight="bold">平台内纪要层被写进权利要求</text>
  <text x="449" y="512" fill="#8a99ae" font-size="13">平台外：保密场景与行规未覆盖</text>

  <!-- Panel 3: 一个人的机会 -->
  <rect x="810" y="140" width="350" height="430" rx="10" fill="#ffffff" stroke="#d5dde8"/>
  <rect x="810" y="140" width="350" height="54" rx="10" fill="#6f8bb0"/>
  <text x="834" y="174" fill="#ffffff" font-size="22" font-weight="bold">一个人能做的机会</text>
  <text x="834" y="226" fill="#25324a" font-size="17" font-weight="bold">行业化本地纪要部署包</text>
  <text x="834" y="256" fill="#43536b" font-size="15">Whisper 级转写 + pyannote 分离</text>
  <text x="834" y="282" fill="#43536b" font-size="15">+ 本地摘要 + 行业模板 + 内网部署</text>
  <line x1="834" y1="306" x2="1136" y2="306" stroke="#d5dde8"/>
  <text x="834" y="340" fill="#25324a" font-size="16" font-weight="bold">收费</text>
  <text x="834" y="368" fill="#43536b" font-size="15">律所 / 诊所部署 0.8-3 万每单</text>
  <text x="834" y="394" fill="#43536b" font-size="15">承诺台账席位 50-100 元每月</text>
  <line x1="834" y1="418" x2="1136" y2="418" stroke="#d5dde8"/>
  <text x="834" y="452" fill="#25324a" font-size="16" font-weight="bold">起步</text>
  <text x="834" y="480" fill="#43536b" font-size="15">GPU 服务器约 0.6-1.2 万元</text>
  <text x="834" y="506" fill="#43536b" font-size="15">1 人 4 周出可演示 MVP</text>

  <text x="60" y="606" fill="#8a99ae" font-size="14">信息来源：Google Patents 公开文本 · 观点仅为机会判断，不构成投资建议</text>
</svg>
