<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">2026 年 6 至 7 月四件会议纪要专利落地；平台圈住纪要层，保密行业本地部署留有空间</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">四件专利落地日期（2026 年，月内按日定位）</text>

  <!-- gridlines: month majors at 260/440/620; day ticks per day 40/31 -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="260" y1="126" x2="260" y2="330"/>
    <line x1="440" y1="126" x2="440" y2="330"/>
    <line x1="620" y1="126" x2="620" y2="330"/>
  </g>

  <!-- US12647532B2 Zoom 2026-06-02 grant: x = 260 + 1.29*1 = 261.3 -->
  <circle cx="261.3" cy="160" r="6" fill="#0072B2"/>
  <text x="272" y="142" font-size="12" fill="#1A1B1E" text-anchor="start">2026-06-02 授权</text>
  <text x="272" y="184" font-size="12" fill="#555">Zoom · US12647532B2</text>
  <text x="272" y="200" font-size="12" fill="#555">会中增量生成纪要</text>

  <!-- EP4162488B1 Microsoft 2026-06-17: x = 260 + 1.29*16 = 280.6 -->
  <circle cx="280.6" cy="238" r="6" fill="#0072B2"/>
  <text x="294" y="234" font-size="12" fill="#1A1B1E">2026-06-17 授权文本公开</text>
  <text x="294" y="252" font-size="12" fill="#555">Microsoft · EP4162488B1</text>
  <text x="294" y="268" font-size="12" fill="#555">音视频双流推断话语重要性</text>

  <!-- US12664798B2 Zoom 2026-06-23: x = 260 + 1.29*22 = 288.4 -->
  <circle cx="288.4" cy="308" r="6" fill="#0072B2"/>
  <text x="302" y="304" font-size="12" fill="#1A1B1E">2026-06-23 授权</text>
  <text x="302" y="322" font-size="12" fill="#555">Zoom · US12664798B2 — 转写稿 + 视频帧 + 时间戳切章节</text>

  <!-- US20260211885A1 Zoom 2026-07-23 pub: x = 440 + 1.29*22 = 468.4 -->
  <circle cx="468.4" cy="160" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <text x="482" y="142" font-size="12" fill="#1A1B1E">2026-07-23 公开（审查中）</text>
  <text x="482" y="184" font-size="12" fill="#555">Zoom · US20260211885A1</text>
  <text x="482" y="200" font-size="12" fill="#555">分段记录按查询回查承诺</text>

  <!-- value axis -->
  <line x1="260" y1="330" x2="620" y2="330" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="260" y1="330" x2="260" y2="334"/>
    <line x1="440" y1="330" x2="440" y2="334"/>
    <line x1="620" y1="330" x2="620" y2="334"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="260" y="354">6 月</text>
    <text x="440" y="354">7 月</text>
    <text x="620" y="354">8 月</text>
  </g>
  <text x="440" y="380" font-size="14" fill="#1A1B1E" text-anchor="middle">落地日期（2026 年）</text>

  <!-- legend -->
  <g font-size="12" fill="#555">
    <circle cx="268" cy="405" r="5" fill="#0072B2"/>
    <text x="280" y="409">授权 / 授权文本公开</text>
    <circle cx="450" cy="405" r="5" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.5"/>
    <text x="462" y="409">已公开申请（审查中）</text>
  </g>

  <!-- side note -->
  <text x="740" y="150" font-size="12" fill="#555">技术趋势（正文）：纪要从全文摘要升级为</text>
  <text x="740" y="168" font-size="12" fill="#555">章节、重要性分数、可查询分段的结构化</text>
  <text x="740" y="186" font-size="12" fill="#555">中间表示；准确率押在会议原生元数据上，</text>
  <text x="740" y="204" font-size="12" fill="#555">不押在提示词上</text>
  <text x="740" y="238" font-size="12" fill="#555">手工整理一次纪要约两小时；开源 Meetily</text>
  <text x="740" y="256" font-size="12" fill="#555">已验证「数据不出本机」纯本地管线</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="462" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="462" font-size="15" fill="#1A1B1E">正文自估金额区间（元，区间直标，不设公共刻度）</text>

  <!-- bars: 1000 = 14px -->
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="240" y="503">本地部署包起步成本</text>
    <text x="240" y="543">部署服务 / 家</text>
    <text x="240" y="583">承诺台账 / 席·月</text>
  </g>

  <rect x="252" y="489" width="84" height="18" fill="#0072B2"/>
  <line x1="252" y1="486" x2="252" y2="510" stroke="#0072B2" stroke-width="0.75"/>
  <line x1="336" y1="486" x2="336" y2="510" stroke="#0072B2" stroke-width="0.75"/>
  <text x="346" y="503" font-size="12" fill="#555">6000–12000 元（GPU 服务器或其月租）</text>

  <rect x="252" y="529" width="280" height="18" fill="#0072B2"/>
  <line x1="252" y1="526" x2="252" y2="550" stroke="#0072B2" stroke-width="0.75"/>
  <line x1="532" y1="526" x2="532" y2="550" stroke="#0072B2" stroke-width="0.75"/>
  <text x="542" y="543" font-size="12" fill="#555">8000–30000 元（每家交付一到两周）</text>

  <rect x="252" y="569" width="3.5" height="18" fill="#0072B2"/>
  <line x1="252" y1="566" x2="252" y2="590" stroke="#0072B2" stroke-width="0.75"/>
  <line x1="255.5" y1="566" x2="255.5" y2="590" stroke="#0072B2" stroke-width="0.75"/>
  <text x="266" y="583" font-size="12" fill="#555">50–100 元（按席位月费）</text>

  <text x="60" y="618" font-size="12" fill="#555">三档金额为正文自估口径，非市场实测；区间以竖线端点表示上下界。</text>

  <!-- footnote -->
  <text x="60" y="648" font-size="11" fill="#767676">数据：Google Patents 四件详情页核验（状态分别标注，US20260211885A1 审查中）· Meetily 关注为 2026 年年中社区信号 · 定价为正文自估口径，不构成投资建议</text>
</svg>
