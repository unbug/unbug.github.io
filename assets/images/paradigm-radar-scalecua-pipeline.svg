<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="1200" height="470" fill="#FFFFFF"/>
<text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937">ScaleCUA：把「可验证」做进桌面数据的流水线</text>
<defs><marker id="c1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F2937"/></marker></defs>
<rect x="60" y="96" width="250" height="96" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
<text x="185" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#7F1D1D">数据瓶颈</text>
<text x="185" y="162" text-anchor="middle" font-size="13" fill="#374151">桌面操作轨迹贵且难标</text>
<rect x="370" y="96" width="250" height="96" rx="10" fill="#EAF2FB" stroke="#2F6FB2" stroke-width="2"/>
<text x="495" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">任务合成</text>
<text x="495" y="162" text-anchor="middle" font-size="13" fill="#374151">带程序化验收标准</text>
<rect x="680" y="96" width="250" height="96" rx="10" fill="#EAF6EF" stroke="#166534" stroke-width="2"/>
<text x="805" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#14532D">真机执行</text>
<text x="805" y="162" text-anchor="middle" font-size="13" fill="#374151">成败由测试判定</text>
<rect x="990" y="96" width="150" height="96" rx="10" fill="#FDF6E3" stroke="#D1A400" stroke-width="2"/>
<text x="1065" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#713F12">入训</text>
<text x="1065" y="162" text-anchor="middle" font-size="13" fill="#374151">只收可验证轨迹</text>
<line x1="312" y1="144" x2="368" y2="144" stroke="#1F2937" stroke-width="2.2" marker-end="url(#c1)"/>
<line x1="622" y1="144" x2="678" y2="144" stroke="#1F2937" stroke-width="2.2" marker-end="url(#c1)"/>
<line x1="932" y1="144" x2="988" y2="144" stroke="#1F2937" stroke-width="2.2" marker-end="url(#c1)"/>
<rect x="150" y="260" width="900" height="140" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="600" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2937">思想同构链</text>
<text x="600" y="328" text-anchor="middle" font-size="14" fill="#374151">CodeAct 拿解释器当裁判 → PROVE 把可执行性做成奖励 → ScaleCUA 把可验证性前移到数据生产线</text>
<text x="600" y="358" text-anchor="middle" font-size="13" fill="#6B7280">同一个原子（机器可判的完成条件）在推理、训练、数据三个场景各自结晶</text>
<text x="600" y="440" text-anchor="middle" font-size="14" fill="#6B7280">边界：可验证任务 ≠ 全部真实任务——验收标准写不出来的长尾仍然在流水线外</text></svg>
