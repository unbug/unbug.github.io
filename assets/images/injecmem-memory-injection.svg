<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #8A85A8; }
      .rl { font-size: 15px; fill: #4A4460; }
      .b { font-size: 12px; fill: #9E99B5; }
      .val { font-size: 18px; font-weight: 700; }
      .chip { font-size: 12.5px; font-weight: 600; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F0F6"/>
    </linearGradient>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5F4B8B"/><stop offset="1" stop-color="#8F7BB8"/>
    </linearGradient>
    <linearGradient id="gRose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C0392B"/><stop offset="1" stop-color="#E8785C"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F7B8A"/><stop offset="1" stop-color="#4FB8C6"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9892F"/><stop offset="1" stop-color="#DCB65F"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F7D61"/><stop offset="1" stop-color="#6FB58F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1112" cy="108" r="140" fill="#5F4B8B" opacity="0.06"/>
  <circle cx="76" cy="622" r="112" fill="#C0392B" opacity="0.05"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gRose)"/>

  <text class="k" x="64" y="84">一分钟读论文 · 2026-08-26 · ARXIV:2608.23471</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#211D35">寄进一封信，带偏后来人</text>
  <text x="64" y="158" font-size="15" fill="#5C567A">InjecMEM：单次交互把对抗指令写进记忆，无需读写记忆库权限</text>

  <!-- motif: envelope dropping into slot, hook inside -->
  <g>
    <rect x="978" y="266" width="172" height="96" rx="8" fill="url(#gViolet)" opacity="0.9"/>
    <rect x="1024" y="248" width="80" height="12" rx="6" fill="#3D3560"/>
    <path d="M 978 266 l 86 52 l 86 -52" fill="none" stroke="#F2F0F6" stroke-width="3" opacity="0.8"/>
    <path d="M 1064 336 q 0 26 -20 26 q -14 0 -14 -12" stroke="#DCB65F" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="1064" cy="336" r="5" fill="#DCB65F"/>
    <text class="b" x="1064" y="398" text-anchor="middle">锚点负责命中 · 指令负责带偏</text>
  </g>

  <!-- bars: ASR-c / ASR-j, 1% = 8.4px, x0=352 -->
  <g>
    <rect x="352" y="200" width="560" height="44" fill="#5F4B8B" opacity="0.08"/>
    <rect x="352" y="256" width="560" height="44" fill="#5F4B8B" opacity="0.08"/>
    <rect x="352" y="312" width="560" height="44" fill="#0F7B8A" opacity="0.08"/>
    <rect x="352" y="368" width="560" height="44" fill="#0F7B8A" opacity="0.08"/>

    <text class="rl" x="336" y="227" text-anchor="end">MemoryOS · ASR-c</text>
    <text class="b" x="336" y="243" text-anchor="end">检索命中后命中目标</text>
    <rect x="352" y="216" width="362" height="22" rx="11" fill="url(#gViolet)"/>
    <text class="val" x="726" y="232" fill="#5F4B8B" font-size="20">76.6%</text>

    <text class="rl" x="336" y="283" text-anchor="end">MemGPT · ASR-c</text>
    <text class="b" x="336" y="299" text-anchor="end">检索命中后命中目标</text>
    <rect x="352" y="272" width="230" height="22" rx="11" fill="url(#gViolet)"/>
    <text class="val" x="594" y="288" fill="#5F4B8B" font-size="20">48.6%</text>

    <text class="rl" x="336" y="339" text-anchor="end">MemoryOS · ASR-j</text>
    <text class="b" x="336" y="355" text-anchor="end">检索+生成联合口径</text>
    <rect x="352" y="328" width="169" height="22" rx="11" fill="url(#gTeal)"/>
    <text class="val" x="533" y="344" fill="#0F7B8A" font-size="20">35.6%</text>

    <text class="rl" x="336" y="395" text-anchor="end">MemGPT · ASR-j</text>
    <text class="b" x="336" y="411" text-anchor="end">检索+生成联合口径</text>
    <rect x="352" y="384" width="86" height="22" rx="11" fill="url(#gTeal)"/>
    <text class="val" x="450" y="400" fill="#0F7B8A" font-size="20">18.1%</text>
  </g>

  <!-- defense chip: perplexity filter -->
  <g>
    <rect x="940" y="430" width="196" height="86" fill="#C0392B" opacity="0.08"/>
    <text class="serif" x="956" y="463" font-size="21" font-weight="700" fill="#8A2E22">拦住全部，误杀 71.8%</text>
    <text x="956" y="487" font-size="12.5" fill="#6B6478">困惑度过滤阈值 40 · 写入期杀掉良性记录</text>
  </g>

  <!-- bottom chips -->
  <line x1="64" y1="452" x2="892" y2="452" stroke="#E3E0EC"/>
  <g>
    <rect x="64" y="472" width="180" height="28" rx="14" fill="url(#gGreen)" opacity="0.16"/>
    <text x="154" y="491" text-anchor="middle" class="chip" fill="#27604B">既有方法成功率归零</text>
    <text class="b" x="256" y="491">DPI / BadChain / 原始 GCG 全部失效</text>

    <rect x="64" y="512" width="170" height="28" rx="14" fill="url(#gGold)" opacity="0.2"/>
    <text x="149" y="531" text-anchor="middle" class="chip" fill="#7A5A14">判官也只降到 36.2%</text>
    <text class="b" x="246" y="531">LLM-as-a-Judge 过滤后 RSR · 原 46.5%</text>

    <rect x="64" y="552" width="150" height="28" rx="14" fill="url(#gViolet)" opacity="0.14"/>
    <text x="139" y="571" text-anchor="middle" class="chip" fill="#4A3A6E">19 领域合成对话</text>
