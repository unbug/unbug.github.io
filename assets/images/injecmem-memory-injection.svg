  </g>

  <text class="serif" x="940" y="562" font-size="18" fill="#211D35">安全与效用，此消彼长。</text>
  <text class="b" x="1136" y="640" text-anchor="end">结论限于小参数模型与两个记忆系统 · 自称非目标查询不受影响 · Micropaper</text>
</svg>
