    <text x="874" y="426" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#9fb3d9">+ 完整性自检</text>
    <rect x="874" y="452" width="232" height="34" rx="17" fill="url(#accentGrad)" opacity="0.16"/>
    <text x="990" y="474" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#8ab4ff" text-anchor="middle">起步 &lt; 2 万元 · 4 周 MVP</text>
    <text x="874" y="512" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#9fb3d9">订阅 / 按项目收费</text>
  </g>

  <!-- footer -->
  <line x1="70" y1="572" x2="1130" y2="572" stroke="#ffffff" opacity="0.12"/>
  <text x="70" y="604" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#6d81a8">AI 智创简报 · unbug.github.io</text>
  <text x="1130" y="604" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#6d81a8" text-anchor="end">2026-08-22</text>
</svg>
