<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">PRD 生成专利 US20260178323A1 于 2026-06-25 公开；vibe coding 瓶颈在上游需求输入</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">US20260178323A1 关键日期（月内按日定位）</text>

  <!-- scale: month = 60px; 2024-12=260, 2025-12=980, 2026-06=1340 >1140 -> month=48px: 2024-12=260, 2025-12=836, 2026-06-25=260+48*18+48*24/30=1153 -> use month=44px, left=180: 2024-12=180? Keep left 260, month=44: 2026-06-25 = 260+44*18.8=1087 -->
  <!-- gridlines at each quarter: 2025-03=350, 2025-09=476, 2026-03=692, ... simpler: majors every 6 months -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="260" y1="126" x2="260" y2="250"/>
    <line x1="524" y1="126" x2="524" y2="250"/>
    <line x1="788" y1="126" x2="788" y2="250"/>
    <line x1="1052" y1="126" x2="1052" y2="250"/>
  </g>

  <!-- provisional 2024-12: x=260 -->
  <circle cx="260" cy="160" r="6" fill="#999999"/>
  <text x="260" y="142" font-size="12" fill="#1A1B1E" text-anchor="middle">2024-12</text>
  <text x="260" y="184" font-size="12" fill="#555" text-anchor="middle">临时申请优先权</text>

  <!-- filing 2025-12-16: x = 260 + 264*12 + 44*(15/31) = 260+3168+21= overflow!
       Correct: months since 2024-12 to 2025-12 = 12 -> 260+44*12=788; day offset 44*15/31=21 -> 809 -->
  <circle cx="809" cy="160" r="6" fill="#999999"/>
  <text x="809" y="142" font-size="12" fill="#1A1B1E" text-anchor="middle">2025-12-16</text>
  <text x="809" y="184" font-size="12" fill="#555" text-anchor="middle">申请日</text>

  <!-- publish 2026-06-25: months 18 -> 260+44*18=1052; day 44*24/30=35 -> 1087 -->
  <circle cx="1087" cy="160" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <text x="1087" y="142" font-size="12" fill="#1A1B1E" text-anchor="end">2026-06-25</text>
  <text x="1087" y="184" font-size="12" fill="#555" text-anchor="end">公开（审查中）</text>
  <text x="1087" y="200" font-size="12" fill="#555" text-anchor="end">Crowdbotics</text>

  <!-- value axis -->
  <line x1="260" y1="250" x2="1100" y2="250" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="260" y1="250" x2="260" y2="254"/>
    <line x1="524" y1="250" x2="524" y2="254"/>
    <line x1="788" y1="250" x2="788" y2="254"/>
    <line x1="1052" y1="250" x2="1052" y2="254"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="260" y="274">2024-12</text>
    <text x="524" y="274">2025-06</text>
    <text x="788" y="274">2025-12</text>
    <text x="1052" y="274">2026-06</text>
  </g>
  <text x="680" y="300" font-size="14" fill="#1A1B1E" text-anchor="middle">日期（优先权—申请—公开）</text>

  <!-- legend -->
  <g font-size="12" fill="#555">
    <circle cx="268" cy="325" r="5" fill="#999999"/>
    <text x="280" y="329">优先权 / 申请</text>
    <circle cx="420" cy="325" r="5" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.5"/>
    <text x="432" y="329">已公开申请（审查中），分类号 G06F8/10、G06F8/73</text>
  </g>

  <!-- pipeline note -->
  <text x="60" y="382" font-size="12" fill="#555">专利主张的管线（正文）：自然语言需求描述 → 特征列表 + 预期输出规格 → LLM 生成 PRD → 机器评估完整性与准确性；</text>
  <text x="60" y="400" font-size="12" fill="#555">PRD 为下游工件枢纽，派生输出含用户画像、epic、用户故事、技术建议与 starter code。</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="462" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="462" font-size="15" fill="#1A1B1E">产业佐证与正文自估金额（直标数值，不设公共刻度）</text>

  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="240" y="503">Lovable ARR（2026-06）</text>
    <text x="240" y="543">Lovable 新建项目 / 周</text>
    <text x="240" y="583">PRD 工具订阅 / 月</text>
  </g>

  <rect x="252" y="489" width="360" height="18" fill="#D55E00"/>
  <text x="622" y="503" font-size="12" fill="#555">5 亿美元（TechCrunch 报道口径）</text>

  <rect x="252" y="529" width="72" height="18" fill="#D55E00"/>
  <text x="334" y="543" font-size="12" fill="#555">100 万个</text>

  <rect x="252" y="569" width="10" height="18" fill="#0072B2"/>
  <line x1="252" y1="566" x2="252" y2="590" stroke="#0072B2" stroke-width="0.75"/>
  <line x1="262" y1="566" x2="262" y2="590" stroke="#0072B2" stroke-width="0.75"/>
  <text x="272" y="583" font-size="12" fill="#555">9–19 美元 / 月或按文档计费（正文自估）</text>

  <text x="700" y="543" font-size="12" fill="#555">需求拆解接单：500–2000 元 / 项目（正文自估）</text>
  <text x="700" y="561" font-size="12" fill="#555">佐证：需求输入是 vibe coding 上游瓶颈；</text>
  <text x="700" y="579" font-size="12" fill="#555">1 人 4 周可出 MVP，起步成本月均几百元 API 费加</text>
  <text x="700" y="597" font-size="12" fill="#555">域名与托管，远低于 2 万元</text>

  <!-- footnote -->
  <text x="60" y="648" font-size="11" fill="#767676">数据：US20260178323A1 为申请公开文本（不等于已授权，Google Patents / FreePatentsOnline 核验）· Lovable 数据来自 TechCrunch 2026-06-09 报道 · 订阅与接单定价为正文自估口径，不构成投资建议</text>
</svg>
