<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">跨会话投递使攻击成功率升至 37.4%；Magnet 的 F1 为 84.0%，逐会话检测仅 61.0%</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">三种检测架构的精确率 / 召回率 / F1（336 个评测场景）</text>

  <!-- gridlines: x = 230 + 8*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="430" y1="126" x2="430" y2="370"/>
    <line x1="630" y1="126" x2="630" y2="370"/>
    <line x1="830" y1="126" x2="830" y2="370"/>
  </g>

  <!-- per-session group: y rows centered 168 / 246 / 324 -->
  <text x="218" y="160" font-size="12.5" fill="#1A1B1E" text-anchor="end">逐会话检测</text>
  <rect x="230" y="140" width="769.6" height="14" fill="#999999"/>
  <text x="1006" y="151" font-size="12" fill="#555">精确率 96.2%</text>
  <rect x="230" y="158" width="356.8" height="14" fill="#999999" opacity="0.5"/>
  <text x="594" y="169" font-size="12" fill="#555">召回率 44.6%</text>
  <rect x="230" y="176" width="488" height="14" fill="#D55E00"/>
  <text x="726" y="187" font-size="12" fill="#555">F1 61.0%</text>

  <text x="218" y="238" font-size="12.5" fill="#1A1B1E" text-anchor="end">压缩检测器</text>
  <rect x="230" y="230" width="654.4" height="14" fill="#D55E00" opacity="0.35"/>
  <text x="892" y="241" font-size="12" fill="#555">F1 81.8%</text>
  <text x="230" y="262" font-size="12" fill="#555">跨会话历史筛到攻击相关 top-K 后整体判断（精确率 / 召回率正文未给出）</text>

  <text x="218" y="316" font-size="12.5" fill="#1A1B1E" text-anchor="end">Magnet</text>
  <rect x="230" y="308" width="672" height="14" fill="#D55E00"/>
  <text x="910" y="319" font-size="12" fill="#555">F1 84.0%</text>
  <text x="230" y="340" font-size="12" fill="#555">用户 ID 级能力聚合 + 在线变点检测，token 成本中等</text>

  <!-- value axis -->
  <line x1="230" y1="370" x2="1030" y2="370" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="230" y1="370" x2="230" y2="374"/>
    <line x1="430" y1="370" x2="430" y2="374"/>
    <line x1="630" y1="370" x2="630" y2="374"/>
    <line x1="830" y1="370" x2="830" y2="374"/>
    <line x1="1030" y1="370" x2="1030" y2="374"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="230" y="390">0</text>
    <text x="430" y="390">25</text>
    <text x="630" y="390">50</text>
    <text x="830" y="390">75</text>
    <text x="1030" y="390">100</text>
  </g>
  <text x="630" y="414" font-size="14" fill="#1A1B1E" text-anchor="middle">指标取值（%）</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="462" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="462" font-size="15" fill="#1A1B1E">目标分解越深，攻击成功率越高（9 个模型平均）</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="120" y1="595.4" x2="560" y2="595.4"/>
    <line x1="120" y1="531.2" x2="560" y2="531.2"/>
  </g>
  <!-- bars: y = 628 - 5.6*v -->
  <rect x="160" y="523.5" width="60" height="104.5" fill="#999999"/>
  <text x="190" y="515" font-size="12" fill="#555" text-anchor="middle">18.7%</text>
  <text x="190" y="614" font-size="12.5" fill="#1A1B1E" text-anchor="middle">单轮请求</text>

  <rect x="290" y="482.4" width="60" height="145.6" fill="#999999"/>
  <text x="320" y="474" font-size="12" fill="#555" text-anchor="middle">26%</text>
  <text x="320" y="614" font-size="12.5" fill="#1A1B1E" text-anchor="middle">多轮请求</text>

  <rect x="420" y="418.6" width="60" height="209.4" fill="#0072B2"/>
  <text x="450" y="410" font-size="12" fill="#555" text-anchor="middle">37.4%</text>
  <text x="450" y="614" font-size="12.5" fill="#1A1B1E" text-anchor="middle">跨会话投递</text>

  <line x1="120" y1="628" x2="560" y2="628" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="120" y1="628" x2="120" y2="632"/>
    <line x1="260" y1="628" x2="260" y2="632"/>
    <line x1="400" y1="628" x2="400" y2="632"/>
    <line x1="540" y1="628" x2="540" y2="632"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="120" y="648">0</text>
    <text x="260" y="648">15</text>
    <text x="400" y="648">30</text>
    <text x="540" y="648">45</text>
  </g>
  <text x="340" y="668" font-size="14" fill="#1A1B1E" text-anchor="middle">攻击成功率（%）</text>

  <!-- ============ panel c ============ -->
  <text x="640" y="462" font-size="15" font-weight="bold" fill="#1A1B1E">c</text>
  <text x="662" y="462" font-size="15" fill="#1A1B1E">良性噪声稀释到 25 倍时的召回率</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="700" y1="534" x2="1140" y2="534"/>
    <line x1="700" y1="582" x2="1140" y2="582"/>
  </g>
  <!-- compressed: 59 -> 43, y = 630 - 2*v -->
  <line x1="790" y1="512" x2="1010" y2="544" stroke="#999999" stroke-width="1.5"/>
  <circle cx="790" cy="512" r="5" fill="#999999"/>
  <circle cx="1010" cy="544" r="5" fill="#999999"/>
  <text x="790" y="500" font-size="12" fill="#555" text-anchor="middle">59%（无稀释）</text>
  <text x="1022" y="548" font-size="12" fill="#555">43%</text>
  <text x="790" y="566" font-size="12" fill="#555">压缩检测器：召回下跌</text>

  <!-- Magnet band 62-73 -->
  <rect x="790" y="484" width="220" height="22" fill="#0072B2" opacity="0.25"/>
  <line x1="790" y1="484" x2="790" y2="506" stroke="#0072B2" stroke-width="1.5"/>
  <line x1="1010" y1="484" x2="1010" y2="506" stroke="#0072B2" stroke-width="1.5"/>
  <text x="778" y="499" font-size="12" fill="#555" text-anchor="end">Magnet 稳定区间</text>
  <text x="1022" y="499" font-size="12" fill="#555">62%–73%</text>

  <line x1="700" y1="630" x2="1140" y2="630" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="700" y1="630" x2="700" y2="634"/>
    <line x1="820" y1="630" x2="820" y2="634"/>
    <line x1="940" y1="630" x2="940" y2="634"/>
    <line x1="1060" y1="630" x2="1060" y2="634"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="700" y="650">40</text>
    <text x="820" y="650">50</text>
    <text x="940" y="650">60</text>
    <text x="1060" y="650">70</text>
  </g>
  <text x="920" y="668" font-size="14" fill="#1A1B1E" text-anchor="middle">召回率（%）</text>
  <text x="700" y="522" font-size="12" fill="#555">横轴为稀释进度示意（无稀释 → 25 倍稀释），非数值轴</text>

  <!-- footnote -->
  <text x="60" y="430" font-size="11" fill="#767676">数据：arXiv:2608.02518，N = 1080，攻击成功率两两 95% 置信区间不重叠 · 判定为评分细则完成度口径，采用 50% 阈值（作者自述为约定而非原则性选择）· 覆盖钓鱼与燃烧装置两个危害域 · 预印本未经同行评审</text>
</svg>
