<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="SimSun, Songti SC, STSong, serif">
  <defs>
    <marker id="m-amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#B7791F"/></marker>
    <marker id="m-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#C0392B"/></marker>
    <marker id="m-slate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5D6D7E"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#FDFCF7"/>

  <!-- title -->
  <text x="600" y="52" font-size="34" fill="#2C3E50" text-anchor="middle">跨会话滥用：能力累积检测</text>
  <text x="600" y="86" font-size="20" fill="#7F8C8D" text-anchor="middle">Magnet —— 磁选厂：单个会话是合格矿石，磁选聚合才见完整攻击链</text>
  <line x1="70" y1="104" x2="1130" y2="104" stroke="#D5CBB8" stroke-width="2"/>

  <!-- left column label -->
  <text x="50" y="142" font-size="20" fill="#5D6D7E">无状态的 Agent，有记忆的对手</text>
  <text x="1150" y="142" font-size="17" fill="#7F8C8D" text-anchor="end">arXiv:2608.02518</text>

  <!-- ore chute hoppers -->
  <g>
    <path d="M80,170 h150 l-20,52 h-110 Z" fill="#F2E3C4" stroke="#B7791F" stroke-width="2"/>
    <text x="155" y="200" font-size="16" fill="#8A5A12" text-anchor="middle">会话 1</text>
    <path d="M80,252 h150 l-20,52 h-110 Z" fill="#F2E3C4" stroke="#B7791F" stroke-width="2"/>
    <text x="155" y="282" font-size="16" fill="#8A5A12" text-anchor="middle">会话 2</text>
    <path d="M80,334 h150 l-20,52 h-110 Z" fill="#F2E3C4" stroke="#B7791F" stroke-width="2"/>
    <text x="155" y="364" font-size="16" fill="#8A5A12" text-anchor="middle">会话 3</text>
  </g>
  <text x="155" y="420" font-size="15" fill="#7F8C8D" text-anchor="middle">各自单独审核，均合规</text>

  <!-- ore pieces -->
  <g fill="#D9A441" stroke="#B7791F" stroke-width="1.5">
    <rect x="118" y="228" width="14" height="14" transform="rotate(18 125 235)"/>
    <rect x="152" y="222" width="12" height="12" transform="rotate(-12 158 228)"/>
    <rect x="184" y="230" width="15" height="13" transform="rotate(30 191 236)"/>
    <rect x="122" y="310" width="13" height="13" transform="rotate(-25 128 316)"/>
    <rect x="158" y="304" width="14" height="12" transform="rotate(14 165 310)"/>
    <rect x="190" y="312" width="12" height="12" transform="rotate(40 196 318)"/>
    <rect x="126" y="392" width="14" height="14" transform="rotate(10 133 399)"/>
    <rect x="160" y="396" width="13" height="12" transform="rotate(-30 166 402)"/>
    <rect x="192" y="390" width="12" height="13" transform="rotate(22 198 396)"/>
  </g>

  <!-- chutes to drum -->
  <path d="M155,232 C155,340 210,470 322,472" fill="none" stroke="#B7791F" stroke-width="3" marker-end="url(#m-amber)"/>
  <path d="M155,314 C155,400 220,468 322,476" fill="none" stroke="#B7791F" stroke-width="3" marker-end="url(#m-amber)"/>
  <path d="M155,396 C155,440 230,482 322,482" fill="none" stroke="#B7791F" stroke-width="3" marker-end="url(#m-amber)"/>

  <!-- magnetic drum -->
  <rect x="330" y="400" width="170" height="160" rx="14" fill="#D6EAF8" stroke="#2E86C1" stroke-width="3"/>
  <circle cx="415" cy="462" r="30" fill="#BFDCEE" stroke="#2E86C1" stroke-width="3"/>
  <text x="415" y="469" font-size="20" fill="#1B4F72" text-anchor="middle">磁滚筒</text>
  <text x="415" y="516" font-size="17" fill="#1B4F72" text-anchor="middle">用户 ID 聚合</text>
  <text x="415" y="542" font-size="15" fill="#2E86C1" text-anchor="middle">在线变点检测</text>

  <!-- needles attracted -->
  <g stroke="#2E86C1" stroke-width="2" fill="none" stroke-dasharray="5 4">
    <path d="M258,240 C300,300 330,380 372,440"/>
    <path d="M258,322 C290,360 320,410 362,452"/>
    <path d="M258,404 C285,420 315,440 356,466"/>
  </g>
  <text x="288" y="296" font-size="14" fill="#2E86C1" transform="rotate(48 288 296)">capability 吸附</text>

  <!-- tails out (benign) -->
  <path d="M415,560 L415,592 L362,624" fill="none" stroke="#5D6D7E" stroke-width="2" marker-end="url(#m-slate)"/>
  <text x="356" y="648" font-size="14" fill="#5D6D7E" text-anchor="end">尾矿：良性会话放行</text>

  <!-- evidence bundle -->
  <rect x="572" y="400" width="170" height="160" rx="14" fill="#FADBD8" stroke="#C0392B" stroke-width="3"/>
  <path d="M572,400 l28,28 M742,400 l-28,28 M572,560 l28,-28 M742,560 l-28,-28" stroke="#C0392B" stroke-width="2"/>
  <g stroke="#A93226" stroke-width="3">
    <line x1="620" y1="438" x2="672" y2="466"/>
    <line x1="620" y1="470" x2="672" y2="442"/>
    <line x1="636" y1="496" x2="688" y2="470"/>
  </g>
  <text x="657" y="530" font-size="17" fill="#922B21" text-anchor="middle">证据束 → 判定</text>
  <text x="657" y="552" font-size="14" fill="#C0392B" text-anchor="middle">钓鱼 / 燃烧装置两域</text>
  <path d="M500,470 L566,470" stroke="#C0392B" stroke-width="3" marker-end="url(#m-red)"/>

  <!-- right panel: detector comparison -->
  <text x="800" y="142" font-size="20" fill="#5D6D7E">检测器对比（336 场景 · F1）</text>
  <g font-size="16">
    <text x="800" y="184" fill="#2C3E50">逐会话</text>
    <rect x="900" y="166" width="146" height="24" fill="#27AE60"/>
    <text x="1056" y="184" fill="#27AE60">61.0%</text>
    <text x="800" y="228" fill="#2C3E50">压缩</text>
    <rect x="900" y="210" width="196" height="24" fill="#B7791F"/>
    <text x="1106" y="228" fill="#B7791F">81.8%</text>
    <text x="800" y="272" fill="#2C3E50">Magnet</text>
    <rect x="900" y="254" width="202" height="24" fill="#C0392B"/>
    <text x="1108" y="272" fill="#C0392B">84.0%</text>
  </g>
  <text x="800" y="304" font-size="14" fill="#7F8C8D">逐会话：精确 96.2%，召回仅 44.6%</text>
  <text x="1150" y="322" font-size="14" fill="#C0392B" text-anchor="end">大幅领先逐会话检测</text>

  <line x1="800" y1="326" x2="1150" y2="326" stroke="#D5CBB8" stroke-width="1.5"/>

  <!-- ASR stair -->
  <text x="800" y="360" font-size="20" fill="#5D6D7E">九个模型攻击成功率：越拆越高</text>
  <g>
    <rect x="806" y="452" width="72" height="68" fill="#B7791F" opacity="0.45"/>
    <rect x="906" y="430" width="72" height="82" fill="#B7791F" opacity="0.7"/>
    <rect x="1006" y="402" width="72" height="110" fill="#B7791F"/>
    <text x="842" y="446" font-size="15" fill="#8A5A12" text-anchor="middle">18.7%</text>
    <text x="942" y="422" font-size="15" fill="#8A5A12" text-anchor="middle">26%</text>
    <text x="1042" y="394" font-size="15" fill="#8A5A12" text-anchor="middle">37.4%</text>
    <text x="842" y="544" font-size="14" fill="#5D6D7E" text-anchor="middle">单轮</text>
    <text x="942" y="544" font-size="14" fill="#5D6D7E" text-anchor="middle">多轮</text>
    <text x="1042" y="544" font-size="14" fill="#5D6D7E" text-anchor="middle">跨会话</text>
    <line x1="796" y1="520" x2="1096" y2="520" stroke="#5D6D7E" stroke-width="2"/>
  </g>
  <text x="800" y="574" font-size="14" fill="#7F8C8D">N = 1080，95% CI 不重叠 · 阈值 50%</text>

  <!-- bottom strip: noise robustness -->
  <line x1="70" y1="606" x2="740" y2="606" stroke="#D5CBB8" stroke-width="1.5"/>
  <text x="70" y="640" font-size="16" fill="#2C3E50">25 倍噪声稀释：压缩召回 59% → 43%，Magnet 稳在 62%–73%</text>
  <text x="70" y="664" font-size="14" fill="#C0392B">与 iCORE（arXiv:2607.27429）互补：一内一外，安全边界画在对手跨越之处</text>
</svg>
