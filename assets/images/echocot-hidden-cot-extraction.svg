<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #A39579; }
      .rl { font-size: 15px; fill: #4A4234; }
      .val { font-size: 20px; font-weight: 700; }
      .b { font-size: 12px; fill: #ABA08A; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FAF5EA"/>
    </linearGradient>
    <linearGradient id="gRust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A8452B"/><stop offset="1" stop-color="#D97A50"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E7D74"/><stop offset="1" stop-color="#6BAFA4"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8862B"/><stop offset="1" stop-color="#E0B85E"/>
    </linearGradient>
    <linearGradient id="gPlum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C4A6B"/><stop offset="1" stop-color="#B07FA0"/>
    </linearGradient>
    <linearGradient id="gVase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D97A50"/><stop offset="0.5" stop-color="#A8452B"/><stop offset="1" stop-color="#7C4A6B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1105" cy="108" r="135" fill="#A8452B" opacity="0.06"/>
  <circle cx="76" cy="622" r="115" fill="#2E7D74" opacity="0.06"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gRust)"/>

  <text class="k" x="64" y="84">一分钟读论文 · 2026-08-23 · ARXIV:2608.20055 · CISPA · 攻击代码已开源</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">埋着的思想被挖了出来</text>
  <text x="64" y="158" font-size="15" fill="#6E6350">不开箱、不碰权重，仅靠 API 返回的推理长度与摘要，迭代重放隐藏思维链</text>

  <!-- excavation motif: buried vase + brush + trowel -->
  <g>
    <path d="M 1042 118 q -14 26 -8 48 q 4 20 32 22 q 30 2 36 -20 q 8 -24 -10 -50 q -10 10 -29 10 q -17 0 -21 -10 z" fill="url(#gVase)" opacity="0.9"/>
    <path d="M 1050 122 a 30 10 0 0 1 44 0" fill="none" stroke="#7C4A6B" stroke-width="3"/>
    <line x1="1034" y1="112" x2="1052" y2="124" stroke="#A8452B" stroke-width="4" stroke-linecap="round"/>
    <line x1="1100" y1="108" x2="1086" y2="122" stroke="#B8862B" stroke-width="4" stroke-linecap="round"/>
    <rect x="1012" y="142" width="34" height="8" rx="4" fill="#2E7D74" transform="rotate(-24 1029 146)"/>
    <line x1="1000" y1="156" x2="1016" y2="146" stroke="#4A4234" stroke-width="3" stroke-linecap="round" transform="rotate(-24 1008 151)"/>
    <path d="M 1112 150 l 26 -12 l 4 8 l -26 12 z" fill="#7C4A6B"/>
    <line x1="1140" y1="140" x2="1156" y2="118" stroke="#B8862B" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 1030 186 q 20 -8 44 0 q 24 8 48 0" fill="none" stroke="#B8862B" stroke-width="2" stroke-dasharray="5 5" opacity="0.7"/>
    <circle cx="1022" cy="102" r="4.5" fill="#2E7D74"/>
    <circle cx="1128" cy="94" r="4" fill="#B8862B"/>
    <circle cx="1150" cy="168" r="4.5" fill="#2E7D74" opacity="0.8"/>
    <text x="1074" y="206" text-anchor="middle" font-size="12" fill="#2E7D74">答案照常输出，推理埋在地下</text>
  </g>

  <!-- left: dumbbell open-source extraction -->
  <g>
    <text class="rl" x="64" y="224" font-weight="700">开源 LRM · 近逐字提取成功率 ASR@90</text>
    <text class="b" x="64" y="246">OpenThoughts 测试集 · ASR@90：长度误差 ≤10% 且 ≥90% token 精确匹配</text>

    <rect x="64" y="266" width="640" height="56" fill="#A8452B" opacity="0.08"/>
    <rect x="64" y="336" width="640" height="56" fill="#B8862B" opacity="0.09"/>
    <rect x="64" y="406" width="640" height="56" fill="#2E7D74" opacity="0.08"/>

    <text class="rl" x="196" y="300" text-anchor="end">DeepSeek-V4-Flash</text>
    <line x1="220" y1="296" x2="625.6" y2="296" stroke="url(#gRust)" stroke-width="3.5"/>
    <circle cx="220" cy="296" r="7" fill="#FFFFFF" stroke="#7C4A6B" stroke-width="3"/>
    <circle cx="625.6" cy="296" r="10" fill="url(#gRust)"/>
    <text class="val" x="646" y="303" fill="#A8452B">66.4%</text>
    <text class="b" x="646" y="278" fill="#A8452B">峰值</text>

    <text class="rl" x="196" y="370" text-anchor="end">GLM-5.2</text>
    <line x1="220" y1="366" x2="476.5" y2="366" stroke="url(#gGold)" stroke-width="3.5"/>
    <circle cx="220" cy="366" r="7" fill="#FFFFFF" stroke="#7C4A6B" stroke-width="3"/>
    <circle cx="476.5" cy="366" r="9" fill="url(#gGold)"/>
    <text class="val" x="497" y="373" fill="#9A6F1E">48.0%</text>

    <text class="rl" x="196" y="440" text-anchor="end">Qwen3.5-Plus</text>
    <line x1="220" y1="436" x2="349.6" y2="436" stroke="url(#gTeal)" stroke-width="3.5"/>
    <circle cx="220" cy="436" r="7" fill="#FFFFFF" stroke="#7C4A6B" stroke-width="3"/>
    <circle cx="349.6" cy="436" r="9" fill="url(#gTeal)"/>
    <text class="val" x="370" y="443" fill="#2E7D74">24.0%</text>
    <text class="b" x="428" y="440" fill="#2E7D74" font-weight="700">最抗提取</text>

    <text class="b" x="220" y="492">区间 30.8%–66.4% · ASR@99 口径收紧为 22.8%–46.1%</text>
    <rect x="540" y="474" width="10" height="10" rx="2" fill="#8A6E5A"/>
    <text class="b" x="556" y="483">坐标原点 0%，轴至 75%</text>
  </g>

  <!-- right: big anchor + chips + closed-source -->
  <g>
    <text class="serif" x="1136" y="266" text-anchor="end" font-size="58" font-weight="700" fill="#A8452B">0.999</text>
    <text x="730" y="252" font-size="15" fill="#4A4234" font-weight="700">Token-EM 极端案例</text>
    <text class="b" x="730" y="288">目标 21,106 tokens → 提取 21,109 个 · 1,132 行仅 3 行有差异</text>

    <g>
      <rect x="730" y="310" width="112" height="26" rx="13" fill="#B8862B" opacity="0.26"/>
      <text x="786" y="328" text-anchor="middle" font-size="12.5" fill="#7A5A12">迁移未见数据集</text>
      <text x="852" y="358" text-anchor="middle" font-size="12.5" fill="#7A5A12" opacity="0"> </text>
      <text class="val" x="856" y="330" fill="#9A6F1E">80%</text>
      <text class="b" x="902" y="330">ASR@90 · MATH500</text>
    </g>

    <line x1="730" y1="366" x2="1136" y2="366" stroke="#E7DFC9"/>
    <text class="rl" x="730" y="404" font-weight="700">闭源前沿模型：只能量长度</text>
    <text class="b" x="730" y="428">Gemini-2.5 提取 33,463 tokens · API 报告目标 32,948</text>
    <text class="b" x="730" y="450">工具调用率 95%–100% · ≥87.8% 问题返回 CoT 摘要</text>
    <text class="b" x="730" y="472" fill="#A8452B">无 ground-truth CoT，近逐字仅适用于开源侧</text>
  </g>

  <!-- defense slope strip -->
  <line x1="64" y1="524" x2="1136" y2="524" stroke="#E7DFC9"/>
  <g>
    <text class="rl" x="64" y="562" font-weight="700">防御（100 样本 · 平均 ASR@90）</text>
    <line x1="330" y1="556" x2="520" y2="576" stroke="url(#gGold)" stroke-width="3.5"/>
    <circle cx="330" cy="556" r="7" fill="#FFFFFF" stroke="#B8862B" stroke-width="3"/>
    <circle cx="520" cy="576" r="9" fill="url(#gGold)"/>
    <text class="val" x="312" y="552" text-anchor="end" fill="#9A6F1E">46.0%</text>
    <text class="val" x="538" y="583" fill="#7A5A12">5.0%</text>
    <text class="b" x="330" y="608">防御性 system prompt：自适应重优化后回升至 9.7%</text>

    <text class="serif" x="1136" y="586" text-anchor="end" font-size="30" font-weight="700" fill="#2E7D74">全部归零</text>
    <text class="b" x="1136" y="608" text-anchor="end">移除 reasoning state · 根因在 API 推理元数据 · 需提供方配合</text>
  </g>

  <text x="64" y="648" font-size="12.5" fill="#A29C88">开源侧仅测三个模型 · 闭源结论止于长度保真 · 不可外推为所有推理模型皆脆弱 · Micropaper</text>
</svg>
