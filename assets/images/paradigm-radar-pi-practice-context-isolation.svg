<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="1200" height="520" fill="#FFFFFF"/>
<text x="600" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#1F2937">子任务上下文隔离：谁该看见什么</text>
<rect x="450" y="80" width="300" height="70" rx="10" fill="#F3F4F6" stroke="#1F2937" stroke-width="2"/>
<text x="600" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">State Manager</text>
<text x="600" y="134" text-anchor="middle" font-size="14" fill="#374151">已执行队列 · 未执行队列 · 结果摘要</text>
<defs><marker id="a1" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#2F6FB2"/></marker>
<marker id="a2" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#C0392B"/></marker></defs>
<line x1="520" y1="150" x2="240" y2="228" stroke="#2F6FB2" stroke-width="2.2" marker-end="url(#a1)"/>
<line x1="600" y1="150" x2="600" y2="228" stroke="#2F6FB2" stroke-width="2.2" marker-end="url(#a1)"/>
<line x1="680" y1="150" x2="960" y2="228" stroke="#2F6FB2" stroke-width="2.2" marker-end="url(#a1)"/>
<text x="330" y="185" font-size="13" fill="#2F6FB2">计划骨架(全量)+依赖结果(按需)</text>
<g>
<rect x="90" y="235" width="300" height="118" rx="10" fill="#EAF2FB" stroke="#2F6FB2" stroke-width="2"/>
<text x="240" y="268" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">Executor · 子任务 1</text>
<text x="240" y="296" text-anchor="middle" font-size="14" fill="#374151">窗口=本步描述+声明的前序输入</text>
<text x="240" y="320" text-anchor="middle" font-size="14" fill="#374151">不接收整条对话历史</text>
<text x="240" y="344" text-anchor="middle" font-size="13" fill="#6B7280">产出:结构化结果+status</text>
<rect x="450" y="235" width="300" height="118" rx="10" fill="#EAF2FB" stroke="#2F6FB2" stroke-width="2"/>
<text x="600" y="268" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">Executor · 子任务 2</text>
<text x="600" y="296" text-anchor="middle" font-size="14" fill="#374151">干净的短期记忆板</text>
<text x="600" y="320" text-anchor="middle" font-size="14" fill="#374151">无关子任务的状态不可见</text>
<text x="600" y="344" text-anchor="middle" font-size="13" fill="#6B7280">产出:结构化结果+status</text>
<rect x="810" y="235" width="300" height="118" rx="10" fill="#EAF2FB" stroke="#2F6FB2" stroke-width="2"/>
<text x="960" y="268" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">Executor · 子任务 3</text>
<text x="960" y="296" text-anchor="middle" font-size="14" fill="#374151">失败即结构化上报</text>
<text x="960" y="320" text-anchor="middle" font-size="14" fill="#374151">不自行改写计划</text>
<text x="960" y="344" text-anchor="middle" font-size="13" fill="#6B7280">产出:error+现场快照</text>
</g>
<line x1="240" y1="353" x2="240" y2="400" stroke="#C0392B" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a2)"/>
<line x1="600" y1="353" x2="600" y2="400" stroke="#C0392B" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a2)"/>
<line x1="960" y1="353" x2="960" y2="400" stroke="#C0392B" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a2)"/>
<rect x="150" y="405" width="900" height="72" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="1.8"/>
<text x="600" y="435" text-anchor="middle" font-size="16" fill="#7F1D1D">隔离的欠账：隐式信息不会自动流过断点，转述层=新的开销与新的幻觉入口</text>
<text x="600" y="461" text-anchor="middle" font-size="15" fill="#7F1D1D">折衷：计划骨架全量传 · 前序结果按依赖传 · 原始观察默认不传（分析观点）</text>
</svg>
