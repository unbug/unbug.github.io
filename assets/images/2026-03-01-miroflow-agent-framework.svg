<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#F0F0F0"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#009E73">分层智能体图框架 MiroFlow 在多个深度研究基准上报告先进性能，正文未给出具体分数</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#009E73">a</text>
  <text x="82" y="104" font-size="15" fill="#009E73">深度研究协作流程（序列步骤轴，非数值刻度）</text>

  <!-- flow boxes -->
  <g>
    <rect x="110" y="140" width="190" height="64" fill="#F0F0F0" stroke="#0072B2" stroke-width="1.5"/>
    <text x="205" y="167" font-size="12.5" fill="#009E73" text-anchor="middle">查询增强</text>
    <text x="205" y="187" font-size="12" fill="#555" text-anchor="middle">主智能体分析意图</text>
    <polygon points="308,172 322,165 322,179" fill="#999999"/>

    <rect x="330" y="140" width="190" height="64" fill="#F0F0F0" stroke="#0072B2" stroke-width="1.5"/>
    <text x="425" y="167" font-size="12.5" fill="#009E73" text-anchor="middle">任务分解</text>
    <text x="425" y="187" font-size="12" fill="#555" text-anchor="middle">拆解为子任务</text>
    <polygon points="528,172 542,165 542,179" fill="#999999"/>

    <rect x="550" y="140" width="220" height="64" fill="#F0F0F0" stroke="#0072B2" stroke-width="1.5"/>
    <text x="660" y="167" font-size="12.5" fill="#009E73" text-anchor="middle">子任务委派</text>
    <text x="660" y="187" font-size="12" fill="#555" text-anchor="middle">搜索 / 网页阅读 / 编码</text>
    <polygon points="778,172 792,165 792,179" fill="#999999"/>

    <rect x="800" y="140" width="190" height="64" fill="#F0F0F0" stroke="#D55E00" stroke-width="1.5"/>
    <text x="895" y="167" font-size="12.5" fill="#009E73" text-anchor="middle">结果综合</text>
    <text x="895" y="187" font-size="12" fill="#555" text-anchor="middle">主智能体整合答案</text>
  </g>

  <!-- sequence axis -->
  <line x1="110" y1="248" x2="990" y2="248" stroke="#009E73" stroke-width="0.75"/>
  <g stroke="#009E73" stroke-width="0.75">
    <line x1="205" y1="248" x2="205" y2="252"/>
    <line x1="425" y1="248" x2="425" y2="252"/>
    <line x1="660" y1="248" x2="660" y2="252"/>
    <line x1="895" y1="248" x2="895" y2="252"/>
  </g>
  <g font-size="12.5" fill="#009E73" text-anchor="middle">
    <text x="205" y="276">步骤一</text>
    <text x="425" y="276">步骤二</text>
    <text x="660" y="276">步骤三</text>
    <text x="895" y="276">步骤四</text>
  </g>
  <text x="550" y="308" font-size="14" fill="#009E73" text-anchor="middle">协作步骤（序列位置轴，非数值刻度）</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="368" font-size="15" font-weight="bold" fill="#009E73">b</text>
  <text x="82" y="368" font-size="15" fill="#009E73">框架特性（论文自述，定性）</text>
  <g font-size="12.5" fill="#009E73">
    <circle cx="86" cy="402" r="4" fill="#0072B2"/>
    <text x="102" y="407">智能体图：自上而下灵活组合智能体与组件，适配特定任务工作流</text>
    <circle cx="86" cy="434" r="4" fill="#0072B2"/>
    <text x="102" y="439">深度推理模式（可选）：高风险或复杂场景中更深入推理与自我验证</text>
    <circle cx="86" cy="466" r="4" fill="#0072B2"/>
    <text x="102" y="471">健壮工作流：强制结构化生成、遵守任务规范，减轻随机错误</text>
  </g>

  <!-- ============ panel c ============ -->
  <text x="60" y="530" font-size="15" font-weight="bold" fill="#009E73">c</text>
  <text x="82" y="530" font-size="15" fill="#009E73">报告先进性能的基准（定性列举，论文自测口径）</text>
  <g font-size="12.5" fill="#009E73">
    <rect x="110" y="552" width="110" height="28" fill="#F0F0F0" stroke="#999999" stroke-width="1.5"/>
    <text x="165" y="571" text-anchor="middle">GAIA</text>
    <rect x="235" y="552" width="190" height="28" fill="#F0F0F0" stroke="#999999" stroke-width="1.5"/>
    <text x="330" y="571" text-anchor="middle">BrowseComp-EN/ZH</text>
    <rect x="440" y="552" width="90" height="28" fill="#F0F0F0" stroke="#999999" stroke-width="1.5"/>
    <text x="485" y="571" text-anchor="middle">HLE</text>
    <rect x="545" y="552" width="210" height="28" fill="#F0F0F0" stroke="#999999" stroke-width="1.5"/>
    <text x="650" y="571" text-anchor="middle">xBench-DeepSearch</text>
    <rect x="770" y="552" width="120" height="28" fill="#F0F0F0" stroke="#D55E00" stroke-width="1.5"/>
    <text x="830" y="571" text-anchor="middle">FutureX</text>
  </g>
  <line x1="830" y1="584" x2="830" y2="600" stroke="#D55E00" stroke-width="0.75"/>
  <text x="836" y="606" font-size="12" fill="#555" text-anchor="start">FutureX 为正文特别点名的基准</text>

  <!-- footnote -->
  <text x="60" y="646" font-size="11" fill="#767676">数据：arXiv:2602.22808（2026 年 2 月 26 日提交，论文自测口径）· 正文未报告具体分数与误差区间，a 面板为序列步骤轴，b/c 面板为定性列举 · 预印本未经同行评审</text>
</svg>
