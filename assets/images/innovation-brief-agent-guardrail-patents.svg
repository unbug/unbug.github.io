<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">四件 Agent 专利在 2026 年上半年集中公开：3 件申请公开、1 件已授权；解法全在模型外的调用链上</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">四件专利事件时间轴（实心 = 授权，空心 = 申请公开）</text>

  <!-- event rail -->
  <line x1="90" y1="214" x2="1074" y2="214" stroke="#1A1B1E" stroke-width="1.5"/>
  <!-- markers on event line y=214 -->
  <circle cx="203" cy="214" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <circle cx="392" cy="214" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <circle cx="581" cy="214" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <circle cx="670" cy="214" r="6.5" fill="#D55E00"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="203" y1="206" x2="203" y2="186"/>
    <line x1="392" y1="206" x2="392" y2="186"/>
    <line x1="581" y1="206" x2="581" y2="186"/>
    <line x1="670" y1="206" x2="670" y2="186"/>
  </g>

  <!-- dates above the line -->
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="203" y="176">2026-02-12</text>
    <text x="392" y="176">2026-04-23</text>
    <text x="581" y="176">2026-07-02</text>
    <text x="670" y="160">2026-08-04</text>
  </g>

  <!-- detail list below the line, chronological, one row per patent -->
  <g font-size="12" fill="#555">
    <text x="90" y="248">○ US20260044392 公开 · Rutgers 大学 · 2026-02-12　→　Agent 操作系统：调度器与记忆管理器</text>
    <text x="90" y="272">○ US20260111248 公开 · UiPath · 2026-04-23　→　卡住时升级给人，解法记下来供下次自愈</text>
    <text x="90" y="296">○ US20260188475 公开 · Hippocratic AI · 2026-07-02　→　跨会话记忆：知识图谱与 token 化 KV 缓存</text>
    <text x="90" y="320">● US 12,699,853 授权 · Microsoft · 2026-08-04　→　幻觉检测：由答案反向重建问句比对</text>
  </g>

  <!-- date axis (time axis: no gridlines per style guide) -->
  <line x1="90" y1="336" x2="1074" y2="336" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="90" y1="336" x2="90" y2="340"/>
    <line x1="336" y1="336" x2="336" y2="340"/>
    <line x1="582" y1="336" x2="582" y2="340"/>
    
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="90" y="356">2026-01</text>
    <text x="336" y="356">2026-04</text>
    <text x="582" y="356">2026-07</text>
    
  </g>
  <text x="582" y="380" font-size="14" fill="#1A1B1E" text-anchor="middle">事件日期（年-月，窗口 2026 年）</text>
  <text x="90" y="404" font-size="12" fill="#555">● 授权　○ 申请公开</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="444" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="444" font-size="15" fill="#1A1B1E">IFI Claims 2025 年统计：份额、增速与授权总量</text>

  <!-- share bar: full gray band = AI 专利总量, blue = agentic share -->
  <rect x="90" y="464" width="1020" height="22" fill="#D9D9D9"/>
  <rect x="90" y="464" width="153" height="22" fill="#0072B2"/>
  <line x1="243" y1="460" x2="243" y2="490" stroke="#0072B2" stroke-width="2"/>
  <text x="90" y="512" font-size="12" fill="#555">agentic AI 相关申请占 AI 专利总量 15%（灰带 = 总量）</text>

  <!-- growth bar -->
  <rect x="90" y="536" width="401" height="22" fill="#0072B2"/>
  <text x="501" y="551" font-size="12" fill="#555">agentic AI 相关申请同比增长 59%（全球）</text>

  <!-- grants milestone -->
  <rect x="90" y="576" width="120" height="22" fill="#D55E00"/>
  <text x="220" y="591" font-size="12" fill="#555">2025 年全球 AI 专利授权量首次突破 100,000 件（授权口径）</text>

  <!-- footnote -->
  <text x="60" y="628" font-size="11" fill="#767676">数据：US20260044392、US20260111248、US20260188475、US 12,699,853 公开/授权公告日 · IFI Claims 2025 年统计（100,000 件为授权口径；59% 为 agentic AI 申请全球同比；15% 为占 AI 专利总量比）</text>
  <text x="60" y="646" font-size="11" fill="#767676">前三件为申请公开，不等于已授权 · 面板 b 条带仅示意相对幅度，无共享数值轴</text>
</svg>
