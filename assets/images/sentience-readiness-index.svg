<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">31 国 AI 意识准备度平均仅 33.03 分，最高分英国也只有 49 分</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">代表性国家与全球平均的准备度得分（满分 100，柱长按数值等比）</text>

  <!-- UK 49 -->
  <text x="228" y="162" font-size="12.5" fill="#1A1B1E" text-anchor="end">英国（最高分）</text>
  <rect x="240" y="148" width="490" height="20" fill="#0072B2"/>
  <text x="738" y="162" font-size="12" fill="#555">49</text>
  <!-- global avg 33.03 -->
  <text x="228" y="222" font-size="12.5" fill="#1A1B1E" text-anchor="end">31 国平均</text>
  <rect x="240" y="208" width="330.3" height="20" fill="#D55E00"/>
  <text x="578" y="222" font-size="12" fill="#555">33.03</text>
  <!-- Turkey 14.25 -->
  <text x="228" y="282" font-size="12.5" fill="#1A1B1E" text-anchor="end">土耳其（最低档）</text>
  <rect x="240" y="268" width="142.5" height="20" fill="#999999"/>
  <text x="390" y="282" font-size="12" fill="#555">14.25</text>
  <!-- full-scale reference line at 100 -->
  <line x1="730" y1="130" x2="730" y2="300" stroke="#1A1B1E" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="738" y="142" font-size="12" fill="#555">满分 100 参考线：无国家达到</text>

  <!-- baseline -->
  <line x1="240" y1="300" x2="730" y2="300" stroke="#1A1B1E" stroke-width="0.75"/>
  <text x="240" y="326" font-size="12" fill="#767676">条形左端起点为最低分刻度</text>
  <text x="240" y="356" font-size="12" fill="#555">最高分英国处于「部分准备」阶段，无国家达到中等水平</text>

  <!-- ============ panel b ============ -->
  <text x="820" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="842" y="104" font-size="15" fill="#1A1B1E">准备水平与国家分布（n = 31 国）</text>

  <!-- stacked composition bar: 10px per country; 23+8=31 国（差值由正文得出） -->
  <text x="820" y="140" font-size="12" fill="#555">最低准备水平 23 国，占比 74.2%</text>
  <rect x="820" y="152" width="230" height="22" fill="#D55E00"/>
  <rect x="1050" y="152" width="80" height="22" fill="#999999"/>
  <text x="828" y="168" font-size="12" fill="#FFFFFF">23 国</text>
  <text x="1090" y="168" font-size="12" fill="#1A1B1E" text-anchor="middle">其余国家</text>

  <g font-size="12" fill="#555">
    <text x="820" y="200">· 报告称无国家达到中等及以上水平</text>
    <text x="820" y="222">· 法律框架、政策准备两维</text>
    <text x="820" y="244">　平均得分不足 30 分</text>
    <text x="820" y="266">· 社会共识、技术能力两维正文未给出数值</text>
    <text x="820" y="288">· 技术能力得分相对较高的国家，</text>
    <text x="820" y="310">　法律与政策并不同样领先</text>
  </g>
  <text x="820" y="348" font-size="12" fill="#767676">正文未披露逐维度分值，本面板不画数值轴</text>

  <!-- footnote -->
  <text x="60" y="560" font-size="11" fill="#767676">数据：《The Sentience Readiness Index》（牛津大学人类未来研究所 × 联合国 AI 治理实验室，31 国评估，报告自述口径）</text>
  <text x="60" y="580" font-size="11" fill="#767676">除英国、土耳其、31 国平均外的逐国分值正文未披露 · 「部分准备」「最低准备水平」为报告分级术语 · 其余国家数为 31 国与 23 国之差</text>
</svg>
