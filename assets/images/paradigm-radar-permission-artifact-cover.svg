<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">四周内四个互不隶属的主体把 Agent 权限写入四种载体；规范讨论热度远低于产品帖</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">载体动作时间线（2026-09-16 至 10-13，序位轴）</text>

  <!-- axis: x = 320 + 55*i -->
  <g stroke="#D9D9D9" stroke-width="0.5">
  </g>
  <line x1="320" y1="330" x2="1118" y2="330" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="320" y1="330" x2="320" y2="334"/>
    <line x1="430" y1="330" x2="430" y2="334"/>
    <line x1="540" y1="330" x2="540" y2="334"/>
    <line x1="650" y1="330" x2="650" y2="334"/>
    <line x1="760" y1="330" x2="760" y2="334"/>
    <line x1="870" y1="330" x2="870" y2="334"/>
    <line x1="980" y1="330" x2="980" y2="334"/>
    <line x1="1090" y1="330" x2="1090" y2="334"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="320" y="350">09-16</text>
    <text x="430" y="350">09-18</text>
    <text x="540" y="350">09-24</text>
    <text x="650" y="350">09-26</text>
    <text x="760" y="350">09-29</text>
    <text x="870" y="350">10-08</text>
    <text x="980" y="350">10-13</text>
    <text x="1090" y="350">10-14</text>
  </g>
  <text x="732" y="374" font-size="14" fill="#1A1B1E" text-anchor="middle">日期（序位轴，仅排已实测日期）</text>

  <!-- rows -->
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="308" y="152">Docker 镜像</text>
    <text x="308" y="192">Okta 身份目录</text>
    <text x="308" y="232">Amex 支付授权</text>
    <text x="308" y="272">IETF 草案</text>
    <text x="308" y="312">需求侧事故（HN）</text>
  </g>
  <!-- Docker: 09-16 建仓, 09-24 CNCF, 10-14 PR#121 -->
  <circle cx="320" cy="148" r="6" fill="#0072B2"/>
  <circle cx="540" cy="148" r="6" fill="#0072B2"/>
  <circle cx="1090" cy="148" r="6" fill="#0072B2"/>
  <text x="330" y="152" font-size="12" fill="#555">建仓</text>
  <text x="550" y="152" font-size="12" fill="#555">交 CNCF</text>
  <text x="1082" y="140" font-size="12" fill="#555" text-anchor="end">PR #121</text>
  <!-- Okta: product page verified 10-15, in-window annotation at 10-14 -->
  <circle cx="1090" cy="188" r="6" fill="#009E73"/>
  <text x="1082" y="192" font-size="12" fill="#555" text-anchor="end">产品页实测 2026-10-15</text>
  <!-- Amex: 10-13 -->
  <circle cx="980" cy="228" r="6" fill="#E69F00"/>
  <text x="972" y="232" font-size="12" fill="#555" text-anchor="end">据 TechCrunch</text>
  <!-- IETF -->
  <text x="320" y="272" font-size="12" fill="#555">同线推进，本窗口内无实测日期，故不标定点</text>
  <!-- incidents -->
  <circle cx="650" cy="308" r="6" fill="#D55E00"/>
  <text x="660" y="312" font-size="12" fill="#555">Codex 7.8 万美元（84 分）</text>
  <circle cx="705" cy="308" r="6" fill="#D55E00"/>
  <circle cx="760" cy="308" r="6" fill="#D55E00"/>
  <text x="770" y="312" font-size="12" fill="#555">Meta Muse（164 分）</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="420" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="420" font-size="15" fill="#1A1B1E">产品与规范的冷热对比（HN 分数，实测 2026-10-15）</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="580" y1="444" x2="580" y2="590"/>
    <line x1="800" y1="444" x2="800" y2="590"/>
  </g>
  <!-- bars: h = 0.4804 * v, baseline y = 590 -->
  <rect x="360" y="443" width="72" height="147" fill="#0072B2"/>
  <text x="396" y="435" font-size="12" fill="#555" text-anchor="middle">306</text>
  <text x="396" y="608" font-size="12.5" fill="#1A1B1E" text-anchor="middle">Docker Agent 产品帖</text>

  <rect x="520" y="513" width="72" height="77" fill="#0072B2"/>
  <text x="556" y="505" font-size="12" fill="#555" text-anchor="middle">160</text>
  <text x="556" y="608" font-size="12.5" fill="#1A1B1E" text-anchor="middle">Agent37 沙箱</text>

  <rect x="680" y="586" width="72" height="4" fill="#999999"/>
  <text x="716" y="578" font-size="12" fill="#555" text-anchor="middle">7</text>
  <text x="716" y="608" font-size="12.5" fill="#1A1B1E" text-anchor="middle">规范主帖</text>

  <rect x="840" y="588.5" width="72" height="1.5" fill="#999999"/>
  <text x="876" y="580" font-size="12" fill="#555" text-anchor="middle">4</text>
  <text x="876" y="608" font-size="12.5" fill="#1A1B1E" text-anchor="middle">Amex 框架帖</text>

  <!-- value axis -->
  <line x1="300" y1="590" x2="1000" y2="590" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="590" x2="296" y2="590"/>
    <line x1="580" y1="590" x2="576" y2="590"/>
    <line x1="800" y1="590" x2="796" y2="590"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="290" y="594">0</text>
    <text x="290" y="468">200</text>
  </g>
  <text x="300" y="435" font-size="12" fill="#555">蓝色=产品帖，灰色=规范/框架帖</text>

  <!-- footnote -->
  <text x="60" y="650" font-size="11" fill="#767676">分数为 HN 实测（截至 2026-10-15）· sandbox-kit-spec 150 星、17 天 7 个里程碑 · Okta 为产品页实测 · 事故帖另计 · 载体胜负未分</text>
</svg>
