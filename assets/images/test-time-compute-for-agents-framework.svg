<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">额外计算不提高任务成功率，只把失败从可回退的停滞轨迹转移到不可逆的过早错误成功</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">同一条三步执行序列的每步 thinking tokens（正文示意口径，近似值）</text>

  <!-- gridlines: y = 400 - 0.08*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="140" y1="320" x2="700" y2="320"/>
    <line x1="140" y1="240" x2="700" y2="240"/>
    <line x1="140" y1="160" x2="700" y2="160"/>
  </g>

  <!-- uniform: 800/800/800 -->
  <rect x="180" y="336" width="64" height="64" fill="#999999"/>
  <rect x="256" y="336" width="64" height="64" fill="#999999"/>
  <rect x="332" y="336" width="64" height="64" fill="#999999"/>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="212" y="328">800</text>
    <text x="288" y="328">800</text>
    <text x="364" y="328">800</text>
  </g>
  <text x="212" y="424" font-size="12.5" fill="#1A1B1E" text-anchor="middle">步骤 1</text>
  <text x="288" y="424" font-size="12.5" fill="#1A1B1E" text-anchor="middle">步骤 2</text>
  <text x="364" y="424" font-size="12.5" fill="#1A1B1E" text-anchor="middle">步骤 3</text>
  <text x="288" y="446" font-size="12" fill="#555" text-anchor="middle">固定预算：每步一律 800，合计约 2,400</text>

  <!-- difficulty-scheduled: 300/1500/5000 -->
  <rect x="480" y="376" width="64" height="24" fill="#0072B2"/>
  <rect x="556" y="280" width="64" height="120" fill="#0072B2"/>
  <rect x="632" y="120" width="64" height="280" fill="#0072B2"/>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="512" y="368">300</text>
    <text x="588" y="272">1,500</text>
    <text x="664" y="112">5,000</text>
  </g>
  <text x="512" y="424" font-size="12.5" fill="#1A1B1E" text-anchor="middle">简单步</text>
  <text x="588" y="424" font-size="12.5" fill="#1A1B1E" text-anchor="middle">中等步</text>
  <text x="664" y="424" font-size="12.5" fill="#1A1B1E" text-anchor="middle">困难步</text>
  <text x="588" y="446" font-size="12" fill="#555" text-anchor="middle">按难度调度，合计约 7,200</text>

  <!-- value axis -->
  <line x1="140" y1="400" x2="700" y2="400" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="140" y1="400" x2="140" y2="404"/>
    <line x1="220" y1="400" x2="220" y2="404"/>
    <line x1="300" y1="400" x2="300" y2="404"/>
    <line x1="380" y1="400" x2="380" y2="404"/>
    <line x1="460" y1="400" x2="460" y2="404"/>
    <line x1="540" y1="400" x2="540" y2="404"/>
    <line x1="620" y1="400" x2="620" y2="404"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="140" y="420">0</text>
    <text x="300" y="420">1K</text>
    <text x="460" y="420">2K</text>
    <text x="620" y="420">3K</text>
  </g>
  <text x="420" y="474" font-size="14" fill="#1A1B1E" text-anchor="middle">每步 thinking tokens（约）</text>
  <!-- 轴刻度为等距网格值 0/1,000/2,000/3,000；数据标注 800/300/1,500/5,000 均逐字取自正文 -->

  <!-- ============ panel b ============ -->
  <text x="760" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="782" y="104" font-size="15" fill="#1A1B1E">核心结论：失败模式迁移</text>

  <rect x="760" y="140" width="380" height="56" fill="none" stroke="#999999" stroke-width="1.5"/>
  <text x="776" y="164" font-size="13" fill="#1A1B1E">旧失败：重复 / 停滞轨迹</text>
  <text x="776" y="184" font-size="12" fill="#555">可回退</text>
  <rect x="760" y="240" width="380" height="56" fill="#D55E00"/>
  <text x="776" y="264" font-size="13" fill="#FFFFFF">新失败：过早错误成功</text>
  <text x="776" y="284" font-size="12" fill="#FFFFFF">不可逆，模型自信地执行错误操作序列</text>
  <text x="760" y="330" font-size="12" fill="#555">额外计算不改变任务成功率，只改变失败位置</text>

  <line x1="760" y1="360" x2="1140" y2="360" stroke="#D9D9D9" stroke-width="0.5"/>
  <text x="760" y="392" font-size="13" fill="#1A1B1E">参照系：搜索式扩展的证据</text>
  <text x="760" y="418" font-size="12" fill="#555">Tree of Thoughts 在 Game of 24：4% → 74%</text>
  <text x="760" y="440" font-size="12" fill="#555">OpenAI o1/o3：准确率与 thinking tokens 近似对数线性，</text>
  <text x="760" y="458" font-size="12" fill="#555">边际收益在 &gt;10K tokens 区间显著递减</text>

  <!-- footnote -->
  <text x="60" y="530" font-size="11" fill="#767676">数据：arXiv:2607.28573（Woongkyu Lee 与 Jungwook Choi，论文自测口径）· a 面板预算数额为正文示意近似值 · b 面板 4%→74% 引自 Tree of Thoughts（arXiv:2305.10601）· 预印本未经同行评审</text>
</svg>
