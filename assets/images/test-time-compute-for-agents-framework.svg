<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9A937F; }
      .rl { font-size: 15px; fill: #3D4450; }
      .b { font-size: 12.5px; fill: #A29C88; }
    </style>
    <linearGradient id="gSimple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E7D8C"/><stop offset="1" stop-color="#6FB4BF"/>
    </linearGradient>
    <linearGradient id="gMedium" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3E5FA8"/><stop offset="1" stop-color="#7E97D2"/>
    </linearGradient>
    <linearGradient id="gComplex" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C8A3F"/><stop offset="1" stop-color="#87BC5E"/>
    </linearGradient>
    <linearGradient id="gUniform" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A8842C"/><stop offset="1" stop-color="#D6BC6A"/>
    </linearGradient>
    <linearGradient id="gFail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5442E"/><stop offset="1" stop-color="#CC7A6A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#FBFAF7"/>
  <rect x="0" y="0" width="44" height="5" fill="#B5442E"/>
  <circle cx="1112" cy="596" r="130" fill="#2E7D8C" opacity="0.06"/>
  <circle cx="76" cy="96" r="96" fill="#B5442E" opacity="0.05"/>

  <text class="k" x="64" y="84">一分钟读论文 · ARXIV:2607.28573 · LEE &amp; CHOI</text>
  <text class="serif" x="64" y="130" font-size="37" font-weight="700" fill="#1A1B1E">多花的算力，买回一种新失败</text>
  <text x="64" y="160" font-size="15.5" fill="#6E6A5C">Agent 场景的测试时计算实证：预算按难度调度，而非在推理链上均匀延长</text>
  <line x1="64" y1="184" x2="1136" y2="184" stroke="#E5E1D4"/>

  <!-- waterfalls: uniform vs difficulty-scheduled -->
  <g>
    <text class="rl" x="64" y="216" font-weight="700" fill="#1A1B1E">同一条序列 · 两种预算给法（示意）</text>

    <text class="b" x="120" y="266" text-anchor="middle">固定预算</text>
    <rect x="120" y="280" width="74" height="106" fill="url(#gUniform)" opacity="0.85"/>
    <rect x="206" y="280" width="74" height="106" fill="url(#gUniform)" opacity="0.85"/>
    <rect x="292" y="280" width="74" height="106" fill="url(#gUniform)" opacity="0.85"/>
    <text class="serif" x="120" y="424" font-size="27" font-weight="700" fill="#8A6C20">≈2,400 tokens</text>
    <text class="b" x="120" y="446">每步均匀 ~800</text>

    <text class="b" x="470" y="266" text-anchor="middle">动态预算</text>
    <rect x="470" y="356" width="66" height="30" fill="url(#gSimple)"/>
    <rect x="548" y="280" width="66" height="106" fill="url(#gMedium)"/>
    <rect x="626" y="236" width="66" height="150" fill="url(#gComplex)"/>
    <text x="503" y="406" text-anchor="middle" font-size="12" fill="#2E7D8C">~300</text>
    <text x="581" y="406" text-anchor="middle" font-size="12" fill="#3E5FA8">~1,500</text>
    <text x="659" y="406" text-anchor="middle" font-size="12" fill="#3F6E33">~5,000</text>
    <text class="serif" x="470" y="424" font-size="27" font-weight="700" fill="#1A1B1E">≈7,200 tokens</text>
    <text class="b" x="470" y="446">按难度调度 · 调度对象是子任务预算</text>
  </g>

  <!-- right: failure-mode shift -->
  <g>
    <text class="rl" x="790" y="216" font-weight="700" fill="#1A1B1E">算力不涨成功率，只挪失败位置</text>
    <rect x="790" y="232" width="346" height="26" fill="#A8842C" opacity="0.13"/>
    <text x="963" y="250" text-anchor="middle" font-size="13" fill="#7C6117">旧失败：重复 / 停滞轨迹</text>
    <text x="963" y="288" text-anchor="middle" font-size="18" fill="#B5442E">↓</text>
    <rect x="790" y="298" width="346" height="26" fill="url(#gFail)" opacity="0.92"/>
    <text x="963" y="316" text-anchor="middle" font-size="13" fill="#FFFFFF">新失败：过早错误成功</text>
    <text class="b" x="790" y="348">停滞可回退，过早错误成功不可逆</text>
    <text class="b" x="790" y="368">模型自信地执行了错误的操作序列</text>

    <rect x="790" y="392" width="346" height="1.5" fill="#3E5FA8" opacity="0.5"/>
    <circle cx="818" cy="392" r="5" fill="none" stroke="#A8842C" stroke-width="2.5"/>
    <circle cx="1096" cy="392" r="5.5" fill="#B5442E"/>
    <text class="b" x="818" y="414" text-anchor="middle" fill="#7C6117">0%</text>
    <text class="b" x="1096" y="414" text-anchor="middle" fill="#B5442E">74%</text>
    <text class="rl" x="790" y="444">ToT 在 Game of 24 对 GPT-4 自回归</text>
    <text class="b" x="790" y="464">4% → 74% · 边际收益在 &gt;10K tokens 递减</text>
  </g>

  <!-- four scaling dimensions chips -->
  <g>
    <text x="64" y="502" font-size="14" fill="#1A1B1E" font-weight="700">四个扩展维度</text>
    <rect x="190" y="484" width="150" height="28" fill="url(#gSimple)" opacity="0.85"/>
    <text x="265" y="503" text-anchor="middle" font-size="13" fill="#FFFFFF">上下文扩展</text>
    <text x="356" y="503" fill="#9A937F" font-size="16">→</text>
    <rect x="376" y="484" width="150" height="28" fill="url(#gMedium)" opacity="0.85"/>
    <text x="451" y="503" text-anchor="middle" font-size="13" fill="#FFFFFF">时间扩展</text>
    <text x="542" y="503" fill="#9A937F" font-size="16">→</text>
    <rect x="562" y="484" width="150" height="28" fill="url(#gComplex)" opacity="0.85"/>
    <text x="637" y="503" text-anchor="middle" font-size="13" fill="#FFFFFF">结构分解</text>
    <text x="728" y="503" fill="#9A937F" font-size="16">→</text>
    <rect x="748" y="484" width="150" height="28" fill="url(#gFail)" opacity="0.92"/>
    <text x="823" y="503" text-anchor="middle" font-size="13" fill="#FFFFFF">并行扩展</text>
    <text class="b" x="920" y="503">本地 CUA 要框架，不是堆算力</text>
  </g>

  <line x1="64" y1="548" x2="1136" y2="548" stroke="#E5E1D4"/>
  <text class="serif" x="64" y="582" font-size="19" fill="#1A1B1E">算力不是不够多，是给错了地方——先学会按难度出价。</text>
  <text class="b" x="64" y="612">预算数额为原文示意图口径 · ToT 74%/4% 引自 Tree of Thoughts 对照 · Micropaper</text>
</svg>
