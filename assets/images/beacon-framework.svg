<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #A08F6E; }
      .rl { font-size: 15px; fill: #4A4234; }
      .val { font-size: 22px; font-weight: 700; }
      .b { font-size: 12px; fill: #ACA084; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FBF4E4"/>
    </linearGradient>
    <linearGradient id="gHoney" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8A21C"/><stop offset="1" stop-color="#F5C95E"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C46A1F"/><stop offset="1" stop-color="#E39B4F"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F7A6D"/><stop offset="1" stop-color="#5FB39A"/>
    </linearGradient>
    <linearGradient id="gPlum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7D4A87"/><stop offset="1" stop-color="#B07FB8"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5442E"/><stop offset="1" stop-color="#D97A55"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1105" cy="600" r="140" fill="#7D4A87" opacity="0.06"/>
  <circle cx="80" cy="620" r="110" fill="#E8A21C" opacity="0.07"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gRed)"/>

  <text class="k" x="64" y="84">一分钟读论文 · ARXIV:2607.28595</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#23201A">采蜜有度，不空飞</text>
  <text x="64" y="158" font-size="15" fill="#6E6552">Beacon：让多模态模型学会何时自主推理、何时调用工具</text>

  <!-- beehive motif -->
  <g>
    <path d="M 1016 108 a 62 44 0 0 1 124 0 z" fill="url(#gHoney)"/>
    <path d="M 1006 108 h 144 v 18 a 72 26 0 0 1 -144 0 z" fill="url(#gAmber)"/>
    <path d="M 1016 142 a 70 26 0 0 0 124 0 v 16 a 62 24 0 0 1 -124 0 z" fill="#A95C18" opacity="0.85"/>
    <circle cx="1088" cy="150" r="7" fill="#23201A"/>
    <g fill="#23201A">
      <ellipse cx="1010" cy="66" rx="7" ry="4.5" transform="rotate(-18 1010 66)"/>
      <ellipse cx="1001" cy="61" rx="4" ry="2.6" fill="#8A7B5E"/>
      <ellipse cx="1160" cy="92" rx="7" ry="4.5" transform="rotate(14 1160 92)"/>
      <ellipse cx="1169" cy="87" rx="4" ry="2.6" fill="#8A7B5E"/>
    </g>
    <path d="M 1022 52 q 20 -12 40 0 q 20 12 40 0" fill="none" stroke="#C46A1F" stroke-width="2" stroke-dasharray="3 4" opacity="0.7"/>
    <text class="b" x="1088" y="196" text-anchor="middle">该飞才飞 · 飞则有用</text>
  </g>

  <!-- MA / TE dual dimensions -->
  <g>
    <rect x="64" y="206" width="456" height="92" rx="10" fill="#1F7A6D" opacity="0.07"/>
    <text class="rl" x="88" y="240" font-weight="700" fill="#1F5A50">MA 模式自适应</text>
    <text x="88" y="268" font-size="14" fill="#4A4234">在自主推理与工具辅助之间切对</text>
    <circle cx="470" cy="248" r="16" fill="#FFFFFF" stroke="#1F7A6D" stroke-width="3"/>

    <rect x="64" y="312" width="456" height="92" rx="10" fill="#E8A21C" opacity="0.09"/>
    <text class="rl" x="88" y="346" font-weight="700" fill="#8A5E10">TE 工具贡献度</text>
    <text x="88" y="374" font-size="14" fill="#4A4234">每次调用都要带来可量化提升</text>
    <path d="M 456 366 l 10 -14 l 16 22 l 14 -32 l 10 6" fill="none" stroke="#C46A1F" stroke-width="3.5" stroke-linecap="round"/>

    <line x1="292" y1="300" x2="292" y2="310" stroke="#B9AC8C" stroke-width="1.5"/>
    <text class="b" x="64" y="432">MA 与 TE 正相关：切得对，也调得值</text>
  </g>

  <!-- reward hive bars -->
  <g>
    <text class="rl" x="1136" y="248" text-anchor="end" font-size="16" font-weight="700" fill="#23201A">NAAR 自适应奖励 · 一格一只蜜房</text>

    <rect x="672" y="266" width="464" height="56" fill="#B5442E" opacity="0.07"/>
    <text class="rl" x="672" y="300">能自主答对，却调了工具</text>
    <g fill="#B5442E">
      <path d="M 940 283 l 10 17 h -20 z"/><path d="M 966 283 l 10 17 h -20 z"/><path d="M 992 283 l 10 17 h -20 z"/><path d="M 1018 283 l 10 17 h -20 z"/>
    </g>
    <text class="val" x="1036" y="302" fill="#8A2E1E" font-size="16">低 TE 惩罚</text>

    <rect x="672" y="334" width="464" height="56" fill="#E8A21C" opacity="0.09"/>
    <text class="rl" x="672" y="368">工具确实提升准确性</text>
    <g fill="url(#gHoney)">
      <rect x="940" y="351" width="16" height="16" rx="3"/><rect x="960" y="351" width="16" height="16" rx="3"/><rect x="980" y="351" width="16" height="16" rx="3"/><rect x="1000" y="351" width="16" height="16" rx="3"/><rect x="1020" y="351" width="16" height="16" rx="3"/>
    </g>
    <text class="val" x="1046" y="370" fill="#8A5E10" font-size="16">正向奖励</text>

    <rect x="672" y="402" width="464" height="56" fill="#1F7A6D" opacity="0.07"/>
    <text class="rl" x="672" y="436">自主推理即可答对</text>
    <g fill="url(#gTeal)">
      <rect x="940" y="419" width="16" height="16" rx="3"/><rect x="960" y="419" width="16" height="16" rx="3"/><rect x="980" y="419" width="16" height="16" rx="3"/><rect x="1000" y="419" width="16" height="16" rx="3"/><rect x="1020" y="419" width="16" height="16" rx="3"/>
    </g>
    <text class="val" x="1046" y="438" fill="#1F5A50" font-size="16">更高奖励</text>
  </g>

  <!-- bottom findings -->
  <g>
    <text class="serif" x="64" y="508" font-size="26" font-weight="700" fill="#23201A">工具滥用率大幅下降<tspan fill="#23201A" font-weight="400">　</tspan><tspan font-size="15" font-family="'PingFang SC',sans-serif" fill="#4A5A50" font-weight="700">同时保持推理准确性</tspan></text>

    <rect x="64" y="524" width="230" height="26" rx="13" fill="#E8A21C" opacity="0.25"/>
    <text x="179" y="542" text-anchor="middle" font-size="13" fill="#8A5E10">HGCE：hint 引导起步</text>
    <rect x="304" y="524" width="210" height="26" rx="13" fill="#7D4A87" opacity="0.18"/>
    <text x="409" y="542" text-anchor="middle" font-size="13" fill="#63386C">hint 逐渐减少</text>
    <rect x="524" y="524" width="200" height="26" rx="13" fill="#1F7A6D" opacity="0.16"/>
    <text x="624" y="542" text-anchor="middle" font-size="13" fill="#1F5A50">独立做出模式切换</text>
  </g>

  <line x1="64" y1="576" x2="1136" y2="576" stroke="#E9E1CB"/>
  <text class="serif" x="64" y="608" font-size="19" fill="#23201A">较小的模型经 Beacon 训练后，也能获得显著的 MA-TE 提升。</text>
  <text class="b" x="64" y="638">多个 agentic vision benchmark 上评估 · 准确率为定性结论，具体数值见原文 · Micropaper</text>
</svg>
