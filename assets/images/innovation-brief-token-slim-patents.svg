<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">2026 年 2 至 9 月四件输入侧 Token 瘦身专利公开，四家申请人各管一段输入</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">四件已公开申请按公开先后序位排列（事件序位轴）</text>


  <!-- x = 300 + monthsSince202601 * 60 -->
  <text x="288" y="153" font-size="12.5" fill="#1A1B1E" text-anchor="end">Cisco</text>
  <circle cx="324" cy="149" r="7" fill="#0072B2"/>
  <text x="339" y="153" font-size="12" fill="#555">2026-02-12 公开 · 工具清单最小化，不喂全量 schema（US20260044679A1）</text>

  <text x="288" y="208" font-size="12.5" fill="#1A1B1E" text-anchor="end">PayPal</text>
  <circle cx="612" cy="204" r="7" fill="#0072B2"/>
  <text x="627" y="208" font-size="12" fill="#555">2026-06-18 公开 · 按输入量动态截断阈值（US20260170265A1）</text>

  <text x="288" y="263" font-size="12.5" fill="#1A1B1E" text-anchor="end">Naver</text>
  <circle cx="672" cy="259" r="7" fill="#0072B2"/>
  <text x="687" y="263" font-size="12" fill="#555">2026-07-16 公开 · RAG 段落重排后按子句剪枝（US20260203500A1）</text>

  <text x="288" y="318" font-size="12.5" fill="#1A1B1E" text-anchor="end">Ciena</text>
  <circle cx="792" cy="314" r="7" fill="#D55E00"/>
  <text x="807" y="318" font-size="12" fill="#555">2026-09-03 公开 · 日志空间/时间窗折叠（US20260260063A1）</text>

  <!-- order axis -->
  <line x1="300" y1="149" x2="300" y2="360" stroke="#1A1B1E" stroke-width="0.75"/>
  <line x1="300" y1="360" x2="1000" y2="360" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="324" y1="360" x2="324" y2="364"/>
    <line x1="612" y1="360" x2="612" y2="364"/>
    <line x1="672" y1="360" x2="672" y2="364"/>
    <line x1="792" y1="360" x2="792" y2="364"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="324" y="380">1</text>
    <text x="612" y="380">2</text>
    <text x="672" y="380">3</text>
    <text x="792" y="380">4</text>
  </g>
  <text x="558" y="404" font-size="14" fill="#1A1B1E" text-anchor="middle">公开先后序位</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="462" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="462" font-size="15" fill="#1A1B1E">独立开发者方案：两项自估投入与一项自估订阅价</text>

  <g font-size="12.5" fill="#1A1B1E">
    <text x="60" y="502">MVP 工期（周，1 人）</text>
    <text x="420" y="502">起步成本（元）</text>
    <text x="780" y="502">Pro 订阅（元/年）</text>
  </g>

  <!-- timeline 0-3 weeks: x=60..320 -->
  <line x1="60" y1="536" x2="320" y2="536" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="60" y1="536" x2="60" y2="540"/>
    <line x1="146.7" y1="536" x2="146.7" y2="540"/>
    <line x1="233.3" y1="536" x2="233.3" y2="540"/>
    <line x1="320" y1="536" x2="320" y2="540"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="60" y="556">0</text>
    <text x="146.7" y="556">1</text>
    <text x="233.3" y="556">2</text>
    <text x="320" y="556">3</text>
  </g>
  <rect x="233.3" y="512" width="86.7" height="14" fill="#009E73"/>
  <text x="276.7" y="506" font-size="12" fill="#555" text-anchor="middle">2–3 周</text>

  <!-- cost range 1500-3000: x=420..660, 500元=40px -->
  <line x1="420" y1="536" x2="660" y2="536" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="420" y1="536" x2="420" y2="540"/>
    <line x1="660" y1="536" x2="660" y2="540"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="420" y="556">1500</text>
    <text x="660" y="556">3000</text>
  </g>
  <rect x="420" y="512" width="240" height="14" fill="#0072B2"/>
  <text x="540" y="506" font-size="12" fill="#555" text-anchor="middle">1500–3000 元（自估）</text>

  <!-- self-estimate pricing (direct label, no fabricated scale) -->
  <rect x="780" y="512" width="20" height="18" fill="#D55E00"/>
  <text x="808" y="526" font-size="12" fill="#555">约 299 元/年（自估定价）</text>

  <text x="60" y="602" font-size="12" fill="#555">另：按次审计报告 500–2000 元/单（自估定价口径）</text>

  <!-- footnote -->
  <text x="60" y="640" font-size="11" fill="#767676">数据：四件美国申请公开信息（公开不等于授权，正文所引 Free Patents Online 检索，审查中）· 成本、工期与定价为作者自估口径</text>
</svg>
