<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #A08F74; }
      .dim { font-size: 16px; font-weight: 700; fill: #26201A; }
      .ev { font-size: 13.5px; fill: #6E6252; }
      .b { font-size: 12px; fill: #AB9C82; }
      .hd { font-size: 12.5px; letter-spacing: 2px; fill: #A08F74; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8F2E8"/>
    </linearGradient>
    <linearGradient id="gTomato" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D64533"/><stop offset="1" stop-color="#E8734F"/>
    </linearGradient>
    <linearGradient id="gBasil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4E7A2E"/><stop offset="1" stop-color="#7FA243"/>
    </linearGradient>
    <linearGradient id="gTurmeric" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8860D"/><stop offset="1" stop-color="#E4A93C"/>
    </linearGradient>
    <linearGradient id="gSaffron" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A4B8C"/><stop offset="1" stop-color="#B06FB2"/>
    </linearGradient>
    <linearGradient id="gChili" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5442E"/><stop offset="1" stop-color="#D64533"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1118" cy="96" r="130" fill="#8A4B8C" opacity="0.05"/>
  <circle cx="80" cy="640" r="110" fill="#C8860D" opacity="0.06"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gChili)"/>

  <text class="k" x="64" y="84">AI 范式雷达 · 2026-10-14 · AGENT SELECTED DISTRIBUTION</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#26201A">货架经济学：被 Agent 选中</text>
  <text x="64" y="158" font-size="15" fill="#6E6252">16,893 个测量会话：提到不等于上架，货架正从人换给机器</text>

  <!-- pantry motif: three-jar spice shelf -->
  <g>
    <rect x="998" y="186" width="140" height="8" rx="3" fill="#A9743E"/>
    <g>
      <rect x="1010" y="122" width="34" height="56" rx="8" fill="url(#gTomato)" opacity="0.9"/>
      <rect x="1016" y="112" width="22" height="12" rx="3" fill="#A9743E"/>
      <rect x="1053" y="132" width="34" height="46" rx="8" fill="url(#gBasil)" opacity="0.9"/>
      <rect x="1059" y="122" width="22" height="12" rx="3" fill="#A9743E"/>
      <rect x="1096" y="116" width="34" height="62" rx="8" fill="url(#gTurmeric)" opacity="0.9"/>
      <rect x="1102" y="106" width="22" height="12" rx="3" fill="#A9743E"/>
    </g>
    <text class="hd" x="1068" y="216" text-anchor="middle">给 Agent 的新货架</text>
  </g>

  <!-- mention vs shelf- stocked rows: hollow = mentioned, solid gradient = wins -->
  <text class="hd" x="292" y="212" text-anchor="end">提及次数</text>
  <text class="hd" x="806" y="212">真正中选</text>

  <rect x="240" y="230" width="760" height="46" rx="10" fill="#D64533" opacity="0.08"/>
  <text class="dim" x="280" y="259">PayPal</text>
  <rect x="380" y="246" width="236" height="16" rx="8" fill="#FFFFFF" stroke="#BFB29B" stroke-width="1.6"/>
  <text class="ev" x="628" y="259">139</text>
  <line x1="666" y1="254" x2="794" y2="254" stroke="#D8CBB4" stroke-width="2.5"/>
  <circle cx="798" cy="254" r="9" fill="none" stroke="#BFB29B" stroke-width="1.8"/>
  <text x="818" y="260" font-size="17" font-weight="700" fill="#B5442E">0</text>
  <text class="ev" x="846" y="259">124 场被 Stripe 赢走</text>

  <rect x="240" y="292" width="760" height="46" rx="10" fill="#4E7A2E" opacity="0.08"/>
  <text class="dim" x="280" y="321">Adyen</text>
  <rect x="380" y="308" width="297" height="16" rx="8" fill="#FFFFFF" stroke="#BFB29B" stroke-width="1.6"/>
  <text class="ev" x="689" y="321">175</text>
  <line x1="720" y1="316" x2="794" y2="316" stroke="#D8CBB4" stroke-width="2.5"/>
  <circle cx="798" cy="316" r="9" fill="url(#gBasil)"/>
  <text x="818" y="322" font-size="17" font-weight="700" fill="#4E7A2E">3</text>
  <text class="ev" x="846" y="321">194 提及的 LangChain 也仅 4</text>

  <rect x="240" y="354" width="760" height="46" rx="10" fill="#C8860D" opacity="0.08"/>
  <text class="dim" x="280" y="383">Netlify</text>
  <rect x="380" y="370" width="258" height="16" rx="8" fill="#FFFFFF" stroke="#BFB29B" stroke-width="1.6"/>
  <text class="ev" x="650" y="383">152</text>
  <line x1="686" y1="378" x2="794" y2="378" stroke="#D8CBB4" stroke-width="2.5"/>
  <circle cx="798" cy="378" r="9" fill="url(#gTurmeric)"/>
  <text x="818" y="384" font-size="17" font-weight="700" fill="#A06B08">6</text>
  <text class="ev" x="846" y="383">提及最多的 Supabase 被 Neon 压制</text>

  <!-- three splits strip -->
  <g>
    <rect x="64" y="448" width="340" height="118" rx="12" fill="#D64533" opacity="0.07"/>
    <rect x="64" y="448" width="340" height="6" rx="3" fill="url(#gTomato)"/>
    <text class="serif" x="88" y="502" font-size="28" font-weight="700" fill="#26201A">42%</text>
    <text class="ev" x="88" y="528">三 Agent 同场景选同一工具</text>
    <text class="b" x="88" y="550">厂商自述 · trace 据称公开可复算</text>

    <rect x="430" y="448" width="340" height="118" rx="12" fill="#8A4B8C" opacity="0.07"/>
    <rect x="430" y="448" width="340" height="6" rx="3" fill="url(#gSaffron)"/>
    <text class="serif" x="454" y="502" font-size="28" font-weight="700" fill="#26201A">189,934 条评价</text>
    <text class="ev" x="454" y="528">一周自述涨约 30-60 倍</text>
    <text class="b" x="454" y="550">agent.reviews 页面自述口径</text>

    <rect x="796" y="448" width="340" height="118" rx="12" fill="#4E7A2E" opacity="0.07"/>
    <rect x="796" y="448" width="340" height="6" rx="3" fill="url(#gBasil)"/>
    <text class="serif" x="820" y="502" font-size="28" font-weight="700" fill="#26201A">0 星</text>
    <text class="ev" x="820" y="528">GitHub 仓库 · 中立性为零</text>
    <text class="b" x="820" y="550">测量者、货架、增长服务同一家</text>
  </g>

  <line x1="64" y1="596" x2="1136" y2="596" stroke="#E9E0CC"/>
  <text class="b" x="64" y="624">窄场景：新引入第三方服务的选择瞬间 · 无独立第三方复现 · 利益相关方发起的测量 · Micropaper</text>
</svg>
