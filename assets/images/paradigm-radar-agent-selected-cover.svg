<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1c2e"/>
      <stop offset="1" stop-color="#1e3050"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#2c4468" stroke-width="1" opacity="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="525" x2="1200" y2="525"/>
  </g>

  <!-- left: human search path (fading) -->
  <g opacity="0.45">
    <circle cx="180" cy="230" r="34" fill="none" stroke="#7d93b2" stroke-width="2.5"/>
    <circle cx="180" cy="205" r="13" fill="#7d93b2"/>
    <text x="180" y="305" fill="#a9bdd8" font-size="24" text-anchor="middle">人类搜索</text>
    <text x="180" y="338" fill="#6f86a5" font-size="17" text-anchor="middle">SEO · 品牌 · 比价</text>
    <path d="M 250 235 L 380 250" stroke="#7d93b2" stroke-width="2.5" stroke-dasharray="7 7" fill="none"/>
  </g>

  <!-- right: agent selection path (highlight) -->
  <g>
    <rect x="120" y="400" width="130" height="96" rx="12" fill="#16324f" stroke="#4da3ff" stroke-width="2.5"/>
    <rect x="145" y="422" width="80" height="8" rx="3" fill="#4da3ff"/>
    <rect x="145" y="440" width="58" height="8" rx="3" fill="#7dc0ff"/>
    <rect x="145" y="458" width="70" height="8" rx="3" fill="#3f7bb5"/>
    <text x="185" y="530" fill="#cfe3ff" font-size="24" text-anchor="middle">Coding Agent</text>
    <text x="185" y="562" fill="#7fa3c8" font-size="17" text-anchor="middle">读文档 · 搜索 · 装包</text>
    <path d="M 260 448 L 420 400" stroke="#4da3ff" stroke-width="3.5" fill="none"/>
    <path d="M 420 400 l -16 -2 M -8 -14 l 24 16" stroke="#4da3ff" stroke-width="3.5" fill="none"/>
  </g>

  <!-- center shelf -->
  <g>
    <rect x="450" y="160" width="300" height="320" rx="16" fill="#152740" stroke="#3d5f8a" stroke-width="2"/>
    <text x="600" y="205" fill="#e8f1fc" font-size="26" text-anchor="middle" font-weight="bold">新的货架</text>
    <g font-size="20" fill="#a9c6e8">
      <rect x="485" y="230" width="230" height="44" rx="8" fill="#1d3a5c"/>
      <text x="600" y="259" text-anchor="middle">文档 / llms.txt</text>
      <rect x="485" y="290" width="230" height="44" rx="8" fill="#1d3a5c"/>
      <text x="600" y="319" text-anchor="middle">机器可读评价</text>
      <rect x="485" y="350" width="230" height="44" rx="8" fill="#1d3a5c"/>
      <text x="600" y="379" text-anchor="middle">免费档条款措辞</text>
      <rect x="485" y="410" width="230" height="44" rx="8" fill="#1d3a5c"/>
      <text x="600" y="439" text-anchor="middle">site: 可发现性</text>
    </g>
  </g>

  <!-- outcome: tool chosen -->
  <path d="M 760 320 L 880 320" stroke="#5fd4a8" stroke-width="3.5" fill="none"/>
  <path d="M 880 320 l -18 -9 M 880 320 l -18 9" stroke="#5fd4a8" stroke-width="3.5" fill="none"/>
  <g>
    <rect x="895" y="255" width="200" height="130" rx="14" fill="#12351f" stroke="#5fd4a8" stroke-width="2.5"/>
    <text x="995" y="305" fill="#b8f0d5" font-size="24" text-anchor="middle" font-weight="bold">被 Agent 选中</text>
    <text x="995" y="345" fill="#79c9a2" font-size="18" text-anchor="middle">新的分发渠道</text>
  </g>

  <!-- title strip -->
  <text x="600" y="80" fill="#8fb4dd" font-size="24" text-anchor="middle" letter-spacing="6">AI 范式雷达</text>
  <text x="600" y="605" fill="#6f86a5" font-size="18" text-anchor="middle">工具的分发对象，正在从人变成 Agent · 42% 一致率 / 16,893 会话测量 / agent.reviews</text>
</svg>
