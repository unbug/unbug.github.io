<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">同场景三个 Coding Agent 选同一工具仅 42%；货架正从人迁移给 Agent</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">同场景选择一致率与各 Agent 自建方案率（%）</text>

  <!-- horizontal gridlines: y = 340 - 5*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="120" y1="290" x2="620" y2="290"/>
    <line x1="120" y1="240" x2="620" y2="240"/>
    <line x1="120" y1="190" x2="620" y2="190"/>
    <line x1="120" y1="140" x2="620" y2="140"/>
  </g>

  <!-- bars: y = 340 - 5*v -->
  <rect x="150" y="130" width="64" height="210" fill="#D55E00"/>
  <text x="182" y="122" font-size="12" fill="#555" text-anchor="middle">42%</text>
  <text x="182" y="358" font-size="12.5" fill="#1A1B1E" text-anchor="middle">三 Agent 选同一工具</text>

  <rect x="280" y="245" width="64" height="95" fill="#999999"/>
  <text x="312" y="237" font-size="12" fill="#555" text-anchor="middle">19%</text>
  <text x="312" y="358" font-size="12.5" fill="#1A1B1E" text-anchor="middle">Claude Code</text>

  <rect x="410" y="290" width="64" height="50" fill="#999999"/>
  <text x="442" y="282" font-size="12" fill="#555" text-anchor="middle">10%</text>
  <text x="442" y="358" font-size="12.5" fill="#1A1B1E" text-anchor="middle">Codex</text>

  <rect x="540" y="290" width="64" height="50" fill="#999999"/>
  <text x="572" y="282" font-size="12" fill="#555" text-anchor="middle">10%</text>
  <text x="572" y="358" font-size="12.5" fill="#1A1B1E" text-anchor="middle">Cursor</text>

  <!-- value axis -->
  <line x1="120" y1="140" x2="120" y2="340" stroke="#1A1B1E" stroke-width="0.75"/>
  <line x1="120" y1="340" x2="620" y2="340" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="116" y1="340" x2="120" y2="340"/>
    <line x1="116" y1="290" x2="120" y2="290"/>
    <line x1="116" y1="240" x2="120" y2="240"/>
    <line x1="116" y1="190" x2="120" y2="190"/>
    <line x1="116" y1="140" x2="120" y2="140"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="110" y="344">0</text>
    <text x="110" y="294">10</text>
    <text x="110" y="244">20</text>
    <text x="110" y="194">30</text>
    <text x="110" y="144">40</text>
  </g>
  <text x="120" y="384" font-size="14" fill="#1A1B1E">会话占比（%）</text>
  <text x="120" y="404" font-size="12" fill="#555">后三根柱为各 Agent 自建方案率；Claude Code 约为其余两者的两倍</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="444" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="444" font-size="15" fill="#1A1B1E">agent.reviews 公开货架规模（页面自述，实测 2026-10-14）</text>
  <g font-size="12.5" fill="#1A1B1E">
    <text x="84" y="482">189,934 条评价</text>
    <text x="84" y="506">4,120 个工具</text>
    <text x="84" y="530">1,971 个已发布评分</text>
  </g>
  <text x="380" y="482" font-size="12" fill="#555">发布时自述数千条，一周后页面自述</text>
  <text x="380" y="502" font-size="12" fill="#555">增长约 30-60 倍</text>
  <!-- ============ panel c ============ -->
  <text x="680" y="444" font-size="15" font-weight="bold" fill="#1A1B1E">c</text>
  <text x="702" y="444" font-size="15" fill="#1A1B1E">测量规模与中立性</text>
  <g font-size="12.5" fill="#1A1B1E">
    <text x="702" y="482">16,893 个测量会话</text>
    <text x="702" y="506">GitHub 仓库 0 星（API 实测 2026-10-14）</text>
  </g>
  <text x="702" y="534" font-size="12" fill="#555">测量者、货架、增长服务同一家公司，</text>
  <text x="702" y="552" font-size="12" fill="#555">无独立第三方复现</text>

  <!-- footnote -->
  <text x="60" y="588" font-size="11" fill="#767676">数据：Armature 16,893 会话测量为厂商自述口径，原始 trace 据称公开于 leaderboards.armature.tech；面板 b 为 agent.reviews 页面自述文字实测</text>
  <text x="60" y="608" font-size="11" fill="#767676">窄场景：新引入第三方服务的选择瞬间，覆盖 18 个行业、51 个代码库 · 由利益相关方发起的测量</text>
</svg>
