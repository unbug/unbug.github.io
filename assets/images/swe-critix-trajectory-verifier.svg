<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1200" height="86" fill="#1f2a44"/>
  <text x="48" y="40" fill="#ffffff" font-size="26" font-weight="bold">交付验收需要一个会说理由的裁判</text>
  <text x="48" y="68" fill="#aeb9d4" font-size="15">arXiv 2610.13356 · SWE-Critix 编程 agent 轨迹通用裁判后训练 · 预印本（2026-10-09，未经同行评审）</text>

  <rect x="48" y="114" width="340" height="330" rx="10" fill="#ffffff" stroke="#d8dee9"/>
  <text x="72" y="150" fill="#1f2a44" font-size="19" font-weight="bold">缺口：没有现成判据</text>
  <text x="72" y="186" fill="#4a5568" font-size="14">端到端软件工程任务常缺</text>
  <text x="72" y="210" fill="#4a5568" font-size="14">「预言机评测器」——任务自带的</text>
  <text x="72" y="234" fill="#4a5568" font-size="14">可机械执行成功判据</text>
  <text x="72" y="272" fill="#4a5568" font-size="14">轨迹含数百次迭代交互，</text>
  <text x="72" y="296" fill="#4a5568" font-size="14">人工复核成本极高</text>
  <rect x="72" y="318" width="292" height="80" rx="6" fill="#eef1f6"/>
  <text x="86" y="346" fill="#37476a" font-size="13">现有两条路都不够：通用 LLM 裸当裁判</text>
  <text x="86" y="368" fill="#37476a" font-size="13">不训练；专用 critic 只出标量分，</text>
  <text x="86" y="390" fill="#37476a" font-size="13">分数无法审计、不解释失败原因</text>

  <rect x="410" y="114" width="380" height="330" rx="10" fill="#ffffff" stroke="#d8dee9"/>
  <text x="434" y="150" fill="#1f2a44" font-size="19" font-weight="bold">完成判定分类准确率（held-out）</text>
  <text x="434" y="184" fill="#4a5568" font-size="14">基座 Qwen3-30B-A3B</text>
  <rect x="434" y="194" width="171" height="26" rx="4" fill="#eef1f6"/>
  <text x="615" y="213" fill="#4a5568" font-size="16" font-weight="bold">57%</text>
  <text x="434" y="254" fill="#4a5568" font-size="14">+ 监督微调 SFT</text>
  <rect x="434" y="264" width="198" height="26" rx="4" fill="#fdf0e2"/>
  <text x="642" y="283" fill="#b7791f" font-size="16" font-weight="bold">66%</text>
  <text x="434" y="324" fill="#4a5568" font-size="14">+ 强化学习 RL</text>
  <rect x="434" y="334" width="234" height="26" rx="4" fill="#e6f4ea"/>
  <text x="678" y="353" fill="#1e7d43" font-size="16" font-weight="bold">78%</text>
  <text x="434" y="398" fill="#718096" font-size="13">训练数据：团队自产代码域轨迹集 CodeForge-Preview；</text>
  <text x="434" y="418" fill="#718096" font-size="13">训练一系列 30B 模型；跨领域泛化未验证，不能外推。</text>

  <rect x="812" y="114" width="340" height="330" rx="10" fill="#ffffff" stroke="#d8dee9"/>
  <text x="836" y="150" font-size="19" fill="#1f2a44" font-weight="bold">裁判输出两样东西</text>
  <rect x="836" y="170" width="292" height="54" rx="6" fill="#eef1f6"/>
  <text x="850" y="192" fill="#37476a" font-size="14" font-weight="bold">1. 完成标签</text>
  <text x="850" y="214" fill="#37476a" font-size="13">干没干完，可机读</text>
  <rect x="836" y="238" width="292" height="72" rx="6" fill="#e6f4ea"/>
  <text x="850" y="262" fill="#1e7d43" font-size="14" font-weight="bold">2. 自然语言分析</text>
  <text x="850" y="284" fill="#1e7d43" font-size="13">缺了什么、哪一步出错——</text>
  <text x="850" y="302" fill="#1e7d43" font-size="13">可直接当评审意见与缺陷定位</text>
  <rect x="836" y="324" width="292" height="60" rx="6" fill="#fff8e1" stroke="#e6c97a"/>
  <text x="850" y="348" fill="#8a6d1a" font-size="13" font-weight="bold">论文称模型、数据集、训练码开源</text>
  <text x="850" y="370" fill="#8a6d1a" font-size="12">数字为作者自报，待独立复现</text>

  <rect x="48" y="470" width="1104" height="80" rx="10" fill="#eef1f6" stroke="#c9d2e0"/>
  <text x="72" y="500" fill="#37476a" font-size="14" font-weight="bold">与简报 #20 互文</text>
  <text x="160" y="500" fill="#4a5568" font-size="14">专利面：大厂圈地评审产物，独立质检报告没人接单；技术面：裁判层从「拿现成模型凑」进入专门后训练阶段，</text>
  <text x="160" y="526" fill="#4a5568" font-size="14">且直接开源。57% 与 78% 的差距说明：通用模型裸当裁判不及格，训练过的裁判才有商用价值。</text>

  <text x="48" y="586" fill="#a0aec0" font-size="13">一分钟读论文 · 2026-10 · 全部数字经论文 abs 与 HTML 全文逐字核验（2026-10-14）</text>
</svg>
