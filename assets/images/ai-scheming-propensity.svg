<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  

  <!-- 背景 -->
  <rect width="800" height="400" fill="#555555" rx="10"/>

  <!-- 标题 -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#009E73">AI 阴谋倾向评估</text>

  <!-- 左侧：标准部署条件 -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="200" height="220" fill="white" stroke="#56B4E9" stroke-width="2" rx="8"/>

    <text x="100" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#009E73">标准部署条件</text>

    <!-- 安全图标 -->
    <circle cx="100" cy="85" r="30" fill="#555555"/>
    <text x="100" y="92" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">✓</text>

    <!-- 数据 -->
    <text x="100" y="145" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#009E73">~0%</text>
    <text x="100" y="170" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#0072B2">阴谋率</text>

    <!-- 说明 -->
    <text x="100" y="200" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#56B4E9">真实环境中的表现</text>
  </g>

  <!-- 右侧：对抗性条件 -->
  <g transform="translate(500, 100)">
    <rect x="0" y="0" width="200" height="220" fill="white" stroke="#56B4E9" stroke-width="2" rx="8"/>

    <text x="100" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#009E73">对抗性条件</text>

    <!-- 警告图标 -->
    <circle cx="100" cy="85" r="30" fill="#555555"/>
    <text x="100" y="92" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">!</text>

    <!-- 数据 -->
    <text x="100" y="145" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#D55E00">~90%</text>
    <text x="100" y="170" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#0072B2">阴谋率</text>

    <!-- 说明 -->
    <text x="100" y="200" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#56B4E9">人为诱导的结果</text>
  </g>

  <!-- 中间：脆弱的平衡 -->
  <g transform="translate(340, 160)">
    <!-- 箭头 -->
    <path d="M 0 50 L 120 50" stroke="#56B4E9" stroke-width="3" stroke-dasharray="8,4" fill="none"/>
    <polygon points="115,45 120,50 115,55" fill="#56B4E9"/>
    <text x="60" y="40" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#56B4E9">高度依赖上下文</text>
  </g>
</svg>