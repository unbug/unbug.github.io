<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <title>Recuris 失败归因与消融</title>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">结构化轨迹把失败归因准确率从 13.0% 提到 64.8%；τ²-Retail 四配置中只加工作记忆即达 82.02%</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">失败归因准确率（%）</text>

  <!-- bars: x = 300 + 8*v -->
  <text x="288" y="166" font-size="12.5" fill="#1A1B1E" text-anchor="end">结构化轨迹归因</text>
  <rect x="300" y="152" width="518.4" height="18" fill="#0072B2"/>
  <text x="827" y="166" font-size="12" fill="#555">64.8%</text>

  <text x="288" y="222" font-size="12.5" fill="#1A1B1E" text-anchor="end">仅任务成败二值信号</text>
  <rect x="300" y="208" width="104" height="18" fill="#999999"/>
  <text x="413" y="222" font-size="12" fill="#555">13.0%</text>

  <!-- baseline axis (no ticks: only two observed values) -->
  <line x1="300" y1="130" x2="300" y2="252" stroke="#1A1B1E" stroke-width="0.75"/>
  <text x="300" y="276" font-size="12" fill="#555">数值以数据标签标注（单位：%）；仅两个观测值，不设置虚构刻度</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="342" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="342" font-size="15" fill="#1A1B1E">τ²-Retail 消融：同模型同任务同预算（Table 12）</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="526" y1="366" x2="526" y2="560"/>
        <line x1="918" y1="366" x2="918" y2="560"/>
  </g>
  <!-- bars: x = 330 + 10*v -->
  <text x="318" y="392" font-size="12.5" fill="#1A1B1E" text-anchor="end">裸 Agent</text>
  <rect x="330" y="378" width="569.5" height="18" fill="#999999"/>
  <text x="908" y="372" font-size="12" fill="#555">58.11%</text>

  <text x="318" y="444" font-size="12.5" fill="#1A1B1E" text-anchor="end">只加工作记忆</text>
  <rect x="330" y="430" width="803.8" height="18" fill="#0072B2"/>
  <text x="1140" y="424" font-size="12" fill="#555" text-anchor="end">82.02%</text>

  <text x="318" y="496" font-size="12.5" fill="#1A1B1E" text-anchor="end">模型自控技能（全库常驻）</text>
  <rect x="330" y="482" width="642.6" height="18" fill="#999999"/>
  <text x="982" y="476" font-size="12" fill="#555">65.57%，单次成功成本高 46%</text>

  <text x="318" y="548" font-size="12.5" fill="#1A1B1E" text-anchor="end">Recuris（状态接地选技能）</text>
  <rect x="330" y="534" width="818.7" height="18" fill="#D55E00"/>
  <text x="330" y="586" font-size="12" fill="#555">83.55%</text>

  <!-- value axis -->
  <line x1="330" y1="560" x2="1140" y2="560" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="330" y1="560" x2="330" y2="564"/>
    <line x1="526" y1="560" x2="526" y2="564"/>
        <line x1="918" y1="560" x2="918" y2="564"/>
    
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="330" y="580">0</text>
    <text x="526" y="580">20</text>
    <text x="918" y="580">60</text>
    
  </g>
  <text x="750" y="608" font-size="14" fill="#1A1B1E" text-anchor="middle">任务成功率（%）</text>

  <!-- footnote -->
  <text x="60" y="648" font-size="11" fill="#767676">数据：arXiv:2608.24876（Recuris，论文自测口径，含 Table 12 消融）· 面板 a 仅两个观测值 · 面板 b 为同模型同任务同预算对比 · 预印本未经同行评审</text>
</svg>
