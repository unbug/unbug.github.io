  <text x="60" y="560" font-size="12" fill="#767676">a 面板横轴为日期序位（间距示意非等距日历），圆点为事件、旁标 HN 分数原值；b 面板条长按星标等比。星标与分数均为 2026-10-31 实测。</text>
