<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">180 组受控实验：多智能体效果取决于任务类型，顺序推理任务反而下降 39% 到 70%</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">不同任务上多智能体相对单智能体的性能变化（%，论文自测）</text>

  <!-- gridlines vertical: x = 530 + 5*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="680" y1="130" x2="680" y2="380"/>
    <line x1="830" y1="130" x2="830" y2="380"/>
    <line x1="980" y1="130" x2="980" y2="380"/>
  </g>
  <!-- zero baseline -->
  <line x1="530" y1="130" x2="530" y2="380" stroke="#1A1B1E" stroke-width="0.75"/>

  <!-- row 1: parallel / centralized +80.9 -->
  <text x="518" y="166" font-size="12.5" fill="#1A1B1E" text-anchor="end">可并行任务 · 集中式协调</text>
  <rect x="530" y="152" width="404.5" height="18" fill="#D55E00"/>
  <text x="942" y="166" font-size="12" fill="#555555">+80.9</text>

  <!-- row 2: dynamic navigation decentralized +9.2 -->
  <text x="518" y="214" font-size="12.5" fill="#1A1B1E" text-anchor="end">动态网页导航 · 去中心化</text>
  <rect x="530" y="200" width="46" height="18" fill="#999999"/>
  <text x="584" y="214" font-size="12" fill="#555555">+9.2</text>

  <!-- row 3: dynamic navigation centralized +0.2 -->
  <text x="518" y="262" font-size="12.5" fill="#1A1B1E" text-anchor="end">动态网页导航 · 集中式</text>
  <rect x="530" y="248" width="1" height="18" fill="#999999"/>
  <text x="540" y="262" font-size="12" fill="#555555">+0.2</text>

  <!-- row 4: sequential reasoning 39%-70% decline -->
  <text x="518" y="334" font-size="12.5" fill="#1A1B1E" text-anchor="end">顺序推理任务 · 全部多智能体变体</text>
  <rect x="180" y="320" width="205" height="18" fill="#0072B2"/>
  <polygon points="188,314 172,329 188,344" fill="#0072B2"/>
  <text x="400" y="310" font-size="12" fill="#555555">下降 39%–70%（区间自 -39 起）</text>

  <!-- value axis -->
  <line x1="180" y1="380" x2="1010" y2="380" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="180" y1="380" x2="180" y2="384"/>
    <line x1="330" y1="380" x2="330" y2="384"/>
    <line x1="530" y1="380" x2="530" y2="384"/>
    <line x1="680" y1="380" x2="680" y2="384"/>
    <line x1="830" y1="380" x2="830" y2="384"/>
    <line x1="980" y1="380" x2="980" y2="384"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="180" y="402">-70</text>
    <text x="330" y="402">-40</text>
    <text x="530" y="402">0</text>
    <text x="680" y="402">+30</text>
    <text x="830" y="402">+60</text>
    <text x="980" y="402">+90%</text>
  </g>
  <text x="595" y="428" font-size="14" fill="#1A1B1E" text-anchor="middle">性能变化（百分点，相对单智能体基线）</text>

  <text x="60" y="458" font-size="12" fill="#555555">顺序推理的悬崖式下跌与增益量级同为结构性结论；区间为论文报告范围（39% 到 70%）</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="512" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="512" font-size="15" fill="#1A1B1E">架构-任务预测模型：留一法交叉验证中识别未见任务最优架构的准确率</text>

  <!-- bar: y = 880 - 6*pct => 87 -> 358, 50 -> 580 -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="240" y1="580" x2="700" y2="580"/>
    <line x1="240" y1="430" x2="700" y2="430"/>
  </g>
  <rect x="360" y="358" width="80" height="182" fill="#D55E00"/>
  <text x="400" y="350" font-size="12" fill="#555555" text-anchor="middle">87% 未见任务</text>
  <text x="400" y="598" font-size="12.5" fill="#1A1B1E" text-anchor="middle">预测模型</text>

  <line x1="240" y1="580" x2="700" y2="580" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="240" y1="580" x2="240" y2="584"/>
    <line x1="470" y1="580" x2="470" y2="584"/>
    <line x1="700" y1="580" x2="700" y2="584"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="240" y="604">0</text>
    <text x="470" y="604">50</text>
    <text x="700" y="604">100</text>
  </g>
  <text x="470" y="628" font-size="14" fill="#1A1B1E" text-anchor="middle">架构选择准确率（%）</text>

  <text x="780" y="380" font-size="12" fill="#1A1B1E">输入：任务可并行性、复杂度、动态性</text>
  <text x="780" y="400" font-size="12" fill="#555555">输出：最优架构类型</text>
  <text x="780" y="420" font-size="12" fill="#555555">评估：留一法交叉验证</text>
  <text x="780" y="452" font-size="12" fill="#555555">样本：180 种智能体配置的受控实验</text>

  <!-- footnote -->
  <text x="60" y="655" font-size="11" fill="#767676">数据：arXiv:2512.08296（Google Research，180 组受控实验）· 论文自测口径 · 预印本未经同行评审</text>
</svg>
