    <text x="288" y="149">测量会话</text>
    <text x="288" y="187">有效样本</text>
    <text x="288" y="225">prompt 变体</text>
    <text x="288" y="263">代码库</text>
    <text x="288" y="301">仓库</text>
    <text x="288" y="339">行业类目</text>
  </g>
  <rect x="300" y="135" width="405.43" height="18" fill="#0072B2"/>
  <rect x="300" y="173" width="127.01" height="18" fill="#0072B2"/>
  <rect x="300" y="211" width="27.91" height="18" fill="#999999"/>
  <rect x="300" y="249" width="1.22" height="18" fill="#999999"/>
  <rect x="300" y="287" width="1.5" height="18" fill="#999999"/>
  <rect x="300" y="325" width="1.5" height="18" fill="#999999"/>
  <g font-size="12" fill="#555">
    <text x="714" y="149">16,893 · E2B、Blaxel、Daytona 沙箱轮换</text>
    <text x="435" y="187">5,292 · 收敛后的有效样本</text>
    <text x="335" y="225">1,163 · 4 类开发者人格</text>
    <text x="309" y="263">51</text>
    <text x="309" y="301">75</text>
    <text x="309" y="339">18</text>
  </g>
  <line x1="300" y1="356" x2="300" y2="356" stroke="#1A1B1E" stroke-width="0"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="356" x2="300" y2="360"/>
    <line x1="780" y1="356" x2="780" y2="360"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="376">0</text>
  </g>
  <text x="540" y="384" font-size="14" fill="#1A1B1E" text-anchor="middle">条形自 0 基线起按会话数等比绘制，数值直标于条旁（单位：个）</text>
  <text x="60" y="428" font-size="12" fill="#555">「模拟人类」与裁判均为 Gemini 3.7 Flash · 蓝 = 会话与样本，灰 = 输入侧配置</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="480" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="480" font-size="15" fill="#1A1B1E">按 Agent 的结果（%）</text>

  <!-- bars: x = 200 + 3.2*v -->
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="188" y="517">同场景选同一工具</text>
    <text x="188" y="545">Claude Code 自建方案率</text>
    <text x="188" y="573">Codex / Cursor 自建方案率</text>
    <text x="188" y="601">Claude Code 搜索会话（沙箱类新领域约 80）</text>
  </g>
  <rect x="200" y="503" width="134.4" height="16" fill="#D55E00"/>
  <rect x="200" y="531" width="60.8" height="16" fill="#0072B2"/>
  <rect x="200" y="559" width="32" height="16" fill="#0072B2"/>
  <rect x="200" y="587" width="96" height="16" fill="#0072B2"/>
  <g font-size="12" fill="#555">
    <text x="342" y="517">42</text>
    <text x="268" y="545">19 · 约为另两家两倍</text>
    <text x="240" y="573">10</text>
    <text x="304" y="601">约 30</text>
  </g>
  <line x1="200" y1="620" x2="520" y2="620" stroke="#1A1B1E" stroke-width="0.75"/>
  <text x="200" y="644" font-size="12" fill="#555">条形自 0 基线起按百分比等比绘制，数值直标于条旁（单位：%）</text>

  <text x="640" y="500" font-size="12.5" fill="#1A1B1E" font-weight="bold">信息源结构（文字口径，未上图）</text>
  <g font-size="12" fill="#555">
    <text x="640" y="524">Cursor：约 2/3 会话靠网络搜索决策</text>
    <text x="640" y="544">Codex：94% 会话搜索，9/10 用 site: 限定域名</text>
    <text x="640" y="564">Claude Code：主要靠参数记忆，仅约 30% 搜索，</text>
    <text x="640" y="584">训练语料稀疏的新领域升到约 80%</text>
  </g>

  <text x="60" y="660" font-size="11" fill="#767676">数据：Armature 16,893 会话测量（2026-09-03 发布，HN 49557206 实测 300 分）· 全部数字为厂商自述口径 · 原始 trace 据称公开于 leaderboards.armature.tech · 未经独立第三方复现</text>
</svg>
