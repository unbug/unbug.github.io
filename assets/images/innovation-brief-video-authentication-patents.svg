  <text x="70" y="142" font-family="Helvetica,Arial,sans-serif" font-size="44" font-weight="bold" fill="#ffffff">视频鉴真专利扎堆，独立开发者的视频公证生意</text>
  <text x="70" y="188" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#9fb3d9">US20260246646A1 Bank of America · US20260205467A1 Arranged BV · 近 90 天公开 ｜ 从「检测假」到「证明真」</text>

