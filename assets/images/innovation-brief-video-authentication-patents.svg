<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">四件代表性视频鉴真专利均为已公开申请；Bank of America 与 Binarii Labs 同主题相隔约一年再公开</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">四件代表性专利按公开先后序位排列（事件序位轴）</text>


  <!-- x = 300 + monthsSince202507 * 50 -->
  <text x="288" y="153" font-size="12.5" fill="#1A1B1E" text-anchor="end">Binarii Labs</text>
  <circle cx="367" cy="149" r="7" fill="#0072B2"/>
  <text x="382" y="153" font-size="12" fill="#555">2025-08-14 公开 · AI agent 选关键片段哈希上链（US20250259431）</text>

  <text x="288" y="208" font-size="12.5" fill="#1A1B1E" text-anchor="end">Intel</text>
  <circle cx="730" cy="204" r="7" fill="#999999"/>
  <text x="745" y="208" font-size="12" fill="#555">2026-03-26 公开 · 语音基线免重训个性化 deepfake 检测（US20260088032）</text>

  <text x="288" y="263" font-size="12.5" fill="#1A1B1E" text-anchor="end">Arranged BV</text>
  <circle cx="900" cy="259" r="7" fill="#999999"/>
  <text x="915" y="255" font-size="12" fill="#555">2026-07-16 公开 · 受控光照伪影验真</text>
  <text x="915" y="271" font-size="12" fill="#555">（US20260205467）</text>

  <text x="288" y="318" font-size="12.5" fill="#1A1B1E" text-anchor="end">Bank of America</text>
  <circle cx="950" cy="314" r="7" fill="#D55E00"/>
  <text x="965" y="310" font-size="12" fill="#555">2026-08-20 公开 · 哈希上链</text>
  <text x="965" y="326" font-size="12" fill="#555">+ 旋转水印（US20260246646）</text>

  <!-- same-theme interval bracket -->
  <line x1="367" y1="344" x2="950" y2="344" stroke="#0072B2" stroke-width="1.5"/>
  <line x1="367" y1="338" x2="367" y2="350" stroke="#0072B2" stroke-width="1.5"/>
  <line x1="950" y1="338" x2="950" y2="350" stroke="#0072B2" stroke-width="1.5"/>
  <text x="658" y="338" font-size="12" fill="#555" text-anchor="middle">「AI + 区块链视频认证」同主题，相隔约一年</text>

  <!-- order axis -->
  <line x1="300" y1="149" x2="300" y2="360" stroke="#1A1B1E" stroke-width="0.75"/>
  <line x1="300" y1="360" x2="1000" y2="360" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="367" y1="360" x2="367" y2="364"/>
    <line x1="730" y1="360" x2="730" y2="364"/>
    <line x1="900" y1="360" x2="900" y2="364"/>
    <line x1="950" y1="360" x2="950" y2="364"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="367" y="380">1</text>
    <text x="730" y="380">2</text>
    <text x="900" y="380">3</text>
    <text x="950" y="380">4</text>
  </g>
  <text x="658" y="404" font-size="14" fill="#1A1B1E" text-anchor="middle">公开先后序位</text>
  <g font-size="12" fill="#555">
    <circle cx="308" cy="424" r="6" fill="#0072B2"/>
    <text x="321" y="428">鉴真侧：证明是真的</text>
    <circle cx="520" cy="424" r="6" fill="#999999"/>
    <text x="533" y="428">检测/伪影侧：回答是不是假</text>
    <circle cx="770" cy="424" r="6" fill="#D55E00"/>
    <text x="783" y="428">近 90 天公开</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="60" y="474" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="474" font-size="15" fill="#1A1B1E">视频公证方案：自估投入与自估定价（范围取自正文，只标端点）</text>

  <g font-size="12.5" fill="#1A1B1E">
    <text x="60" y="514">MVP 工期（周）</text>
    <text x="430" y="514">月订阅（元/月）</text>
    <text x="800" y="514">代做报告（元/单）</text>
  </g>

  <!-- week ruler 0-4: x=60..300, 1周=60px -->
  <line x1="60" y1="548" x2="300" y2="548" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="60" y1="548" x2="60" y2="552"/>
    <line x1="180" y1="548" x2="180" y2="552"/>
    <line x1="300" y1="548" x2="300" y2="552"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="60" y="568">0</text>
    <text x="180" y="568">2</text>
    <text x="300" y="568">4</text>
  </g>
  <line x1="300" y1="524" x2="300" y2="548" stroke="#D55E00" stroke-width="2"/>
  <text x="292" y="518" font-size="12" fill="#555" text-anchor="end">4 周（1 人）</text>

  <!-- price endpoints direct label -->
  <line x1="430" y1="548" x2="730" y2="548" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="430" y1="548" x2="430" y2="552"/>
    <line x1="730" y1="548" x2="730" y2="552"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E">
    <text x="430" y="568" text-anchor="start">99</text>
    <text x="730" y="568" text-anchor="end">299</text>
  </g>
  <rect x="430" y="524" width="300" height="14" fill="#0072B2"/>
  <text x="580" y="518" font-size="12" fill="#555" text-anchor="middle">99–299 元/月（自估）</text>

  <line x1="800" y1="548" x2="1100" y2="548" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="800" y1="548" x2="800" y2="552"/>
    <line x1="1100" y1="548" x2="1100" y2="552"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E">
    <text x="800" y="568" text-anchor="start">500</text>
    <text x="1100" y="568" text-anchor="end">2000</text>
  </g>
  <rect x="800" y="524" width="300" height="14" fill="#009E73"/>
  <text x="950" y="518" font-size="12" fill="#555" text-anchor="middle">500–2000 元/单（自估）</text>

  <text x="60" y="602" font-size="12" fill="#555">起步成本一万元内（自估口径）· 技术栈 FastAPI + ffmpeg + 开源 c2pa-rs / c2pa-python</text>

  <!-- footnote -->
  <text x="60" y="640" font-size="11" fill="#767676">数据：四件专利公开信息（申请公开，不等于已授权，正文所引 Free Patents Online 检索）· 成本、工期与定价为作者自估口径</text>
</svg>
