    <text class="rl" x="640" y="226" font-weight="700">主题迁移：从问真假，到留证据</text>
    <line x1="700" y1="252" x2="700" y2="368" stroke="#AEC2CC" stroke-width="1.5"/>
    <line x1="1010" y1="252" x2="1010" y2="368" stroke="#AEC2CC" stroke-width="1.5"/>
    <text class="b" x="700" y="384" text-anchor="middle">检测 · 是不是假</text>
    <text class="b" x="1010" y="384" text-anchor="middle" fill="#C24A24">鉴真 · 证明是真的</text>
    <line x1="700" y1="340" x2="1010" y2="286" stroke="url(#gBuoy)" stroke-width="4"/>
    <circle cx="700" cy="340" r="8" fill="url(#gSlate)"/>
    <circle cx="1010" cy="286" r="10" fill="url(#gBuoy)"/>
