<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #7E93A0; }
      .rl { font-size: 15px; fill: #2F4858; }
      .val { font-size: 20px; font-weight: 700; }
      .b { font-size: 12px; fill: #93A6B2; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EFF6F6"/>
    </linearGradient>
    <linearGradient id="gNet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E6E8E"/><stop offset="1" stop-color="#6FA6BE"/>
    </linearGradient>
    <linearGradient id="gBuoy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E4572E"/><stop offset="1" stop-color="#F4906B"/>
    </linearGradient>
    <linearGradient id="gKelp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F9D69"/><stop offset="1" stop-color="#8FC99E"/>
    </linearGradient>
    <linearGradient id="gBrass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C08A28"/><stop offset="1" stop-color="#E8C264"/>
