    <text x="94" y="316" font-family="Menlo,Consolas,monospace" font-size="16" fill="#8ab4ff">US20260246646A1</text>
    <text x="94" y="342" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#c7d4ee">Bank of America · 2026-08-20</text>
    <text x="94" y="366" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#9fb3d9">哈希上链 + 旋转水印，AI 帧检测</text>
    <line x1="94" y1="388" x2="376" y2="388" stroke="#ffffff" opacity="0.15"/>
    <text x="94" y="420" font-family="Menlo,Consolas,monospace" font-size="16" fill="#8ab4ff">US20260205467A1</text>
    <text x="94" y="446" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#c7d4ee">Arranged BV · 2026-07-16</text>
    <text x="94" y="470" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#9fb3d9">受控光照伪影，平台指令比对验真</text>
