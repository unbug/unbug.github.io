    <text class="b" x="1000" y="266" text-anchor="end" fill="#C24A24">哈希链 · 旋转水印 · 受控光照 · 上链锚定</text>

    <text class="serif" x="1136" y="452" text-anchor="end" font-size="52" font-weight="700" fill="#C08A28">2 件</text>
    <text class="rl" x="640" y="420" font-weight="700">近 90 天美国「视频鉴真」申请公开</text>
