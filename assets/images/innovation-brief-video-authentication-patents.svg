  <circle cx="78" cy="98" r="112" fill="#E4572E" opacity="0.05"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gBuoy)"/>

  <text class="k" x="64" y="84">AI 智创简报 · 2026-08-24 · 近 90 天 · 美国申请公开</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">不查假鱼，只发真锚</text>
  <text x="64" y="158" font-size="15" fill="#4E6472">四件均为申请公开 · 主题从「检测是不是假」转向「证明是真的」</text>

  <!-- harbor motif: buoy + anchor + net -->
  <g>
    <path d="M 1078 132 q 16 8 16 22 q 0 14 -16 22" fill="url(#gBuoy)"/>
    <path d="M 1078 132 q -16 8 -16 22 q 0 14 16 22" fill="url(#gBuoy)" opacity="0.85"/>
    <path d="M 1062 143 a 22 22 0 0 0 0 22" fill="none" stroke="#F4EBD6" stroke-width="2.5" opacity="0.8"/>
    <rect x="1084" y="126" width="16" height="12" rx="3" fill="#C08A28"/>
    <line x1="1092" y1="184" x2="1092" y2="196" stroke="#2F4858" stroke-width="3"/>
    <circle cx="1092" cy="120" r="4.5" fill="none" stroke="#2F4858" stroke-width="2.5"/>
    <line x1="1068" y1="148" x2="1044" y2="148" stroke="url(#gBrass)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 1034 158 a 28 28 0 0 0 56 0" fill="none" stroke="url(#gAnchor)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 1029 153 l 10 10 m 52 -10 l -10 10" stroke="#4F9D69" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 1010 96 q 10 14 0 28 m 8 -24 q 8 10 0 22" stroke="#E4572E" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M 1136 100 q -10 14 0 28 m -8 -24 q -8 10 0 22" stroke="#E4572E" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M 1016 108 q 52 30 108 4" fill="none" stroke="#C08A28" stroke-width="2" stroke-dasharray="4 5" opacity="0.8"/>
    <path d="M 1016 108 l -6 12 m 0 0 l 12 2 m -12 -2 l 4 12" stroke="#2E6E8E" stroke-width="1.8" fill="none" opacity="0.75"/>
    <text x="1074" y="224" text-anchor="middle" font-size="12" fill="#2E6E8E">哈希上链 = 把证据锚下去，事后可复核</text>
  </g>

  <!-- left: patent slipway timeline -->
  <g>
    <text class="rl" x="64" y="226" font-weight="700">四件代表性专利 · 均为申请公开</text>
    <text class="b" x="316" y="226">申请公开不等于已授权 · 全为空心节点</text>
    <line x1="88" y1="256" x2="88" y2="486" stroke="#C4D4DC" stroke-width="2"/>

    <circle cx="88" cy="278" r="8" fill="#FFFFFF" stroke="#4F9D69" stroke-width="3"/>
    <text class="rl" x="112" y="274">2025-08-14 · Binarii Labs</text>
    <text class="b" x="112" y="292">AI agent 识别关键片段哈希上链 · US20250259431</text>

    <circle cx="88" cy="330" r="8" fill="#FFFFFF" stroke="#4F9D69" stroke-width="3"/>
    <text class="rl" x="112" y="326">2026-03-26 · Intel</text>
    <text class="b" x="112" y="344">已验证语音建个人基线，免重训测 deepfake · US20260088032</text>

    <circle cx="88" cy="382" r="8" fill="#FFFFFF" stroke="#E4572E" stroke-width="3"/>
    <text class="rl" x="112" y="378">2026-07-16 · Arranged BV</text>
    <text class="b" x="112" y="396">拍摄时受控光照造「预期伪影」比对验真 · US20260205467</text>

    <circle cx="88" cy="434" r="8" fill="#FFFFFF" stroke="#E4572E" stroke-width="3"/>
    <text class="rl" x="112" y="430">2026-08-20 · Bank of America</text>
    <text class="b" x="112" y="448">哈希上链 + 旋转水印，CNN/RNN + GAN 识破 · US20260246646</text>

    <rect x="112" y="464" width="88" height="24" rx="12" fill="#5E6B86" opacity="0.16"/>
    <text x="156" y="480" text-anchor="middle" font-size="12" fill="#4C586F" font-weight="700">检测侧</text>
    <rect x="212" y="464" width="88" height="24" rx="12" fill="#E4572E" opacity="0.16"/>
    <text x="256" y="480" text-anchor="middle" font-size="12" fill="#C24A24" font-weight="700">鉴真侧</text>
    <text class="b" x="318" y="480">同主题相隔约一年再公开，方向持续布局</text>
  </g>

