  </g>

  <!-- bottom: solo opportunity -->
  <line x1="64" y1="524" x2="1136" y2="524" stroke="#D5E0E4"/>
  <g>
    <text class="rl" x="64" y="562" font-weight="700">一个人能做：视频公证服务</text>
