    <text x="824" y="476" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#8ab4ff">VPS + 对象存储，一万元内 · 4 周 MVP</text>
    <text x="824" y="500" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#8ab4ff">订阅 99-299 元/月 · 单案报告 500-2000 元</text>
  </g>

  <!-- bottom takeaway -->
  <rect x="70" y="540" width="1060" height="52" rx="12" fill="url(#accentGrad)" opacity="0.14"/>
  <text x="600" y="573" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#dbe6ff" text-anchor="middle">大厂在专利里圈的是「怎么鉴真」，独立开发者能接的是「视频公证处」的活</text>
