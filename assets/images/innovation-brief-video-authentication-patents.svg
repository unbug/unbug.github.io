    <text class="val" x="880" y="562" fill="#4F9D69">4 周</text>
    <text class="b" x="880" y="582">可演示 MVP</text>
    <text class="val" x="1010" y="562" fill="#E4572E">99–299 元/月</text>
    <text class="b" x="1010" y="582">或单案代做 500–2,000 元</text>
