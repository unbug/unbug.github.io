<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">六家公司的文档抽取专利在 2026 年集中授权，Mistral 从优先权到授权仅 5.3 个月</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">六件核心授权按公开节奏排列（授权先后序位）</text>

  <!-- gridlines (integer order majors, 0.5pt) -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="240" y1="126" x2="240" y2="330"/>
    <line x1="408" y1="126" x2="408" y2="330"/>
    <line x1="576" y1="126" x2="576" y2="330"/>
    <line x1="744" y1="126" x2="744" y2="330"/>
    <line x1="912" y1="126" x2="912" y2="330"/>
  </g>

  <!-- items: x = 240 + 168*(order-1) -->
  <!-- Vendr -->
  <circle cx="240" cy="168" r="6" fill="#D55E00"/>
  <text x="240" y="192" font-size="12" fill="#555" text-anchor="middle">Vendr</text>
  <text x="240" y="208" font-size="12" fill="#555" text-anchor="middle">2026-03-24 授权</text>
  <text x="240" y="224" font-size="12" fill="#555" text-anchor="middle">用时 6.3 个月</text>

  <!-- Intuit US12632675B2 -->
  <circle cx="408" cy="196" r="6" fill="#0072B2"/>
  <text x="408" y="220" font-size="12" fill="#555" text-anchor="middle">Intuit</text>
  <text x="408" y="236" font-size="12" fill="#555" text-anchor="middle">US12632675B2 授权</text>

  <!-- Mistral -->
  <circle cx="576" cy="226" r="6" fill="#D55E00"/>
  <text x="576" y="250" font-size="12" fill="#555" text-anchor="middle">Mistral</text>
  <text x="576" y="266" font-size="12" fill="#555" text-anchor="middle">2026-06-09 授权</text>
  <text x="576" y="282" font-size="12" fill="#555" text-anchor="middle">用时 5.3 个月</text>

  <!-- IBM -->
  <circle cx="744" cy="254" r="6" fill="#0072B2"/>
  <text x="744" y="278" font-size="12" fill="#555" text-anchor="middle">IBM</text>
  <text x="744" y="294" font-size="12" fill="#555" text-anchor="middle">US12639362B2 授权</text>

  <!-- Adobe -->
  <circle cx="912" cy="276" r="6" fill="#0072B2"/>
  <text x="912" y="300" font-size="12" fill="#555" text-anchor="middle">Adobe</text>
  <text x="912" y="316" font-size="12" fill="#555" text-anchor="middle">US12699851B2 授权</text>

  <!-- Intuit US12705916B2 -->
  <circle cx="1080" cy="302" r="6" fill="#0072B2"/>
  <text x="1080" y="326" font-size="12" fill="#555" text-anchor="middle">Intuit</text>
  <text x="1080" y="342" font-size="12" fill="#555" text-anchor="middle">US12705916B2 授权</text>

  <!-- order axis -->
  <line x1="240" y1="370" x2="1080" y2="370" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="240" y1="370" x2="240" y2="374"/>
    <line x1="408" y1="370" x2="408" y2="374"/>
    <line x1="576" y1="370" x2="576" y2="374"/>
    <line x1="744" y1="370" x2="744" y2="374"/>
    <line x1="912" y1="370" x2="912" y2="374"/>
    <line x1="1080" y1="370" x2="1080" y2="374"/>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="240" y="394">第 1 件</text>
    <text x="408" y="394">第 2 件</text>
    <text x="576" y="394">第 3 件</text>
    <text x="744" y="394">第 4 件</text>
    <text x="912" y="394">第 5 件</text>
    <text x="1080" y="394">第 6 件</text>
  </g>
  <text x="660" y="422" font-size="14" fill="#1A1B1E" text-anchor="middle">公开节奏序位（第 n 件授权，按正文排列）</text>

  <!-- legend -->
  <g font-size="12" fill="#555">
    <circle cx="250" cy="447" r="5" fill="#0072B2"/>
    <text x="262" y="451">常规节拍授权（Intuit ×2 · IBM · Adobe）</text>
    <circle cx="510" cy="447" r="5" fill="#D55E00"/>
    <text x="522" y="451">异常快授权（Mistral · Vendr），用时见面板 b</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="60" y="506" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="506" font-size="15" fill="#1A1B1E">两件异常快授权：到授权用时（月）</text>

  <!-- gridlines -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="400" y1="526" x2="400" y2="620"/>
    <line x1="560" y1="526" x2="560" y2="620"/>
    <line x1="720" y1="526" x2="720" y2="620"/>
    <line x1="880" y1="526" x2="880" y2="620"/>
  </g>
  <!-- bars: x = 240 + 80*v -->
  <text x="230" y="551" font-size="12.5" fill="#1A1B1E" text-anchor="end">Vendr</text>
  <rect x="240" y="537" width="504" height="18" fill="#D55E00"/>
  <line x1="744" y1="534" x2="744" y2="558" stroke="#D55E00" stroke-width="0.75"/>
  <text x="752" y="551" font-size="12" fill="#555">6.3 个月 = 2025-09-15 申请 → 2026-03-24 授权</text>

  <text x="230" y="599" font-size="12.5" fill="#1A1B1E" text-anchor="end">Mistral</text>
  <rect x="240" y="585" width="424" height="18" fill="#D55E00"/>
  <line x1="664" y1="582" x2="664" y2="606" stroke="#D55E00" stroke-width="0.75"/>
  <text x="672" y="599" font-size="12" fill="#555">5.3 个月 = 2025-12-31 优先权 → 2026-06-09 授权</text>

  <!-- value axis -->
  <line x1="240" y1="620" x2="880" y2="620" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="240" y1="620" x2="240" y2="624"/>
    <line x1="400" y1="620" x2="400" y2="624"/>
    <line x1="560" y1="620" x2="560" y2="624"/>
    <line x1="720" y1="620" x2="720" y2="624"/>
    <line x1="880" y1="620" x2="880" y2="624"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="240" y="644">0</text>
    <text x="400" y="644">2</text>
    <text x="560" y="644">4</text>
    <text x="720" y="644">6</text>
    <text x="880" y="644">8</text>
  </g>
  <text x="560" y="668" font-size="14" fill="#1A1B1E" text-anchor="middle">到授权用时（月）</text>

  <!-- side notes -->
  <text x="60" y="472" font-size="12" fill="#555">其余四件（Intuit ×2、IBM、Adobe）正文未给出申请或优先权日期，无法计算用时，只在面板 a 显示授权节奏。</text>
  <text x="930" y="551" font-size="11" fill="#767676">数据：Google Patents 详情页逐字核验</text>
  <text x="930" y="567" font-size="11" fill="#767676">（六件公开号见正文 References）·</text>
  <text x="930" y="583" font-size="11" fill="#767676">审查快慢受程序因素影响，</text>
  <text x="930" y="599" font-size="11" fill="#767676">不能直读市场热度</text>
</svg>
