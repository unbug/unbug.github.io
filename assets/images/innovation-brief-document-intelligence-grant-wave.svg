  <line x1="921" y1="472" x2="921" y2="488" stroke="#3a4a66" stroke-width="2"/>

  <!-- points: month scale x = 120 + (m-2)*133.5, day fraction -->
  <!-- Intuit US12632675 05-19 -->
  <circle cx="602" cy="230" r="12" fill="#4fc3f7"/>
  <text x="602" y="200" fill="#e8ecf4" font-size="18" text-anchor="middle">Intuit</text>
