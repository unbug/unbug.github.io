<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #8F9476; }
      .rl { font-size: 15px; font-weight: 700; fill: #23241D; }
      .ev { font-size: 13px; fill: #676B58; }
      .b { font-size: 12px; fill: #A6AB8E; }
      .hd { font-size: 12.5px; letter-spacing: 2px; fill: #8F9476; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4F5EC"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3F6B4F"/><stop offset="1" stop-color="#6C9573"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#BE3A34"/><stop offset="1" stop-color="#DD6B57"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DD7B2A"/><stop offset="1" stop-color="#EFA25C"/>
    </linearGradient>
    <linearGradient id="gYellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CEA115"/><stop offset="1" stop-color="#E4C24A"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D6B8E"/><stop offset="1" stop-color="#6C97B6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1120" cy="606" r="130" fill="#3F6B4F" opacity="0.05"/>
  <circle cx="84" cy="108" r="110" fill="#BE3A34" opacity="0.05"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gRed)"/>

  <text class="k" x="64" y="84">AI 智创简报 · 2026-10-16 · GOOGLE PATENTS 逐字核验</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#23241D">六份授权，同一条流水线</text>
  <text x="64" y="158" font-size="15" fill="#676B58">2026 年 2-8 月，六家公司各自圈地，切法却一模一样</text>

  <!-- printing press motif -->
  <g>
    <rect x="1004" y="104" width="128" height="72" rx="8" fill="#FFFFFF" stroke="#C6CBAC" stroke-width="1.8"/>
    <rect x="1020" y="118" width="96" height="8" rx="2" fill="#A9AF8E"/>
    <rect x="1020" y="134" width="64" height="8" rx="2" fill="#EFA25C"/>
    <rect x="1020" y="150" width="80" height="8" rx="2" fill="#A9AF8E"/>
    <path d="M 1030 96 l 30 -22 l 68 0 l 0 22" fill="none" stroke="#3F6B4F" stroke-width="4" stroke-linecap="round"/>
    <rect x="1014" y="184" width="108" height="20" rx="4" fill="url(#gYellow)"/>
    <text x="1068" y="198" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">只裁那一小块</text>
    <text class="hd" x="1068" y="228" text-anchor="middle">先定位，再下墨</text>
  </g>

  <!-- three-step press line -->
  <g>
    <text class="hd" x="64" y="206">流水线三步 · 六家刀口不同、顺序一致</text>
    <rect x="64" y="220" width="344" height="56" rx="8" fill="#3F6B4F" opacity="0.08"/>
    <text class="rl" x="84" y="244" fill="#3F6B4F">第一步 · 规则先定位</text>
    <text class="ev" x="84" y="266">版式 / 分类器命中目标字段</text>
    <path d="M 416 248 l 18 0" stroke="#B9BD9C" stroke-width="2.5"/>
    <rect x="442" y="220" width="344" height="56" rx="8" fill="#DD7B2A" opacity="0.09"/>
    <text class="rl" x="462" y="244" fill="#B05E18">第二步 · 只喂命中邻域</text>
    <text class="ev" x="462" y="266">整页不进模型 · 省 token 缩幻觉面</text>
    <path d="M 794 248 l 18 0" stroke="#B9BD9C" stroke-width="2.5"/>
    <rect x="820" y="220" width="316" height="56" rx="8" fill="#3D6B8E" opacity="0.08"/>
    <text class="rl" x="840" y="244" fill="#3D6B8E">第三步 · 字段级校验</text>
    <text class="ev" x="840" y="266">校验进独立权利要求</text>
  </g>

  <!-- six grants: two speed rows -->
  <text class="hd" x="64" y="332">六件核心授权 · 授权日</text>
  <text class="hd" x="806" y="332">到授权用时</text>

  <rect x="64" y="348" width="1072" height="42" rx="9" fill="#BE3A34" opacity="0.08"/>
  <text class="rl" x="88" y="375" fill="#BE3A34">异常快</text>
  <text class="ev" x="176" y="375">Mistral《Document intelligence》</text>
  <text x="466" y="375" font-size="16" font-weight="700" fill="#23241D">06-09</text>
  <text x="806" y="376" font-size="22" font-weight="700" fill="#BE3A34">5.3 个月</text>
  <text class="b" x="920" y="375">优先权 2025-12-31 起算</text>

  <rect x="64" y="398" width="1072" height="42" rx="9" fill="#DD7B2A" opacity="0.08"/>
  <text class="rl" x="88" y="425" fill="#B05E18">异常快</text>
  <text class="ev" x="176" y="425">Vendr《自动抽取非结构化文档》</text>
  <text x="466" y="425" font-size="16" font-weight="700" fill="#23241D">03-24</text>
  <text x="806" y="426" font-size="22" font-weight="700" fill="#B05E18">6.3 个月</text>
  <text class="b" x="920" y="425">申请 2025-09-15 起算</text>

  <rect x="64" y="448" width="1072" height="42" rx="9" fill="#6C9573" opacity="0.08"/>
  <text class="rl" x="88" y="475">常规节拍</text>
  <text class="ev" x="176" y="475">Intuit ×2 · IBM · Adobe</text>
  <text x="466" y="475" font-size="16" font-weight="700" fill="#23241D">05-19 至 08 月</text>
  <text x="806" y="476" font-size="16" font-weight="700" fill="#3F6B4F">同一条流水线</text>
  <text class="b" x="972" y="475">各家切法不同</text>

  <!-- big number anchor -->
  <g>
    <rect x="64" y="516" width="420" height="86" rx="12" fill="#CEA115" opacity="0.09"/>
    <rect x="64" y="516" width="420" height="6" rx="3" fill="url(#gYellow)"/>
    <text class="serif" x="88" y="568" font-size="30" font-weight="700" fill="#23241D">6 家独立收敛</text>
    <text class="b" x="88" y="590">快授件连续出现，权利要求空间已清晰</text>
  </g>

  <!-- consensus verdict -->
  <g>
    <rect x="510" y="516" width="626" height="86" rx="12" fill="#3F6B4F" opacity="0.07"/>
    <rect x="510" y="516" width="626" height="6" rx="3" fill="url(#gGreen)"/>
    <text class="serif" x="534" y="560" font-size="20" font-weight="700" fill="#23241D">整页塞大模型抽取，已落后于专利面共识</text>
    <text class="b" x="534" y="588">Mistral 模型厂亲自圈流程层的地 · 工具层已是红海</text>
  </g>

  <line x1="64" y1="628" x2="1136" y2="628" stroke="#E3E6D2"/>
  <text class="b" x="64" y="654">审查快慢受程序因素影响，不能直读市场热度 · Google Patents 详情页核验 · Micropaper</text>
</svg>
