<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">2700 万参数的分层推理模型 HRM 在 ARC-AGI 上达 40.3%，超过参数量大得多的大模型</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">ARC-AGI 准确率对比（%，论文报告值）</text>

  <!-- gridlines at the three reported values: x = 210 + 11*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="443.2" y1="130" x2="443.2" y2="340"/>
    <line x1="589.5" y1="130" x2="589.5" y2="340"/>
    <line x1="663.3" y1="130" x2="663.3" y2="340"/>
  </g>

  <!-- bars -->
  <rect x="210" y="140" width="453.3" height="26" fill="#D55E00"/>
  <text x="671" y="158" font-size="12" fill="#555555">40.3%（HRM，27M 参数，无大规模预训练）</text>

  <rect x="210" y="237" width="379.5" height="26" fill="#999999"/>
  <text x="597" y="255" font-size="12" fill="#555555">34.5%（OpenAI o3-mini-high）</text>

  <rect x="210" y="334" width="233.2" height="26" fill="#999999"/>
  <text x="451" y="352" font-size="12" fill="#555555">21.2%（Claude 3.7 Sonnet）</text>

  <!-- x axis: ticks only at values stated in text -->
  <line x1="210" y1="380" x2="700" y2="380" stroke="#1A1B1E" stroke-width="0.75"/>
  <line x1="210" y1="130" x2="210" y2="380" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="443.2" y1="380" x2="443.2" y2="384"/>
    <line x1="589.5" y1="380" x2="589.5" y2="384"/>
    <line x1="663.3" y1="380" x2="663.3" y2="384"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="443.2" y="402">21.2</text>
    <text x="589.5" y="402">34.5</text>
    <text x="663.3" y="402">40.3</text>
  </g>
  <text x="455" y="428" font-size="14" fill="#1A1B1E" text-anchor="middle">ARC-AGI 准确率（%）</text>
  <text x="202" y="402" font-size="12" fill="#555555" text-anchor="end">起点</text>

  <!-- panel a note -->
  <text x="60" y="456" font-size="12" fill="#555555">在「极限数独」「困难迷宫」搜索任务上，最先进 CoT 模型准确率为 0%，HRM 用 1000 个训练样本即接近完美</text>

  <!-- ============ panel b ============ -->
  <text x="850" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="872" y="104" font-size="15" fill="#1A1B1E">分层收敛机制示意（潜空间推理，不输出文本）</text>

  <!-- H module -->
  <rect x="950" y="140" width="200" height="76" fill="#F2F2F2" stroke="#555555" stroke-width="1.5"/>
  <text x="1050" y="172" font-size="14" font-weight="bold" fill="#1A1B1E" text-anchor="middle">高层模块 H-module</text>
  <text x="1050" y="196" font-size="12" fill="#555555" text-anchor="middle">抽象规划，调整战略</text>

  <!-- L module -->
  <rect x="950" y="300" width="200" height="76" fill="#FFFFFF" stroke="#D55E00" stroke-width="2"/>
  <text x="1050" y="332" font-size="14" font-weight="bold" fill="#1A1B1E" text-anchor="middle">低层模块 L-module</text>
  <text x="1050" y="356" font-size="12" fill="#555555" text-anchor="middle">快速计算，求出局部解</text>

  <!-- down arrow (strategy) -->
  <g stroke="#555555" stroke-width="1.5" fill="#555555">
    <line x1="1010" y1="216" x2="1010" y2="293"/>
    <polygon points="1004,293 1016,293 1010,303"/>
  </g>
  <text x="998" y="262" font-size="12" fill="#555555" text-anchor="end">下达精细子任务</text>

  <!-- up arrow (result) -->
  <g stroke="#555555" stroke-width="1.5" fill="#555555">
    <line x1="1090" y1="300" x2="1090" y2="223"/>
    <polygon points="1084,223 1096,223 1090,213"/>
  </g>
  <text x="1102" y="262" font-size="12" fill="#555555">检视局部解</text>

  <!-- loop note -->
  <text x="1050" y="412" font-size="12" fill="#555555" text-anchor="middle">嵌套循环：H-module 相当于让 L-module 重置，</text>
  <text x="1050" y="430" font-size="12" fill="#555555" text-anchor="middle">避免陷入单一路径，直至分层收敛</text>

  <!-- shared note -->
  <text x="60" y="498" font-size="12" fill="#555555">灵感来自大脑双系统结构；推理在潜空间完成，替代 CoT 文本。训练成本：专业级数独 2 GPU 小时，ARC-AGI 50-200 GPU 小时；</text>
  <text x="60" y="516" font-size="12" fill="#555555">潜空间并行处理相比 CoT 逐词生成可能带来约 100 倍推理提速（论文估计口径）</text>

  <!-- footnote -->
  <text x="60" y="600" font-size="11" fill="#767676">来源：arXiv:2506.21734《Hierarchical Reasoning Model》，Sapient Intelligence，NeurIPS 2025 · 准确率为论文自测口径，未报告误差区间，故未画误差棒</text>
  <text x="60" y="618" font-size="11" fill="#767676">面板 a 为论文报告值对比 · 面板 b 为论文框架的机制示意（无数值轴，序列/机制口径）· 数独、迷宫「接近完美」为论文定性表述</text>
</svg>
