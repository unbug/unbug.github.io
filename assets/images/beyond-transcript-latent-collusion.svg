<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9C9484; }
      .rl { font-size: 15px; fill: #474C54; }
      .b { font-size: 12px; fill: #A5A296; }
      .chip { font-size: 12.5px; font-weight: 600; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6F0E8"/>
    </linearGradient>
    <linearGradient id="gVermil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5442E"/><stop offset="1" stop-color="#E37C45"/>
    </linearGradient>
    <linearGradient id="gWine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C2D5A"/><stop offset="1" stop-color="#B56A8F"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#177E7A"/><stop offset="1" stop-color="#5FB3A4"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A97E12"/><stop offset="1" stop-color="#DCB24A"/>
    </linearGradient>
    <linearGradient id="gSlate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D5A73"/><stop offset="1" stop-color="#6E8CA8"/>
    </linearGradient>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31457E"/><stop offset="1" stop-color="#6A7FB5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1090" cy="126" r="150" fill="#7C2D5A" opacity="0.05"/>
  <circle cx="70" cy="640" r="105" fill="#177E7A" opacity="0.05"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gVermil)"/>

  <text class="k" x="64" y="84">一分钟读论文 · ARXIV:2608.19161 · MIT MEDIA LAB 等</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">酒坛底的私接暗管</text>
  <text x="64" y="158" font-size="15" fill="#5B6068">Beyond the Transcript：合谋走公开账本看不见的 latent 通道，只用中性样本训练的三层监控即可检出</text>

  <!-- winery motif: two vats joined by a hidden underground pipe, audit ledger above -->
  <g>
    <rect x="896" y="112" width="76" height="118" rx="14" fill="url(#gSlate)" opacity="0.88"/>
    <rect x="904" y="104" width="60" height="12" rx="5" fill="#3D5A73"/>
    <rect x="905" y="142" width="58" height="40" rx="7" fill="#22384C" opacity="0.45"/>
    <text x="934" y="170" text-anchor="middle" class="serif" font-size="24" font-weight="700" fill="#FFFFFF">甲</text>
    <text x="934" y="250" text-anchor="middle" class="chip" fill="#3D5A73">发送方</text>

    <rect x="1064" y="112" width="76" height="118" rx="14" fill="url(#gTeal)" opacity="0.9"/>
    <rect x="1072" y="104" width="60" height="12" rx="5" fill="#177E7A"/>
    <rect x="1073" y="142" width="58" height="40" rx="7" fill="#0E5A57" opacity="0.4"/>
    <text x="1102" y="170" text-anchor="middle" class="serif" font-size="24" font-weight="700" fill="#FFFFFF">乙</text>
    <text x="1102" y="250" text-anchor="middle" class="chip" fill="#155E5B">接收方</text>

    <path d="M 972 196 C 1006 196, 1000 246, 1022 246 S 1068 214, 1064 196" stroke="#8A8271" stroke-width="2" fill="none" stroke-dasharray="5 6"/>
    <text x="1018" y="190" text-anchor="middle" class="b">公开账本：两笔独立出价</text>

    <path d="M 960 204 C 985 296, 1040 300, 1092 210" stroke="#7C2D5A" stroke-width="2" fill="none" stroke-dasharray="3 5" opacity="0.6"/>
    <path d="M 960 204 C 985 296, 1040 300, 1092 210" stroke="url(#gWine)" stroke-width="7.5" fill="none" stroke-linecap="round" stroke-dasharray="15 11"/>
    <circle cx="962" cy="207" r="5" fill="#7C2D5A"/>
    <circle cx="1090" cy="212" r="5" fill="#7C2D5A"/>
    <text x="1025" y="296" text-anchor="middle" class="chip" fill="#7C2D5A">坛底暗管：latent handoff</text>
    <text x="1025" y="316" text-anchor="middle" class="b">连续隐藏状态 · 不进 transcript</text>
    <text x="1025" y="336" text-anchor="middle" class="b">token 省 50-80% · 快 3-7x</text>
  </g>

  <!-- harm bar strip -->
  <g>
    <rect x="64" y="196" width="780" height="78" fill="#B5442E" opacity="0.07"/>
    <text class="serif" x="88" y="230" font-size="17" font-weight="700" fill="#474C54">合谋对拍卖收入的伤害（相对独立出价）</text>
    <text class="serif" x="88" y="262" font-size="26" font-weight="700" fill="#B5442E">-12.43</text>
    <text x="164" y="260" font-size="13" fill="#5B6068">credits · Qwen3-0.6B（低报价率 +56.2pp）</text>
    <text class="rl" x="470" y="261">Mistral-7B -11.78 · Phi-4-mini -11.12</text>
    <text class="b" x="820" y="261" text-anchor="end">Vicuna-7B 近零，留作负证据</text>
  </g>

  <!-- detection bars -->
  <g>
    <text class="rl" x="64" y="318" font-weight="600">三层无监督监控的检出（AUROC）</text>

    <line x1="248" y1="334" x2="820" y2="334" stroke="#EAE6DA"/>
    <line x1="248" y1="334" x2="248" y2="430" stroke="#EAE6DA"/>
    <text class="b" x="248" y="448">0</text>
    <text class="b" x="534" y="448" text-anchor="middle">0.5</text>
    <text class="b" x="820" y="448" text-anchor="end">1.0</text>

    <rect x="64" y="336" width="780" height="42" fill="#31457E" opacity="0.08"/>
    <text class="rl" x="232" y="362" text-anchor="end">同质四模型</text>
    <rect x="248" y="347" width="568" height="20" rx="3" fill="url(#gIndigo)"/>
    <text class="serif" x="828" y="365" font-size="24" font-weight="700" fill="#31457E">0.993</text>

    <rect x="64" y="388" width="780" height="42" fill="#177E7A" opacity="0.08"/>
    <text class="rl" x="232" y="414" text-anchor="end">跨族 36 对</text>
    <rect x="248" y="399" width="488" height="20" rx="3" fill="url(#gTeal)"/>
    <text class="serif" x="748" y="417" font-size="24" font-weight="700" fill="#155E5B">0.854</text>

    <rect x="880" y="336" width="256" height="46" fill="#B5442E" opacity="0.08"/>
    <text class="serif" x="896" y="366" font-size="21" font-weight="700" fill="#B5442E">≤ 0.202%</text>
    <text x="896" y="386" font-size="12" fill="#5B6068">监控负载上界（25-100 方）</text>
    <rect x="880" y="392" width="256" height="46" fill="#A97E12" opacity="0.09"/>
    <text class="serif" x="896" y="422" font-size="21" font-weight="700" fill="#8A6612">0.814 / ≥0.917</text>
    <text x="896" y="442" font-size="12" fill="#5B6068">Layer 2 最强单层 · 规模下限</text>
  </g>

  <!-- intervention bars -->
  <g>
    <text class="rl" x="64" y="496" font-weight="600">干预剂量响应：白盒配额越高，出价分布恢复越多（幅度示意）</text>

    <rect x="64" y="508" width="1072" height="26" fill="#A97E12" opacity="0.07"/>
    <rect x="64" y="540" width="1072" height="26" fill="#A97E12" opacity="0.09"/>
    <rect x="64" y="572" width="1072" height="26" fill="#B5442E" opacity="0.07"/>

    <text class="rl" x="232" y="526" text-anchor="end">黑盒 prompt</text>
    <rect x="248" y="512" width="36" height="18" rx="3" fill="url(#gSlate)"/>
    <text class="serif" x="296" y="527" font-size="17" font-weight="700" fill="#3D5A73">12.4%</text>

    <text class="rl" x="232" y="558" text-anchor="end">白盒 1/4 → 3/4</text>
    <rect x="248" y="544" width="100" height="18" rx="3" fill="url(#gAmber)"/>
    <rect x="356" y="544" width="182" height="18" rx="3" fill="url(#gAmber)" opacity="0.7"/>
    <rect x="546" y="544" width="152" height="18" rx="3" fill="url(#gAmber)" opacity="0.45"/>
    <text class="serif" x="712" y="559" font-size="19" font-weight="700" fill="#8A6612">34.7% → 70.1% → 93.0%</text>
    <text class="serif" x="960" y="559" font-size="19" font-weight="700" fill="#B5442E">+58.3pp</text>

    <text class="rl" x="232" y="590" text-anchor="end">低报价率变化</text>
    <text class="serif" x="248" y="591" font-size="17" font-weight="700" fill="#155E5B">干预后 -47.3pp</text>
    <text class="b" x="420" y="591">全局 system prompt 压价 -29.5pp，但分布恢复仅 2.9%</text>
  </g>

  <text class="b" x="1136" y="648" text-anchor="end">0.6B-7B · 受控 receiver-primed 攻击 · NandaTown 单一 testbed · 不外推前沿模型 · Micropaper</text>
</svg>
