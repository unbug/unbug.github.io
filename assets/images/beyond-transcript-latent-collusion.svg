<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'PingFang SC','Noto Sans CJK SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#546e7a"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1200" height="8" fill="#c62828"/>

  <text x="600" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#1a237e">拍卖桌下的暗线：多智能体隐藏合谋的检测与干预</text>
  <text x="600" y="82" text-anchor="middle" font-size="16" fill="#546e7a">arXiv:2608.19161 · MIT Media Lab + Westtown + UF + SRI International 6 位作者 · v1 2026-08-19 · Beyond the Transcript</text>

  <!-- top: threat flow -->
  <rect x="40" y="105" width="170" height="90" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="125" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#b71c1c">发送方 Agent</text>
  <text x="125" y="162" text-anchor="middle" font-size="12.5" fill="#c62828">注入连续隐藏状态</text>
  <text x="125" y="180" text-anchor="middle" font-size="12.5" fill="#c62828">携带私有策略意图</text>

  <line x1="210" y1="150" x2="246" y2="150" stroke="#546e7a" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="228" y="138" text-anchor="middle" font-size="12" fill="#37474f">注入</text>

  <rect x="250" y="105" width="220" height="90" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="360" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#e65100">latent handoff 通道（攻击面）</text>
  <text x="360" y="162" text-anchor="middle" font-size="12.5" fill="#ef6c00">残差流 / last-token 表示</text>
  <text x="360" y="180" text-anchor="middle" font-size="12.5" fill="#ef6c00">公开日志不可见</text>

  <line x1="470" y1="150" x2="506" y2="150" stroke="#546e7a" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="488" y="138" text-anchor="middle" font-size="12" fill="#37474f">接收</text>

  <rect x="510" y="105" width="200" height="90" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="610" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#0d47a1">接收方 Agent</text>
  <text x="610" y="162" text-anchor="middle" font-size="12.5" fill="#1565c0">receiver-primed 受控攻击</text>
  <text x="610" y="180" text-anchor="middle" font-size="12.5" fill="#1565c0">合谋低报价 · 收入受损</text>

  <line x1="710" y1="150" x2="746" y2="150" stroke="#546e7a" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="728" y="138" text-anchor="middle" font-size="12" fill="#37474f">公开出价</text>

  <rect x="750" y="105" width="200" height="90" rx="10" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
  <text x="850" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#37474f">公开 transcript</text>
  <text x="850" y="162" text-anchor="middle" font-size="12.5" fill="#546e7a">审计面只见正常出价</text>
  <text x="850" y="180" text-anchor="middle" font-size="12.5" fill="#546e7a">收入 -12.43 credits 等</text>

  <rect x="990" y="105" width="170" height="90" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="1075" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#1b5e20">三层无监督监控</text>
  <text x="1075" y="162" text-anchor="middle" font-size="12.5" fill="#2e7d32">仅中性样本训练</text>
  <text x="1075" y="180" text-anchor="middle" font-size="12" fill="#2e7d32">AUROC 0.993 · 负载 ≤0.2%</text>

  <!-- monitor watches the channel -->
  <path d="M 1075,105 L 1075,96 L 360,96 L 360,103" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="717" y="92" text-anchor="middle" font-size="12" fill="#2e7d32">激活监控 · 无需学习攻击目录</text>

  <!-- left panel: Table 1 detection -->
  <rect x="40" y="225" width="540" height="215" rx="10" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
  <text x="60" y="253" font-size="16" font-weight="700" fill="#263238">检测：sequential 组合 AUROC（Table 1，同质四模型族）</text>
  <!-- bars: axis from 0.8, scale (v-0.8)/0.2*300 -->
  <rect x="200" y="268" width="300" height="26" fill="#c62828"/>
  <text x="190" y="286" text-anchor="end" font-size="13.5" fill="#37474f">Mistral-7B</text>
  <text x="508" y="286" font-size="14" font-weight="700" fill="#b71c1c">1.000</text>
  <rect x="200" y="300" width="285" height="26" fill="#ef6c00"/>
  <text x="190" y="318" text-anchor="end" font-size="13.5" fill="#37474f">Vicuna-7B</text>
  <text x="493" y="318" font-size="14" font-weight="700" fill="#e65100">0.994</text>
  <rect x="200" y="332" width="270" height="26" fill="#ef6c00"/>
  <text x="190" y="350" text-anchor="end" font-size="13.5" fill="#37474f">Qwen3-0.6B</text>
  <text x="478" y="350" font-size="14" font-weight="700" fill="#e65100">0.990</text>
  <rect x="200" y="364" width="264" height="26" fill="#ef6c00"/>
  <text x="190" y="382" text-anchor="end" font-size="13.5" fill="#37474f">Phi-4-mini</text>
  <text x="472" y="382" font-size="14" font-weight="700" fill="#e65100">0.988</text>
  <text x="60" y="410" font-size="12.5" fill="#546e7a">mean AUROC 0.993 · Layer 2 单独 0.814（最强单层）· 异构模型对 0.854（Table 3，36 settings）</text>
  <text x="60" y="430" font-size="12.5" fill="#546e7a">正类 = text + latent collusion 行合并（论文自注）· 坐标轴从 0.8 起</text>

  <!-- right panel: Table 5 dose response -->
  <rect x="620" y="225" width="540" height="215" rx="10" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
  <text x="640" y="253" font-size="16" font-weight="700" fill="#263238">干预：白盒配额决定分布恢复率（Table 5）</text>
  <!-- bars: scale 3.0px per point from 0 -->
  <rect x="800" y="268" width="300" height="26" fill="#2e7d32"/>
  <text x="790" y="286" text-anchor="end" font-size="13.5" fill="#37474f">full whitebox</text>
  <text x="1108" y="286" font-size="14" font-weight="700" fill="#1b5e20">100.0%</text>
  <rect x="800" y="300" width="279" height="26" fill="#ef6c00"/>
  <text x="790" y="318" text-anchor="end" font-size="13.5" fill="#37474f">配额 0.75 / 0.25</text>
  <text x="1087" y="318" font-size="14" font-weight="700" fill="#e65100">93.0%</text>
  <rect x="800" y="332" width="210" height="26" fill="#ef6c00"/>
  <text x="790" y="350" text-anchor="end" font-size="13.5" fill="#37474f">配额 0.50 / 0.50</text>
  <text x="1018" y="350" font-size="14" font-weight="700" fill="#e65100">70.1%</text>
  <rect x="800" y="364" width="104" height="26" fill="#ef6c00"/>
  <text x="790" y="382" text-anchor="end" font-size="13.5" fill="#37474f">配额 0.25 / 0.75</text>
  <text x="912" y="382" font-size="14" font-weight="700" fill="#e65100">34.7%</text>
  <rect x="800" y="396" width="37" height="26" fill="#c62828"/>
  <text x="790" y="414" text-anchor="end" font-size="13.5" fill="#37474f">纯黑盒 prompt</text>
  <text x="845" y="414" font-size="14" font-weight="700" fill="#b71c1c">12.4%</text>
  <text x="640" y="436" font-size="12.5" fill="#546e7a">配额 1/4 → 3/4 恢复率 +58.3pp · system prompt 仅 2.9%（压价 -29.5pp）</text>

  <!-- bottom left: scalability -->
  <rect x="40" y="460" width="360" height="130" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="220" y="488" text-anchor="middle" font-size="15" font-weight="700" fill="#0d47a1">规模化与监控负载（Table 4）</text>
  <text x="220" y="514" text-anchor="middle" font-size="13.5" fill="#1565c0">AUROC ≥0.917 · 至多 100 个出价方</text>
  <text x="220" y="536" text-anchor="middle" font-size="13.5" fill="#1565c0">normalized load ≤0.202%（全部有向对）</text>
  <text x="220" y="560" text-anchor="middle" font-size="12" fill="#5c6bc0">阈值 = 中性样本 95 分位 · correlation ID 逐事件归因</text>

  <!-- bottom middle: boundary -->
  <rect x="420" y="460" width="380" height="130" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="610" y="488" text-anchor="middle" font-size="15" font-weight="700" fill="#e65100">边界与不能外推之处</text>
  <text x="610" y="514" text-anchor="middle" font-size="13.5" fill="#37474f">仅 0.6B-7B 模型 · 单一 NandaTown 拍卖 testbed（6 场景 / 12 协议层）</text>
  <text x="610" y="536" text-anchor="middle" font-size="13.5" fill="#37474f">receiver-primed 受控攻击，非自发涌现的隐藏协议</text>
  <text x="610" y="560" text-anchor="middle" font-size="12" fill="#9e9d24">full WB 100% 恢复为 by-construction sanity check · Layer 2 需 matched control</text>

  <!-- bottom right: takeaway -->
  <rect x="820" y="460" width="340" height="130" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="990" y="488" text-anchor="middle" font-size="15" font-weight="700" fill="#1b5e20">核心结论</text>
  <text x="990" y="514" text-anchor="middle" font-size="13.5" fill="#2e7d32">合谋可在审计面之外发生，且可被检出</text>
  <text x="990" y="536" text-anchor="middle" font-size="13.5" fill="#2e7d32">≤0.2% 负载的三层无监督监控即可报警</text>
  <text x="990" y="560" text-anchor="middle" font-size="12" fill="#558b2f">白盒配额决定干预力度 · 黑盒手段很弱</text>
</svg>
