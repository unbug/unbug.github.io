<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">STAIR + MiniMax M2.5 在 SWE-bench Verified 达 81.2% Pass@1；消融显示多层抽象 76.0% 远超无抽象原始轨迹 53.6%</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">代表性运行的 Pass@1（%，SWE-bench Verified）</text>

  <!-- gridlines -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="300" y1="352" x2="600" y2="352"/>
    <line x1="300" y1="284" x2="600" y2="284"/>
    <line x1="300" y1="216" x2="600" y2="216"/>
    <line x1="300" y1="148" x2="600" y2="148"/>
  </g>
  <!-- bars: y = 420 - 3.2*v -->
  <rect x="330" y="159.4" width="60" height="260.6" fill="#0072B2"/>
  <text x="360" y="151" font-size="12" fill="#555" text-anchor="middle">81.2</text>
  <text x="360" y="440" font-size="12.5" fill="#1A1B1E" text-anchor="middle">STAIR +</text>
  <text x="360" y="456" font-size="12.5" fill="#1A1B1E" text-anchor="middle">MiniMax M2.5</text>

  <rect x="440" y="165.8" width="60" height="254.2" fill="#0072B2"/>
  <text x="470" y="157" font-size="12" fill="#555" text-anchor="middle">79.2</text>
  <text x="470" y="440" font-size="12.5" fill="#1A1B1E" text-anchor="middle">STAIR +</text>
  <text x="470" y="456" font-size="12.5" fill="#1A1B1E" text-anchor="middle">GPT-5</text>

  <rect x="545" y="165.8" width="60" height="254.2" fill="#999999"/>
  <text x="575" y="157" font-size="12" fill="#555" text-anchor="middle">79.2</text>
  <text x="575" y="440" font-size="12.5" fill="#1A1B1E" text-anchor="middle">Sonar</text>
  <text x="575" y="456" font-size="12.5" fill="#1A1B1E" text-anchor="middle">Foundation Agent</text>

  <!-- axis -->
  <line x1="300" y1="420" x2="620" y2="420" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="296" y1="420" x2="300" y2="420"/>
    <line x1="296" y1="352" x2="300" y2="352"/>
    <line x1="296" y1="284" x2="300" y2="284"/>
    <line x1="296" y1="216" x2="300" y2="216"/>
    <line x1="296" y1="148" x2="300" y2="148"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="290" y="424">0</text>
    <text x="290" y="356">20</text>
    <text x="290" y="288">40</text>
    <text x="290" y="220">60</text>
    <text x="290" y="152">80</text>
  </g>
  <text x="215" y="135" font-size="14" fill="#1A1B1E">Pass@1（%）</text>
  <text x="300" y="486" font-size="12" fill="#555">Sonar Foundation Agent 基于 Claude 4.5 Opus，与 STAIR + GPT-5 持平。</text>

  <!-- ============ panel b ============ -->
  <text x="680" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="692" y="104" font-size="15" fill="#1A1B1E">抽象层级消融：Pass@1（%）</text>

  <!-- gridlines x = 830 + 4.25*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="892.5" y1="130" x2="892.5" y2="380"/>
    <line x1="955" y1="130" x2="955" y2="380"/>
    <line x1="1017.5" y1="130" x2="1017.5" y2="380"/>
    <line x1="1080" y1="130" x2="1080" y2="380"/>
  </g>
  <!-- bars -->
  <text x="818" y="163" font-size="12.5" fill="#1A1B1E" text-anchor="end">多层混合（完整）</text>
  <rect x="830" y="150" width="323" height="16" fill="#D55E00"/>
  <text x="1160" y="163" font-size="12" fill="#555">76.0</text>

  <text x="818" y="225" font-size="12.5" fill="#1A1B1E" text-anchor="end">仅低层</text>
  <rect x="830" y="212" width="265.2" height="16" fill="#999999"/>
  <text x="1102" y="225" font-size="12" fill="#555">62.4</text>

  <text x="818" y="287" font-size="12.5" fill="#1A1B1E" text-anchor="end">仅高层</text>
  <rect x="830" y="274" width="241.4" height="16" fill="#999999"/>
  <text x="1078" y="287" font-size="12" fill="#555">56.8</text>

  <text x="818" y="349" font-size="12.5" fill="#1A1B1E" text-anchor="end">无抽象（原始轨迹）</text>
  <rect x="830" y="336" width="227.8" height="16" fill="#999999"/>
  <text x="1064" y="349" font-size="12" fill="#555">53.6</text>

  <!-- axis -->
  <line x1="830" y1="380" x2="1105" y2="380" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="830" y1="380" x2="830" y2="384"/>
    <line x1="892.5" y1="380" x2="892.5" y2="384"/>
    <line x1="955" y1="380" x2="955" y2="384"/>
    <line x1="1017.5" y1="380" x2="1017.5" y2="384"/>
    <line x1="1080" y1="380" x2="1080" y2="384"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="830" y="400">0</text>
    <text x="892.5" y="400">15</text>
    <text x="955" y="400">30</text>
    <text x="1017.5" y="400">45</text>
    <text x="1080" y="400">60</text>
  </g>
  <text x="965" y="424" font-size="14" fill="#1A1B1E" text-anchor="middle">Pass@1（%）</text>
  <text x="680" y="452" font-size="12" fill="#555">混合多个抽象级别比任何单一级别高出 13-19 个百分点。</text>

  <!-- footnote -->
  <text x="60" y="600" font-size="11" fill="#767676">数据：arXiv:2607.29658（SWE-bench Verified：500 个真实 GitHub issue）· 跨代理迁移至 mini-SWE-agent v2 时 Pass@1 从 75.8% 升至 81.0%，token 用量减少约 3.5% · 冷启动预处理约 211 美元（479 个轨迹）· 论文自测口径 · 预印本未经同行评审</text>
</svg>
