<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">相对最优基线，Pass@1 平均提升 29.60%–93.55%；相比 agent-based 基线，时间开销反降 22.44%–39.14%</text>

  <!-- ===== panel a: average improvement ranges ===== -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">相对最优基线的平均提升（%，报告区间）</text>

  <!-- gridlines vertical: x = 250 + 5*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="375" y1="126" x2="375" y2="306"/>
    <line x1="500" y1="126" x2="500" y2="306"/>
    <line x1="625" y1="126" x2="625" y2="306"/>
    <line x1="720" y1="126" x2="720" y2="306"/>
  </g>

  <!-- Pass@1: 29.60-93.55 -> x 398 .. 717.75 -->
  <text x="238" y="152" font-size="12.5" fill="#1A1B1E" text-anchor="end">Pass@1</text>
  <rect x="398" y="138" width="319.75" height="18" fill="#D55E00"/>
  <line x1="398" y1="134" x2="398" y2="160" stroke="#D55E00" stroke-width="0.75"/>
  <line x1="717.75" y1="134" x2="717.75" y2="160" stroke="#D55E00" stroke-width="0.75"/>
  <text x="726" y="141" font-size="12" fill="#555">区间 29.60%~93.55%</text>

  <!-- AvgPassRatio: 27.95-79.12 -> x 389.75 .. 645.6 -->
  <text x="238" y="196" font-size="12.5" fill="#1A1B1E" text-anchor="end">AvgPassRatio</text>
  <rect x="389.75" y="182" width="255.85" height="18" fill="#0072B2"/>
  <line x1="389.75" y1="178" x2="389.75" y2="204" stroke="#0072B2" stroke-width="0.75"/>
  <line x1="645.6" y1="178" x2="645.6" y2="204" stroke="#0072B2" stroke-width="0.75"/>
  <text x="654" y="196" font-size="12" fill="#555">27.95%~79.12%</text>

  <!-- time reduction vs agent-based: 22.44-39.14 -> x 362.2 .. 445.7 -->
  <text x="238" y="240" font-size="12.5" fill="#1A1B1E" text-anchor="end">时间开销降低</text>
  <rect x="362.2" y="226" width="83.5" height="18" fill="#999999"/>
  <line x1="362.2" y1="222" x2="362.2" y2="248" stroke="#999999" stroke-width="0.75"/>
  <line x1="445.7" y1="222" x2="445.7" y2="248" stroke="#999999" stroke-width="0.75"/>
  <text x="454" y="240" font-size="12" fill="#555">22.44%~39.14%（相比 agent-based 基线）</text>

  <!-- token reduction: 9.69-46.89 -> x 298.45 .. 484.45 -->
  <text x="238" y="284" font-size="12.5" fill="#1A1B1E" text-anchor="end">token 开销降低</text>
  <rect x="298.45" y="270" width="186" height="18" fill="#999999"/>
  <line x1="298.45" y1="266" x2="298.45" y2="292" stroke="#999999" stroke-width="0.75"/>
  <line x1="484.45" y1="266" x2="484.45" y2="292" stroke="#999999" stroke-width="0.75"/>
  <text x="493" y="284" font-size="12" fill="#555">9.69%~46.89%（相比 agent-based 基线）</text>

  <!-- value axis -->
  <line x1="250" y1="306" x2="720" y2="306" stroke="#1A1B1E" stroke-width="0.75"/>
  <line x1="250" y1="126" x2="250" y2="306" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="250" y1="306" x2="250" y2="310"/>
    <line x1="717.75" y1="306" x2="717.75" y2="310"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="250" y="328">0</text>
    <text x="712" y="328">93.55</text>
  </g>
  <text x="485" y="352" font-size="14" fill="#1A1B1E" text-anchor="middle">平均提升 / 降低幅度（%）</text>
  <text x="250" y="380" font-size="12" fill="#555">四项提升均通过显著性检验，p &lt; 2.40×10⁻⁷；</text>
  <text x="250" y="398" font-size="12" fill="#555">不同模型、不同基准上收益方向一致</text>

  <!-- ===== panel b: ablation top-3 rules ===== -->
  <text x="800" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="822" y="104" font-size="15" fill="#1A1B1E">贡献最大的三条对齐规则（消融，%）</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="900" y1="126" x2="900" y2="270"/>
    <line x1="1000" y1="126" x2="1000" y2="270"/>
    <line x1="1100" y1="126" x2="1100" y2="270"/>
  </g>
  <!-- bars x = 850 + 10*v -->
  <text x="838" y="152" font-size="12.5" fill="#1A1B1E" text-anchor="end">示例说明</text>
  <rect x="850" y="138" width="144.8" height="18" fill="#D55E00"/>
  <text x="1003" y="152" font-size="12" fill="#555">+14.48%</text>

  <text x="838" y="196" font-size="12.5" fill="#1A1B1E" text-anchor="end">规格目的</text>
  <rect x="850" y="182" width="135.4" height="18" fill="#0072B2"/>
  <text x="994" y="196" font-size="12" fill="#555">+13.54%</text>

  <text x="838" y="240" font-size="12.5" fill="#1A1B1E" text-anchor="end">输出需求</text>
  <rect x="850" y="226" width="115.9" height="18" fill="#0072B2"/>
  <text x="974" y="240" font-size="12" fill="#555">+11.59%</text>

  <line x1="850" y1="270" x2="1100" y2="270" stroke="#1A1B1E" stroke-width="0.75"/>
  <line x1="850" y1="126" x2="850" y2="270" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="850" y1="270" x2="850" y2="274"/>
    <line x1="950" y1="270" x2="950" y2="274"/>
    <line x1="994.8" y1="270" x2="994.8" y2="274"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="850" y="292">0</text>
    <text x="950" y="292">10</text>
    <text x="994.8" y="292">14.48</text>
  </g>
  <text x="975" y="316" font-size="14" fill="#1A1B1E" text-anchor="middle">Pass@1 提升（%）</text>

  <!-- ===== panel c: best Pass@1 ===== -->
  <text x="60" y="452" font-size="15" font-weight="bold" fill="#1A1B1E">c</text>
  <text x="82" y="452" font-size="15" fill="#1A1B1E">Gemini-1.5-Flash + Specine 的最佳 Pass@1（%，APPS 数据集）</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="150" y1="470" x2="150" y2="570"/>
    <line x1="300" y1="470" x2="300" y2="570"/>
    <line x1="450" y1="470" x2="450" y2="570"/>
  </g>
  <!-- bar: y = 570 - 1.6*v ; 65.33 -> 465.47 -->
  <rect x="220" y="465.5" width="60" height="104.5" fill="#D55E00"/>
  <text x="250" y="458" font-size="12" fill="#555" text-anchor="middle">65.33%</text>
  <text x="250" y="588" font-size="12.5" fill="#1A1B1E" text-anchor="middle">Gemini-1.5-Flash</text>

  <line x1="150" y1="570" x2="450" y2="570" stroke="#1A1B1E" stroke-width="0.75"/>
  <line x1="150" y1="470" x2="150" y2="570" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="150" y1="570" x2="146" y2="570"/>
    <line x1="150" y1="470" x2="146" y2="470"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="140" y="574">0</text>
    <text x="140" y="469">65.33</text>
  </g>
  <text x="300" y="474" font-size="12" fill="#555">规格对齐对中等规模模型同样有效</text>
  <text x="300" y="510" font-size="12" fill="#555">实验设置：4 个 LLM × 5 个竞赛级编程基准，</text>
  <text x="300" y="528" font-size="12" fill="#555">对比 10 个基线；10 条预定义对齐规则</text>

  <!-- footnote -->
  <text x="60" y="640" font-size="11" fill="#767676">数据：arXiv:2509.01313（ICSE 2026，4 LLM × 5 基准 × 10 基线）· 区间为论文自测口径的报告范围 · 正式发表版本</text>
</svg>
