<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Arial, sans-serif">
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <text x="60" y="48" font-size="26" font-weight="bold" fill="#1A1B1E">验证工序位置：从投稿后评审，搬到出货单里</text>

  <!-- traditional chain -->
  <text x="60" y="106" font-size="18" font-weight="bold" fill="#555555">传统论文链路（验证在投稿后）</text>
  <g stroke="#555555" stroke-width="2" fill="#FFFFFF">
    <rect x="60"  y="126" width="180" height="56"/>
    <rect x="300" y="126" width="180" height="56"/>
    <rect x="540" y="126" width="180" height="56"/>
    <rect x="780" y="126" width="220" height="56"/>
  </g>
  <line x1="240" y1="154" x2="300" y2="154" stroke="#555555" stroke-width="2"/>
  <line x1="480" y1="154" x2="540" y2="154" stroke="#555555" stroke-width="2"/>
  <line x1="720" y1="154" x2="780" y2="154" stroke="#555555" stroke-width="2"/>
  <g font-size="16" fill="#1A1B1E" text-anchor="middle">
    <text x="150" y="160">投稿</text>
    <text x="390" y="160">同行评审</text>
    <text x="630" y="160">发表</text>
    <text x="890" y="160">社区复核（间隔以月计）</text>
  </g>
  <rect x="300" y="196" width="180" height="10" fill="#555555"/>
  <text x="300" y="228" font-size="14" fill="#555555">验证环节在评审内，作者外部</text>

  <!-- factory chain -->
  <text x="60" y="298" font-size="18" font-weight="bold" fill="#D55E00">数学工厂链路（验证在投稿前 / 随文交付）</text>
  <g stroke="#D55E00" stroke-width="2" fill="#FFFFFF">
    <rect x="60"  y="318" width="180" height="56"/>
    <rect x="300" y="318" width="220" height="56"/>
    <rect x="580" y="318" width="180" height="56"/>
    <rect x="820" y="318" width="220" height="56"/>
  </g>
  <line x1="240" y1="346" x2="300" y2="346" stroke="#D55E00" stroke-width="2"/>
  <line x1="520" y1="346" x2="580" y2="346" stroke="#D55E00" stroke-width="2"/>
  <line x1="760" y1="346" x2="820" y2="346" stroke="#D55E00" stroke-width="2"/>
  <g font-size="16" fill="#1A1B1E" text-anchor="middle">
    <text x="150" y="352">commit</text>
    <text x="410" y="352">随文 Lean 文件（出厂配置）</text>
    <text x="670" y="352">公开仓库</text>
    <text x="930" y="352">社区自跑检查器</text>
  </g>
  <rect x="300" y="388" width="220" height="10" fill="#D55E00"/>
  <text x="300" y="420" font-size="14" fill="#D55E00">验证由作者流水线内建；评审环节被抽掉，由检查器替代</text>

  <rect x="60" y="444" width="1080" height="40" fill="#D9D9D9"/>
  <text x="76" y="470" font-size="15" font-weight="bold" fill="#1A1B1E">外部复现工件计数（实测 2026-11-26 16:1x，复核 11-27 上午）：openai/math 外部复现 PR 0 · 第三方 9/4 下界复现报告 0 · mathlib 相关 PR 0</text>
</svg>
