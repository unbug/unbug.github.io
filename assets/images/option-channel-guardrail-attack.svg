<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#f7f8fa"/>
  <rect x="0" y="0" width="1200" height="86" fill="#1f2a44"/>
  <text x="48" y="40" fill="#ffffff" font-size="26" font-weight="bold">选项通道攻击：安全闸门比抛硬币更不可靠</text>
  <text x="48" y="68" fill="#aeb9d4" font-size="15">arXiv 2610.12292 · 七个开源权重模型审计 · 预印本（2026-10-08 提交，未经同行评审）</text>

  <rect x="48" y="114" width="340" height="330" rx="10" fill="#ffffff" stroke="#d8dee9"/>
  <text x="72" y="152" fill="#1f2a44" font-size="19" font-weight="bold">审计结论</text>
  <text x="72" y="188" fill="#4a5568" font-size="15">放行-拦截决策准确率</text>
  <rect x="72" y="204" width="272" height="46" rx="6" fill="#fde8e8"/>
  <text x="208" y="234" fill="#c0392b" font-size="24" font-weight="bold" text-anchor="middle">36% – 72%</text>
  <text x="72" y="282" fill="#4a5568" font-size="15">随机水平（抛硬币）</text>
  <rect x="72" y="298" width="272" height="40" rx="6" fill="#eef1f6"/>
  <text x="208" y="324" fill="#4a5568" font-size="21" font-weight="bold" text-anchor="middle">50%</text>
  <text x="72" y="372" fill="#718096" font-size="13">跨提示注入 / 越狱 / 有毒内容三类任务；</text>
  <text x="72" y="392" fill="#718096" font-size="13">有模型低于随机水平</text>

  <rect x="430" y="114" width="340" height="330" rx="10" fill="#ffffff" stroke="#d8dee9"/>
  <text x="454" y="152" fill="#1f2a44" font-size="19" font-weight="bold">两个攻击：不碰被审内容</text>
  <text x="454" y="190" fill="#4a5568" font-size="15">攻击一：六行无关服务器日志</text>
  <text x="454" y="216" fill="#718096" font-size="13">（该策略原本能判对的闸门）</text>
  <rect x="454" y="230" width="292" height="42" rx="6" fill="#fdf0e2"/>
  <text x="600" y="258" fill="#b7791f" font-size="20" font-weight="bold" text-anchor="middle">fail-open 0% → 63%</text>
  <text x="454" y="306" fill="#4a5568" font-size="15">攻击二：只改宽松选项的名字</text>
  <text x="454" y="332" fill="#718096" font-size="13">（选项定义与被判文本均不动）</text>
  <rect x="454" y="346" width="292" height="42" rx="6" fill="#fde8e8"/>
  <text x="600" y="374" fill="#c0392b" font-size="20" font-weight="bold" text-anchor="middle">93% – 100% · 四个模型</text>
  <text x="454" y="420" fill="#718096" font-size="13">仅限把标签放进模型输入的四个模型</text>

  <rect x="812" y="114" width="340" height="330" rx="10" fill="#ffffff" stroke="#d8dee9"/>
  <text x="836" y="152" fill="#1f2a44" font-size="19" font-weight="bold">防御：全部失守，除一条</text>
  <text x="836" y="190" fill="#4a5568" font-size="15">被测防御全部被破解</text>
  <text x="836" y="214" fill="#718096" font-size="13">置信度升级人工复核也无效：</text>
  <text x="836" y="234" fill="#718096" font-size="13">被翻转的决策置信度并不更低</text>
  <rect x="836" y="256" width="292" height="88" rx="6" fill="#e6f4ea"/>
  <text x="850" y="286" fill="#1e7d43" font-size="15" font-weight="bold">字段类型化 + 确定性规则</text>
  <text x="850" y="312" fill="#1e7d43" font-size="22" font-weight="bold">六条策略 100%</text>
  <text x="850" y="334" fill="#1e7d43" font-size="12">消除选项名攻击</text>
  <text x="836" y="384" fill="#b7791f" font-size="14" font-weight="bold">反转：规则能判 → 这条通道上</text>
  <text x="836" y="406" fill="#b7791f" font-size="14" font-weight="bold">模型变得不必要</text>

  <rect x="48" y="470" width="1104" height="66" rx="10" fill="#fff8e1" stroke="#e6c97a"/>
  <text x="72" y="498" fill="#8a6d1a" font-size="14" font-weight="bold">边界</text>
  <text x="128" y="498" fill="#6b5b23" font-size="14">合成套件为作者自建，非工业真实流量；确定性规则的 100% 限于字段可类型化解析的六条策略；</text>
  <text x="128" y="522" fill="#6b5b23" font-size="14">数字待独立复现。作者口径：这类模型可减少送人工复核的量，但不应做最终决定的那个组件。</text>

  <text x="48" y="586" fill="#a0aec0" font-size="13">一分钟读论文 · 2026-10 · 数字口径：论文 abs 与 HTML 全文逐字核验（2026-10-11）</text>
</svg>
