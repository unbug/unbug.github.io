<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9C9484; }
      .rl { font-size: 15px; fill: #474C54; }
      .val { font-size: 18px; font-weight: 700; fill: #1A1B1E; }
      .b { font-size: 12px; fill: #A5A296; }
      .chip { font-size: 12.5px; font-weight: 600; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4F1EB"/>
    </linearGradient>
    <linearGradient id="gVermil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C2491D"/><stop offset="1" stop-color="#E37C45"/>
    </linearGradient>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31456E"/><stop offset="1" stop-color="#5F79A8"/>
    </linearGradient>
    <linearGradient id="gMalach" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E7D6B"/><stop offset="1" stop-color="#68B39D"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8860B"/><stop offset="1" stop-color="#DCB24A"/>
    </linearGradient>
    <linearGradient id="gRose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A34A78"/><stop offset="1" stop-color="#C98AAE"/>
    </linearGradient>
    <radialGradient id="gHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#DCB24A" stop-opacity="0.55"/><stop offset="1" stop-color="#DCB24A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1100" cy="120" r="150" fill="#2E7D6B" opacity="0.06"/>
  <circle cx="80" cy="630" r="110" fill="#C2491D" opacity="0.05"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gVermil)"/>

  <text class="k" x="64" y="84">一分钟读论文 · ARXIV:2608.06375 · NTU / 北大 / BAAI 等</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">预测未来，而非生成视频</text>
  <text x="64" y="158" font-size="15" fill="#5B6068">w-0 把未来视觉预测当作紧凑潜信号，与全身动作联合建模，服务并发运动操作</text>

  <!-- observatory motif: telescope sighting a predicted future -->
  <g>
    <circle cx="1072" cy="118" r="52" fill="url(#gHalo)"/>
    <circle cx="1072" cy="118" r="7" fill="#DCB24A"/>
    <circle cx="1072" cy="118" r="14" fill="none" stroke="#B8860B" stroke-width="2" opacity="0.7"/>
    <path d="M 985 72 L 1055 108" stroke="url(#gIndigo)" stroke-width="13" stroke-linecap="round"/>
    <path d="M 979 66 L 995 58 L 1003 74 L 987 82 Z" fill="#31456E"/>
    <rect x="968" y="118" width="14" height="46" rx="4" fill="#5F79A8"/>
    <path d="M 940 172 L 1010 172 L 996 186 L 954 186 Z" fill="#31456E"/>
    <path d="M 975 116 L 948 168" stroke="#474C54" stroke-width="4" stroke-linecap="round"/>
    <path d="M 975 116 L 1002 168" stroke="#474C54" stroke-width="4" stroke-linecap="round"/>
    <text x="1072" y="196" text-anchor="middle" class="chip" fill="#8A6612">未来嵌入（观测目标）</text>
    <text x="982" y="200" text-anchor="middle" class="chip" fill="#31456E">当前观测</text>
  </g>

  <!-- slope: baseline -> w-0 -->
  <g>
    <rect x="64" y="200" width="740" height="40" fill="#31456E" opacity="0.07"/>
    <rect x="64" y="252" width="740" height="40" fill="#C2491D" opacity="0.07"/>
    <text class="rl" x="250" y="226" text-anchor="end">9 种基线方法</text>
    <text class="rl" x="250" y="278" text-anchor="end">w-0</text>
    <line x1="330" y1="220" x2="800" y2="272" stroke="#9A937F" stroke-width="2.5"/>
    <circle cx="330" cy="220" r="8" fill="#FBFAF7" stroke="#5F79A8" stroke-width="3"/>
    <circle cx="800" cy="272" r="9" fill="url(#gVermil)"/>
    <text class="val" x="352" y="212" fill="#5F79A8">持续落后</text>
    <text class="serif" x="812" y="279" font-size="26" font-weight="700" fill="#C2491D">11 / 11</text>
    <text x="886" y="279" font-size="15" fill="#474C54">全部家庭任务占优</text>
    <text class="b" x="330" y="316">11 个真实家庭任务 · 单一多任务模型 · 每方法每任务 10 次独立试验</text>
  </g>

  <!-- right column: dataset anchor -->
  <g>
    <rect x="856" y="224" width="284" height="88" rx="12" fill="#B8860B" opacity="0.1"/>
    <text class="serif" x="876" y="272" font-size="30" font-weight="700" fill="#8A6612">40+ 小时</text>
    <text x="876" y="296" font-size="12.5" fill="#6B7078">w-HOME 数据集 · 目前最大规模人形家庭操作</text>

    <rect x="856" y="330" width="284" height="40" rx="8" fill="#A34A78" opacity="0.1"/>
    <text x="872" y="355" font-size="13.5" fill="#7D3560">Omni-View 变体 · 拖地等运动密集任务优势明显</text>
  </g>

  <!-- bottom: three-stage training pipeline -->
  <line x1="64" y1="406" x2="1136" y2="406" stroke="#E8E3D2"/>
  <g>
    <rect x="64" y="432" width="112" height="30" rx="15" fill="url(#gIndigo)" opacity="0.22"/>
    <text x="120" y="452" text-anchor="middle" class="chip" fill="#26365A">阶段一 VLM 学动作</text>
    <text x="186" y="452" fill="#8B8574" font-size="14">→</text>
    <rect x="202" y="432" width="122" height="30" rx="15" fill="url(#gMalach)" opacity="0.24"/>
    <text x="263" y="452" text-anchor="middle" class="chip" fill="#20604F">阶段二 预测未来嵌入</text>
    <text x="334" y="452" fill="#8B8574" font-size="14">→</text>
    <rect x="350" y="432" width="112" height="30" rx="15" fill="url(#gVermil)" opacity="0.22"/>
    <text x="406" y="452" text-anchor="middle" class="chip" fill="#8F3413">阶段三 真实演示微调</text>

    <text class="b" x="64" y="490">离散全身动作词汇表 + Qwen3-VL-2B</text>
    <text class="b" x="202" y="490">V-JEPA 式预测 · SONIC 仿真回放转移动作监督</text>
    <text class="b" x="350" y="508" fill="transparent">.</text>
    <text class="b" x="350" y="490">w-HOME · 同视角/外视角 RGB-D</text>
  </g>

  <!-- three challenge->answer chips -->
  <g>
    <rect x="64" y="524" width="1072" height="36" fill="#31456E" opacity="0.06"/>
    <text x="84" y="547" font-size="13.5" fill="#474C54">痛点一：VLA 以手臂为中心，底盘与手臂割裂</text>
    <text x="560" y="547" font-size="13.5" fill="#474C54">痛点二：视频预测的时间不一致被放大为不稳定运动</text>
  </g>

  <text class="serif" x="64" y="602" font-size="18" fill="#1A1B1E">把未来当作潜变量来「观测」，下肢、躯干、手臂和手才可能在移动中持续相互适应。</text>
  <text class="b" x="1136" y="628" text-anchor="end">G1 机器人自测 · 跨平台泛化与安全约束未验证 · Micropaper</text>
</svg>
