<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9C9484; }
      .rl { font-size: 15px; fill: #474C54; }
      .b { font-size: 12px; fill: #A5A296; }
      .chip { font-size: 12.5px; font-weight: 600; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F0E7"/>
    </linearGradient>
    <linearGradient id="gVermil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5442E"/><stop offset="1" stop-color="#E37C45"/>
    </linearGradient>
    <linearGradient id="gTerracotta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5651D"/><stop offset="1" stop-color="#E0A060"/>
    </linearGradient>
    <linearGradient id="gLapis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E6FA3"/><stop offset="1" stop-color="#6FA3CC"/>
    </linearGradient>
    <linearGradient id="gMalachite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F7D4F"/><stop offset="1" stop-color="#71B389"/>
    </linearGradient>
    <linearGradient id="gOchre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A97E12"/><stop offset="1" stop-color="#DCB24A"/>
    </linearGradient>
    <linearGradient id="gPlum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6A3B7E"/><stop offset="1" stop-color="#A276B5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1092" cy="120" r="150" fill="#B5651D" opacity="0.05"/>
  <circle cx="70" cy="640" r="105" fill="#2E6FA3" opacity="0.05"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gVermil)"/>

  <text class="k" x="64" y="84">一分钟读论文 · ARXIV:2608.16630 · 编码 agent 的工作集</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">缺哪块陶片，补哪块</text>
  <text x="64" y="158" font-size="15" fill="#5B6068">Coherence Debt：失败不在智力，而在写代码那一刻依赖的事实不在场——缺一个事实，恰好损失它支撑的工作</text>

  <!-- excavation motif: pot with missing shards -->
  <g>
    <path d="M 940 130 q -12 92 20 148 q 50 30 100 0 q 32 -56 20 -148 q -30 18 -70 18 q -40 0 -70 -18 Z" fill="url(#gTerracotta)" opacity="0.85"/>
    <path d="M 978 176 l 30 -14 l 26 20 l -8 34 l -34 6 Z" fill="#F3F0E7"/>
    <path d="M 1040 230 l 34 -8 l 12 28 l -28 18 Z" fill="#F3F0E7"/>
    <rect x="1052" y="150" width="46" height="34" rx="5" fill="url(#gLapis)"/>
    <text x="1075" y="172" text-anchor="middle" class="chip" fill="#FFFFFF">事实</text>
    <text x="1075" y="140" text-anchor="middle" class="b">补片进 prompt 即复原</text>
    <path d="M 1035 190 l 26 10" stroke="#2E6FA3" stroke-width="2.5" fill="none"/>
    <text x="1010" y="330" text-anchor="middle" class="chip" fill="#8A4A12">缺失处：agent 不报卡住，直接捏一块新陶片</text>
  </g>

  <!-- availability flip strip -->
  <g>
    <rect x="64" y="196" width="780" height="78" fill="#2E6FA3" opacity="0.07"/>
    <text class="serif" x="88" y="230" font-size="17" font-weight="700" fill="#474C54">闭卷 vs 把事实放进 prompt（距离无关的可用性翻转）</text>
    <text class="serif" x="88" y="262" font-size="25" font-weight="700" fill="#B5442E">154 试 · 0/12</text>
    <text class="serif" x="300" y="262" font-size="25" font-weight="700" fill="#2F7D4F">300 试 · 299 次 ≥9/12</text>
    <text class="b" x="820" y="261" text-anchor="end">补片中 213 次全对 · 闭卷仅限人工任务</text>
  </g>

  <!-- linear fault-injection bars -->
  <g>
    <text class="rl" x="64" y="318" font-weight="600">故障注入：隐藏事实数 → 通过测试数（每档 n=6）· 严格线性，偏差为零</text>

    <rect x="64" y="334" width="168" height="118" fill="#2F7D4F" opacity="0.08"/>
    <rect x="244" y="334" width="168" height="118" fill="#2E6FA3" opacity="0.08"/>
    <rect x="424" y="334" width="168" height="118" fill="#A97E12" opacity="0.09"/>
    <rect x="604" y="334" width="168" height="118" fill="#B5651D" opacity="0.09"/>
    <rect x="784" y="334" width="168" height="118" fill="#B5442E" opacity="0.08"/>

    <text class="serif" x="148" y="392" font-size="28" font-weight="700" fill="#2F7D4F" text-anchor="middle">32.0</text>
    <text class="serif" x="328" y="392" font-size="28" font-weight="700" fill="#2E6FA3" text-anchor="middle">24.0</text>
    <text class="serif" x="508" y="392" font-size="28" font-weight="700" fill="#8A6612" text-anchor="middle">16.7</text>
    <text class="serif" x="688" y="392" font-size="28" font-weight="700" fill="#B5651D" text-anchor="middle">8.0</text>
    <text class="serif" x="868" y="392" font-size="28" font-weight="700" fill="#B5442E" text-anchor="middle">0.0</text>

    <text class="chip" x="148" y="436" text-anchor="middle" fill="#2F7D4F">隐藏 0 个</text>
    <text class="chip" x="328" y="436" text-anchor="middle" fill="#2E6FA3">隐藏 2 个</text>
    <text class="chip" x="508" y="436" text-anchor="middle" fill="#8A6612">隐藏 4 个</text>
    <text class="chip" x="688" y="436" text-anchor="middle" fill="#B5651D">隐藏 6 个</text>
    <text class="chip" x="868" y="436" text-anchor="middle" fill="#B5442E">隐藏 8 个</text>
    <text class="b" x="1072" y="404" text-anchor="middle">损伤不级联：</text>
    <text class="b" x="1072" y="424" text-anchor="middle">线性预测 32/24/16/8/0</text>
  </g>

  <!-- seven models same place -->
  <g>
    <text class="rl" x="64" y="496" font-weight="600">七个模型家族记错了同一个地方（重命名 API 压制参数化记忆）</text>

    <rect x="64" y="508" width="520" height="72" fill="#6A3B7E" opacity="0.07"/>
    <text class="serif" x="88" y="540" font-size="22" font-weight="700" fill="#6A3B7E">70 试中 66 次同分</text>
    <text x="88" y="566" font-size="13" fill="#5B6068">通过完全相同的 24/79 个测试 · Jaccard 1.000</text>
    <text class="b" x="568" y="566" text-anchor="end">Sonnet·Haiku·Codex 等 7 族</text>

    <rect x="612" y="508" width="524" height="72" fill="#B5651D" opacity="0.08"/>
    <text class="serif" x="636" y="540" font-size="22" font-weight="700" fill="#8A4A12">最便宜 5 次调用 · 最贵 79 次</text>
    <text x="636" y="566" font-size="13" fill="#5B6068">输入 293,882 → 3,752,134 tokens（12.8 倍）</text>
    <text class="b" x="1120" y="566" text-anchor="end">差的是重建速率，不是能力</text>
  </g>

  <!-- fabrication chip row -->
  <g>
    <rect x="64" y="594" width="1072" height="26" fill="#2E6FA3" opacity="0.06"/>
    <text class="chip" x="88" y="612" fill="#2E6FA3">报卡住：Opus 8/8=100% → GPT-5 / GLM-5.2 为 0</text>
    <text class="chip" x="470" y="612" fill="#B5442E">Haiku 直接创建缺失文件 3/8</text>
    <text class="b" x="1120" y="612" text-anchor="end">过期规范比没有规范更糟：39 试全跟随文档</text>
  </g>

  <text class="b" x="1136" y="652" text-anchor="end">行为属性非安全结论 · token 数≠成本 · SWE-bench 397 例 AUC≈0.49 为负结果 · Micropaper</text>
</svg>
