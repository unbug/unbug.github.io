<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">2026 年 4 件 AI 内容审核专利中，2 件落在近 90 天；4 件全部指向流式、按块审核</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">四件已公开申请按公开先后序位排列（事件序位轴）</text>

  <!-- gridlines -->

  <!-- x = 300 + monthsSince202601 * 80 -->
  <text x="288" y="153" font-size="12.5" fill="#1A1B1E" text-anchor="end">Microsoft</text>
  <circle cx="327" cy="149" r="7" fill="#999999"/>
  <text x="342" y="153" font-size="12" fill="#555">2026-02-26 公开 · 嵌入检索降低审核成本（US20260057218A1）</text>

  <text x="288" y="208" font-size="12.5" fill="#1A1B1E" text-anchor="end">NVIDIA</text>
  <circle cx="533" cy="204" r="7" fill="#999999"/>
  <text x="548" y="208" font-size="12" fill="#555">2026-04-09 公开 · 模型集成自动生成安全类别（US20260099707A1）</text>

  <text x="288" y="263" font-size="12.5" fill="#1A1B1E" text-anchor="end">Amazon</text>
  <circle cx="680" cy="259" r="7" fill="#D55E00"/>
  <text x="695" y="263" font-size="12" fill="#555">2026-05-28 公开 · 逐块审核，通过才发给用户（US20260148010A1）</text>

  <text x="288" y="318" font-size="12.5" fill="#1A1B1E" text-anchor="end">Intuit</text>
  <circle cx="747" cy="314" r="7" fill="#D55E00"/>
  <text x="762" y="318" font-size="12" fill="#555">2026-06-25 公开 · 自适应窗口切分递归细分（US20260178727A1）</text>

  <!-- order axis -->
  <line x1="300" y1="149" x2="300" y2="360" stroke="#1A1B1E" stroke-width="0.75"/>
  <line x1="300" y1="360" x2="1000" y2="360" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="327" y1="360" x2="327" y2="364"/>
    <line x1="533" y1="360" x2="533" y2="364"/>
    <line x1="680" y1="360" x2="680" y2="364"/>
    <line x1="747" y1="360" x2="747" y2="364"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="327" y="380">1</text>
    <text x="533" y="380">2</text>
    <text x="680" y="380">3</text>
    <text x="747" y="380">4</text>
  </g>
  <text x="537" y="404" font-size="14" fill="#1A1B1E" text-anchor="middle">公开先后序位</text>
  <g font-size="12" fill="#555">
    <circle cx="308" cy="424" r="6" fill="#D55E00"/>
    <text x="321" y="428">近 90 天公开（Amazon、Intuit）</text>
    <circle cx="540" cy="424" r="6" fill="#999999"/>
    <text x="553" y="428">同主题 2026 年内公开</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="60" y="474" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="474" font-size="15" fill="#1A1B1E">个人开发者方案参数（正文直标值，不作跨方案刻度对比）</text>

  <g font-size="12.5" fill="#1A1B1E">
    <text x="60" y="516">SSE 缓冲块大小（token）</text>
    <text x="440" y="516">MVP 工期（周，1 人）</text>
    <text x="800" y="516">月成本上限（元）</text>
  </g>
  <rect x="60" y="528" width="240" height="18" fill="#0072B2"/>
  <text x="180" y="542" font-size="12" fill="#FFFFFF" text-anchor="middle">128–512</text>
  <rect x="440" y="528" width="120" height="18" fill="#009E73"/>
  <text x="500" y="542" font-size="12" fill="#FFFFFF" text-anchor="middle">4</text>
  <rect x="800" y="528" width="120" height="18" fill="#D55E00"/>
  <text x="860" y="542" font-size="12" fill="#FFFFFF" text-anchor="middle">千元内（自估）</text>
  <text x="60" y="584" font-size="12" fill="#555">方案形态：OpenAI 兼容流式代理，开源小分类器初筛，命中阈值的块升级大模型复核；订阅定价 20–50 美元/月（自估口径）</text>

  <!-- footnote -->
  <text x="60" y="640" font-size="11" fill="#767676">数据：四件美国申请公开信息（公开不等于授权，正文所引 Free Patents Online 检索）· 缓冲区间取自正文方案描述 · 成本与定价为作者自估口径</text>
</svg>
