<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="76" font-size="16" fill="#1A1B1E">洗车问题六条件实验中裸提示正确率为 0%，加入 STAR 结构化推理框架后升至 85%</text>

  <!-- ============ panel a: accuracy ladder ============ -->
  <text x="60" y="130" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="130" font-size="15" fill="#1A1B1E">六种提示条件的正确率（%，每条件 20 次试验）</text>

  <!-- value axis: x = 300 + 7*v; vertical grid at labeled values only -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="510" y1="150" x2="510" y2="462"/>
    <line x1="895" y1="150" x2="895" y2="462"/>
    <line x1="965" y1="150" x2="965" y2="462"/>
    <line x1="1000" y1="150" x2="1000" y2="462"/>
  </g>

  <!-- rows: y = 162 + 56*i -->
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="288" y="179">裸提示</text>
    <text x="288" y="235">上下文注入</text>
    <text x="288" y="291">STAR 框架</text>
    <text x="288" y="347">STAR + 用户画像</text>
    <text x="288" y="403">STAR + 画像 + RAG</text>
  </g>

  <!-- bare: 0% -->
  <text x="308" y="179" font-size="12" fill="#555">0%</text>

  <!-- context: 30% -->
  <rect x="300" y="218" width="210" height="20" fill="#999999"/>
  <text x="518" y="235" font-size="12" fill="#555">30%</text>

  <!-- STAR: 85% (protagonist) -->
  <rect x="300" y="274" width="595" height="20" fill="#0072B2"/>
  <text x="903" y="291" font-size="12" fill="#555">85%</text>

  <!-- STAR + persona: 95% -->
  <rect x="300" y="330" width="665" height="20" fill="#0072B2" opacity="0.35"/>
  <text x="973" y="347" font-size="12" fill="#555">95%</text>

  <!-- STAR + persona + RAG: 100% -->
  <rect x="300" y="386" width="700" height="20" fill="#0072B2" opacity="0.35"/>
  <text x="1008" y="403" font-size="12" fill="#555">100%</text>

  <!-- x axis -->
  <line x1="300" y1="462" x2="1000" y2="462" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="462" x2="300" y2="466"/>
    <line x1="510" y1="462" x2="510" y2="466"/>
    <line x1="895" y1="462" x2="895" y2="466"/>
    <line x1="965" y1="462" x2="965" y2="466"/>
    <line x1="1000" y1="462" x2="1000" y2="466"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E">
    <text x="292" y="484" text-anchor="end">0</text>
    <text x="510" y="484" text-anchor="middle">30</text>
    <text x="895" y="484" text-anchor="middle">85</text>
    <text x="965" y="484" text-anchor="middle">95</text>
    <text x="1000" y="484" text-anchor="start">100</text>
  </g>
  <text x="650" y="510" font-size="14" fill="#1A1B1E" text-anchor="middle">正确率（%）</text>

  <!-- ============ panel b: statistical contrast ============ -->
  <text x="60" y="556" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="556" font-size="15" fill="#1A1B1E">STAR 相对裸提示的统计量</text>

  <text x="330" y="556" font-size="13.5" fill="#1A1B1E">Fisher 精确检验 p=0.001 · 优势比 13.22 · 结构化推理效果约为上下文注入的 2.83 倍</text>

  <!-- footnote -->
  <text x="60" y="600" font-size="11" fill="#767676">数据：arXiv:2602.21814（独立研究者 Heejin Jo，6 条件 × 20 次 = 120 次试验，temperature 0.7、top_p 1.0，论文自测口径）· 预印本未经同行评审</text>
</svg>
