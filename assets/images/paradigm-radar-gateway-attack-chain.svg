<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Helvetica Neue, Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1200" height="600" fill="#FFFFFF"/>
  <text x="70" y="52" font-size="25" font-weight="700" fill="#1F2937">LiteLLM 投毒事故全链：token 不是从机器上偷的，是从日志里读的</text>
  <text x="70" y="80" font-size="15.5" fill="#6B7280">官方定责口径（detente18 = LiteLLM 创始人 Krrish，评论 50189921 / 50189993）；issue #47826 现状态 closed（34 条）</text>

  <g font-size="14.5" text-anchor="middle">
    <rect x="40" y="120" width="220" height="120" rx="12" fill="#F3F4F6" stroke="#1F2937" stroke-width="2"/>
    <text x="150" y="152" font-weight="bold" fill="#1F2937">① 会话现场</text>
    <text x="150" y="180" fill="#374151">Claude Code 工具调用</text>
    <text x="150" y="204" fill="#374151">本地 GitHub CLI OAuth token</text>
    <text x="150" y="226" fill="#374151">随请求体进出</text>

    <rect x="310" y="120" width="220" height="120" rx="12" fill="#FDECEA" stroke="#C0392B" stroke-width="2.5"/>
    <text x="420" y="152" font-weight="bold" fill="#C0392B">② 网关日志 = 藏宝图</text>
    <text x="420" y="180" fill="#7B241C">request/response 全量落日志</text>
    <text x="420" y="204" fill="#7B241C">官方原话：token written into</text>
    <text x="420" y="226" fill="#7B241C">logs — “not the machine”</text>

    <rect x="580" y="120" width="220" height="120" rx="12" fill="#FDECEA" stroke="#C0392B" stroke-width="2.5"/>
    <text x="690" y="152" font-weight="bold" fill="#C0392B">③ 高仿入口</text>
    <text x="690" y="180" fill="#7B241C">Berri-AI/litellm</text>
    <text x="690" y="204" fill="#7B241C">连字符挪一位的 lookalike 仓库</text>
    <text x="690" y="226" fill="#7B241C">恶意构建 1.107.0</text>

    <rect x="850" y="120" width="310" height="120" rx="12" fill="#FDECEA" stroke="#C0392B" stroke-width="2.5"/>
    <text x="1005" y="152" font-weight="bold" fill="#C0392B">④ 驻留机制</text>
    <text x="1005" y="180" fill="#7B241C">cook.pth + sitecustomize</text>
    <text x="1005" y="204" fill="#7B241C">解释器启动即执行</text>
    <text x="1005" y="226" fill="#7B241C">import 前已沦陷</text>
  </g>
  <g stroke="#C0392B" stroke-width="2.5" fill="none" marker-end="url(#gR)">
    <line x1="260" y1="180" x2="310" y2="180"/><line x1="530" y1="180" x2="580" y2="180"/><line x1="800" y1="180" x2="850" y2="180"/>
  </g>

  <rect x="40" y="290" width="545" height="170" rx="12" fill="#F8FAFC" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="65" y="322" font-size="17" font-weight="bold" fill="#1F2937">⑤ 撤包时间线（UTC）</text>
  <line x1="70" y1="380" x2="555" y2="380" stroke="#1F2937" stroke-width="2"/>
  <circle cx="150" cy="380" r="6" fill="#1F2937"/><text x="150" y="410" font-size="14" fill="#374151" text-anchor="middle">恶意构建上架</text>
  <circle cx="330" cy="380" r="6" fill="#C0392B"/><text x="330" y="410" font-size="14" fill="#C0392B" text-anchor="middle">13:23Z PyPI 撤包</text>
  <circle cx="520" cy="380" r="6" fill="#C0392B"/><text x="520" y="410" font-size="14" fill="#C0392B" text-anchor="middle">17:13Z Docker latest 改指</text>
  <text x="65" y="446" font-size="14.5" fill="#7B241C">两通道之间滞后 4 小时：镜像通道是本次事故的独立缺口（pull latest 者全程带毒）</text>

  <rect x="615" y="290" width="545" height="170" rx="12" fill="#EAF2FB" stroke="#2F6FB2" stroke-width="2"/>
  <text x="640" y="322" font-size="17" font-weight="bold" fill="#1E3A5F">⑥ 结构性教训（本期主张）</text>
  <text x="640" y="354" font-size="15" fill="#1E3A5F">网关日志聚合了「用户全部上下文 + 工具全量凭证」，</text>
  <text x="640" y="380" font-size="15" fill="#1E3A5F">是 agent 基础设施里单点价值最高的一份文件；</text>
  <text x="640" y="412" font-size="15" fill="#1E3A5F">护栏模型（路线 A 右栏）防的是内容越界，</text>
  <text x="640" y="438" font-size="15" fill="#1E3A5F">防不了「日志本身成为攻击面」——这是网关时代的分工空白。</text>
  <defs><marker id="gR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#C0392B"/></marker></defs>
</svg>
