<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="620" fill="#fbfbfd"/>
  <text x="430" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a2e">SKILL.md：一个 Markdown 文件的跨厂商扩散</text>
  <text x="430" y="62" text-anchor="middle" font-size="13" fill="#666">Agent 能力分发层接口定型中 · 注册表 / 评估 / 供应链安全仍是空白（数据截至 2026-09-16）</text>

  <!-- 中心文件 -->
  <rect x="345" y="92" width="170" height="76" rx="10" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text x="430" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#3730a3">SKILL.md</text>
  <text x="430" y="148" text-anchor="middle" font-size="11.5" fill="#666">规范仓库 25,385 星</text>

  <!-- 三阵营 -->
  <rect x="60" y="210" width="220" height="96" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="170" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">发起方</text>
  <text x="170" y="262" text-anchor="middle" font-size="12" fill="#444">Anthropic（Claude Code）</text>
  <text x="170" y="284" text-anchor="middle" font-size="12" fill="#444">母仓库 176,551 星</text>

  <rect x="320" y="210" width="220" height="96" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="430" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">跟进阵营</text>
  <text x="430" y="262" text-anchor="middle" font-size="12" fill="#444">OpenAI Codex · Gemini CLI</text>
  <text x="430" y="284" text-anchor="middle" font-size="12" fill="#444">Copilot · VS Code</text>

  <rect x="580" y="210" width="220" height="96" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="690" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">生态面</text>
  <text x="690" y="262" text-anchor="middle" font-size="12" fill="#444">官方列表 46 款客户端</text>
  <text x="690" y="284" text-anchor="middle" font-size="12" fill="#444">topic 仓库约 23,486 · 收录 5,400+</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="390" y1="170" x2="220" y2="206" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="430" y1="170" x2="430" y2="206" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="470" y1="170" x2="640" y2="206" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 与 MCP 对比 -->
  <rect x="40" y="336" width="380" height="120" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="364" font-size="14" font-weight="700" fill="#334155">与 MCP 扩散路径的差别</text>
  <text x="60" y="390" font-size="12" fill="#444">MCP：协议（服务器/握手/运行时）· 近两年铺开</text>
  <text x="60" y="412" font-size="12" fill="#444">SKILL.md：纯文件格式 · 认目录+frontmatter 即可</text>
  <text x="60" y="438" font-size="12" fill="#c2410c">采纳成本低一个量级 → 跟进快、对抗少</text>

  <!-- 痛点 -->
  <rect x="440" y="336" width="380" height="120" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="460" y="364" font-size="14" font-weight="700" fill="#991b1b">社区热度（HN 实测）</text>
  <text x="460" y="390" font-size="12" fill="#444">skills 文件怎么管：320 分（团队分发痛点）</text>
  <text x="460" y="412" font-size="12" fill="#444">I-have-ADHD 单技能：540 分（md 即传播单元）</text>
  <text x="460" y="438" font-size="12" fill="#666">对照：MCP 生产采用帖仅 198 分，接入层退潮</text>

  <!-- 空白 -->
  <rect x="40" y="476" width="780" height="90" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="60" y="504" font-size="14" font-weight="700" fill="#92400e">空白与反方</text>
  <text x="60" y="530" font-size="12" fill="#444">注册表 / 签名 / 安全审查：规范仓库窗口期内未发现相关提交（证据缺失型论断）· 46 款为自愿填报 showcase，无一致性测试</text>
  <text x="60" y="552" font-size="12" fill="#444">反方：skills 会被模型能力吃掉 · 支持不等于等价 · 悲观读法是「早期 npm 没有 audit 的时刻」</text>

  <!-- 边界 -->
  <rect x="40" y="580" width="780" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="430" y="600" text-anchor="middle" font-size="11.5" fill="#64748b">边界：验证只到官方列表收录层，未做逐端行为对比 · 厂商采纳一个 release 可撤回 · 中文撞题未经搜索引擎实测排除</text>
</svg>
