<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #7E93A0; }
      .rl { font-size: 14.5px; fill: #3E5560; }
      .b { font-size: 12px; fill: #8FA2AC; }
      .stat { font-size: 30px; font-weight: 700; fill: #17303B; }
      .unit { font-size: 14px; fill: #5F7683; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EFF4F6"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F6F78"/><stop offset="1" stop-color="#4FA3AC"/>
    </linearGradient>
    <linearGradient id="gBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0C24E" stop-opacity="0.55"/><stop offset="1" stop-color="#F0C24E" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="gCoral" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2725B"/><stop offset="1" stop-color="#F0A08C"/>
    </linearGradient>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A6BB0"/><stop offset="1" stop-color="#A79BD6"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6FA86F"/><stop offset="1" stop-color="#9CC98F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1130" cy="620" r="140" fill="#1F6F78" opacity="0.06"/>
  <circle cx="80" cy="110" r="110" fill="#F0C24E" opacity="0.08"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gTeal)"/>

  <text class="k" x="64" y="84">AI 范式雷达 · 2026-09-16 · SKILL.MD</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#17303B">一座灯塔照四十六港</text>
  <text x="64" y="158" font-size="15" fill="#5F7683">写一个 SKILL.md 全端通吃，灯塔下却没有海事局</text>

  <!-- lighthouse motif with beams to client dots -->
  <g>
    <path d="M 1052 196 l -34 -108 l 88 0 l -34 108 z" fill="#F2F6F7" stroke="#2C4A57" stroke-width="3"/>
    <rect x="1006" y="196" width="92" height="14" rx="4" fill="#2C4A57"/>
    <rect x="1018" y="118" width="68" height="20" fill="#E2725B"/>
    <rect x="1024" y="150" width="56" height="16" fill="#E2725B"/>
    <rect x="1036" y="86" width="32" height="30" rx="5" fill="#F0C24E"/>
    <path d="M 1052 66 l 8 14 h -16 z" fill="#2C4A57"/>
    <path d="M 1036 101 L 900 62 L 900 140 Z" fill="url(#gBeam)"/>
    <path d="M 1068 101 L 1204 62 L 1204 140 Z" fill="url(#gBeam)"/>
    <circle cx="906" cy="100" r="8" fill="#4FA3AC"/>
    <circle cx="1198" cy="100" r="8" fill="#7A6BB0"/>
    <circle cx="1052" cy="232" r="7" fill="#6FA86F"/>
    <path d="M 986 232 q 66 22 132 0" stroke="#4FA3AC" stroke-width="2.5" fill="none" stroke-dasharray="4 5"/>
    <text class="b" x="1052" y="262" text-anchor="middle">46 款客户端自愿填报</text>
  </g>

  <!-- big anchor number -->
  <g>
    <text class="stat" x="64" y="250">46 <tspan font-size="15" fill="#5F7683">款官方客户端 · OpenAI / Google / 微软全在列</tspan></text>
    <text class="b" x="64" y="276">从 Anthropic 私有扩展，到跨厂商事实标准（均截至 2026-09-16 实测）</text>
  </g>

  <!-- bars: 1 star = 0.00448 px, x0=300 -->
  <g>
    <rect x="300" y="306" width="790" height="40" rx="9" fill="#1F6F78" opacity="0.07"/>
    <rect x="300" y="352" width="790" height="40" rx="9" fill="#E2725B" opacity="0.07"/>
    <rect x="300" y="398" width="790" height="40" rx="9" fill="#F0C24E" opacity="0.09"/>
    <rect x="300" y="444" width="790" height="40" rx="9" fill="#7A6BB0" opacity="0.07"/>

    <text class="rl" x="284" y="331" text-anchor="end">anthropics/skills</text>
    <rect x="300" y="314" width="790" height="24" rx="12" fill="url(#gTeal)"/>
    <text x="1078" y="331" font-size="17" font-weight="700" fill="#1F6F78" text-anchor="end">176,551 星</text>

    <text class="rl" x="284" y="377" text-anchor="end">agentskills 规范仓库</text>
    <rect x="300" y="360" width="114" height="24" rx="12" fill="url(#gCoral)"/>
    <text class="b" x="424" y="377">25,385 星 · 独立于 Anthropic 组织</text>

    <text class="rl" x="284" y="423" text-anchor="end">topic agent-skills</text>
    <rect x="300" y="406" width="105" height="24" rx="12" fill="url(#gBeam)"/>
    <rect x="300" y="406" width="105" height="24" rx="12" fill="none" stroke="#D9A93C" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text class="b" x="424" y="423">约 23,486 仓库 · 只作规模下限</text>

    <text class="rl" x="284" y="469" text-anchor="end">I-have-ADHD 单文件</text>
    <rect x="300" y="452" width="48" height="24" rx="12" fill="url(#gViolet)"/>
    <text class="b" x="362" y="469">HN 540 分 · 320 分热帖问怎么管</text>
  </g>

  <!-- gap cards -->
  <g>
    <rect x="64" y="506" width="336" height="112" rx="14" fill="#E2725B" opacity="0.08"/>
    <rect x="64" y="506" width="336" height="6" rx="3" fill="url(#gCoral)"/>
    <text class="serif" x="88" y="552" font-size="24" font-weight="700" fill="#17303B">registry <tspan font-size="13" fill="#5F7683">签名审查均未发现</tspan></text>
    <text class="b" x="88" y="580">5,400+ 第三方技能自由分发</text>
    <text class="b" x="88" y="600">「未发现证据」型论断，不等于不存在</text>

    <rect x="432" y="506" width="336" height="112" rx="14" fill="#6FA86F" opacity="0.09"/>
    <rect x="432" y="506" width="336" height="6" rx="3" fill="url(#gGreen)"/>
    <text class="serif" x="456" y="552" font-size="24" font-weight="700" fill="#17303B">纯文件格式</text>
    <text class="b" x="456" y="580">无服务器 / 握手 / 运行时依赖</text>
    <text class="b" x="456" y="600">采纳成本比 MCP 协议低一个量级</text>

    <rect x="800" y="506" width="336" height="112" rx="14" fill="#7A6BB0" opacity="0.08"/>
    <rect x="800" y="506" width="336" height="6" rx="3" fill="url(#gViolet)"/>
    <text class="serif" x="824" y="552" font-size="24" font-weight="700" fill="#17303B">0 套互操作测试</text>
    <text class="b" x="824" y="580">46 客户端是 showcase 非认证</text>
    <text class="b" x="824" y="600">支持不等于等价，验证只到收录层</text>
  </g>

  <text class="b" x="64" y="662">悲观读法：不是 tar 包时刻，而是早期 npm 没有 audit 的时刻 · 星标数为 2026-09-16 实测 · Micropaper</text>
</svg>
