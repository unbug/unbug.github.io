<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">近 12 个月四家申请人五件注入防御专利公开；企业级防御产品化，小团队低成本验收测试空白</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">五件专利公开 / 授权日期（月内按日定位）</text>

  <!-- scale: month=75px; 2026-01=200, then +75/mo; day offset=75*day/30; 02-06: 200+75+15=290 -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="200" y1="126" x2="200" y2="360"/>
    <line x1="350" y1="126" x2="350" y2="360"/>
    <line x1="500" y1="126" x2="500" y2="360"/>
    <line x1="650" y1="126" x2="650" y2="360"/>
    <line x1="800" y1="126" x2="800" y2="360"/>
    <line x1="875" y1="126" x2="875" y2="360"/>
  </g>

  <!-- Microsoft US12519829 grant 2026-01-06: x=200+15=215 -->
  <circle cx="215" cy="158" r="6" fill="#0072B2"/>
  <text x="229" y="154" font-size="12" fill="#1A1B1E">01-06 授权</text>
  <text x="229" y="172" font-size="12" fill="#555">Microsoft · US12519829（US20260089190 同族）</text>

  <!-- Ant 2026-03-12: x=200+150+30=380 -->
  <circle cx="380" cy="206" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <text x="394" y="202" font-size="12" fill="#1A1B1E">03-12 公开（审查中）</text>
  <text x="394" y="220" font-size="12" fill="#555">Ant Group · US20260073299 — 三特征联合训练检测模型</text>

  <!-- Microsoft 2026-03-26: x=200+150+65=415 -->
  <circle cx="415" cy="254" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <text x="429" y="250" font-size="12" fill="#1A1B1E">03-26 公开（审查中）</text>
  <text x="429" y="268" font-size="12" fill="#555">Microsoft · US20260089190 — 变体注入攻击红队演练</text>

  <!-- Radware 2026-06-02 grant: x=200+375+5=580 -->
  <circle cx="580" cy="302" r="6" fill="#0072B2"/>
  <text x="594" y="298" font-size="12" fill="#1A1B1E">06-02 授权</text>
  <text x="594" y="316" font-size="12" fill="#555">Radware · US12647455 — 提示词到动作序列实时监控</text>

  <!-- Palo Alto 2026-08-06: x=200+525+15=740 -->
  <circle cx="740" cy="344" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <text x="754" y="340" font-size="12" fill="#1A1B1E">08-06 公开（审查中）</text>
  <text x="754" y="358" font-size="12" fill="#555">Palo Alto Networks · US20260228333 — SaaS 集成间接注入过滤</text>

  <!-- value axis -->
  <line x1="200" y1="360" x2="875" y2="360" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="200" y1="360" x2="200" y2="364"/>
    <line x1="350" y1="360" x2="350" y2="364"/>
    <line x1="500" y1="360" x2="500" y2="364"/>
    <line x1="650" y1="360" x2="650" y2="364"/>
    <line x1="800" y1="360" x2="800" y2="364"/>
    <line x1="875" y1="360" x2="875" y2="364"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="200" y="384">1 月</text>
    <text x="350" y="384">3 月</text>
    <text x="500" y="384">5 月</text>
    <text x="650" y="384">7 月</text>
    <text x="800" y="384">9 月</text>
    <text x="875" y="384">10 月</text>
  </g>
  <text x="575" y="410" font-size="14" fill="#1A1B1E" text-anchor="middle">日期（2026 年）</text>

  <!-- legend + side note -->
  <g font-size="12" fill="#555">
    <circle cx="988" cy="150" r="5" fill="#0072B2"/>
    <text x="1000" y="154">授权</text>
    <circle cx="988" cy="172" r="5" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.5"/>
    <text x="1000" y="176">公开申请</text>
  </g>
  <text x="988" y="212" font-size="12" fill="#555">两支路线：输入侧过滤</text>
  <text x="988" y="230" font-size="12" fill="#555">（Palo Alto、蚂蚁）与</text>
  <text x="988" y="248" font-size="12" fill="#555">行为侧攻防（Radware、</text>
  <text x="988" y="266" font-size="12" fill="#555">微软）；均为模型之外的</text>
  <text x="988" y="284" font-size="12" fill="#555">独立组件，不碰模型权重</text>

  <!-- side evidence -->
  <text x="60" y="452" font-size="12" fill="#555">产业侧佐证（正文）：NVD 累计收录 171 条 prompt injection 相关 CVE；OWASP Top 10 for LLM Applications 将其列为 LLM01。</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="508" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="508" font-size="15" fill="#1A1B1E">正文自估金额区间（直标数值，不设公共刻度）</text>

  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="240" y="549">验收测试报告 / 份</text>
    <text x="240" y="589">验收测试订阅 / 月</text>
    <text x="240" y="629">过滤中间件 / 实例·月</text>
  </g>

  <rect x="252" y="535" width="250" height="18" fill="#0072B2"/>
  <line x1="252" y1="532" x2="252" y2="556" stroke="#0072B2" stroke-width="0.75"/>
  <line x1="502" y1="532" x2="502" y2="556" stroke="#0072B2" stroke-width="0.75"/>
  <text x="512" y="549" font-size="12" fill="#555">1000–3000 元</text>

  <rect x="252" y="575" width="88" height="18" fill="#0072B2"/>
  <line x1="252" y1="572" x2="252" y2="596" stroke="#0072B2" stroke-width="0.75"/>
  <line x1="340" y1="572" x2="340" y2="596" stroke="#0072B2" stroke-width="0.75"/>
  <text x="350" y="589" font-size="12" fill="#555">299–999 元</text>

  <rect x="252" y="615" width="25" height="18" fill="#0072B2"/>
  <line x1="252" y1="612" x2="252" y2="636" stroke="#0072B2" stroke-width="0.75"/>
  <line x1="277" y1="612" x2="277" y2="636" stroke="#0072B2" stroke-width="0.75"/>
  <text x="287" y="629" font-size="12" fill="#555">99–299 元</text>

  <text x="620" y="549" font-size="12" fill="#555">技术栈：garak + FastAPI + 一台 VPS；起步成本五千元内（主要是 LLM API 费用），</text>
  <text x="620" y="567" font-size="12" fill="#555">4 周可出 MVP。</text>
  <text x="620" y="597" font-size="12" fill="#555">空档：开源 garak 只做单模型扫描，没有覆盖「外部内容 + Agent 动作序列」</text>
  <text x="620" y="615" font-size="12" fill="#555">整条链的小团队产品；企业级方案在价格与部署成本上够不到</text>

  <!-- footnote -->
  <text x="60" y="660" font-size="11" fill="#767676">数据：Google Patents / FreePatentsOnline 核验（三件申请公开不等于已授权，状态分别标注）· NVD CVE 计数与 OWASP 排名为正文引用值 · 定价为正文自估口径，不构成投资建议</text>
</svg>
