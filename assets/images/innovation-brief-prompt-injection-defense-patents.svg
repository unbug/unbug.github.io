<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1528;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c5cff;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <g opacity="0.05" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- badge -->
  <rect x="70" y="52" width="182" height="34" rx="17" fill="url(#accentGrad)" opacity="0.18"/>
  <text x="161" y="75" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#8ab4ff" text-anchor="middle">AI 智创简报</text>

  <!-- title -->
  <text x="70" y="142" font-family="Helvetica,Arial,sans-serif" font-size="44" font-weight="bold" fill="#ffffff">注入防御专利连发，AI 应用安全体检的小生意</text>
  <text x="70" y="188" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#9fb3d9">US20260228333 Palo Alto Networks · US20260089190 Microsoft · US12647455 Radware ｜ OWASP LLM 头号风险</text>

  <!-- panel 1: patent signal -->
  <g>
    <rect x="70" y="230" width="330" height="280" rx="14" fill="#ffffff" opacity="0.05"/>
    <rect x="70" y="230" width="330" height="6" rx="3" fill="url(#accentGrad)"/>
    <text x="94" y="278" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#ffffff">专利信号</text>
    <text x="94" y="312" font-family="Menlo,Consolas,monospace" font-size="15" fill="#8ab4ff">US20260228333</text>
    <text x="94" y="334" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#c7d4ee">Palo Alto Networks · 2026-08-06</text>
    <text x="94" y="356" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#9fb3d9">SaaS 集成间接注入，风险分过滤</text>
    <line x1="94" y1="374" x2="376" y2="374" stroke="#ffffff" opacity="0.15"/>
    <text x="94" y="400" font-family="Menlo,Consolas,monospace" font-size="15" fill="#8ab4ff">US20260089190</text>
    <text x="94" y="422" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#c7d4ee">Microsoft · 2026-03-26（同族已授权）</text>
    <text x="94" y="444" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#9fb3d9">LLM 生成变体攻击，红队加固模型</text>
    <line x1="94" y1="462" x2="376" y2="462" stroke="#ffffff" opacity="0.15"/>
    <text x="94" y="488" font-family="Menlo,Consolas,monospace" font-size="15" fill="#8ab4ff">US12647455</text>
    <text x="94" y="510" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#c7d4ee">Radware · 2026-06-02（已授权）</text>
    <text x="94" y="532" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#9fb3d9">Agent 动作序列语义距离异常检测</text>
  </g>

  <!-- arrow 1 -->
  <path d="M 408 370 L 428 370 M 421 363 L 428 370 L 421 377" stroke="#4a9eff" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- panel 2: trend -->
  <g>
    <rect x="435" y="230" width="330" height="280" rx="14" fill="#ffffff" opacity="0.05"/>
    <rect x="435" y="230" width="330" height="6" rx="3" fill="url(#accentGrad)"/>
    <text x="459" y="278" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#ffffff">技术趋势</text>
    <text x="459" y="316" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#c7d4ee">两支路线：输入侧过滤 + 行为侧攻防</text>
    <line x1="459" y1="338" x2="741" y2="338" stroke="#ffffff" opacity="0.15"/>
    <text x="459" y="370" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#9fb3d9">共同点：防御做成模型之外的</text>
    <text x="459" y="396" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#8ab4ff">独立组件，挂在调用链中间层</text>
    <line x1="459" y1="420" x2="741" y2="420" stroke="#ffffff" opacity="0.15"/>
    <text x="459" y="452" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#9fb3d9">差异点：garak 只做单模型红队，</text>
    <text x="459" y="476" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#9fb3d9">企业方案面向大客户；</text>
    <text x="459" y="500" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#8ab4ff">小团队整条链的防护还是空白</text>
  </g>

  <!-- arrow 2 -->
  <path d="M 773 370 L 793 370 M 786 363 L 793 370 L 786 377" stroke="#4a9eff" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- panel 3: opportunity -->
  <g>
    <rect x="800" y="230" width="330" height="280" rx="14" fill="#ffffff" opacity="0.05"/>
    <rect x="800" y="230" width="330" height="6" rx="3" fill="url(#accentGrad)"/>
    <text x="824" y="278" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#ffffff">一个人能做的机会</text>
    <text x="824" y="316" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#c7d4ee">AI 应用注入验收测试（红队报告）</text>
    <line x1="824" y1="338" x2="1106" y2="338" stroke="#ffffff" opacity="0.15"/>
    <text x="824" y="370" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#9fb3d9">garak + 开源 LLM 生成变体攻击</text>
    <text x="824" y="396" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#9fb3d9">打到应用 API，输出风险报告</text>
    <text x="824" y="422" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#9fb3d9">命中率 / 泄露样本 / 修复建议</text>
    <line x1="824" y1="444" x2="1106" y2="444" stroke="#ffffff" opacity="0.15"/>
    <text x="824" y="476" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#8ab4ff">FastAPI + VPS，五千元内 · 4 周 MVP</text>
    <text x="824" y="500" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#8ab4ff">单份报告 1000-3000 元 · 订阅 299-999/月</text>
  </g>

  <!-- bottom takeaway -->
  <rect x="70" y="540" width="1060" height="52" rx="12" fill="url(#accentGrad)" opacity="0.14"/>
  <text x="600" y="573" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#dbe6ff" text-anchor="middle">大厂在专利里圈的是企业级防御，独立开发者能接的是 AI 应用「安全体检」的活</text>
</svg>
