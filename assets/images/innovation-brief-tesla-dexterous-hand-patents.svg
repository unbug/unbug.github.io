<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1528;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c5cff;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <g opacity="0.05" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <rect x="70" y="58" width="182" height="34" rx="17" fill="url(#accentGrad)" opacity="0.18"/>
  <text x="161" y="81" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#8ab4ff" text-anchor="middle">AI 智创简报</text>

  <text x="70" y="150" font-family="Helvetica,Arial,sans-serif" font-size="44" font-weight="bold" fill="#ffffff">特斯拉灵巧手五连专利</text>
  <text x="70" y="204" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#9aa8c7">驱动上移前臂 · 腱传动 · 无销柔性关节</text>
  <line x1="70" y1="234" x2="1130" y2="234" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Stage 1: patent signal -->
  <rect x="70" y="280" width="300" height="196" rx="12" fill="#141b33" stroke="#2c3a63" stroke-width="1.5"/>
  <text x="98" y="318" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#4a9eff">专利信号</text>
  <text x="98" y="356" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#c8d2e8">WO2026/080687</text>
  <text x="98" y="382" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#c8d2e8">WO2026/080690</text>
  <text x="98" y="408" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#c8d2e8">WO2026/080691</text>
  <text x="98" y="434" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#c8d2e8">WO2026/080693 · 080701</text>
  <text x="98" y="460" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#7d8bab">Tesla, Inc. · 2026-04-16</text>

  <path d="M 386 378 L 428 378" stroke="#4a9eff" stroke-width="2"/>
  <path d="M 424 372 L 434 378 L 424 384 Z" fill="#4a9eff"/>

  <!-- Stage 2: manufacturing -->
  <rect x="450" y="280" width="300" height="196" rx="12" fill="#141b33" stroke="#2c3a63" stroke-width="1.5"/>
  <text x="478" y="318" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#6b7dff">制造环节</text>
  <text x="478" y="356" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#c8d2e8">微型丝杠 / 空心杯电机</text>
  <text x="478" y="382" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#c8d2e8">高强纤维腱绳 · 耐磨导向</text>
  <text x="478" y="408" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#c8d2e8">柔性铰链复合材料</text>
  <text x="478" y="434" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#c8d2e8">指端触觉传感阵列</text>
  <text x="478" y="460" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#7d8bab">前臂动力舱 · 模块化整手</text>

  <path d="M 766 378 L 808 378" stroke="#7c5cff" stroke-width="2"/>
  <path d="M 804 372 L 814 378 L 804 384 Z" fill="#7c5cff"/>

  <!-- Stage 3: opportunity -->
  <rect x="830" y="280" width="300" height="196" rx="12" fill="#141b33" stroke="#3d3168" stroke-width="1.5"/>
  <text x="858" y="318" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#7c5cff">机会切口</text>
  <text x="858" y="356" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#c8d2e8">腱驱模组整包供应</text>
  <text x="858" y="382" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#c8d2e8">腱绳寿命测试服务</text>
  <text x="858" y="408" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#c8d2e8">柔性关节材料配方</text>
  <text x="858" y="434" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#c8d2e8">整手维修与换件</text>
  <text x="858" y="460" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#7d8bab">门槛：百万次循环验证</text>

  <text x="70" y="556" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#7d8bab">AI 技术趋势 × 专利洞察 × 制造机会 × 创业发现</text>
</svg>
