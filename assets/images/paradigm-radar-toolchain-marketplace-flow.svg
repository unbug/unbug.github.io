<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="Helvetica Neue, Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1200" height="500" fill="#F4F7FB"/>
  <text x="600" y="42" font-size="25" font-weight="bold" fill="#1E3A5F" text-anchor="middle">断点在哪里：官方渠道完好，市场权限失守（口径三级标注）</text>

  <g font-size="15.5" text-anchor="middle">
    <rect x="50" y="78" width="215" height="96" rx="12" fill="#EAF6EF" stroke="#1E8449" stroke-width="2.5"/>
    <text x="157" y="112" font-weight="bold" fill="#14532D">Anthropic 构建管线</text><text x="157" y="138" fill="#1F4D33">官方渠道版本未受影响</text><text x="157" y="160" fill="#6B7F96" font-size="13">当事方口径（50304129 逐字）</text>
    <rect x="315" y="78" width="230" height="96" rx="12" fill="#FDECEA" stroke="#C0392B" stroke-width="3"/>
    <text x="430" y="112" font-weight="bold" fill="#C0392B">Cursor Marketplace 发布权限</text><text x="430" y="138" fill="#7B241C">malicious actor used access to</text><text x="430" y="158" fill="#7B241C">the marketplace — 断点在此</text>
    <rect x="595" y="78" width="245" height="96" rx="12" fill="#FDECEA" stroke="#C0392B" stroke-width="2.5"/>
    <text x="717" y="112" font-weight="bold" fill="#C0392B">篡改包上架 11 小时</text><text x="717" y="138" fill="#7B241C">2:27am–1:35pm PT（Reuters 转述）</text><text x="717" y="160" fill="#7B241C">受影响 5,000+ 用户</text>
    <rect x="890" y="78" width="260" height="96" rx="12" fill="#FDF6E3" stroke="#B7791F" stroke-width="2.5"/>
    <text x="1020" y="112" font-weight="bold" fill="#8B5E1A">后果</text><text x="1020" y="138" fill="#7A5514">三平台 SSH 持久化后门（Phorion 公告）</text><text x="1020" y="160" fill="#7A5514">下架并回拉 2.1.313</text>
  </g>
  <g stroke="#C0392B" stroke-width="2.5" fill="none" marker-end="url(#tR)"><line x1="265" y1="126" x2="315" y2="126"/><line x1="545" y1="126" x2="595" y2="126"/><line x1="840" y1="126" x2="890" y2="126"/></g>
  <line x1="157" y1="174" x2="157" y2="212" stroke="#1E8449" stroke-width="2" stroke-dasharray="6 5"/><text x="167" y="232" font-size="13.5" fill="#14532D">开发者仍信任的这一段没有断</text>

  <rect x="50" y="262" width="1100" height="120" rx="12" fill="#FFFFFF" stroke="#2F6FB2" stroke-width="2"/>
  <text x="75" y="296" font-size="17" font-weight="bold" fill="#1E3A5F">对照：同期两案的「暴露时长」第一次可比</text>
  <line x1="110" y1="340" x2="1090" y2="340" stroke="#1F2937" stroke-width="2"/>
  <rect x="700" y="330" width="330" height="20" rx="4" fill="#C0392B" fill-opacity="0.25"/><text x="865" y="322" font-size="14" fill="#C0392B" text-anchor="middle">扩展市场通道：11 小时 08 分</text>
  <rect x="965" y="352" width="65" height="20" rx="4" fill="#B7791F" fill-opacity="0.4"/><text x="997" y="374" font-size="14" fill="#8B5E1A" text-anchor="middle">Docker 通道 4 小时</text>
  <text x="110" y="330" font-size="14" fill="#6B7280">LiteLLM（10-21）→</text>

  <text x="600" y="432" font-size="17" fill="#1E3A5F" text-anchor="middle">未结的账：恶意 actor 如何拿到市场发布权限，11-16 复测仍无 Cursor 根因复盘</text>
  <text x="600" y="468" font-size="15" fill="#6B7F96" text-anchor="middle">anon-3988（50302764）把讨论抬到认知层：「用 Claude Code / Codex 的人本质每天都在跑 RCE」——托付模型变了，威胁模型也要换</text>
  <defs><marker id="tR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#C0392B"/></marker></defs>
</svg>
