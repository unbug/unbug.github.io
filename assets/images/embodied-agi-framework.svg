<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">综述给出 L1 到 L5 五阶段框架：世界模型（L4）是通向通用具身 AGI 的关键缺口，数据瓶颈决定推进速度</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">五层级发展框架（序列位置轴，按正文 L1 到 L5 顺序，非数值刻度）</text>

  <!-- sequence axis -->
  <line x1="110" y1="560" x2="1120" y2="560" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="170" y1="560" x2="170" y2="564"/>
    <line x1="360" y1="560" x2="360" y2="564"/>
    <line x1="550" y1="560" x2="550" y2="564"/>
    <line x1="740" y1="560" x2="740" y2="564"/>
    <line x1="930" y1="560" x2="930" y2="564"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle" font-weight="bold">
    <text x="170" y="584">L1</text>
    <text x="360" y="584">L2</text>
    <text x="550" y="584">L3</text>
    <text x="740" y="584">L4</text>
    <text x="930" y="584">L5</text>
  </g>
  <text x="615" y="608" font-size="12" fill="#555" text-anchor="middle">序列位置轴（按正文 L1 到 L5 顺序排列），非数值刻度</text>

  <!-- connectors -->
  <g stroke="#999999" stroke-width="0.75">
    <line x1="170" y1="146" x2="170" y2="556"/>
    <line x1="360" y1="146" x2="360" y2="556"/>
    <line x1="550" y1="146" x2="550" y2="556"/>
    <line x1="740" y1="146" x2="740" y2="556"/>
    <line x1="930" y1="146" x2="930" y2="556"/>
  </g>

  <!-- L1 -->
  <circle cx="170" cy="140" r="6" fill="#999999"/>
  <text x="170" y="122" font-size="12.5" fill="#1A1B1E" text-anchor="middle" font-weight="bold">基础具身系统</text>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="170" y="168">大语言模型当大脑</text>
    <text x="170" y="186">理解指令执行序列</text>
    <text x="170" y="204">泛化有限缺物理理解</text>
    <text x="170" y="226" fill="#767676">RT-1 RT-2 PaLM-E</text>
  </g>

  <!-- L2 -->
  <circle cx="360" cy="140" r="6" fill="#999999"/>
  <text x="360" y="122" font-size="12.5" fill="#1A1B1E" text-anchor="middle" font-weight="bold">多模态融合</text>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="360" y="168">视觉-语言-动作模型</text>
    <text x="360" y="186">视觉场景直出动作</text>
    <text x="360" y="204">跨任务一定泛化</text>
    <text x="360" y="226" fill="#767676">CLIP+强化学习 PaLI-X</text>
  </g>

  <!-- L3 -->
  <circle cx="550" cy="140" r="6" fill="#999999"/>
  <text x="550" y="122" font-size="12.5" fill="#1A1B1E" text-anchor="middle" font-weight="bold">具身强化学习</text>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="550" y="168">试错自主发现策略</text>
    <text x="550" y="186">灵巧手与复杂装配</text>
    <text x="550" y="204">样本效率低难 Sim2Real</text>
  </g>

  <!-- L4 (主角) -->
  <circle cx="740" cy="140" r="8" fill="#D55E00"/>
  <text x="740" y="122" font-size="12.5" fill="#D55E00" text-anchor="middle" font-weight="bold">世界模型</text>
  <g font-size="11" text-anchor="middle">
    <text x="740" y="168" fill="#D55E00">内部模拟器预测后果</text>
    <text x="740" y="186" fill="#D55E00">多步规划反事实推理</text>
    <text x="740" y="204" fill="#D55E00">通向真正 AGI 的关键</text>
  </g>

  <!-- L5 -->
  <circle cx="930" cy="140" r="6" fill="#999999"/>
  <text x="930" y="122" font-size="12.5" fill="#1A1B1E" text-anchor="middle" font-weight="bold">通用具身 AGI</text>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="930" y="168">快速适应少样本学习</text>
    <text x="930" y="186">跨域迁移自我反思</text>
    <text x="930" y="204">算力安全对齐伦理挑战</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="60" y="286" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="286" font-size="15" fill="#1A1B1E">四条技术趋势与五处公认瓶颈（定性列举，无数值轴）</text>

  <text x="120" y="322" font-size="12.5" fill="#1A1B1E" font-weight="bold">技术趋势</text>
  <g font-size="12" fill="#555">
    <text x="120" y="350">世界模型：从预测走向规划与因果建模</text>
    <text x="120" y="376">Sim2Real：域随机化与混合训练缩小差距</text>
    <text x="120" y="402">多模态感知：视觉扩展到力觉、听觉全融合</text>
    <text x="120" y="428">大模型：语义理解、任务分解与知识迁移</text>
  </g>
  <rect x="100" y="334" width="4" height="102" fill="#999999"/>

  <text x="640" y="322" font-size="12.5" fill="#1A1B1E" font-weight="bold">公认瓶颈</text>
  <g font-size="12" fill="#555">
    <text x="640" y="350">真实交互数据昂贵</text>
    <text x="640" y="376">样本效率低</text>
    <text x="640" y="402">物理安全风险</text>
    <text x="640" y="428">决策可解释性差、未知环境泛化不足</text>
  </g>
  <rect x="620" y="334" width="4" height="102" fill="#D55E00"/>

  <text x="120" y="472" font-size="12" fill="#555">综述立场：AGI 本质上是具身的，纯符号系统无法真正理解世界；安全对齐必须与能力提升同步。</text>

  <!-- footnote -->
  <text x="60" y="628" font-size="11" fill="#767676">来源：arXiv:2505.14235《Toward Embodied AGI: A Review of Embodied AI and the Road Ahead》（Wang 与 Sun 综述）</text>
  <text x="60" y="644" font-size="11" fill="#767676">正文未含量化数值，面板 a 为层级序列示意、面板 b 为定性列举，均非测量数值 · 预印本未经同行评审</text>
</svg>
