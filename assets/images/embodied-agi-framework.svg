<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  
  
  <!-- 背景 -->
  <rect width="1200" height="800" fill="#F0F0F0"/>
  
  <!-- 标题 -->
  <text x="600" y="60" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#009E73">
    具身 AGI 五阶段演化框架 (L1-L5)
  </text>
  
  <!-- L1: LLM 驱动的机器人 -->
  <g transform="translate(80, 120)">
    <rect width="220" height="180" rx="10" fill="#CC79A7" stroke="#0072B2" stroke-width="3"/>
    <text x="110" y="40" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#0072B2">
      L1 阶段
    </text>
    <text x="110" y="65" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#009E73">
      LLM 驱动的机器人
    </text>
    <circle cx="110" cy="100" r="30" fill="#555555"/>
    <text x="110" y="105" font-family="Arial" font-size="14" fill="white" text-anchor="middle">LLM</text>
    <text x="110" y="145" font-family="Arial" font-size="12" text-anchor="middle" fill="#009E73">
      任务理解 + 预设规则
    </text>
    <text x="110" y="165" font-family="Arial" font-size="11" text-anchor="middle" fill="#CC79A7">
      依赖预编程环境模型
    </text>
  </g>
  
  <!-- L2: 端到端学习 -->
  <g transform="translate(330, 120)">
    <rect width="220" height="180" rx="10" fill="#CC79A7" stroke="#0072B2" stroke-width="3"/>
    <text x="110" y="40" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#009E73">
      L2 阶段
    </text>
    <text x="110" y="65" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#009E73">
      端到端学习
    </text>
    <circle cx="110" cy="100" r="30" fill="#555555"/>
    <text x="110" y="105" font-family="Arial" font-size="14" fill="white" text-anchor="middle">DL</text>
    <text x="110" y="145" font-family="Arial" font-size="12" text-anchor="middle" fill="#009E73">
      数据驱动感知 - 动作
    </text>
    <text x="110" y="165" font-family="Arial" font-size="11" text-anchor="middle" fill="#CC79A7">
      特定场景有限泛化
    </text>
  </g>
  
  <!-- L3: 世界模型驱动 -->
  <g transform="translate(580, 120)">
    <rect width="220" height="180" rx="10" fill="#CC79A7" stroke="#009E73" stroke-width="3"/>
    <text x="110" y="40" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#009E73">
      L3 阶段
    </text>
    <text x="110" y="65" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#009E73">
      世界模型驱动
    </text>
    <circle cx="110" cy="100" r="30" fill="#555555"/>
    <text x="110" y="105" font-family="Arial" font-size="14" fill="white" text-anchor="middle">WM</text>
    <text x="110" y="145" font-family="Arial" font-size="12" text-anchor="middle" fill="#009E73">
      环境预测与模拟
    </text>
    <text x="110" y="165" font-family="Arial" font-size="11" text-anchor="middle" fill="#CC79A7">
      主动规划能力
    </text>
  </g>
  
  <!-- L4: 持续学习 -->
  <g transform="translate(80, 350)">
    <rect width="220" height="180" rx="10" fill="#CC79A7" stroke="#E69F00" stroke-width="3"/>
    <text x="110" y="40" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#D55E00">
      L4 阶段
    </text>
    <text x="110" y="65" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#009E73">
      持续学习自适应
    </text>
    <circle cx="110" cy="100" r="30" fill="#E69F00"/>
    <text x="110" y="105" font-family="Arial" font-size="14" fill="white" text-anchor="middle">CL</text>
    <text x="110" y="145" font-family="Arial" font-size="12" text-anchor="middle" fill="#009E73">
      持续经验积累
    </text>
    <text x="110" y="165" font-family="Arial" font-size="11" text-anchor="middle" fill="#CC79A7">
      开放环境适应
    </text>
  </g>
  
  <!-- L5: 真正的具身 AGI -->
  <g transform="translate(330, 350)">
    <rect width="220" height="180" rx="10" fill="#CC79A7" stroke="#CC79A7" stroke-width="3"/>
    <text x="110" y="40" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#0072B2">
      L5 阶段
    </text>
    <text x="110" y="65" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#009E73">
      真正的具身 AGI
    </text>
    <circle cx="110" cy="100" r="30" fill="#555555"/>
    <text x="110" y="105" font-family="Arial" font-size="14" fill="white" text-anchor="middle">AGI</text>
    <text x="110" y="145" font-family="Arial" font-size="12" text-anchor="middle" fill="#009E73">
      通用智能体
    </text>
    <text x="110" y="165" font-family="Arial" font-size="11" text-anchor="middle" fill="#CC79A7">
      完全自主
    </text>
  </g>
  
  <!-- 图例说明 -->
  <rect x="580" y="300" width="550" height="240" rx="10" fill="#CC79A7" stroke="#CC79A7" stroke-width="1"/>
  <text x="600" y="335" font-family="Arial" font-size="16" font-weight="bold" fill="#009E73">
    关键技术特征：
  </text>
  
  <text x="600" y="370" font-family="Arial" font-size="13" fill="#009E73">
    • L1: 大语言模型认知 + 传统控制规则
  </text>
  <text x="600" y="395" font-family="Arial" font-size="13" fill="#009E73">
    • L2: 深度强化学习端到端映射
  </text>
  <text x="600" y="420" font-family="Arial" font-size="13" fill="#009E73">
    • L3: 世界模型与物理环境预测
  </text>
  <text x="600" y="445" font-family="Arial" font-size="13" fill="#009E73">
    • L4: 终身学习持续适应新场景
  </text>
  <text x="600" y="470" font-family="Arial" font-size="13" fill="#009E73">
    • L5: 真正的通用智能，完全自主
  </text>
  
  <text x="600" y="505" font-family="Arial" font-size="13" fill="#009E73">
    核心范式转变：训练 - 部署 → 终身学习
  </text>
  
  <!-- 底部标注 -->
  <text x="600" y="560" font-family="Arial" font-size="11" text-anchor="middle" fill="#CC79A7">
    来源：Wang &amp; Sun (2025) arXiv:2505.14235
  </text>
</svg>