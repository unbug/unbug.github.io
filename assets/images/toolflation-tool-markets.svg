<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">严重通胀市场中买方任务成功率坍塌：Amazon 从 88% 以上跌至 29%–31%，接近随机</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">买方任务成功率：厂商原文 vs 严重通胀（区间，%）</text>

  <!-- gridlines: x = 300 + 7.5*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="300" y1="130" x2="300" y2="420"/>
    <line x1="450" y1="130" x2="450" y2="420"/>
    <line x1="600" y1="130" x2="600" y2="420"/>
    <line x1="750" y1="130" x2="750" y2="420"/>
    <line x1="900" y1="130" x2="900" y2="420"/>
  </g>

  <!-- Amazon baseline 88-89 -->
  <text x="288" y="171" font-size="12.5" fill="#1A1B1E" text-anchor="end">Amazon 厂商原文</text>
  <rect x="960" y="157" width="7.5" height="18" fill="#0072B2"/>
  <line x1="960" y1="154" x2="960" y2="178" stroke="#0072B2" stroke-width="0.75"/>
  <line x1="967.5" y1="154" x2="967.5" y2="178" stroke="#0072B2" stroke-width="0.75"/>
  <text x="975" y="171" font-size="12" fill="#555">88–89%</text>

  <!-- Amazon severe 29-31 -->
  <text x="288" y="219" font-size="12.5" fill="#1A1B1E" text-anchor="end">Amazon 严重通胀</text>
  <rect x="517.5" y="205" width="15" height="18" fill="#D55E00"/>
  <line x1="517.5" y1="202" x2="517.5" y2="226" stroke="#D55E00" stroke-width="0.75"/>
  <line x1="532.5" y1="202" x2="532.5" y2="226" stroke="#D55E00" stroke-width="0.75"/>
  <text x="540" y="219" font-size="12" fill="#555">29–31%，接近随机</text>

  <!-- Instagram baseline 74-80 -->
  <text x="288" y="315" font-size="12.5" fill="#1A1B1E" text-anchor="end">Instagram 厂商原文</text>
  <rect x="855" y="301" width="45" height="18" fill="#0072B2"/>
  <line x1="855" y1="298" x2="855" y2="322" stroke="#0072B2" stroke-width="0.75"/>
  <line x1="900" y1="298" x2="900" y2="322" stroke="#0072B2" stroke-width="0.75"/>
  <text x="908" y="315" font-size="12" fill="#555">74–80%</text>

  <!-- Instagram severe 40 -->
  <text x="288" y="363" font-size="12.5" fill="#1A1B1E" text-anchor="end">Instagram 严重通胀</text>
  <rect x="600" y="349" width="22.5" height="18" fill="#D55E00"/>
  <line x1="622.5" y1="346" x2="622.5" y2="370" stroke="#D55E00" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="630" y="363" font-size="12" fill="#555">40%（正文单点口径）</text>

  <!-- value axis -->
  <line x1="300" y1="420" x2="1020" y2="420" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="420" x2="300" y2="424"/>
    <line x1="450" y1="420" x2="450" y2="424"/>
    <line x1="600" y1="420" x2="600" y2="424"/>
    <line x1="750" y1="420" x2="750" y2="424"/>
    <line x1="900" y1="420" x2="900" y2="424"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="440">0</text>
    <text x="450" y="440">20</text>
    <text x="600" y="440">40</text>
    <text x="750" y="440">60</text>
    <text x="900" y="440">80</text>
  </g>
  <text x="660" y="464" font-size="14" fill="#1A1B1E" text-anchor="middle">买方任务成功率（%）</text>
  <g font-size="12" fill="#555">
    <rect x="300" y="118" width="12" height="10" fill="#0072B2"/>
    <text x="317" y="127">厂商原文（基线）</text>
    <rect x="430" y="118" width="12" height="10" fill="#D55E00"/>
    <text x="447" y="127">严重通胀</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="60" y="512" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="512" font-size="15" fill="#1A1B1E">机制读数（正文直标，非同一坐标系）</text>

  <text x="82" y="548" font-size="12.5" fill="#1A1B1E">描述相似度</text>
  <text x="230" y="548" font-size="12" fill="#555">0.1 升至 0.6–0.8，买方失去区分信息</text>

  <text x="82" y="578" font-size="12.5" fill="#1A1B1E">按列表首位选择</text>
  <text x="230" y="578" font-size="12" fill="#555">严重通胀市场 61–79%，其余市场 8–25%；顺序每题随机打乱，按首位选等价于随机选</text>

  <text x="82" y="608" font-size="12.5" fill="#1A1B1E">零能力弱工具的选择次数</text>
  <text x="280" y="608" font-size="12" fill="#555">此前 0 次选择，严重通胀市场抢到 867–1,926 次</text>

  <!-- footnote -->
  <text x="60" y="644" font-size="11" fill="#767676">数据：arXiv:2610.28454（Google / Google DeepMind / 多伦多大学，20 市场 × 20 轮，合计 166,320 次工具选择，论文自测口径）· 受控模拟实验，Amazon、Instagram 指平台货架场景 · 区间为论文报告范围</text>
</svg>
