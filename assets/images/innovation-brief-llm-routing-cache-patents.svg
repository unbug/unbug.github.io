<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">大模型路由与缓存主题 2026 年至少公开 6 件美国申请，全部指向 API 中间层</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">已给公开日期的 5 件申请：公开日期时间轴</text>

  <!-- gridlines (month majors, 0.5pt) -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="200" y1="126" x2="200" y2="352"/>
    <line x1="378.3" y1="126" x2="378.3" y2="352"/>
    <line x1="550.8" y1="126" x2="550.8" y2="352"/>
    <line x1="729.2" y1="126" x2="729.2" y2="352"/>
    <line x1="901.7" y1="126" x2="901.7" y2="352"/>
    <line x1="1080" y1="126" x2="1080" y2="352"/>
  </g>

  <!-- hollow = published application -->
  <!-- Palo Alto 2026-03-05 -->
  <circle cx="223" cy="156" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <text x="223" y="140" font-size="12" fill="#1A1B1E" text-anchor="middle">2026-03-05</text>
  <text x="223" y="180" font-size="12" fill="#555" text-anchor="middle">Palo Alto Networks</text>
  <text x="223" y="196" font-size="12" fill="#555" text-anchor="middle">US20260064670</text>
  <text x="223" y="212" font-size="12" fill="#555" text-anchor="middle">自然语言查询路由</text>

  <!-- BOOMI 2026-04-30 -->
  <circle cx="545.1" cy="210" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <text x="545.1" y="194" font-size="12" fill="#1A1B1E" text-anchor="middle">2026-04-30</text>
  <text x="545.1" y="234" font-size="12" fill="#555" text-anchor="middle">BOOMI US20260119922</text>
  <text x="545.1" y="250" font-size="12" fill="#555" text-anchor="middle">预测调用成本，超预算自动拦截</text>

  <!-- Infobip 2026-05-14 -->
  <circle cx="625.6" cy="156" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <text x="625.6" y="140" font-size="12" fill="#1A1B1E" text-anchor="middle">2026-05-14</text>
  <text x="625.6" y="180" font-size="12" fill="#555" text-anchor="middle">Infobip US20260134002</text>
  <text x="625.6" y="196" font-size="12" fill="#555" text-anchor="middle">先分类，再按成本/质量/吞吐选供应商</text>

  <!-- NVIDIA 2026-07-02 -->
  <circle cx="907.5" cy="210" r="6" fill="#D55E00"/>
  <text x="907.5" y="194" font-size="12" fill="#1A1B1E" text-anchor="middle">2026-07-02</text>
  <text x="907.5" y="234" font-size="12" fill="#555" text-anchor="middle">NVIDIA US20260187482</text>
  <text x="907.5" y="250" font-size="12" fill="#555" text-anchor="middle">评分数据训练语言模型路由器</text>

  <!-- IBM 2026-07-09 -->
  <circle cx="947.7" cy="290" r="6" fill="#D55E00"/>
  <text x="947.7" y="274" font-size="12" fill="#1A1B1E" text-anchor="middle">2026-07-09</text>
  <text x="947.7" y="314" font-size="12" fill="#555" text-anchor="middle">IBM US20260195537</text>
  <text x="947.7" y="330" font-size="12" fill="#555" text-anchor="middle">预测下一个提示词，预热边缘缓存</text>

  <!-- value axis -->
  <line x1="200" y1="352" x2="1080" y2="352" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="200" y1="352" x2="200" y2="356"/>
    <line x1="378.3" y1="352" x2="378.3" y2="356"/>
    <line x1="550.8" y1="352" x2="550.8" y2="356"/>
    <line x1="729.2" y1="352" x2="729.2" y2="356"/>
    <line x1="901.7" y1="352" x2="901.7" y2="356"/>
    <line x1="1080" y1="352" x2="1080" y2="356"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="200" y="376">3 月</text>
    <text x="378.3" y="376">4 月</text>
    <text x="550.8" y="376">5 月</text>
    <text x="729.2" y="376">6 月</text>
    <text x="901.7" y="376">7 月</text>
    <text x="1080" y="376">8 月</text>
  </g>
  <text x="640" y="402" font-size="14" fill="#1A1B1E" text-anchor="middle">公开日期（2026 年，月内按日定位）</text>

  <!-- legend -->
  <g font-size="12" fill="#555">
    <circle cx="210" cy="427" r="5" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
    <text x="222" y="431">申请公开（审查中），不等于已授权</text>
    <circle cx="440" cy="427" r="5" fill="#D55E00"/>
    <text x="452" y="431">近 90 天内公开（正文口径：NVIDIA 与 IBM 的 2 件）· 第 6 件 BOOMI US20260119921 正文注明与 US20260119922 同日公开</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="60" y="492" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="492" font-size="15" fill="#1A1B1E">正文自估口径：代理服务的成本与定价（元）</text>

  <!-- gridlines (horizontal majors only) -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="260" y1="523" x2="880" y2="523"/>
    <line x1="260" y1="549" x2="880" y2="549"/>
    <line x1="260" y1="575" x2="880" y2="575"/>
  </g>
  <!-- scale: x = 260 + 0.11*v (元), axis 0-5000 at x=810.. extend 880 = 5636 -->
  <text x="250" y="521" font-size="12.5" fill="#1A1B1E" text-anchor="end">小 VPS / 月</text>
  <rect x="265.5" y="507" width="5.5" height="18" fill="#999999"/>
  <text x="282" y="521" font-size="12" fill="#555">50–100 元 / 月</text>

  <text x="250" y="547" font-size="12.5" fill="#1A1B1E" text-anchor="end">托管订阅 / 月</text>
  <rect x="270.9" y="533" width="22" height="18" fill="#0072B2"/>
  <text x="304" y="547" font-size="12" fill="#555">99–299 元 / 月（卖点：接入后账单降 30%）</text>

  <text x="250" y="573" font-size="12.5" fill="#1A1B1E" text-anchor="end">成本审计 / 次</text>
  <rect x="480" y="559" width="330" height="18" fill="#0072B2"/>
  <line x1="480" y1="556" x2="480" y2="580" stroke="#0072B2" stroke-width="0.75"/>
  <line x1="810" y1="556" x2="810" y2="580" stroke="#0072B2" stroke-width="0.75"/>
  <text x="492" y="573" font-size="12" fill="#FFFFFF">2000-5000 元 / 次</text>

  <!-- value axis -->
  <line x1="260" y1="588" x2="880" y2="588" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="260" y1="588" x2="260" y2="592"/>
    <line x1="480" y1="588" x2="480" y2="592"/>
    <line x1="810" y1="588" x2="810" y2="592"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="260" y="612">0</text>
    <text x="480" y="612">2000</text>
    <text x="810" y="612">5000</text>
  </g>
  <text x="570" y="638" font-size="14" fill="#1A1B1E" text-anchor="middle">成本与定价（元）</text>

  <!-- panel b side note -->
  <text x="60" y="460" font-size="12" fill="#555">交付门槛（正文自估）：技术栈 LiteLLM + GPTCache + 小 VPS，全开源，MVP 4 周可演示；定价为正文自估口径，非市场实测。</text>

  <!-- footnote -->
  <text x="60" y="664" font-size="11" fill="#767676">数据：Free Patents Online / Google Patents 公开号与日期见正文 · 6 件均为申请公开、非授权 · 面板 b 商业数字为正文自估口径</text>
</svg>
