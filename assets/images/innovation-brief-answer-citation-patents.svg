<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">2026 年 7 至 9 月五件 AI 答案可验证性专利相继公开，全部为申请公开、均未授权</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">五件专利公开时间轴（窗口 2026-07 起，空心 = 申请公开）</text>

  <!-- event rail -->
  <line x1="90" y1="170" x2="1074" y2="170" stroke="#1A1B1E" stroke-width="1.5"/>
  <!-- two events same day: second marker staggered above the rail at 2026-07-23 -->
  <circle cx="325" cy="170" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <circle cx="325" cy="146" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <line x1="325" y1="162" x2="325" y2="154" stroke="#1A1B1E" stroke-width="0.75"/>
  <circle cx="400" cy="170" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <circle cx="625" cy="170" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <circle cx="775" cy="170" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>

  <!-- date labels -->
  <g font-size="12" fill="#555">
    <text x="313" y="142" text-anchor="end">2026-07-23</text>
    <text x="412" y="162">2026-07-30</text>
    <text x="625" y="152" text-anchor="middle">2026-08-20</text>
    <text x="775" y="152" text-anchor="middle">2026-09-03</text>
  </g>

  <!-- detail list below the rail, chronological -->
  <g font-size="12" fill="#555">
    <text x="90" y="200">○ US20260212126A1 公开 · Salesforce, Inc. · 2026-07-23　为 LLM 回复自动生成引用，挂接知识库来源条目</text>
    <text x="90" y="226">○ US20260211893A1 公开 · Snowflake Inc. · 2026-07-23　查询执行带幻觉防护，未过证据校验即拦截或标注（2026-03-19 提交）</text>
    <text x="90" y="252">○ US20260220372A1 公开 · American International Group · 2026-07-30　抽取字段可点开查看证据原文块</text>
    <text x="90" y="278">○ US20260244665A1 公开 · Capital One · 2026-08-20　不确定性量化给模型输出打可靠性标签</text>
    <text x="90" y="304">○ US20260260120A1 公开 · DeepMind Technologies · 2026-09-03　输出序列附行内证据，支撑句子的原文片段写进答案</text>
  </g>

  <!-- date axis (time axis: no gridlines per style guide) -->
  <line x1="90" y1="330" x2="1074" y2="330" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="90" y1="330" x2="90" y2="334"/>
    <line x1="416" y1="330" x2="416" y2="334"/>
    <line x1="745" y1="330" x2="745" y2="334"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="90" y="350">2026-07</text>
    <text x="416" y="350">2026-08</text>
    <text x="745" y="350">2026-09</text>
  </g>
  <text x="582" y="374" font-size="14" fill="#1A1B1E" text-anchor="middle">公开日期（年-月，窗口 2026-07 起）</text>
  <text x="90" y="398" font-size="12" fill="#555">○ 申请公开 · 2026-07-23 同日两件，轴上上下错开</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="440" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="440" font-size="15" fill="#1A1B1E">第三方质检的两档定价（正文自估口径，美元与人民币分列）</text>

  <!-- audit range 2000-6000 元 on 0-6000 元 scale: x = 90 + 990*v/6000 -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="90" y1="508" x2="1080" y2="508"/>
  </g>
  <text x="90" y="472" font-size="12" fill="#555">答案证据审计单次（元，区间 2000-6000）</text>
  <rect x="420" y="480" width="660" height="20" fill="#D55E00"/>
  <line x1="420" y1="476" x2="420" y2="504" stroke="#D55E00" stroke-width="2"/>
  <line x1="1080" y1="476" x2="1080" y2="504" stroke="#D55E00" stroke-width="2"/>
  <text x="420" y="524" font-size="12" fill="#555" text-anchor="middle">2000</text>
  <text x="1072" y="524" font-size="12" fill="#555" text-anchor="end">6000</text>

  <!-- value axis -->
  <line x1="90" y1="546" x2="1080" y2="546" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="90" y1="546" x2="90" y2="550"/>
    <line x1="420" y1="546" x2="420" y2="550"/>
    <line x1="1080" y1="546" x2="1080" y2="550"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="90" y="566">0</text>
    <text x="420" y="566">2000</text>
    <text x="1080" y="566">6000</text>
  </g>
  <text x="585" y="590" font-size="14" fill="#1A1B1E" text-anchor="middle">单次审计报价（元）</text>

  <text x="90" y="614" font-size="12" fill="#555">对照：质检插件订阅 $10-20/月；MVP 月成本数百元，四周内完成，起步成本远低于 2 万元（正文自估）</text>

  <!-- footnote -->
  <text x="60" y="640" font-size="11" fill="#767676">数据：US20260260120A1、US20260212126A1、US20260220372A1、US20260211893A1、US20260244665A1 公开公告日（正文 References）· 以上均为申请公开，不等于已授权</text>
  <text x="60" y="660" font-size="11" fill="#767676">2000-6000 元、$10-20/月与月成本为正文自估口径 · ragas 与 TruLens star 数未标实测日期，故不上图</text>
</svg>
