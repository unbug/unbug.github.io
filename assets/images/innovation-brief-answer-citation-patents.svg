<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #A08B72; }
      .b { font-size: 12px; fill: #8A7D6B; }
      .ev { font-size: 13px; font-weight: 700; fill: #2E2A22; }
      .evs { font-size: 12px; fill: #6B6152; }
      .stat { font-size: 34px; font-weight: 700; fill: #2E2A22; }
      .unit { font-size: 14px; fill: #6B6152; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FBF6EC"/>
    </linearGradient>
    <linearGradient id="axis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5543B"/><stop offset="1" stop-color="#2E7D6B"/>
    </linearGradient>
    <linearGradient id="sealgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B5543B"/><stop offset="1" stop-color="#D98A6E"/>
    </linearGradient>
    <linearGradient id="envgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5E9D4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1124" cy="96" r="130" fill="#2E7D6B" opacity="0.06"/>
  <circle cx="90" cy="644" r="120" fill="#B5543B" opacity="0.06"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#axis)"/>

  <text class="k" x="64" y="84">AI 智创简报 · 专利情报速读 · 答案引用溯源</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">举证写进答案，质检无人接单</text>
  <text x="64" y="158" font-size="15" fill="#6B6152">2026 年 7–9 月，四件"答案逐句带证据"专利相继公开</text>

  <!-- post office motif: envelope + postmark + stamp -->
  <g>
    <rect x="1018" y="76" width="66" height="82" rx="4" fill="url(#envgrad)" stroke="#B5543B" stroke-width="3"/>
    <path d="M 1018 76 l 33 30 l 33 -30" fill="none" stroke="#B5543B" stroke-width="3"/>
    <rect x="1026" y="128" width="20" height="20" fill="#E0B158"/>
    <rect x="1050" y="128" width="20" height="20" fill="#2E7D6B"/>
    <rect x="1026" y="128" width="44" height="20" fill="none" stroke="#34495E" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="1122" cy="140" r="30" fill="none" stroke="#B5543B" stroke-width="3" stroke-dasharray="5 3"/>
    <circle cx="1122" cy="140" r="21" fill="none" stroke="#B5543B" stroke-width="1.5"/>
    <text x="1122" y="145" font-size="11" font-weight="700" fill="#B5543B" text-anchor="middle" letter-spacing="1">07·23</text>
  </g>

  <!-- timeline: 07-23=225, 07-30=347.5, 08-20=592.5, 09-03=850 (21.25/day) -->
  <line x1="150" y1="330" x2="900" y2="330" stroke="url(#axis)" stroke-width="4" stroke-linecap="round"/>
  <text class="b" x="150" y="356">07-23</text>
  <text class="b" x="900" y="356" text-anchor="end">09-03</text>

  <g>
    <circle cx="225" cy="330" r="10" fill="#FFFFFF" stroke="#B5543B" stroke-width="3.5"/>
    <line x1="225" y1="318" x2="225" y2="284" stroke="#D9A38F"/>
    <text class="ev" x="225" y="262">07-23 · Salesforce</text>
    <text class="evs" x="225" y="282">回复自动挂引用</text>

    <circle cx="225" cy="330" r="0" fill="none"/>
    <circle cx="347.5" cy="330" r="10" fill="#FFFFFF" stroke="#E0B158" stroke-width="3.5"/>
    <line x1="347.5" y1="342" x2="347.5" y2="376" stroke="#E5CB94"/>
    <text class="ev" x="347.5" y="404">07-23 · Snowflake</text>
    <text class="evs" x="347.5" y="424">未过证据校验即拦截</text>

    <circle cx="470" cy="330" r="10" fill="#FFFFFF" stroke="#2E7D6B" stroke-width="3.5"/>
    <line x1="470" y1="318" x2="470" y2="284" stroke="#8FBFB2"/>
    <text class="ev" x="470" y="262">07-30 · AIG</text>
    <text class="evs" x="470" y="282">抽取字段点开溯源</text>

    <circle cx="592.5" cy="330" r="10" fill="#FFFFFF" stroke="#34495E" stroke-width="3.5"/>
    <line x1="592.5" y1="342" x2="592.5" y2="376" stroke="#93A2B3"/>
    <text class="ev" x="592.5" y="404">08-20 · Capital One</text>
    <text class="evs" x="592.5" y="424">输出打可靠性标签</text>

    <circle cx="850" cy="330" r="10" fill="url(#sealgrad)"/>
    <line x1="850" y1="318" x2="850" y2="284" stroke="#D9A38F"/>
    <text class="ev" x="850" y="262" text-anchor="end">09-03 · DeepMind</text>
    <text class="evs" x="850" y="282" text-anchor="end">行内证据写进答案</text>
  </g>
  <circle cx="150" cy="452" r="6" fill="url(#sealgrad)"/><text class="b" x="162" y="457">最新一件</text>
  <circle cx="248" cy="452" r="6" fill="#FFFFFF" stroke="#B5543B" stroke-width="2.5"/><text class="b" x="260" y="457">公开申请</text>

  <!-- third-party chip -->
  <g>
    <rect x="640" y="428" width="380" height="46" rx="10" fill="#2E7D6B" opacity="0.08"/>
    <rect x="640" y="428" width="5" height="46" rx="2.5" fill="#2E7D6B"/>
    <text x="662" y="449" font-size="13" font-weight="700" fill="#20604F">大厂圈生成侧，中立质检空着</text>
    <text x="662" y="467" font-size="12.5" fill="#6B6152">第三方逐句核验，天然不属于任何模型厂商</text>
  </g>

  <!-- opportunity cards -->
  <g>
    <rect x="64" y="492" width="336" height="140" rx="18" fill="#B5543B" opacity="0.08"/>
    <rect x="64" y="492" width="336" height="6" rx="3" fill="#B5543B"/>
    <rect x="92" y="522" width="44" height="28" rx="5" fill="#B5543B"/>
    <circle cx="114" cy="536" r="7" fill="#FBF6EC"/>
    <text class="stat" x="152" y="554">2000–6000 元<tspan class="unit"> /次</tspan></text>
    <text class="evs" x="92" y="596">答案证据审计服务</text>

    <rect x="432" y="492" width="336" height="140" rx="18" fill="#E0B158" opacity="0.14"/>
    <rect x="432" y="492" width="336" height="6" rx="3" fill="#C79338"/>
    <rect x="460" y="522" width="44" height="28" rx="14" fill="#C79338"/>
    <circle cx="482" cy="536" r="6" fill="#FBF6EC"/>
    <text class="stat" x="520" y="554">$10–20<tspan class="unit"> /月</tspan></text>
    <text class="evs" x="460" y="596">质检插件按席位/项目订阅</text>

    <rect x="800" y="492" width="336" height="140" rx="18" fill="#2E7D6B" opacity="0.08"/>
    <rect x="800" y="492" width="336" height="6" rx="3" fill="#2E7D6B"/>
    <path d="M 828 552 l 10 -26 l 16 12 z" fill="#2E7D6B"/>
    <circle cx="846" cy="530" r="4" fill="#D5E8E1"/>
    <text class="stat" x="888" y="554">1.56 万<tspan class="unit"> star</tspan></text>
    <text class="evs" x="828" y="596">ragas 只做事后打分</text>
  </g>

  <text class="b" x="64" y="662">以上均为申请公开，不等于已授权 · 观点仅为机会判断，不构成投资建议 · Micropaper</text>
</svg>
