<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="1200" height="560" fill="#FFFFFF"/>
<text x="600" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#1F2937">2022-2023 编排群像：三条线并行，不是单线进化</text>
<g font-size="14">
<rect x="60" y="90" width="350" height="130" rx="10" fill="#EAF2FB" stroke="#2F6FB2" stroke-width="2"/>
<text x="235" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">线一 · 规划先行（机器人）</text>
<text x="235" y="150" text-anchor="middle" fill="#374151">2022-04 SayCan：提议 + affordance 可行性打分</text>
<text x="235" y="176" text-anchor="middle" fill="#374151">2022-09 ProgPrompt：情境任务程序 = 计划</text>
<text x="235" y="202" text-anchor="middle" fill="#6B7280">先提议后验证的骨架在此齐备</text>
<rect x="425" y="90" width="350" height="130" rx="10" fill="#EAF6EF" stroke="#166534" stroke-width="2"/>
<text x="600" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#14532D">线二 · 临场反应</text>
<text x="600" y="150" text-anchor="middle" fill="#374151">2022-10 ReAct：推理与行动交替</text>
<text x="600" y="176" text-anchor="middle" fill="#374151">牺牲全局结构，换每步用上新观察</text>
<text x="600" y="202" text-anchor="middle" fill="#6B7280">不是规划路线的失败品，是另一权衡点</text>
<rect x="790" y="90" width="350" height="130" rx="10" fill="#FDF6E3" stroke="#D1A400" stroke-width="2"/>
<text x="965" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#713F12">线三 · 自我改进</text>
<text x="965" y="150" text-anchor="middle" fill="#374151">2023-03 Reflexion：口头反思进情景记忆</text>
<text x="965" y="176" text-anchor="middle" fill="#374151">下次尝试带着失败笔记上场</text>
<text x="965" y="202" text-anchor="middle" fill="#6B7280">Evaluator / Monitor 组件的概念祖先</text>
</g>
<g font-size="15">
<rect x="200" y="260" width="360" height="96" rx="10" fill="#F3F4F6" stroke="#1F2937" stroke-width="2"/>
<text x="380" y="292" text-anchor="middle" font-weight="700" fill="#1F2937">2023-05 Plan-and-Solve</text>
<text x="380" y="320" text-anchor="middle" fill="#374151">提示层补「先列计划」</text>
<text x="380" y="342" text-anchor="middle" fill="#6B7280">只认领漏步错误一类战果</text>
<rect x="640" y="260" width="360" height="96" rx="10" fill="#F3F4F6" stroke="#1F2937" stroke-width="2"/>
<text x="820" y="292" text-anchor="middle" font-weight="700" fill="#1F2937">2023-10 LATS 树搜索</text>
<text x="820" y="320" text-anchor="middle" fill="#374151">全局与反应强行合体</text>
<text x="820" y="342" text-anchor="middle" fill="#6B7280">按分支数付 token 的账</text>
</g>
<defs><marker id="m1" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#C0392B"/></marker></defs>
<line x1="235" y1="220" x2="330" y2="258" stroke="#C0392B" stroke-width="2" marker-end="url(#m1)"/>
<line x1="600" y1="220" x2="640" y2="290" stroke="#C0392B" stroke-width="2" marker-end="url(#m1)"/>
<line x1="965" y1="220" x2="870" y2="258" stroke="#C0392B" stroke-width="2" marker-end="url(#m1)"/>
<rect x="150" y="405" width="900" height="100" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="600" y="440" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">「从 ReAct 到 PI 的范式转移」的真实版本：</text>
<text x="600" y="468" text-anchor="middle" font-size="15" fill="#374151">2022 年就摆开的三个组件（可行性打分 · 程序化计划 · 反思回路），</text>
<text x="600" y="492" text-anchor="middle" font-size="15" fill="#374151">在 2024-2025 被装进同一个 SDK 的默认图结构</text>
</svg>
