<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">Genie 3 输出 720p、24 帧/秒，一致性从 Genie 2 的约 10 秒延长到数分钟，且为通用环境实时交互</text>

  <!-- ===== panel a: consistency duration (position axis) ===== -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">世界状态一致性时长（定性序列位置轴）</text>

  <!-- track -->
  <line x1="180" y1="300" x2="1020" y2="300" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="180" y1="300" x2="180" y2="304"/>
    <line x1="460" y1="300" x2="460" y2="304"/>
    <line x1="740" y1="300" x2="740" y2="304"/>
    <line x1="1020" y1="300" x2="1020" y2="304"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="180" y="324">秒级</text>
    <text x="460" y="324">分钟级</text>
    <text x="740" y="324">十分钟级</text>
    <text x="1020" y="324">小时级</text>
  </g>
  <text x="600" y="352" font-size="14" fill="#1A1B1E" text-anchor="middle">一致性持续时长（正文未给出实测秒数，按序列位置标注）</text>
  <text x="1040" y="304" font-size="12.5" fill="#555" text-anchor="start">训练需数小时</text>

  <!-- markers -->
  <!-- Genie 2 ~10 s -->
  <circle cx="220" cy="300" r="8" fill="none" stroke="#999999" stroke-width="2"/>
  <text x="220" y="248" font-size="12.5" fill="#1A1B1E" text-anchor="middle">Genie 2</text>
  <text x="220" y="266" font-size="12" fill="#555" text-anchor="middle">约 10 秒，非实时</text>
  <!-- Genie 3 minutes -->
  <circle cx="440" cy="300" r="9" fill="#D55E00"/>
  <text x="440" y="200" font-size="12.5" fill="#1A1B1E" text-anchor="middle">Genie 3</text>
  <text x="440" y="218" font-size="12" fill="#555" text-anchor="middle">数分钟，实时</text>
  <line x1="440" y1="228" x2="440" y2="288" stroke="#999999" stroke-width="0.75"/>

  <text x="180" y="392" font-size="12" fill="#555">GameNGen：实时，但仅针对 Doom 这类特定环境；Genie 3 为通用环境的完全实时交互。</text>

  <!-- ===== panel b: output spec and memory ===== -->
  <text x="60" y="450" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="450" font-size="15" fill="#1A1B1E">Genie 3 发布参数</text>
  <g font-size="13" fill="#1A1B1E">
    <text x="300" y="446">分辨率</text>
    <text x="420" y="446">720p</text>
    <text x="560" y="446">帧率</text>
    <text x="660" y="446">24 帧/秒</text>
    <text x="820" y="446">短期记忆</text>
    <text x="940" y="446">约 1 分钟场景上下文</text>
  </g>
  <g font-size="12" fill="#555">
    <text x="300" y="480">发布：2025 年 8 月 5 日（Google DeepMind）</text>
    <text x="300" y="500">Project Genie 实验原型后续面向 AI Ultra 订阅用户开放</text>
    <text x="300" y="520">自回归逐帧生成：每帧基于历史帧与用户最新动作预测下一帧，无显式 3D 表示</text>
  </g>

  <!-- ===== panel c: limitations ===== -->
  <text x="60" y="562" font-size="15" font-weight="bold" fill="#1A1B1E">c</text>
  <text x="82" y="562" font-size="15" fill="#1A1B1E">论文自述局限</text>
  <g font-size="12" fill="#555">
    <text x="300" y="558">交互时长仅数分钟，训练需要数小时</text>
    <text x="700" y="558">代理可执行动作范围受限</text>
    <text x="300" y="580">物理模拟不完美（如雪与滑雪者互动）</text>
    <text x="700" y="580">难以建模多智能体复杂交互</text>
  </g>

  <!-- footnote -->
  <text x="60" y="646" font-size="11" fill="#767676">数据：DeepMind 官方博客与 Genie 3 官方页面（研究预览状态，不公开发布）· 正文未报告一致性时长实测数值，a 面板为定性序列位置轴 · 参数为官方自述口径</text>
</svg>
