  <circle cx="810" cy="343.6" r="5" fill="#FFFFFF" stroke="#56B4E9" stroke-width="2"/>
  <circle cx="1020" cy="245.2" r="5" fill="#56B4E9"/>
  <circle cx="810" cy="407.2" r="5" fill="#FFFFFF" stroke="#009E73" stroke-width="2"/>
  <circle cx="1020" cy="407.2" r="5" fill="#009E73"/>
  <g font-size="12" fill="#555555">
    <text x="822" y="338">树 144</text>
    <text x="1030" y="239">树 378</text>
    <text x="822" y="400">观察级</text>
    <text x="1032" y="401">日志级</text>
  </g>
  <text x="600" y="280" font-size="14" fill="#555555" text-anchor="middle" transform="rotate(-90 600 280)">评论与讨论规模（条）</text>

  <!-- footnote -->
  <text x="60" y="632" font-size="11" fill="#767676">数据：Hacker News 帖 50352757 / 50354960 等六帖与 GitHub issue #14370 · 分数与全树评论数为 2026-11-04 Algolia items API 实测</text>
  <text x="60" y="650" font-size="11" fill="#767676">Codex 案系用户集体观察（非厂商自认），Postman 案系厂商日志自证 · OpenAI 案口径截至实测日未见厂商公开回应</text>
</svg>
