  <!-- data lines: y = 430 - 0.6*comments -->
  <!-- Codex tree 144 -> 343.6 ; issue 38 -> 407.2 -->
  <polyline points="810,343.6 1020,245.2" fill="none" stroke="#56B4E9" stroke-width="2"/>
  <polyline points="810,407.2 1020,407.2" fill="none" stroke="#009E73" stroke-width="2"/>
