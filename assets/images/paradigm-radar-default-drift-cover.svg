    <text x="140" y="197.3">800</text>
    <text x="140" y="69">1200</text>
  </g>

  <!-- bars: y = 450 - 0.32167*points; accent #D55E00 for Postman core event -->
  <rect x="160" y="320.6" width="40" height="129.4" fill="#0072B2"/>
  <rect x="222" y="377.7" width="40" height="72.3" fill="#999999"/>
  <rect x="284" y="255.2" width="40" height="194.8" fill="#999999"/>
  <rect x="346" y="291.8" width="40" height="158.2" fill="#999999"/>
  <rect x="408" y="299.5" width="40" height="150.5" fill="#0072B2"/>
  <rect x="470" y="67.6" width="40" height="382.4" fill="#D55E00"/>

  <!-- value labels -->
  <g font-size="12" fill="#555555" text-anchor="middle">
    <text x="180" y="312">403</text>
    <text x="242" y="369.7">225</text>
    <text x="304" y="247.2">606</text>
    <text x="366" y="283.8">492</text>
    <text x="428" y="291.5">468</text>
    <text x="490" y="59.6" fill="#D55E00" font-weight="bold">1,192</text>
  </g>
  <!-- date labels -->
  <g font-size="12" fill="#555555" text-anchor="middle">
    <text x="180" y="470">10-23</text>
    <text x="242" y="470">10-27</text>
    <text x="304" y="470">10-27</text>
    <text x="366" y="470">10-31</text>
    <text x="428" y="470">11-03</text>
    <text x="490" y="470">11-03</text>
