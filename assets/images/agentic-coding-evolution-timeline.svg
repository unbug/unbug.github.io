<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ecc71"/>
      <stop offset="100%" style="stop-color:#e74c3c"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="160" fill="#1a1a2e" rx="8"/>
  
  <!-- Timeline -->
  <line x1="50" y1="80" x2="750" y2="80" stroke="#4a90d9" stroke-width="3"/>
  
  <!-- Stage boxes -->
  <rect x="60" y="20" width="140" height="120" rx="8" fill="#2c3e50" stroke="#2ecc71" stroke-width="2"/>
  <text x="130" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Stage 1</text>
  <text x="130" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#2ecc71">Code Completion</text>
  <text x="130" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#a0b4c8">GitHub Copilot, Tabnine</text>
  <text x="130" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#a0b4c8">Passive token prediction</text>
  
  <rect x="220" y="20" width="140" height="120" rx="8" fill="#2c3e50" stroke="#3498db" stroke-width="2"/>
  <text x="290" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Stage 2</text>
  <text x="290" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#3498db">Code Chat</text>
  <text x="290" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#a0b4c8">ChatGPT, Copilot Chat</text>
  <text x="290" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#a0b4c8">Text-level suggestions</text>
  
  <rect x="380" y="20" width="140" height="120" rx="8" fill="#2c3e50" stroke="#e67e22" stroke-width="2"/>
  <text x="450" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Stage 3</text>
  <text x="450" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#e67e22">Code Agent</text>
  <text x="450" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#a0b4c8">Aider, OpenHands</text>
  <text x="450" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#a0b4c8">File system + terminal</text>
  
  <rect x="540" y="20" width="140" height="120" rx="8" fill="#2c3e50" stroke="#e74c3c" stroke-width="2"/>
  <text x="610" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Stage 4</text>
  <text x="610" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#e74c3c">Autonomous Engineer</text>
  <text x="610" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#a0b4c8">Claude Code, Cursor</text>
  <text x="610" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#a0b4c8">Full plan-execute-verify</text>
  
  <!-- Arrow labels -->
  <text x="210" y="75" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#4a90d9">+</text>
  <text x="370" y="75" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#4a90d9">+</text>
  <text x="530" y="75" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#e74c3c">++</text>
  
  <!-- Key metric -->
  <rect x="280" y="130" width="240" height="22" rx="4" fill="#0f3460"/>
  <text x="400" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#ffffff">SWE-bench Verified: &lt;6% → 70%+ (8x growth)</text>
</svg>
