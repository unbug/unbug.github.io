<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Noto Serif SC','Songti SC','STSong',serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9A937F; }
      .rl { font-size: 15px; fill: #5F5A4C; }
      .val { font-size: 17px; font-weight: 700; }
      .b { font-size: 12.5px; fill: #A29C88; }
      .tick { font-size: 12.5px; fill: #A29C88; }
    </style>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E8C72"/><stop offset="1" stop-color="#57B894"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9892F"/><stop offset="1" stop-color="#E0B85C"/>
    </linearGradient>
    <linearGradient id="gSlate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D5A73"/><stop offset="1" stop-color="#7392AC"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5442E"/><stop offset="1" stop-color="#D06A4A"/>
    </linearGradient>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D4AA8"/><stop offset="1" stop-color="#9678C9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#FBFAF7"/>
  <circle cx="1104" cy="112" r="130" fill="#6D4AA8" opacity="0.10"/>
  <circle cx="88" cy="616" r="120" fill="#1E8C72" opacity="0.09"/>
  <circle cx="1150" cy="566" r="96" fill="#B9892F" opacity="0.08"/>
  <rect x="64" y="44" width="44" height="5" fill="#B5442E"/>

  <text class="k" x="64" y="84">一分钟读论文 NO.203 · ARXIV:2610.35767 · 北京大学 × 北京邮电大学</text>
  <text class="serif" x="64" y="128" font-size="37" font-weight="700" fill="#1A1B1E">答题路线排得越死，越容易漏掉得分点</text>
  <text x="64" y="158" font-size="15.5" fill="#6E6A5C">RCAtlas 上三个中档模型的 PR@1 区间（首答即命中根因的案例占比，论文自测口径）</text>

  <!-- answer sheet with blank boxes, right motif -->
  <g>
    <rect x="942" y="66" width="176" height="104" fill="#FFFFFF" stroke="#E5E1D4"/>
    <rect x="942" y="66" width="176" height="20" fill="#6D4AA8" opacity="0.10"/>
    <text class="serif" x="956" y="81" font-size="12" fill="#6D4AA8">RCAtlas 题面 · 90 案例</text>
<g fill="none" stroke="#C9C2AE" stroke-width="1.4">
      <rect x="956" y="100" width="26" height="18"/>
      <rect x="990" y="100" width="26" height="18"/>
      <rect x="1024" y="100" width="26" height="18"/>
      <rect x="1058" y="100" width="26" height="18"/>
      <rect x="1092" y="100" width="26" height="18"/>
      <rect x="956" y="128" width="26" height="18"/>
      <rect x="990" y="128" width="26" height="18"/>
      <rect x="1024" y="128" width="26" height="18"/>
      <rect x="1058" y="128" width="26" height="18"/>
      <rect x="1092" y="128" width="26" height="18"/>
    </g>
    <g fill="none" stroke="#1E8C72" stroke-width="2.2" stroke-linecap="round">
      <path d="M 960 106 l 5 5 l 10 -11"/>
      <path d="M 994 134 l 5 5 l 10 -11"/>
    </g>
    <g fill="none" stroke="#B5442E" stroke-width="2.2" stroke-linecap="round">
      <path d="M 1029 103 l 12 12 M 1041 103 l -12 12"/>
      <path d="M 1096 131 l 12 12 M 1108 131 l -12 12"/>
    </g>
    <path d="M 950 156 h 160" stroke="#B5442E" stroke-width="2" opacity="0.55"/>
    <text class="b" x="942" y="188">8 个公开数据集拼装 · 6 模型 × 3 档推理努力</text>
  </g>

  <!-- chart frame -->
  <g>
    <!-- 70% gridline highlight -->
    <rect x="405" y="210" width="14" height="360" fill="#1E8C72" opacity="0.05"/>
    <g stroke="#EAE6DA" stroke-width="1">
      <line x1="180" y1="210" x2="180" y2="570"/>
      <line x1="285" y1="210" x2="285" y2="570"/>
      <line x1="390" y1="210" x2="390" y2="570"/>
      <line x1="495" y1="210" x2="495" y2="570"/>
      <line x1="600" y1="210" x2="600" y2="570"/>
      <line x1="705" y1="210" x2="705" y2="570"/>
      <line x1="810" y1="210" x2="810" y2="570"/>
    </g>
    <g class="tick" text-anchor="middle">
      <text x="180" y="594">0%</text>
      <text x="285" y="594">20%</text>
      <text x="390" y="594">40%</text>
      <text x="495" y="594">60%</text>
      <text x="600" y="594">80%</text>
      <text x="705" y="594">100%</text>
    </g>

    <!-- NSigma 38.9% reference -->
    <line x1="456.75" y1="196" x2="456.75" y2="570" stroke="#B5442E" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="456.75" y="188" text-anchor="middle" font-size="13" fill="#B5442E">最佳非 LLM 方法 NSigma：38.9%</text>

    <!-- band rows (7% tint) -->
    <rect x="100" y="228" width="740" height="84" fill="#1E8C72" opacity="0.07"/>
    <rect x="100" y="348" width="740" height="84" fill="#B9892F" opacity="0.08"/>
    <rect x="100" y="468" width="740" height="84" fill="#3D5A73" opacity="0.06"/>

    <!-- row 1: simple harnesses 65-77% -->
    <text class="serif" x="100" y="252" font-size="16.5" font-weight="700" fill="#1A1B1E">简单 harness（不规定调用流程）</text>
    <text class="b" x="100" y="272">一次调用读证据包 · SQL agent · Codex coding agent</text>
    <rect x="528.75" y="290" width="151.5" height="12" fill="url(#gTeal)"/>
    <circle cx="528.75" cy="296" r="9" fill="url(#gTeal)"/>
    <circle cx="680.25" cy="296" r="9" fill="url(#gTeal)"/>
    <text class="val" x="694" y="301" fill="#1E8C72">65-77%</text>

    <!-- row 2: published agents 16-53% -->
    <text class="serif" x="100" y="372" font-size="16.5" font-weight="700" fill="#1A1B1E">已发表 RCA agent（手工编排）</text>
    <text class="b" x="100" y="392">五个方法 · 把十分之一到全部的模型调用写死在程序里</text>
    <rect x="292.8" y="410" width="310.5" height="12" fill="url(#gAmber)"/>
    <circle cx="292.8" cy="416" r="9" fill="url(#gAmber)"/>
    <circle cx="603.3" cy="416" r="9" fill="url(#gAmber)"/>
    <text class="val" x="617" y="421" fill="#9A731F">16-53%</text>

    <!-- row 3: non-LLM 6-39% -->
    <text class="serif" x="100" y="492" font-size="16.5" font-weight="700" fill="#1A1B1E">统计 / 因果方法（非 LLM）</text>
    <text class="b" x="100" y="512">全库统计与因果方法族</text>
    <rect x="228.6" y="530" width="295.95" height="12" fill="url(#gSlate)"/>
    <circle cx="228.6" cy="536" r="9" fill="url(#gSlate)"/>
    <circle cx="524.55" cy="536" r="9" fill="url(#gSlate)"/>
    <text class="val" x="538" y="541" fill="#3D5A73">6-39%</text>
  </g>

  <!-- side annotations -->
  <g>
    <text class="serif" x="872" y="252" font-size="15" font-weight="700" fill="#1E8C72">每条成本/时间 Pareto 最优</text>
    <text class="serif" x="872" y="272" font-size="15" fill="#5F5A4C">的运行都出自这一族</text>
    <path d="M 872 286 v 16" stroke="#1E8C72" stroke-width="1.4"/>

    <text class="serif" x="872" y="392" font-size="15" fill="#5F5A4C">写死的步骤会跳过</text>
    <text class="serif" x="872" y="412" font-size="15" fill="#5F5A4C">决定性证据</text>

    <text class="serif" x="872" y="512" font-size="15" fill="#5F5A4C">推理努力加满：</text>
    <text class="serif" x="872" y="532" font-size="15" fill="#5F5A4C">时间最多乘以七</text>
  </g>

  <line x1="64" y1="620" x2="1136" y2="620" stroke="#E5E1D4"/>
  <text class="b" x="64" y="646">来源：arXiv:2610.35767 · 论文自测口径 · 预印本未经同行评审 · 区间为三个中档模型上的 PR@1 跨度</text>
</svg>
