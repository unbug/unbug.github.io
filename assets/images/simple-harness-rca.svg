<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">RCAtlas 上简单 harness 的 PR@1 区间（65–77%）整体高于已发表 RCA agent（16–53%）与非 LLM 方法（6–39%）</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">三族方法的 PR@1 区间（%，三个中档模型上的跨度）</text>

  <!-- vertical gridlines at axis ticks -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="260" y1="130" x2="260" y2="420"/>
    <line x1="445" y1="130" x2="445" y2="420"/>
    <line x1="630" y1="130" x2="630" y2="420"/>
    <line x1="815" y1="130" x2="815" y2="420"/>
    <line x1="1000" y1="130" x2="1000" y2="420"/>
  </g>

  <!-- NSigma reference line: x = 260 + 9.25*v ; 38.9 -> 619.8 -->
  <line x1="619.8" y1="130" x2="619.8" y2="420" stroke="#1A1B1E" stroke-width="0.75" stroke-dasharray="5 4"/>
  <text x="619.8" y="122" font-size="12" fill="#555" text-anchor="middle">最佳非 LLM 方法 NSigma：PR@1 38.9%</text>

  <!-- rows: x = 260 + 9.25*v -->
  <!-- simple harnesses 65-77 -->
  <text x="248" y="171" font-size="12.5" fill="#1A1B1E" text-anchor="end">简单 harness（不规定调用流程）</text>
  <rect x="861.25" y="157" width="111" height="18" fill="#0072B2"/>
  <line x1="861.25" y1="154" x2="861.25" y2="178" stroke="#0072B2" stroke-width="0.75"/>
  <line x1="972.25" y1="154" x2="972.25" y2="178" stroke="#0072B2" stroke-width="0.75"/>
  <text x="980" y="171" font-size="12" fill="#555">65–77%</text>
  <text x="248" y="189" font-size="11" fill="#767676" text-anchor="end">一次调用读证据包 · SQL agent · Codex coding agent</text>

  <!-- published agents 16-53 -->
  <text x="248" y="264" font-size="12.5" fill="#1A1B1E" text-anchor="end">已发表 RCA agent（手工编排）</text>
  <rect x="408" y="250" width="342.25" height="18" fill="#E69F00"/>
  <line x1="408" y1="247" x2="408" y2="271" stroke="#E69F00" stroke-width="0.75"/>
  <line x1="750.25" y1="247" x2="750.25" y2="271" stroke="#E69F00" stroke-width="0.75"/>
  <text x="758" y="264" font-size="12" fill="#555">16–53%</text>
  <text x="248" y="282" font-size="11" fill="#767676" text-anchor="end">五个方法 · 把十分之一到全部的模型调用写死在程序里</text>

  <!-- non-LLM 6-39 -->
  <text x="248" y="357" font-size="12.5" fill="#1A1B1E" text-anchor="end">统计 / 因果方法（非 LLM）</text>
  <rect x="315.5" y="343" width="305.25" height="18" fill="#999999"/>
  <line x1="315.5" y1="340" x2="315.5" y2="364" stroke="#999999" stroke-width="0.75"/>
  <line x1="620.75" y1="340" x2="620.75" y2="364" stroke="#999999" stroke-width="0.75"/>
  <text x="629" y="357" font-size="12" fill="#555">6–39%</text>

  <!-- value axis -->
  <line x1="260" y1="420" x2="1000" y2="420" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="260" y1="420" x2="260" y2="424"/>
    <line x1="445" y1="420" x2="445" y2="424"/>
    <line x1="630" y1="420" x2="630" y2="424"/>
    <line x1="815" y1="420" x2="815" y2="424"/>
    <line x1="1000" y1="420" x2="1000" y2="424"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="260" y="440">0</text>
    <text x="445" y="440">20</text>
    <text x="630" y="440">40</text>
    <text x="815" y="440">60</text>
    <text x="1000" y="440">80</text>
  </g>
  <text x="630" y="464" font-size="14" fill="#1A1B1E" text-anchor="middle">PR@1（%，首个答案即命中根因的案例占比）</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="512" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="512" font-size="15" fill="#1A1B1E">补充口径：成本侧与模型侧</text>
  <g font-size="12" fill="#555">
    <text x="82" y="540">成本侧：准确率超过 NSigma（PR@1 38.9%）的运行中，成本或时间 Pareto 最优的每一条都是简单 harness；七个达标的发表 agent 运行（43–63%）全被不更贵或不更慢的 harness 在准确率上压过。</text>
    <text x="82" y="562">模型侧：从 Luna 到 Sol，能力分 A 仅上升 2–7 个百分点，不稳定分 U 从 32–36 降到 7–8；多轮 harness 较一次调用至少多解出 10–11 个百分点；推理努力加满，准确率只变几个点，时间最多乘以七。</text>
  </g>

  <!-- footnote -->
  <text x="60" y="620" font-size="11" fill="#767676">数据：arXiv:2610.35767（RCAtlas：8 个公开数据集拼装 90 个验证案例，6 模型 × 3 档推理努力）· 区间为论文自测口径在三个中档模型上的跨度 · 四个发表 agent 为论文按原文重新实现 · 预印本未经同行评审</text>
</svg>
