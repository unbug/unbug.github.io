<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">自动化与增强两种角色的模型级排名 Spearman 相关仅 0.48（p=0.187）；5/7 任务两种角色的冠军不同</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">两种角色排名的排名相关（Spearman ρ，报告值直接标注）</text>

  <!-- rows: bars proportional to reported rho; only three rho values disclosed in body, no numeric axis -->
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="288" y="163">报税（任务级）</text>
    <text x="288" y="213">模型级（全部任务）</text>
    <text x="288" y="263">旅行规划（任务级）</text>
  </g>
  <rect x="300" y="147" width="204" height="18" fill="#0072B2"/>
  <text x="513" y="163" font-size="12" fill="#555">0.85（p=0.004，唯一通过 Bonferroni 校正）</text>
  <rect x="300" y="197" width="115.2" height="18" fill="#D55E00"/>
  <text x="424" y="213" font-size="12" fill="#555">0.48（p=0.187，与零不可区分）</text>
  <!-- -0.04: negative, drawn left of zero line as small marker -->
  <line x1="290.4" y1="249" x2="300" y2="249" stroke="#999999" stroke-width="1.5"/>
  <line x1="290.4" y1="249" x2="290.4" y2="263" stroke="#999999" stroke-width="1.5"/>
  <text x="308" y="263" font-size="12" fill="#555">-0.04（任务级最低值）</text>
  <text x="300" y="300" font-size="12" fill="#555">任务级 ρ 从 -0.04（旅行规划）到 0.85（报税）不等，</text>
  <text x="300" y="318" font-size="12" fill="#555">其余任务级数值正文未披露；5/7 任务两种角色的冠军不是同一模型</text>

  <!-- ============ panel b ============ -->
  <text x="730" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="752" y="104" font-size="15" fill="#1A1B1E">平均排名反转案例（10 次重复平均，1 为最佳）</text>

  <text x="885" y="132" font-size="12" fill="#555" text-anchor="middle">自动化</text>
  <text x="1090" y="132" font-size="12" fill="#555" text-anchor="middle">增强</text>
  <g stroke="#999999" stroke-width="1.5">
    <line x1="885" y1="144" x2="885" y2="364"/>
    <line x1="1090" y1="144" x2="1090" y2="364"/>
  </g>
  <!-- slope plot: rank axis top-anchored, linear 30px per rank -->
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="881" y1="150" x2="885" y2="150"/>
    <line x1="881" y1="240" x2="885" y2="240"/>
    <line x1="881" y1="330" x2="885" y2="330"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="874" y="154">1</text>
    <text x="874" y="244">4</text>
    <text x="874" y="334">7</text>
  </g>
  <text x="852" y="254" font-size="14" fill="#1A1B1E" text-anchor="middle" transform="rotate(-90 852 254)">平均排名（1 为最佳）</text>

  <!-- Claude-Opus-4.8: 2.05 -> 8.15 -->
  <line x1="885" y1="181.5" x2="1090" y2="364.5" stroke="#D55E00" stroke-width="2"/>
  <circle cx="885" cy="181.5" r="5" fill="#D55E00"/>
  <circle cx="1090" cy="364.5" r="5" fill="#D55E00"/>
  <text x="896" y="176" font-size="12" fill="#555">2.05</text>
  <text x="1101" y="369" font-size="12" fill="#555">8.15</text>
  <text x="905" y="298" font-size="12" fill="#1A1B1E">市场趋势 · Claude-Opus-4.8</text>

  <!-- GPT-4.1: 7.40 -> 3.80 -->
  <line x1="885" y1="342" x2="1090" y2="234" stroke="#0072B2" stroke-width="2"/>
  <circle cx="885" cy="342" r="5" fill="#0072B2"/>
  <circle cx="1090" cy="234" r="5" fill="#0072B2"/>
  <text x="896" y="352" font-size="12" fill="#555">7.40</text>
  <text x="1101" y="239" font-size="12" fill="#555">3.80</text>
  <text x="905" y="212" font-size="12" fill="#1A1B1E">咨询 · GPT-4.1</text>
  <text x="905" y="228" font-size="11" fill="#767676">3.80 为所有受助条件最佳</text>

  <text x="730" y="410" font-size="12" fill="#555">无指导基线在 3/7 任务排第一；增强整体平均排名：</text>
  <text x="730" y="428" font-size="12" fill="#555">GPT-5-Mini 3.66，无指导基线 3.79</text>

  <!-- footnote -->
  <text x="60" y="560" font-size="11" fill="#767676">数据：arXiv:2608.18554v1（9 助手模型 × 7 任务 × 10 次重复，排名为 10 次重复平均，论文自测口径）· a 面板仅画正文披露的 ρ 值，未设数值轴 · 论文自称 pilot 研究，预印本未经同行评审</text>
</svg>
