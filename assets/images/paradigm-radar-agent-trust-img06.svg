<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <text x="60" y="58" font-size="16" fill="#1A1B1E">五主体事件矩阵：Anthropic 占三格（含渠道与权限面），高盛为企业侧回应不入支柱合计</text>

  <!-- ================= panel a: matrix ================= -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">事件 × 涉事主体矩阵（格内为 HN 分数）</text>

  <!-- columns: Anthropic | OpenAI | Microsoft | Goldman(企业侧) ; rows: 7 events -->
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle" font-weight="bold">
    <text x="420" y="140">Anthropic（含渠道与权限面）</text>
    <text x="660" y="140">OpenAI</text>
    <text x="830" y="140">Microsoft</text>
    <text x="1010" y="140">Goldman（企业侧）</text>
  </g>

  <!-- row labels -->
  <g font-size="12" fill="#1A1B1E" text-anchor="end">
    <text x="238" y="177">邮箱经 UA 外发</text>
    <text x="238" y="232">VSX 渠道后门</text>
    <text x="238" y="287">授权模式泄密</text>
    <text x="238" y="342">transcript 上行</text>
    <text x="238" y="397">Codex 训练回滚</text>
    <text x="238" y="452">Win11 Agent 遥测</text>
    <text x="238" y="507">岗位分级收回</text>
  </g>

  <!-- cells: col x 250/500/740/920, width 170/170/150/180 -->
  <!-- r1 Anthropic 1616 accent -->
  <rect x="250" y="155" width="170" height="44" fill="#D55E00"/>
  <text x="335" y="182" font-size="13" fill="#FFFFFF" text-anchor="middle">1,616</text>
  <!-- r2 Anthropic 1014 (attacker on Anthropic channel) -->
  <rect x="250" y="210" width="170" height="44" fill="#0072B2"/>
  <text x="335" y="231" font-size="13" fill="#FFFFFF" text-anchor="middle">1,014</text>
  <text x="335" y="247" font-size="10.5" fill="#FFFFFF" text-anchor="middle">攻击者借 Anthropic 渠道</text>
  <!-- r3 Anthropic 628 -->
  <rect x="250" y="265" width="170" height="44" fill="#0072B2"/>
  <text x="335" y="292" font-size="13" fill="#FFFFFF" text-anchor="middle">628</text>
  <!-- r4 Anthropic 591 -->
  <rect x="250" y="320" width="170" height="44" fill="#0072B2"/>
  <text x="335" y="347" font-size="13" fill="#FFFFFF" text-anchor="middle">591</text>
  <!-- r5 OpenAI 536 -->
  <rect x="575" y="375" width="170" height="44" fill="#0072B2"/>
  <text x="660" y="402" font-size="13" fill="#FFFFFF" text-anchor="middle">536</text>
  <!-- r6 Microsoft 728 -->
  <rect x="755" y="430" width="150" height="44" fill="#0072B2"/>
  <text x="830" y="457" font-size="13" fill="#FFFFFF" text-anchor="middle">728</text>
  <!-- r7 Goldman 905 gray -->
  <rect x="920" y="485" width="180" height="44" fill="#999999"/>
  <text x="1010" y="506" font-size="13" fill="#FFFFFF" text-anchor="middle">905</text>
  <text x="1010" y="522" font-size="10.5" fill="#FFFFFF" text-anchor="middle">企业侧回应，不入合计</text>

  <!-- grid guides -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="250" y1="204" x2="1110" y2="204"/>
    <line x1="250" y1="259" x2="1110" y2="259"/>
    <line x1="250" y1="314" x2="1110" y2="314"/>
    <line x1="250" y1="369" x2="1110" y2="369"/>
    <line x1="250" y1="424" x2="1110" y2="424"/>
    <line x1="250" y1="479" x2="1110" y2="479"/>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#555555">
    <rect x="600" y="150" width="14" height="14" fill="#D55E00"/><text x="622" y="162">簇内最热帖</text>
    <rect x="600" y="176" width="14" height="14" fill="#0072B2"/><text x="622" y="188">支柱帖</text>
    <rect x="600" y="202" width="14" height="14" fill="#999999"/><text x="622" y="214">企业侧（另计）</text>
  </g>

  <!-- ================= panel b ================= -->
  <text x="60" y="564" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="564" font-size="15" fill="#1A1B1E">合计口径</text>
  <text x="220" y="560" font-size="12.5" fill="#1A1B1E">六根支柱合计 5,113 分 = Anthropic 侧四帖 3,849 + OpenAI 与 Microsoft 两帖 1,264</text>
  <text x="220" y="584" font-size="12.5" fill="#555555">高盛 905 分为企业侧回应另计 · 防御侧另有 134 分实践帖与 96 分审计工具（未计入）</text>

  <!-- footer -->
  <text x="60" y="648" font-size="11" fill="#767676">数据：HN Algolia API 全树递归计数（剔除 deleted/dead），实测 2026-11-19 · 邻簇事件（Lovable 泄密、Anthropic 封禁用户、Harvard 审查帖）未并入</text>
</svg>
