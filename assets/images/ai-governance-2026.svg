<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="70" font-size="16" fill="#1A1B1E">2026 年 AI 治理经历 3 大转变：治理从技术合规问题演变为社会韧性的核心支柱</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="118" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="118" font-size="15" fill="#1A1B1E">三大新兴趋势（研究归纳的定性框架，非量化统计）</text>
  <g fill="#D55E00">
    <rect x="60" y="136" width="14" height="14"/>
    <rect x="420" y="136" width="14" height="14"/>
    <rect x="780" y="136" width="14" height="14"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#1A1B1E">
    <text x="60" y="152">趋势 1：去中心化自治治理</text>
    <text x="420" y="152">趋势 2：人类在环成为法律要求</text>
    <text x="780" y="152">趋势 3：社会影响审计制度化</text>
  </g>
  <g font-size="12" fill="#555">
    <text x="60" y="184">基于区块链共识机制，社区为 AI</text>
    <text x="60" y="204">系统制定规则；不再是单一机构</text>
    <text x="60" y="224">决定，而是多方参与的透明决策</text>
    <text x="420" y="184">法规强制要求 AI 决策可审计、</text>
    <text x="420" y="204">可被人类操作员逆转，技术不能</text>
    <text x="420" y="224">脱离人的监督</text>
    <text x="780" y="184">系统评估 AI 对社会不平等、隐私</text>
    <text x="780" y="204">和民主参与的影响；不只看技术</text>
    <text x="780" y="224">性能，更要看社会效益</text>
  </g>

  <line x1="60" y1="318" x2="1140" y2="318" stroke="#D9D9D9" stroke-width="0.5"/>

  <!-- ============ panel b ============ -->
  <text x="60" y="358" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="358" font-size="15" fill="#1A1B1E">治理范式迁移与三类角色的落地动作</text>
  <text x="60" y="392" font-size="13" fill="#1A1B1E">过去：AI 治理 = 技术合规</text>
  <line x1="330" y1="387" x2="410" y2="387" stroke="#D55E00" stroke-width="2"/>
  <polygon points="410,383 420,387 410,391" fill="#D55E00"/>
  <text x="440" y="392" font-size="13" fill="#1A1B1E">现在：AI 治理 = 公共问责 + 社会影响</text>
  <g font-size="15" font-weight="bold" fill="#1A1B1E">
    <text x="60" y="446">开发者</text>
    <text x="420" y="446">政策制定者</text>
    <text x="780" y="446">社区</text>
  </g>
  <g font-size="12" fill="#555">
    <text x="60" y="474">嵌入审计日志与回滚机制，为</text>
    <text x="60" y="494">「可逆转」的法律要求预留技术接口</text>
    <text x="420" y="474">起草社会影响审计立法，</text>
    <text x="420" y="494">把审计结果与市场准入挂钩</text>
    <text x="780" y="474">通过开源治理平台参与规则制定，</text>
    <text x="780" y="494">避免治理权向少数平台集中</text>
  </g>
  <text x="60" y="536" font-size="12" fill="#555">研究提醒：落地取决于审计指标的标准化程度和跨司法辖区的互认机制，否则只增加合规成本而不改善实际风险</text>

  <!-- footnote -->
  <text x="60" y="618" font-size="11" fill="#767676">来源：Future Trends in Global AI Governance（SSRN 预印本，Book Chapter，定性趋势研究）</text>
  <text x="60" y="636" font-size="11" fill="#767676">趋势与建议均为论文自述口径，无数值型实测结果 · 预印本未经同行评审</text>
</svg>
