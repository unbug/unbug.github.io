<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">直接问智能体 93.6% 的任务状态问题能答对，只看例行报告只恢复 52.0%，相差 40.7 个百分点，结案时仍不收敛</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">三种读取方式的任务状态恢复率（%）</text>

  <!-- gridlines horizontal majors at 50, y = 360 - 3*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="140" y1="210" x2="560" y2="210"/>
  </g>
  <!-- 93.6 : h=3*93.6=280.8 -->
  <rect x="175" y="79.2" width="70" height="280.8" fill="#999999"/>
  <text x="210" y="72" font-size="12" fill="#555" text-anchor="middle">93.6</text>
  <text x="210" y="378" font-size="12.5" fill="#1A1B1E" text-anchor="middle">直接问智能体</text>
  <!-- 92.7 : h=278.1 -->
  <rect x="305" y="81.9" width="70" height="278.1" fill="#999999"/>
  <text x="340" y="75" font-size="12" fill="#555" text-anchor="middle">92.7</text>
  <text x="340" y="378" font-size="12.5" fill="#1A1B1E" text-anchor="middle">读完整执行记录</text>
  <!-- 52.0 : h=156 emphasis -->
  <rect x="435" y="204" width="70" height="156" fill="#D55E00"/>
  <text x="470" y="196" font-size="12" fill="#555" text-anchor="middle">52.0</text>
  <text x="470" y="378" font-size="12.5" fill="#1A1B1E" text-anchor="middle">只看报告</text>
  <!-- delta annotation: leader at mean of tops (85.95) and report top (204) -->
  <line x1="505" y1="204" x2="548" y2="204" stroke="#555555" stroke-width="0.75" stroke-dasharray="4 3"/>
  <line x1="375" y1="85.95" x2="548" y2="85.95" stroke="#555555" stroke-width="0.75" stroke-dasharray="4 3"/>
  <line x1="548" y1="85.95" x2="548" y2="204" stroke="#555555" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="560" y="100" font-size="12" fill="#1A1B1E">Δ=40.7 个百分点</text>
  <text x="560" y="116" font-size="11" fill="#767676">（对前两柱均值）</text>
  

  <!-- value axis -->
  <line x1="140" y1="360" x2="560" y2="360" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="140" y1="360" x2="136" y2="360"/>
    <line x1="140" y1="210" x2="136" y2="210"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="130" y="364">0</text>
    <text x="130" y="214">50</text>
  </g>
  <text x="350" y="412" font-size="14" fill="#1A1B1E" text-anchor="middle">任务状态恢复率（%）</text>
  <text x="60" y="436" font-size="12" fill="#555">测量口径：37 个编码任务 × 4,799 个有效探针；这是读取方式的可恢复性对比，不是任务成功率</text>

  <!-- ============ panel b ============ -->
  <text x="660" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="682" y="104" font-size="15" fill="#1A1B1E">报告读者与完整上下文读者的差距（百分点）</text>

  <!-- gridlines vertical at 25/50, x = 800 + 3.2*pp -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="880" y1="126" x2="880" y2="252"/>
    <line x1="960" y1="126" x2="960" y2="252"/>
  </g>
  <!-- full-run gap 40.7 : w=130.24 -->
  <rect x="800" y="137" width="130.24" height="18" fill="#999999"/>
  <text x="808" y="132" font-size="12" fill="#555">40.7 个百分点（全任务）</text>
  <!-- final checkpoint gap 34.8 : w=111.36 emphasis -->
  <rect x="800" y="207" width="111.36" height="18" fill="#D55E00"/>
  <text x="808" y="202" font-size="12" fill="#555">34.8 个百分点（30 个已验证修复的最终检查点）</text>

  <!-- value axis -->
  <line x1="800" y1="252" x2="1000" y2="252" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="800" y1="252" x2="800" y2="256"/>
    <line x1="880" y1="252" x2="880" y2="256"/>
    <line x1="960" y1="252" x2="960" y2="256"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="800" y="272">0</text>
    <text x="880" y="272">25</text>
    <text x="960" y="272">50</text>
  </g>
  <text x="900" y="296" font-size="14" fill="#1A1B1E" text-anchor="middle">恢复率差距（百分点）</text>
  <text x="660" y="326" font-size="12" fill="#555">差距不随任务收尾消失：结案检查点上仍有 34.8 个点</text>

  <!-- ============ panel c ============ -->
  <text x="660" y="378" font-size="15" font-weight="bold" fill="#1A1B1E">c</text>
  <text x="682" y="378" font-size="15" fill="#1A1B1E">补救路线后的报告读者恢复率（%）</text>

  <!-- gridlines horizontal at 50, y = 580 - 3*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="740" y1="430" x2="940" y2="430"/>
  </g>
  <!-- 73.6 : h=220.8, y=359.2 -->
  <rect x="765" y="359.2" width="70" height="220.8" fill="#0072B2"/>
  <text x="800" y="351" font-size="12" fill="#555" text-anchor="middle">73.6</text>
  <text x="800" y="614" font-size="12.5" fill="#1A1B1E" text-anchor="middle">终端完整回滚内容</text>
  <!-- 52.0 baseline : h=156, y=424 -->
  <rect x="875" y="424" width="70" height="156" fill="#999999"/>
  <text x="910" y="416" font-size="12" fill="#555" text-anchor="middle">52.0</text>
  <text x="910" y="614" font-size="12.5" fill="#1A1B1E" text-anchor="middle">无补救（基线）</text>
  <text x="660" y="452" font-size="12" fill="#555">补救后 73.6，仍明显低于完整上下文读者的 92.7</text>
  <text x="660" y="530" font-size="12" fill="#555">上下文信息重写（报告长度对齐）</text>
  <text x="660" y="548" font-size="12" fill="#555">只抬升约 8 个点；针对性提示重写</text>
  <text x="660" y="566" font-size="12" fill="#555">相对自然重写无可检测优势</text>

  <!-- value axis -->
  <line x1="740" y1="580" x2="940" y2="580" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="740" y1="580" x2="736" y2="580"/>
    <line x1="740" y1="430" x2="736" y2="430"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="730" y="584">0</text>
    <text x="730" y="434">50</text>
  </g>
  <text x="676" y="612" font-size="14" fill="#1A1B1E">恢复率（%）</text>

  <!-- footnote -->
  <text x="60" y="662" font-size="11" fill="#767676">数据：arXiv:2610.20003（37 任务 × 4,799 探针，论文自测口径）· 缺口最大类别为状态被提及但缺支撑细节 · 差距跨 harness 持续存在并在独立 DeepSeek 链路复现 · 预印本未经同行评审</text>
</svg>
