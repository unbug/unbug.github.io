<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">基准结构决定灵活性是资产还是负担：回溯密集有益，依赖链场景单智能体更高效</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">完全循环子任务图架构（机制示意，非实测数据）</text>

  <!-- fully connected 4-node graph -->
  <g stroke="#999999" stroke-width="1.5">
    <line x1="150" y1="170" x2="490" y2="170"/>
    <line x1="150" y1="170" x2="150" y2="350"/>
    <line x1="150" y1="170" x2="490" y2="350"/>
    <line x1="490" y1="170" x2="150" y2="350"/>
    <line x1="490" y1="170" x2="490" y2="350"/>
    <line x1="150" y1="350" x2="490" y2="350"/>
  </g>
  <g fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5">
    <circle cx="150" cy="170" r="16"/>
    <circle cx="490" cy="170" r="16"/>
    <circle cx="150" cy="350" r="16"/>
    <circle cx="490" cy="350" r="16"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="150" y="174">S1</text>
    <text x="490" y="174">S2</text>
    <text x="150" y="354">S3</text>
    <text x="490" y="354">S4</text>
  </g>
  <text x="320" y="140" font-size="12" fill="#555" text-anchor="middle">节点间完全连接</text>
  <text x="320" y="260" font-size="12" fill="#555" text-anchor="middle">任意子任务可路由到</text>
  <text x="320" y="278" font-size="12" fill="#555" text-anchor="middle">其他任何子任务，无预剪枝</text>

  <!-- notes at right of graph -->
  <text x="560" y="174" font-size="12" fill="#555">统一状态分析器与路由器：按自然语言标准</text>
  <text x="560" y="192" font-size="12" fill="#555">评估滚动轨迹状态，选择子任务间转换，</text>
  <text x="560" y="210" font-size="12" fill="#555">使不受限制的回溯在结构上始终可用</text>

  <text x="560" y="266" font-size="12.5" fill="#1A1B1E">两种实现</text>
  <text x="560" y="290" font-size="12" fill="#555">Spec-Cyc：任务特定图，逐任务定制节点与边</text>
  <text x="560" y="312" font-size="12" fill="#555">Gen-Cyc：基准通用图，跨实例复用，检验</text>
  <text x="560" y="334" font-size="12" fill="#555">循环回溯能否作为可迁移的控制策略</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="416" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="416" font-size="15" fill="#1A1B1E">三个基准上的定性结论（论文无数值结果，序位为报告排序）</text>

  <!-- column headers -->
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="245" y="456">ALFWorld</text>
    <text x="620" y="456">TextCraft</text>
    <text x="995" y="456">Finance-Agent</text>
  </g>

  <!-- column 1: favorable -->
  <rect x="80" y="476" width="330" height="96" fill="#D55E00"/>
  <text x="245" y="502" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">显式回溯显著有益</text>
  <text x="245" y="524" font-size="12" fill="#FFFFFF" text-anchor="middle">部分可观察、交互密集的环境，</text>
  <text x="245" y="542" font-size="12" fill="#FFFFFF" text-anchor="middle">支持从不准确定位中恢复与探索</text>

  <!-- column 2: overhead -->
  <rect x="455" y="476" width="330" height="96" fill="none" stroke="#999999" stroke-width="1.5"/>
  <text x="620" y="502" font-size="13" font-weight="bold" fill="#1A1B1E" text-anchor="middle">灵活性成为协调开销</text>
  <text x="620" y="524" font-size="12" fill="#555" text-anchor="middle">前置依赖链式领域，识别正确链后</text>
  <text x="620" y="542" font-size="12" fill="#555" text-anchor="middle">顺序执行即可，单智能体 ReAct 往往更高效</text>

  <!-- column 3: bottleneck -->
  <rect x="830" y="476" width="330" height="96" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="995" y="502" font-size="13" font-weight="bold" fill="#1A1B1E" text-anchor="middle">瓶颈在检索而非灵活性</text>
  <text x="995" y="524" font-size="12" fill="#555" text-anchor="middle">开放世界、证据密集型任务，所有方法</text>
  <text x="995" y="542" font-size="12" fill="#555" text-anchor="middle">成功率均较低，灵活性仅带来有限改善</text>

  <!-- cost note -->
  <text x="80" y="606" font-size="12" fill="#555">成本口径：三个基准上完全循环图方法的 Token 消耗均显著高于单智能体 ReAct（共享胜利 Token 比较，方向性结论）；较弱模型（gpt-4o-mini）上灵活性收益更明显。</text>

  <!-- footnote (two lines) -->
  <text x="60" y="648" font-size="11" fill="#767676">数据：arXiv:2604.22820（黎巴嫩美国大学）· 正文未给出各基准的具体成功率或 Token 数值，本图为序位轴与机制示意，</text>
  <text x="60" y="666" font-size="11" fill="#767676">面板 b 三列按论文报告的方向性结论排序（有益／开销／受限），不含可回查数值 · 论文自测口径</text>
</svg>
