<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #7E93A0; }
      .rl { font-size: 15px; fill: #3E5560; }
      .b { font-size: 12px; fill: #8FA2AC; }
      .stat { font-size: 27px; font-weight: 700; }
      .val { font-size: 18px; font-weight: 700; }
      .chip { font-size: 12.5px; font-weight: 600; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EDF3F3"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F6DA8"/><stop offset="1" stop-color="#6FA3D4"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F7B8A"/><stop offset="1" stop-color="#4FB8C6"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5442E"/><stop offset="1" stop-color="#E07A52"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9892F"/><stop offset="1" stop-color="#DCB65F"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F7D61"/><stop offset="1" stop-color="#6FB58F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1128" cy="612" r="140" fill="#0F7B8A" opacity="0.06"/>
  <circle cx="84" cy="118" r="110" fill="#2F6DA8" opacity="0.06"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gRed)"/>

  <text class="k" x="64" y="84">一分钟读论文 · 2026-08-26 · ARXIV:2608.22752</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#17303B">水落五次，堤坝见底</text>
  <text x="64" y="158" font-size="15" fill="#5F7683">压缩悬崖：安全规则与情景日志同率摘要，逐字精确被逐轮磨掉</text>

  <!-- dam motif: water level dropping over 5 rounds -->
  <g>
    <path d="M 1006 208 l -44 176 h 176 l -44 -176 z" fill="#3D5A73" opacity="0.14"/>
    <path d="M 1006 208 l -44 176 h 176 l -44 -176 z" fill="none" stroke="#3D5A73" stroke-width="3" opacity="0.55"/>
    <path d="M 986 260 h 112 l -14 -52 h -84 z" fill="url(#gBlue)" opacity="0.75"/>
    <path d="M 1000 316 h 84 l -10 -38 h -64 z" fill="url(#gTeal)" opacity="0.6"/>
    <path d="M 1016 364 h 52 l -8 -28 h -36 z" fill="url(#gGold)" opacity="0.7"/>
    <path d="M 1060 386 l -22 0" stroke="#B5442E" stroke-width="4" stroke-linecap="round"/>
    <text class="b" x="1062" y="418" text-anchor="middle">五轮压缩 · 水位到 10%</text>
  </g>

  <!-- slope chart: rules survival -->
  <g>
    <text class="rl" x="64" y="212">安全规则存活率</text>
    <text class="b" x="64" y="232">Claude Code /compact × Sonnet 4.6 · 20 个生产配置</text>

    <line x1="330" y1="252" x2="330" y2="404" stroke="#DCE5E5"/>
    <line x1="640" y1="252" x2="640" y2="404" stroke="#DCE5E5"/>

    <!-- plain compaction: 53 -> 10 -->
    <path d="M 330 327 L 640 389" stroke="url(#gRed)" stroke-width="3"/>
    <circle cx="330" cy="327" r="8" fill="url(#gGold)"/>
    <circle cx="640" cy="389" r="8" fill="url(#gRed)"/>
    <text class="val" x="352" y="320" fill="#7A5A14" font-size="20">53%</text>
    <text class="val" x="662" y="396" fill="#8A2E22" font-size="20">10%</text>
    <text class="rl" x="485" y="345" text-anchor="middle" fill="#8A2E22">同一比例摘要</text>

    <!-- TypeCompact: 96 at five rounds -->
    <path d="M 330 264 L 640 261" stroke="url(#gGreen)" stroke-width="3"/>
    <circle cx="330" cy="264" r="8" fill="#6FB58F"/>
    <circle cx="640" cy="261" r="8" fill="url(#gGreen)"/>
    <text class="val" x="662" y="268" fill="#2F7D61" font-size="20">96%</text>
    <text class="rl" x="485" y="252" text-anchor="middle" fill="#2F7D61">Knowledge Triage 分流</text>

    <text class="b" x="330" y="426" text-anchor="middle">一轮后</text>
    <text class="b" x="640" y="426" text-anchor="middle">五轮后 · recall</text>
  </g>

  <!-- right stat chips -->
  <g>
    <rect x="880" y="446" width="256" height="62" fill="#0F7B8A" opacity="0.09"/>
    <text class="stat" x="896" y="480" fill="#0F7B8A" font-size="24">2-4 倍</text>
    <text x="896" y="498" font-size="12.5" fill="#6B7078">各压缩率下存活的规则数 vs 最强 LLM 压缩器</text>
  </g>

  <!-- bottom chips -->
  <line x1="64" y1="452" x2="836" y2="452" stroke="#DCE5E5"/>
  <g>
    <rect x="64" y="472" width="196" height="28" rx="14" fill="url(#gBlue)" opacity="0.16"/>
    <text x="162" y="491" text-anchor="middle" class="chip" fill="#2F5E90">拆主题破坏 0% / 93%</text>
    <text class="b" x="272" y="491">TypeDecompose 分区 vs 均匀分区</text>

    <rect x="64" y="512" width="180" height="28" rx="14" fill="url(#gTeal)" opacity="0.16"/>
    <text x="154" y="531" text-anchor="middle" class="chip" fill="#0B5E6A">取回 recall@50 100% / 73%</text>
    <text class="b" x="256" y="531">规则优先置顶 vs 最佳单次 LLM 检索</text>

    <rect x="64" y="552" width="150" height="28" rx="14" fill="url(#gGold)" opacity="0.2"/>
    <text x="139" y="571" text-anchor="middle" class="chip" fill="#7A5A14">医疗域 p &lt; 1e-8</text>
    <text class="b" x="226" y="571">对生产压缩器 McNemar · N=200</text>
  </g>

  <text class="serif" x="880" y="560" font-size="18" fill="#17303B">丢的不是 token，是可执行性。</text>
  <text class="b" x="1136" y="640" text-anchor="end">实测绑定 Claude Code /compact 与 Sonnet 4.6 · 开源 396,934 个配置语料 · Micropaper</text>
</svg>
