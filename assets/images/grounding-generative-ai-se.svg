<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#F0F0F0"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#009E73">GPT-4o 设计模式分类准确率仅 38.81%，GPT-4 类关系建模 F1 值仅 0.34：生成式 AI 尚不具备软件工程知识</text>

  <!-- ============ panel a: measured gaps ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#009E73">a</text>
  <text x="82" y="104" font-size="15" fill="#009E73">两项软件工程知识任务的实测水平</text>

  <!-- x = 340 + 800*v : 0.3881 -> 650.48 ; 0.34 -> 612 -->
  <g stroke="#D9D9D9" stroke-width="0.5">
        
        
      </g>
  <text x="328" y="156" font-size="12.5" fill="#009E73" text-anchor="end">设计模式分类（准确率）</text>
  <rect x="340" y="142" width="310.48" height="18" fill="#D55E00"/>
  <text x="658" y="156" font-size="12" fill="#555">GPT-4o：38.81%</text>

  <text x="328" y="208" font-size="12.5" fill="#009E73" text-anchor="end">类关系建模（F1 值）</text>
  <rect x="340" y="194" width="272" height="18" fill="#0072B2"/>
  <text x="620" y="208" font-size="12" fill="#555">GPT-4：0.34</text>

  <line x1="340" y1="232" x2="1140" y2="232" stroke="#009E73" stroke-width="0.75"/>
  <line x1="340" y1="126" x2="340" y2="232" stroke="#009E73" stroke-width="0.75"/>
  <g stroke="#009E73" stroke-width="0.75">
    <line x1="340" y1="232" x2="340" y2="236"/>
    <line x1="612" y1="232" x2="612" y2="236"/>
    <line x1="650.48" y1="232" x2="650.48" y2="236"/>
  </g>
  <g font-size="12.5" fill="#009E73" text-anchor="middle">
    <text x="340" y="254">0</text>
    <text x="612" y="254">0.34</text>
    <text x="650.48" y="254">38.81</text>
  </g>
  <text x="740" y="278" font-size="14" fill="#009E73" text-anchor="middle">指标值（准确率 / F1，无量纲）</text>
  <text x="340" y="304" font-size="12" fill="#555">同类结果：WizardCoder 与 DeepSeek-coder 33B 在面向对象编程概念测试上被本科生超越</text>

  <!-- ============ panel b: what current metrics measure ============ -->
  <text x="60" y="352" font-size="15" font-weight="bold" fill="#009E73">b</text>
  <text x="82" y="352" font-size="15" fill="#009E73">现有评估只覆盖语法与功能两层，不测可维护性</text>

  <!-- stacked coverage: total width 780 ; token 240 (555) exec 270 (825) maintain 270 (1095) -->
  <rect x="315" y="376" width="240" height="30" fill="#999999"/>
  <rect x="555" y="376" width="270" height="30" fill="#56B4E9"/>
  <rect x="825" y="376" width="270" height="30" fill="none" stroke="#D55E00" stroke-width="1.5" stroke-dasharray="5 3"/>
  <g font-size="12.5" text-anchor="middle">
    <text x="435" y="396" fill="#F0F0F0">BLEU / ROUGE / CodeBLEU</text>
    <text x="690" y="396" fill="#009E73">pass@k</text>
    <text x="960" y="396" fill="#D55E00">未覆盖</text>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="435" y="426">token 类指标：语法层面比较</text>
    <text x="690" y="426">执行类指标：功能正确性</text>
    <text x="960" y="426">模块化 / 内聚性 / 耦合性</text>
  </g>
  <text x="315" y="458" font-size="12" fill="#555">两类指标都把成功定义为通过测试，而非可维护性</text>

  <!-- ============ panel c: SENAI ============ -->
  <text x="60" y="506" font-size="15" font-weight="bold" fill="#009E73">c</text>
  <text x="82" y="506" font-size="15" fill="#009E73">SENAI 框架：三个策略把软件工程知识原生融入 AI</text>
  <g font-size="12.5" fill="#009E73">
    <rect x="60" y="524" width="340" height="72" fill="none" stroke="#0072B2" stroke-width="1.5"/>
    <text x="76" y="548" font-weight="bold">策略一：用 SE 知识扩充训练</text>
    <text x="76" y="570" font-size="12" fill="#555">引入 UML 图、架构决策记录、仓库历史三元组，</text>
    <text x="76" y="586" font-size="12" fill="#555">以强化学习对齐 SE 目标</text>

    <rect x="430" y="524" width="340" height="72" fill="none" stroke="#0072B2" stroke-width="1.5"/>
    <text x="446" y="548" font-weight="bold">策略二：重新定义好代码评估</text>
    <text x="446" y="570" font-size="12" fill="#555">新基准测模块化、内聚性、耦合性，</text>
    <text x="446" y="586" font-size="12" fill="#555">如改进 LCOM 与 CBO 的重构练习</text>

    <rect x="800" y="524" width="340" height="72" fill="none" stroke="#0072B2" stroke-width="1.5"/>
    <text x="816" y="548" font-weight="bold">策略三：用 Bloom 分类法评估理解</text>
    <text x="816" y="570" font-size="12" fill="#555">按回忆、理解、应用、分析、评估、综合</text>
    <text x="816" y="586" font-size="12" fill="#555">六个认知层次测试</text>
  </g>

  <!-- footnote -->
  <text x="60" y="640" font-size="11" fill="#767676">数据：SANER 2026 ERA Track《Grounding Generative AI in Software Engineering》（愿景论文）· 38.81% 与 0.34 为论文引用的自测口径 · b 面板覆盖划分为论文定性论述，非量化数据 · 未经同行评审</text>
</svg>
