<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">Drifting Models 把迭代前移到训练阶段，推理一步生成；ImageNet 256×256 上 Latent 版 FID 1.54，传统扩散需 50-100 步</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">ImageNet 256×256 生成质量对比（FID 越低越好，论文自测口径）</text>

  <!-- gridlines vertical for value axis: x = 300 + 180*(v-1.5) -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="390" y1="130" x2="390" y2="360"/>
    <line x1="570" y1="130" x2="570" y2="360"/>
  </g>

  <!-- Drifting Latent: 1.54, steps 1 -->
  <text x="288" y="160" font-size="12.5" fill="#1A1B1E" text-anchor="end">Drifting（Latent）</text>
  <rect x="300" y="146" width="7.2" height="20" fill="#D55E00"/>
  <text x="318" y="160" font-size="12" fill="#555">FID 1.54，步数 1</text>

  <!-- Drifting Pixel: 1.61, steps 1 -->
  <text x="288" y="220" font-size="12.5" fill="#1A1B1E" text-anchor="end">Drifting（Pixel）</text>
  <rect x="300" y="206" width="19.8" height="20" fill="#D55E00"/>
  <text x="330" y="220" font-size="12" fill="#555">FID 1.61，步数 1</text>

  <!-- SDXL Turbo: ~2.0, steps 4 -->
  <text x="288" y="280" font-size="12.5" fill="#1A1B1E" text-anchor="end">SDXL Turbo</text>
  <rect x="300" y="266" width="90" height="20" fill="#999999"/>
  <polygon points="390,266 402,276 390,286" fill="#999999"/>
  <text x="410" y="280" font-size="12" fill="#555">FID 约为 2.0，步数 4</text>

  <!-- Traditional diffusion: ~2.0-3.0, steps 50-100 -->
  <text x="288" y="340" font-size="12.5" fill="#1A1B1E" text-anchor="end">传统扩散模型</text>
  <rect x="300" y="326" width="270" height="20" fill="#999999"/>
  <polygon points="570,326 582,336 570,346" fill="#999999"/>
  <text x="590" y="340" font-size="12" fill="#555">FID 约 2.0-3.0，步数 50-100</text>

  <!-- value axis -->
  <line x1="300" y1="360" x2="660" y2="360" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="360" x2="300" y2="364"/>
    <line x1="390" y1="360" x2="390" y2="364"/>
    <line x1="570" y1="360" x2="570" y2="364"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="380">1.54</text>
    <text x="390" y="380">2.0</text>
    <text x="570" y="380">3.0</text>
  </g>
  <text x="480" y="404" font-size="14" fill="#1A1B1E" text-anchor="middle">FID（越低越好；刻度取正文实数，轴范围线性延伸）</text>
  <text x="60" y="428" font-size="12" fill="#555">灰色与箭头端为正文「约」近似值或区间上限；朱色为 Drifting Models（主角）。</text>

  <!-- ============ panel b ============ -->
  <text x="760" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="782" y="104" font-size="15" fill="#1A1B1E">推理所需前向步数（序列位置轴）</text>

  <!-- sequence position axis -->
  <line x1="820" y1="360" x2="1140" y2="360" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="870" y1="360" x2="870" y2="364"/>
    <line x1="985" y1="360" x2="985" y2="364"/>
    <line x1="1100" y1="360" x2="1100" y2="364"/>
  </g>
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="870" y1="140" x2="870" y2="360"/>
    <line x1="985" y1="140" x2="985" y2="360"/>
    <line x1="1100" y1="140" x2="1100" y2="360"/>
  </g>

  <circle cx="870" cy="300" r="7" fill="#D55E00"/>
  <text x="870" y="278" font-size="12" fill="#555" text-anchor="middle">步数 1</text>
  <text x="870" y="384" font-size="12.5" fill="#1A1B1E" text-anchor="middle">Drifting</text>

  <circle cx="985" cy="300" r="7" fill="#999999"/>
  <text x="985" y="278" font-size="12" fill="#555" text-anchor="middle">步数 4</text>
  <text x="985" y="384" font-size="12.5" fill="#1A1B1E" text-anchor="middle">SDXL Turbo</text>

  <circle cx="1100" cy="300" r="7" fill="#999999"/>
  <text x="1100" y="278" font-size="12" fill="#555" text-anchor="middle">步数 50-100</text>
  <text x="1100" y="384" font-size="12.5" fill="#1A1B1E" text-anchor="middle">传统扩散</text>

  <text x="980" y="410" font-size="12" fill="#555" text-anchor="middle">序列位置轴（按正文列举顺序），非数值刻度</text>
  <text x="980" y="428" font-size="12" fill="#555" text-anchor="middle">步数直接标注在点上</text>

  <!-- ============ panel c ============ -->
  <text x="60" y="480" font-size="15" font-weight="bold" fill="#1A1B1E">c</text>
  <text x="82" y="480" font-size="15" fill="#1A1B1E">机制与机器人控制（论文自测口径）</text>
  <g font-size="12" fill="#555">
    <text x="60" y="512">训练三步：从当前 batch 估计漂移场 V；用 V 把样本漂移得到目标；让网络回归匹配漂移后的目标。推理仅一步 x = f(noise)，无迭代。</text>
    <text x="60" y="536">漂移场 V：指示当前生成分布向真实数据分布漂移的方向；两个分布完美匹配时自动趋近于 0，训练自然收敛。</text>
    <text x="60" y="560">机器人控制：Diffusion Policy 的多步去噪替换为单步生成后，任务成功率不降反升，推理速度快了几十倍。</text>
  </g>

  <!-- footnote -->
  <text x="60" y="640" font-size="11" fill="#767676">数据：arXiv:2602.04770（MIT 何恺明团队，ImageNet 256×256，论文自测口径）·「约」为正文近似值，正文未报告误差区间，未画误差棒 · 预印本未经同行评审</text>
</svg>
