<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">同一 Kimi K3 模型、同一运行时下，9 个执行外壳的通过率相差 16.7 个百分点，每任务成本相差 17 倍</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">任务通过率（正文报告的外壳间极值，标注值即数据）</text>

  <!-- scale x = 260 + 6*v (0-100); gridlines at 50/70 (90 exceeds canvas) -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="585" y1="130" x2="585" y2="306"/>
    <line x1="693.6" y1="130" x2="693.6" y2="306"/>
  </g>

  <!-- Codex 66.7 -->
  <text x="248" y="164" font-size="12.5" fill="#1A1B1E" text-anchor="end">Codex（最高）</text>
  <rect x="260" y="150" width="433.6" height="18" fill="#0072B2"/>
  <text x="702" y="164" font-size="12" fill="#555">66.7%</text>

  <!-- OpenCode/Hermes 50.0 -->
  <text x="248" y="236" font-size="12.5" fill="#1A1B1E" text-anchor="end">OpenCode / Hermes（最低）</text>
  <rect x="260" y="222" width="325" height="18" fill="#999999"/>
  <text x="593" y="236" font-size="12" fill="#555">50.0% · 与最高相差 16.7 个百分点</text>

  <!-- value axis -->
  <line x1="260" y1="306" x2="730" y2="306" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="260" y1="306" x2="260" y2="310"/>
    <line x1="585" y1="306" x2="585" y2="310"/>
    <line x1="693.6" y1="306" x2="693.6" y2="310"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="260" y="330">原点</text>
    <text x="585" y="330">50.0</text>
    <text x="693.6" y="330">66.7</text>
  </g>
  <text x="580" y="354" font-size="14" fill="#1A1B1E" text-anchor="middle">任务通过率（百分比，原点表示无任务通过）</text>

  <!-- cache hit-rate side note -->
  <text x="930" y="152" font-size="12" fill="#555">缓存命中率：Codex 最高</text>
  <text x="930" y="170" font-size="12" fill="#555">88.0%；最低的恰是</text>
  <text x="930" y="188" font-size="12" fill="#555">Claude Code 67.8%</text>
  <text x="930" y="218" font-size="12" fill="#555">质量与成本脱钩：</text>
  <text x="930" y="236" font-size="12" fill="#555">通过率最高者缓存最好，</text>
  <text x="930" y="254" font-size="12" fill="#555">成本最高者缓存最差</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="406" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="406" font-size="15" fill="#1A1B1E">每任务成本（美元，标注值即数据）</text>

  <!-- cost scale x = 260 + 36*v ($0-$20): $1.05=297.8 $5=440 $10=620 $15=800 $18.34=920.2 -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="584" y1="430" x2="584" y2="580"/>
    <line x1="872" y1="430" x2="872" y2="580"/>
    
  </g>

  <!-- Exo $1.05 -->
  <text x="248" y="458" font-size="12.5" fill="#1A1B1E" text-anchor="end">Exo Harness（最低）</text>
  <rect x="260" y="444" width="37.8" height="18" fill="#009E73"/>
  <text x="306" y="458" font-size="12" fill="#555">$1.05</text>

  <!-- Claude Code $18.34 -->
  <text x="248" y="506" font-size="12.5" fill="#1A1B1E" text-anchor="end">Claude Code（最高）</text>
  <rect x="260" y="492" width="660.2" height="18" fill="#D55E00"/>
  <text x="726" y="518" font-size="12" fill="#555">$18.34 · 与最低相差 17 倍</text>

  <!-- median per success dumbbell (independent horizontal positions, labeled) -->
  <text x="248" y="562" font-size="12.5" fill="#1A1B1E" text-anchor="end">每成功一次任务的中位成本</text>
    <circle cx="360" cy="558" r="6" fill="#0072B2"/>
  <circle cx="560" cy="558" r="6" fill="#D55E00"/>
  <text x="360" y="540" font-size="12" fill="#555" text-anchor="middle">OpenCode $0.0615</text>
  <text x="560" y="540" font-size="12" fill="#555" text-anchor="middle">Claude Code $0.2880</text>
  <text x="575" y="562" font-size="12" fill="#555">相差约 4.7 倍（此行为比较示意，不按下方轴定位）</text>

  <line x1="260" y1="580" x2="890" y2="580" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="260" y1="580" x2="260" y2="584"/>
    <line x1="584" y1="580" x2="584" y2="584"/>
    <line x1="872" y1="580" x2="872" y2="584"/>
    
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="260" y="604">原点</text>
    <text x="584" y="604">9</text>
    <text x="872" y="604">17</text>
    
  </g>
  <text x="590" y="628" font-size="14" fill="#1A1B1E" text-anchor="middle">每任务成本（美元，原点表示无成本）</text>

  <!-- footnote -->
  <text x="60" y="660" font-size="11" fill="#767676">数据：FrontierHarness Eval（Runta 出品，9 个 harness × 12 种配置，正文转述口径）· 仅覆盖软件工程与终端任务，Runta 亦是厂商，外推需谨慎 · 结论分由 HN Algolia API 实测 2026-09-06</text>
</svg>
