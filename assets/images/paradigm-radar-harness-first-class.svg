<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9A9186; }
      .rl { font-size: 15px; fill: #4A4E55; }
      .val { font-size: 17px; font-weight: 700; fill: #1A1B1E; }
      .b { font-size: 12px; fill: #A3A099; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8F6F0"/>
    </linearGradient>
    <linearGradient id="gYellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8B21E"/><stop offset="1" stop-color="#F2CB5B"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9622B"/><stop offset="1" stop-color="#E8874F"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D6B8E"/><stop offset="1" stop-color="#5E8CAC"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1100" cy="120" r="150" fill="#3D6B8E" opacity="0.06"/>
  <circle cx="90" cy="615" r="120" fill="#E8B21E" opacity="0.08"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gOrange)"/>

  <text class="k" x="64" y="84">范式雷达 · 2026-09-05 · FRONTIERHARNESS EVAL</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">不换模型，换外壳</text>
  <text x="64" y="158" font-size="15" fill="#5C5F66">同一 Kimi K3 · 9 个执行外壳 · 通过率与每任务成本</text>

  <!-- construction site motif: tower crane + hard hat -->
  <g>
    <rect x="952" y="72" width="7" height="110" fill="#7D848C"/>
    <rect x="900" y="80" width="176" height="7" fill="#E8B21E"/>
    <line x1="1052" y1="87" x2="1052" y2="120" stroke="#7D848C" stroke-width="2"/>
    <rect x="1042" y="120" width="20" height="14" fill="#3D6B8E"/>
    <path d="M 886 166 a 27 27 0 0 1 54 0 z" fill="url(#gYellow)"/>
    <rect x="880" y="164" width="66" height="8" rx="4" fill="#D9622B"/>
  </g>

  <!-- slope: pass 48-70 -> x=300+(v-48)*20 ; cost log -> x=300+(v/1000)*400 (0-20) -->
  <g stroke="#E7E2D6">
    <line x1="300" y1="212" x2="300" y2="524"/>
    <line x1="600" y1="212" x2="600" y2="524"/>
    <line x1="900" y1="212" x2="900" y2="524"/>
  </g>
  <text class="b" x="300" y="546">0%</text>
  <text class="b" x="600" y="546" text-anchor="middle">50%</text>
  <text class="b" x="900" y="546" text-anchor="middle">100%</text>
  <text class="b" x="300" y="568">$0</text>
  <text class="b" x="600" y="568" text-anchor="middle">$5</text>
  <text class="b" x="900" y="568" text-anchor="middle">$15</text>
  <text class="b" x="64" y="592">上轴：通过率 · 下轴：每任务成本</text>

  <circle cx="212" cy="196" r="6" fill="#FFFFFF" stroke="#7D848C" stroke-width="2.5"/><text class="b" x="226" y="201">基线</text>
  <circle cx="292" cy="196" r="6" fill="#3D6B8E"/><text class="b" x="306" y="201">实测</text>

  <!-- row bands -->
  <rect x="170" y="230" width="970" height="52" fill="#3D6B8E" opacity="0.08"/>
  <rect x="170" y="294" width="970" height="52" fill="#E8B21E" opacity="0.08"/>
  <rect x="170" y="358" width="970" height="52" fill="#D9622B" opacity="0.08"/>
  <rect x="170" y="422" width="970" height="52" fill="#7D848C" opacity="0.08"/>

  <!-- r1 Codex -->
  <text class="rl" x="276" y="254" text-anchor="end">Codex · 通过率</text>
  <line x1="720" y1="256" x2="674" y2="256" stroke="#3D6B8E" stroke-width="3"/>
  <circle cx="720" cy="256" r="7" fill="#FFFFFF" stroke="#7D848C" stroke-width="3"/>
  <circle cx="674" cy="256" r="8" fill="url(#gBlue)"/>
  <text class="val" x="674" y="248" text-anchor="middle" fill="#3D6B8E">58.3 → 66.7%</text>
  <text x="1010" y="262" font-size="13" fill="#A3A099">缓存 88.0%</text>

  <!-- r2 Claude Code cost -->
  <text class="rl" x="276" y="318" text-anchor="end">Claude Code · 成本</text>
  <line x1="300" y1="320" x2="726" y2="320" stroke="#D9622B" stroke-width="3"/>
  <circle cx="300" cy="320" r="7" fill="#FFFFFF" stroke="#7D848C" stroke-width="3"/>
  <circle cx="726" cy="320" r="9" fill="url(#gOrange)"/>
  <text class="val" x="905" y="326" fill="#D9622B">$18.34 / 任务</text>

  <!-- r3 Exo cost -->
  <text class="rl" x="276" y="382" text-anchor="end">Exo Harness · 成本</text>
  <circle cx="300" cy="384" r="8" fill="url(#gYellow)"/>
  <text class="val" x="318" y="390" fill="#A87C10">$1.05 / 任务 · 相差 17 倍</text>

  <!-- r4 OpenCode/Hermes -->
  <text class="rl" x="276" y="446" text-anchor="end">OpenCode · 通过率</text>
  <line x1="600" y1="448" x2="340" y2="448" stroke="#7D848C" stroke-width="3"/>
  <circle cx="600" cy="448" r="7" fill="#FFFFFF" stroke="#7D848C" stroke-width="3"/>
  <circle cx="340" cy="448" r="8" fill="#7D848C"/>
  <text class="val" x="356" y="440" fill="#5C6167">58.3 → 50.0% · 差 16.7 个百分点</text>

  <line x1="64" y1="576" x2="1136" y2="576" stroke="#E7E2D6"/>
  <text class="serif" x="64" y="614" font-size="18" fill="#1A1B1E">竞争焦点：从「选哪个模型」转向「基准化哪层外壳」。</text>
  <text class="b" x="1136" y="614" text-anchor="end">OpenCode 与 Hermes 同为 50.0% · 仅软件工程与终端任务 · Runta 亦是厂商 · Micropaper</text>
</svg>
