<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">从发布测量到评价货架历时约两个月；评价量一周内约增 30-60 倍，均为官方页面自述</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">证据链时间线（2026-08 至 2026-10，序位轴）</text>

  <!-- ordinal axis: x = 150 + step*210 -->
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="150" y1="330" x2="990" y2="330"/>
  </g>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="150" y1="330" x2="150" y2="334"/>
    <line x1="360" y1="330" x2="360" y2="334"/>
    <line x1="570" y1="330" x2="570" y2="334"/>
    <line x1="780" y1="330" x2="780" y2="334"/>
    <line x1="990" y1="330" x2="990" y2="334"/>
  </g>
  <text x="570" y="378" font-size="14" fill="#1A1B1E" text-anchor="middle">事件序位（各节点日期见标注）</text>

  <!-- events -->
  <g stroke-width="1.5">
    <line x1="150" y1="330" x2="150" y2="252" stroke="#0072B2"/>
    <line x1="360" y1="330" x2="360" y2="408" stroke="#0072B2"/>
    <line x1="570" y1="330" x2="570" y2="252" stroke="#009E73"/>
    <line x1="780" y1="330" x2="780" y2="408" stroke="#0072B2"/>
    <line x1="990" y1="330" x2="990" y2="252" stroke="#D55E00"/>
  </g>
  <circle cx="150" cy="330" r="6" fill="#0072B2"/>
  <circle cx="360" cy="330" r="6" fill="#0072B2"/>
  <circle cx="570" cy="330" r="6" fill="#009E73"/>
  <circle cx="780" cy="330" r="6" fill="#0072B2"/>
  <circle cx="990" cy="330" r="6" fill="#D55E00"/>

  <!-- above labels (anchor end) -->
  <g font-size="12" fill="#1A1B1E" text-anchor="end">
    <text x="150" y="188" font-weight="bold">2026-08-03</text>
    <text x="150" y="206">MCP 会话分析产品发布</text>
    <text x="150" y="222">HN 42 分（厂商自述）</text>

    <text x="570" y="188" font-weight="bold">2026-10-03</text>
    <text x="570" y="206">npm 包首发，仓库同日建立</text>
    <text x="570" y="222">GitHub 0 星（API 实测 2026-10-14）</text>

    <text x="990" y="170" font-weight="bold">2026-10-14 页面自述实测</text>
    <text x="990" y="188">189,934 条评价 · 4,120 个工具</text>
    <text x="990" y="206">其中 1,971 个已发布评分</text>
  </g>

  <!-- below labels (anchor start) -->
  <g font-size="12" fill="#1A1B1E" text-anchor="start">
    <text x="360" y="428" font-weight="bold">2026-09-03</text>
    <text x="360" y="446">16,893 会话测量报告发布</text>
    <text x="360" y="462">HN 实测 300 分 · 153 条评论</text>

    <text x="780" y="428" font-weight="bold">2026-10-07</text>
    <text x="780" y="446">agent.reviews 上线（Show HN）</text>
    <text x="780" y="462">实测 73 分 · 51 评论</text>
    <text x="780" y="478">发帖自述「数千条评价」</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#555">
    <circle cx="150" cy="530" r="5" fill="#0072B2"/><text x="162" y="534">厂商自述</text>
    <circle cx="260" cy="530" r="5" fill="#009E73"/><text x="272" y="534">独立实测（API）</text>
    <circle cx="410" cy="530" r="5" fill="#D55E00"/><text x="422" y="534">页面自述文字实测</text>
  </g>

  <!-- footnote -->
  <text x="60" y="658" font-size="11" fill="#767676">来源：Armature 发布记录与 HN/npm/GitHub API 及 agent.reviews 页面文字实测（2026-10-14）· 评价量为官方页面自述，无第三方复现 · 横轴为事件序位，不按日期等比，原点为区间起点</text>
</svg>
