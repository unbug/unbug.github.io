<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">三轮均从默认配置的通用 QEMU/KVM 逃逸（第 3 轮升级上游后链式利用 3 个 0-day），Firecracker 对照组未遂</text>

  <!-- ================= panel a ================= -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">三轮攻击利用链的缺陷构成（个）</text>

  <!-- stacked horizontal bars: x = 150 + 90*v -->
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="138" y="164">第 1 轮</text>
    <text x="138" y="224">第 2 轮</text>
    <text x="138" y="284">第 3 轮</text>
  </g>

  <rect x="150" y="150" width="90" height="20" fill="#D55E00"/>
  <text x="250" y="164" font-size="12" fill="#555555">1 · 宿主机内核漏洞 Januscape（数周前披露、当时无公开 exploit）</text>

  <rect x="150" y="210" width="90" height="20" fill="#D55E00"/>
  <rect x="240" y="210" width="90" height="20" fill="#0072B2"/>
  <text x="340" y="224" font-size="12" fill="#555555">1 + 1 · libslirp 4.7.0 带 CVE-2026-9539，另加 1 个上游修复对应缺陷（未分配 CVE）</text>

  <rect x="150" y="270" width="270" height="20" fill="#CC79A7"/>
  <rect x="420" y="270" width="90" height="20" fill="#0072B2"/>
  <text x="520" y="284" font-size="12" fill="#555555">3 + 1 · 手工升级最新上游 QEMU/libslirp 后仍链式利用成功，组合为宿主机任意内存读写</text>

  <!-- value axis -->
  <line x1="150" y1="316" x2="420" y2="316" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="150" y1="316" x2="150" y2="320"/>
    <line x1="240" y1="316" x2="240" y2="320"/>
    <line x1="330" y1="316" x2="330" y2="320"/>
    <line x1="420" y1="316" x2="420" y2="320"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="150" y="336">0</text>
    <text x="240" y="336">1</text>
    <text x="330" y="336">2</text>
    <text x="420" y="336">3</text>
  </g>
  <text x="285" y="358" font-size="14" fill="#1A1B1E" text-anchor="middle">利用链中的缺陷数（个）</text>

  <!-- category legend (segment colors) -->
  <g font-size="12" fill="#555555">
    <rect x="150" y="378" width="12" height="10" fill="#D55E00"/>
    <text x="168" y="387">已分配 CVE 漏洞</text>
    <rect x="330" y="378" width="12" height="10" fill="#0072B2"/>
    <text x="348" y="387">未分配 CVE（上游已修 / 未标记安全问题）</text>
    <rect x="690" y="378" width="12" height="10" fill="#CC79A7"/>
    <text x="708" y="387">当时未公开的 0-day</text>
  </g>

  <!-- ================= panel b ================= -->
  <text x="60" y="434" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="434" font-size="15" fill="#1A1B1E">各配置逃逸判定（CTF 式：逃出 VM 读到宿主 flag 即成功）</text>

  <!-- gridlines at category centers -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="280" y1="452" x2="280" y2="560"/>
    <line x1="560" y1="452" x2="560" y2="560"/>
    <line x1="840" y1="452" x2="840" y2="560"/>
    <line x1="1100" y1="452" x2="1100" y2="560"/>
  </g>

  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="280" y="472">第 1 轮</text>
    <text x="280" y="488" font-size="12" fill="#555555">默认配置 QEMU/KVM</text>
    <text x="560" y="472">第 2 轮</text>
    <text x="560" y="488" font-size="12" fill="#555555">默认配置 QEMU/KVM</text>
    <text x="840" y="472">第 3 轮</text>
    <text x="840" y="488" font-size="12" fill="#555555">升级上游 QEMU/libslirp 后</text>
    <text x="1100" y="472" text-anchor="end">Firecracker 对照组</text>
  </g>
  <g font-size="12" fill="#555555" text-anchor="middle">
    <text x="280" y="538">逃逸成功（hardlock）</text>
    <text x="560" y="538">逃逸成功（任意内存读写）</text>
    <text x="840" y="538">逃逸成功（0-day 链）</text>
    <text x="1100" y="538" text-anchor="end">未遂</text>
  </g>
  <!-- outcome markers: filled = escaped, hollow = not escaped -->
  <circle cx="280" cy="510" r="7" fill="#D55E00"/>
  <circle cx="560" cy="510" r="7" fill="#D55E00"/>
  <circle cx="840" cy="510" r="7" fill="#D55E00"/>
  <circle cx="1100" cy="510" r="7" fill="#FFFFFF" stroke="#999999" stroke-width="2"/>

  <text x="1100" y="556" font-size="11" fill="#555555" text-anchor="end">仍可 hardlock</text>

  <!-- ordinal category axis -->
  <line x1="200" y1="560" x2="1140" y2="560" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="280" y1="560" x2="280" y2="564"/>
    <line x1="560" y1="560" x2="560" y2="564"/>
    <line x1="840" y1="560" x2="840" y2="564"/>
    <line x1="1100" y1="560" x2="1100" y2="564"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="280" y="582">1</text>
    <text x="560" y="582">2</text>
    <text x="840" y="582">3</text>
    <text x="1100" y="582">对照</text>
  </g>
  <text x="670" y="602" font-size="14" fill="#1A1B1E" text-anchor="middle">攻击尝试序位（序位轴，非等距时间）</text>

  <!-- footnote -->
  <text x="60" y="630" font-size="11" fill="#767676">数据：Trail of Bits《VMs won't contain cyber-capable agents》（2026-08-26 发布）· HN 197 分、147 条评论（实测 2026-09-08）· 首轮约 1 小时，单次运行约 12 小时量级</text>
  <text x="60" y="648" font-size="11" fill="#767676">单一研究者 / 单一宿主机 / CTF 式判定，n=1 不外推 · CVE 编号均据 Trail of Bits 称</text>
</svg>
