<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#F0F0F0"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#009E73">Engram-27B 在与 MoE 基线等参数量、等 FLOPs 约束下，于知识、推理、代码、数学四类任务均取得一致改进</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#009E73">a</text>
  <text x="82" y="104" font-size="15" fill="#009E73">两条稀疏性轴（直接标注序列位置轴，按论文阐述顺序排列，非数值刻度）</text>

  <!-- ordinal position axis: order only, values not reported in article text -->
  <line x1="220" y1="300" x2="1100" y2="300" stroke="#009E73" stroke-width="0.75"/>
  <g stroke="#009E73" stroke-width="0.75">
    <line x1="400" y1="300" x2="400" y2="304"/>
    <line x1="900" y1="300" x2="900" y2="304"/>
  </g>
  <!-- hollow = baseline/existing axis, solid = subject (Engram) -->
  <circle cx="400" cy="300" r="8" fill="none" stroke="#0072B2" stroke-width="2"/>
  <circle cx="900" cy="300" r="8" fill="#D55E00"/>
  <text x="400" y="208" font-size="13" font-weight="bold" fill="#009E73" text-anchor="middle">MoE：条件计算（动态）</text>
  <text x="400" y="234" font-size="12" fill="#555" text-anchor="middle">以条件计算扩展模型容量，</text>
  <text x="400" y="254" font-size="12" fill="#555" text-anchor="middle">缺少原生的知识查找原语</text>
  <text x="400" y="332" font-size="12.5" fill="#009E73" text-anchor="middle">已有稀疏性轴（对照）</text>
  <text x="900" y="208" font-size="13" font-weight="bold" fill="#009E73" text-anchor="middle">Engram：条件内存（静态）</text>
  <text x="900" y="234" font-size="12" fill="#555" text-anchor="middle">N-gram 嵌入现代化，确定性寻址、</text>
  <text x="900" y="254" font-size="12" fill="#555" text-anchor="middle">常数时间复杂度 O(1) 查找</text>
  <text x="900" y="332" font-size="12.5" fill="#009E73" text-anchor="middle">新增稀疏性轴（主角，与 MoE 互补）</text>
  <text x="660" y="372" font-size="14" fill="#009E73" text-anchor="middle">稀疏性轴（论文阐述顺序的序列位置轴，空心为对照、实心为主角）</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="424" font-size="15" font-weight="bold" fill="#009E73">b</text>
  <text x="82" y="424" font-size="15" fill="#009E73">Engram 三层工作机制（论文阐述顺序）</text>
  <text x="120" y="462" font-size="13" font-weight="bold" fill="#0072B2">内存检索层</text>
  <text x="452" y="462" font-size="13" font-weight="bold" fill="#0072B2">状态融合层</text>
  <text x="784" y="462" font-size="13" font-weight="bold" fill="#0072B2">系统效率层</text>
  <g stroke="#0072B2" stroke-width="1.5">
    <line x1="120" y1="472" x2="392" y2="472"/>
    <line x1="452" y1="472" x2="724" y2="472"/>
    <line x1="784" y1="472" x2="1056" y2="472"/>
  </g>
  <g font-size="12" fill="#555">
    <text x="120" y="496">从静态内存检索 N-gram 知识，</text>
    <text x="120" y="516">不需复杂注意力机制，查找耗时</text>
    <text x="120" y="536">不随模型规模增长，巨大内存表</text>
    <text x="120" y="556">可卸载到普通主机 DRAM 中</text>

    <text x="452" y="496">静态内存与动态隐藏状态融合：</text>
    <text x="452" y="516">早期层处理静态模式重建，</text>
    <text x="452" y="536">深层专注复杂推理，</text>
    <text x="452" y="556">模型有效深度保持不变</text>

    <text x="784" y="496">与 MoE 构成互补的两条稀疏性轴，</text>
    <text x="784" y="516">论文给出 U 型缩放定律，</text>
    <text x="784" y="536">指导两者的最优容量分配</text>
  </g>
  <text x="60" y="600" font-size="12" fill="#555">实验结果：等参数量、等 FLOPs 约束下，Engram-27B 对比 MoE 基线在四类任务均一致改进；长文本任务准确率达 97%；GitHub 仓库已获 3.8k stars</text>

  <!-- footnote -->
  <text x="60" y="634" font-size="11" fill="#767676">数据：DeepSeek 与北京大学《Conditional Memory via Scalable Lookup》（2026 年 1 月发布，论文自测口径）·</text>
  <text x="60" y="652" font-size="11" fill="#767676">正文未给出四类任务的具体数值与误差区间，未画数值坐标，a 面板为直接标注的序列位置轴 · 预印本未经同行评审</text>
</svg>
