<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">三条常规关闭出口全部受阻，唯一可用路径是无官方文档的 feature flag</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">stop 之后 pid-update-loop 存活时间（作者实测，s）</text>

  <!-- timeline axis: x = 100 + 2*t -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="240" y1="130" x2="1100" y2="130"/>
    <line x1="480" y1="130" x2="480" y2="240"/>
    <line x1="720" y1="130" x2="720" y2="240"/>
    <line x1="960" y1="130" x2="960" y2="240"/>
  </g>

  <!-- app-server: stops at t=0 -->
  <text x="228" y="158" font-size="12.5" fill="#1A1B1E" text-anchor="end">app-server</text>
  <circle cx="240" cy="153" r="6" fill="none" stroke="#0072B2" stroke-width="2"/>
  <text x="254" y="158" font-size="12" fill="#555555">daemon stop 后即停</text>

  <!-- pid-update-loop: alive 70s -->
  <text x="228" y="208" font-size="12.5" fill="#1A1B1E" text-anchor="end">pid-update-loop</text>
  <line x1="240" y1="203" x2="940" y2="203" stroke="#D55E00" stroke-width="3"/>
  <line x1="940" y1="194" x2="940" y2="212" stroke="#D55E00" stroke-width="1.5"/>
  <text x="940" y="182" font-size="12" fill="#555555" text-anchor="end">stop 后仍存活 70 秒，需手动 kill</text>

  <!-- x axis -->
  <line x1="240" y1="240" x2="1100" y2="240" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="240" y1="240" x2="240" y2="244"/>
    <line x1="480" y1="240" x2="480" y2="244"/>
    <line x1="720" y1="240" x2="720" y2="244"/>
    <line x1="960" y1="240" x2="960" y2="244"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="240" y="260">0</text>
    <text x="480" y="260">20</text>
    <text x="720" y="260">40</text>
    <text x="960" y="260">60</text>
  </g>
  <text x="600" y="284" font-size="14" fill="#1A1B1E" text-anchor="middle">stop 命令执行后的时间（秒）</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="330" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="330" font-size="15" fill="#1A1B1E">出口状态：三条受阻，一条可用但无文档</text>

  <g font-size="12.5" fill="#1A1B1E">
    <rect x="60" y="356" width="14" height="14" fill="none" stroke="#999999" stroke-width="1.5"/>
    <text x="84" y="368">出口一 · stop 漏杀更新器：app-server 停了，pid-update-loop 仍存活 70 秒（作者实测）</text>

    <rect x="60" y="392" width="14" height="14" fill="none" stroke="#999999" stroke-width="1.5"/>
    <text x="84" y="404">出口二 · 抓不到父进程：daemon 独立会话、无 TTY，reparent 到 PID 1，关窗不再是退出语义</text>

    <rect x="60" y="428" width="14" height="14" fill="none" stroke="#999999" stroke-width="1.5"/>
    <text x="84" y="440">出口三 · 文档零条目：官方 config 参考页对 daemon_auto_start 查无条目（用户 foma-agent 核对，10-16 复测仍无）</text>

    <rect x="60" y="464" width="14" height="14" fill="#0072B2"/>
    <text x="84" y="476">唯一路径 · feature flag：codex features disable daemon_auto_start；或 config.toml [features] 写 daemon_auto_start = false</text>
  </g>

  <text x="60" y="508" font-size="12" fill="#555555">该 flag 路径系用户 whimblepop 实测、多人复贴；官方文档零条目，升级后需复查。</text>

  <!-- ============ panel c ============ -->
  <text x="60" y="556" font-size="15" font-weight="bold" fill="#1A1B1E">c</text>
  <text x="82" y="556" font-size="15" fill="#1A1B1E">关不干净这件事本身即是三个争议的交汇点</text>

  <g font-size="12.5" fill="#1A1B1E">
    <rect x="60" y="572" width="14" height="14" fill="#0072B2"/>
    <text x="84" y="584">默认值（默认开启而非 opt-in）</text>
    <rect x="420" y="572" width="14" height="14" fill="#0072B2"/>
    <text x="444" y="584">可见性（发布说明一句、文档零条目）</text>
    <rect x="810" y="572" width="14" height="14" fill="#0072B2"/>
    <text x="834" y="584">退出路径完整性（stop 漏杀更新器）</text>
  </g>

  <!-- footnote -->
  <text x="60" y="632" font-size="11" fill="#767676">来源：openai/codex issue 48195 作者复现与实测（70 秒存活为作者实测口径）· 文档核对系用户 foma-agent 转述、2026-10-16 复测仍查无条目 · feature flag 系 whimblepop 实测、多人复贴</text>
</svg>
