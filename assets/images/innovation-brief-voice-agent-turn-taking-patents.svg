<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #8A94A3; }
      .rl { font-size: 14px; fill: #45505E; }
      .val { font-size: 18px; font-weight: 700; }
      .b { font-size: 12px; fill: #98A1AE; }
      .chip { font-size: 11.5px; font-weight: 700; fill: #FFFFFF; letter-spacing: 2px; }
      .stat { font-size: 32px; font-weight: 700; fill: #1E2430; }
      .unit { font-size: 14px; fill: #5C6672; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F5F8"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B6FA0"/><stop offset="1" stop-color="#7FA6CC"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DE7A3B"/><stop offset="1" stop-color="#F0A878"/>
    </linearGradient>
    <linearGradient id="gYellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A227"/><stop offset="1" stop-color="#E5C042"/>
    </linearGradient>
    <linearGradient id="waveBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B6FA0"/><stop offset="1" stop-color="#2C5478"/>
    </linearGradient>
    <linearGradient id="waveOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DE7A3B"/><stop offset="1" stop-color="#B85A22"/>
    </linearGradient>
    <linearGradient id="waveYellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E5C042"/><stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
