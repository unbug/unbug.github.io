  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1120" cy="100" r="130" fill="#3B6FA0" opacity="0.06"/>
  <circle cx="90" cy="640" r="120" fill="#DE7A3B" opacity="0.06"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gBlue)"/>

  <text class="k" x="64" y="84">AI 智创简报 · 2026-09-14 · 语音轮次专利</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1E2430">抢话判定被圈地了</text>
  <text x="64" y="158" font-size="15" fill="#5C6672">四件专利接连公开，轮次质检的验收标准还空着</text>

  <!-- broadcast console motif: fader + meters -->
  <g>
    <rect x="978" y="76" width="158" height="96" rx="14" fill="#2C5478"/>
    <rect x="996" y="92" width="60" height="8" rx="4" fill="#7FA6CC"/>
    <rect x="996" y="108" width="42" height="8" rx="4" fill="#E5C042"/>
    <rect x="996" y="124" width="52" height="8" rx="4" fill="#DE7A3B"/>
    <circle cx="1096" cy="106" r="15" fill="none" stroke="#E5C042" stroke-width="4"/>
    <line x1="1096" y1="106" x2="1106" y2="95" stroke="#E5C042" stroke-width="4" stroke-linecap="round"/>
    <rect x="1082" y="134" width="8" height="22" rx="4" fill="#8FBF3F"/><rect x="1094" y="142" width="8" height="14" rx="4" fill="#E5C042"/><rect x="1106" y="128" width="8" height="28" rx="4" fill="#DE7A3B"/>
    <text class="b" x="1057" y="192" text-anchor="middle" fill="#7C8B99">ON AIR</text>
  </g>

  <!-- four-hand timeline: 01-01=150 · 02-26=364 · 04-30=590 · 08-06=1050 (1.995px/day) -->
  <g>
    <rect x="130" y="228" width="940" height="42" rx="10" fill="#3B6FA0" opacity="0.08"/>
    <rect x="130" y="284" width="940" height="42" rx="10" fill="#7C8B99" opacity="0.10"/>
    <rect x="130" y="340" width="940" height="42" rx="10" fill="#E5C042" opacity="0.09"/>
    <rect x="130" y="396" width="940" height="42" rx="10" fill="#DE7A3B" opacity="0.08"/>
  </g>
  <line x1="150" y1="330" x2="1050" y2="330" stroke="#C9D4DE" stroke-width="2"/>
  <text class="b" x="150" y="462">01-01</text>
  <text class="b" x="1050" y="462" text-anchor="end">08-06</text>
  <text class="b" x="600" y="462" text-anchor="middle">2026 年 1 至 8 月 · 四件公开申请</text>

  <!-- fader handle + waveforms -->
  <g>
    <rect x="353" y="314" width="22" height="32" rx="6" fill="#2C5478"/>
    <line x1="358" y1="330" x2="370" y2="330" stroke="#FFFFFF" stroke-width="2.5"/>

    <g stroke="url(#waveBlue)" stroke-width="3.5" stroke-linecap="round">
      <line x1="172" y1="241" x2="172" y2="257"/><line x1="184" y1="236" x2="184" y2="262"/><line x1="196" y1="244" x2="196" y2="254"/>
      <line x1="208" y1="232" x2="208" y2="266"/><line x1="220" y1="240" x2="220" y2="258"/><line x1="232" y1="237" x2="232" y2="261"/>
    </g>
    <text class="rl" x="252" y="254">NVIDIA · 停顿是换气还是说完</text>
    <rect x="1002" y="238" width="56" height="22" rx="11" fill="#3B6FA0"/>
    <text class="chip" x="1030" y="253" text-anchor="middle">抢话</text>

    <g stroke="#7C8B99" stroke-width="3.5" stroke-linecap="round">
      <line x1="396" y1="297" x2="396" y2="313"/><line x1="408" y1="292" x2="408" y2="318"/><line x1="420" y1="300" x2="420" y2="310"/>
      <line x1="432" y1="290" x2="432" y2="320"/><line x1="444" y1="296" x2="444" y2="314"/>
    </g>
    <text class="rl" x="464" y="310">NVIDIA · 统一文本供对话消费</text>
    <rect x="1002" y="294" width="56" height="22" rx="11" fill="#7C8B99"/>
    <text class="chip" x="1030" y="309" text-anchor="middle">识别</text>

    <g stroke="url(#waveYellow)" stroke-width="3.5" stroke-linecap="round">
      <line x1="612" y1="353" x2="612" y2="369"/><line x1="624" y1="348" x2="624" y2="374"/><line x1="636" y1="356" x2="636" y2="366"/>
      <line x1="648" y1="344" x2="648" y2="378"/><line x1="660" y1="352" x2="660" y2="370"/><line x1="672" y1="349" x2="672" y2="373"/>
    </g>
    <text class="rl" x="692" y="366">Sierra · 先应答再补全</text>
    <rect x="1002" y="350" width="56" height="22" rx="11" fill="#C9A227"/>
    <text class="chip" x="1030" y="365" text-anchor="middle">延迟</text>

    <g stroke="url(#waveOrange)" stroke-width="3.5" stroke-linecap="round">
      <line x1="1006" y1="409" x2="1006" y2="425"/><line x1="1018" y1="404" x2="1018" y2="430"/><line x1="1030" y1="412" x2="1030" y2="422"/>
      <line x1="1042" y1="400" x2="1042" y2="434"/>
    </g>
    <text class="rl" x="820" y="422" text-anchor="end">Salesforce · 先检索再生成</text>
    <rect x="840" y="406" width="56" height="22" rx="11" fill="#DE7A3B"/>
    <text class="chip" x="868" y="421" text-anchor="middle">检索</text>

    <circle cx="172" cy="330" r="9" fill="#FFFFFF" stroke="#3B6FA0" stroke-width="3.5"/>
    <circle cx="364" cy="330" r="9" fill="#FFFFFF" stroke="#7C8B99" stroke-width="3.5"/>
    <circle cx="590" cy="330" r="9" fill="#FFFFFF" stroke="#C9A227" stroke-width="3.5"/>
    <circle cx="1050" cy="330" r="9" fill="#FFFFFF" stroke="#DE7A3B" stroke-width="3.5"/>
  </g>

  <!-- gap annotation + opportunity cards -->
  <g>
    <rect x="64" y="492" width="336" height="130" rx="16" fill="#7C8B99" opacity="0.10"/>
    <rect x="64" y="492" width="336" height="6" rx="3" fill="#7C8B99"/>
    <circle cx="102" cy="534" r="15" fill="none" stroke="#7C8B99" stroke-width="4"/>
    <path d="M 94 534 l 6 6 l 10 -12" stroke="#7C8B99" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <text class="stat" x="132" y="548" fill="#5E6B78">空白</text>
    <text class="rl" x="92" y="596">轮次验收标准至今没有成型</text>

    <rect x="432" y="492" width="336" height="130" rx="16" fill="#3B6FA0" opacity="0.08"/>
    <rect x="432" y="492" width="336" height="6" rx="3" fill="url(#gBlue)"/>
    <rect x="460" y="520" width="44" height="28" rx="5" fill="#3B6FA0"/>
    <circle cx="482" cy="534" r="7" fill="#FFFFFF"/>
    <text class="stat" x="520" y="548">3000–8000 元<tspan class="unit"> /次</tspan></text>
    <text class="rl" x="460" y="596">交付前轮次质检报告</text>

    <rect x="800" y="492" width="336" height="130" rx="16" fill="#DE7A3B" opacity="0.08"/>
    <rect x="800" y="492" width="336" height="6" rx="3" fill="url(#gOrange)"/>
    <rect x="828" y="520" width="44" height="28" rx="14" fill="#DE7A3B"/>
    <circle cx="850" cy="534" r="6" fill="#FFFFFF"/>
    <text class="stat" x="888" y="548">$19–49<tspan class="unit"> /线路·月</tspan></text>
    <text class="rl" x="828" y="596">通话巡检订阅</text>
  </g>

  <line x1="64" y1="636" x2="1136" y2="636" stroke="#E3E8EE"/>
  <text class="b" x="64" y="662">四件均为已公开申请而非授权专利 · IPC 集中于 G10L15/22 与 G06F40/284 · 机会判断见正文 · Micropaper</text>
</svg>
