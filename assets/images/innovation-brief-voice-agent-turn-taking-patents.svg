<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">2026 年 1 至 8 月四件轮次接管专利公开：NVIDIA 两件，Sierra 与 Salesforce 各一件</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">四件已公开申请按公开先后序位排列（事件序位轴）</text>


  <!-- x = 300 + monthsSince202601 * 60 -->
  <text x="288" y="153" font-size="12.5" fill="#1A1B1E" text-anchor="end">NVIDIA</text>
  <circle cx="302" cy="149" r="7" fill="#999999"/>
  <text x="317" y="153" font-size="12" fill="#555">2026-01-01 公开 · 句尾检测与语义模型并用判停顿（US20260004070A1）</text>

  <text x="288" y="208" font-size="12.5" fill="#1A1B1E" text-anchor="end">NVIDIA</text>
  <circle cx="410" cy="204" r="7" fill="#999999"/>
  <text x="425" y="208" font-size="12" fill="#555">2026-02-26 公开 · 语音识别统一文本供对话系统（US20260057884A1）</text>

  <text x="288" y="263" font-size="12.5" fill="#1A1B1E" text-anchor="end">Sierra</text>
  <circle cx="530" cy="259" r="7" fill="#D55E00"/>
  <text x="545" y="263" font-size="12" fill="#555">2026-04-30 公开 · 前台/后台触发先应答再补全（US20260120693A1）</text>

  <text x="288" y="318" font-size="12.5" fill="#1A1B1E" text-anchor="end">Salesforce</text>
  <circle cx="740" cy="314" r="7" fill="#D55E00"/>
  <text x="755" y="318" font-size="12" fill="#555">2026-08-06 公开 · 语音提问先检索知识库再生成（US20260229221A1）</text>

  <!-- order axis -->
  <line x1="300" y1="149" x2="300" y2="360" stroke="#1A1B1E" stroke-width="0.75"/>
  <line x1="300" y1="360" x2="1000" y2="360" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="302" y1="360" x2="302" y2="364"/>
    <line x1="410" y1="360" x2="410" y2="364"/>
    <line x1="530" y1="360" x2="530" y2="364"/>
    <line x1="740" y1="360" x2="740" y2="364"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="302" y="380">1</text>
    <text x="410" y="380">2</text>
    <text x="530" y="380">3</text>
    <text x="740" y="380">4</text>
  </g>
  <text x="521" y="404" font-size="14" fill="#1A1B1E" text-anchor="middle">公开先后序位</text>
  <g font-size="12" fill="#555">
    <text x="900" y="153">国际分类集中在</text>
    <text x="900" y="171">G10L15/22（语音输入控制）</text>
    <text x="900" y="189">G06F40/284（语言分析）</text>
    <circle cx="908" cy="224" r="6" fill="#D55E00"/>
    <text x="921" y="228">轮次接管/应答时机</text>
    <circle cx="908" cy="254" r="6" fill="#999999"/>
    <text x="921" y="258">识别与文本供给</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="60" y="462" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="462" font-size="15" fill="#1A1B1E">轮次质检方案：自估定价与投入</text>

  <g font-size="12.5" fill="#1A1B1E">
    <text x="60" y="502">巡检订阅（美元/月/线路）</text>
    <text x="430" y="502">单次质检服务（元/单）</text>
    <text x="820" y="502">MVP 工期（周，1 人）</text>
  </g>

  <!-- subscription direct label (no fabricated scale) -->
  <rect x="60" y="512" width="20" height="18" fill="#0072B2"/>
  <text x="88" y="526" font-size="12" fill="#555">19–49 美元/月/线路（自估定价）</text>
  <text x="60" y="556" font-size="12" fill="#555">范围取自正文，未造刻度轴</text>

  <!-- service range direct label -->
  <rect x="430" y="512" width="20" height="18" fill="#009E73"/>
  <text x="458" y="526" font-size="12" fill="#555">3000–8000 元/单（自估定价）</text>
  <text x="430" y="556" font-size="12" fill="#555">范围取自正文，未造刻度轴</text>

  <!-- week ruler 0-4: x=820..1060 -->
  <line x1="820" y1="536" x2="1060" y2="536" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="820" y1="536" x2="820" y2="540"/>
    <line x1="880" y1="536" x2="880" y2="540"/>
    <line x1="940" y1="536" x2="940" y2="540"/>
    <line x1="1000" y1="536" x2="1000" y2="540"/>
    <line x1="1060" y1="536" x2="1060" y2="540"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="820" y="556">0</text>
    <text x="880" y="556">1</text>
    <text x="940" y="556">2</text>
    <text x="1000" y="556">3</text>
    <text x="1060" y="556">4</text>
  </g>
  <line x1="1060" y1="512" x2="1060" y2="536" stroke="#D55E00" stroke-width="2"/>
  <text x="1052" y="506" font-size="12" fill="#555" text-anchor="end">4</text>

  <text x="60" y="600" font-size="12" fill="#555">标注四类事件：智能体抢话、应答迟缓、误接插话、异常冷场；GPU/API 月成本数百元（自估口径）</text>

  <!-- footnote -->
  <text x="60" y="640" font-size="11" fill="#767676">数据：四件美国申请公开信息（公开不等于授权，正文所引 Free Patents Online 检索）· 定价与工期为作者自估口径</text>
</svg>
