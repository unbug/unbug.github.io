<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #8D9584; }
      .rl { font-size: 15px; fill: #454F42; }
      .val { font-size: 17px; font-weight: 700; fill: #1A1B1E; }
      .b { font-size: 12px; fill: #9CA492; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F7EF"/>
    </linearGradient>
    <linearGradient id="gHoney" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D89A28"/><stop offset="1" stop-color="#EBC163"/>
    </linearGradient>
    <linearGradient id="gLeaf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C7A3D"/><stop offset="1" stop-color="#7CA35F"/>
    </linearGradient>
    <linearGradient id="gRust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5442E"/><stop offset="1" stop-color="#D97A55"/>
    </linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D6E9E"/><stop offset="1" stop-color="#71A0C8"/>
    </linearGradient>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6A4FA3"/><stop offset="1" stop-color="#9A7FC9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1100" cy="112" r="150" fill="#D89A28" opacity="0.07"/>
  <circle cx="86" cy="616" r="115" fill="#4C7A3D" opacity="0.07"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gRust)"/>

  <text class="k" x="64" y="84">一分钟读论文 · ARXIV:2607.27942 · 埃尔朗根-纽伦堡大学等</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">蜂群再勤，蜂王得行</text>
  <text x="64" y="158" font-size="15" fill="#59604F">多智能体系统四大设计原则 + 四级复杂度实测：缩放有效，但先过能力线</text>

  <!-- beehive motif: comb hexagons + bee -->
  <g>
    <g stroke="url(#gHoney)" stroke-width="3" fill="#D89A28" fill-opacity="0.14">
      <path d="M 1030 78 l 18 10.5 v 21 l -18 10.5 l -18 -10.5 v -21 z"/>
      <path d="M 1066 99 l 18 10.5 v 21 l -18 10.5 l -18 -10.5 v -21 z" fill="#4C7A3D" fill-opacity="0.16"/>
      <path d="M 1030 120 l 18 10.5 v 21 l -18 10.5 l -18 -10.5 v -21 z" fill="#B5442E" fill-opacity="0.15"/>
      <path d="M 994 99 l 18 10.5 v 21 l -18 10.5 l -18 -10.5 v -21 z" fill="#3D6E9E" fill-opacity="0.15"/>
    </g>
    <ellipse cx="1092" cy="160" rx="12" ry="8" fill="url(#gHoney)"/>
    <path d="M 1088 153 q -8 -10 2 -12 M 1096 153 q 8 -10 -2 -12" fill="none" stroke="#3D6E9E" stroke-width="2.5"/>
    <line x1="1088" y1="158" x2="1096" y2="158" stroke="#1A1B1E" stroke-width="1.5"/>
    <line x1="1089" y1="163" x2="1097" y2="163" stroke="#1A1B1E" stroke-width="1.5"/>
  </g>

  <!-- four principles chips -->
  <g>
    <rect x="64" y="200" width="256" height="92" rx="12" fill="#D89A28" opacity="0.09"/>
    <text class="serif" x="84" y="242" font-size="21" font-weight="700" fill="#9A6E1E">简洁性</text>
    <text x="84" y="268" font-size="12.5" fill="#59604F">每个组件职责清晰</text>

    <rect x="340" y="200" width="256" height="92" rx="12" fill="#4C7A3D" opacity="0.09"/>
    <text class="serif" x="360" y="242" font-size="21" font-weight="700" fill="#3E6531">弹性反馈</text>
    <text x="360" y="268" font-size="12.5" fill="#59604F">按中间结果调策略</text>

    <rect x="616" y="200" width="256" height="92" rx="12" fill="#3D6E9E" opacity="0.09"/>
    <text class="serif" x="636" y="242" font-size="21" font-weight="700" fill="#33608C">顺序工作流</text>
    <text x="636" y="268" font-size="12.5" fill="#59604F">带可选循环，可回溯</text>

    <rect x="892" y="200" width="244" height="92" rx="12" fill="#6A4FA3" opacity="0.09"/>
    <text class="serif" x="912" y="242" font-size="21" font-weight="700" fill="#543F82">摘要通信</text>
    <text x="912" y="268" font-size="12.5" fill="#59604F">压缩传递，省开销</text>
  </g>

  <!-- hump curve: complexity L1..L4 -> x 120..700; peak at L3 -->
  <g>
    <line x1="120" y1="510" x2="730" y2="510" stroke="#CFC9B4" stroke-width="1.5"/>
    <line x1="120" y1="330" x2="120" y2="510" stroke="#CFC9B4" stroke-width="1.5"/>
    <text class="b" x="110" y="514" text-anchor="end">性能</text>
    <path d="M 150 486 C 260 452 350 400 450 372 C 540 356 610 396 690 452" fill="none" stroke="url(#gLeaf)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 150 486 C 260 452 350 400 450 372 C 540 356 610 396 690 452 L 690 510 L 150 510 Z" fill="#4C7A3D" opacity="0.08"/>
    <circle cx="470" cy="368" r="8" fill="url(#gRust)"/>
    <text class="val" x="470" y="344" text-anchor="middle" fill="#B5442E">中间复杂度达峰</text>
    <text class="b" x="640" y="480">L4：超时 + 评估限制，性能退化</text>
    <text class="b" x="150" y="536">配置复杂度 L1 → L4 递增 · 成本约线性上涨</text>
  </g>

  <!-- right thresholds -->
  <g>
    <rect x="790" y="342" width="346" height="72" fill="#B5442E" opacity="0.07"/>
    <text class="serif" x="806" y="382" font-size="24" font-weight="700" fill="#B5442E">能力阈值</text>
    <text x="806" y="402" font-size="12.5" fill="#59604F">LLM 不过线，加多少 Agent 都白搭</text>

    <rect x="790" y="424" width="346" height="72" fill="#6A4FA3" opacity="0.08"/>
    <text class="serif" x="806" y="464" font-size="24" font-weight="700" fill="#543F82">一致性瓶颈</text>
    <text x="806" y="484" font-size="12.5" fill="#59604F">协调难题贯穿所有缩放级别</text>
  </g>

  <line x1="64" y1="568" x2="1136" y2="568" stroke="#E5E8D8"/>
  <text class="serif" x="64" y="608" font-size="18" fill="#1A1B1E">拓扑形式化为约束有向工作流图：节点是 Agent 角色，边是信息流。</text>
  <text class="b" x="1136" y="608" text-anchor="end">终端系统工程任务基准 · 两种能力档 LLM · 预印本未经同行评审 · Micropaper</text>
</svg>
