<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">注意力竞争公式预测由好转坏的临界点：6 个轻量模型上 16/18 命中（89%），优于立即转向基线的 72%</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">两类任务预测准确率对比（%，论文自测口径）</text>

  <!-- gridlines: x = 300 + 8.4*v (v in %) -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="888" y1="130" x2="888" y2="340"/>
  </g>

  <!-- rows: bars from x=300, x = 300 + 8.4*v -->
  <!-- 非控制案例预测: 89 -->
  <text x="288" y="164" font-size="12.5" fill="#1A1B1E" text-anchor="end">非控制案例预测</text>
  <rect x="300" y="150" width="747.6" height="18" fill="#D55E00"/>
  <text x="1055.6" y="164" font-size="12" fill="#555">89</text>
  <!-- baseline same row -->
  <rect x="300" y="174" width="604.8" height="18" fill="#999999"/>
  <text x="912.8" y="188" font-size="12" fill="#555">72（朴素基线，假设 n*=0 立即转向）</text>

  <!-- 转向时机分类: 94 -->
  <text x="288" y="248" font-size="12.5" fill="#1A1B1E" text-anchor="end">转向时机分类</text>
  <rect x="300" y="234" width="789.6" height="18" fill="#D55E00"/>
  <text x="1097.6" y="248" font-size="12" fill="#555">94</text>
  <text x="300" y="286" font-size="12" fill="#555">分类在 16 个非边界案例中正确 15 个</text>

  <!-- value axis -->
  <line x1="300" y1="340" x2="1140" y2="340" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="340" x2="300" y2="344"/>
    <line x1="888" y1="340" x2="888" y2="344"/>
    
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="364">0</text>
    
    <text x="888" y="364">70</text>
  </g>
  <text x="700" y="390" font-size="14" fill="#1A1B1E" text-anchor="middle">准确率（%）</text>
  <g font-size="12" fill="#555">
    <rect x="300" y="120" width="12" height="10" fill="#D55E00"/>
    <text x="317" y="129">公式预测</text>
    <rect x="450" y="120" width="12" height="10" fill="#999999"/>
    <text x="467" y="129">朴素基线</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="60" y="440" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="440" font-size="15" fill="#1A1B1E">原始命中数（论文自测口径）</text>
  <g font-size="13" fill="#1A1B1E">
    <text x="82" y="474">16/18</text>
    <text x="82" y="506">15 / 16</text>
    <text x="82" y="538">89%</text>
    <text x="82" y="570">94%</text>
    <text x="82" y="602">72%</text>
  </g>
  <g font-size="12" fill="#555">
    <text x="180" y="474">非控制案例预测命中数（准确率 89%）</text>
    <text x="180" y="506">非边界案例分类命中数（准确率 94%）</text>
    <text x="180" y="538">预测任务准确率，灰为基线对照</text>
    <text x="180" y="570">分类任务准确率</text>
    <text x="180" y="602">朴素基线准确率</text>
  </g>
  <circle cx="92" cy="534" r="4" fill="#D55E00"/>
  <circle cx="92" cy="566" r="4" fill="#D55E00"/>
  <circle cx="92" cy="598" r="4" fill="#999999"/>

  <!-- ============ panel c ============ -->
  <text x="640" y="440" font-size="15" font-weight="bold" fill="#1A1B1E">c</text>
  <text x="662" y="440" font-size="15" fill="#1A1B1E">验证范围与机制要点（正文数字）</text>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="646" y1="460" x2="646" y2="604"/>
  </g>
  <g font-size="12" fill="#555">
    <text x="662" y="476">6 个轻量 transformer：GPT-2、Pythia、OPT 系列</text>
    <text x="662" y="502">参数量 124M-410M；局限：410M 参数以上大模型尚待验证</text>
    <text x="662" y="528">判据 ∆raw = A·D - A·B：大于 0 立即输出有害内容；</text>
    <text x="662" y="548">小于 0 先输出 n* 个好内容再转向，n* 可由内容注入调控</text>
    <text x="662" y="574">动机规模：全球约 40 亿人的设备可本地运行 ChatGPT 级模型，</text>
    <text x="662" y="594">离线部署无云端防线，需提前预知转向时机</text>
  </g>

  <!-- footnote -->
  <text x="60" y="652" font-size="11" fill="#767676">数据：arXiv:2602.14370《Competition for attention predicts good-to-bad tipping in AI》（乔治华盛顿大学，论文自测口径）· 正文未报告误差区间，未画误差棒 · 预印本未经同行评审</text>
</svg>
