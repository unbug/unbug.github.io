<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">七个系统均产出强于引文支持的结论；Luna 仅打开 19% 的引用页面</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">结论平滑率（SmoothScore 区间，1–5 分制）</text>

  <!-- gridlines (horizontal majors only for vertical scale is rows; use vertical majors for value axis) -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="290" y1="130" x2="290" y2="420"/>
    <line x1="450" y1="130" x2="450" y2="420"/>
    <line x1="610" y1="130" x2="610" y2="420"/>
    <line x1="770" y1="130" x2="770" y2="420"/>
  </g>

  <!-- rows: x = 290 + 4.8*v -->
  <!-- Gemini ≥3: 85-93 -->
  <text x="278" y="158" font-size="12.5" fill="#1A1B1E" text-anchor="end">Gemini ≥ 3</text>
  <rect x="698" y="144" width="38.4" height="18" fill="#0072B2"/>
  <line x1="698" y1="141" x2="698" y2="165" stroke="#0072B2" stroke-width="0.75"/>
  <line x1="736.4" y1="141" x2="736.4" y2="165" stroke="#0072B2" stroke-width="0.75"/>
  <text x="744" y="158" font-size="12" fill="#555">85–93%</text>

  <!-- Gemini ≥4: 22-35 -->
  <text x="278" y="206" font-size="12.5" fill="#1A1B1E" text-anchor="end">Gemini ≥ 4</text>
  <rect x="395.6" y="192" width="62.4" height="18" fill="#D55E00"/>
  <line x1="395.6" y1="189" x2="395.6" y2="213" stroke="#D55E00" stroke-width="0.75"/>
  <line x1="458" y1="189" x2="458" y2="213" stroke="#D55E00" stroke-width="0.75"/>
  <text x="466" y="206" font-size="12" fill="#555">22–35%</text>

  <!-- DR Tulu ≥3: ~59 -->
  <text x="278" y="254" font-size="12.5" fill="#1A1B1E" text-anchor="end">DR Tulu ≥ 3</text>
  <rect x="290" y="240" width="283.2" height="18" fill="#0072B2" opacity="0.35"/>
  <line x1="573.2" y1="237" x2="573.2" y2="261" stroke="#0072B2" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="581" y="254" font-size="12" fill="#555">约 59%</text>

  <!-- QUEST ≥3: ~55 -->
  <text x="278" y="302" font-size="12.5" fill="#1A1B1E" text-anchor="end">QUEST ≥ 3</text>
  <rect x="290" y="288" width="264" height="18" fill="#0072B2" opacity="0.35"/>
  <line x1="554" y1="285" x2="554" y2="309" stroke="#0072B2" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="562" y="302" font-size="12" fill="#555">约 55%</text>

  <!-- DR Tulu & QUEST ≥4: 7-23 -->
  <text x="278" y="350" font-size="12.5" fill="#1A1B1E" text-anchor="end">DR Tulu / QUEST ≥ 4</text>
  <rect x="323.6" y="336" width="76.8" height="18" fill="#D55E00"/>
  <line x1="323.6" y1="333" x2="323.6" y2="357" stroke="#D55E00" stroke-width="0.75"/>
  <line x1="400.4" y1="333" x2="400.4" y2="357" stroke="#D55E00" stroke-width="0.75"/>
  <text x="408" y="350" font-size="12" fill="#555">7–23%</text>

  <!-- Luna/Sol =1: at least 36 -->
  <text x="278" y="398" font-size="12.5" fill="#1A1B1E" text-anchor="end">Luna / Sol 得分 = 1（无平滑）</text>
  <rect x="462.8" y="384" width="307.2" height="18" fill="#999999"/>
  <polygon points="778,384 790,393 778,402" fill="#999999"/>
  <text x="798" y="398" font-size="12" fill="#555">至少 36%，为其余系统 1.5–2.7 倍</text>

  <!-- value axis -->
  <line x1="290" y1="420" x2="770" y2="420" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="290" y1="420" x2="290" y2="424"/>
    <line x1="450" y1="420" x2="450" y2="424"/>
    <line x1="610" y1="420" x2="610" y2="424"/>
    <line x1="770" y1="420" x2="770" y2="424"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="290" y="440">0</text>
    <text x="450" y="440">25</text>
    <text x="610" y="440">50</text>
    <text x="770" y="440">75</text>
  </g>
  <text x="530" y="464" font-size="14" fill="#1A1B1E" text-anchor="middle">结论占比（%）</text>
  <g font-size="12" fill="#555">
    <rect x="300" y="120" width="12" height="10" fill="#0072B2"/>
    <text x="317" y="129">≥ 3 实质性平滑</text>
    <rect x="430" y="120" width="12" height="10" fill="#D55E00"/>
    <text x="447" y="129">≥ 4 严重平滑</text>
    <line x1="560" y1="125" x2="580" y2="125" stroke="#0072B2" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="586" y="129">论文报告「约」值</text>
  </g>

  <!-- ============ panel b ============ -->
  <text x="850" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="872" y="104" font-size="15" fill="#1A1B1E">引用页面打开率（%）</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="920" y1="130" x2="1140" y2="130"/>
    <line x1="920" y1="220" x2="1140" y2="220"/>
    <line x1="920" y1="310" x2="1140" y2="310"/>
  </g>
  <!-- bars: y = 400 - 3*v -->
  <rect x="940" y="343" width="54" height="57" fill="#0072B2"/>
  <text x="967" y="335" font-size="12" fill="#555" text-anchor="middle">19%</text>
  <text x="967" y="418" font-size="12.5" fill="#1A1B1E" text-anchor="middle">Luna</text>

  <rect x="1050" y="394" width="54" height="6" fill="#0072B2"/>
  <text x="1077" y="386" font-size="12" fill="#555" text-anchor="middle">2%</text>
  <text x="1077" y="418" font-size="12.5" fill="#1A1B1E" text-anchor="middle">Sonnet 5</text>

  <line x1="920" y1="400" x2="1140" y2="400" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="920" y1="400" x2="916" y2="400"/>
    <line x1="920" y1="310" x2="916" y2="310"/>
    <line x1="920" y1="220" x2="916" y2="220"/>
    <line x1="920" y1="130" x2="916" y2="130"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="910" y="404">0</text>
    <text x="910" y="314">30</text>
    <text x="910" y="224">60</text>
    <text x="910" y="134">90</text>
  </g>
  <text x="850" y="450" font-size="12" fill="#555">Luna：引用 496 个文档仅打开 95 个；65 份报告中 45 篇一页未开；</text>
  <text x="850" y="468" font-size="12" fill="#555">搜索摘录中位长度 585 字符</text>

  <!-- footnote -->
  <text x="60" y="560" font-size="11" fill="#767676">数据：arXiv:2610.35793（7 系统 × 4 数据集）· 区间为论文报告范围，「约」为论文近似值 · 打分依赖 LLM judge（与人工标注 93% 结论差 1 分以内）· 预印本未经同行评审</text>
</svg>
