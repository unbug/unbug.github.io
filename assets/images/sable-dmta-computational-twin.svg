<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="30" y="34" font-size="16" font-weight="bold" fill="#0f172a">SABLE：LLM 编排的药物先导化合物优化</text>
  <text x="930" y="34" text-anchor="end" font-size="11" fill="#64748b">arXiv:2608.11483 · UNC Chapel Hill</text>

  <!-- input -->
  <rect x="30" y="120" width="180" height="90" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="120" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">自然语言目标</text>
  <text x="120" y="172" text-anchor="middle" font-size="11" fill="#475569">如：最小化对 METTL3</text>
  <text x="120" y="188" text-anchor="middle" font-size="11" fill="#475569">的预测结合亲和力</text>

  <!-- LLM orchestration layer -->
  <rect x="270" y="80" width="210" height="170" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="375" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#4c1d95">LLM 编排层</text>
  <line x1="290" y1="126" x2="460" y2="126" stroke="#7c3aed" stroke-width="1"/>
  <text x="375" y="150" text-anchor="middle" font-size="12" fill="#4c1d95">解析优化目标与迭代预算</text>
  <text x="375" y="172" text-anchor="middle" font-size="12" fill="#4c1d95">路由任务到专用工具</text>
  <text x="375" y="194" text-anchor="middle" font-size="12" fill="#4c1d95">配置文件替换工具后端</text>
  <text x="375" y="226" text-anchor="middle" font-size="11" fill="#7c3aed">Synthetically-accessible Agentic</text>
  <text x="375" y="240" text-anchor="middle" font-size="11" fill="#7c3aed">Bayesian Ligand Exploration</text>

  <!-- tools -->
  <g>
    <rect x="580" y="60" width="350" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="755" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">反应模板类似物枚举</text>
    <text x="755" y="102" text-anchor="middle" font-size="11" fill="#1e40af">HEALER · 合成可及的类似物库</text>

    <rect x="580" y="132" width="350" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="755" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">ADMET 与理化性质预测</text>
    <text x="755" y="174" text-anchor="middle" font-size="11" fill="#1e40af">RDKit / STOPLIGHT · 药代与安全性端点</text>

    <rect x="580" y="204" width="350" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="755" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">基于结构的亲和力打分</text>
    <text x="755" y="246" text-anchor="middle" font-size="11" fill="#1e40af">Boltz-2 · 复合物结构与 logIC50（计算预言机）</text>

    <rect x="580" y="276" width="350" height="56" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="755" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">贝叶斯优化</text>
    <text x="755" y="318" text-anchor="middle" font-size="11" fill="#9a3412">昂贵评估预算下迭代挑选候选</text>
  </g>

  <!-- arrows: input to LLM -->
  <line x1="210" y1="165" x2="266" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- arrows: LLM routing to four tools -->
  <line x1="480" y1="130" x2="576" y2="88" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="150" x2="576" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="180" x2="576" y2="232" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="210" x2="576" y2="304" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- iteration loop: BO back to LLM -->
  <path d="M 755 332 V 386 H 375 V 254" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="565" y="378" text-anchor="middle" font-size="11" fill="#9a3412">迭代选择，直至终止条件</text>

  <!-- DMTA computational twin band -->
  <rect x="30" y="420" width="900" height="96" rx="10" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>
  <text x="480" y="452" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">DMTA（设计-合成-测试-分析）循环 · 分析与优先级排序阶段的计算孪生体</text>
  <text x="480" y="478" text-anchor="middle" font-size="12" fill="#334155">每个数值输出可溯源：记录来源工具与调用参数，提示词与 JSON 状态转储随代码仓库开源</text>
  <text x="480" y="498" text-anchor="middle" font-size="11" fill="#64748b">支持而非取代药物化学评审与实验验证 · Apache 许可开源</text>
</svg>
