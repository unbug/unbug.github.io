<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">METTL3 回顾性案例：单次运行头部类似物预测 IC50 为 102.33 nM，相对起始化合物约 95 倍预测活性提升（均为计算预测，未经湿实验验证）</text>

  <!-- ================= panel a ================= -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">SABLE 编排架构：LLM 编排层（橙色）路由到四类专用工具（结构示意，非测量值）</text>

  <!-- top box -->
  <rect x="150" y="128" width="420" height="36" fill="#D55E00"/>
  <text x="360" y="151" font-size="12.5" fill="#FFFFFF" text-anchor="middle">LLM 编排层：解析自然语言优化目标与迭代预算，路由任务</text>
  <line x1="360" y1="164" x2="360" y2="188" stroke="#999999" stroke-width="1.5"/>
  <polygon points="356,183 364,183 360,190" fill="#999999"/>

  <!-- four tool boxes -->
  <g font-size="12" text-anchor="middle">
    <rect x="70" y="192" width="250" height="40" fill="none" stroke="#555555" stroke-width="1.5"/>
    <text x="195" y="209" fill="#1A1B1E">HEALER 反应模板引擎</text>
    <text x="195" y="224" fill="#555555">枚举合成可及类似物库</text>

    <rect x="340" y="192" width="250" height="40" fill="none" stroke="#555555" stroke-width="1.5"/>
    <text x="465" y="209" fill="#1A1B1E">RDKit / STOPLIGHT</text>
    <text x="465" y="224" fill="#1A1B1E">理化性质与 ADMET 预测</text>

    <rect x="610" y="192" width="250" height="40" fill="none" stroke="#555555" stroke-width="1.5"/>
    <text x="735" y="209" fill="#1A1B1E">Boltz-2 亲和力打分</text>
    <text x="735" y="224" fill="#555555">复合物结构与 logIC50</text>

    <rect x="880" y="192" width="250" height="40" fill="none" stroke="#555555" stroke-width="1.5"/>
    <text x="1005" y="209" fill="#1A1B1E">贝叶斯优化</text>
    <text x="1005" y="224" fill="#1A1B1E">迭代挑选候选</text>
  </g>
  <g stroke="#999999" stroke-width="1.5">
    <line x1="195" y1="180" x2="1005" y2="180"/>
    <line x1="195" y1="180" x2="195" y2="192"/>
    <line x1="465" y1="180" x2="465" y2="192"/>
    <line x1="735" y1="180" x2="735" y2="192"/>
    <line x1="1005" y1="180" x2="1005" y2="192"/>
  </g>
  <text x="60" y="262" font-size="12" fill="#555555">每个数值输出记录来源工具与调用参数，可逐条回溯；编辑配置文件即可替换枚举引擎或表征后端</text>

  <!-- ================= panel b ================= -->
  <text x="60" y="330" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="330" font-size="15" fill="#1A1B1E">预测 IC50（nM，对数轴，条越短活性越高；均为 Boltz-2 计算预测，非实测）</text>

  <!-- log axis: x = 200 + (log10(v)+2)*146.667 ; ticks 1,10,100,1000,10000 -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="200" y1="444" x2="1040" y2="444"/>
    
    <line x1="200" y1="496" x2="1040" y2="496"/>
  </g>

  <!-- METTL3 seed 9.77 uM: log10(9770)=3.99 -> 200+5.99*146.667=1078.5 -->
  <text x="188" y="392" font-size="12.5" fill="#1A1B1E" text-anchor="end">METTL3 起始化合物</text>
  <rect x="200" y="380" width="878.5" height="16" fill="#999999"/>
  <text x="300" y="374" font-size="12" fill="#555555">9.77 µM（预测；实验值约 7 µM）</text>

  <!-- METTL3 top 102.33 nM: log10=2.01 -> 200+4.01*146.667=788.1 -->
  <text x="188" y="424" font-size="12.5" fill="#1A1B1E" text-anchor="end">METTL3 头部类似物</text>
  <rect x="200" y="412" width="588.1" height="16" fill="#D55E00"/>
  <text x="796" y="406" font-size="12" fill="#1A1B1E">102.33 nM</text>

  <!-- BACE1 seed 58.88 uM: log10(58880)=4.77 -> 200+6.77*146.667=1192.9 (beyond axis end 1140, clipped) -->
  <text x="188" y="472" font-size="12.5" fill="#1A1B1E" text-anchor="end">BACE1 种子分子</text>
  <rect x="200" y="460" width="940" height="16" fill="#999999"/>
  <polygon points="1132,460 1140,468 1132,476" fill="#999999"/>
  <text x="1125" y="452" font-size="12" fill="#555555" text-anchor="end">58.88 µM（预测，轴外截断）</text>

  <!-- BACE1 best 370 nM: log10=2.568 -> 200+4.568*146.667=870 -->
  <text x="188" y="536" font-size="12.5" fill="#1A1B1E" text-anchor="end">BACE1 优化类似物</text>
  <rect x="200" y="524" width="670" height="16" fill="#D55E00"/>
  <text x="878" y="536" font-size="12" fill="#1A1B1E">370 nM（预测）</text>

  <!-- value axis -->
  <line x1="200" y1="560" x2="1140" y2="560" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="200" y1="560" x2="200" y2="564"/>
    <line x1="346.7" y1="560" x2="346.7" y2="564"/>
    <line x1="493.3" y1="560" x2="493.3" y2="564"/>
    <line x1="640" y1="560" x2="640" y2="564"/>
    <line x1="786.7" y1="560" x2="786.7" y2="564"/>
    <line x1="933.3" y1="560" x2="933.3" y2="564"/>
    <line x1="1080" y1="560" x2="1080" y2="564"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="200" y="580">1</text>
    <text x="346.7" y="580">10</text>
    <text x="493.3" y="580">100</text>
    <text x="640" y="580">10<tspan font-size="9" dy="-4">3</tspan></text>
    <text x="786.7" y="580">10<tspan font-size="9" dy="-4">4</tspan></text>
    <text x="933.3" y="580">10<tspan font-size="9" dy="-4">5</tspan></text>
    <text x="1080" y="580">10<tspan font-size="9" dy="-4">6</tspan></text>
  </g>
  <text x="670" y="602" font-size="14" fill="#1A1B1E" text-anchor="middle">预测 IC50（nM，对数刻度）</text>

  <!-- footnote -->
  <text x="60" y="630" font-size="11" fill="#767676">数据：arXiv:2608.11483v1（UNC Chapel Hill，SABLE）· 全部数值为 Boltz-2 计算预测，头部候选未经湿实验验证 · BACE1 种子条超出轴末端为绘图截断</text>
  <text x="60" y="648" font-size="11" fill="#767676">优化未输入 SAR 轨迹或实验标签 · 预印本未经同行评审</text>
</svg>
