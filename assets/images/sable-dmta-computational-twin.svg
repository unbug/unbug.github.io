<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9C9484; }
      .rl { font-size: 15px; fill: #474C54; }
      .val { font-size: 18px; font-weight: 700; fill: #1A1B1E; }
      .b { font-size: 12px; fill: #A5A296; }
      .chip { font-size: 12.5px; font-weight: 600; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F2EA"/>
    </linearGradient>
    <linearGradient id="gLeaf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3E7C43"/><stop offset="1" stop-color="#7FB069"/>
    </linearGradient>
    <linearGradient id="gClay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5442E"/><stop offset="1" stop-color="#D9704F"/>
    </linearGradient>
    <linearGradient id="gWheat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9892F"/><stop offset="1" stop-color="#DCB65F"/>
    </linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D7EA6"/><stop offset="1" stop-color="#7FB3D5"/>
    </linearGradient>
    <linearGradient id="gPlum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7D4E8E"/><stop offset="1" stop-color="#B183C2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1110" cy="105" r="140" fill="#3E7C43" opacity="0.06"/>
  <circle cx="70" cy="625" r="115" fill="#B5442E" opacity="0.05"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gClay)"/>

  <text class="k" x="64" y="84">一分钟读论文 · ARXIV:2608.11483 · UNC CHAPEL HILL</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">算出来的九十五倍</text>
  <text x="64" y="158" font-size="15" fill="#5B6068">SABLE 把 DMTA 循环的分析与优先级排序阶段搬到计算侧，构成选种温室般的计算孪生体</text>

  <!-- right motif: greenhouse seed-selection -->
  <g>
    <path d="M 985 214 q 85 -104 170 0 z" fill="#3D7EA6" opacity="0.16"/>
    <path d="M 985 214 q 85 -104 170 0" fill="none" stroke="#3D7EA6" stroke-width="2" opacity="0.5"/>
    <line x1="1028" y1="182" x2="1028" y2="214" stroke="#3D7EA6" stroke-width="1.5" opacity="0.4"/>
    <line x1="1070" y1="161" x2="1070" y2="214" stroke="#3D7EA6" stroke-width="1.5" opacity="0.4"/>
    <line x1="1112" y1="182" x2="1112" y2="214" stroke="#3D7EA6" stroke-width="1.5" opacity="0.4"/>
    <rect x="985" y="214" width="170" height="4" fill="#3D7EA6" opacity="0.5"/>

    <line x1="1012" y1="282" x2="1012" y2="316" stroke="#3E7C43" stroke-width="3"/>
    <circle cx="1012" cy="272" r="9" fill="url(#gLeaf)"/>
    <line x1="1046" y1="270" x2="1046" y2="316" stroke="#3E7C43" stroke-width="3"/>
    <circle cx="1046" cy="260" r="11" fill="url(#gLeaf)"/>
    <line x1="1080" y1="248" x2="1080" y2="316" stroke="#3E7C43" stroke-width="3"/>
    <circle cx="1080" cy="237" r="13" fill="url(#gWheat)"/>
    <line x1="1114" y1="278" x2="1114" y2="316" stroke="#3E7C43" stroke-width="3"/>
    <circle cx="1114" cy="268" r="9" fill="url(#gLeaf)"/>
    <line x1="1148" y1="262" x2="1148" y2="316" stroke="#3E7C43" stroke-width="3"/>
    <circle cx="1148" cy="252" r="10" fill="url(#gLeaf)"/>
    <rect x="988" y="316" width="176" height="8" rx="2" fill="url(#gClay)" opacity="0.8"/>

    <circle cx="1080" cy="342" r="15" fill="none" stroke="#B5442E" stroke-width="2" opacity="0.75"/>
    <path d="M 1091 353 l 10 10" stroke="#B5442E" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <text class="b" x="1076" y="384" text-anchor="middle">温室选种 · 未经湿实验</text>
  </g>

  <!-- left: seed -> best slope pairs -->
  <g>
    <rect x="64" y="206" width="740" height="70" fill="#3D7EA6" opacity="0.07"/>
    <rect x="64" y="294" width="740" height="70" fill="#B5442E" opacity="0.08"/>
    <rect x="64" y="382" width="740" height="70" fill="#3D7EA6" opacity="0.07"/>

    <text class="rl" x="268" y="240" text-anchor="end">CAMKK2 · logIC50</text>
    <text class="b" x="268" y="258" text-anchor="end">种子 → 最佳观测</text>
    <circle cx="330" cy="241" r="7" fill="#FFFFFF" stroke="#3D7EA6" stroke-width="3"/>
    <line x1="330" y1="241" x2="436" y2="241" stroke="url(#gSky)" stroke-width="2.5"/>
    <circle cx="436" cy="241" r="9" fill="url(#gSky)"/>
    <text class="val" x="455" y="247" fill="#3D7EA6">-0.52 → -1.55</text>
    <text class="b" x="600" y="246">改善 1.03 个 log 单位</text>

    <text class="rl" x="268" y="328" text-anchor="end">METTL3 · 预测 IC50</text>
    <text class="b" x="268" y="346" text-anchor="end">种子 → 头部类似物</text>
    <circle cx="330" cy="329" r="7" fill="#FFFFFF" stroke="#B5442E" stroke-width="3"/>
    <line x1="330" y1="329" x2="436" y2="329" stroke="url(#gClay)" stroke-width="3.5"/>
    <circle cx="436" cy="329" r="10" fill="url(#gClay)"/>
    <text class="val" x="455" y="335" fill="#B5442E" font-size="20">9.77 µM → 102.33 nM</text>
    <text class="serif" x="672" y="336" font-size="24" font-weight="700" fill="#B5442E">约 95 倍</text>

    <text class="rl" x="268" y="416" text-anchor="end">BACE1 · 预测亲和力</text>
    <text class="b" x="268" y="434" text-anchor="end">种子 → 类似物</text>
    <circle cx="330" cy="417" r="7" fill="#FFFFFF" stroke="#3D7EA6" stroke-width="3"/>
    <line x1="330" y1="417" x2="436" y2="417" stroke="url(#gSky)" stroke-width="2.5"/>
    <circle cx="436" cy="417" r="9" fill="url(#gSky)"/>
    <text class="val" x="455" y="423" fill="#3D7EA6">58.88 µM → 370 nM</text>
  </g>

  <!-- right column: stats -->
  <g>
    <rect x="836" y="404" width="304" height="76" fill="#B9892F" opacity="0.09"/>
    <text class="serif" x="856" y="436" font-size="22" font-weight="700" fill="#8A6620">省 10³–10⁶ 倍</text>
    <text x="856" y="462" font-size="12.5" fill="#6B7078">Boltz-2 推理调用 · 相对穷举筛选</text>

    <text class="rl" x="856" y="512">前 20 名候选 · 约 5 次迭代</text>
    <text class="b" x="856" y="532">累积分布进入平台期（CAMKK2 单目标）</text>
  </g>

  <!-- bottom chips: four tools -->
  <line x1="64" y1="486" x2="804" y2="486" stroke="#E8E3D2"/>
  <g>
    <rect x="64" y="506" width="130" height="28" rx="14" fill="url(#gLeaf)" opacity="0.18"/>
    <text x="129" y="525" text-anchor="middle" class="chip" fill="#2F5E33">HEALER 枚举</text>
    <rect x="206" y="506" width="130" height="28" rx="14" fill="url(#gSky)" opacity="0.2"/>
    <text x="271" y="525" text-anchor="middle" class="chip" fill="#2F5F80">性质 / ADMET</text>
    <rect x="348" y="506" width="130" height="28" rx="14" fill="url(#gPlum)" opacity="0.18"/>
    <text x="413" y="525" text-anchor="middle" class="chip" fill="#5F3A6E">Boltz-2 打分</text>
    <rect x="490" y="506" width="130" height="28" rx="14" fill="url(#gWheat)" opacity="0.24"/>
    <text x="555" y="525" text-anchor="middle" class="chip" fill="#7A5A14">贝叶斯优化</text>
    <text class="b" x="636" y="525">LLM 编排层路由四类工具</text>
  </g>

  <text class="serif" x="64" y="592" font-size="18" fill="#1A1B1E">九十五倍是温室里的预测值，不是量筒里的实测值。</text>
  <text class="b" x="1136" y="618" text-anchor="end">全部为计算预测 · 头部候选未经湿实验验证 · 回顾性案例 · Micropaper</text>
</svg>
