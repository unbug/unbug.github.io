<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">PTC 在 11/14 的模型上持平或更优、长链任务领先 18.8%，全模型宏平均反而略低：JSON 78.6% 高于 PTC 77.0%</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">两种口径方向相反（BFCL v4）</text>

  <!-- macro avg bars: x = 300 + 12*v -->
  <text x="288" y="160" font-size="12.5" fill="#1A1B1E" text-anchor="end">主评测宏平均：JSON</text>
  <rect x="300" y="146" width="825.3" height="18" fill="#999999"/>
  <text x="1133" y="160" font-size="12" fill="#555">78.6</text>
  <text x="288" y="190" font-size="12.5" fill="#1A1B1E" text-anchor="end">主评测宏平均：PTC</text>
  <rect x="300" y="176" width="808.5" height="18" fill="#0072B2"/>
  <text x="1116" y="190" font-size="12" fill="#555">77.0</text>
  <text x="60" y="216" font-size="12" fill="#555">百分比准确率（%），灰色为 JSON 基线，蓝色为 PTC。</text>

  <!-- per-model verdict: stacked to 14 models, x = 300 + 60*n -->
  <text x="288" y="252" font-size="12.5" fill="#1A1B1E" text-anchor="end">逐模型：持平或更优</text>
  <rect x="300" y="238" width="660" height="18" fill="#0072B2"/>
  <rect x="960" y="238" width="180" height="18" fill="#999999"/>
  <text x="630" y="252" font-size="12" fill="#FFFFFF" text-anchor="middle">11 个持平或更优</text>
  <text x="1050" y="252" font-size="12" fill="#FFFFFF" text-anchor="middle">3 个未达</text>

  <text x="288" y="300" font-size="12.5" fill="#1A1B1E" text-anchor="end">并行场景：持平或更优</text>
  <rect x="300" y="286" width="780" height="18" fill="#0072B2"/>
  <rect x="1080" y="286" width="60" height="18" fill="#999999"/>
  <text x="690" y="300" font-size="12" fill="#FFFFFF" text-anchor="middle">13 个</text>
  <text x="1110" y="300" font-size="12" fill="#555" text-anchor="middle">1 个</text>

  <!-- stacked axis -->
  <line x1="300" y1="320" x2="1140" y2="320" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="300" y1="320" x2="300" y2="324"/>
    <line x1="480" y1="320" x2="480" y2="324"/>
    <line x1="660" y1="320" x2="660" y2="324"/>
    <line x1="840" y1="320" x2="840" y2="324"/>
    <line x1="1020" y1="320" x2="1020" y2="324"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="300" y="344">0</text>
    <text x="480" y="344">3</text>
    <text x="660" y="344">6</text>
    <text x="840" y="344">9</text>
    <text x="1020" y="344">12</text>
  </g>
  <text x="720" y="368" font-size="14" fill="#1A1B1E" text-anchor="middle">模型个数（个，共 14 个）</text>

  <text x="60" y="392" font-size="12" fill="#555">宏平均差距主要由三个 OpenAI 旧模型在并行类别的换行符编码失败驱动。</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="436" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="436" font-size="15" fill="#1A1B1E">PTC 相对 JSON tool calling 的绝对变化（百分点）</text>

  <!-- diverging axis at x=620 ; scale 12 px/pt -->
  <line x1="620" y1="456" x2="620" y2="590" stroke="#999999" stroke-width="0.75"/>

  <text x="600" y="478" font-size="12.5" fill="#1A1B1E" text-anchor="end">链式任务（链条 12 步以上）</text>
  <rect x="620" y="464" width="225.6" height="18" fill="#0072B2"/>
  <text x="854" y="478" font-size="12" fill="#555">+18.8</text>

  <text x="600" y="514" font-size="12.5" fill="#1A1B1E" text-anchor="end">上下文注入后：PTC 平均提升</text>
  <rect x="620" y="500" width="66" height="18" fill="#0072B2"/>
  <text x="694" y="514" font-size="12" fill="#555">+5.5</text>

  <text x="600" y="550" font-size="12.5" fill="#1A1B1E" text-anchor="end">上下文注入后：JSON 平均退化</text>
  <rect x="592.4" y="536" width="27.6" height="18" fill="#999999"/>
  <text x="584" y="550" font-size="12" fill="#555" text-anchor="end">-2.3</text>

  <text x="600" y="586" font-size="12.5" fill="#1A1B1E" text-anchor="end">GPT-5.6 家族提升区间</text>
  <line x1="670.4" y1="582" x2="747.2" y2="582" stroke="#0072B2" stroke-width="1.5"/>
  <line x1="670.4" y1="575" x2="670.4" y2="589" stroke="#0072B2" stroke-width="1.5"/>
  <line x1="747.2" y1="575" x2="747.2" y2="589" stroke="#0072B2" stroke-width="1.5"/>
  <text x="757" y="587" font-size="12" fill="#555">+4.2 至 +10.6，三个变体全部为正</text>

  <text x="60" y="614" font-size="12" fill="#555">并行枚举：JSON 超过模型阈值即丢弃调用（Claude Sonnet 5 阈值 N=70–72），PTC 在 N=100 保持 100% 枚举准确率。</text>

  <!-- footnote -->
  <text x="60" y="656" font-size="11" fill="#767676">数据：arXiv:2608.06370（普华永道美国，BFCL v4，309 条子集，8 个任务类别，14 个模型）· 均为论文自测口径 · echo-return stub 只测参数序列化准确率 · 预印本未经同行评审</text>
</svg>
