<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- title -->
  <text x="30" y="34" font-size="16" font-weight="bold" fill="#0f172a">工具调用的苦涩教训：JSON vs PTC</text>
  <text x="930" y="34" text-anchor="end" font-size="11" fill="#64748b">arXiv:2608.06370 · PricewaterhouseCoopers U.S.A.</text>

  <!-- left column: JSON tool calling -->
  <rect x="30" y="64" width="410" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="235" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">JSON tool calling（原生范式）</text>
  <text x="235" y="104" text-anchor="middle" font-size="11" fill="#1e40af">模型输出 JSON 函数调用，逐次往返执行</text>

  <rect x="30" y="132" width="410" height="140" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="50" y="160" font-size="12" font-weight="bold" fill="#0f172a">每个环节多一次推理回合</text>
  <text x="50" y="180" font-size="11" fill="#475569">长链任务中往返开销随链条累积</text>
  <rect x="50" y="200" width="370" height="52" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="235" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">并行扇出存在结构性硬上限</text>
  <text x="235" y="240" text-anchor="middle" font-size="11" fill="#991b1b">Claude Sonnet 5：N = 70–72 起丢弃调用</text>

  <!-- right column: PTC -->
  <rect x="520" y="64" width="410" height="52" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="725" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">程序化工具调用（PTC）</text>
  <text x="725" y="104" text-anchor="middle" font-size="11" fill="#6d28d9">模型写 Python 代码，调用类型化 stub</text>

  <rect x="520" y="132" width="410" height="140" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="540" y="160" font-size="12" font-weight="bold" fill="#0f172a">一段程序承载长链与高扇出</text>
  <text x="540" y="180" font-size="11" fill="#475569">代码内循环调用工具，无需逐环节往返</text>
  <rect x="540" y="200" width="370" height="52" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="725" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">并行扇出无硬上限</text>
  <text x="725" y="240" text-anchor="middle" font-size="11" fill="#166534">N = 100 仍保持 100% 枚举准确率</text>

  <!-- center VS -->
  <text x="480" y="195" text-anchor="middle" font-size="20" font-weight="bold" fill="#94a3b8">VS</text>
  <text x="480" y="290" text-anchor="middle" font-size="11" fill="#64748b">链式任务 ≥12 步：PTC 领先 18.8%（绝对差距）</text>

  <!-- stats band -->
  <rect x="30" y="300" width="290" height="96" rx="8" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/>
  <text x="175" y="340" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">11 / 14</text>
  <text x="175" y="364" text-anchor="middle" font-size="11" fill="#334155">模型上 PTC 持平或更优（逐模型口径）</text>
  <text x="175" y="382" text-anchor="middle" font-size="10" fill="#64748b">BFCL v4 · 309 条子集 · 8 类任务</text>

  <rect x="335" y="300" width="290" height="96" rx="8" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/>
  <text x="480" y="340" text-anchor="middle" font-size="22" font-weight="bold" fill="#4c1d95">+10.6%</text>
  <text x="480" y="364" text-anchor="middle" font-size="11" fill="#334155">GPT-5.6 家族最大绝对提升（Sol / Terra）</text>
  <text x="480" y="382" text-anchor="middle" font-size="10" fill="#64748b">三个最新变体全部为正：+4.2% ~ +10.6%</text>

  <rect x="640" y="300" width="290" height="96" rx="8" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/>
  <text x="785" y="340" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">77.0 vs 78.6</text>
  <text x="785" y="364" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">全模型宏平均：PTC 反而略低</text>
  <text x="785" y="382" text-anchor="middle" font-size="10" fill="#64748b">差距主要来自三个 OpenAI 旧模型的 \n 编码失败</text>

  <!-- bottom band: benchmark caveat -->
  <rect x="30" y="420" width="900" height="96" rx="10" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>
  <text x="480" y="450" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">BFCL v4 · echo-return stub：函数原样返回参数，不执行真实 API</text>
  <text x="480" y="476" text-anchor="middle" font-size="12" fill="#334155">测的是参数序列化准确率，不是端到端工具执行正确性；链式输入 token 为 JSON 的 1.5 倍，高扇出时开销反转</text>
  <text x="480" y="498" text-anchor="middle" font-size="11" fill="#64748b">上下文污染场景：PTC 平均 +5.5%，JSON 基线 −2.3%，文件系统发现式方法退化 32%</text>
</svg>
