<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="500" fill="#fafbfc"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">PAST-Bench: Recursive Self-Improvement Evaluation Framework</text>

  <!-- Top row: Task Family Sequences -->
  <rect x="40" y="55" width="320" height="80" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="200" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#4338ca">Task Family Sequences</text>
  <text x="200" y="96" text-anchor="middle" font-size="11" fill="#555">Ordered episode sequences with</text>
  <text x="200" y="110" text-anchor="middle" font-size="11" fill="#555">matched persistence-on/off control</text>

  <!-- Arrow down -->
  <line x1="200" y1="135" x2="200" y2="165" stroke="#6366f1" stroke-width="1.5"/>
  <polygon points="195,162 200,172 205,162" fill="#6366f1"/>

  <!-- Middle row: Four capability dimensions -->
  <rect x="40" y="175" width="155" height="90" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="117" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">memory_ability</text>
  <text x="117" y="216" text-anchor="middle" font-size="10" fill="#555">Preferences, constraints,</text>
  <text x="117" y="230" text-anchor="middle" font-size="10" fill="#555">prior examples</text>
  <text x="117" y="248" text-anchor="middle" font-size="10" fill="#92400e">5 task families, 41 eps</text>

  <rect x="205" y="175" width="155" height="90" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="282" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">procedural_ability</text>
  <text x="282" y="216" text-anchor="middle" font-size="10" fill="#555">Process and skill reuse</text>
  <text x="282" y="230" text-anchor="middle" font-size="10" fill="#555">Cross-session workflow</text>
  <text x="282" y="248" text-anchor="middle" font-size="10" fill="#065f46">8 task families, 64 eps</text>

  <rect x="370" y="175" width="155" height="90" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="447" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">proactive_info_gather</text>
  <text x="447" y="216" text-anchor="middle" font-size="10" fill="#555">Pre-action context lookup</text>
  <text x="447" y="230" text-anchor="middle" font-size="10" fill="#555">Prior session awareness</text>
  <text x="447" y="248" text-anchor="middle" font-size="10" fill="#5b21b6">6 task families, 48 eps</text>

  <rect x="535" y="175" width="155" height="90" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="612" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#9d174d">update_ability</text>
  <text x="612" y="216" text-anchor="middle" font-size="10" fill="#555">Replace outdated facts,</text>
  <text x="612" y="230" text-anchor="middle" font-size="10" fill="#555">rules, and procedures</text>
  <text x="612" y="248" text-anchor="middle" font-size="10" fill="#9d174d">7 task families, 51 eps</text>

  <!-- Arrows down -->
  <line x1="117" y1="265" x2="117" y2="295" stroke="#888" stroke-width="1"/>
  <line x1="282" y1="265" x2="282" y2="295" stroke="#888" stroke-width="1"/>
  <line x1="447" y1="265" x2="447" y2="295" stroke="#888" stroke-width="1"/>
  <line x1="612" y1="265" x2="612" y2="295" stroke="#888" stroke-width="1"/>

  <!-- Convergence arrow -->
  <path d="M117,295 L400,320 L612,295" fill="none" stroke="#888" stroke-width="1"/>

  <!-- Mechanism Attribution box -->
  <rect x="250" y="300" width="300" height="70" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="400" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="#0369a1">Mechanism-Level Attribution</text>
  <text x="400" y="341" text-anchor="middle" font-size="11" fill="#555">Artifact-level + Trace-level evidence</text>
  <text x="400" y="357" text-anchor="middle" font-size="11" fill="#555">Distinguish true experience reuse from surface gains</text>

  <!-- Arrow down -->
  <line x1="400" y1="370" x2="400" y2="400" stroke="#0284c7" stroke-width="1.5"/>
  <polygon points="395,397 400,407 405,397" fill="#0284c7"/>

  <!-- Bottom: Hermes+ -->
  <rect x="100" y="410" width="600" height="75" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Hermes+ Improvement Framework</text>

  <!-- Five mechanisms -->
  <rect x="120" y="442" width="80" height="30" rx="4" fill="#bbf7d0"/>
  <text x="160" y="461" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">Plan</text>

  <rect x="215" y="442" width="80" height="30" rx="4" fill="#bbf7d0"/>
  <text x="255" y="461" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">Render</text>

  <rect x="310" y="442" width="80" height="30" rx="4" fill="#bbf7d0"/>
  <text x="350" y="461" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">Route</text>

  <rect x="405" y="442" width="80" height="30" rx="4" fill="#bbf7d0"/>
  <text x="445" y="461" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">Gate</text>

  <rect x="500" y="442" width="80" height="30" rx="4" fill="#bbf7d0"/>
  <text x="540" y="461" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">Close</text>

  <!-- Right side: Key stats -->
  <rect x="680" y="55" width="100" height="120" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="730" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#854d0e">Key Stats</text>
  <text x="730" y="92" text-anchor="middle" font-size="10" fill="#555">26 task families</text>
  <text x="730" y="106" text-anchor="middle" font-size="10" fill="#555">204 episodes</text>
  <text x="730" y="120" text-anchor="middle" font-size="10" fill="#555">7 base models</text>
  <text x="730" y="134" text-anchor="middle" font-size="10" fill="#555">4 agent frameworks</text>

  <!-- Bottom right: Source -->
  <text x="790" y="492" text-anchor="end" font-size="9" fill="#999">Source: arXiv:2608.04003v1</text>
</svg>
