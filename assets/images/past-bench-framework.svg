<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9A8F7C; }
      .rl { font-size: 15px; fill: #45413A; }
      .val { font-size: 20px; font-weight: 700; }
      .b { font-size: 12px; fill: #ABA48F; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F7F2E9"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F8A3D"/><stop offset="1" stop-color="#93BC6B"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5442E"/><stop offset="1" stop-color="#D97A55"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C99327"/><stop offset="1" stop-color="#EBC55E"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E7D8C"/><stop offset="1" stop-color="#74B4BE"/>
    </linearGradient>
    <linearGradient id="gPlum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7D5A96"/><stop offset="1" stop-color="#B08FC4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1110" cy="95" r="125" fill="#2E7D8C" opacity="0.06"/>
  <circle cx="75" cy="615" r="115" fill="#4F8A3D" opacity="0.06"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gGold)"/>

  <text class="k" x="64" y="84">一分钟读论文 · ARXIV:2608.04003 · CUHK/阿里</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#26231D">留经验，才见真长进</text>
  <text x="64" y="158" font-size="15" fill="#6E6757">PAST-Bench：匹配控制组隔离「经验保留」的因果效应</text>

  <!-- greenhouse motif -->
  <g>
    <path d="M 1020 150 v -46 a 52 52 0 0 1 104 0 v 46" fill="#2E7D8C" opacity="0.14"/>
    <path d="M 1020 150 v -46 a 52 52 0 0 1 104 0 v 46" fill="none" stroke="#2E7D8C" stroke-width="3"/>
    <line x1="1072" y1="54" x2="1072" y2="150" stroke="#2E7D8C" stroke-width="2" opacity="0.6"/>
    <line x1="1020" y1="150" x2="1124" y2="150" stroke="#45413A" stroke-width="3"/>
    <path d="M 1072 150 v -26" stroke="#4F8A3D" stroke-width="3.5"/>
    <path d="M 1072 132 q -18 -4 -22 -20 q 18 2 22 20" fill="url(#gGreen)"/>
    <path d="M 1072 126 q 18 -4 22 -20 q -18 2 -22 20" fill="url(#gGreen)"/>
    <circle cx="1072" cy="118" r="5" fill="url(#gGold)"/>
    <text class="b" x="1072" y="178" text-anchor="middle">同一品种 · 两畦对照</text>
  </g>

  <!-- matched control: two rows of episodes -->
  <g>
    <text class="rl" x="64" y="216" font-weight="700" fill="#26231D">匹配控制组 · 有序 episode 序列</text>

    <rect x="64" y="230" width="640" height="56" rx="8" fill="#4F8A3D" opacity="0.07"/>
    <text class="rl" x="84" y="264">经验持久化 开</text>
    <g fill="url(#gGreen)">
      <circle cx="240" cy="258" r="11"/><circle cx="286" cy="258" r="11"/><circle cx="332" cy="258" r="11"/><circle cx="378" cy="258" r="11"/><circle cx="424" cy="258" r="11"/><circle cx="470" cy="258" r="11"/>
    </g>
    <path d="M 500 258 h 60" stroke="#4F8A3D" stroke-width="2.5" stroke-dasharray="4 5"/>
    <path d="M 560 258 l -10 -6 v 12 z" fill="#4F8A3D"/>
    <text class="val" x="586" y="265" fill="#3D6B2E" font-size="16">跨会话改进</text>

    <rect x="64" y="298" width="640" height="56" rx="8" fill="#B5442E" opacity="0.06"/>
    <text class="rl" x="84" y="332">经验持久化 关</text>
    <g fill="#FFFFFF" stroke="#B5442E" stroke-width="2.5">
      <circle cx="240" cy="326" r="11"/><circle cx="286" cy="326" r="11"/><circle cx="332" cy="326" r="11"/><circle cx="378" cy="326" r="11"/><circle cx="424" cy="326" r="11"/><circle cx="470" cy="326" r="11"/>
    </g>
    <path d="M 500 326 h 60" stroke="#B5442E" stroke-width="2.5" stroke-dasharray="4 5" opacity="0.6"/>
    <path d="M 560 326 l -10 -6 v 12 z" fill="#B5442E" opacity="0.6"/>
    <text class="val" x="586" y="333" fill="#8A2E1E" font-size="16">基线对照</text>

    <text class="b" x="64" y="384">「模型本身强」与「从经验变强」分开量 · 增益不均衡，能力与模型依赖</text>
  </g>

  <!-- scale anchor -->
  <g>
    <text class="serif" x="1136" y="230" text-anchor="end" font-size="52" font-weight="700" fill="#26231D">26 <tspan font-size="22" fill="#6E6757">族</tspan> × <tspan fill="#B5442E">204</tspan></text>
    <text x="1136" y="258" text-anchor="end" font-size="14" fill="#45413A">任务族 × episode · 7 个基础模型 × 4 种框架</text>
    <text class="b" x="1136" y="280" text-anchor="end">机制级归因：artifact 与 trace 双层证据</text>
  </g>

  <!-- four capabilities chips -->
  <g>
    <text class="rl" x="64" y="428" font-weight="700" fill="#26231D">四大能力维度</text>
    <rect x="64" y="444" width="158" height="42" rx="8" fill="#2E7D8C" opacity="0.14"/>
    <text x="143" y="462" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22606C">记忆能力</text>
    <text x="143" y="479" text-anchor="middle" font-size="11.5" fill="#456068">留住偏好与约束</text>
    <rect x="234" y="444" width="158" height="42" rx="8" fill="#4F8A3D" opacity="0.13"/>
    <text x="313" y="462" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3D6B2E">流程能力</text>
    <text x="313" y="479" text-anchor="middle" font-size="11.5" fill="#52684A">复用流程与技能</text>
    <rect x="404" y="444" width="176" height="42" rx="8" fill="#C99327" opacity="0.17"/>
    <text x="492" y="462" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8A6614">主动查旧</text>
    <text x="492" y="479" text-anchor="middle" font-size="11.5" fill="#7A6738">动手前先找上下文</text>
    <rect x="592" y="444" width="158" height="42" rx="8" fill="#7D5A96" opacity="0.15"/>
    <text x="671" y="462" text-anchor="middle" font-size="13.5" font-weight="700" fill="#5F4273">更新能力</text>
    <text x="671" y="479" text-anchor="middle" font-size="11.5" fill="#5F5570">替换过时的事实</text>
  </g>

  <!-- Hermes+ five mechanisms -->
  <g>
    <rect x="786" y="316" width="350" height="238" rx="12" fill="#C99327" opacity="0.08"/>
    <rect x="786" y="316" width="350" height="6" rx="3" fill="url(#gGold)"/>
    <text class="serif" x="812" y="358" font-size="23" font-weight="700" fill="#26231D">Hermes+ 五道农时</text>
    <g font-size="14" fill="#45413A">
      <text x="812" y="392">Plan <tspan fill="#8A8375" font-size="12.5">先规划经验用法</tspan></text>
      <text x="812" y="420">Render <tspan fill="#8A8375" font-size="12.5">改进经验表示</tspan></text>
      <text x="812" y="448">Route <tspan fill="#8A8375" font-size="12.5">检索路由更准</tspan></text>
      <text x="812" y="476">Gate <tspan fill="#8A8375" font-size="12.5">质量门控把关</tspan></text>
      <text x="812" y="504">Close <tspan fill="#8A8375" font-size="12.5">管好状态收口</tspan></text>
    </g>
    <text class="b" x="812" y="536" fill="#8A6614">换旧状态的任务上改进最显著</text>
  </g>

  <line x1="64" y1="580" x2="1136" y2="580" stroke="#E7E1CF"/>
  <text class="serif" x="64" y="612" font-size="19" fill="#26231D">表面增益未必来自经验复用——归因要看机制，不看总分。</text>
  <text class="b" x="64" y="642">评估器用 MiniMax-M2.7 做 judge · Hermes+ 跨框架通用性未验证 · Micropaper</text>
</svg>
