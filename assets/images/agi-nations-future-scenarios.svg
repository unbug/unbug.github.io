<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 620">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1A1B1E" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="620" fill="#555555"/>

  <!-- Decorative circles -->
  <circle cx="900" cy="50" r="150" fill="#56B4E9" opacity="0.05"/>
  <circle cx="100" cy="580" r="200" fill="#0072B2" opacity="0.05"/>
  <circle cx="475" cy="310" r="250" fill="#009E73" opacity="0.03"/>

  <!-- Title -->
  <rect x="60" y="20" width="830" height="55" rx="10" fill="#F0F0F0" filter="url(#shadow)"/>
  <text x="475" y="53" text-anchor="middle" fill="#009E73" font-size="28" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">
    AGI 与国运兴衰：8 种未来情景
  </text>
  <text x="475" y="75" text-anchor="middle" fill="#0072B2" font-size="14" font-family="system-ui, -apple-system, sans-serif">
    RAND Corporation · How AGI Could Affect the Rise and Fall of Nations · 8 Scenarios
  </text>

  <!-- Central globe -->
  <g transform="translate(475, 150)">
    <circle cx="0" cy="0" r="55" fill="#0072B2" opacity="0.85"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#0072B2" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#0072B2" stroke-width="1" opacity="0.3"/>
    <text x="0" y="7" text-anchor="middle" fill="white" font-size="15" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">
      AGI
    </text>
    <text x="0" y="23" text-anchor="middle" fill="#0072B2" font-size="11" font-family="system-ui, -apple-system, sans-serif">
      Future Scenarios
    </text>
  </g>

  <!-- 8 Scenarios grid -->
  <!-- Row 1 -->
  <g transform="translate(60, 150)">
    <!-- Scenario 1: Competition-driven -->
    <rect x="0" y="0" width="290" height="110" rx="10" fill="#F0F0F0" filter="url(#shadow)"/>
    <rect x="0" y="0" width="290" height="4" rx="10" fill="#555555"/>
    <text x="145" y="25" text-anchor="middle" fill="#D55E00" font-size="16" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">
      1. 竞争驱动型
    </text>
    <text x="145" y="48" text-anchor="middle" fill="#CC79A7" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="bold">🔥 激烈国家竞争</text>
    <text x="145" y="68" text-anchor="middle" fill="#009E73" font-size="10" font-family="system-ui, -apple-system, sans-serif">加速部署 AI 但政策混乱</text>
  </g>

  <g transform="translate(360, 150)">
    <!-- Scenario 2: Cooperative Governance -->
    <rect x="0" y="0" width="290" height="110" rx="10" fill="#F0F0F0" filter="url(#shadow)"/>
    <rect x="0" y="0" width="290" height="4" rx="10" fill="#555555"/>
    <text x="145" y="25" text-anchor="middle" fill="#009E73" font-size="16" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">
      2. 合作治理型
    </text>
    <text x="145" y="48" text-anchor="middle" fill="#56B4E9" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="bold">🤝 国际协调</text>
    <text x="145" y="68" text-anchor="middle" fill="#009E73" font-size="10" font-family="system-ui, -apple-system, sans-serif">统一标准与合作机制</text>
  </g>

  <g transform="translate(660, 150)">
    <!-- Scenario 3: Tech Dominance -->
    <rect x="0" y="0" width="230" height="110" rx="10" fill="#F0F0F0" filter="url(#shadow)"/>
    <rect x="0" y="0" width="230" height="4" rx="10" fill="#555555"/>
    <text x="115" y="25" text-anchor="middle" fill="#56B4E9" font-size="16" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">
      3. 技术主导型
    </text>
    <text x="115" y="48" text-anchor="middle" fill="#CC79A7" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="bold">💻 科技巨头掌权</text>
    <text x="115" y="68" text-anchor="middle" fill="#009E73" font-size="10" font-family="system-ui, -apple-system, sans-serif">公司掌握核心权力</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(60, 280)">
    <!-- Scenario 4: Democratic Vulnerability -->
    <rect x="0" y="0" width="290" height="110" rx="10" fill="#F0F0F0" filter="url(#shadow)"/>
    <rect x="0" y="0" width="290" height="4" rx="10" fill="#555555"/>
    <text x="145" y="25" text-anchor="middle" fill="#E69F00" font-size="16" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">
      4. 民主脆弱型
    </text>
    <text x="145" y="48" text-anchor="middle" fill="#CC79A7" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="bold">⚠️ 民主受威胁</text>
    <text x="145" y="68" text-anchor="middle" fill="#009E73" font-size="10" font-family="system-ui, -apple-system, sans-serif">AI 操纵舆论与虚假信息</text>
  </g>

  <g transform="translate(360, 280)">
    <!-- Scenario 5: Authoritarian Strengthening -->
    <rect x="0" y="0" width="290" height="110" rx="10" fill="#F0F0F0" filter="url(#shadow)"/>
    <rect x="0" y="0" width="290" height="4" rx="10" fill="#555555"/>
    <text x="145" y="25" text-anchor="middle" fill="#56B4E9" font-size="16" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">
      5. 威权强化型
    </text>
    <text x="145" y="48" text-anchor="middle" fill="#CC79A7" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="bold">🏛️ 威权巩固</text>
    <text x="145" y="68" text-anchor="middle" fill="#009E73" font-size="10" font-family="system-ui, -apple-system, sans-serif">利用 AI 强化统治</text>
  </g>

  <g transform="translate(660, 280)">
    <!-- Scenario 6: Global Imbalance -->
    <rect x="0" y="0" width="230" height="110" rx="10" fill="#F0F0F0" filter="url(#shadow)"/>
    <rect x="0" y="0" width="230" height="4" rx="10" fill="#555555"/>
    <text x="115" y="25" text-anchor="middle" fill="#CC79A7" font-size="16" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">
      6. 全球失衡型
    </text>
    <text x="115" y="48" text-anchor="middle" fill="#CC79A7" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="bold">📉 能力差距扩大</text>
    <text x="115" y="68" text-anchor="middle" fill="#009E73" font-size="10" font-family="system-ui, -apple-system, sans-serif">AI 加剧国际不平等</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(60, 410)">
    <!-- Scenario 7: Transformational Breakthrough -->
    <rect x="0" y="0" width="290" height="110" rx="10" fill="#F0F0F0" filter="url(#shadow)"/>
    <rect x="0" y="0" width="290" height="4" rx="10" fill="#555555"/>
    <text x="145" y="25" text-anchor="middle" fill="#0072B2" font-size="16" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">
      7. 转型突破型
    </text>
    <text x="145" y="48" text-anchor="middle" fill="#CC79A7" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="bold">🚀 范式转换</text>
    <text x="145" y="68" text-anchor="middle" fill="#009E73" font-size="10" font-family="system-ui, -apple-system, sans-serif">AGI 带来革命性突破</text>
  </g>

  <g transform="translate(360, 410)">
    <!-- Scenario 8: Prudent Regulation -->
    <rect x="0" y="0" width="290" height="110" rx="10" fill="#F0F0F0" filter="url(#shadow)"/>
    <rect x="0" y="0" width="290" height="4" rx="10" fill="#555555"/>
    <text x="145" y="25" text-anchor="middle" fill="#009E73" font-size="16" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">
      8. 谨慎监管型
    </text>
    <text x="145" y="48" text-anchor="middle" fill="#56B4E9" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="bold">🛡️ 适应性监管</text>
    <text x="145" y="68" text-anchor="middle" fill="#009E73" font-size="10" font-family="system-ui, -apple-system, sans-serif">渐进式监管应对挑战</text>
  </g>

  <!-- Decorative dots -->
  <circle cx="30" cy="30" r="3" fill="#56B4E9" opacity="0.5"/>
  <circle cx="920" cy="590" r="4" fill="#009E73" opacity="0.5"/>
  <circle cx="920" cy="30" r="2" fill="#E69F00" opacity="0.6"/>
  <circle cx="30" cy="590" r="3" fill="#56B4E9" opacity="0.4"/>

  <!-- Footer -->
  <rect x="350" y="580" width="500" height="32" rx="6" fill="#E69F00" opacity="0.85"/>
  <text x="600" y="600" text-anchor="middle" fill="white" font-size="12" font-family="system-ui, -apple-system, sans-serif" font-weight="bold">
    RAND Corporation · RR-A3034-2 · 2025
  </text>

  <!-- Decorative line -->
  <line x1="60" y1="145" x2="890" y2="145" stroke="#CC79A7" stroke-width="1" opacity="0.5"/>
</svg>
