<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">报告以 8 种情景替代单一预测：AGI 或在 2026 至 2030 年出现，国运影响取决于今日准备</text>

  <!-- ============ panel a: expert-survey timeline ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">专家调查时间表：三类 AGI 里程碑的预期出现时间</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="240" y1="130" x2="240" y2="286"/>
    <line x1="600" y1="130" x2="600" y2="286"/>
  </g>
  <!-- x = 120 + (year-2026)*120 -->
  <!-- weak AGI ~2027 -->
  <line x1="240" y1="152" x2="240" y2="176" stroke="#999999" stroke-width="1.5"/>
  <circle cx="240" cy="164" r="5" fill="none" stroke="#999999" stroke-width="1.5"/>
  <text x="252" y="168" font-size="12.5" fill="#1A1B1E">弱 AGI：约 2027 年左右（部分领域超越人类）</text>
  <!-- remote-work AGI 2030 -->
  <line x1="600" y1="200" x2="600" y2="224" stroke="#999999" stroke-width="1.5"/>
  <circle cx="600" cy="212" r="5" fill="#0072B2"/>
  <text x="612" y="216" font-size="12.5" fill="#1A1B1E">替代远程工作的 AGI：可能于 2030 年出现</text>
  <!-- strong AGI revised 2031->2033 -->
  <line x1="720" y1="248" x2="900" y2="248" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="900,243 912,248 900,253" fill="#D55E00"/>
  <circle cx="720" cy="248" r="5" fill="none" stroke="#999999" stroke-width="1.5"/>
  <circle cx="900" cy="248" r="5" fill="#D55E00"/>
  <text x="924" y="252" font-size="12.5" fill="#1A1B1E">强 AGI：由 2031 年推迟到 2033 年</text>

  <line x1="120" y1="286" x2="1140" y2="286" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="120" y1="286" x2="120" y2="290"/>
    <line x1="240" y1="286" x2="240" y2="290"/>
    <line x1="600" y1="286" x2="600" y2="290"/>
    <line x1="720" y1="286" x2="720" y2="290"/>
    <line x1="960" y1="286" x2="960" y2="290"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="120" y="306">2026</text>
    <text x="240" y="306">2027</text>
    <text x="600" y="306">2030</text>
  </g>
  <text x="630" y="330" font-size="14" fill="#1A1B1E" text-anchor="middle">预期出现年份（专家调查口径）</text>
  <g font-size="12" fill="#555">
    <circle cx="130" cy="140" r="4" fill="none" stroke="#999999" stroke-width="1.5"/>
    <text x="141" y="144">原预期/近似值</text>
    <circle cx="240" cy="140" r="4" fill="#D55E00"/>
    <text x="251" y="144">修订后预期（主角）</text>
  </g>

  <!-- ============ panel b: 8 scenarios ============ -->
  <text x="60" y="382" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="382" font-size="15" fill="#1A1B1E">8 种情景的两面性：偏风险与偏机会两类</text>

  <!-- risk column -->
  <rect x="60" y="404" width="12" height="12" fill="#999999"/>
  <text x="80" y="414" font-size="13" font-weight="bold" fill="#1A1B1E">偏风险的一侧</text>
  <g font-size="12.5" fill="#555">
    <text x="80" y="442">竞争驱动型：政策不完备时仓促部署，监管混乱埋下安全隐患</text>
    <text x="80" y="466">民主脆弱型：AI 传播虚假信息、操纵舆论，民主治理受威胁</text>
    <text x="80" y="490">威权强化型：AI 成为社会控制工具</text>
    <text x="80" y="514">技术主导型：科技巨头掌握核心权力，公司决策影响国家走向</text>
    <text x="80" y="538">全球失衡型：AI 能力差距加剧国家间不平等，少数国家垄断优势</text>
  </g>

  <!-- opportunity column -->
  <rect x="640" y="404" width="12" height="12" fill="#D55E00"/>
  <text x="660" y="414" font-size="13" font-weight="bold" fill="#1A1B1E">偏机会的一侧</text>
  <g font-size="12.5" fill="#555">
    <text x="660" y="442">合作治理型：建立统一治理标准，跨国合作促进共享与安全</text>
    <text x="660" y="466">谨慎监管型：渐进式、适应性监管平衡创新与安全</text>
    <text x="660" y="490">转型突破型：AGI 带来范式转换，推动社会全面进步</text>
  </g>

  <!-- footnote -->
  <text x="60" y="600" font-size="11" fill="#767676">数据：RAND 报告 RR-A3034-2（2025 年发布，Barry Pavel 等七位研究员撰写）· 时间表为专家调查口径</text>
  <text x="60" y="618" font-size="11" fill="#767676">面板 b 的情景分类与描述取自报告正文叙述，为非数值分类示意；报告同时给出监管框架、国际合作、国家能力建设三大政策方向；面板 a 横轴为连续年份轴，仅在正文提及的年份标注数字</text>
</svg>
