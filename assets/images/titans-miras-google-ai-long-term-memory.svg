<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#F0F0F0"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#009E73">Titans 的三层记忆架构用惊喜度量选择性地只更新最新颖信息，能缩放到超过 200 万个 token 的上下文窗口大小</text>

  <!-- ============ panel a: memory hierarchy ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#009E73">a</text>
  <text x="82" y="104" font-size="15" fill="#009E73">Titans 三层记忆架构</text>

  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#009E73"/>
    </marker>
  </defs>

  <rect x="150" y="140" width="280" height="76" fill="none" stroke="#0072B2" stroke-width="1.5"/>
  <text x="290" y="168" font-size="13" fill="#009E73" text-anchor="middle">短期记忆：核心注意力</text>
  <text x="290" y="188" font-size="12" fill="#555" text-anchor="middle">标准的 Transformer 注意力</text>
  <text x="290" y="206" font-size="12" fill="#555" text-anchor="middle">高精度抓即时上下文</text>

  <rect x="150" y="240" width="280" height="76" fill="none" stroke="#D55E00" stroke-width="1.5"/>
  <text x="290" y="268" font-size="13" fill="#009E73" text-anchor="middle">神经长期记忆</text>
  <text x="290" y="288" font-size="12" fill="#555" text-anchor="middle">多层感知机模块</text>
  <text x="290" y="306" font-size="12" fill="#555" text-anchor="middle">推理时实时更新参数</text>

  <rect x="150" y="340" width="280" height="76" fill="none" stroke="#009E73" stroke-width="1.5"/>
  <text x="290" y="368" font-size="13" fill="#009E73" text-anchor="middle">持久记忆</text>
  <text x="290" y="388" font-size="12" fill="#555" text-anchor="middle">固定的学习参数</text>
  <text x="290" y="406" font-size="12" fill="#555" text-anchor="middle">存模型的"皮质知识"</text>

  <g stroke="#009E73" stroke-width="1.5">
    <line x1="290" y1="216" x2="290" y2="234" marker-end="url(#arr2)"/>
    <line x1="290" y1="316" x2="290" y2="334" marker-end="url(#arr2)"/>
  </g>
  <text x="302" y="232" font-size="12" fill="#555">高惊喜：必须优先存进长期记忆</text>
  <text x="470" y="168" font-size="12" fill="#555">惊喜度量：用内部误差信号（梯度）当</text>
  <text x="470" y="186" font-size="12" fill="#555">数学版的意外信号，选择性地只更新那</text>
  <text x="470" y="204" font-size="12" fill="#555">些最新颖、最打破上下文的信息</text>
  <text x="470" y="234" font-size="12" fill="#555">动量：同时看"瞬时惊喜"和"过去惊喜"</text>
  <text x="470" y="252" font-size="12" fill="#555">遗忘（权重衰减）：用自适应权重衰减当遗忘门</text>

  <!-- ============ panel b: MIRAS ============ -->
  <text x="660" y="104" font-size="15" font-weight="bold" fill="#009E73">b</text>
  <text x="682" y="104" font-size="15" fill="#009E73">MIRAS 框架：序列建模 = 联想记忆（序列位置轴）</text>

  <line x1="700" y1="300" x2="1120" y2="300" stroke="#009E73" stroke-width="0.75"/>
  <g stroke="#009E73" stroke-width="0.75">
    <line x1="715" y1="300" x2="715" y2="304"/>
    <line x1="850" y1="300" x2="850" y2="304"/>
    <line x1="985" y1="300" x2="985" y2="304"/>
    <line x1="1120" y1="300" x2="1120" y2="304"/>
  </g>
  <g>
    <circle cx="715" cy="300" r="7" fill="#0072B2"/>
    <text x="715" y="278" font-size="12.5" fill="#009E73" text-anchor="middle">记忆架构</text>
    <text x="715" y="326" font-size="12" fill="#555" text-anchor="middle">向量 / 矩阵 / 深度</text>
    <text x="715" y="342" font-size="12" fill="#555" text-anchor="middle">多层感知机</text>

    <circle cx="850" cy="300" r="7" fill="#0072B2"/>
    <text x="850" y="278" font-size="12.5" fill="#009E73" text-anchor="middle">注意力偏差</text>
    <text x="850" y="326" font-size="12" fill="#555" text-anchor="middle">内部学习目标，</text>
    <text x="850" y="342" font-size="12" fill="#555" text-anchor="middle">决定优先记什么</text>

    <circle cx="985" cy="300" r="7" fill="#0072B2"/>
    <text x="985" y="278" font-size="12.5" fill="#009E73" text-anchor="middle">保留门</text>
    <text x="985" y="326" font-size="12" fill="#555" text-anchor="middle">遗忘机制解释为</text>
    <text x="985" y="342" font-size="12" fill="#555" text-anchor="middle">记忆正则化器</text>

    <circle cx="1120" cy="300" r="7" fill="#0072B2"/>
    <text x="1114" y="278" font-size="12.5" fill="#009E73" text-anchor="middle">记忆算法</text>
    <text x="1114" y="326" font-size="12" fill="#555" text-anchor="middle">更新记忆的</text>
    <text x="1114" y="342" font-size="12" fill="#555" text-anchor="middle">优化算法</text>
  </g>
  <text x="910" y="382" font-size="12" fill="#555" text-anchor="middle">四个关键设计选择（论文叙述顺序，序列位置轴，间距无数值含义）</text>
  <text x="660" y="416" font-size="12" fill="#555">跳出 MSE 与点积相似度：MIRAS 造出三个无注意力模型 —</text>
  <text x="660" y="434" font-size="12" fill="#555">YAAD（Huber 损失）· MONETA（广义范数）·</text>
  <text x="660" y="452" font-size="12" fill="#555">MEMORA（记忆强制像严格的概率图，更新受控且平衡）</text>

  <!-- ============ panel c: evidence, qualitative ============ -->
  <text x="60" y="490" font-size="15" font-weight="bold" fill="#009E73">c</text>
  <text x="82" y="490" font-size="15" fill="#009E73">实验结果（正文为定性描述，未给出具体分数，序列位置轴）</text>

  <g font-size="12.5" fill="#009E73">
    <circle cx="140" cy="540" r="7" fill="#0072B2"/>
    <text x="158" y="536">语言建模和常识推理：C4、WikiText 与零样本推理任务</text>
    <text x="158" y="554">HellaSwag、PIQA 上准确度和困惑度全程领跑</text>
    <text x="158" y="572">（对比 Transformer++、Mamba-2 和 Gated DeltaNet）</text>
    <circle cx="640" cy="540" r="7" fill="#0072B2"/>
    <text x="658" y="536">消融：记忆架构的深度太关键了，深度更深的那个，</text>
    <text x="658" y="554">语言建模的困惑度始终更低，缩放特性更好</text>
    <text x="658" y="572">BABILong 基准：把所有基线都干翻了（含参数少得多的 GPT-4）</text>
    <circle cx="922" cy="540" r="7" fill="#D55E00"/>
    <text x="940" y="536">超长上下文召回：能缩放到超过</text>
    <text x="940" y="554">200 万个 token 的上下文窗口大小</text>
  </g>
  <line x1="140" y1="590" x2="1120" y2="590" stroke="#009E73" stroke-width="0.75"/>
  <g stroke="#009E73" stroke-width="0.75">
    <line x1="140" y1="590" x2="140" y2="594"/>
    <line x1="640" y1="590" x2="640" y2="594"/>
    <line x1="940" y1="590" x2="940" y2="594"/>
  </g>
  <g font-size="12" fill="#555">
    <text x="140" y="612">语言建模和常识推理</text>
    <text x="640" y="612">深度记忆的威力</text>
    <text x="940" y="612">超长上下文召回</text>
  </g>

  <!-- footnote -->
  <text x="60" y="648" font-size="11" fill="#767676">数据：Google Research（Titans 论文 arxiv.org/abs/2501.00663，MIRAS 论文 arxiv.org/pdf/2504.13173）· 正文未报告具体分数，a 面板为流程示意、b/c 面板为序列位置轴 · 论文自测口径</text>
</svg>
