<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9A937F; }
      .rl { font-size: 15px; fill: #4A4438; }
      .val { font-size: 16.5px; font-weight: 700; }
      .b { font-size: 12px; fill: #A5A08D; }
      .chip { font-size: 11.5px; font-weight: 700; fill: #FFFFFF; letter-spacing: 2px; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F8F2"/>
    </linearGradient>
    <linearGradient id="gCanopy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E7A6E"/><stop offset="1" stop-color="#2FA89A"/>
    </linearGradient>
    <linearGradient id="gBark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A5A2B"/><stop offset="1" stop-color="#B07D45"/>
    </linearGradient>
    <linearGradient id="gSun" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C99A2E"/><stop offset="1" stop-color="#E3BE55"/>
    </linearGradient>
    <linearGradient id="gBloom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D1477E"/><stop offset="1" stop-color="#E87BA4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1105" cy="600" r="150" fill="#2FA89A" opacity="0.06"/>
  <circle cx="80" cy="625" r="110" fill="#C99A2E" opacity="0.07"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gCanopy)"/>

  <text class="k" x="64" y="84">AI 范式雷达 · 2026-10-10 · HN 49717558</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">快脑和慢脑分家了</text>
  <text x="64" y="158" font-size="15" fill="#6E6A5C">Agent 控制循环换芯：从解析大模型文本，到订阅毫秒级类型化决策</text>

  <!-- tree motif: canopy = slow brain, root nodule = fast brain -->
  <g>
    <circle cx="1058" cy="112" r="40" fill="url(#gCanopy)" opacity="0.9"/>
    <circle cx="1020" cy="132" r="26" fill="#2FA89A" opacity="0.55"/>
    <circle cx="1096" cy="132" r="26" fill="#1E7A6E" opacity="0.55"/>
    <text x="1058" y="118" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">慢脑</text>
    <rect x="1052" y="150" width="12" height="52" fill="url(#gBark)"/>
    <path d="M 1058 202 q -26 8 -38 26 M 1058 202 q 26 8 38 26" stroke="#B07D45" stroke-width="3" fill="none"/>
    <circle cx="1058" cy="242" r="24" fill="url(#gBloom)"/>
    <text x="1058" y="247" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">快脑</text>
  </g>

  <!-- canopy: slow brain responsibilities -->
  <rect x="64" y="192" width="856" height="66" rx="10" fill="#2FA89A" opacity="0.08"/>
  <text class="serif" x="88" y="222" font-size="21" font-weight="700" fill="#1E7A6E">慢脑 · 大模型</text>
  <text x="88" y="246" font-size="13.5" fill="#5B6B5F">推理与生成：逐 token 生成文本，由外层代码解析 —— 决策曾伪装成对话</text>
  <rect x="792" y="210" width="108" height="24" rx="12" fill="#1E7A6E"/>
  <text class="chip" x="846" y="226" text-anchor="middle">推理 · 生成</text>

  <!-- trunk: transformation -->
  <g>
    <path d="M 452 262 v 44" stroke="url(#gBark)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 420 300 l 32 22 32 -22" fill="none" stroke="#8A5A2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="490" y="290" font-size="12.5" fill="#8A5A2B">非结构化状态进，带概率的类型化决策出</text>
  </g>

  <!-- root: fast brain band -->
  <rect x="64" y="330" width="856" height="76" rx="10" fill="#D1477E" opacity="0.07"/>
  <text class="serif" x="88" y="362" font-size="21" font-weight="700" fill="#B23A6B">快脑 · 决策模型</text>
  <text x="88" y="388" font-size="13.5" fill="#6B5560">非自回归并行采样，直接输出标签加概率，不参与聊天 · 厂商自述延迟</text>
  <text class="val" x="700" y="388" fill="#B23A6B">70ms – 500ms</text>
  <rect x="792" y="352" width="108" height="24" rx="12" fill="url(#gBloom)"/>
  <text class="chip" x="846" y="368" text-anchor="middle">标签 · 概率</text>

  <line x1="64" y1="428" x2="1136" y2="428" stroke="#E5E1D4" stroke-width="1"/>

  <!-- four-layer ecosystem: root system bars 1 star -> 0.085px, from x=190 -->
  <text class="rl" x="64" y="470" font-weight="700" fill="#1A1B1E">生态波四层 · GitHub 星数</text>
  <text class="b" x="64" y="490">GitHub API 实测 2026-10-11</text>

  <g>
    <rect x="190" y="448" width="756" height="26" rx="4" fill="#1E7A6E" opacity="0.08"/>
    <text x="180" y="466" text-anchor="end" font-size="13.5" fill="#4A4438">模型</text>
    <rect x="190" y="452" width="700" height="18" rx="3" fill="url(#gCanopy)"/>
    <text class="val" x="902" y="466" fill="#1E7A6E">kev 8,895</text>

    <rect x="190" y="482" width="756" height="26" rx="4" fill="#B07D45" opacity="0.08"/>
    <text x="180" y="500" text-anchor="end" font-size="13.5" fill="#4A4438">运行时</text>
    <rect x="190" y="486" width="109" height="18" rx="3" fill="url(#gBark)"/>
    <text class="val" x="311" y="500" fill="#8A5A2B">ollaya 1,283</text>
    <rect x="438" y="486" width="98" height="18" rx="3" fill="url(#gBark)" opacity="0.6"/>
    <text class="val" x="548" y="500" fill="#8A5A2B">AnyJev 1,150</text>

    <rect x="190" y="516" width="756" height="26" rx="4" fill="#C99A2E" opacity="0.1"/>
    <text x="180" y="534" text-anchor="end" font-size="13.5" fill="#4A4438">清单</text>
    <rect x="190" y="520" width="192" height="18" rx="3" fill="url(#gSun)"/>
    <text class="val" x="394" y="534" fill="#9A7620">awesome-jev 2,261</text>

    <rect x="190" y="550" width="756" height="26" rx="4" fill="#D1477E" opacity="0.07"/>
    <text x="180" y="568" text-anchor="end" font-size="13.5" fill="#4A4438">大厂</text>
    <circle cx="212" cy="563" r="9" fill="url(#gBloom)"/>
    <text class="val" x="232" y="568" fill="#B23A6B">Clef · Decider 2B</text>
    <text x="450" y="568" font-size="12.5" fill="#A5A08D">Cloudflare 开放权重 + AWS 系 Strands 开源</text>
  </g>

  <text x="1080" y="466" text-anchor="end" font-size="12.5" fill="#B23A6B" font-weight="700">尚无公开可复现基准</text>

  <line x1="64" y1="596" x2="1136" y2="596" stroke="#E5E1D4"/>
  <text x="64" y="628" font-size="12.5" fill="#A29C88">延迟、定价、融资均为厂商自述；公开基准出现前，「不会幻觉」只能当设计目标读 · HN 评论指速度口径不对等</text>
</svg>
