<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #A6A290; }
      .rl { font-size: 15px; fill: #4A4436; }
      .val { font-size: 17px; font-weight: 700; }
      .b { font-size: 12px; fill: #A8A28E; }
      .hd { font-size: 12.5px; letter-spacing: 2px; fill: #8F8974; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8F6F0"/>
    </linearGradient>
    <linearGradient id="gYellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8B21E"/><stop offset="1" stop-color="#F4D06F"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9622B"/><stop offset="1" stop-color="#F0996B"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D6B8E"/><stop offset="1" stop-color="#7FA3BE"/>
    </linearGradient>
    <linearGradient id="gGray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7D848C"/><stop offset="1" stop-color="#A9AFB6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1104" cy="118" r="150" fill="#3D6B8E" opacity="0.05"/>
  <circle cx="80" cy="620" r="120" fill="#E8B21E" opacity="0.08"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gOrange)"/>

  <text class="k" x="64" y="84">AI 智创简报 · 2026-03 ~ 2026-08 · AGENT GUARDRAIL PATENTS</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#26221A">权限拦到进程级，本地守门还空着</text>
  <text x="64" y="158" font-size="15" fill="#6B6450">平台与云侧被圈地，个人机器上的轻量闸门无标配</text>

  <!-- construction crane icon -->
  <g>
    <line x1="1064" y1="210" x2="1064" y2="112" stroke="#7D848C" stroke-width="6"/>
    <line x1="1064" y1="112" x2="1156" y2="112" stroke="#E8B21E" stroke-width="6"/>
    <line x1="1064" y1="112" x2="1010" y2="140" stroke="#E8B21E" stroke-width="4"/>
    <line x1="1136" y1="112" x2="1136" y2="158" stroke="#7D848C" stroke-width="2.5"/>
    <rect x="1122" y="158" width="28" height="20" rx="3" fill="url(#gOrange)"/>
    <path d="M 1036 210 l 56 0 l -10 -18 l -36 0 z" fill="#7D848C"/>
    <text class="hd" x="1076" y="238" text-anchor="middle">工地闸门</text>
  </g>

  <!-- four patent rows: lane bands -->
  <g>
    <rect x="64" y="206" width="920" height="64" rx="10" fill="#3D6B8E" opacity="0.07"/>
    <rect x="64" y="282" width="920" height="64" rx="10" fill="#D9622B" opacity="0.07"/>
    <rect x="64" y="358" width="920" height="64" rx="10" fill="#E8B21E" opacity="0.08"/>
    <rect x="64" y="434" width="920" height="64" rx="10" fill="#7D848C" opacity="0.08"/>

    <text class="rl" x="88" y="244" font-weight="700" fill="#2F5670">拦截进程</text>
    <text x="216" y="244" font-size="13.5" fill="#6B6450">独立系统进程，权限高于 LLM，动作全入哈希链</text>
    <rect x="640" y="228" width="150" height="16" rx="8" fill="url(#gBlue)"/>
    <text class="val" x="806" y="243" fill="#2F5670">2026-08 公开</text>

    <text class="rl" x="88" y="320" font-weight="700" fill="#A8481E">沙箱暂停</text>
    <text x="216" y="320" font-size="13.5" fill="#6B6450">Mistral：待决调用暂停、客户端执行、重放续跑</text>
    <rect x="640" y="304" width="196" height="16" rx="8" fill="url(#gOrange)"/>
    <text class="val" x="852" y="319" fill="#A8481E">2026-06-30 授权</text>

    <text class="rl" x="88" y="396" font-weight="700" fill="#8F6D12">委托凭证</text>
    <text x="216" y="396" font-size="13.5" fill="#6B6450">Daon：行为忠实 + 执行完整性，才发限时限权凭据</text>
    <rect x="640" y="380" width="196" height="16" rx="8" fill="url(#gYellow)"/>
    <text class="val" x="852" y="395" fill="#8F6D12">2026-07-21 授权</text>

    <text class="rl" x="88" y="472" font-weight="700" fill="#565C63">护栏自扩</text>
    <text x="216" y="472" font-size="13.5" fill="#6B6450">Boomi：基础护栏拆成语义元素，自动跟上新话术</text>
    <rect x="640" y="456" width="150" height="16" rx="8" fill="url(#gGray)"/>
    <text class="val" x="806" y="471" fill="#565C63">2026-04 公开</text>
  </g>

  <!-- empty gap meter -->
  <g>
    <rect x="64" y="532" width="920" height="52" rx="10" fill="#D9622B" opacity="0.07"/>
    <text class="serif" x="88" y="565" font-size="20" font-weight="700" fill="#26221A">空白位：跨客户端 · 策略即代码 · 装在自己机器上</text>
    <text x="872" y="565" font-size="13" fill="#A8481E" text-anchor="end" font-weight="700">尚无标配产品</text>
  </g>

  <!-- right stats -->
  <g>
    <text class="serif" x="1136" y="330" text-anchor="end" font-size="28" font-weight="700" fill="#26221A">审计单次<tspan fill="#D9622B"> 3000–6000 元</tspan></text>
    <text class="b" x="1136" y="354" text-anchor="end">守门器 $19–49/月 · 4 周 MVP</text>
  </g>

  <line x1="64" y1="608" x2="1136" y2="608" stroke="#E7E2D2"/>
  <text class="b" x="64" y="638">一、四为已公开申请，二、三为已授权专利 · 客户场景与价格为本简报创业建议 · Micropaper</text>
</svg>
