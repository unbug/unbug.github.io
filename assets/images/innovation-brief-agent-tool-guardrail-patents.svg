<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">2026 年 4 至 8 月四件 Agent 工具调用权限专利相继公开或授权：2 件申请公开、2 件已授权</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">四件专利事件时间轴（实心 = 授权，空心 = 申请公开/提交）</text>

  <!-- event rail (window 2026-04-01 to 2026-12-31) -->
  <line x1="90" y1="170" x2="1074" y2="170" stroke="#1A1B1E" stroke-width="1.5"/>
  <!-- detail list below the rail, chronological by event date -->
  <g font-size="12" fill="#555">
    <text x="90" y="200">○ 提交 · US12670045 · Mistral AI · 2026-03-04　代码块封装工具调用</text>
    <text x="90" y="226">○ 公开 · US20260119551A1 · Boomi, LP · 2026-04-30　基础护栏拆成语义元素自动扩展</text>
    <text x="90" y="252">● 授权 · US12670045 · Mistral AI · 2026-06-30　沙箱暂停待决调用，客户端执行后重放续跑</text>
    <text x="90" y="278">● 授权 · US12688261 · Daon Technology · 2026-07-21　按行为忠实与执行完整性信号发放委托凭证</text>
    <text x="90" y="304">○ 公开 · US20260238651A1 · 申请人未标注 · 2026-08-13　独立进程拦截层，动作全入哈希链账本</text>
  </g>

  <!-- markers on rail (Mistral 提交 in list, window outside rail) -->
  <circle cx="194" cy="170" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <circle cx="413" cy="170" r="6" fill="#FFFFFF" stroke="#D55E00" stroke-width="2"/>
  <circle cx="489" cy="170" r="6.5" fill="#D55E00"/>
  <circle cx="571" cy="170" r="6" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="194" y="152">2026-04-30</text>
    <text x="413" y="152">2026-06-30</text>
    <text x="489" y="134">2026-07-21</text>
    <text x="571" y="152">2026-08-13</text>
  </g>

  <!-- date axis (time axis: no gridlines per style guide) -->
  <line x1="90" y1="330" x2="1074" y2="330" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="90" y1="330" x2="90" y2="334"/>
    <line x1="416" y1="330" x2="416" y2="334"/>
    
    
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="90" y="350">2026-04</text>
    <text x="416" y="350">2026-07</text>
    
  </g>
  <text x="582" y="374" font-size="14" fill="#1A1B1E" text-anchor="middle">事件日期（年-月，窗口 2026-04 起）</text>
  <text x="90" y="398" font-size="12" fill="#555">● 授权　○ 公开</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="440" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="440" font-size="15" fill="#1A1B1E">权限审计服务单次报价（正文自估口径，区间 3000-6000 元）</text>

  <!-- range bar on 0-6000 元 scale: x = 90 + 990*v/6000 -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="90" y1="508" x2="1080" y2="508"/>
    <line x1="90" y1="476" x2="1080" y2="476"/>
  </g>
  <rect x="585" y="472" width="495" height="20" fill="#D55E00"/>
  <line x1="585" y1="468" x2="585" y2="496" stroke="#D55E00" stroke-width="2"/>
  <line x1="1080" y1="468" x2="1080" y2="496" stroke="#D55E00" stroke-width="2"/>
  <text x="577" y="466" font-size="12" fill="#555" text-anchor="end">下限 3000</text>
  <text x="1072" y="466" font-size="12" fill="#555" text-anchor="end">上限 6000</text>

  <!-- value axis -->
  <line x1="90" y1="536" x2="1080" y2="536" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="90" y1="536" x2="90" y2="540"/>
    <line x1="585" y1="536" x2="585" y2="540"/>
    <line x1="1080" y1="536" x2="1080" y2="540"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="90" y="556">0</text>
    <text x="585" y="556">3000</text>
    <text x="1080" y="556">6000</text>
  </g>
  <text x="585" y="580" font-size="14" fill="#1A1B1E" text-anchor="middle">单次报价（元）</text>

  <text x="90" y="610" font-size="12" fill="#555">对照：守门中间件月成本数百元，4 周出 MVP（正文自估）</text>

  <!-- footnote -->
  <text x="60" y="648" font-size="11" fill="#767676">数据：US20260238651A1、US12670045、US12688261、US20260119551A1 公开/授权公告日（正文 References）· 一、四为已公开申请，二、三为已授权专利 · 3000-6000 元报价与月成本为正文自估口径</text>
</svg>
