    <text x="70" y="272">SigNoz《SRE 去技能化》（50305693）</text>
    <text x="70" y="348">Cisco 无限 token 帖（50304122）</text>
  </g>
  <g>
    <rect x="520" y="96" width="560" height="28" fill="#1F2937"/><rect x="1080" y="96" width="19" height="28" fill="#C0392B"/>
    <text x="520" y="146" font-size="15" fill="#6B7280">1265 → 1309（+44）· 评论 738 → 752</text>
    <rect x="520" y="172" width="375" height="28" fill="#1F2937"/><rect x="895" y="172" width="3" height="28" fill="#C0392B"/>
    <text x="520" y="222" font-size="15" fill="#6B7280">850 → 855（+5）· 评论 517 → 521</text>
    <rect x="520" y="248" width="302" height="28" fill="#1F2937"/><rect x="822" y="248" width="3" height="28" fill="#C0392B"/>
