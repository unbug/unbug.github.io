    <rect x="520" y="324" width="140" height="28" fill="#1F2937"/><rect x="660" y="324" width="1" height="28" fill="#C0392B"/>
    <text x="520" y="374" font-size="15" fill="#6B7280">316 → 318（+2）· 评论 386 → 387</text>
