  <text x="70" y="430" font-size="16" fill="#6B7280">读数：事件簇热度峰值在 11-04 的 IEEE 帖见顶，此后十天涨幅全部 ≤44 分——叙事不再上冲，而是在评论区被反证逐条下沉。</text>
  <text x="70" y="464" font-size="15" fill="#9CA3AF">对照：窗内唯一带可复现口径的 arXiv 论文首采仅 22 分（未列入本图）——热度与严谨度成反比。</text>
