<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="Helvetica Neue, Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1200" height="500" fill="#FFFFFF"/>
  <text x="70" y="52" font-size="25" font-weight="700" fill="#1F2937">四主帖 11-06 首采 vs 11-16 复测：全部进入平台期（深色首采，红色涨幅）</text>

  <g font-size="18" fill="#1F2937">
    <text x="70" y="120">IEEE《四十年技术债》（50364336）</text>
