<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #8C93A6; }
      .b { font-size: 12px; fill: #7F8899; }
      .ev { font-size: 13px; font-weight: 700; fill: #22283A; }
      .evs { font-size: 12px; fill: #5E6779; }
      .stat { font-size: 34px; font-weight: 700; fill: #22283A; }
      .unit { font-size: 14px; fill: #5E6779; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3FAF9"/>
    </linearGradient>
    <linearGradient id="axis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2FA8A0"/><stop offset="1" stop-color="#7A5AA8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A5AA8"/><stop offset="1" stop-color="#A88FD4"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2FA8A0"/><stop offset="1" stop-color="#7CCFC9"/>
    </linearGradient>
    <linearGradient id="liquid2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#D96D8A"/><stop offset="1" stop-color="#F0A3B6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1120" cy="96" r="130" fill="#2FA8A0" opacity="0.07"/>
  <circle cx="90" cy="640" r="120" fill="#7A5AA8" opacity="0.06"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#axis)"/>

  <text class="k" x="64" y="84">AI 智创简报 · 专利情报速读 · 提示词测试</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1A1B1E">大厂把提示词当代码测</text>
  <text x="64" y="158" font-size="15" fill="#5E6779">近三个月，提示词自动生成测试与优化的专利成簇公开</text>

  <!-- chemistry flask motif -->
  <g>
    <path d="M 1052 84 h 44 v 14 h -13 v 30 l 30 52 a 10 10 0 0 1 -9 15 h -60 a 10 10 0 0 1 -9 -15 l 30 -52 v -30 h -13 z" fill="#FFFFFF" stroke="#5A87B8" stroke-width="3"/>
    <path d="M 1035 152 l -11 19 a 10 10 0 0 0 9 15 h 54 a 10 10 0 0 0 9 -15 l -11 -19 z" fill="url(#liquid)"/>
    <circle cx="1064" cy="120" r="4" fill="#2FA8A0" opacity="0.55"/>
    <circle cx="1078" cy="104" r="3" fill="#D96D8A" opacity="0.6"/>
    <circle cx="1070" cy="92" r="2.5" fill="#7A5AA8" opacity="0.5"/>
    <path d="M 1120 104 h 34 l 9 13 l -9 13 h -34 l 7 -13 z" fill="url(#liquid2)"/>
  </g>

  <!-- timeline: 2026-06-02=150, 08-13=535, 08-20=650 (per day ~16.47) -->
  <line x1="150" y1="330" x2="850" y2="330" stroke="url(#axis)" stroke-width="4" stroke-linecap="round"/>
  <text class="b" x="150" y="356">06-02</text>
  <text class="b" x="850" y="356" text-anchor="end">08-20</text>

  <g>
    <circle cx="150" cy="330" r="10" fill="url(#teal)"/>
    <line x1="150" y1="318" x2="150" y2="284" stroke="#A88FD4"/>
    <text class="ev" x="150" y="262">06-02 · Microsoft</text>
    <text class="evs" x="150" y="282">提示词自动优化</text>

    <circle cx="535" cy="330" r="10" fill="#FFFFFF" stroke="#2FA8A0" stroke-width="3.5"/>
    <line x1="535" y1="342" x2="535" y2="376" stroke="#7CCFC9"/>
    <text class="ev" x="535" y="404">08-13 · Bold Limited</text>
    <text class="evs" x="535" y="424">模板合成精炼提示词</text>

    <circle cx="650" cy="330" r="10" fill="#FFFFFF" stroke="#2FA8A0" stroke-width="3.5"/>
    <line x1="650" y1="318" x2="650" y2="284" stroke="#7CCFC9"/>
    <text class="ev" x="650" y="262">08-20 · Bold Limited</text>
    <text class="evs" x="650" y="282">自动生成测试函数</text>
  </g>
  <circle cx="150" cy="452" r="6" fill="url(#teal)"/><text class="b" x="162" y="457">已授权</text>
  <circle cx="232" cy="452" r="6" fill="#FFFFFF" stroke="#2FA8A0" stroke-width="2.5"/><text class="b" x="244" y="457">公开申请</text>

  <!-- classification chip -->
  <g>
    <rect x="470" y="428" width="380" height="46" rx="10" fill="#2FA8A0" opacity="0.08"/>
    <rect x="470" y="428" width="5" height="46" rx="2.5" fill="#2FA8A0"/>
    <text x="492" y="449" font-size="13" font-weight="700" fill="#1F7A74">三件同落两个分类号</text>
    <text x="492" y="467" font-size="12.5" fill="#5E6779">G06F40 语言处理 × G06F11/36 软件测试</text>
  </g>

  <!-- opportunity cards -->
  <g>
    <rect x="64" y="492" width="336" height="140" rx="18" fill="#D96D8A" opacity="0.08"/>
    <rect x="64" y="492" width="336" height="6" rx="3" fill="#D96D8A"/>
    <rect x="92" y="522" width="44" height="28" rx="5" fill="#D96D8A"/>
    <circle cx="114" cy="536" r="7" fill="#FFFFFF"/>
    <text class="stat" x="152" y="554">2000–5000 元<tspan class="unit"> /次</tspan></text>
    <text class="evs" x="92" y="596">提示词回归体检服务</text>

    <rect x="432" y="492" width="336" height="140" rx="18" fill="#7A5AA8" opacity="0.08"/>
    <rect x="432" y="492" width="336" height="6" rx="3" fill="#7A5AA8"/>
    <rect x="460" y="522" width="44" height="28" rx="14" fill="#7A5AA8"/>
    <circle cx="482" cy="536" r="6" fill="#FFFFFF"/>
    <text class="stat" x="520" y="554">$15–30<tspan class="unit"> /项目·月</tspan></text>
    <text class="evs" x="460" y="596">托管版订阅定价</text>

    <rect x="800" y="492" width="336" height="140" rx="18" fill="#5A87B8" opacity="0.09"/>
    <rect x="800" y="492" width="336" height="6" rx="3" fill="#5A87B8"/>
    <path d="M 828 552 l 10 -26 l 16 12 z" fill="#5A87B8"/>
    <circle cx="846" cy="530" r="4" fill="#DCE8F5"/>
    <text class="stat" x="888" y="554">2.48 万<tspan class="unit"> star</tspan></text>
    <text class="evs" x="828" y="596">promptfoo 社区即首批客户</text>
  </g>

  <text class="b" x="64" y="662">专利号与日期见正文 · 均为公开/授权原文口径 · 观点仅为机会判断 · Micropaper</text>
</svg>
