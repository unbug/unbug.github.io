<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">将文本接口替换为可学习的隐空间通信并联合优化，AIME24 达 26.7%、GPQA-Diamond 达 20.2%</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">隐式通信机制（机制示意，非实测数据）</text>

  <!-- sender box -->
  <rect x="80" y="180" width="130" height="64" fill="none" stroke="#1A1B1E" stroke-width="0.75"/>
  <text x="145" y="207" font-size="12.5" fill="#1A1B1E" text-anchor="middle">智能体 A</text>
  <text x="145" y="225" font-size="12" fill="#555" text-anchor="middle">推理中</text>

  <!-- encoder -->
  <rect x="255" y="188" width="112" height="48" fill="none" stroke="#555555" stroke-width="0.75"/>
  <text x="311" y="208" font-size="12" fill="#1A1B1E" text-anchor="middle">投影层</text>
  <text x="311" y="224" font-size="12" fill="#555" text-anchor="middle">编码</text>
  <line x1="210" y1="212" x2="251" y2="212" stroke="#1A1B1E" stroke-width="1.5"/>
  <polygon points="251,208 259,212 251,216" fill="#1A1B1E"/>

  <!-- latent channel -->
  <rect x="431" y="176" width="150" height="72" fill="#D55E00"/>
  <text x="506" y="206" font-size="12.5" fill="#FFFFFF" text-anchor="middle">隐空间</text>
  <text x="506" y="224" font-size="12" fill="#FFFFFF" text-anchor="middle">键值缓存</text>
  <line x1="367" y1="212" x2="427" y2="212" stroke="#1A1B1E" stroke-width="1.5"/>
  <polygon points="427,208 435,212 427,216" fill="#1A1B1E"/>

  <!-- decoder -->
  <rect x="645" y="188" width="112" height="48" fill="none" stroke="#555555" stroke-width="0.75"/>
  <text x="701" y="208" font-size="12" fill="#1A1B1E" text-anchor="middle">投影层</text>
  <text x="701" y="224" font-size="12" fill="#555" text-anchor="middle">解码</text>
  <line x1="581" y1="212" x2="641" y2="212" stroke="#1A1B1E" stroke-width="1.5"/>
  <polygon points="641,208 649,212 641,216" fill="#1A1B1E"/>

  <!-- receiver box -->
  <rect x="821" y="180" width="130" height="64" fill="none" stroke="#1A1B1E" stroke-width="0.75"/>
  <text x="886" y="207" font-size="12.5" fill="#1A1B1E" text-anchor="middle">智能体 B</text>
  <text x="886" y="225" font-size="12" fill="#555" text-anchor="middle">注入推理轨迹</text>
  <line x1="757" y1="212" x2="817" y2="212" stroke="#1A1B1E" stroke-width="1.5"/>
  <polygon points="817,208 825,212 817,216" fill="#1A1B1E"/>

  <!-- joint optimization bracket (dashed) -->
  <g stroke="#D55E00" stroke-width="1.5" stroke-dasharray="4 3" fill="none">
    <path d="M 80 268 L 80 284 L 506 284"/>
    <path d="M 951 268 L 951 284 L 506 284"/>
  </g>
  <polygon points="506,284 514,280 514,288" fill="#D55E00"/>
  <text x="510" y="306" font-size="12.5" fill="#1A1B1E" text-anchor="middle">联合优化：编码器、解码器与推理模型一起监督更新</text>

  <!-- caption lines -->
  <text x="80" y="350" font-size="12" fill="#555">文本通信的局限：信息压缩损失，且通信协议与推理过程完全解耦。</text>
  <text x="80" y="372" font-size="12" fill="#555">DiffMAS：通信载体从文本改为可学习映射，直接作用于模型内部表示，</text>
  <text x="80" y="394" font-size="12" fill="#555">无需额外文本生成与解析，通信开销几乎可忽略（论文自述）。</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="446" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="446" font-size="15" fill="#1A1B1E">DiffMAS 准确率（%，论文自测）</text>

  <!-- bars: baseline y=590, x = 160 + 8*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="160" y1="490" x2="640" y2="490"/>
    <line x1="360" y1="490" x2="360" y2="590"/>
    <line x1="560" y1="490" x2="560" y2="590"/>
  </g>
  <rect x="214" y="568.64" width="54" height="21.36" fill="#D55E00"/>
  <text x="241" y="561" font-size="12" fill="#555" text-anchor="middle">26.7</text>
  <text x="241" y="608" font-size="12.5" fill="#1A1B1E" text-anchor="middle">AIME24</text>

  <rect x="454" y="573.84" width="54" height="16.16" fill="#D55E00"/>
  <text x="481" y="566" font-size="12" fill="#555" text-anchor="middle">20.2</text>
  <text x="481" y="608" font-size="12.5" fill="#1A1B1E" text-anchor="middle">GPQA-Diamond</text>

  <line x1="160" y1="590" x2="640" y2="590" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="160" y1="590" x2="160" y2="594"/>
    <line x1="360" y1="590" x2="360" y2="594"/>
    <line x1="560" y1="590" x2="560" y2="594"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="160" y="614">0</text>
    <text x="360" y="614">25</text>
    <text x="560" y="614">50</text>
  </g>
  <text x="400" y="638" font-size="14" fill="#1A1B1E" text-anchor="middle">准确率（%）</text>

  <!-- panel b side notes -->
  <text x="700" y="486" font-size="12" fill="#555">另有两项未给出具体数值的评估，不入坐标轴：</text>
  <text x="700" y="510" font-size="12" fill="#555">代码生成、常识推理任务均获稳定提升；</text>
  <text x="700" y="534" font-size="12" fill="#555">对比基线为单智能体推理、文本多智能体系统</text>
  <text x="700" y="558" font-size="12" fill="#555">与已有隐式通信方法。</text>

  <!-- footnote (two lines) -->
  <text x="60" y="650" font-size="11" fill="#767676">数据：arXiv:2604.21794（伊利诺伊大学香槟分校等）· 准确率为论文自测口径；面板 a 为论文描述的机制示意，不含实测数值</text>
</svg>
