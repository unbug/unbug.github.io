<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Noto Serif SC','Songti SC','STSong',serif">
  <defs>
    <style>
      .k { font-size: 12.5px; letter-spacing: 3px; fill: #9A937F; }
      .sub { font-size: 15.5px; fill: #6E6A5C; }
      .lbl { font-size: 15px; fill: #47505A; }
      .val { font-size: 18px; font-weight: 700; fill: #1A1B1E; }
      .b { font-size: 12px; fill: #A29C88; }
      .chip { font-size: 12.5px; font-weight: 600; }
      .nodo { font-size: 14.5px; font-weight: 700; fill: #FFFFFF; }
      .nodosub { font-size: 11px; fill: #FFFFFF; opacity: .92; }
    </style>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C32A8"/><stop offset="1" stop-color="#7E5AD0"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E7C8A"/><stop offset="1" stop-color="#3FB0BC"/>
    </linearGradient>
    <linearGradient id="gRose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5442E"/><stop offset="1" stop-color="#DE7F5F"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A97B1E"/><stop offset="1" stop-color="#D9AF54"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F5D9E"/><stop offset="1" stop-color="#6E96C8"/>
    </linearGradient>
    <linearGradient id="gCinnabar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C0392B"/><stop offset="1" stop-color="#E06B55"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#FBFAF7"/>
  <rect x="64" y="44" width="44" height="5" fill="#B5442E"/>

  <text class="k" x="64" y="82">一分钟读论文 · ARXIV:2604.21794 · UNIV. OF ILLINOIS URBANA-CHAMPAIGN 等</text>
  <text x="64" y="126" font-size="37" font-weight="700" fill="#1A1B1E">让消息本身参与学习</text>
  <text class="sub" x="64" y="154">DiffMAS：通信从固定文本接口，改为可学习的隐空间表示，与推理联合端到端优化</text>

  <!-- upper path: old text protocol (single rigid canal channel) -->
  <g>
    <text class="b" x="80" y="200">旧 · 固定文本接口</text>
    <circle cx="122" cy="234" r="32" fill="url(#gBlue)"/>
    <text class="nodo" x="122" y="239" text-anchor="middle">智能体 A</text>
    <path d="M 166 221 C 246 196 330 196 408 221 L 408 247 C 330 222 246 222 166 247 Z" fill="url(#gBlue)" opacity="0.5"/>
    <text x="287" y="209" text-anchor="middle" font-size="12.5" fill="#2F5D9E">生成文本 → 解析文本</text>
    <circle cx="452" cy="234" r="32" fill="url(#gBlue)"/>
    <text class="nodo" x="452" y="239" text-anchor="middle">智能体 B</text>
    <text class="b" x="496" y="239">信息压缩损失 · 协议与推理解耦</text>
  </g>

  <!-- dividing hairline -->
  <line x1="64" y1="292" x2="1136" y2="292" stroke="#E5E1D4" stroke-width="1"/>

  <!-- lower path: latent channels (water lines crossing a mountain saddle) -->
  <g>
    <text class="b" x="80" y="316">新 · 隐空间通信</text>
    <circle cx="122" cy="392" r="32" fill="url(#gViolet)"/>
    <text class="nodo" x="122" y="397" text-anchor="middle">智能体 A</text>
    <path d="M 162 396 C 244 352 320 336 386 348" fill="none" stroke="url(#gViolet)" stroke-width="13" stroke-linecap="round" opacity="0.8"/>
    <path d="M 392 352 C 456 366 522 406 566 452" fill="none" stroke="url(#gViolet)" stroke-width="9" stroke-linecap="round" opacity="0.5"/>
    <path d="M 170 420 C 254 456 330 468 392 458" fill="none" stroke="url(#gTeal)" stroke-width="11" stroke-linecap="round" opacity="0.7"/>
    <path d="M 398 456 C 462 446 520 470 566 462" fill="none" stroke="url(#gTeal)" stroke-width="9" stroke-linecap="round" opacity="0.45"/>
    <path d="M 172 444 C 250 478 324 494 388 488" fill="none" stroke="url(#gGold)" stroke-width="9" stroke-linecap="round" opacity="0.75"/>
    <path d="M 394 486 C 458 482 524 480 568 472" fill="none" stroke="url(#gGold)" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
    <path d="M 322 372 Q 372 418 320 466" fill="none" stroke="#B5442E" stroke-width="2.5" opacity="0.85"/>
    <text x="362" y="414" font-size="12.5" fill="#B5442E">垭口 · 键值缓存</text>
    <text x="362" y="432" font-size="11" fill="#8B8574">轻量投影层进出隐空间</text>
    <circle cx="608" cy="458" r="34" fill="url(#gRose)"/>
    <text class="nodo" x="608" y="456" text-anchor="middle">智能体 B</text>
    <text class="nodosub" x="608" y="472" text-anchor="middle">解码注入推理</text>
    <text x="366" y="528" text-anchor="middle" font-size="12.5" fill="#4C32A8">隐空间 · 可学习表示（无文本生成/解析）</text>
  </g>

  <!-- right panel: numbers + training -->
  <g>
    <rect x="756" y="196" width="380" height="54" fill="#B5442E" opacity="0.07"/>
    <text class="lbl" x="776" y="229">AIME24 数学推理</text>
    <text class="val" x="1116" y="229" text-anchor="end" font-size="28" fill="#B5442E">26.7%</text>
    <rect x="756" y="256" width="380" height="54" fill="#7E5AD0" opacity="0.08"/>
    <text class="lbl" x="776" y="289">GPQA-Diamond 科学问答</text>
    <text class="val" x="1116" y="289" text-anchor="end" font-size="28" fill="#4C32A8">20.2%</text>
    <text class="b" x="776" y="334">数值为论文自述基准结果</text>

    <text x="776" y="382" font-size="18" font-weight="700" fill="#0E7C8A">差异微调 · 参数高效</text>
    <text class="b" x="776" y="404">只更新通信投影层与少量适配器，推理模型其余参数冻结</text>

    <rect x="756" y="428" width="380" height="50" fill="#0E7C8A" opacity="0.07"/>
    <text x="776" y="459" font-size="15" fill="#47505A">通信开销</text>
    <text x="1116" y="459" text-anchor="end" font-size="15" font-weight="700" fill="#0E7C8A">几乎可忽略</text>
  </g>

  <!-- bottom chips: three training steps -->
  <line x1="64" y1="544" x2="1136" y2="544" stroke="#E5E1D4"/>
  <g>
    <rect x="64" y="562" width="150" height="28" rx="14" fill="url(#gViolet)" opacity="0.18"/>
    <text x="139" y="581" text-anchor="middle" class="chip" fill="#4C32A8">提示生成轨迹</text>
    <text x="222" y="581" fill="#8B8574" font-size="14">→</text>
    <rect x="244" y="562" width="150" height="28" rx="14" fill="url(#gTeal)" opacity="0.2"/>
    <text x="319" y="581" text-anchor="middle" class="chip" fill="#0E7C8A">转隐式表示序列</text>
    <text x="402" y="581" fill="#8B8574" font-size="14">→</text>
    <rect x="424" y="562" width="170" height="28" rx="14" fill="url(#gGold)" opacity="0.28"/>
    <text x="509" y="581" text-anchor="middle" class="chip" fill="#7A5A14">损失更新通信组件</text>
    <rect x="988" y="562" width="148" height="28" rx="14" fill="url(#gCinnabar)" opacity="0.16"/>
    <text x="1062" y="581" text-anchor="middle" class="chip" fill="#B5442E">通信 ⊂ 推理</text>
  </g>

  <text x="64" y="636" font-size="17" fill="#1A1B1E">通信不该是推理的附属品，而应成为推理本身的一部分。</text>
  <text class="b" x="1136" y="636" text-anchor="end">四个基准系统评估 · 论文自述口径 · 预印本未经同行评审 · Micropaper</text>
</svg>
