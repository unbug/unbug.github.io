<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">Markdown 表示较 HTML 少九成以上字节；该头部由 7 款编码 Agent 发送，消费级产品支持为 0</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">Markdown / HTML 字节比（%，100 = 同页 HTML）</text>

  <!-- gridlines: x = 140 + 8*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="300" y1="130" x2="300" y2="318"/>
    <line x1="540" y1="130" x2="540" y2="318"/>
    <line x1="780" y1="130" x2="780" y2="318"/>
    <line x1="1020" y1="130" x2="1020" y2="318"/>
  </g>

  <!-- acceptmarkdown page: 2,201 / 24,222 = 9.1% -->
  <text x="302" y="166" font-size="12.5" fill="#1A1B1E">acceptmarkdown 页</text>
  <rect x="140" y="152" width="72.8" height="20" fill="#0072B2"/>
  <text x="222" y="166" font-size="12" fill="#555">9.1%，省 90.9%（HTML 24,222 B → 2,201 B）</text>

  <!-- Anthropic docs: 16,629 / 476,665 = 3.5% -->
  <text x="302" y="220" font-size="12.5" fill="#1A1B1E">Anthropic 文档</text>
  <rect x="140" y="206" width="28" height="20" fill="#0072B2"/>
  <text x="178" y="220" font-size="12" fill="#555">3.5%，省 96.5%（HTML 476,665 B → 16,629 B）</text>

  <!-- clean semantic HTML: 5%-20% fewer bytes => 80%-95% -->
  <text x="302" y="274" font-size="12.5" fill="#1A1B1E">语义化 HTML 页（HN 评论实测）</text>
  <rect x="780" y="260" width="120" height="20" fill="#999999"/>
  <line x1="780" y1="256" x2="780" y2="284" stroke="#555555" stroke-width="0.75"/>
  <line x1="900" y1="256" x2="900" y2="284" stroke="#555555" stroke-width="0.75"/>
  <text x="910" y="274" font-size="12" fill="#555">80–95%，省 5%–20%</text>

  <!-- value axis -->
  <line x1="140" y1="318" x2="1020" y2="318" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="140" y1="318" x2="140" y2="322"/>
    <line x1="300" y1="318" x2="300" y2="322"/>
    <line x1="540" y1="318" x2="540" y2="322"/>
    <line x1="780" y1="318" x2="780" y2="322"/>
    <line x1="1020" y1="318" x2="1020" y2="322"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="140" y="338">0</text>
    <text x="300" y="338">20</text>
    <text x="540" y="338">50</text>
    <text x="780" y="338">80</text>
    <text x="1020" y="338">110</text>
  </g>
  <text x="580" y="362" font-size="14" fill="#1A1B1E" text-anchor="middle">Markdown 字节数占同页 HTML 的比例（%）</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="418" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="418" font-size="15" fill="#1A1B1E">发送该头部的 Agent 产品数（款，acceptmarkdown.com 矩阵）</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="140" y1="446" x2="700" y2="446"/>
    <line x1="140" y1="497" x2="700" y2="497"/>
  </g>
  <!-- bars: h = 17.14 * n, baseline y = 560 -->
  <rect x="180" y="440" width="64" height="120" fill="#0072B2"/>
  <text x="212" y="432" font-size="12" fill="#555" text-anchor="middle">7</text>
  <text x="212" y="578" font-size="12.5" fill="#1A1B1E" text-anchor="middle">编码 Agent</text>

  <rect x="360" y="509" width="64" height="51" fill="#0072B2" opacity="0.35"/>
  <text x="392" y="501" font-size="12" fill="#555" text-anchor="middle">3</text>
  <text x="392" y="578" font-size="12.5" fill="#1A1B1E" text-anchor="middle">托管平台文档站</text>

  <rect x="540" y="558.5" width="64" height="1.5" fill="#999999"/>
  <text x="572" y="551" font-size="12" fill="#555" text-anchor="middle">0</text>
  <text x="572" y="578" font-size="12.5" fill="#1A1B1E" text-anchor="middle">消费级大产品</text>

  <!-- value axis -->
  <line x1="140" y1="560" x2="700" y2="560" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="140" y1="560" x2="136" y2="560"/>
    <line x1="140" y1="509" x2="136" y2="509"/>
    <line x1="140" y1="446" x2="136" y2="446"/>
    <line x1="140" y1="440" x2="136" y2="440"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="130" y="564">0</text>
    <text x="130" y="513">3</text>
    <text x="130" y="450">7</text>
  </g>
  <text x="72" y="600" font-size="12" fill="#555">消费级：ChatGPT browse、Gemini、Claude.ai web 均为 No；Astro 文档仍返回 HTML；Codex CLI 为 Partial，走 Link 头发现</text>

  <!-- footnote -->
  <text x="60" y="632" font-size="11" fill="#767676">字节数为 2026-09-07 本机 curl 实测；省 5%–20% 出自 HN 评论自估，未独立核实；Agent 矩阵为发起方 acceptmarkdown.com/status（利益相关），截至 2026-09-07</text>
</svg>
