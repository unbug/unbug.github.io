<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #8E97A6; }
      .rl { font-size: 15px; fill: #3F4A5A; }
      .val { font-size: 22px; font-weight: 700; }
      .b { font-size: 12px; fill: #98A1AE; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FAF7EF"/>
    </linearGradient>
    <linearGradient id="gHtml" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F4F45"/><stop offset="1" stop-color="#5E8272"/>
    </linearGradient>
    <linearGradient id="gMd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9503F"/><stop offset="1" stop-color="#E8B84B"/>
    </linearGradient>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9503F"/><stop offset="1" stop-color="#7FA65A"/>
    </linearGradient>
    <linearGradient id="gPot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FA65A"/><stop offset="1" stop-color="#4C7040"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1090" cy="110" r="150" fill="#7FA65A" opacity="0.07"/>
  <circle cx="80" cy="620" r="120" fill="#D9503F" opacity="0.05"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gHead)"/>

  <text class="k" x="64" y="84">AI 范式雷达 · 2026-09-07 · ACCEPT: TEXT/MARKDOWN</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1E2430">同一道菜，换盘子上</text>
  <text x="64" y="158" font-size="15" fill="#5A6070">字节从 24,222 掉到 2,201 —— 不是压缩，是换了种盛法</text>

  <!-- kitchen illustration: pot serving two plates -->
  <g>
    <path d="M 1004 92 q 56 -40 112 0" fill="none" stroke="#B9892F" stroke-width="3" opacity="0.55"/>
    <path d="M 1018 100 q 42 -28 84 0" fill="none" stroke="#B9892F" stroke-width="3" opacity="0.4"/>
    <path d="M 998 106 h 124 l -10 46 a 52 26 0 0 1 -104 0 z" fill="url(#gPot)"/>
    <rect x="988" y="98" width="144" height="10" rx="5" fill="#2F4F45"/>
    <circle cx="1060" cy="93" r="6" fill="#E8B84B"/>
    <rect x="1016" y="172" width="92" height="30" rx="15" fill="url(#gMd)"/>
    <text x="1062" y="192" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">-90.9%</text>
    <text x="1062" y="222" text-anchor="middle" fill="#7FA65A" font-size="12">同一 URL，按需供料</text>
  </g>

  <!-- dumbbell rows: v -> x=330+(v/100)*560 -->
  <g>
    <rect x="176" y="212" width="884" height="76" fill="#7FA65A" opacity="0.08"/>
    <text class="rl" x="160" y="256" text-anchor="end">acceptmarkdown 页</text>
    <line x1="465" y1="250" x2="849" y2="250" stroke="#8FA79B" stroke-width="2.5"/>
    <circle cx="849" cy="250" r="9" fill="none" stroke="#2F4F45" stroke-width="3"/>
    <circle cx="465" cy="250" r="9" fill="#D9503F"/>
    <text class="b" x="849" y="224" text-anchor="middle">HTML 24,222 B</text>
    <text class="val" x="465" y="288" text-anchor="middle" fill="#D9503F">2,201 B</text>
    <text class="val" x="1082" y="257" text-anchor="end" fill="#D9503F">省 90.9%</text>

    <text class="rl" x="160" y="336" text-anchor="end">Anthropic 文档</text>
    <line x1="871" y1="330" x2="900" y2="330" stroke="#8FA79B" stroke-width="2.5"/>
    <circle cx="900" cy="330" r="9" fill="none" stroke="#2F4F45" stroke-width="3"/>
    <circle cx="871" cy="330" r="9" fill="#D9503F"/>
    <text class="b" x="888" y="304" text-anchor="middle">HTML 476,665 B</text>
    <text class="val" x="857" y="368" text-anchor="end" fill="#D9503F">16,629 B</text>
    <text class="val" x="1082" y="337" text-anchor="end" fill="#D9503F">省 96.5%</text>

    <rect x="176" y="386" width="884" height="76" fill="#E8B84B" opacity="0.10"/>
    <text class="rl" x="160" y="430" text-anchor="end">语义化 HTML 页</text>
    <line x1="465" y1="424" x2="396" y2="424" stroke="#8FA79B" stroke-width="2.5"/>
    <circle cx="465" cy="424" r="9" fill="none" stroke="#2F4F45" stroke-width="3"/>
    <circle cx="396" cy="424" r="9" fill="#B9892F"/>
    <text class="b" x="465" y="398" text-anchor="middle">HTML 基线 100%</text>
    <text class="val" x="380" y="462" text-anchor="end" fill="#B9892F">仅省 5%-20%</text>
    <text x="1082" y="431" text-anchor="end" fill="#8A8578" font-size="13">干净页面不戏剧化（HN 评论实测）</text>
  </g>

  <!-- supply side strip -->
  <line x1="64" y1="500" x2="1136" y2="500" stroke="#E5E1D4" stroke-width="1"/>
  <g>
    <text x="64" y="542" font-size="26" font-weight="700" fill="#2F4F45">7 款</text>
    <text x="64" y="564" font-size="12.5" fill="#8A8578">编码 Agent 已发该头部</text>
    <text x="248" y="542" font-size="26" font-weight="700" fill="#2F4F45">3 家</text>
    <text x="248" y="564" font-size="12.5" fill="#8A8578">头部托管平台默认供料</text>
    <text x="470" y="542" font-size="26" font-weight="700" fill="#D9503F">0 家</text>
    <text x="470" y="564" font-size="12.5" fill="#8A8578">消费级大产品支持</text>
    <text x="690" y="542" font-size="26" font-weight="700" fill="#B9892F">1 处</text>
    <text x="690" y="564" font-size="12.5" fill="#8A8578">Codex CLI 走 Link 头发现</text>
    <path d="M 1042 520 h 58 l -8 34 a 24 12 0 0 1 -42 0 z" fill="url(#gPot)" opacity="0.85"/>
    <rect x="1036" y="514" width="70" height="7" rx="3.5" fill="#2F4F45" opacity="0.85"/>
  </g>

  <text x="64" y="630" font-size="12.5" fill="#A29C88">字节数为 2026-09-07 本机 curl 实测；Agent 矩阵来自发起方 acceptmarkdown.com（利益相关）；消费端支持状态截至当日。</text>
</svg>
