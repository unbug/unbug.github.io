<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">精化大模型把 Ghidra 构建率从 75% 提到 90%，行为匹配率却从 74% 降到 62%；通过全部随附测试的产物仍有 4.9% 与原程序行为分歧</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">Ghidra 与精化大模型的两项指标（%）</text>

  <!-- gridline at 50, y = 360 - 2.8*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="140" y1="220" x2="560" y2="220"/>
  </g>
  <!-- group 1: build rate 75 -> 90 -->
  <rect x="190" y="150" width="60" height="210" fill="#999999"/>
  <text x="220" y="142" font-size="12" fill="#555" text-anchor="middle">75</text>
  <rect x="270" y="108" width="60" height="252" fill="#0072B2"/>
  <text x="300" y="100" font-size="12" fill="#555" text-anchor="middle">90</text>
  <text x="260" y="378" font-size="12.5" fill="#1A1B1E" text-anchor="middle">可重编译性（构建率）</text>
  <text x="260" y="396" font-size="12" fill="#0072B2" text-anchor="middle">Δ=+15 个百分点</text>
  <!-- group 2: behavior match 74 -> 62 -->
  <rect x="400" y="152.8" width="60" height="207.2" fill="#999999"/>
  <text x="430" y="145" font-size="12" fill="#555" text-anchor="middle">74</text>
  <rect x="480" y="186.4" width="60" height="173.6" fill="#D55E00"/>
  <text x="510" y="178" font-size="12" fill="#555" text-anchor="middle">62</text>
  <text x="470" y="378" font-size="12.5" fill="#1A1B1E" text-anchor="middle">行为匹配率</text>
  <text x="470" y="396" font-size="12" fill="#D55E00" text-anchor="middle">Δ=-12 个百分点</text>

  <!-- value axis -->
  <line x1="140" y1="360" x2="560" y2="360" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="140" y1="360" x2="136" y2="360"/>
    <line x1="140" y1="220" x2="136" y2="220"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="130" y="364">0</text>
    <text x="130" y="224">50</text>
  </g>
  
  <text x="110" y="410" font-size="14" fill="#1A1B1E">比率（%）</text>
  <text x="60" y="432" font-size="12" fill="#555">评测样本：300 个真实 GitHub 库函数与 287 个 CVE 关联函数；</text>
  <text x="60" y="450" font-size="12" fill="#555">灰色柱为 Ghidra 基线，彩色柱为叠加精化大模型后</text>

  <!-- ============ panel b ============ -->
  <text x="660" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="682" y="104" font-size="15" fill="#1A1B1E">通过全部随附测试后仍与原程序行为分歧的比例（%）</text>

  <!-- gridline at 5, y = 290 - 14*v -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="740" y1="220" x2="1120" y2="220"/>
  </g>
  <!-- overall 4.9 : y=290-68.6=221.4 -->
  <rect x="790" y="221.4" width="80" height="68.6" fill="#0072B2"/>
  <text x="830" y="214" font-size="12" fill="#555" text-anchor="middle">4.9</text>
  <text x="830" y="308" font-size="12.5" fill="#1A1B1E" text-anchor="middle">全体（8 系统 × 9 配置）</text>
  <!-- max single 13 : y=108 -->
  <rect x="960" y="108" width="80" height="182" fill="#D55E00"/>
  <text x="1000" y="100" font-size="12" fill="#555" text-anchor="middle">13</text>
  <text x="1000" y="308" font-size="12.5" fill="#1A1B1E" text-anchor="middle">单一系统最高</text>

  <!-- value axis -->
  <line x1="740" y1="290" x2="1120" y2="290" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="740" y1="290" x2="736" y2="290"/>
    <line x1="740" y1="220" x2="736" y2="220"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="end">
    <text x="730" y="294">0</text>
    <text x="730" y="224">5</text>
  </g>
  
  <text x="676" y="344" font-size="14" fill="#1A1B1E">行为分歧率（%）</text>
  <text x="660" y="368" font-size="12" fill="#555">oracle：合成调用 driver + 扩充模糊测试语料，</text>
  <text x="660" y="386" font-size="12" fill="#555">相同输入上比对行为是否改变</text>

  <!-- footnote -->
  <text x="60" y="560" font-size="11" fill="#767676">数据：arXiv:2609.05370（2026-09-08 查阅，论文自测口径）· 分歧率为给定模糊测试输入集合上的下界观察，非穷尽证明 · 已披露漏洞子集上最高约十分之一出现崩溃缺失 · 预印本未经同行评审</text>
</svg>
