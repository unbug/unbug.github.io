<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">四件说话人分离专利中三件属 Google；技术走向为流式缓存与大模型后处理纠错</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">四件说话人分离专利按公开先后序位排列（事件序位轴）</text>

  <!-- panel guides (horizontal, 0.5pt) -->

  <!-- x = 300 + monthsSince202507 * 50 -->
  <!-- row 1: Google US20250225998A1, 2025-07-10, 大模型后处理修正标签 -->
  <text x="288" y="148" font-size="12.5" fill="#1A1B1E" text-anchor="end">Google</text>
  <circle cx="315" cy="144" r="7" fill="#0072B2"/>
  <text x="330" y="148" font-size="12" fill="#555">2025-07-10 公开 · 大模型后处理修正标签（US20250225998A1）</text>

  <!-- row 2: Google US20250335711A1, 2025-10-30, 分块自注册提示多模态大模型 -->
  <text x="288" y="193" font-size="12.5" fill="#1A1B1E" text-anchor="end">Google</text>
  <circle cx="500" cy="189" r="7" fill="#0072B2"/>
  <text x="515" y="193" font-size="12" fill="#555">2025-10-30 公开 · 分块自注册提示多模态大模型（US20250335711A1）</text>

  <!-- row 3: Google US20260045268A1, 2026-02-12, 无监督瓶颈模块 -->
  <text x="288" y="238" font-size="12.5" fill="#1A1B1E" text-anchor="end">Google</text>
  <circle cx="685" cy="234" r="7" fill="#0072B2"/>
  <text x="700" y="238" font-size="12" fill="#555">2026-02-12 公开 · 无监督潜在说话人瓶颈（US20260045268A1）</text>

  <!-- row 4: NVIDIA US20260245574A1, 2026-08-20 (submitted 2026-02-18), 流式缓存 -->
  <text x="288" y="283" font-size="12.5" fill="#1A1B1E" text-anchor="end">NVIDIA</text>
  <circle cx="960" cy="279" r="7" fill="#D55E00"/>
  <line x1="685" y1="279" x2="960" y2="279" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="685" cy="279" r="5" fill="none" stroke="#999999" stroke-width="1.5"/>
  <text x="693" y="311" font-size="12" fill="#555">2026-02-18 提交</text>
  <text x="975" y="275" font-size="12" fill="#555">2026-08-20 公开 · 流式缓存已出场</text>
  <text x="975" y="291" font-size="12" fill="#555">说话人（US20260245574A1）</text>

  <!-- order axis -->
  <line x1="300" y1="205" x2="300" y2="355" stroke="#1A1B1E" stroke-width="0.75"/>
  <line x1="300" y1="355" x2="1000" y2="355" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="315" y1="355" x2="315" y2="359"/>
    <line x1="500" y1="355" x2="500" y2="359"/>
    <line x1="685" y1="355" x2="685" y2="359"/>
    <line x1="960" y1="355" x2="960" y2="359"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="315" y="375">1</text>
    <text x="500" y="375">2</text>
    <text x="685" y="375">3</text>
    <text x="960" y="375">4</text>
  </g>
  <text x="630" y="399" font-size="14" fill="#1A1B1E" text-anchor="middle">公开先后序位</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="448" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="448" font-size="15" fill="#1A1B1E">独立开发者方案的两项投入（自估口径）</text>

  <!-- item 1: GPU 月成本 -->
  <text x="60" y="490" font-size="12.5" fill="#1A1B1E">GPU 租用月成本（元/月）</text>
  <rect x="60" y="500" width="90" height="16" fill="#009E73"/>
  <text x="158" y="513" font-size="12" fill="#555">数百元</text>

  <!-- item 2: MVP 工期 -->
  <text x="620" y="490" font-size="12.5" fill="#1A1B1E">1 人做出 MVP（周）</text>
  <line x1="620" y1="524" x2="940" y2="524" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="620" y1="524" x2="620" y2="528"/>
    <line x1="700" y1="524" x2="700" y2="528"/>
    <line x1="780" y1="524" x2="780" y2="528"/>
    <line x1="860" y1="524" x2="860" y2="528"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="620" y="544">0</text>
    <text x="700" y="544">1</text>
    <text x="780" y="544">2</text>
    <text x="860" y="544">3</text>
  </g>
  <line x1="940" y1="508" x2="940" y2="524" stroke="#D55E00" stroke-width="2"/>
  <text x="940" y="500" font-size="12" fill="#555" text-anchor="middle">4</text>
  <text x="620" y="578" font-size="12" fill="#555">技术栈全开源（pyannote-audio + Whisper 质检插件）</text>

  <!-- footnote -->
  <text x="60" y="640" font-size="11" fill="#767676">数据：四件专利公开信息（公开不等于授权，正文所引 Free Patents Online 检索）· 成本与工期为作者自估口径 · 空心圈与虚线为提交到公开的过程位（论文自述提交日 2026-02-18）</text>
</svg>
