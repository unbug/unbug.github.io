<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion line -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">示例工作流（8 步工具调用、总预算 16K）中，动态预算分配把整体成功率从约 45% 提升到约 67%，token 使用效率提升约 35%</text>

  <!-- ============ panel a ============ -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">步骤级 token 配额（千 tokens）</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="610" y1="128" x2="610" y2="300"/>
    <line x1="860" y1="128" x2="860" y2="300"/>
  </g>
  <!-- horizontal axis: x = 360 + 50*v -->
  <line x1="360" y1="300" x2="910" y2="300" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="360" y1="300" x2="360" y2="304"/>
    <line x1="610" y1="300" x2="610" y2="304"/>
    <line x1="860" y1="300" x2="860" y2="304"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="360" y="322">0</text>
    <text x="610" y="322">5</text>
    <text x="860" y="322">10</text>
  </g>
  <text x="635" y="344" font-size="14" fill="#1A1B1E" text-anchor="middle">每步 token 配额（千 tokens）</text>

  <text x="348" y="158" font-size="12.5" fill="#1A1B1E" text-anchor="end">均匀分配</text>
  <rect x="360" y="148" width="100" height="14" fill="#999999"/>
  <text x="470" y="159" font-size="12" fill="#555">每步一律 2K</text>

  <text x="348" y="202" font-size="12.5" fill="#1A1B1E" text-anchor="end">动态 · 简单 3 步</text>
  <rect x="360" y="192" width="25" height="14" fill="#0072B2"/>
  <text x="393" y="203" font-size="12" fill="#555">每步 500</text>

  <text x="348" y="242" font-size="12.5" fill="#1A1B1E" text-anchor="end">动态 · 中等 2 步</text>
  <rect x="360" y="232" width="100" height="14" fill="#0072B2"/>
  <text x="470" y="243" font-size="12" fill="#555">每步 2K</text>

  <text x="348" y="282" font-size="12.5" fill="#1A1B1E" text-anchor="end">动态 · 困难 3 步</text>
  <rect x="360" y="272" width="300" height="14" fill="#D55E00"/>
  <text x="670" y="283" font-size="12" fill="#555">每步 6K（受总预算约束动态调整）</text>

  <!-- ============ panel b ============ -->
  <text x="60" y="408" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="82" y="408" font-size="15" fill="#1A1B1E">整体成功率（%，示例工作流）</text>

  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="610" y1="432" x2="610" y2="600"/>
    <line x1="860" y1="432" x2="860" y2="600"/>
  </g>
  <!-- horizontal axis: x = 360 + 10*v -->
  <line x1="360" y1="600" x2="1035" y2="600" stroke="#1A1B1E" stroke-width="0.75"/>
  <g stroke="#1A1B1E" stroke-width="0.75">
    <line x1="360" y1="600" x2="360" y2="604"/>
    <line x1="610" y1="600" x2="610" y2="604"/>
    <line x1="860" y1="600" x2="860" y2="604"/>
  </g>
  <g font-size="12.5" fill="#1A1B1E" text-anchor="middle">
    <text x="360" y="622">0</text>
    <text x="610" y="622">25</text>
    <text x="860" y="622">50</text>
  </g>
  <text x="697" y="644" font-size="14" fill="#1A1B1E" text-anchor="middle">整体成功率（%）</text>

  <text x="348" y="462" font-size="12.5" fill="#1A1B1E" text-anchor="end">均匀分配</text>
  <rect x="360" y="452" width="450" height="16" fill="#999999"/>
  <text x="820" y="464" font-size="12" fill="#555">约 45%</text>

  <text x="348" y="522" font-size="12.5" fill="#1A1B1E" text-anchor="end">动态预算分配</text>
  <rect x="360" y="512" width="670" height="16" fill="#D55E00"/>
  <text x="1040" y="524" font-size="12" fill="#555">约 67%</text>
  <text x="360" y="568" font-size="12" fill="#555">Δ=+22 个百分点 · token 使用效率提升约 35%</text>

  <!-- footnote -->
  <text x="60" y="662" font-size="11" fill="#767676">数据：基于 arXiv:2607.28573 实证研究与行业基准测试的综合推断示例（正文声明：实际效果取决于具体任务分布和预算分配策略实现质量）· 自估口径，非论文实测</text>
</svg>
