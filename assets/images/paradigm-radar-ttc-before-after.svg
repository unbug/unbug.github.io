<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2d3561;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Before vs After: 动态预算分配效果</text>

  <!-- Before section (left) -->
  <rect x="30" y="70" width="350" height="280" rx="10" fill="#1e2a4a" stroke="#ff6b60" stroke-width="1"/>
  <text x="205" y="105" text-anchor="middle" fill="#ff6b60" font-size="16" font-weight="bold">传统均匀分配</text>

  <!-- Token distribution bars -->
  <text x="50" y="140" fill="#a0b4d0" font-size="12">Step 1 (简单):</text>
  <rect x="160" y="130" width="180" height="20" rx="3" fill="#ff6b60"/>
  <text x="345" y="144" fill="#ffffff" font-size="11">2K tokens (浪费)</text>

  <text x="50" y="175" fill="#a0b4d0" font-size="12">Step 2 (困难):</text>
  <rect x="160" y="165" width="80" height="20" rx="3" fill="#ff9f0a"/>
  <text x="245" y="179" fill="#ffffff" font-size="11">2K tokens (不足)</text>

  <text x="50" y="210" fill="#a0b4d0" font-size="12">Step 3 (中等):</text>
  <rect x="160" y="200" width="130" height="20" rx="3" fill="#ff9f0a"/>
  <text x="295" y="214" fill="#ffffff" font-size="11">2K tokens (刚好)</text>

  <text x="50" y="245" fill="#a0b4d0" font-size="12">Step 4 (简单):</text>
  <rect x="160" y="235" width="180" height="20" rx="3" fill="#ff6b60"/>
  <text x="345" y="249" fill="#ffffff" font-size="11">2K tokens (浪费)</text>

  <!-- Summary -->
  <rect x="50" y="270" width="310" height="60" rx="6" fill="#2a3560"/>
  <text x="205" y="295" text-anchor="middle" fill="#ff6b60" font-size="14">总消耗: 8K tokens</text>
  <text x="205" y="318" text-anchor="middle" fill="#ffffff" font-size="13">成功率: ~45%</text>

  <!-- After section (right) -->
  <rect x="420" y="70" width="350" height="280" rx="10" fill="#1e2a4a" stroke="#5ee68a" stroke-width="1"/>
  <text x="595" y="105" text-anchor="middle" fill="#5ee68a" font-size="16" font-weight="bold">动态预算分配</text>

  <!-- Token distribution bars -->
  <text x="440" y="140" fill="#a0b4d0" font-size="12">Step 1 (简单):</text>
  <rect x="550" y="130" width="45" height="20" rx="3" fill="#34c759"/>
  <text x="600" y="144" fill="#ffffff" font-size="11">500 tokens</text>

  <text x="440" y="175" fill="#a0b4d0" font-size="12">Step 2 (困难):</text>
  <rect x="550" y="165" width="180" height="20" rx="3" fill="#ff9f0a"/>
  <text x="735" y="179" fill="#ffffff" font-size="11">4K tokens (充足)</text>

  <text x="440" y="210" fill="#a0b4d0" font-size="12">Step 3 (中等):</text>
  <rect x="550" y="200" width="90" height="20" rx="3" fill="#4a90d9"/>
  <text x="645" y="214" fill="#ffffff" font-size="11">2K tokens</text>

  <text x="440" y="245" fill="#a0b4d0" font-size="12">Step 4 (简单):</text>
  <rect x="550" y="235" width="68" height="20" rx="3" fill="#34c759"/>
  <text x="623" y="249" fill="#ffffff" font-size="11">1K tokens</text>

  <!-- Summary -->
  <rect x="440" y="270" width="310" height="60" rx="6" fill="#2a3560"/>
  <text x="595" y="295" text-anchor="middle" fill="#5ee68a" font-size="14">总消耗: ~7.5K tokens</text>
  <text x="595" y="318" text-anchor="middle" fill="#ffffff" font-size="13">成功率: ~67% (+22pp)</text>

  <!-- Improvement arrow -->
  <g transform="translate(400, 210)">
    <polygon points="-15,-25 15,0 -15,25" fill="#ff9f0a"/>
    <line x1="-60" y1="0" x2="-15" y2="0" stroke="#ff9f0a" stroke-width="2"/>
    <line x1="15" y1="0" x2="60" y2="0" stroke="#ff9f0a" stroke-width="2"/>
  </g>

  <!-- Source -->
  <text x="400" y="380" text-anchor="middle" fill="#a0b4d0" font-size="10">数据基于 arXiv:2607.28573 + 行业基准测试综合推断</text>
</svg>
