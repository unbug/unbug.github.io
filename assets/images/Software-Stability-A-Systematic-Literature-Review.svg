<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC',sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- conclusion -->
  <text x="60" y="58" font-size="16" fill="#1A1B1E">稳定性定义为抵抗涟漪效应的能力；四类度量——CDI、CCI、设计波动性、决策波动性——均关注变化的发生与传播</text>

  <!-- ===== panel a: four metric families ===== -->
  <text x="60" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">a</text>
  <text x="82" y="104" font-size="15" fill="#1A1B1E">四类稳定性度量指标（个）</text>

  <!-- horizontal bars x=250+90*v, one metric per family; counts labeled in Chinese -->
  <g stroke="#D9D9D9" stroke-width="0.5">
    <line x1="340" y1="130" x2="340" y2="330"/>
  </g>
  <g>
    <text x="238" y="152" font-size="12.5" fill="#1A1B1E" text-anchor="end">核心设计不稳定性 CDI</text>
    <rect x="250" y="138" width="90" height="18" fill="#0072B2"/>
    <text x="348" y="152" font-size="12" fill="#555">衡量设计层面的不稳定程度</text>

    <text x="238" y="202" font-size="12.5" fill="#1A1B1E" text-anchor="end">核心调用不稳定性 CCI</text>
    <rect x="250" y="188" width="90" height="18" fill="#0072B2"/>
    <text x="348" y="202" font-size="12" fill="#555">衡量模块调用关系的不稳定程度</text>

    <text x="238" y="252" font-size="12.5" fill="#1A1B1E" text-anchor="end">设计波动性</text>
    <rect x="250" y="238" width="90" height="18" fill="#0072B2"/>
    <text x="348" y="252" font-size="12" fill="#555">衡量设计变化的频率和幅度</text>

    <text x="238" y="302" font-size="12.5" fill="#1A1B1E" text-anchor="end">决策波动性</text>
    <rect x="250" y="288" width="90" height="18" fill="#0072B2"/>
    <text x="348" y="302" font-size="12" fill="#555">衡量技术决策的变化情况</text>
  </g>
  <line x1="250" y1="330" x2="340" y2="330" stroke="#1A1B1E" stroke-width="0.75"/>
  <text x="295" y="354" font-size="14" fill="#1A1B1E" text-anchor="middle">四类指标，每类一项</text>

  <!-- ===== panel b: definition + value positions ===== -->
  <text x="620" y="104" font-size="15" font-weight="bold" fill="#1A1B1E">b</text>
  <text x="642" y="104" font-size="15" fill="#1A1B1E">操作性定义与三个工程位置</text>

  <!-- definition box -->
  <rect x="620" y="124" width="520" height="56" fill="none" stroke="#1A1B1E" stroke-width="0.75"/>
  <text x="640" y="148" font-size="12.5" fill="#1A1B1E">软件稳定性 = 抵抗「涟漪效应」的能力：修改一个功能波及其他模块、</text>
  <text x="640" y="168" font-size="12.5" fill="#1A1B1E">修复一个 bug 引入新 bug 的连锁扩散现象</text>

  <!-- connector -->
  <line x1="880" y1="180" x2="880" y2="204" stroke="#999999" stroke-width="0.75"/>

  <!-- three positions (sequential list, no numeric axis needed; labeled as enumerated positions) -->
  <text x="620" y="228" font-size="12.5" fill="#555">工程价值的三个位置（综述归纳，顺序即实践路径）：</text>
  <circle cx="632" cy="252" r="4" fill="#0072B2"/>
  <text x="646" y="256" font-size="12.5" fill="#1A1B1E">维护阶段的指南针：评估设计好坏、做技术决策的参考</text>
  <circle cx="632" cy="284" r="4" fill="#0072B2"/>
  <text x="646" y="288" font-size="12.5" fill="#1A1B1E">架构设计的考量：现有研究集中在架构设计阶段</text>
  <circle cx="632" cy="316" r="4" fill="#0072B2"/>
  <text x="646" y="320" font-size="12.5" fill="#1A1B1E">质量属性的纽带：与可维护性、可靠性密切相关</text>

  <!-- note: metrics share common focus -->
  <text x="620" y="360" font-size="12" fill="#555">四类指标共同关注「变化如何发生、传播到哪里」，而非代码本身对错；</text>
  <text x="620" y="378" font-size="12" fill="#555">先用 CDI、CCI 度量不稳定集中在哪里，再决定解耦、分层等重构手段</text>

  <!-- ===== panel c: scope of review ===== -->
  <text x="60" y="432" font-size="15" font-weight="bold" fill="#1A1B1E">c</text>
  <text x="82" y="432" font-size="15" fill="#1A1B1E">综述定位与已知局限</text>
  <text x="60" y="462" font-size="12.5" fill="#1A1B1E">CONISOFT 2018（IEEE，页码 109-115）· 墨西哥韦拉克鲁斯大学团队 · 系统性文献综述</text>
  <g stroke="#999999" stroke-width="0.75">
    <line x1="60" y1="474" x2="1140" y2="474"/>
  </g>
  <g font-size="12" fill="#555">
    <text x="60" y="496">局限：发表于 2018 年，未覆盖微服务、云原生等近年架构范式；度量工具更新需自行补充。</text>
    <text x="60" y="514">价值：把零散研究串成体系；指出研究空白与未来方向；为领域新人提供入门参考。</text>
  </g>

  <!-- footnote -->
  <text x="60" y="600" font-size="11" fill="#767676">数据：DOI 10.1109/CONISOFT.2018.8645866 · 定义与指标分类为论文自述口径 · 面板 a 为类别枚举（每类 1 项指标），不含量化统计</text>
</svg>