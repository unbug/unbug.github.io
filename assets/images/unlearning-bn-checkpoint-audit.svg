<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Helvetica Neue',Helvetica,'Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .serif { font-family: 'Noto Serif SC','Songti SC','STSong',serif; }
      .k { font-size: 12.5px; letter-spacing: 2.5px; fill: #9A927E; }
      .rl { font-size: 15px; fill: #4A4B44; }
      .val { font-size: 17px; font-weight: 700; }
      .b { font-size: 12px; fill: #A39B85; }
      .chip { font-size: 11.5px; font-weight: 700; fill: #FFFFFF; letter-spacing: 2px; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F7F4EC"/>
    </linearGradient>
    <linearGradient id="gWine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A63A50"/><stop offset="1" stop-color="#D06A80"/>
    </linearGradient>
    <linearGradient id="gBrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8F6E2A"/><stop offset="1" stop-color="#B08D3E"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E5C8A"/><stop offset="1" stop-color="#5E8CBA"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1120" cy="100" r="130" fill="#2E5C8A" opacity="0.05"/>
  <circle cx="90" cy="630" r="120" fill="#B08D3E" opacity="0.07"/>
  <rect x="64" y="44" width="46" height="5" rx="2.5" fill="url(#gBrass)"/>

  <text class="k" x="64" y="84">一分钟读论文 · 2026-09-14 · ARXIV:2609.11490</text>
  <text class="serif" x="64" y="128" font-size="40" font-weight="700" fill="#1F211C">数字是校准拧出来的</text>
  <text x="64" y="158" font-size="15" fill="#6B675A">权重逐比特不变，只重拟合批归一化统计量，指标就动了</text>

  <!-- watchmaker motif: caliber plate + lock -->
  <g>
    <circle cx="1062" cy="118" r="62" fill="none" stroke="url(#gBrass)" stroke-width="7"/>
    <circle cx="1062" cy="118" r="50" fill="none" stroke="#D8CFAE" stroke-width="2"/>
    <circle cx="1062" cy="118" r="5" fill="#8C97A3"/>
    <line x1="1062" y1="118" x2="1062" y2="76" stroke="#2E5C8A" stroke-width="4" stroke-linecap="round"/>
    <line x1="1062" y1="118" x2="1092" y2="130" stroke="#A63A50" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="1062" cy="56" r="7" fill="none" stroke="#B08D3E" stroke-width="3.5"/>
    <g stroke="#B08D3E" stroke-width="3">
      <line x1="1000" y1="118" x2="1008" y2="118"/><line x1="1116" y1="118" x2="1124" y2="118"/>
      <line x1="1062" y1="174" x2="1062" y2="182"/><line x1="1018" y1="74" x2="1024" y2="80"/>
      <line x1="1100" y1="74" x2="1106" y2="80"/><line x1="1018" y1="162" x2="1024" y2="156"/>
      <line x1="1100" y1="162" x2="1106" y2="156"/>
    </g>
    <circle cx="1132" cy="162" r="6" fill="#7FB5B5"/>
  </g>

  <!-- slope: left slate = frozen weights, right wine = published numbers -->
  <rect x="240" y="248" width="700" height="44" rx="10" fill="#2E5C8A" opacity="0.07"/>
  <rect x="240" y="316" width="700" height="44" rx="10" fill="#A63A50" opacity="0.07"/>
  <rect x="240" y="384" width="700" height="44" rx="10" fill="#7FB5B5" opacity="0.10"/>
  <text class="b" x="360" y="232" text-anchor="middle" fill="#7A7462">权重</text>
  <text class="b" x="840" y="232" text-anchor="middle" fill="#7A7462">发布数字</text>

  <text class="rl" x="330" y="276" text-anchor="end">bit-identical</text>
  <line x1="360" y1="270" x2="840" y2="270" stroke="#D8CFAE" stroke-width="2"/>
  <circle cx="360" cy="270" r="9" fill="url(#gBlue)"/>
  <circle cx="840" cy="270" r="9" fill="#7FB5B5"/>
  <text class="val" x="860" y="276" fill="#4E8080">锁死不动</text>

  <text class="rl" x="330" y="344" text-anchor="end">重拟合 BN 统计量</text>
  <line x1="360" y1="338" x2="840" y2="338" stroke="url(#gWine)" stroke-width="2.5"/>
  <circle cx="360" cy="338" r="9" fill="url(#gBlue)"/>
  <circle cx="840" cy="338" r="9" fill="url(#gWine)"/>
  <text class="val" x="860" y="344" fill="#A63A50">47 of 221 越过种子散布</text>

  <text class="rl" x="330" y="412" text-anchor="end">归属对调实验</text>
  <line x1="360" y1="406" x2="840" y2="406" stroke="#BDB69F" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="360" cy="406" r="9" fill="#8C97A3"/>
  <circle cx="840" cy="406" r="9" fill="#7FB5B5"/>
  <text class="val" x="860" y="412" fill="#4E8080">几乎不动 · 幸存假设排除</text>

  <!-- verdict funnel -->
  <g>
    <text class="b" x="64" y="486" fill="#9A927E" letter-spacing="2">合规判定翻转的规模</text>
    <rect x="64" y="502" width="420" height="34" rx="8" fill="url(#gWine)" opacity="0.9"/>
    <text x="84" y="525" font-size="15" font-weight="700" fill="#FFFFFF">12 个 verdict 翻转</text>
    <rect x="64" y="544" width="240" height="34" rx="8" fill="url(#gBrass)"/>
    <text x="84" y="567" font-size="15" font-weight="700" fill="#FFFFFF">4 个超出重校准预算</text>
    <rect x="64" y="586" width="132" height="34" rx="8" fill="url(#gBlue)"/>
    <text x="84" y="609" font-size="15" font-weight="700" fill="#FFFFFF">2 个全重复稳定</text>
    <text class="b" x="510" y="524">占已发布判定的实际影响，逐层收窄</text>
    <text class="b" x="328" y="567">作者自设判据群体上：0 个翻转</text>
  </g>

  <g>
    <rect x="806" y="498" width="330" height="122" rx="14" fill="#B08D3E" opacity="0.09"/>
    <rect x="806" y="498" width="330" height="6" rx="3" fill="url(#gBrass)"/>
    <text class="serif" x="830" y="548" font-size="26" font-weight="700" fill="#1F211C">263 <tspan font-size="14" fill="#6B675A">个已发布 checkpoint</tspan></text>
    <text class="b" x="830" y="578">机制限于带批归一化的视觉模型</text>
    <text class="b" x="830" y="598">未做同行评审 · 摘要自述口径</text>
  </g>

  <line x1="64" y1="636" x2="1136" y2="636" stroke="#E7E0CB"/>
  <text class="b" x="64" y="662">无人记录的拟合自由度，非作弊指控 · 不能外推到语言模型遗忘评测 · Micropaper</text>
</svg>
